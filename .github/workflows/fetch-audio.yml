name: Fetch HSK audio
on:
  push:
    paths:
      - audio-manifest.json
      - .github/workflows/fetch-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated audio
        run: |
          mkdir -p audio
          python3 - <<'PY'
          import json, pathlib, urllib.request
          manifest = json.loads(pathlib.Path("audio-manifest.json").read_text(encoding="utf-8"))
          for item in manifest["files"]:
              target = pathlib.Path(item["path"])
              target.parent.mkdir(parents=True, exist_ok=True)
              print(f"Downloading {target}")
              urllib.request.urlretrieve(item["url"], target)
          PY

      - name: Join the full 1-300 track
        run: |
          python3 - <<'PY'
          import pathlib, wave
          sources = [
              pathlib.Path("audio/all-001-100.wav"),
              pathlib.Path("audio/all-101-200.wav"),
              pathlib.Path("audio/all-201-300.wav"),
          ]
          with wave.open(str(sources[0]), "rb") as first:
              params = first.getparams()
              frames = [first.readframes(first.getnframes())]
          for source in sources[1:]:
              with wave.open(str(source), "rb") as current:
                  current_params = current.getparams()
                  assert current_params[:4] == params[:4], (source, current_params, params)
                  frames.append(current.readframes(current.getnframes()))
          with wave.open("audio/all-001-300.wav", "wb") as output:
              output.setparams(params)
              for block in frames:
                  output.writeframes(block)
          PY

      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Add HSK 1 audio tracks"
          git push
