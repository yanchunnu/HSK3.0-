i jiālǐ dúshū.","translation":"방학 때 그는 집에 머물며 책 읽는 것을 좋아해요."},{"no":729,"category":"동작·감각·생각","word":"保护","pinyin":"bǎohù","meaning":"보호하다","example":"为了保护眼睛，他每隔一会儿就休息一下。","examplePinyin":"Wèile bǎohù yǎnjing, tā měigé yíhuìr jiù xiūxi yíxià.","translation":"눈을 보호하려고 그는 일정한 간격으로 잠깐씩 쉬어요."},{"no":730,"category":"동작·감각·생각","word":"感","pinyin":"gǎn","meaning":"느끼다","example":"听了大家的意见，我深感自己的经验不足。","examplePinyin":"Tīng le dàjiā de yìjiàn, wǒ shēngǎn zìjǐ de jīngyàn bùzú.","translation":"모두의 의견을 듣고 제 경험이 부족하다는 것을 깊이 느꼈어요."},{"no":731,"category":"동작·감각·생각","word":"感觉","pinyin":"gǎnjué","meaning":"느끼다, 느낌","example":"第一次上台时，我感觉自己的心跳特别快。","examplePinyin":"Dìyīcì shàngtái shí, wǒ gǎnjué zìjǐ de xīntiào tèbié kuài.","translation":"처음 무대에 올랐을 때 심장이 유난히 빨리 뛰는 것을 느꼈어요."},{"no":732,"category":"동작·감각·생각","word":"感受","pinyin":"gǎnshòu","meaning":"느끼다, 느낌","example":"亲自做过以后，我才真正感受到工作的辛苦。","examplePinyin":"Qīnzì zuò guo yǐhòu, wǒ cái zhēnzhèng gǎnshòu dào gōngzuò de xīnkǔ.","translation":"직접 해 본 뒤에야 일의 고됨을 진정으로 느꼈어요."},{"no":733,"category":"동작·감각·생각","word":"闻","pinyin":"wén","meaning":"냄새를 맡다","example":"一进厨房，我就闻到了面包的香味。","examplePinyin":"Yí jìn chúfáng, wǒ jiù wéndào le miànbāo de xiāngwèi.","translation":"부엌에 들어가자마자 빵의 고소한 냄새를 맡았어요."},{"no":734,"category":"동작·감각·생각","word":"吸引","pinyin":"xīyǐn","meaning":"끌어당기다, 매료시키다","example":"这本书的封面很特别，一下就吸引了我。","examplePinyin":"Zhè běn shū de fēngmiàn hěn tèbié, yíxià jiù xīyǐn le wǒ.","translation":"이 책의 표지는 특별해서 단번에 제 관심을 끌었어요."},{"no":735,"category":"동작·감각·생각","word":"猜","pinyin":"cāi","meaning":"추측하다, 맞히다","example":"你猜他为什么没来？其实他去了别的教室。","examplePinyin":"Nǐ cāi tā wèishénme méi lái? Qíshí tā qù le biéde jiàoshì.","translation":"그가 왜 안 왔는지 맞혀 봐요. 사실은 다른 교실에 갔어요."},{"no":736,"category":"동작·감각·생각","word":"怀疑","pinyin":"huáiyí","meaning":"의심하다","example":"听到不同的说法后，我开始怀疑消息的真假。","examplePinyin":"Tīngdào bùtóng de shuōfǎ hòu, wǒ kāishǐ huáiyí xiāoxi de zhēnjiǎ.","translation":"서로 다른 이야기를 듣고 나서 소식이 사실인지 의심하기 시작했어요."},{"no":737,"category":"동작·감각·생각","word":"查看","pinyin":"chákàn","meaning":"확인하다, 살펴보다","example":"出门前，他再次查看了火车出发的时间。","examplePinyin":"Chūmén qián, tā zàicì chákàn le huǒchē chūfā de shíjiān.","translation":"집을 나서기 전에 그는 기차 출발 시간을 다시 확인했어요."},{"no":738,"category":"동작·감각·생각","word":"查找","pinyin":"cházhǎo","meaning":"찾아보다, 검색하다","example":"遇到不懂的词，可以用手机查找。","examplePinyin":"Yùdào bù dǒng de cí, kěyǐ yòng shǒujī cházhǎo.","translation":"모르는 단어가 나오면 휴대전화로 찾아볼 수 있어요."},{"no":739,"category":"동작·감각·생각","word":"理解","pinyin":"lǐjiě","meaning":"이해하다","example":"听完他的解释，我终于理解了他的想法。","examplePinyin":"Tīng wán tā de jiěshì, wǒ zhōngyú lǐjiě le tā de xiǎngfǎ.","translation":"그의 설명을 다 듣고 마침내 그의 생각을 이해했어요."},{"no":740,"category":"동작·감각·생각","word":"熟悉","pinyin":"shúxī","meaning":"익숙하다, 잘 알다","example":"我对这里不熟悉，能请你带一下路吗？","examplePinyin":"Wǒ duì zhèlǐ bù shúxī, néng qǐng nǐ dài yíxià lù ma?","translation":"제가 이곳을 잘 모르는데 길을 안내해 주실 수 있나요?"},{"no":741,"category":"동작·감각·생각","word":"估计","pinyin":"gūjì","meaning":"추측하다, 예상하다","example":"按照目前的速度，我估计下午就能完成。","examplePinyin":"Ànzhào mùqián de sùdù, wǒ gūjì xiàwǔ jiù néng wánchéng.","translation":"현재 속도라면 오후에 마칠 수 있을 거라고 예상해요."},{"no":742,"category":"동작·감각·생각","word":"判断","pinyin":"pànduàn","meaning":"판단하다","example":"只看照片，很难判断这件衣服的质量。","examplePinyin":"Zhǐ kàn zhàopiàn, hěn nán pànduàn zhè jiàn yīfu de zhìliàng.","translation":"사진만 보고는 이 옷의 품질을 판단하기 어려워요."},{"no":743,"category":"동작·감각·생각","word":"考虑","pinyin":"kǎolǜ","meaning":"고려하다, 생각하다","example":"换工作以前，应该考虑清楚自己的目标。","examplePinyin":"Huàn gōngzuò yǐqián, yīnggāi kǎolǜ qīngchu zìjǐ de mùbiāo.","translation":"직장을 바꾸기 전에 자신의 목표를 충분히 생각해야 해요."},{"no":744,"category":"동작·감각·생각","word":"误会","pinyin":"wùhuì","meaning":"오해하다, 오해","example":"把事情说清楚以后，我们之间的误会消除了。","examplePinyin":"Bǎ shìqing shuō qīngchu yǐhòu, wǒmen zhījiān de wùhuì xiāochú le.","translation":"일을 분명히 설명한 뒤 우리 사이의 오해가 풀렸어요."},{"no":745,"category":"동작·감각·생각","word":"适应","pinyin":"shìyìng","meaning":"적응하다","example":"刚到国外时，他花了一段时间适应生活。","examplePinyin":"Gāng dào guówài shí, tā huā le yí duàn shíjiān shìyìng shēnghuó.","translation":"외국에 막 갔을 때 그는 생활에 적응하는 데 시간이 좀 걸렸어요."},{"no":746,"category":"동작·감각·생각","word":"安排","pinyin":"ānpái","meaning":"계획하다, 배치하다","example":"这几天的行程已经安排好，不方便再改。","examplePinyin":"Zhè jǐ tiān de xíngchéng yǐjīng ānpái hǎo, bù fāngbiàn zài gǎi.","translation":"며칠간의 일정은 이미 정해져 있어서 다시 바꾸기 어려워요."},{"no":747,"category":"동작·감각·생각","word":"计划","pinyin":"jìhuà","meaning":"계획, 계획하다","example":"旅行计划要留一些空余时间，别安排太满。","examplePinyin":"Lǚxíng jìhuà yào liú yìxiē kòngyú shíjiān, bié ānpái tài mǎn.","translation":"여행 계획에는 여유 시간을 좀 남겨 두고 너무 빽빽하게 잡지 마세요."},{"no":748,"category":"동작·감각·생각","word":"定","pinyin":"dìng","meaning":"정하다, 결정하다","example":"地点定下来以后，我会立即通知大家。","examplePinyin":"Dìdiǎn dìng xiàlai yǐhòu, wǒ huì lìjí tōngzhī dàjiā.","translation":"장소가 정해지면 모두에게 바로 알려 드릴게요."},{"no":749,"category":"동작·감각·생각","word":"目标","pinyin":"mùbiāo","meaning":"목표","example":"目标不必太大，但要努力一步步实现。","examplePinyin":"Mùbiāo búbì tài dà, dàn yào nǔlì yí bù bù shíxiàn.","translation":"목표가 꼭 클 필요는 없지만 한 걸음씩 실현하려고 노력해야 해요."},{"no":750,"category":"동작·감각·생각","word":"目的","pinyin":"mùdì","meaning":"목적","example":"我参加这门课的目的，是提高表达能力。","examplePinyin":"Wǒ cānjiā zhè mén kè de mùdì, shì tígāo biǎodá nénglì.","translation":"제가 이 수업에 참여하는 목적은 표현 능력을 높이는 거예요."},{"no":751,"category":"동작·감각·생각","word":"理想","pinyin":"lǐxiǎng","meaning":"이상, 꿈","example":"他的理想是成为一名医生，帮助更多的人。","examplePinyin":"Tā de lǐxiǎng shì chéngwéi yì míng yīshēng, bāngzhù gèng duō de rén.","translation":"그의 꿈은 의사가 되어 더 많은 사람을 돕는 거예요."},{"no":752,"category":"동작·감각·생각","word":"梦想","pinyin":"mèngxiǎng","meaning":"꿈, 이상","example":"为了实现梦想，她一直没有停止努力。","examplePinyin":"Wèile shíxiàn mèngxiǎng, tā yìzhí méiyǒu tíngzhǐ nǔlì.","translation":"꿈을 이루기 위해 그녀는 줄곧 노력을 멈추지 않았어요."},{"no":753,"category":"동작·감각·생각","word":"主意","pinyin":"zhǔyi","meaning":"생각, 아이디어","example":"这个主意不错，不过还要考虑一下费用。","examplePinyin":"Zhè ge zhǔyi búcuò, búguò hái yào kǎolǜ yíxià fèiyòng.","translation":"이 생각은 괜찮지만 비용도 좀 고려해야 해요."},{"no":754,"category":"동작·감각·생각","word":"想法","pinyin":"xiǎngfǎ","meaning":"생각, 아이디어","example":"如果你有不同的想法，欢迎提出来。","examplePinyin":"Rúguǒ nǐ yǒu bùtóng de xiǎngfǎ, huānyíng tíchū lai.","translation":"다른 생각이 있으면 편하게 말해 주세요."},{"no":755,"category":"동작·감각·생각","word":"看法","pinyin":"kànfǎ","meaning":"견해, 생각","example":"经过这次合作，我对他的看法改变了。","examplePinyin":"Jīngguò zhè cì hézuò, wǒ duì tā de kànfǎ gǎibiàn le.","translation":"이번 협업을 통해 그에 대한 제 생각이 달라졌어요."},{"no":756,"category":"동작·감각·생각","word":"意见","pinyin":"yìjiàn","meaning":"의견","example":"制定计划以前，我们先听听大家的意见。","examplePinyin":"Zhìdìng jìhuà yǐqián, wǒmen xiān tīngting dàjiā de yìjiàn.","translation":"계획을 세우기 전에 먼저 모두의 의견을 들어 봐요."},{"no":757,"category":"동작·감각·생각","word":"经历","pinyin":"jīnglì","meaning":"경험하다, 경험","example":"这段经历让我明白，合作比个人能力更重要。","examplePinyin":"Zhè duàn jīnglì ràng wǒ míngbai, hézuò bǐ gèrén nénglì gèng zhòngyào.","translation":"이번 경험으로 협력이 개인 능력보다 더 중요하다는 것을 알았어요."},{"no":758,"category":"동작·감각·생각","word":"经验","pinyin":"jīngyàn","meaning":"경험, 노하우","example":"他有丰富的工作经验，能给新人很多帮助。","examplePinyin":"Tā yǒu fēngfù de gōngzuò jīngyàn, néng gěi xīnrén hěn duō bāngzhù.","translation":"그는 업무 경험이 풍부해서 신입에게 많은 도움을 줄 수 있어요."},{"no":759,"category":"동작·감각·생각","word":"回忆","pinyin":"huíyì","meaning":"추억, 회상하다","example":"这首老歌，让我回忆起了学生时代。","examplePinyin":"Zhè shǒu lǎogē, ràng wǒ huíyì qǐ le xuéshēng shídài.","translation":"이 옛 노래를 들으면 학창 시절이 떠올라요."},{"no":760,"category":"동작·감각·생각","word":"印象","pinyin":"yìnxiàng","meaning":"인상","example":"她给我的第一印象，是做事特别认真。","examplePinyin":"Tā gěi wǒ de dìyī yìnxiàng, shì zuòshì tèbié rènzhēn.","translation":"그녀에 대한 첫인상은 일을 유난히 꼼꼼하게 한다는 것이었어요."},{"no":761,"category":"동작·감각·생각","word":"难忘","pinyin":"nánwàng","meaning":"잊기 어렵다","example":"那次雨中的旅行，是我最难忘的经历。","examplePinyin":"Nà cì yǔ zhōng de lǚxíng, shì wǒ zuì nánwàng de jīnglì.","translation":"그때 빗속에서 했던 여행은 제가 가장 잊기 어려운 경험이에요."},{"no":762,"category":"동작·감각·생각","word":"梦","pinyin":"mèng","meaning":"꿈","example":"醒来以后，我还记得那个奇怪的梦。","examplePinyin":"Xǐnglái yǐhòu, wǒ hái jìde nà ge qíguài de mèng.","translation":"잠에서 깬 뒤에도 그 이상한 꿈이 기억났어요."},{"no":763,"category":"동작·감각·생각","word":"做梦","pinyin":"zuòmèng","meaning":"꿈을 꾸다","example":"他昨晚做梦，梦见自己又回到了学校。","examplePinyin":"Tā zuówǎn zuòmèng, mèngjiàn zìjǐ yòu huídào le xuéxiào.","translation":"그는 어젯밤에 학교로 돌아간 꿈을 꿨어요."},{"no":764,"category":"동작·감각·생각","word":"表现","pinyin":"biǎoxiàn","meaning":"보여 주다; 태도·성과","example":"她在这次活动中表现很好，得到了表扬。","examplePinyin":"Tā zài zhè cì huódòng zhōng biǎoxiàn hěn hǎo, dédào le biǎoyáng.","translation":"그녀는 이번 활동에서 잘해서 칭찬을 받았어요."},{"no":765,"category":"동작·감각·생각","word":"方式","pinyin":"fāngshì","meaning":"방식, 방법","example":"每个人都有自己的学习方式，不必完全相同。","examplePinyin":"Měi gè rén dōu yǒu zìjǐ de xuéxí fāngshì, búbì wánquán xiāngtóng.","translation":"누구나 자기만의 학습 방식이 있으니 모두 같을 필요는 없어요."},{"no":766,"category":"동작·감각·생각","word":"做法","pinyin":"zuòfǎ","meaning":"방법, 방식","example":"这种做法虽然省事，却容易带来问题。","examplePinyin":"Zhè zhǒng zuòfǎ suīrán shěngshì, què róngyì dàilái wèntí.","translation":"이 방식은 수고를 덜어 주지만 문제를 일으키기 쉬워요."},{"no":767,"category":"동작·감각·생각","word":"原因","pinyin":"yuányīn","meaning":"원인, 이유","example":"先找到失败的原因，再考虑下一步怎么办。","examplePinyin":"Xiān zhǎodào shībài de yuányīn, zài kǎolǜ xià yí bù zěnmebàn.","translation":"먼저 실패의 원인을 찾고 다음에 어떻게 할지 생각하세요."},{"no":768,"category":"동작·감각·생각","word":"结果","pinyin":"jiéguǒ","meaning":"결과","example":"我们等了一下午，结果他根本没来。","examplePinyin":"Wǒmen děng le yí xiàwǔ, jiéguǒ tā gēnběn méi lái.","translation":"우리는 오후 내내 기다렸지만 결국 그는 아예 오지 않았어요."},{"no":769,"category":"동작·감각·생각","word":"效果","pinyin":"xiàoguǒ","meaning":"효과","example":"换了学习方法以后，效果比以前明显多了。","examplePinyin":"Huàn le xuéxí fāngfǎ yǐhòu, xiàoguǒ bǐ yǐqián míngxiǎn duō le.","translation":"학습 방법을 바꾼 후 효과가 전보다 훨씬 뚜렷해졌어요."},{"no":770,"category":"동작·감각·생각","word":"作用","pinyin":"zuòyòng","meaning":"역할, 작용, 효과","example":"这次讨论对解决问题起了重要作用。","examplePinyin":"Zhè cì tǎolùn duì jiějué wèntí qǐ le zhòngyào zuòyòng.","translation":"이번 토론은 문제를 해결하는 데 중요한 역할을 했어요."},{"no":771,"category":"동작·감각·생각","word":"起到","pinyin":"qǐdào","meaning":"역할을 하다, 효과를 내다","example":"他的建议对改进工作起到了很大作用。","examplePinyin":"Tā de jiànyì duì gǎijìn gōngzuò qǐdào le hěn dà zuòyòng.","translation":"그의 제안은 업무를 개선하는 데 큰 역할을 했어요."},{"no":772,"category":"동작·감각·생각","word":"敢","pinyin":"gǎn","meaning":"감히 ~하다, 용기가 있다","example":"即使不确定，也要敢于表达自己的想法。","examplePinyin":"Jíshǐ bú quèdìng, yě yào gǎnyú biǎodá zìjǐ de xiǎngfǎ.","translation":"확신이 없어도 용기를 내 자신의 생각을 표현해야 해요."},{"no":773,"category":"동작·감각·생각","word":"放弃","pinyin":"fàngqì","meaning":"포기하다","example":"虽然失败过几次，他从来没有想过放弃。","examplePinyin":"Suīrán shībài guo jǐ cì, tā cónglái méiyǒu xiǎng guo fàngqì.","translation":"몇 번 실패했지만 그는 포기를 생각한 적이 없어요."},{"no":774,"category":"동작·감각·생각","word":"面对","pinyin":"miànduì","meaning":"마주하다, 직면하다","example":"面对困难，抱怨不如想办法解决。","examplePinyin":"Miànduì kùnnan, bàoyuàn bùrú xiǎng bànfǎ jiějué.","translation":"어려움에 직면하면 불평하기보다 해결책을 생각하는 게 나아요."},{"no":775,"category":"동작·감각·생각","word":"接受","pinyin":"jiēshòu","meaning":"받아들이다, 수락하다","example":"他考虑了一晚上，最后接受了邀请。","examplePinyin":"Tā kǎolǜ le yì wǎnshang, zuìhòu jiēshòu le yāoqǐng.","translation":"그는 하룻밤 동안 생각한 끝에 초대를 받아들였어요."},{"no":776,"category":"동작·감각·생각","word":"拒绝","pinyin":"jùjué","meaning":"거절하다","example":"我最近实在太忙，只好拒绝他的邀请。","examplePinyin":"Wǒ zuìjìn shízài tài máng, zhǐhǎo jùjué tā de yāoqǐng.","translation":"요즘 정말 바빠서 어쩔 수 없이 그의 초대를 거절했어요."},{"no":777,"category":"동작·감각·생각","word":"反对","pinyin":"fǎnduì","meaning":"반대하다","example":"父母并不反对我留学，只是担心我不适应。","examplePinyin":"Fùmǔ bìng bù fǎnduì wǒ liúxué, zhǐshì dānxīn wǒ bú shìyìng.","translation":"부모님은 제 유학을 반대하시는 것이 아니라 적응하지 못할까 걱정하세요."},{"no":778,"category":"동작·감각·생각","word":"答应","pinyin":"dāying","meaning":"승낙하다, 약속하다","example":"既然答应了别人，就应该努力做到。","examplePinyin":"Jìrán dāying le biérén, jiù yīnggāi nǔlì zuòdào.","translation":"다른 사람에게 약속한 이상 지키도록 노력해야 해요."},{"no":779,"category":"동작·감각·생각","word":"保证","pinyin":"bǎozhèng","meaning":"보장하다, 약속하다","example":"我保证按时完成任务，不让大家失望。","examplePinyin":"Wǒ bǎozhèng ànshí wánchéng rènwu, bú ràng dàjiā shīwàng.","translation":"모두를 실망시키지 않도록 임무를 제때 마치겠다고 약속해요."},{"no":780,"category":"동작·감각·생각","word":"原谅","pinyin":"yuánliàng","meaning":"용서하다","example":"他真诚地道了歉，希望得到大家的原谅。","examplePinyin":"Tā zhēnchéng de dào le qiàn, xīwàng dédào dàjiā de yuánliàng.","translation":"그는 진심으로 사과하고 모두에게 용서받기를 바랐어요."},{"no":781,"category":"동작·감각·생각","word":"支持","pinyin":"zhīchí","meaning":"지지하다, 지원하다","example":"无论我作出什么选择，家人都会支持我。","examplePinyin":"Wúlùn wǒ zuòchū shénme xuǎnzé, jiārén dōu huì zhīchí wǒ.","translation":"제가 어떤 선택을 하든 가족은 저를 지지해 줘요."},{"no":782,"category":"동작·감각·생각","word":"重视","pinyin":"zhòngshì","meaning":"중시하다, 중요하게 여기다","example":"我们不仅重视结果，也重视学习的过程。","examplePinyin":"Wǒmen bùjǐn zhòngshì jiéguǒ, yě zhòngshì xuéxí de guòchéng.","translation":"우리는 결과뿐 아니라 배우는 과정도 중요하게 여겨요."},{"no":783,"category":"동작·감각·생각","word":"尊重","pinyin":"zūnzhòng","meaning":"존중하다","example":"即使意见不同，也应该尊重对方。","examplePinyin":"Jíshǐ yìjiàn bùtóng, yě yīnggāi zūnzhòng duìfāng.","translation":"의견이 다르더라도 상대방을 존중해야 해요."},{"no":784,"category":"동작·감각·생각","word":"心","pinyin":"xīn","meaning":"마음, 심장","example":"看到孩子平安回来，妈妈的心才放下来。","examplePinyin":"Kàndào háizi píng'ān huílai, māma de xīn cái fàng xiàlai.","translation":"아이가 무사히 돌아온 것을 보고서야 엄마는 마음을 놓으셨어요."},{"no":785,"category":"동작·감각·생각","word":"内心","pinyin":"nèixīn","meaning":"내면, 마음속","example":"虽然表面平静，他的内心却十分紧张。","examplePinyin":"Suīrán biǎomiàn píngjìng, tā de nèixīn què shífēn jǐnzhāng.","translation":"겉으로는 침착했지만 그의 마음속은 매우 긴장되어 있었어요."},{"no":786,"category":"동작·감각·생각","word":"心情","pinyin":"xīnqíng","meaning":"기분, 마음 상태","example":"听了一会儿音乐，我的心情好多了。","examplePinyin":"Tīng le yíhuìr yīnyuè, wǒ de xīnqíng hǎoduō le.","translation":"음악을 잠시 듣고 나니 기분이 훨씬 좋아졌어요."},{"no":787,"category":"동작·감각·생각","word":"感动","pinyin":"gǎndòng","meaning":"감동하다","example":"他特意赶来帮忙，让我非常感动。","examplePinyin":"Tā tèyì gǎnlái bāngmáng, ràng wǒ fēicháng gǎndòng.","translation":"그가 일부러 달려와 도와줘서 저는 무척 감동했어요."},{"no":788,"category":"동작·감각·생각","word":"感人","pinyin":"gǎnrén","meaning":"감동적이다","example":"电影里最感人的一幕，是母女重逢的时候。","examplePinyin":"Diànyǐng lǐ zuì gǎnrén de yí mù, shì mǔnǚ chóngféng de shíhou.","translation":"영화에서 가장 감동적인 장면은 모녀가 다시 만나는 순간이에요."},{"no":789,"category":"동작·감각·생각","word":"激动","pinyin":"jīdòng","meaning":"흥분하다, 감격하다","example":"见到多年没见的朋友，他激动得说不出话。","examplePinyin":"Jiàndào duōnián méi jiàn de péngyou, tā jīdòng de shuō bu chū huà.","translation":"오랫동안 못 본 친구를 만나자 그는 감격해서 말을 잇지 못했어요."},{"no":790,"category":"동작·감각·생각","word":"兴奋","pinyin":"xīngfèn","meaning":"흥분하다, 신나다","example":"孩子们想到明天的旅行，兴奋得睡不着。","examplePinyin":"Háizimen xiǎngdào míngtiān de lǚxíng, xīngfèn de shuì bu zháo.","translation":"아이들은 내일 여행 갈 생각에 신나서 잠들지 못해요."},{"no":791,"category":"동작·감각·생각","word":"吃惊","pinyin":"chījīng","meaning":"놀라다","example":"他竟然提前完成了任务，大家都很吃惊。","examplePinyin":"Tā jìngrán tíqián wánchéng le rènwu, dàjiā dōu hěn chījīng.","translation":"그가 뜻밖에도 임무를 일찍 마쳐서 모두 놀랐어요."},{"no":792,"category":"동작·감각·생각","word":"害羞","pinyin":"hàixiū","meaning":"부끄러워하다","example":"她虽然有点害羞，还是主动介绍了自己。","examplePinyin":"Tā suīrán yǒudiǎn hàixiū, háishi zhǔdòng jièshào le zìjǐ.","translation":"그녀는 좀 수줍었지만 먼저 자신을 소개했어요."},{"no":793,"category":"동작·감각·생각","word":"后悔","pinyin":"hòuhuǐ","meaning":"후회하다","example":"他后悔没有提前准备，结果错过了机会。","examplePinyin":"Tā hòuhuǐ méiyǒu tíqián zhǔnbèi, jiéguǒ cuòguò le jīhuì.","translation":"그는 미리 준비하지 않아 결국 기회를 놓친 것을 후회했어요."},{"no":794,"category":"동작·감각·생각","word":"羡慕","pinyin":"xiànmù","meaning":"부러워하다","example":"我很羡慕他，能把爱好变成自己的工作。","examplePinyin":"Wǒ hěn xiànmù tā, néng bǎ àihào biànchéng zìjǐ de gōngzuò.","translation":"저는 취미를 직업으로 삼을 수 있는 그가 부러워요."},{"no":795,"category":"동작·감각·생각","word":"不满","pinyin":"bùmǎn","meaning":"불만이다, 만족하지 않다","example":"顾客对等待时间太长表示不满。","examplePinyin":"Gùkè duì děngdài shíjiān tài cháng biǎoshì bùmǎn.","translation":"고객은 대기 시간이 너무 길다는 불만을 나타냈어요."},{"no":796,"category":"동작·감각·생각","word":"烦","pinyin":"fán","meaning":"귀찮다, 짜증나다","example":"这件事让我很烦，我想先安静一会儿。","examplePinyin":"Zhè jiàn shì ràng wǒ hěn fán, wǒ xiǎng xiān ānjìng yíhuìr.","translation":"이 일로 짜증이 나서 우선 잠시 조용히 있고 싶어요."},{"no":797,"category":"동작·감각·생각","word":"烦恼","pinyin":"fánnǎo","meaning":"고민, 걱정","example":"把烦恼说给朋友听，心里会轻松一些。","examplePinyin":"Bǎ fánnǎo shuō gěi péngyou tīng, xīnlǐ huì qīngsōng yìxiē.","translation":"고민을 친구에게 털어놓으면 마음이 좀 가벼워질 거예요."},{"no":798,"category":"동작·감각·생각","word":"难受","pinyin":"nánshòu","meaning":"괴롭다, 불편하다","example":"车里太闷，他坐了一会儿就觉得难受。","examplePinyin":"Chēlǐ tài mēn, tā zuò le yíhuìr jiù juéde nánshòu.","translation":"차 안이 너무 답답해서 그는 잠시 앉아 있다가 불편해졌어요."},{"no":799,"category":"동작·감각·생각","word":"伤心","pinyin":"shāngxīn","meaning":"슬프다, 마음 아프다","example":"朋友搬走以后，她伤心了好几天。","examplePinyin":"Péngyou bānzǒu yǐhòu, tā shāngxīn le hǎo jǐ tiān.","translation":"친구가 이사 간 뒤 그녀는 며칠 동안 슬퍼했어요."},{"no":800,"category":"동작·감각·생각","word":"失望","pinyin":"shīwàng","meaning":"실망하다","example":"虽然结果让人失望，我们还是积累了经验。","examplePinyin":"Suīrán jiéguǒ ràng rén shīwàng, wǒmen háishi jīlěi le jīngyàn.","translation":"결과는 실망스러웠지만 그래도 경험을 쌓았어요."},{"no":801,"category":"동작·감각·생각","word":"讨厌","pinyin":"tǎoyàn","meaning":"싫어하다, 귀찮다","example":"我讨厌别人没问我就动我的东西。","examplePinyin":"Wǒ tǎoyàn biérén méi wèn wǒ jiù dòng wǒ de dōngxi.","translation":"저는 다른 사람이 묻지도 않고 제 물건을 만지는 것을 싫어해요."},{"no":802,"category":"동작·감각·생각","word":"无聊","pinyin":"wúliáo","meaning":"지루하다, 심심하다","example":"等车时觉得无聊，我就拿出书来读。","examplePinyin":"Děng chē shí juéde wúliáo, wǒ jiù náchū shū lái dú.","translation":"차를 기다리며 지루해서 책을 꺼내 읽었어요."},{"no":803,"category":"동작·감각·생각","word":"得意","pinyin":"déyì","meaning":"우쭐하다, 득의양양하다","example":"他刚取得一点成绩，就开始得意起来。","examplePinyin":"Tā gāng qǔdé yìdiǎn chéngjì, jiù kāishǐ déyì qǐlai.","translation":"그는 성과를 조금 얻자마자 우쭐해지기 시작했어요."},{"no":804,"category":"동작·감각·생각","word":"满意","pinyin":"mǎnyì","meaning":"만족하다","example":"这份报告改了几次，经理才满意。","examplePinyin":"Zhè fèn bàogào gǎi le jǐ cì, jīnglǐ cái mǎnyì.","translation":"이 보고서는 몇 번 고친 뒤에야 매니저가 만족했어요."},{"no":805,"category":"동작·감각·생각","word":"幸福","pinyin":"xìngfú","meaning":"행복하다, 행복","example":"能和家人一起吃饭，我就觉得很幸福。","examplePinyin":"Néng hé jiārén yìqǐ chīfàn, wǒ jiù juéde hěn xìngfú.","translation":"가족과 함께 식사할 수 있으면 저는 행복해요."},{"no":806,"category":"동작·감각·생각","word":"愉快","pinyin":"yúkuài","meaning":"즐겁다, 유쾌하다","example":"虽然相处的时间不长，我们合作得很愉快。","examplePinyin":"Suīrán xiāngchǔ de shíjiān bù cháng, wǒmen hézuò de hěn yúkuài.","translation":"함께한 시간은 길지 않았지만 우리는 즐겁게 협력했어요."},{"no":807,"category":"동작·감각·생각","word":"轻松","pinyin":"qīngsōng","meaning":"편안하다, 수월하다","example":"提前做好准备，工作时就会轻松一些。","examplePinyin":"Tíqián zuòhǎo zhǔnbèi, gōngzuò shí jiù huì qīngsōng yìxiē.","translation":"미리 준비를 잘하면 일할 때 좀 수월해질 거예요."},{"no":808,"category":"동작·감각·생각","word":"放松","pinyin":"fàngsōng","meaning":"긴장을 풀다, 편안하게 하다","example":"考试结束后，我打算出去走走，放松一下。","examplePinyin":"Kǎoshì jiéshù hòu, wǒ dǎsuàn chūqu zǒuzou, fàngsōng yíxià.","translation":"시험이 끝나면 밖에 나가 걸으며 좀 쉬려고 해요."},{"no":809,"category":"동작·감각·생각","word":"紧张","pinyin":"jǐnzhāng","meaning":"긴장하다","example":"上台以前我很紧张，讲了几句就好多了。","examplePinyin":"Shàngtái yǐqián wǒ hěn jǐnzhāng, jiǎng le jǐ jù jiù hǎoduō le.","translation":"무대에 오르기 전에는 긴장했지만 몇 마디 하니 훨씬 나아졌어요."},{"no":810,"category":"동작·감각·생각","word":"冷静","pinyin":"lěngjìng","meaning":"침착하다, 냉정하다","example":"越是遇到意外，越需要保持冷静。","examplePinyin":"Yuè shì yùdào yìwài, yuè xūyào bǎochí lěngjìng.","translation":"예상치 못한 일을 만날수록 침착함을 유지해야 해요."},{"no":811,"category":"동작·감각·생각","word":"辛苦","pinyin":"xīnkǔ","meaning":"수고스럽다, 고생하다","example":"这段时间辛苦你了，周末好好休息吧。","examplePinyin":"Zhè duàn shíjiān xīnkǔ nǐ le, zhōumò hǎohǎo xiūxi ba.","translation":"그동안 수고했으니 주말에는 푹 쉬어요."},{"no":812,"category":"동작·감각·생각","word":"压力","pinyin":"yālì","meaning":"압력, 스트레스","example":"工作压力大的时候，他会找朋友聊聊。","examplePinyin":"Gōngzuò yālì dà de shíhou, tā huì zhǎo péngyou liáoliao.","translation":"업무 스트레스가 클 때 그는 친구를 찾아 이야기를 나눠요."},{"no":813,"category":"동작·감각·생각","word":"信心","pinyin":"xìnxīn","meaning":"자신감, 확신","example":"老师的肯定，让他对学习又有了信心。","examplePinyin":"Lǎoshī de kěndìng, ràng tā duì xuéxí yòu yǒu le xìnxīn.","translation":"선생님의 인정은 그가 학습에 다시 자신감을 갖게 해 줬어요."},{"no":814,"category":"동작·감각·생각","word":"可惜","pinyin":"kěxī","meaning":"아쉽다, 안타깝다","example":"这次没能参加比赛，实在有点可惜。","examplePinyin":"Zhè cì méi néng cānjiā bǐsài, shízài yǒudiǎn kěxī.","translation":"이번에 대회에 참가하지 못해서 정말 조금 아쉬워요."},{"no":815,"category":"성질·상태·문법","word":"重","pinyin":"zhòng","meaning":"무겁다","example":"这张桌子比想象中重，一个人搬不动。","examplePinyin":"Zhè zhāng zhuōzi bǐ xiǎngxiàng zhōng zhòng, yí ge rén bān bu dòng.","translation":"이 탁자는 생각보다 무거워서 혼자서는 옮길 수 없어요."},{"no":816,"category":"성질·상태·문법","word":"重","pinyin":"zhòng","meaning":"무겁다","example":"行李太重，超过二十千克就要另外付费。","examplePinyin":"Xíngli tài zhòng, chāoguò èrshí qiānkè jiùyào lìngwài fùfèi.","translation":"짐이 너무 무거워서 20킬로그램을 넘으면 추가 요금을 내야 해요."},{"no":817,"category":"성질·상태·문법","word":"轻","pinyin":"qīng","meaning":"가볍다","example":"这件外套又轻又暖，旅行时带着很方便。","examplePinyin":"Zhè jiàn wàitào yòu qīng yòu nuǎn, lǚxíng shí dài zhe hěn fāngbiàn.","translation":"이 외투는 가볍고 따뜻해서 여행할 때 가지고 다니기 편해요."},{"no":818,"category":"성질·상태·문법","word":"粗","pinyin":"cū","meaning":"굵다, 거칠다","example":"这根绳子够粗，应该能承受箱子的重量。","examplePinyin":"Zhè gēn shéngzi gòu cū, yīnggāi néng chéngshòu xiāngzi de zhòngliàng.","translation":"이 밧줄은 충분히 굵어서 상자의 무게를 견딜 수 있을 거예요."},{"no":819,"category":"성질·상태·문법","word":"细","pinyin":"xì","meaning":"가늘다, 세밀하다","example":"请用细一点的笔，在空格里填写姓名。","examplePinyin":"Qǐng yòng xì yìdiǎn de bǐ, zài kònggé lǐ tiánxiě xìngmíng.","translation":"조금 더 가는 펜으로 빈칸에 이름을 적어 주세요."},{"no":820,"category":"성질·상태·문법","word":"厚","pinyin":"hòu","meaning":"두껍다","example":"这本书虽然厚，但是内容一点也不难。","examplePinyin":"Zhè běn shū suīrán hòu, dànshì nèiróng yìdiǎn yě bù nán.","translation":"이 책은 두껍지만 내용은 조금도 어렵지 않아요."},{"no":821,"category":"성질·상태·문법","word":"深","pinyin":"shēn","meaning":"깊다","example":"这里的水很深，小孩子不能单独下去。","examplePinyin":"Zhèlǐ de shuǐ hěn shēn, xiǎoháizi bùnéng dāndú xiàqu.","translation":"이곳은 물이 깊어서 어린아이가 혼자 들어가면 안 돼요."},{"no":822,"category":"성질·상태·문법","word":"低","pinyin":"dī","meaning":"낮다","example":"门口的树枝太低，走过去时要低头。","examplePinyin":"Ménkǒu de shùzhī tài dī, zǒu guòqu shí yào dītóu.","translation":"입구의 나뭇가지가 너무 낮아서 지나갈 때 고개를 숙여야 해요."},{"no":823,"category":"성질·상태·문법","word":"亮","pinyin":"liàng","meaning":"밝다","example":"换了新灯以后，房间比以前亮多了。","examplePinyin":"Huàn le xīn dēng yǐhòu, fángjiān bǐ yǐqián liàng duō le.","translation":"새 전등으로 바꾸니 방이 전보다 훨씬 밝아졌어요."},{"no":824,"category":"성질·상태·문법","word":"满","pinyin":"mǎn","meaning":"가득하다, 차다","example":"车上的座位已经坐满，大家只能等下一班。","examplePinyin":"Chēshàng de zuòwèi yǐjīng zuòmǎn, dàjiā zhǐnéng děng xià yì bān.","translation":"차 안의 좌석이 다 차서 모두 다음 차를 기다릴 수밖에 없어요."},{"no":825,"category":"성질·상태·문법","word":"空","pinyin":"kōng","meaning":"비다, 텅 비다","example":"这个盒子是空的，你可以用它装书。","examplePinyin":"Zhè ge hézi shì kōng de, nǐ kěyǐ yòng tā zhuāng shū.","translation":"이 상자는 비어 있으니 책을 담는 데 써도 돼요."},{"no":826,"category":"성질·상태·문법","word":"破","pinyin":"pò","meaning":"찢어지다, 망가지다","example":"袋子破了一个洞，里面的米漏出来了。","examplePinyin":"Dàizi pò le yí ge dòng, lǐmiàn de mǐ lòuchūlai le.","translation":"봉지에 구멍이 뚫려서 안의 쌀이 새어 나왔어요."},{"no":827,"category":"성질·상태·문법","word":"乱","pinyin":"luàn","meaning":"어지럽다, 혼란스럽다","example":"屋里太乱，他找了半天也没找到钥匙。","examplePinyin":"Wūlǐ tài luàn, tā zhǎo le bàn tiān yě méi zhǎodào yàoshi.","translation":"방이 너무 어지러워서 그는 한참 찾아도 열쇠를 못 찾았어요."},{"no":828,"category":"성질·상태·문법","word":"样子","pinyin":"yàngzi","meaning":"모습, 모양","example":"看他着急的样子，好像出了什么事。","examplePinyin":"Kàn tā zháojí de yàngzi, hǎoxiàng chū le shénme shì.","translation":"그가 초조해하는 모습으로 보아 무슨 일이 생긴 것 같아요."},{"no":829,"category":"성질·상태·문법","word":"丰富","pinyin":"fēngfù","meaning":"풍부하다","example":"这里的文化生活很丰富，每周都有演出。","examplePinyin":"Zhèlǐ de wénhuà shēnghuó hěn fēngfù, měi zhōu dōu yǒu yǎnchū.","translation":"이곳은 문화생활이 풍부해서 매주 공연이 있어요."},{"no":830,"category":"성질·상태·문법","word":"多样","pinyin":"duōyàng","meaning":"다양하다","example":"这次活动形式多样，适合不同年龄的人。","examplePinyin":"Zhè cì huódòng xíngshì duōyàng, shìhé bùtóng niánlíng de rén.","translation":"이번 활동은 형식이 다양해서 여러 연령대에 적합해요."},{"no":831,"category":"성질·상태·문법","word":"复杂","pinyin":"fùzá","meaning":"복잡하다","example":"情况比预想的复杂，需要更多时间解决。","examplePinyin":"Qíngkuàng bǐ yùxiǎng de fùzá, xūyào gèng duō shíjiān jiějué.","translation":"상황이 예상보다 복잡해서 해결하려면 시간이 더 필요해요."},{"no":832,"category":"성질·상태·문법","word":"普通","pinyin":"pǔtōng","meaning":"보통의, 일반적인","example":"他只是一个普通员工，却做出了很大贡献。","examplePinyin":"Tā zhǐshì yí ge pǔtōng yuángōng, què zuòchū le hěn dà gòngxiàn.","translation":"그는 평범한 직원이지만 큰 공헌을 했어요."},{"no":833,"category":"성질·상태·문법","word":"普遍","pinyin":"pǔbiàn","meaning":"보편적이다, 일반적이다","example":"手机支付在这里很普遍，几乎到处都能用。","examplePinyin":"Shǒujī zhīfù zài zhèlǐ hěn pǔbiàn, jīhū dàochù dōu néng yòng.","translation":"이곳은 휴대전화 결제가 보편적이어서 거의 어디서나 쓸 수 있어요."},{"no":834,"category":"성질·상태·문법","word":"少见","pinyin":"shǎojiàn","meaning":"보기 드물다, 드물다","example":"这种鸟在城市里很少见，只有山里才有。","examplePinyin":"Zhè zhǒng niǎo zài chéngshì lǐ hěn shǎojiàn, zhǐyǒu shānlǐ cái yǒu.","translation":"이 새는 도시에서 보기 드물고 산속에만 있어요."},{"no":835,"category":"성질·상태·문법","word":"特点","pinyin":"tèdiǎn","meaning":"특징","example":"这两种产品各有特点，选择要看个人需要。","examplePinyin":"Zhè liǎng zhǒng chǎnpǐn gè yǒu tèdiǎn, xuǎnzé yào kàn gèrén xūyào.","translation":"이 두 제품은 각각 특징이 있어서 개인의 필요에 따라 선택해야 해요."},{"no":836,"category":"성질·상태·문법","word":"关键","pinyin":"guānjiàn","meaning":"관건, 핵심","example":"解决这个问题的关键，是先找到真正的原因。","examplePinyin":"Jiějué zhè ge wèntí de guānjiàn, shì xiān zhǎodào zhēnzhèng de yuányīn.","translation":"이 문제 해결의 핵심은 먼저 진짜 원인을 찾는 거예요."},{"no":837,"category":"성질·상태·문법","word":"详细","pinyin":"xiángxì","meaning":"자세하다, 상세하다","example":"她把事情经过说得很详细，大家都听懂了。","examplePinyin":"Tā bǎ shìqing jīngguò shuō de hěn xiángxì, dàjiā dōu tīngdǒng le.","translation":"그녀가 일의 경과를 자세히 설명해서 모두 이해했어요."},{"no":838,"category":"성질·상태·문법","word":"热闹","pinyin":"rènao","meaning":"시끌벅적하다, 활기차다","example":"节日的市场特别热闹，到处都是买东西的人。","examplePinyin":"Jiérì de shìchǎng tèbié rènao, dàochù dōu shì mǎi dōngxi de rén.","translation":"명절의 시장은 특히 북적여서 곳곳이 물건 사는 사람들로 가득해요."},{"no":839,"category":"성질·상태·문법","word":"基本","pinyin":"jīběn","meaning":"기본적인","example":"学好基本动作以后，再练习复杂的动作。","examplePinyin":"Xuéhǎo jīběn dòngzuò yǐhòu, zài liànxí fùzá de dòngzuò.","translation":"기본 동작을 잘 배운 다음에 복잡한 동작을 연습하세요."},{"no":840,"category":"성질·상태·문법","word":"情况","pinyin":"qíngkuàng","meaning":"상황, 형편","example":"情况有了变化，我们必须及时调整计划。","examplePinyin":"Qíngkuàng yǒu le biànhuà, wǒmen bìxū jíshí tiáozhěng jìhuà.","translation":"상황이 달라져서 우리는 계획을 제때 조정해야 해요."},{"no":841,"category":"성질·상태·문법","word":"实际","pinyin":"shíjì","meaning":"실제의, 현실적인","example":"这个计划很好，不过还要考虑实际情况。","examplePinyin":"Zhè ge jìhuà hěn hǎo, búguò hái yào kǎolǜ shíjì qíngkuàng.","translation":"이 계획은 좋지만 실제 상황도 고려해야 해요."},{"no":842,"category":"성질·상태·문법","word":"现有","pinyin":"xiànyǒu","meaning":"현재 있는, 기존의","example":"利用现有的材料，我们也能做出漂亮的作品。","examplePinyin":"Lìyòng xiànyǒu de cáiliào, wǒmen yě néng zuòchū piàoliang de zuòpǐn.","translation":"기존에 있는 재료로도 아름다운 작품을 만들 수 있어요."},{"no":843,"category":"성질·상태·문법","word":"条件","pinyin":"tiáojiàn","meaning":"조건","example":"如果条件允许，我想再学一门语言。","examplePinyin":"Rúguǒ tiáojiàn yǔnxǔ, wǒ xiǎng zài xué yì mén yǔyán.","translation":"조건이 허락하면 언어를 하나 더 배우고 싶어요."},{"no":844,"category":"성질·상태·문법","word":"能力","pinyin":"nénglì","meaning":"능력","example":"通过这次实习，他独立工作的能力提高了。","examplePinyin":"Tōngguò zhè cì shíxí, tā dúlì gōngzuò de nénglì tígāo le.","translation":"이번 실습을 통해 그는 독립적으로 일하는 능력이 향상되었어요."},{"no":845,"category":"성질·상태·문법","word":"公共","pinyin":"gōnggòng","meaning":"공공의, 공동의","example":"在公共场所说话，应该注意控制音量。","examplePinyin":"Zài gōnggòng chǎngsuǒ shuōhuà, yīnggāi zhùyì kòngzhì yīnliàng.","translation":"공공장소에서 말할 때는 목소리 크기를 조절해야 해요."},{"no":846,"category":"성질·상태·문법","word":"共同","pinyin":"gòngtóng","meaning":"공동의, 함께","example":"经过共同努力，我们按时完成了任务。","examplePinyin":"Jīngguò gòngtóng nǔlì, wǒmen ànshí wánchéng le rènwu.","translation":"함께 노력한 끝에 우리는 임무를 제때 마쳤어요."},{"no":847,"category":"성질·상태·문법","word":"美好","pinyin":"měihǎo","meaning":"아름답다, 훌륭하다","example":"这段美好的回忆，我会一直记在心里。","examplePinyin":"Zhè duàn měihǎo de huíyì, wǒ huì yìzhí jì zài xīnlǐ.","translation":"이 아름다운 추억을 저는 계속 마음에 간직할 거예요."},{"no":848,"category":"성질·상태·문법","word":"美丽","pinyin":"měilì","meaning":"아름답다","example":"小城美丽而安静，很适合住上一段时间。","examplePinyin":"Xiǎochéng měilì ér ānjìng, hěn shìhé zhù shàng yí duàn shíjiān.","translation":"작은 도시는 아름답고 조용해서 한동안 머물기에 좋아요."},{"no":849,"category":"성질·상태·문법","word":"性","pinyin":"xìng","meaning":"성질; ~성(접미사)","example":"通过小组活动，学生的积极性提高了。","examplePinyin":"Tōngguò xiǎozǔ huódòng, xuéshēng de jījíxìng tígāo le.","translation":"조별 활동을 통해 학생들의 적극성이 높아졌어요."},{"no":850,"category":"성질·상태·문법","word":"性格","pinyin":"xìnggé","meaning":"성격","example":"虽然性格不同，我们却成了很好的朋友。","examplePinyin":"Suīrán xìnggé bùtóng, wǒmen què chéng le hěn hǎo de péngyou.","translation":"성격은 다르지만 우리는 아주 좋은 친구가 되었어요."},{"no":851,"category":"성질·상태·문법","word":"脾气","pinyin":"píqi","meaning":"성격, 성질","example":"他的脾气比以前好多了，很少再发火。","examplePinyin":"Tā de píqi bǐ yǐqián hǎoduō le, hěn shǎo zài fāhuǒ.","translation":"그는 성격이 예전보다 훨씬 좋아져서 이제는 거의 화를 내지 않아요."},{"no":852,"category":"성질·상태·문법","word":"态度","pinyin":"tàidu","meaning":"태도","example":"面对顾客的意见，他的态度一直很认真。","examplePinyin":"Miànduì gùkè de yìjiàn, tā de tàidu yìzhí hěn rènzhēn.","translation":"고객의 의견에 그는 줄곧 진지한 태도를 보였어요."},{"no":853,"category":"성질·상태·문법","word":"笨","pinyin":"bèn","meaning":"어리석다, 둔하다","example":"不会做并不代表笨，只是还没掌握方法。","examplePinyin":"Búhuì zuò bìng bú dàibiǎo bèn, zhǐshì hái méi zhǎngwò fāngfǎ.","translation":"할 줄 모른다고 어리석은 것이 아니라 아직 방법을 익히지 못한 거예요."},{"no":854,"category":"성질·상태·문법","word":"诚实","pinyin":"chéngshí","meaning":"정직하다","example":"他是个诚实的人，犯了错也愿意承认。","examplePinyin":"Tā shì gè chéngshí de rén, fàn le cuò yě yuànyì chéngrèn.","translation":"그는 정직해서 잘못을 해도 인정하려고 해요."},{"no":855,"category":"성질·상태·문법","word":"活泼","pinyin":"huópo","meaning":"활발하다, 명랑하다","example":"新来的女孩很活泼，很快就交到了朋友。","examplePinyin":"Xīn lái de nǚhái hěn huópo, hěn kuài jiù jiāodào le péngyou.","translation":"새로 온 여자아이는 활발해서 금세 친구를 사귀었어요."},{"no":856,"category":"성질·상태·문법","word":"骄傲","pinyin":"jiāo'ào","meaning":"자랑스럽다, 교만하다","example":"看见学生取得进步，老师感到十分骄傲。","examplePinyin":"Kànjiàn xuéshēng qǔdé jìnbù, lǎoshī gǎndào shífēn jiāo'ào.","translation":"학생들이 발전하는 것을 보고 선생님은 매우 자랑스러워하셨어요."},{"no":857,"category":"성질·상태·문법","word":"积极","pinyin":"jījí","meaning":"적극적이다","example":"他积极参加讨论，还提出了几个好建议。","examplePinyin":"Tā jījí cānjiā tǎolùn, hái tíchū le jǐ gè hǎo jiànyì.","translation":"그는 토론에 적극적으로 참여하고 좋은 제안도 몇 가지 했어요."},{"no":858,"category":"성질·상태·문법","word":"懒","pinyin":"lǎn","meaning":"게으르다","example":"别因为懒就不做饭，总吃外卖也不好。","examplePinyin":"Bié yīnwèi lǎn jiù bú zuòfàn, zǒng chī wàimài yě bùhǎo.","translation":"게으르다고 요리를 안 하면 안 돼요. 배달 음식만 먹는 것도 좋지 않아요."},{"no":859,"category":"성질·상태·문법","word":"耐心","pinyin":"nàixīn","meaning":"인내심, 참을성","example":"教孩子学东西，需要足够的耐心。","examplePinyin":"Jiāo háizi xué dōngxi, xūyào zúgòu de nàixīn.","translation":"아이에게 무언가를 가르치려면 충분한 인내심이 필요해요."},{"no":860,"category":"성질·상태·문법","word":"勇敢","pinyin":"yǒnggǎn","meaning":"용감하다","example":"勇敢并不是不害怕，而是害怕也敢去做。","examplePinyin":"Yǒnggǎn bìng búshì bú hàipà, érshì hàipà yě gǎn qù zuò.","translation":"용감하다는 것은 두렵지 않은 것이 아니라 두려워도 해내는 거예요."},{"no":861,"category":"성질·상태·문법","word":"自信","pinyin":"zìxìn","meaning":"자신감이 있다","example":"准备得越充分，上台时就越自信。","examplePinyin":"Zhǔnbèi de yuè chōngfèn, shàngtái shí jiù yuè zìxìn.","translation":"준비를 충분히 할수록 무대에서 더 자신감이 생겨요."},{"no":862,"category":"성질·상태·문법","word":"严格","pinyin":"yángé","meaning":"엄격하다","example":"教练要求很严格，但大家都知道是为我们好。","examplePinyin":"Jiàoliàn yāoqiú hěn yángé, dàn dàjiā dōu zhīdao shì wèi wǒmen hǎo.","translation":"코치의 요구는 엄격하지만 모두 우리를 위한 것임을 알아요."},{"no":863,"category":"성질·상태·문법","word":"粗心","pinyin":"cūxīn","meaning":"덜렁거리다, 부주의하다","example":"因为粗心，我把客人的名字写错了。","examplePinyin":"Yīnwèi cūxīn, wǒ bǎ kèrén de míngzi xiěcuò le.","translation":"부주의해서 손님의 이름을 잘못 썼어요."},{"no":864,"category":"성질·상태·문법","word":"细心","pinyin":"xìxīn","meaning":"세심하다, 꼼꼼하다","example":"多亏他细心，及时发现了表格中的错误。","examplePinyin":"Duōkuī tā xìxīn, jíshí fāxiàn le biǎogé zhōng de cuòwù.","translation":"그가 꼼꼼한 덕분에 양식의 오류를 제때 발견했어요."},{"no":865,"category":"성질·상태·문법","word":"仔细","pinyin":"zǐxì","meaning":"자세하다, 꼼꼼하다","example":"签字以前，请仔细阅读每一项内容。","examplePinyin":"Qiānzì yǐqián, qǐng zǐxì yuèdú měi yí xiàng nèiróng.","translation":"서명하기 전에 각 항목의 내용을 꼼꼼히 읽어 주세요."},{"no":866,"category":"성질·상태·문법","word":"巧","pinyin":"qiǎo","meaning":"공교롭다, 솜씨가 좋다","example":"真巧！我们竟然买了同一班飞机的票。","examplePinyin":"Zhēn qiǎo! Wǒmen jìngrán mǎi le tóng yì bān fēijī de piào.","translation":"정말 우연이네요! 우리가 같은 항공편 표를 샀다니요."},{"no":867,"category":"성질·상태·문법","word":"强","pinyin":"qiáng","meaning":"강하다, 뛰어나다","example":"对手虽然很强，我们也不能轻易放弃。","examplePinyin":"Duìshǒu suīrán hěn qiáng, wǒmen yě bùnéng qīngyì fàngqì.","translation":"상대가 강해도 쉽게 포기해서는 안 돼요."},{"no":868,"category":"성질·상태·문법","word":"棒","pinyin":"bàng","meaning":"훌륭하다, 대단하다","example":"你这次的表现真棒，比上次进步了很多。","examplePinyin":"Nǐ zhè cì de biǎoxiàn zhēn bàng, bǐ shàngcì jìnbù le hěn duō.","translation":"이번에 정말 잘했어요. 지난번보다 많이 발전했어요."},{"no":869,"category":"성질·상태·문법","word":"厉害","pinyin":"lìhai","meaning":"대단하다, 심하다","example":"昨晚风刮得厉害，院子里落满了树叶。","examplePinyin":"Zuówǎn fēng guā de lìhai, yuànzi lǐ luò mǎn le shùyè.","translation":"어젯밤 바람이 심하게 불어서 마당에 나뭇잎이 가득 떨어졌어요."},{"no":870,"category":"성질·상태·문법","word":"标准","pinyin":"biāozhǔn","meaning":"기준, 표준","example":"请按照统一的标准，检查每一件产品。","examplePinyin":"Qǐng ànzhào tǒngyī de biāozhǔn, jiǎnchá měi yí jiàn chǎnpǐn.","translation":"통일된 기준에 따라 제품을 하나하나 검사해 주세요."},{"no":871,"category":"성질·상태·문법","word":"好处","pinyin":"hǎochu","meaning":"장점, 이점","example":"提前预习的好处，是上课时更容易听懂。","examplePinyin":"Tíqián yùxí de hǎochu, shì shàngkè shí gèng róngyì tīngdǒng.","translation":"미리 예습하는 장점은 수업 때 더 쉽게 이해할 수 있다는 거예요."},{"no":872,"category":"성질·상태·문법","word":"坏处","pinyin":"huàichu","meaning":"단점, 해로운 점","example":"经常熬夜有很多坏处，还是早点睡吧。","examplePinyin":"Jīngcháng áoyè yǒu hěn duō huàichu, háishi zǎodiǎn shuì ba.","translation":"자주 밤을 새우면 해로운 점이 많으니 일찍 자요."},{"no":873,"category":"성질·상태·문법","word":"优点","pinyin":"yōudiǎn","meaning":"장점","example":"这个办法最大的优点，是花钱少又容易操作。","examplePinyin":"Zhè ge bànfǎ zuì dà de yōudiǎn, shì huāqián shǎo yòu róngyì cāozuò.","translation":"이 방법의 가장 큰 장점은 비용이 적고 실행하기 쉽다는 거예요."},{"no":874,"category":"성질·상태·문법","word":"缺点","pinyin":"quēdiǎn","meaning":"단점, 결점","example":"知道自己的缺点以后，还要努力去改正。","examplePinyin":"Zhīdao zìjǐ de quēdiǎn yǐhòu, hái yào nǔlì qù gǎizhèng.","translation":"자신의 단점을 안 다음에는 고치려고 노력해야 해요."},{"no":875,"category":"성질·상태·문법","word":"优秀","pinyin":"yōuxiù","meaning":"우수하다, 뛰어나다","example":"他不仅成绩好，还是一名优秀的运动员。","examplePinyin":"Tā bùjǐn chéngjì hǎo, háishi yì míng yōuxiù de yùndòngyuán.","translation":"그는 성적도 좋고 뛰어난 운동선수이기도 해요."},{"no":876,"category":"성질·상태·문법","word":"值得","pinyin":"zhíde","meaning":"~할 가치가 있다","example":"这部电影值得再看一次，每次都有新发现。","examplePinyin":"Zhè bù diànyǐng zhíde zài kàn yí cì, měi cì dōu yǒu xīn fāxiàn.","translation":"이 영화는 볼 때마다 새로 발견하는 것이 있어 다시 볼 가치가 있어요."},{"no":877,"category":"성질·상태·문법","word":"成功","pinyin":"chénggōng","meaning":"성공하다, 성공","example":"成功以后，他仍然保持着认真的态度。","examplePinyin":"Chénggōng yǐhòu, tā réngrán bǎochí zhe rènzhēn de tàidu.","translation":"성공한 뒤에도 그는 여전히 진지한 태도를 유지해요."},{"no":878,"category":"성질·상태·문법","word":"失败","pinyin":"shībài","meaning":"실패하다, 실패","example":"这次失败使我们明白，准备工作还不够充分。","examplePinyin":"Zhè cì shībài shǐ wǒmen míngbai, zhǔnbèi gōngzuò hái búgòu chōngfèn.","translation":"이번 실패로 준비가 아직 충분하지 않았다는 것을 알았어요."},{"no":879,"category":"성질·상태·문법","word":"顺利","pinyin":"shùnlì","meaning":"순조롭다","example":"因为提前做好了安排，活动进行得很顺利。","examplePinyin":"Yīnwèi tíqián zuòhǎo le ānpái, huódòng jìnxíng de hěn shùnlì.","translation":"미리 준비를 잘해서 행사가 순조롭게 진행되었어요."},{"no":880,"category":"성질·상태·문법","word":"有效","pinyin":"yǒuxiào","meaning":"효과적이다, 유효하다","example":"这个办法是否有效，还需要实际试一试。","examplePinyin":"Zhè ge bànfǎ shìfǒu yǒuxiào, hái xūyào shíjì shì yi shì.","translation":"이 방법이 효과적인지는 실제로 시험해 봐야 해요."},{"no":881,"category":"성질·상태·문법","word":"符合","pinyin":"fúhé","meaning":"부합하다, 맞다","example":"只要符合报名条件，就可以参加比赛。","examplePinyin":"Zhǐyào fúhé bàomíng tiáojiàn, jiù kěyǐ cānjiā bǐsài.","translation":"신청 조건에 맞으면 대회에 참가할 수 있어요."},{"no":882,"category":"성질·상태·문법","word":"适合","pinyin":"shìhé","meaning":"적합하다, 잘 맞다","example":"这份工作很适合你，为什么不试一试呢？","examplePinyin":"Zhè fèn gōngzuò hěn shìhé nǐ, wèishénme bú shì yi shì ne?","translation":"이 일은 당신에게 잘 맞는데 한번 해 보는 게 어때요?"},{"no":883,"category":"성질·상태·문법","word":"不便","pinyin":"búbiàn","meaning":"불편하다, 곤란하다","example":"由于道路施工，给大家带来了不便。","examplePinyin":"Yóuyú dàolù shīgōng, gěi dàjiā dàilái le búbiàn.","translation":"도로 공사로 모두에게 불편을 끼쳤어요."},{"no":884,"category":"성질·상태·문법","word":"便于","pinyin":"biànyú","meaning":"~하기 편리하다","example":"把文件按日期保存，便于以后查找。","examplePinyin":"Bǎ wénjiàn àn rìqī bǎocún, biànyú yǐhòu cházhǎo.","translation":"나중에 찾기 쉽도록 문서를 날짜순으로 보관하세요."},{"no":885,"category":"성질·상태·문법","word":"困难","pinyin":"kùnnan","meaning":"어려움, 곤란하다","example":"有困难可以说出来，大家一起想办法。","examplePinyin":"Yǒu kùnnan kěyǐ shuō chūlai, dàjiā yìqǐ xiǎng bànfǎ.","translation":"어려움이 있으면 말해 주세요. 함께 방법을 생각해요."},{"no":886,"category":"성질·상태·문법","word":"麻烦","pinyin":"máfan","meaning":"번거롭다, 귀찮다","example":"麻烦你帮我看一下行李，我去买票。","examplePinyin":"Máfan nǐ bāng wǒ kàn yíxià xíngli, wǒ qù mǎipiào.","translation":"제가 표를 사러 갈 테니 번거롭겠지만 짐을 좀 봐 주세요."},{"no":887,"category":"성질·상태·문법","word":"危险","pinyin":"wēixiǎn","meaning":"위험하다","example":"这里施工很危险，请不要靠近。","examplePinyin":"Zhèlǐ shīgōng hěn wēixiǎn, qǐng búyào kàojìn.","translation":"이곳은 공사 중이라 위험하니 가까이 오지 마세요."},{"no":888,"category":"성질·상태·문법","word":"严重","pinyin":"yánzhòng","meaning":"심각하다","example":"问题已经很严重，不能再拖下去了。","examplePinyin":"Wèntí yǐjīng hěn yánzhòng, bùnéng zài tuōxiàqu le.","translation":"문제가 이미 심각해서 더는 미룰 수 없어요."},{"no":889,"category":"성질·상태·문법","word":"正常","pinyin":"zhèngcháng","meaning":"정상이다, 정상적인","example":"设备修好以后，已经恢复正常使用。","examplePinyin":"Shèbèi xiūhǎo yǐhòu, yǐjīng huīfù zhèngcháng shǐyòng.","translation":"장비를 수리한 뒤 정상적으로 다시 사용하고 있어요."},{"no":890,"category":"성질·상태·문법","word":"正式","pinyin":"zhèngshì","meaning":"정식의, 공식적인","example":"正式开始以前，我们先做一次练习。","examplePinyin":"Zhèngshì kāishǐ yǐqián, wǒmen xiān zuò yí cì liànxí.","translation":"정식으로 시작하기 전에 먼저 한 번 연습해요."},{"no":891,"category":"성질·상태·문법","word":"假","pinyin":"jiǎ","meaning":"가짜의, 거짓의","example":"这条消息可能是假的，最好先确认一下。","examplePinyin":"Zhè tiáo xiāoxi kěnéng shì jiǎ de, zuìhǎo xiān quèrèn yíxià.","translation":"이 소식은 거짓일 수도 있으니 먼저 확인하는 게 좋아요."},{"no":892,"category":"성질·상태·문법","word":"错误","pinyin":"cuòwù","meaning":"잘못, 오류","example":"发现错误并不可怕，重要的是及时改正。","examplePinyin":"Fāxiàn cuòwù bìng bù kěpà, zhòngyào de shì jíshí gǎizhèng.","translation":"오류를 발견하는 것은 두렵지 않으며 중요한 것은 제때 고치는 거예요."},{"no":893,"category":"성질·상태·문법","word":"正确","pinyin":"zhèngquè","meaning":"정확하다, 올바르다","example":"只有方法正确，努力才能有好的效果。","examplePinyin":"Zhǐyǒu fāngfǎ zhèngquè, nǔlì cái néng yǒu hǎo de xiàoguǒ.","translation":"방법이 올바라야 노력이 좋은 효과로 이어질 수 있어요."},{"no":894,"category":"성질·상태·문법","word":"准","pinyin":"zhǔn","meaning":"정확하다, 허락하다","example":"这块表走得很准，不需要经常调整。","examplePinyin":"Zhè kuài biǎo zǒu de hěn zhǔn, bù xūyào jīngcháng tiáozhěng.","translation":"이 시계는 정확하게 가서 자주 조정할 필요가 없어요."},{"no":895,"category":"성질·상태·문법","word":"准确","pinyin":"zhǔnquè","meaning":"정확하다","example":"为了得到准确的数据，我们测量了三次。","examplePinyin":"Wèile dédào zhǔnquè de shùjù, wǒmen cèliáng le sān cì.","translation":"정확한 데이터를 얻기 위해 세 번 측정했어요."},{"no":896,"category":"성질·상태·문법","word":"著名","pinyin":"zhùmíng","meaning":"유명하다","example":"这位著名作家，今天来学校和读者交流。","examplePinyin":"Zhè wèi zhùmíng zuòjiā, jīntiān lái xuéxiào hé dúzhě jiāoliú.","translation":"이 유명 작가는 오늘 학교에 와서 독자들과 교류해요."},{"no":897,"category":"성질·상태·문법","word":"超过","pinyin":"chāoguò","meaning":"초과하다, 넘다","example":"报名人数超过了预计，我们得换一个教室。","examplePinyin":"Bàomíng rénshù chāoguò le yùjì, wǒmen děi huàn yí ge jiàoshì.","translation":"신청자가 예상을 넘어서 교실을 바꿔야 해요."},{"no":898,"category":"성질·상태·문법","word":"不如","pinyin":"bùrú","meaning":"~만 못하다, 차라리 ~하자","example":"与其一直担心，不如现在就开始准备。","examplePinyin":"Yǔqí yìzhí dānxīn, bùrú xiànzài jiù kāishǐ zhǔnbèi.","translation":"계속 걱정하기보다는 지금 준비를 시작하는 게 나아요."},{"no":899,"category":"성질·상태·문법","word":"高于","pinyin":"gāoyú","meaning":"~보다 높다","example":"今年的销售收入，明显高于去年。","examplePinyin":"Jīnnián de xiāoshòu shōurù, míngxiǎn gāoyú qùnián.","translation":"올해 판매 수입은 지난해보다 뚜렷하게 높아요."},{"no":900,"category":"성질·상태·문법","word":"低于","pinyin":"dīyú","meaning":"~보다 낮다","example":"这个价格低于我们的预算，可以考虑。","examplePinyin":"Zhè ge jiàgé dīyú wǒmen de yùsuàn, kěyǐ kǎolǜ.","translation":"이 가격은 우리 예산보다 낮아서 고려해 볼 수 있어요."},{"no":901,"category":"성질·상태·문법","word":"相比","pinyin":"xiāngbǐ","meaning":"비교하다, ~에 비해","example":"与去年相比，今年来参观的人更多了。","examplePinyin":"Yǔ qùnián xiāngbǐ, jīnnián lái cānguān de rén gèng duō le.","translation":"지난해와 비교하면 올해는 관람하러 온 사람이 더 많아요."},{"no":902,"category":"성질·상태·문법","word":"相反","pinyin":"xiāngfǎn","meaning":"반대이다, 오히려","example":"我以为他会反对，相反，他非常支持。","examplePinyin":"Wǒ yǐwéi tā huì fǎnduì, xiāngfǎn, tā fēicháng zhīchí.","translation":"저는 그가 반대할 줄 알았지만 오히려 매우 지지했어요."},{"no":903,"category":"성질·상태·문법","word":"相同","pinyin":"xiāngtóng","meaning":"같다, 동일하다","example":"我们的目标相同，只是选择的方式不同。","examplePinyin":"Wǒmen de mùbiāo xiāngtóng, zhǐshì xuǎnzé de fāngshì bùtóng.","translation":"우리의 목표는 같고 선택한 방식만 달라요."},{"no":904,"category":"성질·상태·문법","word":"同样","pinyin":"tóngyàng","meaning":"똑같이, 마찬가지로","example":"同样的问题，他用另一种方法解决了。","examplePinyin":"Tóngyàng de wèntí, tā yòng lìng yì zhǒng fāngfǎ jiějué le.","translation":"같은 문제를 그는 다른 방법으로 해결했어요."},{"no":905,"category":"성질·상태·문법","word":"区别","pinyin":"qūbié","meaning":"차이, 구별하다","example":"这两个词的区别，主要在使用的场合。","examplePinyin":"Zhè liǎng gè cí de qūbié, zhǔyào zài shǐyòng de chǎnghé.","translation":"이 두 단어의 차이는 주로 사용하는 상황에 있어요."},{"no":906,"category":"성질·상태·문법","word":"快速","pinyin":"kuàisù","meaning":"빠르다, 신속하다","example":"发生问题时，需要快速作出反应。","examplePinyin":"Fāshēng wèntí shí, xūyào kuàisù zuòchū fǎnyìng.","translation":"문제가 발생하면 신속하게 반응해야 해요."},{"no":907,"category":"성질·상태·문법","word":"速度","pinyin":"sùdù","meaning":"속도","example":"练习打字时，先保证准确，再提高速度。","examplePinyin":"Liànxí dǎzì shí, xiān bǎozhèng zhǔnquè, zài tígāo sùdù.","translation":"타자 연습을 할 때는 먼저 정확성을 확보하고 나서 속도를 높이세요."},{"no":908,"category":"성질·상태·문법","word":"速度","pinyin":"sùdù","meaning":"속도","example":"随着车的速度加快，窗外的景物越来越模糊。","examplePinyin":"Suízhe chē de sùdù jiākuài, chuāngwài de jǐngwù yuèláiyuè móhu.","translation":"차의 속도가 빨라지면서 창밖 풍경이 점점 흐릿해졌어요."},{"no":909,"category":"성질·상태·문법","word":"不够","pinyin":"búgòu","meaning":"충분하지 않다","example":"只了解理论还不够，还需要实际练习。","examplePinyin":"Zhǐ liǎojiě lǐlùn hái búgòu, hái xūyào shíjì liànxí.","translation":"이론을 아는 것만으로는 부족하고 실제 연습도 필요해요."},{"no":910,"category":"성질·상태·문법","word":"够","pinyin":"gòu","meaning":"충분하다","example":"这些材料够做三份，不需要再买了。","examplePinyin":"Zhèxiē cáiliào gòu zuò sān fèn, bù xūyào zài mǎi le.","translation":"이 재료면 세 개를 만들기에 충분하니 더 살 필요 없어요."},{"no":911,"category":"성질·상태·문법","word":"缺","pinyin":"quē","meaning":"부족하다, 모자라다","example":"小组里还缺一个人，你愿意加入吗？","examplePinyin":"Xiǎozǔ lǐ hái quē yí ge rén, nǐ yuànyì jiārù ma?","translation":"조에 아직 한 명이 부족한데 참여할래요?"},{"no":912,"category":"성질·상태·문법","word":"缺少","pinyin":"quēshǎo","meaning":"부족하다, 모자라다","example":"他不是缺少能力，而是缺少练习的机会。","examplePinyin":"Tā búshì quēshǎo nénglì, érshì quēshǎo liànxí de jīhuì.","translation":"그는 능력이 부족한 것이 아니라 연습할 기회가 부족해요."},{"no":913,"category":"성질·상태·문법","word":"不必","pinyin":"búbì","meaning":"~할 필요 없다","example":"这只是一次练习，你不必太紧张。","examplePinyin":"Zhè zhǐshì yí cì liànxí, nǐ búbì tài jǐnzhāng.","translation":"이번은 연습일 뿐이니 너무 긴장할 필요 없어요."},{"no":914,"category":"성질·상태·문법","word":"不得不","pinyin":"bùdébù","meaning":"~하지 않을 수 없다","example":"因为天气突然变化，我们不得不改变计划。","examplePinyin":"Yīnwèi tiānqì tūrán biànhuà, wǒmen bùdébù gǎibiàn jìhuà.","translation":"날씨가 갑자기 변해서 우리는 계획을 바꿀 수밖에 없었어요."},{"no":915,"category":"성질·상태·문법","word":"能否","pinyin":"néngfǒu","meaning":"~할 수 있는지 여부","example":"能否按时完成任务，要看准备是否充分。","examplePinyin":"Néngfǒu ànshí wánchéng rènwu, yào kàn zhǔnbèi shìfǒu chōngfèn.","translation":"임무를 제때 마칠 수 있을지는 준비가 충분한지에 달려 있어요."},{"no":916,"category":"성질·상태·문법","word":"能够","pinyin":"nénggòu","meaning":"~할 수 있다","example":"我希望有一天，能够流利地用汉语交流。","examplePinyin":"Wǒ xīwàng yǒu yì tiān, nénggòu liúlì de yòng Hànyǔ jiāoliú.","translation":"언젠가는 중국어로 유창하게 소통할 수 있기를 바라요."},{"no":917,"category":"성질·상태·문법","word":"恐怕","pinyin":"kǒngpà","meaning":"아마 ~일 것 같다, 유감스럽지만","example":"现在才出发，恐怕赶不上最后一班车了。","examplePinyin":"Xiànzài cái chūfā, kǒngpà gǎn bu shàng zuìhòu yì bān chē le.","translation":"지금 출발하면 아마 마지막 차 시간에 맞추지 못할 거예요."},{"no":918,"category":"성질·상태·문법","word":"将","pinyin":"jiāng","meaning":"~할 것이다, 장차","example":"学校将为新生提供免费的语言课程。","examplePinyin":"Xuéxiào jiāng wèi xīnshēng tígōng miǎnfèi de yǔyán kèchéng.","translation":"학교는 신입생에게 무료 어학 수업을 제공할 예정이에요."},{"no":919,"category":"성질·상태·문법","word":"将要","pinyin":"jiāngyào","meaning":"곧 ~하려고 하다","example":"比赛将要开始，请选手们做好准备。","examplePinyin":"Bǐsài jiāngyào kāishǐ, qǐng xuǎnshǒumen zuòhǎo zhǔnbèi.","translation":"경기가 곧 시작되니 선수들은 준비해 주세요."},{"no":920,"category":"성질·상태·문법","word":"无法","pinyin":"wúfǎ","meaning":"~할 수 없다","example":"由于设备故障，今天暂时无法打印。","examplePinyin":"Yóuyú shèbèi gùzhàng, jīntiān zànshí wúfǎ dǎyìn.","translation":"장비 고장으로 오늘은 잠시 인쇄할 수 없어요."},{"no":921,"category":"성질·상태·문법","word":"只好","pinyin":"zhǐhǎo","meaning":"어쩔 수 없이 ~하다","example":"雨越下越大，我们只好取消野餐。","examplePinyin":"Yǔ yuè xià yuè dà, wǒmen zhǐhǎo qǔxiāo yěcān.","translation":"비가 점점 세게 내려서 어쩔 수 없이 소풍을 취소했어요."},{"no":922,"category":"성질·상태·문법","word":"使","pinyin":"shǐ","meaning":"~하게 하다, 시키다","example":"他的鼓励，使我重新找回了信心。","examplePinyin":"Tā de gǔlì, shǐ wǒ chóngxīn zhǎohuí le xìnxīn.","translation":"그의 격려 덕분에 저는 다시 자신감을 되찾았어요."},{"no":923,"category":"성질·상태·문법","word":"用来","pinyin":"yònglái","meaning":"~하는 데 사용하다","example":"这个房间主要用来存放暂时不用的东西。","examplePinyin":"Zhè ge fángjiān zhǔyào yònglái cúnfàng zànshí búyòng de dōngxi.","translation":"이 방은 주로 당장 쓰지 않는 물건을 보관하는 데 써요."},{"no":924,"category":"성질·상태·문법","word":"用于","pinyin":"yòngyú","meaning":"~에 사용되다","example":"这笔钱将用于购买学生需要的教材。","examplePinyin":"Zhè bǐ qián jiāng yòngyú gòumǎi xuéshēng xūyào de jiàocái.","translation":"이 돈은 학생들에게 필요한 교재를 사는 데 사용될 거예요."},{"no":925,"category":"성질·상태·문법","word":"并","pinyin":"bìng","meaning":"결코, 또한","example":"他并没有生气，只是在认真思考。","examplePinyin":"Tā bìng méiyǒu shēngqì, zhǐshì zài rènzhēn sīkǎo.","translation":"그는 화가 난 것이 아니라 진지하게 생각하고 있을 뿐이에요."},{"no":926,"category":"성질·상태·문법","word":"并且","pinyin":"bìngqiě","meaning":"그리고, 게다가","example":"他完成了任务，并且主动帮助其他同事。","examplePinyin":"Tā wánchéng le rènwu, bìngqiě zhǔdòng bāngzhù qítā tóngshì.","translation":"그는 임무를 마쳤고 다른 동료들도 자발적으로 도왔어요."},{"no":927,"category":"성질·상태·문법","word":"而","pinyin":"ér","meaning":"그리고, 그러나","example":"学习的目标是掌握方法，而不是只记住答案。","examplePinyin":"Xuéxí de mùbiāo shì zhǎngwò fāngfǎ, ér búshì zhǐ jìzhù dá'àn.","translation":"학습 목표는 방법을 익히는 것이지 답만 기억하는 것이 아니에요."},{"no":928,"category":"성질·상태·문법","word":"不管","pinyin":"bùguǎn","meaning":"~에 관계없이","example":"不管遇到什么问题，都可以来找我商量。","examplePinyin":"Bùguǎn yùdào shénme wèntí, dōu kěyǐ lái zhǎo wǒ shāngliang.","translation":"어떤 문제가 생기든 저에게 와서 의논해도 돼요."},{"no":929,"category":"성질·상태·문법","word":"不论","pinyin":"búlùn","meaning":"~을 막론하고","example":"不论结果如何，我们都应该感谢大家的努力。","examplePinyin":"Búlùn jiéguǒ rúhé, wǒmen dōu yīnggāi gǎnxiè dàjiā de nǔlì.","translation":"결과가 어떻든 모두의 노력에 감사해야 해요."},{"no":930,"category":"성질·상태·문법","word":"无论","pinyin":"wúlùn","meaning":"~에 관계없이, ~하든","example":"无论住在哪里，他都会给父母打电话。","examplePinyin":"Wúlùn zhù zài nǎlǐ, tā dōu huì gěi fùmǔ dǎ diànhuà.","translation":"어디에 살든 그는 부모님께 전화를 드려요."},{"no":931,"category":"성질·상태·문법","word":"不仅","pinyin":"bùjǐn","meaning":"~뿐만 아니라","example":"这份工作不仅需要经验，还需要耐心。","examplePinyin":"Zhè fèn gōngzuò bùjǐn xūyào jīngyàn, hái xūyào nàixīn.","translation":"이 일은 경험뿐 아니라 인내심도 필요해요."},{"no":932,"category":"성질·상태·문법","word":"不光","pinyin":"bùguāng","meaning":"~뿐만 아니라","example":"他不光会说汉语，还能看懂中文小说。","examplePinyin":"Tā bùguāng huì shuō Hànyǔ, hái néng kàndǒng Zhōngwén xiǎoshuō.","translation":"그는 중국어를 말할 줄 알 뿐 아니라 중국어 소설도 읽고 이해할 수 있어요."},{"no":933,"category":"성질·상태·문법","word":"不过","pinyin":"búguò","meaning":"그러나, 다만","example":"这家店的东西不错，不过价格有些高。","examplePinyin":"Zhè jiā diàn de dōngxi búcuò, búguò jiàgé yǒuxiē gāo.","translation":"이 가게 물건은 괜찮지만 가격이 조금 높아요."},{"no":934,"category":"성질·상태·문법","word":"却","pinyin":"què","meaning":"그러나, 오히려","example":"我找了很久，却发现钥匙就在口袋里。","examplePinyin":"Wǒ zhǎo le hěn jiǔ, què fāxiàn yàoshi jiù zài kǒudài lǐ.","translation":"한참 찾았는데 열쇠는 바로 주머니에 있었어요."},{"no":935,"category":"성질·상태·문법","word":"然而","pinyin":"rán'ér","meaning":"그러나, 하지만","example":"他准备得很充分，然而结果仍不理想。","examplePinyin":"Tā zhǔnbèi de hěn chōngfèn, rán'ér jiéguǒ réng bù lǐxiǎng.","translation":"그는 충분히 준비했지만 결과는 여전히 만족스럽지 않았어요."},{"no":936,"category":"성질·상태·문법","word":"尽管","pinyin":"jǐnguǎn","meaning":"비록 ~하지만","example":"尽管路很远，他还是按时赶到了。","examplePinyin":"Jǐnguǎn lù hěn yuǎn, tā háishi ànshí gǎndào le.","translation":"길이 멀었지만 그는 그래도 제시간에 도착했어요."},{"no":937,"category":"성질·상태·문법","word":"即使","pinyin":"jíshǐ","meaning":"설령 ~하더라도","example":"即使只有一次机会，我也想试一试。","examplePinyin":"Jíshǐ zhǐyǒu yí cì jīhuì, wǒ yě xiǎng shì yi shì.","translation":"기회가 단 한 번뿐이라도 저는 시도해 보고 싶어요."},{"no":938,"category":"성질·상태·문법","word":"既然","pinyin":"jìrán","meaning":"기왕 ~한 바에","example":"既然已经决定，就认真把它做好。","examplePinyin":"Jìrán yǐjīng juédìng, jiù rènzhēn bǎ tā zuòhǎo.","translation":"이미 결정한 이상 성실하게 잘 해내세요."},{"no":939,"category":"성질·상태·문법","word":"既","pinyin":"jì","meaning":"이미, ~도 하고 ~도 하다","example":"这种方法既简单，又能取得很好的效果。","examplePinyin":"Zhè zhǒng fāngfǎ jì jiǎndān, yòu néng qǔdé hěn hǎo de xiàoguǒ.","translation":"이 방법은 간단하면서도 아주 좋은 효과를 낼 수 있어요."},{"no":940,"category":"성질·상태·문법","word":"要是","pinyin":"yàoshi","meaning":"만약 ~라면","example":"要是明天不下雨，我们就去爬山。","examplePinyin":"Yàoshi míngtiān bú xiàyǔ, wǒmen jiù qù páshān.","translation":"내일 비가 안 오면 우리 등산하러 가요."},{"no":941,"category":"성질·상태·문법","word":"否则","pinyin":"fǒuzé","meaning":"그렇지 않으면","example":"请提前预约，否则可能没有空位。","examplePinyin":"Qǐng tíqián yùyuē, fǒuzé kěnéng méiyǒu kōngwèi.","translation":"미리 예약하세요. 그렇지 않으면 자리가 없을 수도 있어요."},{"no":942,"category":"성질·상태·문법","word":"所以","pinyin":"suǒyǐ","meaning":"그래서, 그러므로","example":"他提前完成了工作，所以能早点回家。","examplePinyin":"Tā tíqián wánchéng le gōngzuò, suǒyǐ néng zǎodiǎn huíjiā.","translation":"그는 일을 일찍 마쳐서 집에 일찍 갈 수 있어요."},{"no":943,"category":"성질·상태·문법","word":"因此","pinyin":"yīncǐ","meaning":"따라서, 그러므로","example":"道路正在施工，因此这路公交暂时停运。","examplePinyin":"Dàolù zhèngzài shīgōng, yīncǐ zhè lù gōngjiāo zànshí tíngyùn.","translation":"도로 공사 중이므로 이 버스는 잠시 운행을 중단해요."},{"no":944,"category":"성질·상태·문법","word":"于是","pinyin":"yúshì","meaning":"그래서, 이에","example":"我找不到地址，于是打电话问了朋友。","examplePinyin":"Wǒ zhǎo budào dìzhǐ, yúshì dǎ diànhuà wèn le péngyou.","translation":"주소를 찾을 수 없어서 친구에게 전화해 물어봤어요."},{"no":945,"category":"성질·상태·문법","word":"由于","pinyin":"yóuyú","meaning":"~때문에, ~로 인하여","example":"由于缺少经验，他一开始遇到了不少困难。","examplePinyin":"Yóuyú quēshǎo jīngyàn, tā yì kāishǐ yùdào le bùshǎo kùnnan.","translation":"경험이 부족해서 그는 처음에 많은 어려움을 겪었어요."},{"no":946,"category":"성질·상태·문법","word":"随着","pinyin":"suízhe","meaning":"~에 따라, ~하면서","example":"随着练习次数增加，他的动作越来越熟练。","examplePinyin":"Suízhe liànxí cìshù zēngjiā, tā de dòngzuò yuèláiyuè shúliàn.","translation":"연습 횟수가 늘어나면서 그의 동작이 점점 능숙해졌어요."},{"no":947,"category":"성질·상태·문법","word":"此外","pinyin":"cǐwài","meaning":"이 밖에, 그 외에","example":"请带好护照，此外还需要两张照片。","examplePinyin":"Qǐng dài hǎo hùzhào, cǐwài hái xūyào liǎng zhāng zhàopiàn.","translation":"여권을 챙겨 주세요. 그 밖에 사진 두 장도 필요해요."},{"no":948,"category":"성질·상태·문법","word":"另外","pinyin":"lìngwài","meaning":"그 밖에, 또","example":"我想买这本词典，另外再买一本练习册。","examplePinyin":"Wǒ xiǎng mǎi zhè běn cídiǎn, lìngwài zài mǎi yì běn liànxícè.","translation":"이 사전을 사고 연습책도 한 권 더 사고 싶어요."},{"no":949,"category":"성질·상태·문법","word":"另","pinyin":"lìng","meaning":"다른, 별도의","example":"这个办法行不通，我们得另想办法。","examplePinyin":"Zhè ge bànfǎ xíng bu tōng, wǒmen děi lìng xiǎng bànfǎ.","translation":"이 방법은 통하지 않으니 다른 방법을 생각해야 해요."},{"no":950,"category":"성질·상태·문법","word":"例如","pinyin":"lìrú","meaning":"예를 들면","example":"他有很多爱好，例如画画、摄影和游泳。","examplePinyin":"Tā yǒu hěn duō àihào, lìrú huàhuà, shèyǐng hé yóuyǒng.","translation":"그는 취미가 많아요. 예를 들면 그림 그리기, 사진 촬영, 수영이 있어요."},{"no":951,"category":"성질·상태·문법","word":"按照","pinyin":"ànzhào","meaning":"~에 따라서","example":"请按照说明操作，不要随意改动。","examplePinyin":"Qǐng ànzhào shuōmíng cāozuò, búyào suíyì gǎidòng.","translation":"설명에 따라 조작하고 함부로 바꾸지 마세요."},{"no":952,"category":"성질·상태·문법","word":"对于","pinyin":"duìyú","meaning":"~에 대해, ~에 관하여","example":"对于这个问题，不同的人可能有不同看法。","examplePinyin":"Duìyú zhè ge wèntí, bùtóng de rén kěnéng yǒu bùtóng kànfǎ.","translation":"이 문제에 대해서는 사람마다 다른 견해를 가질 수 있어요."},{"no":953,"category":"성질·상태·문법","word":"为","pinyin":"wèi","meaning":"~을 위해, ~때문에","example":"为准备这次演出，同学们每天都认真排练。","examplePinyin":"Wèi zhǔnbèi zhè cì yǎnchū, tóngxuémen měi tiān dōu rènzhēn páiliàn.","translation":"이번 공연을 준비하기 위해 학생들은 매일 열심히 연습해요."},{"no":954,"category":"성질·상태·문법","word":"由","pinyin":"yóu","meaning":"~에 의해, ~가 맡아","example":"明天的活动由学生自己组织，老师只提供帮助。","examplePinyin":"Míngtiān de huódòng yóu xuéshēng zìjǐ zǔzhī, lǎoshī zhǐ tígōng bāngzhù.","translation":"내일 행사는 학생들이 직접 준비하고 선생님은 도와주시기만 해요."},{"no":955,"category":"성질·상태·문법","word":"自","pinyin":"zì","meaning":"~부터, 스스로","example":"自今年三月起，这家店周一不营业。","examplePinyin":"Zì jīnnián sān yuè qǐ, zhè jiā diàn zhōuyī bù yíngyè.","translation":"올해 삼월부터 이 가게는 월요일에 영업하지 않아요."},{"no":956,"category":"성질·상태·문법","word":"之","pinyin":"zhī","meaning":"~의, ~중의(문어체)","example":"这次旅行，是我最难忘的经历之一。","examplePinyin":"Zhè cì lǚxíng, shì wǒ zuì nánwàng de jīnglì zhīyī.","translation":"이번 여행은 제가 가장 잊기 어려운 경험 중 하나예요."},{"no":957,"category":"성질·상태·문법","word":"作为","pinyin":"zuòwéi","meaning":"~로서","example":"作为组长，他总是先听取大家的意见。","examplePinyin":"Zuòwéi zǔzhǎng, tā zǒngshì xiān tīngqǔ dàjiā de yìjiàn.","translation":"조장으로서 그는 늘 모두의 의견을 먼저 들어요."},{"no":958,"category":"성질·상태·문법","word":"与","pinyin":"yǔ","meaning":"~와, ~과","example":"与朋友合作做生意，事先更要说清楚规则。","examplePinyin":"Yǔ péngyou hézuò zuò shēngyi, shìxiān gèng yào shuō qīngchu guīzé.","translation":"친구와 함께 장사할 때는 미리 규칙을 더 분명히 이야기해야 해요."},{"no":959,"category":"성질·상태·문법","word":"啊","pinyin":"a","meaning":"아, 어(감탄사)","example":"这里的夜景真美啊，难怪游客这么多！","examplePinyin":"Zhèlǐ de yèjǐng zhēn měi a, nánguài yóukè zhème duō!","translation":"이곳의 야경은 정말 아름답네요. 관광객이 이렇게 많은 이유를 알겠어요!"},{"no":960,"category":"성질·상태·문법","word":"着","pinyin":"zhe","meaning":"~하고 있다(동작·상태의 지속)","example":"他拿着地图，一边走一边寻找旅馆。","examplePinyin":"Tā ná zhe dìtú, yìbiān zǒu yìbiān xúnzhǎo lǚguǎn.","translation":"그는 지도를 들고 걸으면서 숙소를 찾았어요."},{"no":961,"category":"성질·상태·문법","word":"者","pinyin":"zhě","meaning":"~하는 사람, ~자","example":"参加者需要提前到场，领取自己的号码。","examplePinyin":"Cānjiāzhě xūyào tíqián dàochǎng, lǐngqǔ zìjǐ de hàomǎ.","translation":"참가자는 미리 현장에 와서 자기 번호를 받아야 해요."},{"no":962,"category":"성질·상태·문법","word":"等²","pinyin":"děng","meaning":"등, 따위","example":"桌上摆着书、杂志等物品，请不要移动。","examplePinyin":"Zhuōshàng bǎi zhe shū, zázhì děng wùpǐn, qǐng búyào yídòng.","translation":"탁자에는 책과 잡지 등의 물건이 놓여 있으니 옮기지 마세요."},{"no":963,"category":"성질·상태·문법","word":"有着","pinyin":"yǒuzhe","meaning":"가지고 있다, 지니고 있다","example":"虽然年龄不同，我们却有着相同的爱好。","examplePinyin":"Suīrán niánlíng bùtóng, wǒmen què yǒuzhe xiāngtóng de àihào.","translation":"나이는 다르지만 우리는 같은 취미를 가지고 있어요."},{"no":964,"category":"성질·상태·문법","word":"无","pinyin":"wú","meaning":"없다, ~이 없다","example":"本次活动无年龄限制，欢迎大家参加。","examplePinyin":"Běncì huódòng wú niánlíng xiànzhì, huānyíng dàjiā cānjiā.","translation":"이번 활동은 나이 제한이 없으니 많이 참여해 주세요."},{"no":965,"category":"성질·상태·문법","word":"十分","pinyin":"shífēn","meaning":"매우, 대단히","example":"他对这次结果十分满意，还想继续合作。","examplePinyin":"Tā duì zhè cì jiéguǒ shífēn mǎnyì, hái xiǎng jìxù hézuò.","translation":"그는 이번 결과에 매우 만족하며 계속 협력하고 싶어 해요."},{"no":966,"category":"성질·상태·문법","word":"多么","pinyin":"duōme","meaning":"얼마나, 매우","example":"只有亲自试过，才知道这项工作多么辛苦。","examplePinyin":"Zhǐyǒu qīnzì shì guo, cái zhīdao zhè xiàng gōngzuò duō n":"qiānwàn","meaning":"반드시, 절대로","example":"过马路时千万别看手机，要注意来往车辆。","examplePinyin":"Guò mǎlù shí qiānwàn bié kàn shǒujī, yào zhùyì láiwǎng chēliàng.","translation":"길을 건널 때는 절대 휴대전화를 보지 말고 오가는 차에 주의하세요."},{"no":976,"category":"성질·상태·문법","word":"究竟","pinyin":"jiūjìng","meaning":"도대체, 결국","example":"这台机器究竟哪里出了问题，还需要检查。","examplePinyin":"Zhè tái jīqì jiūjìng nǎlǐ chū le wèntí, hái xūyào jiǎnchá.","translation":"이 기계의 도대체 어디에 문제가 생겼는지 더 확인해야 해요."},{"no":977,"category":"성질·상태·문법","word":"到底","pinyin":"dàodǐ","meaning":"도대체, 결국","example":"你到底想选哪一个？可以告诉我理由吗？","examplePinyin":"Nǐ dàodǐ xiǎng xuǎn nǎ yí ge? Kěyǐ gàosu wǒ lǐyóu ma?","translation":"당신은 도대체 어느 것을 고르고 싶은가요? 이유를 알려 줄 수 있나요?"},{"no":978,"category":"성질·상태·문법","word":"难道","pinyin":"nándào","meaning":"설마 ~란 말인가","example":"大家都在努力，难道你想现在就放弃吗？","examplePinyin":"Dàjiā dōu zài nǔlì, nándào nǐ xiǎng xiànzài jiù fàngqì ma?","translation":"모두 노력하고 있는데 설마 지금 포기하고 싶은 건가요?"},{"no":979,"category":"성질·상태·문법","word":"是否","pinyin":"shìfǒu","meaning":"~인지 아닌지, 여부","example":"请确认是否需要接站，方便我们安排车辆。","examplePinyin":"Qǐng quèrèn shìfǒu xūyào jiēzhàn, fāngbiàn wǒmen ānpái chēliàng.","translation":"저희가 차량을 준비하기 편하도록 역 마중이 필요한지 확인해 주세요."},{"no":980,"category":"성질·상태·문법","word":"就是","pinyin":"jiùshì","meaning":"바로 ~이다","example":"这就是我喜欢的生活，简单而有规律。","examplePinyin":"Zhè jiùshì wǒ xǐhuan de shēnghuó, jiǎndān ér yǒu guīlǜ.","translation":"이것이 제가 좋아하는 생활이에요. 소박하고 규칙적이죠."},{"no":981,"category":"성질·상태·문법","word":"连","pinyin":"lián","meaning":"연결하다, 심지어","example":"今天忙得连午饭都没吃，实在太累了。","examplePinyin":"Jīntiān máng de lián wǔfàn dōu méi chī, shízài tài lèi le.","translation":"오늘은 너무 바빠서 점심조차 못 먹었고 정말 피곤해요."},{"no":982,"category":"성질·상태·문법","word":"甚至","pinyin":"shènzhì","meaning":"심지어","example":"他学习很投入，甚至忘了吃晚饭。","examplePinyin":"Tā xuéxí hěn tóurù, shènzhì wàng le chī wǎnfàn.","translation":"그는 공부에 몰두해서 저녁 먹는 것까지 잊었어요."},{"no":983,"category":"성질·상태·문법","word":"差（一）点儿","pinyin":"chà (yì) diǎnr","meaning":"하마터면 ~할 뻔하다","example":"刚才地上太滑，我差一点儿就摔倒了。"," :"성질·상태·문법","word":"故意","pinyin":"gùyì","meaning":"일부러, 고의로","example":"我不是故意迟到的，路上确实堵得很厉害。","examplePinyin":"Wǒ búshì gùyì chídào de, lùshang quèshí dǔ de hěn lìhai.","translation":"일부러 늦은 게 아니라 길이 정말 심하게 막혔어요."}];

const state = { showPinyin:true, showMeaning:true, showTranslation:true, speaking:false, paused:false, resumeNext:null, resumeSpeech:null, speechToken:0, runId:0, currentAudio:null, currentNo:null, nextTimer:null, statusTimer:null };
const list = document.getElementById('list');

const pauseResumeBtn = document.getElementById('pauseResume');

function syncPauseButton() {
  pauseResumeBtn.disabled = !state.speaking;
  pauseResumeBtn.classList.toggle('paused', state.paused);
  pauseResumeBtn.textContent = state.paused ? '▶ 이어듣기' : 'Ⅱ 일시정지';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = DATA.filter(x => !q || [x.no,x.word,x.pinyin,x.meaning,x.example,x.examplePinyin,x.translation,x.category].join(' ').toLowerCase().includes(q));
  document.getElementById('count').textContent = `${filtered.length} / 1000`;
  let last = '';
  list.innerHTML = filtered.map(x => {
    const heading = x.category !== last ? `<h2 class="category">${esc(x.category)}</h2>` : '';
    last = x.category;
    return `${heading}<article id="word-${x.no}" class="card">
      <div class="wordline"><button class="startPick ${Number(document.getElementById('startNo')?.value||1)===x.no?'selected':''}" data-no="${x.no}" title="${x.no}번부터 연속 재생">${x.no}</button><div class="hanzi">${esc(x.word)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.pinyin)}</div><button class="play" data-kind="word" data-no="${x.no}">▶ 단어</button></div>
      <div class="answer meaning ${state.showMeaning?'':'hidden'}">${esc(x.meaning)}</div>
      <div class="exampleline"><div class="no">例</div><div class="hanzi sentence">${esc(x.example)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.examplePinyin)}</div><button class="play" data-kind="sentence" data-no="${x.no}">▶ 예문</button></div>
      <div class="answer translation ${state.showTranslation?'':'hidden'}">${esc(x.translation)}</div>
    </article>`;
  }).join('');
}

  // Meaning numbers and optional-letter brackets are printed annotations.

function playQueue(entries, label) {
  clearTimeout(state.nextTimer);
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  const runId = ++state.runId;
  state.speaking = true;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  syncPauseButton();
  document.querySelectorAll('.play').forEach(b => b.disabled = true);
  let done = 0;
  showStatus(`${label} 재생 준비 중…`);
  const fail = message => {
    if (runId !== state.runId) return;
    state.speaking = false;
    state.paused = false;
    state.resumeNext = null;
    state.resumeSpeech = null;
    state.speechToken++;
    if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
    syncPauseButton();
    document.querySelectorAll('.play').forEach(b => b.disabled = false);
    showStatus(message);
  };
  const scheduleNext = () => {
    state.nextTimer = setTimeout(() => { state.nextTimer = null; next(); }, 350);
  };
  const next = async () => {
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (done >= entries.length) {
      state.speaking = false;
      state.paused = false;
      syncPauseButton();
      document.querySelectorAll('.play').forEach(b => b.disabled = false);
      showStatus(`${label} 재생 완료`);
      hideStatusLater();
      return;
    }
    const item = entries[done];
    focusCurrent(item.no);
    showStatus(`${label} 재생 중 · ${item.progress || `${done+1}/${entries.length}`}`);
    if (item.audio) {
      const audio = new Audio(item.audio);
      state.currentAudio = audio;
      audio.playbackRate = Number(document.getElementById('speechRate').value);
      audio.preservesPitch = true;
      audio.onended = () => {
        if (runId !== state.runId || state.currentAudio !== audio) return;
        state.currentAudio = null;
        done++;
        scheduleNext();
      };
      audio.onerror = () => {
        if (runId !== state.runId || state.currentAudio !== audio) return;
        fail(`${item.no}번 음원을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 재생하세요.`);
      };
      audio.play().catch(() => {
        if (runId === state.runId && state.currentAudio === audio) {
          fail('음원을 재생하지 못했습니다. 재생 버튼을 다시 눌러 주세요.');
        }
      });
      return;
    }
    fail(`${item.no}번 음원을 찾지 못했습니다. 잠시 후 다시 시도해 주세요.`);
  };
  next();
}

function fixedAudio(no, kind) { return FIXED_AUDIO[no]?.[kind] || null; }
function repeatEntries(text, repeat, progress, audio=null, no=null, kind=null) {
  return Array.from({length:repeat}, (_,i) => ({text, audio, no, kind, progress:`${progress} · ${i+1}/${repeat}회`}));
}
function focusCurrent(no) {
  if (!no) return;
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  const card = document.querySelector(`article.card:has(.startPick[data-no="${no}"])`);
  if (!card) return;
  card.classList.add('reading');
  if (state.currentNo !== no) card.scrollIntoView({behavior:'smooth', block:'center'});
  state.currentNo = no;
}
function stopPlayback() {
  state.runId++;
  clearTimeout(state.nextTimer);
  state.nextTimer = null;
  state.speaking = false;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio.currentTime=0; state.currentAudio=null; }
  state.currentNo=null;
  syncPauseButton();
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  document.querySelectorAll('.play').forEach(b => b.disabled = false);
  showStatus('재생을 멈췄습니다.');
  hideStatusLater();
}
function togglePause() {
  if (!state.speaking) return;
  if (!state.paused) {
    state.paused = true;
    if (state.currentAudio && !state.currentAudio.paused) state.currentAudio.pause();

    syncPauseButton();
    showStatus('일시정지됨 · 화면을 다시 누르거나 이어듣기 버튼을 누르세요');
    return;
  }
  state.paused = false;
  if (state.currentAudio && state.currentAudio.paused) {
    const audio = state.currentAudio;
    const runId = state.runId;
    audio.play().catch(() => {
      if (runId === state.runId && state.currentAudio === audio) audio.onerror();
    });
  }
  const resume = state.resumeNext;
  state.resumeNext = null;
  if (resume) resume();
  syncPauseButton();
  showStatus('이어서 재생합니다');
}
function showStatus(msg) {
  clearTimeout(state.statusTimer);
  statusBox.textContent = msg;
  statusBox.classList.add('show');
}
function hideStatusLater() {
  clearTimeout(state.statusTimer);
  state.statusTimer = setTimeout(() => statusBox.classList.remove('show'), 1500);
}
function selectedItems() {
  const input = document.getElementById('startNo');
  const start = Math.min(1000, Math.max(1, Math.floor(Number(input.value) || 1)));
  input.value = start;
  return {start, items:DATA.filter(x => x.no >= start)};
}

list.addEventListener('click', e => {
  const pick = e.target.closest('.startPick');
  if (pick) {
    document.getElementById('startNo').value = pick.dataset.no;
    render();
    showStatus(`${pick.dataset.no}번을 연속 재생 시작 번호로 선택했습니다.`);
    hideStatusLater();
    return;
  }
  const btn = e.target.closest('.play'); if (!btn) return;
  const item = DATA.find(x => x.no === Number(btn.dataset.no));
  const isWord = btn.dataset.kind === 'word';
  const repeat = Number(document.getElementById(isWord?'wordRepeat':'sentenceRepeat').value);
  playQueue(repeatEntries(isWord?wordSpeechText(item):item.example, repeat, `${item.no}번`, fixedAudio(item.no,isWord?'word':'example'), item.no, isWord?'word':'example'), isWord?'단어':'예문');
});
document.getElementById('playAllWords').addEventListener('click', () => {
  const repeat = Number(document.getElementById('wordRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(wordSpeechText(x), repeat, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word')), `${start}~1000 전체 단어`);
});
document.getElementById('playAllSentences').addEventListener('click', () => {
  const repeat = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.example, repeat, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')), `${start}~1000 전체 예문`);
});
document.getElementById('playAllBoth').addEventListener('click', () => {
  const wr = Number(document.getElementById('wordRepeat').value);
  const sr = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => [...repeatEntries(wordSpeechText(x), wr, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word'), ...repeatEntries(x.example, sr, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')]), `${start}~1000 단어+예문`);
});
document.getElementById('stopAll').addEventListener('click', stopPlayback);
pauseResumeBtn.addEventListener('click', togglePause);
document.addEventListener('click', e => {
  if (e.target.closest('button, input, select, label, a, .status')) return;
  togglePause();
});
const toTop = document.getElementById('toTop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 450), {passive:true});
document.getElementById('startNo').addEventListener('change', () => { selectedItems(); render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('pinyinToggle').addEventListener('click', e => { state.showPinyin=!state.showPinyin; e.currentTarget.classList.toggle('on',state.showPinyin); e.currentTarget.textContent=state.showPinyin?'병음 보임':'병음 숨김'; render(); });
document.getElementById('meaningToggle').addEventListener('click', e => { state.showMeaning=!state.showMeaning; e.currentTarget.classList.toggle('on',state.showMeaning); e.currentTarget.textContent=state.showMeaning?'뜻 보임':'뜻 숨김'; render(); });
document.getElementById('translationToggle').addEventListener('click', e => { state.showTranslation=!state.showTranslation; e.currentTarget.classList.toggle('on',state.showTranslation); e.currentTarget.textContent=state.showTranslation?'해석 보임':'해석 숨김'; render(); });
render();
</script>
</body>
</html>
