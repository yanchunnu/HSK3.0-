name: Fetch HSK audio
on:
  push:
    paths:
      - audio-manifest.json
      - .github/workflows/fetch-audio.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated audio
        run: |
          mkdir -p audio
          python3 - <<'PY'
          import json, pathlib, urllib.request
          manifest = json.loads(pathlib.Path("audio-manifest.json").read_text(encoding="utf-8"))
          for item in manifest["files"]:
              target = pathlib.Path(item["path"])
              target.parent.mkdir(parents=True, exist_ok=True)
              print(f"Downloading {target}")
              urllib.request.urlretrieve(item["url"], target)
          PY

      - name: Join the full 1-300 track
        run: |
          cd audio
          printf "file 'all-001-100.wav'\nfile 'all-101-200.wav'\nfile 'all-201-300.wav'\n" > concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy all-001-300.wav
          rm concat.txt

      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Add HSK 1 audio tracks"
          git push
