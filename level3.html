<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 3.0 3급 음원 학습</title>
  <style>
    :root { --blue:#174ea6; --deep:#102a43; --line:#d8e2ec; --soft:#f2f7fb; --accent:#eaf2ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#eef3f7; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f5f9ff; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#e1edff; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #2b6ed2; background:#f7fbff; box-shadow:0 0 0 5px #2b6ed21c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#d7e7ff; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>
</head>
<body>
<!-- mobile playback controls v2 -->
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>HSK 3.0 3급 음원 학습</h1><div class="sub">한자단어와 예문을 원하는 횟수만큼 반복해서 들으세요.</div></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="번호·한자·병음·뜻 검색">
      <label>단어 <select id="wordRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>예문 <select id="sentenceRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>속도 <select id="speechRate"><option value="0.55">매우 느리게</option><option value="0.68">느리게</option><option value="0.78" selected>학습 속도</option><option value="0.9">조금 빠르게</option><option value="1">보통</option><option value="1.15">빠르게</option><option value="1.3">매우 빠르게</option></select></label>
      <button class="toggle on" id="pinyinToggle" type="button">병음 보임</button>
      <button class="toggle on" id="meaningToggle" type="button">뜻 보임</button>
      <button class="toggle on" id="translationToggle" type="button">해석 보임</button>
    </div>
    <div class="batch">
      <label class="startControl">시작 번호 <input id="startNo" type="number" min="1" max="1000" value="1"></label>
      <button type="button" id="playAllWords">▶ 선택 번호부터 단어</button>
      <button type="button" id="playAllSentences">▶ 선택 번호부터 예문</button>
      <button type="button" id="playAllBoth">▶ 선택 번호부터 단어+예문</button>
      <button type="button" class="pause" id="pauseResume" disabled>Ⅱ 일시정지</button>
      <button type="button" class="stop" id="stopAll">■ 재생 멈춤</button>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>
<div class="status" id="status"></div>
<button class="toTop" id="toTop" type="button" aria-label="맨 위로 가기" title="맨 위로 가기">↑</button>
<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"你","pinyin":"nǐ","meaning":"너, 당신","example":"学“你”时，同学问：“你是老师吗？”","examplePinyin":"xué “nǐ” shí, tóngxué wèn: “nǐ shì lǎoshī ma?”","translation":"“你”를 배울 때 친구가 “당신은 선생님인가요?”라고 물었어요."},{"no":2,"category":"인사·사람·대명사","word":"你们","pinyin":"nǐmen","meaning":"여러분, 너희들","example":"学“你们”时，同学问：“你们都是学生吗？”","examplePinyin":"xué “nǐmen” shí, tóngxué wèn: “nǐmen dōu shì xuéshēng ma?”","translation":"“你们”를 배울 때 친구가 “여러분은 모두 학생인가요?”라고 물었어요."},{"no":3,"category":"인사·사람·대명사","word":"您","pinyin":"nín","meaning":"당신(존칭)","example":"学“您”时，同学问：“您好，请问您找谁？”","examplePinyin":"xué “nín” shí, tóngxué wèn: “nín hǎo, qǐngwèn nín zhǎo shéi?”","translation":"“您”를 배울 때 친구가 “안녕하세요, 누구를 찾으세요?”라고 물었어요."},{"no":4,"category":"인사·사람·대명사","word":"我","pinyin":"wǒ","meaning":"나, 저","example":"复习“我”时，我读到：“我是学生。”","examplePinyin":"fùxí “wǒ” shí, wǒ dúdào: “wǒ shì xuéshēng.”","translation":"“我”를 복습할 때, 저는 “저는 학생이에요.”라는 문장을 읽었어요."},{"no":5,"category":"인사·사람·대명사","word":"我们","pinyin":"wǒmen","meaning":"우리","example":"为了记住“我们”，我写：“我们都是朋友。”","examplePinyin":"wèile jìzhu “wǒmen”, wǒ xiě: “wǒmen dōu shì péngyou.”","translation":"“我们”를 기억하려고 저는 “우리는 모두 친구예요.”라고 썼어요."},{"no":6,"category":"인사·사람·대명사","word":"咱们","pinyin":"zánmen","meaning":"우리(상대방 포함)","example":"老师用“咱们”举例：“咱们一起去吃饭吧。”","examplePinyin":"lǎoshī yòng “zánmen” jǔlì: “zánmen yìqǐ qù chīfàn ba.”","translation":"선생님은 “咱们”를 사용해 “우리 함께 밥 먹으러 가요.”라고 예를 들었어요."},{"no":7,"category":"인사·사람·대명사","word":"他","pinyin":"tā","meaning":"그, 그 사람","example":"老师用“他”举例：“他是我的老师。”","examplePinyin":"lǎoshī yòng “tā” jǔlì: “tā shì wǒ de lǎoshī.”","translation":"선생님은 “他”를 사용해 “그는 제 선생님이에요.”라고 예를 들었어요."},{"no":8,"category":"인사·사람·대명사","word":"他们","pinyin":"tāmen","meaning":"그들","example":"学“他们”时，我写：“他们都是学生。”","examplePinyin":"xué “tāmen” shí, wǒ xiě: “tāmen dōu shì xuéshēng.”","translation":"“他们”를 배울 때 저는 “그들은 모두 학생이에요.”라고 썼어요."},{"no":9,"category":"인사·사람·대명사","word":"她","pinyin":"tā","meaning":"그녀","example":"为了记住“她”，我写：“她是我的老师。”","examplePinyin":"wèile jìzhu “tā”, wǒ xiě: “tā shì wǒ de lǎoshī.”","translation":"“她”를 기억하려고 저는 “그녀는 제 선생님이에요.”라고 썼어요."},{"no":10,"category":"인사·사람·대명사","word":"她们","pinyin":"tāmen","meaning":"그녀들","example":"复习“她们”时，我读到：“她们都是老师。”","examplePinyin":"fùxí “tāmen” shí, wǒ dúdào: “tāmen dōu shì lǎoshī.”","translation":"“她们”를 복습할 때, 저는 “그녀들은 모두 선생님이에요.”라는 문장을 읽었어요."},{"no":11,"category":"인사·사람·대명사","word":"它","pinyin":"tā","meaning":"그것(사물·동물)","example":"复习“它”时，我读到：“它是一只猫。”","examplePinyin":"fùxí “tā” shí, wǒ dúdào: “tā shì yì zhī māo.”","translation":"“它”를 복습할 때, 저는 “그것은 고양이 한 마리예요.”라는 문장을 읽었어요."},{"no":12,"category":"인사·사람·대명사","word":"它们","pinyin":"tāmen","meaning":"그것들","example":"老师用“它们”举例：“它们都是我的。”","examplePinyin":"lǎoshī yòng “tāmen” jǔlì: “tāmen dōu shì wǒ de.”","translation":"선생님은 “它们”를 사용해 “그것들은 모두 제 것이에요.”라고 예를 들었어요."},{"no":13,"category":"인사·사람·대명사","word":"自己","pinyin":"zìjǐ","meaning":"자기 자신","example":"老师用“自己”举例：“我自己做饭。”","examplePinyin":"lǎoshī yòng “zìjǐ” jǔlì: “wǒ zìjǐ zuòfàn.”","translation":"선생님은 “自己”를 사용해 “저는 직접 요리해요.”라고 예를 들었어요."},{"no":14,"category":"인사·사람·대명사","word":"别人","pinyin":"biérén","meaning":"다른 사람","example":"学“别人”时，老师提醒：“不要拿别人的东西。”","examplePinyin":"xué “biérén” shí, lǎoshī tíxǐng: “búyào ná biérén de dōngxi.”","translation":"“别人”를 배울 때 선생님이 “다른 사람의 물건을 가져가지 마세요.”라고 당부했어요."},{"no":15,"category":"인사·사람·대명사","word":"大家","pinyin":"dàjiā","meaning":"모두, 여러분","example":"复习“大家”时，我读到：“大家好！”","examplePinyin":"fùxí “dàjiā” shí, wǒ dúdào: “dàjiā hǎo!”","translation":"“大家”를 복습할 때, 저는 “여러분, 안녕하세요!”라는 문장을 읽었어요."},{"no":16,"category":"인사·사람·대명사","word":"人","pinyin":"rén","meaning":"사람","example":"老师用“人”举例：“这里有很多人。”","examplePinyin":"lǎoshī yòng “rén” jǔlì: “zhèlǐ yǒu hěn duō rén.”","translation":"선생님은 “人”를 사용해 “여기에는 사람이 많아요.”라고 예를 들었어요."},{"no":17,"category":"인사·사람·대명사","word":"你好","pinyin":"nǐ hǎo","meaning":"안녕하세요","example":"为了记住“你好”，我写：“你好，很高兴认识你。”","examplePinyin":"wèile jìzhu “nǐ hǎo”, wǒ xiě: “nǐ hǎo, hěn gāoxìng rènshi nǐ.”","translation":"“你好”를 기억하려고 저는 “안녕하세요, 만나서 반가워요.”라고 썼어요."},{"no":18,"category":"인사·사람·대명사","word":"请","pinyin":"qǐng","meaning":"청하다, ~하세요","example":"学“请”时，老师提醒：“请坐。”","examplePinyin":"xué “qǐng” shí, lǎoshī tíxǐng: “qǐng zuò.”","translation":"“请”를 배울 때 선생님이 “앉으세요.”라고 당부했어요."},{"no":19,"category":"인사·사람·대명사","word":"请问","pinyin":"qǐngwèn","meaning":"실례지만, 여쭙겠습니다","example":"学“请问”时，同学问：“请问，医院在哪儿？”","examplePinyin":"xué “qǐngwèn” shí, tóngxué wèn: “qǐngwèn, yīyuàn zài nǎr?”","translation":"“请问”를 배울 때 친구가 “실례지만, 병원이 어디에 있나요?”라고 물었어요."},{"no":20,"category":"인사·사람·대명사","word":"谢谢","pinyin":"xièxie","meaning":"감사합니다","example":"老师用“谢谢”举例：“谢谢老师！”","examplePinyin":"lǎoshī yòng “xièxie” jǔlì: “xièxie lǎoshī!”","translation":"선생님은 “谢谢”를 사용해 “선생님, 감사합니다!”라고 예를 들었어요."},{"no":21,"category":"인사·사람·대명사","word":"不客气","pinyin":"bú kèqi","meaning":"천만에요","example":"学“不客气”时，我写：“谢谢！不客气。”","examplePinyin":"xué “bú kèqi” shí, wǒ xiě: “xièxie! Bú kèqi.”","translation":"“不客气”를 배울 때 저는 “감사합니다! 천만에요.”라고 썼어요."},{"no":22,"category":"인사·사람·대명사","word":"对不起","pinyin":"duìbuqǐ","meaning":"미안합니다","example":"学“对不起”时，我写：“对不起，我来晚了。”","examplePinyin":"xué “duìbuqǐ” shí, wǒ xiě: “duìbuqǐ, wǒ lái wǎn le.”","translation":"“对不起”를 배울 때 저는 “미안해요, 제가 늦었어요.”라고 썼어요."},{"no":23,"category":"인사·사람·대명사","word":"不好意思","pinyin":"bù hǎoyìsi","meaning":"죄송하다, 실례하다","example":"课上学“不好意思”时，老师说：“不好意思，我来晚了。”","examplePinyin":"kè shàng xué “bù hǎoyìsi” shí, lǎoshī shuō: “bù hǎoyìsi, wǒ lái wǎn le.”","translation":"수업에서 “不好意思”를 배울 때, 선생님은 “죄송해요, 제가 늦었어요.”라고 말씀하셨어요."},{"no":24,"category":"인사·사람·대명사","word":"没关系","pinyin":"méi guānxi","meaning":"괜찮다","example":"老师用“没关系”举例：“对不起。没关系。”","examplePinyin":"lǎoshī yòng “méi guānxi” jǔlì: “duìbuqǐ. Méi guānxi.”","translation":"선생님은 “没关系”를 사용해 “미안합니다. 괜찮아요.”라고 예를 들었어요."},{"no":25,"category":"인사·사람·대명사","word":"没事","pinyin":"méishì","meaning":"괜찮다, 별일 없다","example":"为了记住“没事”，我写：“没事，你去吧。”","examplePinyin":"wèile jìzhu “méishì”, wǒ xiě: “méishì, nǐ qù ba.”","translation":"“没事”를 기억하려고 저는 “괜찮아요, 가세요.”라고 썼어요."},{"no":26,"category":"인사·사람·대명사","word":"再见","pinyin":"zàijiàn","meaning":"안녕히 가세요","example":"为了记住“再见”，我写：“老师，再见！”","examplePinyin":"wèile jìzhu “zàijiàn”, wǒ xiě: “lǎoshī, zàijiàn!”","translation":"“再见”를 기억하려고 저는 “선생님, 안녕히 가세요!”라고 썼어요."},{"no":27,"category":"인사·사람·대명사","word":"喂","pinyin":"wéi","meaning":"여보세요","example":"课上学“喂”时，老师说：“喂，你好！”","examplePinyin":"kè shàng xué “wéi” shí, lǎoshī shuō: “wéi, nǐ hǎo!”","translation":"수업에서 “喂”를 배울 때, 선생님은 “여보세요, 안녕하세요!”라고 말씀하셨어요."},{"no":28,"category":"인사·사람·대명사","word":"欢迎","pinyin":"huānyíng","meaning":"환영하다","example":"复习“欢迎”时，我读到：“欢迎你来中国！”","examplePinyin":"fùxí “huānyíng” shí, wǒ dúdào: “huānyíng nǐ lái Zhōngguó!”","translation":"“欢迎”를 복습할 때, 저는 “중국에 오신 것을 환영해요!”라는 문장을 읽었어요."},{"no":29,"category":"인사·사람·대명사","word":"男","pinyin":"nán","meaning":"남자, 남성의","example":"课上学“男”时，老师说：“他是男老师。”","examplePinyin":"kè shàng xué “nán” shí, lǎoshī shuō: “tā shì nán lǎoshī.”","translation":"수업에서 “男”를 배울 때, 선생님은 “그는 남자 선생님이에요.”라고 말씀하셨어요."},{"no":30,"category":"인사·사람·대명사","word":"男人","pinyin":"nánrén","meaning":"남자","example":"复习“男人”时，我读到：“那个男人是我爸爸。”","examplePinyin":"fùxí “nánrén” shí, wǒ dúdào: “nà ge nánrén shì wǒ bàba.”","translation":"“男人”를 복습할 때, 저는 “저 남자는 제 아빠예요.”라는 문장을 읽었어요."},{"no":31,"category":"인사·사람·대명사","word":"男孩儿","pinyin":"nánháir","meaning":"남자아이","example":"老师用“男孩儿”举例：“那个男孩儿是我弟弟。”","examplePinyin":"lǎoshī yòng “nánháir” jǔlì: “nàge nánháir shì wǒ dìdi.”","translation":"선생님은 “男孩儿”를 사용해 “저 남자아이는 제 남동생이에요.”라고 예를 들었어요."},{"no":32,"category":"인사·사람·대명사","word":"男生","pinyin":"nánshēng","meaning":"남학생","example":"为了记住“男生”，我写：“我们班有十个男生。”","examplePinyin":"wèile jìzhu “nánshēng”, wǒ xiě: “wǒmen bān yǒu shí ge nánshēng.”","translation":"“男生”를 기억하려고 저는 “우리 반에는 남학생이 10명 있어요.”라고 썼어요."},{"no":33,"category":"인사·사람·대명사","word":"女","pinyin":"nǚ","meaning":"여자, 여성의","example":"为了记住“女”，我写：“她是女老师。”","examplePinyin":"wèile jìzhu “nǚ”, wǒ xiě: “tā shì nǚ lǎoshī.”","translation":"“女”를 기억하려고 저는 “그녀는 여자 선생님이에요.”라고 썼어요."},{"no":34,"ca 이는 아주 귀여워요.”라고 예를 들었어요."},{"no":42,"category":"인사·사람·대명사","word":"姓","pinyin":"xìng","meaning":"성이 ~이다","example":"课上学“姓”时，老师说：“我姓王。”","examplePinyin":"kè shàng xué “xìng” shí, lǎoshī shuō: “wǒ xìng Wáng.”","translation":"수업에서 “姓”를 배울 때, 선생님은 “제 성은 왕입니다.”라고 말씀하셨어요."},{"no":43,"category":"인사·사람·대명사","word":"姓名","pinyin":"xìngmíng","meaning":"성명","example":"学“姓名”时，老师提醒：“请写你的姓名。”","examplePinyin":"xué “xìngmíng” shí, lǎoshī tíxǐng: “qǐng xiě nǐ de xìngmíng.”","translation":"“姓名”를 배울 때 선생님이 “성명을 적어 주세요.”라고 당부했어요."},{"no":44,"category":"인사·사람·대명사","word":"名字","pinyin":"míngzi","meaning":"이름","example":"学“名字”时，同学问：“你叫什么名字？”","examplePinyin":"xué “míngzi” shí, tóngxué wèn: “nǐ jiào shénme míngzi?”","translation":"“名字”를 배울 때 친구가 “이름이 뭐예요?”라고 물었어요."},{"no":45,"category":"인사·사람·대명사","word":"名单","pinyin":"míngdān","meaning":"명단","example":"学“名单”时，老师提醒：“请看一下学生名单。”","examplePinyin":"xué “míngdān” shí, lǎoshī tíxǐng: “qǐng kàn yíxià xuéshēng míngdān.”","translation":"“名单”를 배울 때 선생님이 “학생 명단을 한번 확인해 주세요.”라고 당부했어요."},{"no":46,"category":"인사·사람·대명사","word":"名人","pinyin":"míngrén","meaning":"유명인","example":"老师用“名人”举例：“他是一位有名的名人。”","examplePinyin":"lǎoshī yòng “míngrén” jǔlì: “tā shì yí wèi yǒumíng de míngrén.”","translation":"선생님은 “名人”를 사용해 “그는 유명한 인물이에요.”라고 예를 들었어요."},{"no":47,"category":"인사·사람·대명사","word":"有名","pinyin":"yǒumíng","meaning":"유명하다","example":"课上学“有名”时，老师说：“这家饭馆很有名。”","examplePinyin":"kè shàng xué “yǒumíng” shí, lǎoshī shuō: “zhè jiā fànguǎn hěn yǒumíng.”","translation":"수업에서 “有名”를 배울 때, 선생님은 “이 음식점은 아주 유명해요.”라고 말씀하셨어요."},{"no":48,"category":"가족·관계","word":"家","pinyin":"jiā","meaning":"집, 가정","example":"老师用“家”举例：“我家有四口人。”","examplePinyin":"lǎoshī yòng “jiā” jǔlì: “wǒ jiā yǒu sì kǒu rén.”","translation":"선생님은 “家”를 사용해 “우리 가족은 네 명이에요.”라고 예를 들었어요."},{"no":49,"category":"가족·관계","word":"家人","pinyin":"jiārén","meaning":"가족","example":"老师用“家人”举例：“我的家人都很好。”","examplePinyin":"lǎoshī yòng “jiārén” jǔlì: “wǒ de jiārén dōu hěn hǎo.”","translation":"선생님은 “家人”를 사용해 “제 가족은 모두 잘 지내요.”라 n":"“过年”를 복습할 때, 저는 “저는 설을 쇠러 집에 가요.”라는 문장을 읽었어요."},{"no":230,"category":"시간·날짜","word":"早","pinyin":"zǎo","meaning":"이르다, 일찍","example":"课上学“早”时，老师说：“今天我来得很早。”","examplePinyin":"kè shàng xué “zǎo” shí, lǎoshī shuō: “jīntiān wǒ lái de hěn zǎo.”","translation":"수업에서 “早”를 배울 때, 선생님은 “오늘 저는 아주 일찍 왔어요.”라고 말씀하셨어요."},{"no":231,"category":"시간·날짜","word":"早上","pinyin":"zǎoshang","meaning":"아침","example":"老师用“早上”举例：“我早上七点起床。”","examplePinyin":"lǎoshī yòng “zǎoshang” jǔlì: “wǒ zǎoshang qī diǎn qǐchuáng.”","translation":"선생님은 “早上”를 사용해 “저는 아침 7시에 일어나요.”라고 예를 들었어요."},{"no":232,"category":"시간·날짜","word":"上午","pinyin":"shàngwǔ","meaning":"오전","example":"课上学“上午”时，老师说：“我上午有课。”","examplePinyin":"kè shàng xué “shàngwǔ” shí, lǎoshī shuō: “wǒ shàngwǔ yǒu kè.”","translation":"수업에서 “上午”를 배울 때, 선생님은 “저는 오전에 수업이 있어요.”라고 말씀하셨어요."},{"no":233,"category":"시간·날짜","word":"中午","pinyin":"zhōngwǔ","meaning":"정오, 점심때","example":"复习“中午”时，我读到：“我中午十二点吃饭。”","examplePinyin":"fùxí “zhōngwǔ” shí, wǒ dúdào: “wǒ zhōngwǔ shí'èr diǎn chīfàn.”","translation":"“中午”를 복습할 때, 저는 “저는 정오 12시에 밥을 먹어요.”라는 문장을 읽었어요."},{"no":234,"category":"시간·날짜","word":"下午","pinyin":"xiàwǔ","meaning":"오후","example":"为了记住“下午”，我写：“我下午有课。”","examplePinyin":"wèile jìzhu “xiàwǔ”, wǒ xiě: “wǒ xiàwǔ yǒu kè.”","translation":"“下午”를 기억하려고 저는 “저는 오후에 수업이 있어요.”라고 썼어요."},{"no":235,"category":"시간·날짜","word":"晚","pinyin":"wǎn","meaning":"늦다","example":"老师用“晚”举例：“今天我来晚了。”","examplePinyin":"lǎoshī yòng “wǎn” jǔlì: “jīntiān wǒ lái wǎn le.”","translation":"선생님은 “晚”를 사용해 “오늘 제가 늦게 왔어요.”라고 예를 들었어요."},{"no":236,"category":"시간·날짜","word":"晚上","pinyin":"wǎnshang","meaning":"저녁, 밤","example":"为了记住“晚上”，我写：“我晚上学习汉语。”","examplePinyin":"wèile jìzhu “wǎnshang”, wǒ xiě: “wǒ wǎnshang xuéxí Hànyǔ.”","translation":"“晚上”를 기억하려고 저는 “저는 저녁에 중국어를 공부해요.”라고 썼어요."},{"no":237,"category":"시간·날짜","word":"白天","pinyin":"báitiān","meaning":"낮, 주간","example":"复习“白天”时，我读到：“我白天上班。”","examplePinyin":"fùxí “báitiān” shí, wǒ dúdào: “wǒ báitiān shàngbān.”","translation":"“白天”를 복습할 때, 저는 “  “여름에는 날씨가 아주 더워요.”라고 예를 들었어요."},{"no":246,"category":"시간·날짜","word":"秋天","pinyin":"qiūtiān","meaning":"가을","example":"课上学“秋天”时，老师说：“秋天的天气很凉快。”","examplePinyin":"kè shàng xué “qiūtiān” shí, lǎoshī shuō: “qiūtiān de tiānqì hěn liángkuai.”","translation":"수업에서 “秋天”를 배울 때, 선생님은 “가을 날씨는 아주 시원해요.”라고 말씀하셨어요."},{"no":247,"category":"시간·날짜","word":"冬天","pinyin":"dōngtiān","meaning":"겨울","example":"学“冬天”时，我写：“冬天天气很冷。”","examplePinyin":"xué “dōngtiān” shí, wǒ xiě: “dōngtiān tiānqì hěn lěng.”","translation":"“冬天”를 배울 때 저는 “겨울에는 날씨가 아주 추워요.”라고 썼어요."},{"no":248,"category":"시간·날짜","word":"季","pinyin":"jì","meaning":"계절","example":"为了记住“季”，我写：“一年有四季。”","examplePinyin":"wèile jìzhu “jì”, wǒ xiě: “yì nián yǒu sì jì.”","translation":"“季”를 기억하려고 저는 “일 년에는 사계절이 있어요.”라고 썼어요."},{"no":249,"category":"시간·날짜","word":"季节","pinyin":"jìjié","meaning":"계절","example":"学“季节”时，同学问：“你最喜欢哪个季节？”","examplePinyin":"xué “jìjié” shí, tóngxué wèn: “nǐ zuì xǐhuan nǎ ge jìjié?”","translation":"“季节”를 배울 때 친구가 “어떤 계절을 가장 좋아해요?”라고 물었어요."},{"no":250,"category":"시간·날짜","word":"四季","pinyin":"sìjì","meaning":"사계절","example":"学“四季”时，我写：“韩国有四季。”","examplePinyin":"xué “sìjì” shí, wǒ xiě: “hánguó yǒu sìjì.”","translation":"“四季”를 배울 때 저는 “한국에는 사계절이 있어요.”라고 썼어요."},{"no":251,"category":"시간·날짜","word":"以前","pinyin":"yǐqián","meaning":"이전, 예전","example":"复习“以前”时，我读到：“我以前住在北京。”","examplePinyin":"fùxí “yǐqián” shí, wǒ dúdào: “wǒ yǐqián zhù zài Běijīng.”","translation":"“以前”를 복습할 때, 저는 “저는 예전에 베이징에 살았어요.”라는 문장을 읽었어요."},{"no":252,"category":"시간·날짜","word":"以后","pinyin":"yǐhòu","meaning":"이후, 나중에","example":"课上学“以后”时，老师说：“下课以后我们一起吃饭。”","examplePinyin":"kè shàng xué “yǐhòu” shí, lǎoshī shuō: “xiàkè yǐhòu wǒmen yìqǐ chīfàn.”","translation":"수업에서 “以后”를 배울 때, 선생님은 “수업이 끝난 후 함께 식사해요.”라고 말씀하셨어요."},{"no":253,"category":"시간·날짜","word":"过去²","pinyin":"guòqù","meaning":"과거, 예전","example":"复习“过去²”时，我读到：“过去我不喜欢运动。”","examplePinyin":"fùxí “guòqù” shí, wǒ dúdào: “guòqù wǒ bù xǐhuan yùndòng.”","translation":"“过去²”를 복습할 때, 저는 “예전에는 운동을 좋아하지 않았어요.”라는 문장을 읽었어요."},{"no":254,"category":"시간·날짜","word":"后来","pinyin":"hòulái","meaning":"나중에, 그 후","example":"课上学“后来”时，老师说：“后来他去了北京。”","examplePinyin":"kè shàng xué “hòulái” shí, lǎoshī shuō: “hòulái tā qù le Běijīng.”","translation":"수업에서 “后来”를 배울 때, 선생님은 “그 후 그는 베이징에 갔어요.”라고 말씀하셨어요."},{"no":255,"category":"시간·날짜","word":"刚","pinyin":"gāng","meaning":"막, 방금","example":"复习“刚”时，我读到：“我刚到家。”","examplePinyin":"fùxí “gāng” shí, wǒ dúdào: “wǒ gāng dào jiā.”","translation":"“刚”를 복습할 때, 저는 “저는 방금 집에 도착했어요.”라는 문장을 읽었어요."},{"no":256,"category":"시간·날짜","word":"刚才","pinyin":"gāngcái","meaning":"방금 전","example":"为了记住“刚才”，我写：“他刚才给我打电话了。”","examplePinyin":"wèile jìzhu “gāngcái”, wǒ xiě: “tā gāngcái gěi wǒ dǎ diànhuà le.”","translation":"“刚才”를 기억하려고 저는 “그는 방금 전에 저에게 전화했어요.”라고 썼어요."},{"no":257,"category":"시간·날짜","word":"刚刚","pinyin":"gānggāng","meaning":"방금 막","example":"课上学“刚刚”时，老师说：“我刚刚吃完饭。”","examplePinyin":"kè shàng xué “gānggāng” shí, lǎoshī shuō: “wǒ gānggāng chī wán fàn.”","translation":"수업에서 “刚刚”를 배울 때, 선생님은 “저는 방금 막 밥을 다 먹었어요.”라고 말씀하셨어요."},{"no":258,"category":"시간·날짜","word":"已经","pinyin":"yǐjīng","meaning":"이미, 벌써","example":"课上学“已经”时，老师说：“我已经吃饭了。”","examplePinyin":"kè shàng xué “yǐjīng” shí, lǎoshī shuō: “wǒ yǐjīng chīfàn le.”","translation":"수업에서 “已经”를 배울 때, 선생님은 “저는 이미 밥을 먹었어요.”라고 말씀하셨어요."},{"no":259,"category":"시간·날짜","word":"正在","pinyin":"zhèngzài","meaning":"지금 ~하고 있다","example":"学“正在”时，我写：“我正在吃饭。”","examplePinyin":"xué “zhèngzài” shí, wǒ xiě: “wǒ zhèngzài chīfàn.”","translation":"“正在”를 배울 때 저는 “저는 지금 밥을 먹고 있어요.”라고 썼어요."},{"no":260,"category":"시간·날짜","word":"正","pinyin":"zhèng","meaning":"바로, 마침","example":"复习“正”时，我读到：“我正看书呢。”","examplePinyin":"fùxí “zhèng” shí, wǒ dúdào: “wǒ zhèng kàn shū ne.”","translation":"“正”를 복습할 때, 저는 “저는 지금 책을 읽고 있어요.”라는 문장을 읽었어요."},{"no":261,"category":"시간·날짜","word":"马上","pinyin":"mǎshàng","meaning":"곧, 즉시","example":"老师用“马上”举例：“我马上就来。”","examplePinyin":"lǎoshī yòng “mǎshàng” jǔlì: “wǒ mǎshàng jiù lái.”","translation":"선생님은 “马上”를 사용해 “제가 바로 e":"课上学“大学”时，老师说：“我在大学学习。”","examplePinyin":"kè shàng xué “dàxué” shí, lǎoshī shuō: “wǒ zài dàxué xuéxí.”","translation":"수업에서 “大学”를 배울 때, 선생님은 “저는 대학에서 공부해요.”라고 말씀하셨어요."},{"no":295,"category":"학교·학습·언어","word":"大学生","pinyin":"dàxuéshēng","meaning":"대학생","example":"学“大学生”时，我写：“我姐姐是大学生。”","examplePinyin":"xué “dàxuéshēng” shí, wǒ xiě: “wǒ jiějie shì dàxuéshēng.”","translation":"“大学生”를 배울 때 저는 “제 언니는 대학생이에요.”라고 썼어요."},{"no":296,"category":"학교·학습·언어","word":"学校","pinyin":"xuéxiào","meaning":"학교","example":"复习“学校”时，我读到：“我去学校上课。”","examplePinyin":"fùxí “xuéxiào” shí, wǒ dúdào: “wǒ qù xuéxiào shàngkè.”","translation":"“学校”를 복습할 때, 저는 “저는 학교에 수업하러 가요.”라는 문장을 읽었어요."},{"no":297,"category":"학교·학습·언어","word":"校园","pinyin":"xiàoyuán","meaning":"교정, 캠퍼스","example":"课上学“校园”时，老师说：“我们的校园很漂亮。”","examplePinyin":"kè shàng xué “xiàoyuán” shí, lǎoshī shuō: “wǒmen de xiàoyuán hěn piàoliang.”","translation":"수업에서 “校园”를 배울 때, 선생님은 “우리 학교 캠퍼스는 아주 아름다워요.”라고 말씀하셨어요."},{"no":298,"category":"학교·학습·언어","word":"校长","pinyin":"xiàozhǎng","meaning":"교장","example":"学“校长”时，我写：“校长正在讲话。”","examplePinyin":"xué “xiàozhǎng” shí, wǒ xiě: “xiàozhǎng zhèngzài jiǎnghuà.”","translation":"“校长”를 배울 때 저는 “교장 선생님이 말씀하고 계세요.”라고 썼어요."},{"no":299,"category":"학교·학습·언어","word":"学生","pinyin":"xuéshēng","meaning":"학생","example":"学“学生”时，我写：“我是大学生。”","examplePinyin":"xué “xuéshēng” shí, wǒ xiě: “wǒ shì dàxuéshēng.”","translation":"“学生”를 배울 때 저는 “저는 대학생이에요.”라고 썼어요."},{"no":300,"category":"학교·학습·언어","word":"留学生","pinyin":"liúxuéshēng","meaning":"유학생","example":"复习“留学生”时，我读到：“她是一名韩国留学生。”","examplePinyin":"fùxí “liúxuéshēng” shí, wǒ dúdào: “tā shì yì míng Hánguó liúxuéshēng.”","translation":"“留学生”를 복습할 때, 저는 “그녀는 한국인 유학생이에요.”라는 문장을 읽었어요."},{"no":301,"category":"학교·학습·언어","word":"老师","pinyin":"lǎoshī","meaning":"선생님","example":"为了记住“老师”，我写：“她是我的汉语老师。”","examplePinyin":"wèile jìzhu “lǎoshī”, wǒ xiě: “tā shì wǒ de Hànyǔ lǎoshī.”","translation":"“老师”를 기억하려고 저는 “그녀는 제 중국어 선생님이에요.”라고 썼어요."},{"no":302,"category":"학교·학습·언어","word":"教","pinyin":"jiāo","meaning":"가르치다","example":"老师用“教”举例：“她教我们汉语。”","examplePinyin":"lǎoshī yòng “jiāo” jǔlì: “tā jiāo wǒmen Hànyǔ.”","translation":"선생님은 “教”를 사용해 “그녀는 우리에게 중국어를 가르쳐요.”라고 예를 들었어요."},{"no":303,"category":"학교·학습·언어","word":"教室","pinyin":"jiàoshì","meaning":"교실","example":"复习“教室”时，我读到：“学生们在教室里。”","examplePinyin":"fùxí “jiàoshì” shí, wǒ dúdào: “xuéshēngmen zài jiàoshì lǐ.”","translation":"“教室”를 복습할 때, 저는 “학생들은 교실에 있어요.”라는 문장을 읽었어요."},{"no":304,"category":"학교·학습·언어","word":"班","pinyin":"bān","meaning":"반, 학급","example":"老师用“班”举例：“我们班有十个人。”","examplePinyin":"lǎoshī yòng “bān” jǔlì: “wǒmen bān yǒu shí ge rén.”","translation":"선생님은 “班”를 사용해 “우리 반에는 열 명이 있어요.”라고 예를 들었어요."},{"no":305,"category":"학교·학습·언어","word":"班级","pinyin":"bānjí","meaning":"학급, 반","example":"学“班级”时，我写：“我们班级有二十个学生。”","examplePinyin":"xué “bānjí” shí, wǒ xiě: “wǒmen bānjí yǒu èrshí ge xuéshēng.”","translation":"“班级”를 배울 때 저는 “우리 반에는 학생이 20명 있어요.”라고 썼어요."},{"no":306,"category":"학교·학습·언어","word":"年级","pinyin":"niánjí","meaning":"학년","example":"老师用“年级”举例：“我弟弟上三年级。”","examplePinyin":"lǎoshī yòng “niánjí” jǔlì: “wǒ dìdi shàng sān niánjí.”","translation":"선생님은 “年级”를 사용해 “제 남동생은 3학년이에요.”라고 예를 들었어요."},{"no":307,"category":"학교·학습·언어","word":"学期","pinyin":"xuéqī","meaning":"학기","example":"复习“学期”时，我读到：“这个学期我很忙。”","examplePinyin":"fùxí “xuéqī” shí, wǒ dúdào: “zhège xuéqī wǒ hěn máng.”","translation":"“学期”를 복습할 때, 저는 “이번 학기에 저는 아주 바빠요.”라는 문장을 읽었어요."},{"no":308,"category":"학교·학습·언어","word":"上学","pinyin":"shàngxué","meaning":"등교하다","example":"学“上学”时，我写：“孩子七点去上学。”","examplePinyin":"xué “shàngxué” shí, wǒ xiě: “háizi qī diǎn qù shàngxué.”","translation":"“上学”를 배울 때 저는 “아이는 7시에 학교에 가요.”라고 썼어요."},{"no":309,"category":"학교·학습·언어","word":"上课","pinyin":"shàngkè","meaning":"수업하다","example":"为了记住“上课”，我写：“我们九点上课。”","examplePinyin":"wèile jìzhu “shàngkè”, wǒ xiě: “wǒmen jiǔ diǎn shàngkè.”","translation":"“上课”를 기억하려고 저는 “우리는 9시에 수업해요.”라고 썼어요."},{"no":310,"category":"학교·학습·언어","word":"下课","pinyin":"xiàkè","meaning":"수업을 마치다","example":"课上学“下课”时，老师说：“我们十二点下课。”","examplePinyin":"kè shàng xué “xiàkè” shí, lǎoshī shuō: “wǒmen shí'èr diǎn xiàkè.”","translation":"수업에서 “下课”를 배울 때, 선생님은 “우리는 12시에 수업이 끝나요.”라고 말씀하셨어요."},{"no":311,"category":"학교·학습·언어","word":"放学","pinyin":"fàngxué","meaning":"학교 수업이 끝나다","example":"学“放学”时，我写：“我下午四点放学。”","examplePinyin":"xué “fàngxué” shí, wǒ xiě: “wǒ xiàwǔ sì diǎn fàngxué.”","translation":"“放学”를 배울 때 저는 “저는 오후 4시에 학교 수업이 끝나요.”라고 썼어요."},{"no":312,"category":"학교·학습·언어","word":"开学","pinyin":"kāixué","meaning":"개학하다","example":"老师用“开学”举例：“明天学校开学。”","examplePinyin":"lǎoshī yòng “kāixué” jǔlì: “míngtiān xuéxiào kāixué.”","translation":"선생님은 “开学”를 사용해 “내일 학교가 개학해요.”라고 예를 들었어요."},{"no":313,"category":"학교·학습·언어","word":"课","pinyin":"kè","meaning":"수업, 과목","example":"为了记住“课”，我写：“今天有汉语课。”","examplePinyin":"wèile jìzhu “kè”, wǒ xiě: “jīntiān yǒu Hànyǔ kè.”","translation":"“课”를 기억하려고 저는 “오늘 중국어 수업이 있어요.”라고 썼어요."},{"no":314,"category":"학교·학습·언어","word":"课本","pinyin":"kèběn","meaning":"교과서","example":"学“课本”时，老师提醒：“请打开课本。”","examplePinyin":"xué “kèběn” shí, lǎoshī tíxǐng: “qǐng dǎkāi kèběn.”","translation":"“课本”를 배울 때 선생님이 “교과서를 펴 주세요.”라고 당부했어요."},{"no":315,"category":"학교·학습·언어","word":"课文","pinyin":"kèwén","meaning":"본문, 교과서 지문","example":"学“课文”时，老师提醒：“请读一下这篇课文。”","examplePinyin":"xué “kèwén” shí, lǎoshī tíxǐng: “qǐng dú yíxià zhè piān kèwén.”","translation":"“课文”를 배울 때 선생님이 “이 본문을 한번 읽어 주세요.”라고 당부했어요."},{"no":316,"category":"학교·학습·언어","word":"作业","pinyin":"zuòyè","meaning":"숙제, 과제","example":"为了记住“作业”，我写：“我每天晚上做作业。”","examplePinyin":"wèile jìzhu “zuòyè”, wǒ xiě: “wǒ měitiān wǎnshang zuò zuòyè.”","translation":"“作业”를 기억하려고 저는 “저는 매일 저녁 숙제를 해요.”라고 썼어요."},{"no":317,"category":"학교·학습·언어","word":"学","pinyin":"xué","meaning":"배우다","example":"为了记住“学”，我写：“我想学中文。”","examplePinyin":"wèile jìzhu “xué”, wǒ xiě: “wǒ xiǎng xué Zhōngwén.”","translation":"“学”를 기억하려고 저는 “저는 중국어를 배우고 싶어요.”라고 썼어요."},{"no":318,"category":"학교·학습·언어","word":"学习","pinyin":"xuéxí","meaning":"공부하다, 학습하다","example":"老师用“学习”举例：“我每天学习汉语。”","examplePinyin":"lǎoshī yòng “xuéxí” jǔlì: “wǒ měitiān xuéxí Hànyǔ.”","translation":"선생님은 “学习”를 사용해 “저는 매일 중국어를 공부해요.”라고 예를 들었어요."},{"no":319,"category":"학교·학습·언어","word":"复习","pinyin":"fùxí","meaning":"복습하다","example":"复习“复习”时，我读到：“我每天晚上复习汉语。”","examplePinyin":"fùxí “fùxí” shí, wǒ dúdào: “wǒ měitiān wǎnshang fùxí Hànyǔ.”","translation":"“复习”를 복습할 때, 저는 “저는 매일 저녁 중국어를 복습해요.”라는 문장을 읽었어요."},{"no":320,"category":"학교·학습·언어","word":"练","pinyin":"liàn","meaning":"연습하다","example":"学“练”时，我写：“我每天练汉语口语。”","examplePinyin":"xué “liàn” shí, wǒ xiě: “wǒ měitiān liàn Hànyǔ kǒuyǔ.”","translation":"“练”를 배울 때 저는 “저는 매일 중국어 회화를 연습해요.”라고 썼어요."},{"no":321,"category":"학교·학습·언어","word":"练习","pinyin":"liànxí","meaning":"연습하다, 연습","example":"课上学“练习”时，老师说：“我每天练习说汉语。”","examplePinyin":"kè shàng xué “liànxí” shí, lǎoshī shuō: “wǒ měitiān liànxí shuō Hànyǔ.”","translation":"수업에서 “练习”를 배울 때, 선생님은 “저는 매일 중국어 말하기를 연습해요.”라고 말씀하셨어요."},{"no":322,"category":"학교·학습·언어","word":"准备","pinyin":"zhǔnbèi","meaning":"준비하다","example":"学“准备”时，我写：“我正在准备考试。”","examplePinyin":"xué “zhǔnbèi” shí, wǒ xiě: “wǒ zhèngzài zhǔnbèi kǎoshì.”","translation":"“准备”를 배울 때 저는 “저는 지금 시험을 준비하고 있어요.”라고 썼어요."},{"no":323,"category":"학교·학습·언어","word":"努力","pinyin":"nǔlì","meaning":"노력하다, 열심히","example":"课上学“努力”时，老师说：“我会努力学习汉语。”","examplePinyin":"kè shàng xué “nǔlì” shí, lǎoshī shuō: “wǒ huì nǔlì xuéxí Hànyǔ.”","translation":"수업에서 “努力”를 배울 때, 선생님은 “저는 중국어를 열심히 공부할 거예요.”라고 말씀하셨어요."},{"no":324,"category":"학교·학습·언어","word":"认真","pinyin":"rènzhēn","meaning":"진지하다, 성실하다","example":"课上学“认真”时，老师说：“他学习很认真。”","examplePinyin":"kè shàng xué “rènzhēn” shí, lǎoshī shuō: “tā xuéxí hěn rènzhēn.”","translation":"수업에서 “认真”를 배울 때, 선생님은 “그는 아주 성실하게 공부해요.”라고 말씀하셨어요."},{"no":325,"category":"학교·학습·언어","word":"成绩","pinyin":"chéngjì","meaning":"성적","example":"老师用“成绩”举例：“他的考试成绩很好。”","examplePinyin":"lǎoshī yòng “chéngjì” jǔlì: “tā de kǎoshì chéngjì hěn hǎo.”","translation":"선생님은 “成绩”를 사용해 “그의 시험 성적은 아주 좋아요.”라고 예를 들었어요."},{"no":326,"category":"학교·학습·언어","word":"水平","pinyin":"shuǐpíng","meaning":"수준, 실력","example":"复习“水平”时，我读到：“他的汉语水平很高。”","examplePinyin":"fùxí “shuǐpíng” shí, wǒ dúdào: “tā de Hànyǔ shuǐpíng hěn gāo.”","translation":"“水平”를 복습할 때, 저는 “그의 중국어 실력은 아주 높아요.”라는 문장을 읽었어요."},{"no":327,"category":"학교·학습·언어","word":"提高","pinyin":"tígāo","meaning":"향상시키다, 높이다","example":"复习“提高”时，我读到：“我想提高汉语水平。”","examplePinyin":"fùxí “tígāo” shí, wǒ dúdào: “wǒ xiǎng tígāo Hànyǔ shuǐpíng.”","translation":"“提高”를 복습할 때, 저는 “저는 중국어 실력을 높이고 싶어요.”라는 문장을 읽었어요."},{"no":328,"category":"학교·학습·언어","word":"读","pinyin":"dú","meaning":"읽다","example":"为了记住“读”，我写：“我读这本书。”","examplePinyin":"wèile jìzhu “dú”, wǒ xiě: “wǒ dú zhè běn shū.”","translation":"“读”를 기억하려고 저는 “저는 이 책을 읽어요.”라고 썼어요."},{"no":329,"category":"학교·학습·언어","word":"读书","pinyin":"dúshū","meaning":"책을 읽다, 공부하다","example":"为了记住“读书”，我写：“我晚上在家读书。”","examplePinyin":"wèile jìzhu “dúshū”, wǒ xiě: “wǒ wǎnshang zài jiā dúshū.”","translation":"“读书”를 기억하려고 저는 “저는 저녁에 집에서 책을 읽어요.”라고 썼어요."},{"no":330,"category":"학교·학습·언어","word":"写","pinyin":"xiě","meaning":"쓰다","example":"课上学“写”时，老师说：“我会写汉字。”","examplePinyin":"kè shàng xué “xiě” shí, lǎoshī shuō: “wǒ huì xiě Hànzì.”","translation":"수업에서 “写”를 배울 때, 선생님은 “저는 한자를 쓸 줄 알아요.”라고 말씀하셨어요."},{"no":331,"category":"학교·학습·언어","word":"字","pinyin":"zì","meaning":"글자, 문자","example":"学“字”时，同学问：“这个字怎么读？”","examplePinyin":"xué “zì” shí, tóngxué wèn: “zhège zì zěnme dú?”","translation":"“字”를 배울 때 친구가 “이 글자는 어떻게 읽어요?”라고 물었어요."},{"no":332,"category":"학교·학습·언어","word":"汉字","pinyin":"Hànzì","meaning":"한자","example":"老师用“汉字”举例：“我会写汉字。”","examplePinyin":"lǎoshī yòng “hànzì” jǔlì: “wǒ huì xiě Hànzì.”","translation":"선생님은 “汉字”를 사용해 “저는 한자를 쓸 줄 알아요.”라고 예를 들었어요."},{"no":333,"category":"학교·학습·언어","word":"词","pinyin":"cí","meaning":"단어","example":"学“词”时，同学问：“这个词是什么意思？”","examplePinyin":"xué “cí” shí, tóngxué wèn: “zhège cí shì shénme yìsi?”","translation":"“词”를 배울 때 친구가 “이 단어는 무슨 뜻이에요?”라고 물었어요."},{"no":334,"category":"학교·학습·언어","word":"句子","pinyin":"jùzi","m  배울 때 친구가 “이것은 무슨 뜻이에요?”라고 물었어요."},{"no":359,"category":"학교·학습·언어","word":"懂","pinyin":"dǒng","meaning":"이해하다","example":"学“懂”时，我写：“我听懂了。”","examplePinyin":"xué “dǒng” shí, wǒ xiě: “wǒ tīng dǒng le.”","translation":"“懂”를 배울 때 저는 “저는 알아들었어요.”라고 썼어요."},{"no":360,"category":"학교·학습·언어","word":"明白","pinyin":"míngbai","meaning":"이해하다, 분명하다","example":"课上学“明白”时，老师说：“我明白你的意思了。”","examplePinyin":"kè shàng xué “míngbai” shí, lǎoshī shuō: “wǒ míngbai nǐ de yìsi le.”","translation":"수업에서 “明白”를 배울 때, 선생님은 “당신의 뜻을 이해했어요.”라고 말씀하셨어요."},{"no":361,"category":"학교·학습·언어","word":"清楚","pinyin":"qīngchu","meaning":"분명하다, 명확하다","example":"为了记住“清楚”，我写：“我听得很清楚。”","examplePinyin":"wèile jìzhu “qīngchu”, wǒ xiě: “wǒ tīng de hěn qīngchu.”","translation":"“清楚”를 기억하려고 저는 “저는 아주 똑똑히 들었어요.”라고 썼어요."},{"no":362,"category":"학교·학습·언어","word":"字典","pinyin":"zìdiǎn","meaning":"사전","example":"课上学“字典”时，老师说：“我用字典查汉字。”","examplePinyin":"kè shàng xué “zìdiǎn” shí, lǎoshī shuō: “wǒ yòng zìdiǎn chá Hànzì.”","translation":"수업에서 “字典”를 배울 때, 선생님은 “저는 사전으로 한자를 찾아봐요.”라고 말씀하셨어요."},{"no":363,"category":"학교·학습·언어","word":"词典","pinyin":"cídiǎn","meaning":"사전","example":"复习“词典”时，我读到：“我用词典查生词。”","examplePinyin":"fùxí “cídiǎn” shí, wǒ dúdào: “wǒ yòng cídiǎn chá shēngcí.”","translation":"“词典”를 복습할 때, 저는 “저는 사전으로 새 단어를 찾아봐요.”라는 문장을 읽었어요."},{"no":364,"category":"학교·학습·언어","word":"图书馆","pinyin":"túshūguǎn","meaning":"도서관","example":"复习“图书馆”时，我读到：“我在图书馆看书。”","examplePinyin":"fùxí “túshūguǎn” shí, wǒ dúdào: “wǒ zài túshūguǎn kàn shū.”","translation":"“图书馆”를 복습할 때, 저는 “저는 도서관에서 책을 읽어요.”라는 문장을 읽었어요."},{"no":365,"category":"학교·학습·언어","word":"书店","pinyin":"shūdiàn","meaning":"서점","example":"复习“书店”时，我读到：“我去书店买书。”","examplePinyin":"fùxí “shūdiàn” shí, wǒ dúdào: “wǒ qù shūdiàn mǎi shū.”","translation":"“书店”를 복습할 때, 저는 “저는 서점에 책을 사러 가요.”라는 문장을 읽었어요."},{"no":366,"category":"학교·학습·언어","word":"电子书","pinyin":"diànzǐshū","meaning":"전자책","example":"学“电子书”时，我写：“我喜欢看电子书。”","examplePinyin":"xué “diànzǐshū” shí, wǒ xiě: “wǒ xǐhuan kàn diànzǐshū.”","translation":"“电子书”를 배울 때 저는 “저는 전자책 읽는 것을 좋아해요.”라고 썼어요."},{"no":367,"category":"학교·학습·언어","word":"用","pinyin":"yòng","meaning":"사용하다, 쓰다","example":"课上学“用”时，老师说：“我用手机学习汉语。”","examplePinyin":"kè shàng xué “yòng” shí, lǎoshī shuō: “wǒ yòng shǒujī xuéxí Hànyǔ.”","translation":"수업에서 “用”를 배울 때, 선생님은 “저는 휴대전화로 중국어를 공부해요.”라고 말씀하셨어요."},{"no":368,"category":"직업·일과","word":"公司","pinyin":"gōngsī","meaning":"회사","example":"为了记住“公司”，我写：“我在公司工作。”","examplePinyin":"wèile jìzhu “gōngsī”, wǒ xiě: “wǒ zài gōngsī gōngzuò.”","translation":"“公司”를 기억하려고 저는 “저는 회사에서 일해요.”라고 썼어요."},{"no":369,"category":"직업·일과","word":"办公室","pinyin":"bàngōngshì","meaning":"사무실","example":"为了记住“办公室”，我写：“老师在办公室。”","examplePinyin":"wèile jìzhu “bàngōngshì”, wǒ xiě: “lǎoshī zài bàngōngshì.”","translation":"“办公室”를 기억하려고 저는 “선생님은 사무실에 계세요.”라고 썼어요."},{"no":370,"category":"직업·일과","word":"同事","pinyin":"tóngshì","meaning":"직장 동료","example":"复习“同事”时，我读到：“她是我的同事。”","examplePinyin":"fùxí “tóngshì” shí, wǒ dúdào: “tā shì wǒ de tóngshì.”","translation":"“同事”를 복습할 때, 저는 “그녀는 제 직장 동료예요.”라는 문장을 읽었어요."},{"no":371,"category":"직업·일과","word":"经理","pinyin":"jīnglǐ","meaning":"매니저, 관리자","example":"老师用“经理”举例：“他是我们公司的经理。”","examplePinyin":"lǎoshī yòng “jīnglǐ” jǔlì: “tā shì wǒmen gōngsī de jīnglǐ.”","translation":"선생님은 “经理”를 사용해 “그는 우리 회사의 관리자예요.”라고 예를 들었어요."},{"no":372,"category":"직업·일과","word":"工作","pinyin":"gōngzuò","meaning":"일, 일하다","example":"课上学“工作”时，老师说：“我白天工作。”","examplePinyin":"kè shàng xué “gōngzuò” shí, lǎoshī shuō: “wǒ báitiān gōngzuò.”","translation":"수업에서 “工作”를 배울 때, 선생님은 “저는 낮에 일해요.”라고 말씀하셨어요."},{"no":373,"category":"직업·일과","word":"干","pinyin":"gàn","meaning":"하다, 일하다","example":"学“干”时，同学问：“你在干什么？”","examplePinyin":"xué “gàn” shí, tóngxué wèn: “nǐ zài gàn shénme?”","translation":"“干”를 배울 때 친구가 “무엇을 하고 있나요?”라고 물었어요."},{"no":374,"category":"직업·일과","word":"做","pinyin":"zuò","meaning":"하다, 만들다","example":"学“做”时，同学问：“你在做什么？”","examplePinyin":"xué “zuò” shí, tóngxué wèn: “nǐ zài zuò shénme?”","translation":"“做”를 배울 때 친구가 “무엇을 하고 있어요?”라고 물었어요."},{"no":375,"category":"직업·일과","word":"事情","pinyin":"shìqing","meaning":"일, 사건","example":"课上学“事情”时，老师说：“我有一件事情要说。”","examplePinyin":"kè shàng xué “shìqing” shí, lǎoshī shuō: “wǒ yǒu yí jiàn shìqing yào shuō.”","translation":"수업에서 “事情”를 배울 때, 선생님은 “저는 할 말이 하나 있어요.”라고 말씀하셨어요."},{"no":376,"category":"직업·일과","word":"上班","pinyin":"shàngbān","meaning":"출근하다","example":"老师用“上班”举例：“我八点上班。”","examplePinyin":"lǎoshī yòng “shàngbān” jǔlì: “wǒ bā diǎn shàngbān.”","translation":"선생님은 “上班”를 사용해 “저는 8시에 출근해요.”라고 예를 들었어요."},{"no":377,"category":"직업·일과","word":"下班","pinyin":"xiàbān","meaning":"퇴근하다","example":"为了记住“下班”，我写：“我下午六点下班。”","examplePinyin":"wèile jìzhu “xiàbān”, wǒ xiě: “wǒ xiàwǔ liù diǎn xiàbān.”","translation":"“下班”를 기억하려고 저는 “저는 오후 6시에 퇴근해요.”라고 썼어요."},{"no":378,"category":"직업·일과","word":"起床","pinyin":"qǐchuáng","meaning":"일어나다","example":"学“起床”时，我写：“我每天七点起床。”","examplePinyin":"xué “qǐchuáng” shí, wǒ xiě: “wǒ měitiān qī diǎn qǐchuáng.”","translation":"“起床”를 배울 때 저는 “저는 매일 7시에 일어나요.”라고 썼어요."},{"no":379,"category":"직업·일과","word":"睡","pinyin":"shuì","meaning":"자다","example":"为了记住“睡”，我写：“孩子睡了。”","examplePinyin":"wèile jìzhu “shuì”, wǒ xiě: “háizi shuì le.”","translation":"“睡”를 기억하려고 저는 “아이가 잠들었어요.”라고 썼어요."},{"no":380,"category":"직업·일과","word":"睡觉","pinyin":"shuìjiào","meaning":"잠을 자다","example":"老师用“睡觉”举例：“我晚上十点睡觉。”","examplePinyin":"lǎoshī yòng “shuìjiào” jǔlì: “wǒ wǎnshang shí diǎn shuìjiào.”","translation":"선생님은 “睡觉”를 사용해 “저는 밤 10시에 자요.”라고 예를 들었어요."},{"no":381,"category":"직업·일과","word":"休息","pinyin":"xiūxi","meaning":"쉬다, 휴식하다","example":"复习“休息”时，我读到：“星期天我在家休息。”","examplePinyin":"fùxí “xiūxi” shí, wǒ dúdào: “xīngqītiān wǒ zài jiā xiūxi.”","translation":"“休息”를 복습할 때, 저는 “일요일에는 집에서 쉬어요.”라는 문장을 읽었어요."},{"no":382,"category":"직업·일과","word":"休假","pinyin":"xiūjià","meaning":"휴가를 보내다","example":"复习“休假”时，我读到：“我下个月休假。”","examplePinyin":"fùxí “xiūjià” shí, wǒ dúdào: “wǒ xià ge yuè xiūjià.”","translation":"“休假”를 복습할 때, 저는 “저는 다음 달에 휴가를 가요.”라는 문장을 읽었어요."},{"n jìzhu “táng”, wǒ xiě: “wǒ hē kāfēi bù jiā táng.”","translation":"“糖”를 기억하려고 저는 “저는 커피에 설탕을 넣지 않아요.”라고 썼어요."},{"no":441,"category":"쇼핑·물건·장소","word":"买","pinyin":"mǎi","meaning":"사다","example":"复习“买”时，我读到：“我想买衣服。”","examplePinyin":"fùxí “mǎi” shí, wǒ dúdào: “wǒ xiǎng mǎi yīfu.”","translation":"“买”를 복습할 때, 저는 “저는 옷을 사고 싶어요.”라는 문장을 읽었어요."},{"no":442,"category":"쇼핑·물건·장소","word":"卖","pinyin":"mài","meaning":"팔다","example":"老师用“卖”举例：“这个店卖水果。”","examplePinyin":"lǎoshī yòng “mài” jǔlì: “zhège diàn mài shuǐguǒ.”","translation":"선생님은 “卖”를 사용해 “이 가게는 과일을 팔아요.”라고 예를 들었어요."},{"no":443,"category":"쇼핑·물건·장소","word":"花²","pinyin":"huā","meaning":"쓰다, 소비하다","example":"老师用“花²”举例：“我花了十块钱。”","examplePinyin":"lǎoshī yòng “huā” jǔlì: “wǒ huā le shí kuài qián.”","translation":"선생님은 “花²”를 사용해 “저는 10위안을 썼어요.”라고 예를 들었어요."},{"no":444,"category":"쇼핑·물건·장소","word":"贵","pinyin":"guì","meaning":"비싸다","example":"老师用“贵”举例：“这个太贵了。”","examplePinyin":"lǎoshī yòng “guì” jǔlì: “zhège tài guì le.”","translation":"선생님은 “贵”를 사용해 “이것은 너무 비싸요.”라고 예를 들었어요."},{"no":445,"category":"쇼핑·물건·장소","word":"便宜","pinyin":"piányi","meaning":"싸다, 저렴하다","example":"为了记住“便宜”，我写：“这个很便宜。”","examplePinyin":"wèile jìzhu “piányi”, wǒ xiě: “zhège hěn piányi.”","translation":"“便宜”를 기억하려고 저는 “이것은 아주 저렴해요.”라고 썼어요."},{"no":446,"category":"쇼핑·물건·장소","word":"店","pinyin":"diàn","meaning":"가게, 상점","example":"为了记住“店”，我写：“那个店很好。”","examplePinyin":"wèile jìzhu “diàn”, wǒ xiě: “nàge diàn hěn hǎo.”","translation":"“店”를 기억하려고 저는 “저 가게는 좋아요.”라고 썼어요."},{"no":447,"category":"쇼핑·물건·장소","word":"商店","pinyin":"shāngdiàn","meaning":"상점","example":"复习“商店”时，我读到：“我去商店买东西。”","examplePinyin":"fùxí “shāngdiàn” shí, wǒ dúdào: “wǒ qù shāngdiàn mǎi dōngxi.”","translation":"“商店”를 복습할 때, 저는 “저는 상점에 물건을 사러 가요.”라는 문장을 읽었어요."},{"no":448,"category":"쇼핑·물건·장소","word":"超市","pinyin":"chāoshì","meaning":"슈퍼마켓","example":"学“超市”时，我写：“我去超市买东西。”","examplePinyin":"xué “chāoshì” shí, wǒ xiě: “wǒ qù chāoshì mǎi dōngxi.”","translation":"“超市”를 배울 때 저는 “저는 슈퍼마켓에 물건을 사러 가요.”라고 썼어요."},{"no":449,"category":"쇼핑·물건·장소","word":"商场","pinyin":"shāngchǎng","meaning":"쇼핑몰, 백화점","example":"老师用“商场”举例：“我去商场买衣服。”","examplePinyin":"lǎoshī yòng “shāngchǎng” jǔlì: “wǒ qù shāngchǎng mǎi yīfu.”","translation":"선생님은 “商场”를 사용해 “저는 쇼핑몰에 옷을 사러 가요.”라고 예를 들었어요."},{"no":450,"category":"쇼핑·물건·장소","word":"衣服","pinyin":"yīfu","meaning":"옷","example":"为了记住“衣服”，我写：“我想买新衣服。”","examplePinyin":"wèile jìzhu “yīfu”, wǒ xiě: “wǒ xiǎng mǎi xīn yīfu.”","translation":"“衣服”를 기억하려고 저는 “저는 새 옷을 사고 싶어요.”라고 썼어요."},{"no":451,"category":"쇼핑·물건·장소","word":"上衣","pinyin":"shàngyī","meaning":"상의","example":"复习“上衣”时，我读到：“我买了一件新上衣。”","examplePinyin":"fùxí “shàngyī” shí, wǒ dúdào: “wǒ mǎi le yí jiàn xīn shàngyī.”","translation":"“上衣”를 복습할 때, 저는 “저는 새 상의 한 벌을 샀어요.”라는 문장을 읽었어요."},{"no":452,"category":"쇼핑·물건·장소","word":"衬衫","pinyin":"chènshān","meaning":"셔츠","example":"为了记住“衬衫”，我写：“我买了一件白色衬衫。”","examplePinyin":"wèile jìzhu “chènshān”, wǒ xiě: “wǒ mǎi le yí jiàn báisè chènshān.”","translation":"“衬衫”를 기억하려고 저는 “저는 흰색 셔츠 한 벌을 샀어요.”라고 썼어요."},{"no":453,"category":"쇼핑·물건·장소","word":"大衣","pinyin":"dàyī","meaning":"외투, 코트","example":"学“大衣”时，我写：“这件大衣很漂亮。”","examplePinyin":"xué “dàyī” shí, wǒ xiě: “zhè jiàn dàyī hěn piàoliang.”","translation":"“大衣”를 배울 때 저는 “이 코트는 아주 예뻐요.”라고 썼어요."},{"no":454,"category":"쇼핑·물건·장소","word":"裤子","pinyin":"kùzi","meaning":"바지","example":"为了记住“裤子”，我写：“这条裤子很漂亮。”","examplePinyin":"wèile jìzhu “kùzi”, wǒ xiě: “zhè tiáo kùzi hěn piàoliang.”","translation":"“裤子”를 기억하려고 저는 “이 바지는 아주 예뻐요.”라고 썼어요."},{"no":455,"category":"쇼핑·물건·장소","word":"短裤","pinyin":"duǎnkù","meaning":"반바지","example":"学“短裤”时，我写：“夏天我喜欢穿短裤。”","examplePinyin":"xué “duǎnkù” shí, wǒ xiě: “xiàtiān wǒ xǐhuan chuān duǎnkù.”","translation":"“短裤”를 배울 때 저는 “저는 여름에 반바지 입는 것을 좋아해요.”라고 썼어요."},{"no":456,"category":"쇼핑·물건·장소","word":"裙子","pinyin":"qúnzi","meaning":"치마","example":"学“裙子”时，我写：“这条裙子很漂亮。”","examplePinyin":"xué “qúnzi” shí, wǒ xiě: “zhè tiáo qúnzi hěn piàoliang.”","translation":"“裙子”를 배울 때 저는 “이 치마는 아주 예뻐요.”라고 썼어요."},{"no" ":"学“黄色”时，我写：“我喜欢黄色的花。”","examplePinyin":"xué “huángsè” shí, wǒ xiě: “wǒ xǐhuan huángsè de huā.”","translation":"“黄色”를 배울 때 저는 “저는 노란색 꽃을 좋아해요.”라고 썼어요."},{"no":466,"category":"쇼핑·물건·장소","word":"蓝","pinyin":"lán","meaning":"파랗다, 파란색","example":"复习“蓝”时，我读到：“天很蓝。”","examplePinyin":"fùxí “lán” shí, wǒ dúdào: “tiān hěn lán.”","translation":"“蓝”를 복습할 때, 저는 “하늘이 아주 파래요.”라는 문장을 읽었어요."},{"no":467,"category":"쇼핑·물건·장소","word":"票","pinyin":"piào","meaning":"표, 티켓","example":"为了记住“票”，我写：“我买了两张票。”","examplePinyin":"wèile jìzhu “piào”, wǒ xiě: “wǒ mǎi le liǎng zhāng piào.”","translation":"“票”를 기억하려고 저는 “저는 표 두 장을 샀어요.”라고 썼어요."},{"no":468,"category":"쇼핑·물건·장소","word":"门票","pinyin":"ménpiào","meaning":"입장권","example":"课上学“门票”时，老师说：“我买了两张门票。”","examplePinyin":"kè shàng xué “ménpiào” shí, lǎoshī shuō: “wǒ mǎi le liǎng zhāng ménpiào.”","translation":"수업에서 “门票”를 배울 때, 선생님은 “저는 입장권 두 장을 샀어요.”라고 말씀하셨어요."},{"no":469,"category":"쇼핑·물건·장소","word":"机票","pinyin":"jīpiào","meaning":"항공권","example":"老师用“机票”举例：“我买了去中国的机票。”","examplePinyin":"lǎoshī yòng “jīpiào” jǔlì: “wǒ mǎi le qù Zhōngguó de jīpiào.”","translation":"선생님은 “机票”를 사용해 “저는 중국행 항공권을 샀어요.”라고 예를 들었어요."},{"no":470,"category":"쇼핑·물건·장소","word":"检票","pinyin":"jiǎnpiào","meaning":"표를 검사하다, 검표하다","example":"复习“检票”时，我读到：“上车前要先检票。”","examplePinyin":"fùxí “jiǎnpiào” shí, wǒ dúdào: “shàng chē qián yào xiān jiǎnpiào.”","translation":"“检票”를 복습할 때, 저는 “차에 타기 전에 먼저 표 검사를 받아야 해요.”라는 문장을 읽었어요."},{"no":471,"category":"쇼핑·물건·장소","word":"卡","pinyin":"kǎ","meaning":"카드","example":"为了记住“卡”，我写：“我用银行卡付款。”","examplePinyin":"wèile jìzhu “kǎ”, wǒ xiě: “wǒ yòng yínhángkǎ fùkuǎn.”","translation":"“卡”를 기억하려고 저는 “저는 은행 카드로 결제해요.”라고 썼어요."},{"no":472,"category":"쇼핑·물건·장소","word":"信用卡","pinyin":"xìnyòngkǎ","meaning":"신용카드","example":"老师用“信用卡”举例：“我想用信用卡付款。”","examplePinyin":"lǎoshī yòng “xìnyòngkǎ” jǔlì: “wǒ xiǎng yòng xìnyòngkǎ fùkuǎn.”","translation":"선생님은 “信用卡”를 사용해 “저는 신용카드로 결제하고 싶어요.”라고 예를 들었어요."},{"no":473,"category":"쇼핑·물건·장소","word":"银行卡","pinyin":"yínhángkǎ", "meaning":"출국하다, 외국에 가다","example":"学“出国”时，我写：“我明年想出国。”","examplePinyin":"xué “chūguó” shí, wǒ xiě: “wǒ míngnián xiǎng chūguó.”","translation":"“出国”를 배울 때 저는 “저는 내년에 외국에 가고 싶어요.”라고 썼어요."},{"no":540,"category":"이동·교통","word":"来自","pinyin":"láizì","meaning":"~에서 오다, 출신이다","example":"老师用“来自”举例：“我来自韩国。”","examplePinyin":"lǎoshī yòng “láizì” jǔlì: “wǒ láizì Hánguó.”","translation":"선생님은 “来自”를 사용해 “저는 한국에서 왔어요.”라고 예를 들었어요."},{"no":541,"category":"이동·교통","word":"酒店","pinyin":"jiǔdiàn","meaning":"호텔","example":"为了记住“酒店”，我写：“我住在这家酒店。”","examplePinyin":"wèile jìzhu “jiǔdiàn”, wǒ xiě: “wǒ zhù zài zhè jiā jiǔdiàn.”","translation":"“酒店”를 기억하려고 저는 “저는 이 호텔에 묵어요.”라고 썼어요."},{"no":542,"category":"이동·교통","word":"宾馆","pinyin":"bīnguǎn","meaning":"호텔, 숙박업소","example":"老师用“宾馆”举例：“我住在这家宾馆。”","examplePinyin":"lǎoshī yòng “bīnguǎn” jǔlì: “wǒ zhù zài zhè jiā bīnguǎn.”","translation":"선생님은 “宾馆”를 사용해 “저는 이 호텔에 묵어요.”라고 예를 들었어요."},{"no":543,"category":"이동·교통","word":"护照","pinyin":"hùzhào","meaning":"여권","example":"课上学“护照”时，老师说：“出国的时候要带护照。”","examplePinyin":"kè shàng xué “hùzhào” shí, lǎoshī shuō: “chūguó de shíhou yào dài hùzhào.”","translation":"수업에서 “护照”를 배울 때, 선생님은 “외국에 갈 때 여권을 가지고 가야 해요.”라고 말씀하셨어요."},{"no":544,"category":"이동·교통","word":"箱子","pinyin":"xiāngzi","meaning":"상자, 여행 가방","example":"老师用“箱子”举例：“箱子里有很多衣服。”","examplePinyin":"lǎoshī yòng “xiāngzi” jǔlì: “xiāngzi lǐ yǒu hěn duō yīfu.”","translation":"선생님은 “箱子”를 사용해 “상자 안에 옷이 많아요.”라고 예를 들었어요."},{"no":545,"category":"이동·교통","word":"行李","pinyin":"xíngli","meaning":"짐, 여행 가방","example":"学“行李”时，我写：“我的行李很重。”","examplePinyin":"xué “xíngli” shí, wǒ xiě: “wǒ de xíngli hěn zhòng.”","translation":"“行李”를 배울 때 저는 “제 짐은 아주 무거워요.”라고 썼어요."},{"no":546,"category":"이동·교통","word":"带","pinyin":"dài","meaning":"가지고 가다, 데리고 가다","example":"学“带”时，老师提醒：“请带上你的书。”","examplePinyin":"xué “dài” shí, lǎoshī tíxǐng: “qǐng dài shàng nǐ de shū.”","translation":"“带”를 배울 때 선생님이 “책을 가지고 가세요.”라고 당부했어요."},{"no":547,"category":"이동·교통","word":"走路","pinyin":"zǒulù","meaning":"걸어 ·공간·생활","word":"打扫","pinyin":"dǎsǎo","meaning":"청소하다","example":"老师用“打扫”举例：“我每天打扫房间。”","examplePinyin":"lǎoshī yòng “dǎsǎo” jǔlì: “wǒ měitiān dǎsǎo fángjiān.”","translation":"선생님은 “打扫”를 사용해 “저는 매일 방을 청소해요.”라고 예를 들었어요."},{"no":573,"category":"집·공간·생활","word":"扫","pinyin":"sǎo","meaning":"쓸다, 청소하다","example":"课上学“扫”时，老师说：“我每天扫地。”","examplePinyin":"kè shàng xué “sǎo” shí, lǎoshī shuō: “wǒ měitiān sǎo dì.”","translation":"수업에서 “扫”를 배울 때, 선생님은 “저는 매일 바닥을 쓸어요.”라고 말씀하셨어요."},{"no":574,"category":"집·공간·생활","word":"洗","pinyin":"xǐ","meaning":"씻다","example":"复习“洗”时，我读到：“我每天洗手。”","examplePinyin":"fùxí “xǐ” shí, wǒ dúdào: “wǒ měitiān xǐ shǒu.”","translation":"“洗”를 복습할 때, 저는 “저는 매일 손을 씻어요.”라는 문장을 읽었어요."},{"no":575,"category":"집·공간·생활","word":"洗澡","pinyin":"xǐzǎo","meaning":"목욕하다, 샤워하다","example":"课上学“洗澡”时，老师说：“我每天晚上洗澡。”","examplePinyin":"kè shàng xué “xǐzǎo” shí, lǎoshī shuō: “wǒ měitiān wǎnshang xǐzǎo.”","translation":"수업에서 “洗澡”를 배울 때, 선생님은 “저는 매일 저녁 샤워해요.”라고 말씀하셨어요."},{"no":576,"category":"집·공간·생활","word":"刷","pinyin":"shuā","meaning":"닦다, 솔질하다","example":"学“刷”时，我写：“我每天刷牙。”","examplePinyin":"xué “shuā” shí, wǒ xiě: “wǒ měitiān shuā yá.”","translation":"“刷”를 배울 때 저는 “저는 매일 이를 닦아요.”라고 썼어요."},{"no":577,"category":"집·공간·생활","word":"干净","pinyin":"gānjìng","meaning":"깨끗하다","example":"学“干净”时，我写：“这个房间很干净。”","examplePinyin":"xué “gānjìng” shí, wǒ xiě: “zhège fángjiān hěn gānjìng.”","translation":"“干净”를 배울 때 저는 “이 방은 아주 깨끗해요.”라고 썼어요."},{"no":578,"category":"집·공간·생활","word":"脏","pinyin":"zāng","meaning":"더럽다","example":"学“脏”时，我写：“这件衣服很脏。”","examplePinyin":"xué “zāng” shí, wǒ xiě: “zhè jiàn yīfu hěn zāng.”","translation":"“脏”를 배울 때 저는 “이 옷은 아주 더러워요.”라고 썼어요."},{"no":579,"category":"집·공간·생활","word":"卫生间","pinyin":"wèishēngjiān","meaning":"화장실","example":"学“卫生间”时，同学问：“请问，卫生间在哪里？”","examplePinyin":"xué “wèishēngjiān” shí, tóngxué wèn: “qǐngwèn, wèishēngjiān zài nǎlǐ?”","translation":"“卫生间”를 배울 때 친구가 “실례지만 화장실은 어디인가요?”라고 물었어요."},{"no":580,"category":"집·공간·생활","word":"洗手间","pinyin":"xǐshǒujiān","meaning":"화장실","example":"学“洗手间”时，同学问：“洗手间在哪儿？”","examplePinyin":"xué “xǐshǒujiān” shí, tóngxué wèn: “xǐshǒujiān zài nǎr?”","translation":"“洗手间”를 배울 때 친구가 “화장실이 어디에 있나요?”라고 물었어요."},{"no":581,"category":"집·공간·생활","word":"生活","pinyin":"shēnghuó","meaning":"생활, 살다","example":"复习“生活”时，我读到：“我喜欢这里的生活。”","examplePinyin":"fùxí “shēnghuó” shí, wǒ dúdào: “wǒ xǐhuan zhèlǐ de shēnghuó.”","translation":"“生活”를 복습할 때, 저는 “저는 이곳의 생활을 좋아해요.”라는 문장을 읽었어요."},{"no":582,"category":"집·공간·생활","word":"环境","pinyin":"huánjìng","meaning":"환경","example":"老师用“环境”举例：“这里的环境很好。”","examplePinyin":"lǎoshī yòng “huánjìng” jǔlì: “zhèlǐ de huánjìng hěn hǎo.”","translation":"선생님은 “环境”를 사용해 “이곳의 환경은 아주 좋아요.”라고 예를 들었어요."},{"no":583,"category":"집·공간·생활","word":"小区","pinyin":"xiǎoqū","meaning":"주거 단지, 아파트 단지","example":"复习“小区”时，我读到：“我住在这个小区。”","examplePinyin":"fùxí “xiǎoqū” shí, wǒ dúdào: “wǒ zhù zài zhège xiǎoqū.”","translation":"“小区”를 복습할 때, 저는 “저는 이 아파트 단지에 살아요.”라는 문장을 읽었어요."},{"no":584,"category":"집·공간·생활","word":"花园","pinyin":"huāyuán","meaning":"정원","example":"为了记住“花园”，我写：“我家有一个小花园。”","examplePinyin":"wèile jìzhu “huāyuán”, wǒ xiě: “wǒ jiā yǒu yí ge xiǎo huāyuán.”","translation":"“花园”를 기억하려고 저는 “우리 집에는 작은 정원이 하나 있어요.”라고 썼어요."},{"no":585,"category":"집·공간·생활","word":"园","pinyin":"yuán","meaning":"정원, 공원","example":"为了记住“园”，我写：“孩子们在幼儿园玩。”","examplePinyin":"wèile jìzhu “yuán”, wǒ xiě: “háizimen zài yòu'éryuán wán.”","translation":"“园”를 기억하려고 저는 “아이들이 유치원에서 놀고 있어요.”라고 썼어요."},{"no":586,"category":"집·공간·생활","word":"公园","pinyin":"gōngyuán","meaning":"공원","example":"老师用“公园”举例：“周末我喜欢去公园散步。”","examplePinyin":"lǎoshī yòng “gōngyuán” jǔlì: “zhōumò wǒ xǐhuan qù gōngyuán sànbù.”","translation":"선생님은 “公园”를 사용해 “저는 주말에 공원에 산책하러 가는 것을 좋아해요.”라고 예를 들었어요."},{"no":587,"category":"집·공간·생활","word":"草","pinyin":"cǎo","meaning":"풀","example":"学“草”时，我写：“这里有很多草。”","examplePinyin":"xué “cǎo” shí, wǒ xiě: “zhèlǐ yǒu hěn duō cǎo.”","translation":"“草”를 배울 때 저는 “여기에는 풀이 많아요.”라고 썼어요."},{"no":588,"category":"집·공간·생활","word":"草地","pinyin":"cǎodì","meaning":"잔디밭","example":"老师用“草地”举例：“孩子们在草地上玩。”","examplePinyin":"lǎoshī yòng “cǎodì” jǔlì: “háizimen zài cǎodì shàng wán.”","translation":"선생님은 “草地”를 사용해 “아이들이 잔디밭에서 놀고 있어요.”라고 예를 들었어요."},{"no":589,"category":"집·공간·생활","word":"树","pinyin":"shù","meaning":"나무","example":"课上学“树”时，老师说：“公园里有很多树。”","examplePinyin":"kè shàng xué “shù” shí, lǎoshī shuō: “gōngyuán lǐ yǒu hěn duō shù.”","translation":"수업에서 “树”를 배울 때, 선생님은 “공원에는 나무가 많아요.”라고 말씀하셨어요."},{"no":590,"category":"집·공간·생활","word":"花¹","pinyin":"huā","meaning":"꽃","example":"学“花¹”时，我写：“这些花很漂亮。”","examplePinyin":"xué “huā” shí, wǒ xiě: “zhèxiē huā hěn piàoliang.”","translation":"“花¹”를 배울 때 저는 “이 꽃들은 아주 예뻐요.”라고 썼어요."},{"no":591,"category":"집·공간·생활","word":"开花","pinyin":"kāihuā","meaning":"꽃이 피다","example":"课上学“开花”时，老师说：“春天花开了。”","examplePinyin":"kè shàng xué “kāihuā” shí, lǎoshī shuō: “chūntiān huā kāi le.”","translation":"수업에서 “开花”를 배울 때, 선생님은 “봄이 되어 꽃이 피었어요.”라고 말씀하셨어요."},{"no":592,"category":"집·공간·생활","word":"报纸","pinyin":"bàozhǐ","meaning":"신문","example":"课上学“报纸”时，老师说：“爸爸每天看报纸。”","examplePinyin":"kè shàng xué “bàozhǐ” shí, lǎoshī shuō: “bàba měitiān kàn bàozhǐ.”","translation":"수업에서 “报纸”를 배울 때, 선생님은 “아빠는 매일 신문을 읽어요.”라고 말씀하셨어요."},{"no":593,"category":"집·공간·생활","word":"在","pinyin":"zài","meaning":"~에 있다, ~에서","example":"复习“在”时，我读到：“我在学校。”","examplePinyin":"fùxí “zài” shí, wǒ dúdào: “wǒ zài xuéxiào.”","translation":"“在”를 복습할 때, 저는 “저는 학교에 있어요.”라는 문장을 읽었어요."},{"no":594,"category":"집·공간·생활","word":"被","pinyin":"bèi","meaning":"~에게(피동문 조사)","example":"学“被”时，我写：“我的书被他拿走了。”","examplePinyin":"xué “bèi” shí, wǒ xiě: “wǒ de shū bèi tā ná zǒu le.”","translation":"“被”를 배울 때 저는 “제 책을 그가 가져갔어요.”라고 썼어요."},{"no":595,"category":"집·공간·생활","word":"把","pinyin":"bǎ","meaning":"~을/를(처치문 조사)","example":"学“把”时，老师提醒：“请把门打开。”","examplePinyin":"xué “bǎ” shí, lǎoshī tíxǐng: “qǐng bǎ mén dǎkāi.”","translation":"“把”를 배울 때 선생님이 “문을 열어 주세요.”라고 당부했어요."},{"no":596,"category":"집·공간·생활","word":"有","pinyin":"yǒu","meaning":"있다, 가지고 있다","example":"课上学“有”时，老师说：“我有两个孩子。”","examplePinyin":"kè shàng xué “yǒu” shí, lǎoshī shuō: “wǒ yǒu liǎng ge háizi.”","translation":"수업에서 “有”를 배울 때, 선생님은 “저는 아이가 둘 있어요.”라고 말씀하셨어요."},{"no":597,"category":"건강·날씨","word":"身体","pinyin":"shēntǐ","meaning":"몸, 건강","example":"学“身体”时，同学问：“你的身体怎么样？”","examplePinyin":"xué “shēntǐ” shí, tóngxué wèn: “nǐ de shēntǐ zěnmeyàng?”","translation":"“身体”를 배울 때 친구가 “건강은 어떠세요?”라고 물었어요."},{"no":598,"category":"건강·날씨","word":"健康","pinyin":"jiànkāng","meaning":"건강하다, 건강","example":"学“健康”时，我写：“运动对身体健康有好处。”","examplePinyin":"xué “jiànkāng” shí, wǒ xiě: “yùndòng duì shēntǐ jiànkāng yǒu hǎochù.”","translation":"“健康”를 배울 때 저는 “운동은 건강에 좋아요.”라고 썼어요."},{"no":599,"category":"건강·날씨","word":"病","pinyin":"bìng","meaning":"병, 질병","example":"为了记住“病”，我写：“他的病好了。”","examplePinyin":"wèile jìzhu “bìng”, wǒ xiě: “tā de bìng hǎo le.”","translation":"“病”를 기억하려고 저는 “그의 병이 나았어요.”라고 썼어요."},{"no":600,"category":"건강·날씨","word":"生病","pinyin":"shēngbìng","meaning":"병이 나다","example":"为了记住“生病”，我写：“他今天生病了。”","examplePinyin":"wèile jìzhu “shēngbìng”, wǒ xiě: “tā jīntiān shēngbìng le.”","translation":"“生病”를 기억하려고 저는 “그는 오늘 아파요.”라고 썼어요."},{"no":601,"category":"건강·날씨","word":"病人","pinyin":"bìngrén","meaning":"환자","example":"学“病人”时，我写：“医生正在看病人。”","examplePinyin":"xué “bìngrén” shí, wǒ xiě: “yīshēng zhèngzài kàn bìngrén.”","translation":"“病人”를 배울 때 저는 “의사가 환자를 진찰하고 있어요.”라고 썼어요."},{"no":602,"category":"건강·날씨","word":"看病","pinyin":"kànbìng","meaning":"진찰받다","example":"老师用“看病”举例：“我去医院看病。”","examplePinyin":"lǎoshī yòng “kànbìng” jǔlì: “wǒ qù yīyuàn kànbìng.”","translation":"선생님은 “看病”를 사용해 “저는 병원에 진찰받으러 가요.”라고 예를 들었어요."},{"no":603,"category":"건강·날씨","word":"住院","pinyin":"zhùyuàn","meaning":"입원하다","example":"复习“住院”时，我读到：“他生病住院了。”","examplePinyin":"fùxí “zhùyuàn” shí, wǒ dúdào: “tā shēngbìng zhùyuàn le.”","translation":"“住院”를 복습할 때, 저는 “그는 아파서 입원했어요.”라는 문장을 읽었어요."},{"no":604,"category":"건강·날씨","word":"出院","pinyin":"chūyuàn","meaning":"퇴원하다","example":"学“出院”时，我写：“他明天可以出院了。”","examplePinyin":"xué “chūyuàn” shí, wǒ xiě: “tā míngtiān kěyǐ chūyuàn le.”","translation":"“出院”를 배울 때 저는 “그는 내일 퇴원할 수 있어요.”라고 썼어요."},{"no":605,"category":"건강·날씨","word":"医生","pinyin":"yīshēng","meaning":"의사","example":"课上学“医生”时，老师说：“她是医生。”","examplePinyin":"kè shàng xué “yīshēng” shí, lǎoshī shuō: “tā shì yīshēng.”","translation":"수업에서 “医生”를 배울 때, 선생님은 “그녀는 의사예요.”라고 말씀하셨어요."},{"no":606,"category":"건강·날씨","word":"医院","pinyin":"yīyuàn","meaning":"병원","example":"复习“医院”时，我读到：“我去医院看病。”","examplePinyin":"fùxí “yīyuàn” shí, wǒ dúdào: “wǒ qù yīyuàn kànbìng.”","translation":"“医院”를 복습할 때, 저는 “저는 병원에 진찰받으러 가요.”라는 문장을 읽었어요."},{"no":607,"category":"건강·날씨","word":"药","pinyin":"yào","meaning":"약","example":"学“药”时，我写：“我去买药。”","examplePinyin":"xué “yào” shí, wǒ xiě: “wǒ qù mǎi yào.”","translation":"“药”를 배울 때 저는 “저는 약을 사러 가요.”라고 썼어요."},{"no":608,"category":"건강·날씨","word":"药店","pinyin":"yàodiàn","meaning":"약국","example":"老师用“药店”举例：“药店在医院旁边。”","examplePinyin":"lǎoshī yòng “yàodiàn” jǔlì: “yàodiàn zài yīyuàn pángbiān.”","translation":"선생님은 “药店”를 사용해 “약국은 병원 옆에 있어요.”라고 예를 들었어요."},{"no":609,"category":"건강·날씨","word":"检查","pinyin":"jiǎnchá","meaning":"검사하다, 점검하다","example":"老师用“检查”举例：“医生正在给他检查身体。”","examplePinyin":"lǎoshī yòng “jiǎnchá” jǔlì: “yīshēng zhèngzài gěi tā jiǎnchá shēntǐ.”","translation":"선생님은 “检查”를 사용해 “의사가 그의 몸을 검사하고 있어요.”라고 예를 들었어요."},{"no":610,"category":"건강·날씨","word":"感冒","pinyin":"gǎnmào","meaning":"감기에 걸리다, 감기","example":"老师用“感冒”举例：“我感冒了，想休息一下。”","examplePinyin":"lǎoshī yòng “gǎnmào” jǔlì: “wǒ gǎnmào le, xiǎng xiūxi yíxià.”","translation":"선생님은 “感冒”를 사용해 “저는 감기에 걸려서 좀 쉬고 싶어요.”라고 예를 들었어요."},{"no":611,"category":"건강·날씨","word":"发烧","pinyin":"fāshāo","meaning":"열이 나다","example":"复习“发烧”时，我读到：“我发烧了，今天不能上班。”","examplePinyin":"fùxí “fāshāo” shí, wǒ dúdào: “wǒ fāshāo le, jīntiān bù néng shàngbān.”","translation":"“发烧”를 복습할 때, 저는 “저는 열이 나서 오늘 출근할 수 없어요.”라는 문장을 읽었어요."},{"no":612,"category":"건강·날씨","word":"疼","pinyin":"téng","meaning":"아프다","example":"复习“疼”时，我读到：“我的头很疼。”","examplePinyin":"fùxí “téng” ·소통","word":"讲","pinyin":"jiǎng","meaning":"말하다, 설명하다","example":"课上学“讲”时，老师说：“老师正在讲课。”","examplePinyin":"kè shàng xué “jiǎng” shí, lǎoshī shuō: “lǎoshī zhèngzài jiǎng kè.”","translation":"수업에서 “讲”를 배울 때, 선생님은 “선생님이 수업을 설명하고 계세요.”라고 말씀하셨어요."},{"no":655,"category":"여가·미디어·소통","word":"聊","pinyin":"liáo","meaning":"이야기하다, 수다 떨다","example":"学“聊”时，我写：“我想和你聊一聊。”","examplePinyin":"xué “liáo” shí, wǒ xiě: “wǒ xiǎng hé nǐ liáo yi liáo.”","translation":"“聊”를 배울 때 저는 “저는 당신과 이야기를 나누고 싶어요.”라고 썼어요."},{"no":656,"category":"여가·미디어·소통","word":"聊天儿","pinyin":"liáotiānr","meaning":"수다 떨다, 이야기하다","example":"复习“聊天儿”时，我读到：“我喜欢和朋友聊天儿。”","examplePinyin":"fùxí “liáotiānr” shí, wǒ dúdào: “wǒ xǐhuan hé péngyou liáotiānr.”","translation":"“聊天儿”를 복습할 때, 저는 “저는 친구와 이야기하는 것을 좋아해요.”라는 문장을 읽었어요."},{"no":657,"category":"여가·미디어·소통","word":"问","pinyin":"wèn","meaning":"묻다","example":"学“问”时，我写：“我想问老师。”","examplePinyin":"xué “wèn” shí, wǒ xiě: “wǒ xiǎng wèn lǎoshī.”","translation":"“问”를 배울 때 저는 “저는 선생님께 묻고 싶어요.”라고 썼어요."},{"no":658,"category":"여가·미디어·소통","word":"回答","pinyin":"huídá","meaning":"대답하다","example":"学“回答”时，老师提醒：“请回答我的问题。”","examplePinyin":"xué “huídá” shí, lǎoshī tíxǐng: “qǐng huídá wǒ de wèntí.”","translation":"“回答”를 배울 때 선생님이 “제 질문에 대답해 주세요.”라고 당부했어요."},{"no":659,"category":"여가·미디어·소통","word":"告诉","pinyin":"gàosu","meaning":"알려주다","example":"学“告诉”时，老师提醒：“请告诉我你的名字。”","examplePinyin":"xué “gàosu” shí, lǎoshī tíxǐng: “qǐng gàosu wǒ nǐ de míngzi.”","translation":"“告诉”를 배울 때 선생님이 “이름을 알려 주세요.”라고 당부했어요."},{"no":660,"category":"여가·미디어·소통","word":"听说","pinyin":"tīngshuō","meaning":"듣자 하니, ~라고 들었다","example":"课上学“听说”时，老师说：“听说你要去中国。”","examplePinyin":"kè shàng xué “tīngshuō” shí, lǎoshī shuō: “tīngshuō nǐ yào qù Zhōngguó.”","translation":"수업에서 “听说”를 배울 때, 선생님은 “당신이 중국에 간다고 들었어요.”라고 말씀하셨어요."},{"no":661,"category":"여가·미디어·소통","word":"对话","pinyin":"duìhuà","meaning":"대화","example":"复习“对话”时，我读到：“我们练习汉语对话。”","examplePinyin":"fùxí “duìhuà” shí, wǒ dúdào: “wǒmen liànxí Hànyǔ duìhuà.”","translation":"“对话”를 복습할 때, 저는 “우리는 중국어 대화를 연습해요.”라는 문장을 읽었어요."},{"no":662,"category":"여가·미디어·소통","word":"电话","pinyin":"diànhuà","meaning":"전화","example":"学“电话”时，我写：“我给妈妈打电话。”","examplePinyin":"xué “diànhuà” shí, wǒ xiě: “wǒ gěi māma dǎ diànhuà.”","translation":"“电话”를 배울 때 저는 “저는 엄마에게 전화해요.”라고 썼어요."},{"no":663,"category":"여가·미디어·소통","word":"打电话","pinyin":"dǎ diànhuà","meaning":"전화하다","example":"老师用“打电话”举例：“我给妈妈打电话。”","examplePinyin":"lǎoshī yòng “dǎ diànhuà” jǔlì: “wǒ gěi māma dǎ diànhuà.”","translation":"선생님은 “打电话”를 사용해 “저는 엄마에게 전화해요.”라고 예를 들었어요."},{"no":664,"category":"여가·미디어·소통","word":"手机","pinyin":"shǒujī","meaning":"휴대전화","example":"学“手机”时，我写：“这是我的手机。”","examplePinyin":"xué “shǒujī” shí, wǒ xiě: “zhè shì wǒ de shǒujī.”","translation":"“手机”를 배울 때 저는 “이것은 제 휴대전화예요.”라고 썼어요."},{"no":665,"category":"여가·미디어·소통","word":"电脑","pinyin":"diànnǎo","meaning":"컴퓨터","example":"老师用“电脑”举例：“这是我的电脑。”","examplePinyin":"lǎoshī yòng “diànnǎo” jǔlì: “zhè shì wǒ de diànnǎo.”","translation":"선생님은 “电脑”를 사용해 “이것은 제 컴퓨터예요.”라고 예를 들었어요."},{"no":666,"category":"여가·미디어·소통","word":"上网","pinyin":"shàngwǎng","meaning":"인터넷을 하다","example":"学“上网”时，我写：“我晚上上网。”","examplePinyin":"xué “shàngwǎng” shí, wǒ xiě: “wǒ wǎnshang shàngwǎng.”","translation":"“上网”를 배울 때 저는 “저는 저녁에 인터넷을 해요.”라고 썼어요."},{"no":667,"category":"여가·미디어·소통","word":"网上","pinyin":"wǎngshàng","meaning":"인터넷상에서","example":"课上学“网上”时，老师说：“我在网上买东西。”","examplePinyin":"kè shàng xué “wǎngshàng” shí, lǎoshī shuō: “wǒ zài wǎngshàng mǎi dōngxi.”","translation":"수업에서 “网上”를 배울 때, 선생님은 “저는 인터넷에서 물건을 사요.”라고 말씀하셨어요."},{"no":668,"category":"여가·미디어·소통","word":"网站","pinyin":"wǎngzhàn","meaning":"웹사이트","example":"老师用“网站”举例：“这个网站很有用。”","examplePinyin":"lǎoshī yòng “wǎngzhàn” jǔlì: “zhège wǎngzhàn hěn yǒuyòng.”","translation":"선생님은 “网站”를 사용해 “이 웹사이트는 아주 유용해요.”라고 예를 들었어요."},{"no":669,"category":"여가·미디어·소통","word":"邮件","pinyin":"yóujiàn","meaning":"이메일, 우편물","example":"复习“邮件”时，我读到：“我给老师发了邮件。”","examplePinyin":"fùxí “yóujiàn” shí, wǒ dúdào: “wǒ gěi lǎoshī fā le yóujiàn.”","translation":"“邮件”를 복습할 때, 저는 “저는 선생님께 이메일을 보냈어요.”라는 문장을 읽었어요."},{"no":670,"category":"여가·미디어·소통","word":"邮箱","pinyin":"yóuxiāng","meaning":"이메일함, 우편함","example":"学“邮箱”时，老师提醒：“请告诉我你的邮箱地址。”","examplePinyin":"xué “yóuxiāng” shí, lǎoshī tíxǐng: “qǐng gàosu wǒ nǐ de yóuxiāng dìzhǐ.”","translation":"“邮箱”를 배울 때 선생님이 “이메일 주소를 알려 주세요.”라고 당부했어요."},{"no":671,"category":"여가·미디어·소통","word":"信","pinyin":"xìn","meaning":"편지","example":"复习“信”时，我读到：“我给朋友写了一封信。”","examplePinyin":"fùxí “xìn” shí, wǒ dúdào: “wǒ gěi péngyou xiě le yì fēng xìn.”","translation":"“信”를 복습할 때, 저는 “저는 친구에게 편지 한 통을 썼어요.”라는 문장을 읽었어요."},{"no":672,"category":"여가·미디어·소통","word":"电视","pinyin":"diànshì","meaning":"텔레비전","example":"复习“电视”时，我读到：“我晚上看电视。”","examplePinyin":"fùxí “diànshì” shí, wǒ dúdào: “wǒ wǎnshang kàn diànshì.”","translation":"“电视”를 복습할 때, 저는 “저는 저녁에 TV를 봐요.”라는 문장을 읽었어요."},{"no":673,"category":"여가·미디어·소통","word":"电影","pinyin":"diànyǐng","meaning":"영화","example":"为了记住“电影”，我写：“我喜欢看电影。”","examplePinyin":"wèile jìzhu “diànyǐng”, wǒ xiě: “wǒ xǐhuan kàn diànyǐng.”","translation":"“电影”를 기억하려고 저는 “저는 영화 보는 것을 좋아해요.”라고 썼어요."},{"no":674,"category":"여가·미디어·소통","word":"电影院","pinyin":"diànyǐngyuàn","meaning":"영화관","example":"课上学“电影院”时，老师说：“我们去电影院吧。”","examplePinyin":"kè shàng xué “diànyǐngyuàn” shí, lǎoshī shuō: “wǒmen qù diànyǐngyuàn ba.”","translation":"수업에서 “电影院”를 배울 때, 선생님은 “우리 영화관에 가요.”라고 말씀하셨어요."},{"no":675,"category":"여가·미디어·소통","word":"节目","pinyin":"jiémù","meaning":"프로그램, 공연","example":"为了记住“节目”，我写：“这个电视节目很有意思。”","examplePinyin":"wèile jìzhu “jiémù”, wǒ xiě: “zhège diànshì jiémù hěn yǒu yìsi.”","translation":"“节目”를 기억하려고 저는 “이 TV 프로그램은 아주 재미있어요.”라고 썼어요."},{"no":676,"category":"여가·미디어·소통","word":"新闻","pinyin":"xīnwén","meaning":"뉴스, 소식","example":"课上学“新闻”时，老师说：“我每天看新闻。”","examplePinyin":"kè shàng xué “xīnwén” shí, lǎoshī shuō: “wǒ měitiān kàn xīnwén.”","translation":"수업에서 “新闻”를 배울 때, 선생님은 “저는 매일 뉴스를 봐요.”라고 말씀하셨어요."},{"no":677,"category":"여가·미디어·소통","word":"表演","pinyin":"biǎoyǎn","meaning":"공연하다, 공연","example":"复习“表演”时，我读到：“她喜欢表演。”","examplePinyin":"fùxí “biǎoyǎn” shí, wǒ dúdào: “tā xǐhuan biǎoyǎn.”","translation":"“表演”를 복습할 때, 저는 “그녀는 공연하는 것을 좋아해요.”라는 문장을 읽었어요."},{"no":678,"category":"여가·미디어·소통","word":"晚会","pinyin":"wǎnhuì","meaning":"야회, 저녁 행사","example":"复习“晚会”时，我读到：“学校今晚有晚会。”","examplePinyin":"fùxí “wǎnhuì” shí, wǒ dúdào: “xuéxiào jīnwǎn yǒu wǎnhuì.”","translation":"“晚会”를 복습할 때, 저는 “학교에서 오늘 밤 행사가 있어요.”라는 문장을 읽었어요."},{"no":679,"category":"여가·미디어·소통","word":"音乐","pinyin":"yīnyuè","meaning":"음악","example":"老师用“音乐”举例：“我喜欢听音乐。”","examplePinyin":"lǎoshī yòng “yīnyuè” jǔlì: “wǒ xǐhuan tīng yīnyuè.”","translation":"선생님은 “音乐”를 사용해 “저는 음악 듣는 것을 좋아해요.”라고 예를 들었어요."},{"no":680,"category":"여가·미디어·소통","word":"歌","pinyin":"gē","meaning":"노래","example":"学“歌”时，我写：“这首歌很好听。”","examplePinyin":"xué “gē” shí, wǒ xiě: “zhè shǒu gē hěn hǎotīng.”","translation":"“歌”를 배울 때 저는 “이 노래는 듣기 좋아요.”라고 썼어요."},{"no":681,"category":"여가·미디어·소통","word":"唱","pinyin":"chàng","meaning":"노래하다","example":"课上学“唱”时，老师说：“她喜欢唱歌。”","examplePinyin":"kè shàng xué “chàng” shí, lǎoshī shuō: “tā xǐhuan chànggē.”","translation":"수업에서 “唱”를 배울 때, 선생님은 “그녀는 노래하는 것을 좋아해요.”라고 말씀하셨어요."},{"no":682,"category":"여가·미디어·소통","word":"好听","pinyin":"hǎotīng","meaning":"듣기 좋다","example":"老师用“好听”举例：“这首歌很好听。”","examplePinyin":"lǎoshī yòng “hǎotīng” jǔlì: “zhè shǒu gē hěn hǎotīng.”","translation":"선생님은 “好听”를 사용해 “이 노래는 듣기 좋아요.”라고 예를 들었어요."},{"no":683,"category":"여가·미디어·소통","word":"难听","pinyin":"nántīng","meaning":"듣기 싫다, 듣기 거북하다","example":"学“难听”时，我写：“他说的话很难听。”","examplePinyin":"xué “nántīng” shí, wǒ xiě: “tā shuō de huà hěn nántīng.”","translation":"“难听”를 배울 때 저는 “그가 한 말은 듣기 거북해요.”라고 썼어요."},{"no":684,"category":"여가·미디어·소통","word":"跳舞","pinyin":"tiàowǔ","meaning":"춤추다","example":"老师用“跳舞”举例：“她喜欢跳舞。”","examplePinyin":"lǎoshī yòng “tiàowǔ” jǔlì: “tā xǐhuan tiàowǔ.”","translation":"선생님은 “跳舞”를 사용해 “그녀는 춤추는 것을 좋아해요.”라고 예를 들었어요."},{"no":685,"category":"여가·미디어·소통","word":"照片","pinyin":"zhàopiàn","meaning":"사진","example":"学“照片”时，我写：“这是我的家庭照片。”","examplePinyin":"xué “zhàopiàn” shí, wǒ xiě: “zhè shì wǒ de jiātíng zhàopiàn.”","translation":"“照片”를 배울 때 저는 “이것은 제 가족사진이에요.”라고 썼어요."},{"no":686,"category":"여가·미디어·소통","word":"照相","pinyin":"zhàoxiàng","meaning":"사진을 찍다","example":"老师用“照相”举例：“我们在公园照相。”","examplePinyin":"lǎoshī yòng “zhàoxiàng” jǔlì: “wǒmen zài gōngyuán zhàoxiàng.”","translation":"선생님은 “照相”를 사용해 “우리는 공원에서 사진을 찍어요.”라고 예를 들었어요."},{"no":687,"category":"여가·미디어·소통","word":"拍照","pinyin":"pāizhào","meaning":"사진을 찍다","example":"课上学“拍照”时，老师说：“我们一起拍照吧。”","examplePinyin":"kè shàng xué “pāizhào” shí, lǎoshī shuō: “wǒmen yìqǐ pāizhào ba.”","translation":"수업에서 “拍照”를 배울 때, 선생님은 “우리 함께 사진을 찍어요.”라고 말씀하셨어요."},{"no":688,"category":"여가·미디어·소통","word":"相机","pinyin":"xiàngjī","meaning":"카메라","example":"为了记住“相机”，我写：“我买了一台新相机。”","examplePinyin":"wèile jìzhu “xiàngjī”, wǒ xiě: “wǒ mǎi le yì tái xīn xiàngjī.”","translation":"“相机”를 기억하려고 저는 “저는 새 카메라 한 대를 샀어요.”라고 썼어요."},{"no":689,"category":"여가·미디어·소통","word":"画","pinyin":"huà","meaning":"그리다, 그림","example":"课上学“画”时，老师说：“我喜欢画画。”","examplePinyin":"kè shàng xué “huà” shí, lǎoshī shuō: “wǒ xǐhuan huà huà.”","translation":"수업에서 “画”를 배울 때, 선생님은 “저는 그림 그리는 것을 좋아해요.”라고 말씀하셨어요."},{"no":690,"category":"여가·미디어·소통","word":"画家","pinyin":"huàjiā","meaning":"화가","example":"复习“画家”时，我读到：“我爸爸是一名画家。”","examplePinyin":"fùxí “huàjiā” shí, wǒ dúdào: “wǒ bàba shì yì míng huàjiā.”","translation":"“画家”를 복습할 때, 저는 “제 아빠는 화가예요.”라는 문장을 읽었어요."},{"no":691,"category":"여가·미디어·소통","word":"玩","pinyin":"wán","meaning":"놀다","example":"学“玩”时，我写：“孩子们在外边玩。”","examplePinyin":"xué “wán” shí, wǒ xiě: “háizimen zài wàibian wán.”","translation":"“玩”를 배울 때 저는 “아이들이 밖에서 놀고 있어요.”라고 썼어요."},{"no":692,"category":"여가·미디어·소통","word":"好玩儿","pinyin":"hǎowánr","meaning":"재미있다","example":"复习“好玩儿”时，我读到：“这里很好玩儿。”","examplePinyin":"fùxí “hǎowánr” shí, wǒ dúdào: “zhèlǐ hěn hǎowánr.”","translation":"“好玩儿”를 복습할 때, 저는 “여기는 재미있어요.”라는 문장을 읽었어요."},{"no":693,"category":"여가·미디어·소통","word":"有意思","pinyin":"yǒu yìsi","meaning":"재미있다, 흥미롭다","example":"老师用“有意思”举例：“这个电影很有意思。”","examplePinyin":"lǎoshī yòng “yǒu yìsi” jǔlì: “zhège diànyǐng hěn yǒu yìsi.”","translation":"선생님은 “有意思”를 사용해 “이 영화는 아주 재미있어요.”라고 예를 들었어요."},{"no":694,"category":"여가·미디어·소통","word":"没意思","pinyin":"méi yìsi","meaning":"재미없다","example":"老师用“没意思”举例：“这个电影没意思。”","examplePinyin":"lǎoshī yòng “méi yìsi” jǔlì: “zhège diànyǐng méi yìsi.”","translation":"선생님은 “没意思”를 사용해 “이 영화는 재미없어요.”라고 예를 들었어요."},{"no":695,"category":"여가·미디어·소통","word":"游戏","pinyin":"yóuxì","meaning":"게임, 놀이","example":"学“游戏”时，我写：“孩子们喜欢玩游戏。”","examplePinyin":"xué “yóuxì” shí, wǒ xiě: “háizimen xǐhuan wán yóuxì.”","translation":"“游戏”를 배울 때 저는 “아이들은 게임하는 것을 좋아해요.”라고 썼어요."},{"no":696,"category":"여가·미디어·소통","word":"爱好","pinyin":"àihào","meaning":"취미","example":"课上学“爱好”时，老师说：“我的爱好是看书。”","examplePinyin":"kè shàng xué “àihào” shí, lǎoshī shuō: “wǒ de àihào shì kàn shū.”","translation":"수업에서 “爱好”를 배울 때, 선생님은 “제 취미는 독서예요.”라고 말씀하셨어요."},{"no":697,"category":"여가·미디어·소통","word":"兴趣","pinyin":"xìngqù","meaning":"흥미, 관심","example":"老师用“兴趣”举例：“我对音乐很有兴趣。”","examplePinyin":"lǎoshī yòng “xìngqù” jǔlì: “wǒ duì yīnyuè hěn yǒu xìngqù.”","translation":"선생님은 “兴趣”를 사용해 “저는 음악에 관심이 많아요.”라고 예를 들었어요."},{"no":698,"category":"여가·미디어·소통","word":"感兴趣","pinyin":"gǎn xìngqù","meaning":"흥미를 느끼다, 관심이 있다","example":"学“感兴趣”时，我写：“我对中国文化很感兴趣。”","examplePinyin":"xué “gǎn xìngqù” shí, wǒ xiě: “wǒ duì Zhōngguó wénhuà hěn gǎn xìngqù.”","translation":"“感兴趣”를 배울 때 저는 “저는 중국 문화에 관심이 많아요.”라고 썼어요."},{"no":699,"category":"여가·미디어·소통","word":"跑","pinyin":"pǎo","meaning":"달리다","example":"老师用“跑”举例：“他跑得很快。”","examplePinyin":"lǎoshī yòng “pǎo” jǔlì: “tā pǎo de hěn kuài.”","translation":"선생님은 “跑”를 사용해 “그는 아주 빨리 달려요.”라고 예를 들었어요."},{"no":700,"category":"여가·미디어·소통","word":"跑步","pinyin":"pǎobù","meaning":"달리기하다","example":"复习“跑步”时，我读到：“我每天早上跑步。”","examplePinyin":"fùxí “pǎobù” shí, wǒ dúdào: “wǒ měitiān zǎoshang pǎobù.”","translation":"“跑步”를 복습할 때, 저는 “저는 매일 아침 달리기를 해요.”라는 문장을 읽었어요."},{"no":701,"category":"여가·미디어·소통","word":"游","pinyin":"yóu","meanin “我们明天见面吧。”","examplePinyin":"lǎoshī yòng “jiànmiàn” jǔlì: “wǒmen míngtiān jiànmiàn ba.”","translation":"선생님은 “见面”를 사용해 “우리 내일 만나요.”라고 예를 들었어요."},{"no":718,"category":"동작·감각·생각","word":"遇见","pinyin":"yùjiàn","meaning":"우연히 만나다","example":"课上学“遇见”时，老师说：“我在公园遇见了老师。”","examplePinyin":"kè shàng xué “yùjiàn” shí, lǎoshī shuō: “wǒ zài gōngyuán yùjiàn le lǎoshī.”","translation":"수업에서 “遇见”를 배울 때, 선생님은 “저는 공원에서 선생님을 만났어요.”라고 말씀하셨어요."},{"no":719,"category":"동작·감각·생각","word":"遇到","pinyin":"yùdào","meaning":"만나다, 마주치다","example":"老师用“遇到”举例：“今天我遇到了老朋友。”","examplePinyin":"lǎoshī yòng “yùdào” jǔlì: “jīntiān wǒ yùdào le lǎo péngyou.”","translation":"선생님은 “遇到”를 사용해 “저는 오늘 오랜 친구를 만났어요.”라고 예를 들었어요."},{"no":720,"category":"동작·감각·생각","word":"认识","pinyin":"rènshi","meaning":"알다, 알게 되다","example":"复习“认识”时，我读到：“我认识王老师。”","examplePinyin":"fùxí “rènshi” shí, wǒ dúdào: “wǒ rènshi Wáng lǎoshī.”","translation":"“认识”를 복습할 때, 저는 “저는 왕 선생님을 알아요.”라는 문장을 읽었어요."},{"no":721,"category":"동작·감각·생각","word":"认得","pinyin":"rènde","meaning":"알아보다, 알다","example":"复习“认得”时，我读到：“我认得这个人。”","examplePinyin":"fùxí “rènde” shí, wǒ dúdào: “wǒ rènde zhège rén.”","translation":"“认得”를 복습할 때, 저는 “저는 이 사람을 알아요.”라는 문장을 읽었어요."},{"no":722,"category":"동작·감각·생각","word":"了解","pinyin":"liǎojiě","meaning":"이해하다, 알아보다","example":"老师用“了解”举例：“我想了解中国文化。”","examplePinyin":"lǎoshī yòng “liǎojiě” jǔlì: “wǒ xiǎng liǎojiě Zhōngguó wénhuà.”","translation":"선생님은 “了解”를 사용해 “저는 중국 문화를 알아보고 싶어요.”라고 예를 들었어요."},{"no":723,"category":"동작·감각·생각","word":"知道","pinyin":"zhīdào","meaning":"알다","example":"课上学“知道”时，老师说：“我知道他是谁。”","examplePinyin":"kè shàng xué “zhīdào” shí, lǎoshī shuō: “wǒ zhīdào tā shì shéi.”","translation":"수업에서 “知道”를 배울 때, 선생님은 “저는 그가 누구인지 알아요.”라고 말씀하셨어요."},{"no":724,"category":"동작·감각·생각","word":"懂得","pinyin":"dǒngde","meaning":"이해하다, 알다","example":"复习“懂得”时，我读到：“他懂得很多道理。”","examplePinyin":"fùxí “dǒngde” shí, wǒ dúdào: “tā dǒngde hěn duō dàolǐ.”","translation":"“懂得”를 복습할 때, 저는 “그는 많은 이치를 이해하고 있어요.”라는 문장을 읽었어요."},{"no":725,"category":"동작·감각·생각","word":"听","pinyin":"tīng","meaning":"듣다","example":"学“听”时，我写：“我喜欢听歌。”","examplePinyin":"xué “tīng” shí, wǒ xiě: “wǒ xǐhuan tīng gē.”","translation":"“听”를 배울 때 저는 “저는 노래 듣는 것을 좋아해요.”라고 썼어요."},{"no":726,"category":"동작·감각·생각","word":"听见","pinyin":"tīngjiàn","meaning":"듣다, 들리다","example":"老师用“听见”举例：“我听见他说话了。”","examplePinyin":"lǎoshī yòng “tīngjiàn” jǔlì: “wǒ tīngjiàn tā shuōhuà le.”","translation":"선생님은 “听见”를 사용해 “저는 그가 말하는 것을 들었어요.”라고 예를 들었어요."},{"no":727,"category":"동작·감각·생각","word":"想","pinyin":"xiǎng","meaning":"생각하다, ~하고 싶다","example":"学“想”时，我写：“我想去中国。”","examplePinyin":"xué “xiǎng” shí, wǒ xiě: “wǒ xiǎng qù Zhōngguó.”","translation":"“想”를 배울 때 저는 “저는 중국에 가고 싶어요.”라고 썼어요."},{"no":728,"category":"동작·감각·생각","word":"觉得","pinyin":"juéde","meaning":"느끼다, 생각하다","example":"复习“觉得”时，我读到：“我觉得这个很好。”","examplePinyin":"fùxí “juéde” shí, wǒ dúdào: “wǒ juéde zhège hěn hǎo.”","translation":"“觉得”를 복습할 때, 저는 “저는 이것이 좋다고 생각해요.”라는 문장을 읽었어요."},{"no":729,"category":"동작·감각·생각","word":"认为","pinyin":"rènwéi","meaning":"~라고 생각하다","example":"为了记住“认为”，我写：“我认为这个办法很好。”","examplePinyin":"wèile jìzhu “rènwéi”, wǒ xiě: “wǒ rènwéi zhège bànfǎ hěn hǎo.”","translation":"“认为”를 기억하려고 저는 “저는 이 방법이 좋다고 생각해요.”라고 썼어요."},{"no":730,"category":"동작·감각·생각","word":"以为","pinyin":"yǐwéi","meaning":"~인 줄 알다","example":"学“以为”时，我写：“我以为今天是星期五。”","examplePinyin":"xué “yǐwéi” shí, wǒ xiě: “wǒ yǐwéi jīntiān shì xīngqīwǔ.”","translation":"“以为”를 배울 때 저는 “저는 오늘이 금요일인 줄 알았어요.”라고 썼어요."},{"no":731,"category":"동작·감각·생각","word":"感到","pinyin":"gǎndào","meaning":"느끼다","example":"老师用“感到”举例：“我感到很高兴。”","examplePinyin":"lǎoshī yòng “gǎndào” jǔlì: “wǒ gǎndào hěn gāoxìng.”","translation":"선생님은 “感到”를 사용해 “저는 매우 기쁘게 느껴요.”라고 예를 들었어요."},{"no":732,"category":"동작·감각·생각","word":"记","pinyin":"jì","meaning":"기억하다, 기록하다","example":"学“记”时，老师提醒：“请记一下我的电话号码。”","examplePinyin":"xué “jì” shí, lǎoshī tíxǐng: “qǐng jì yíxià wǒ de diànhuà hàomǎ.”","translation":"“记”를 배울 때 선생님이 “제 전화번호를 적어 주세요.”라고 당부했어요."},{"no":733,"category":"동작·감각·생각","word":"记 바라요.”라는 문장을 읽었어요."},{"no":741,"category":"동작·감각·생각","word":"要","pinyin":"yào","meaning":"원하다, 필요하다","example":"为了记住“要”，我写：“我要一杯茶。”","examplePinyin":"wèile jìzhu “yào”, wǒ xiě: “wǒ yào yì bēi chá.”","translation":"“要”를 기억하려고 저는 “차 한 잔 주세요.”라고 썼어요."},{"no":742,"category":"동작·감각·생각","word":"需要","pinyin":"xūyào","meaning":"필요하다","example":"为了记住“需要”，我写：“我需要你的帮助。”","examplePinyin":"wèile jìzhu “xūyào”, wǒ xiě: “wǒ xūyào nǐ de bāngzhù.”","translation":"“需要”를 기억하려고 저는 “저는 당신의 도움이 필요해요.”라고 썼어요."},{"no":743,"category":"동작·감각·생각","word":"能","pinyin":"néng","meaning":"~할 수 있다","example":"学“能”时，同学问：“你今天能来吗？”","examplePinyin":"xué “néng” shí, tóngxué wèn: “nǐ jīntiān néng lái ma?”","translation":"“能”를 배울 때 친구가 “오늘 올 수 있어요?”라고 물었어요."},{"no":744,"category":"동작·감각·생각","word":"会","pinyin":"huì","meaning":"~할 줄 알다","example":"为了记住“会”，我写：“我会说中文。”","examplePinyin":"wèile jìzhu “huì”, wǒ xiě: “wǒ huì shuō Zhōngwén.”","translation":"“会”를 기억하려고 저는 “저는 중국어를 할 줄 알아요.”라고 썼어요."},{"no":745,"category":"동작·감각·생각","word":"可以","pinyin":"kěyǐ","meaning":"~할 수 있다, ~해도 된다","example":"学“可以”时，同学问：“我可以坐这儿吗？”","examplePinyin":"xué “kěyǐ” shí, tóngxué wèn: “wǒ kěyǐ zuò zhèr ma?”","translation":"“可以”를 배울 때 친구가 “제가 여기 앉아도 될까요?”라고 물었어요."},{"no":746,"category":"동작·감각·생각","word":"可","pinyin":"kě","meaning":"~할 수 있다, 정말","example":"学“可”时，我写：“这可不是小事。”","examplePinyin":"xué “kě” shí, wǒ xiě: “zhè kě bú shì xiǎo shì.”","translation":"“可”를 배울 때 저는 “이건 결코 작은 일이 아니에요.”라고 썼어요."},{"no":747,"category":"동작·감각·생각","word":"行","pinyin":"xíng","meaning":"괜찮다, 가능하다","example":"学“行”时，同学问：“明天见面，行吗？”","examplePinyin":"xué “xíng” shí, tóngxué wèn: “míngtiān jiànmiàn, xíng ma?”","translation":"“行”를 배울 때 친구가 “내일 만나는 것 괜찮나요?”라고 물었어요."},{"no":748,"category":"동작·감각·생각","word":"必须","pinyin":"bìxū","meaning":"반드시 ~해야 한다","example":"学“必须”时，我写：“你必须早点儿来。”","examplePinyin":"xué “bìxū” shí, wǒ xiě: “nǐ bìxū zǎo diǎnr lái.”","translation":"“必须”를 배울 때 저는 “당신은 반드시 조금 일찍 와야 해요.”라고 썼어요."},{"no":749,"category":"동작·감각·생각","word":"应该","pinyin":"yīngg 마중하러 공항에 가요.”라고 썼어요."},{"no":765,"category":"동작·감각·생각","word":"收","pinyin":"shōu","meaning":"받다, 거두다","example":"学“收”时，老师提醒：“请收好你的东西。”","examplePinyin":"xué “shōu” shí, lǎoshī tíxǐng: “qǐng shōu hǎo nǐ de dōngxi.”","translation":"“收”를 배울 때 선생님이 “물건을 잘 챙겨 주세요.”라고 당부했어요."},{"no":766,"category":"동작·감각·생각","word":"收到","pinyin":"shōudào","meaning":"받다, 수령하다","example":"为了记住“收到”，我写：“我收到你的邮件了。”","examplePinyin":"wèile jìzhu “shōudào”, wǒ xiě: “wǒ shōudào nǐ de yóujiàn le.”","translation":"“收到”를 기억하려고 저는 “당신의 이메일을 받았어요.”라고 썼어요."},{"no":767,"category":"동작·감각·생각","word":"得到","pinyin":"dédào","meaning":"얻다, 받다","example":"复习“得到”时，我读到：“我得到了一份礼物。”","examplePinyin":"fùxí “dédào” shí, wǒ dúdào: “wǒ dédào le yí fèn lǐwù.”","translation":"“得到”를 복습할 때, 저는 “저는 선물 하나를 받았어요.”라는 문장을 읽었어요."},{"no":768,"category":"동작·감각·생각","word":"受到","pinyin":"shòudào","meaning":"받다, 입다","example":"复习“受到”时，我读到：“他受到了老师的表扬。”","examplePinyin":"fùxí “shòudào” shí, wǒ dúdào: “tā shòudào le lǎoshī de biǎoyáng.”","translation":"“受到”를 복습할 때, 저는 “그는 선생님의 칭찬을 받았어요.”라는 문장을 읽었어요."},{"no":769,"category":"동작·감각·생각","word":"受","pinyin":"shòu","meaning":"받다, 당하다","example":"课上学“受”时，老师说：“他受了伤。”","examplePinyin":"kè shàng xué “shòu” shí, lǎoshī shuō: “tā shòu le shāng.”","translation":"수업에서 “受”를 배울 때, 선생님은 “그는 부상을 입었어요.”라고 말씀하셨어요."},{"no":770,"category":"동작·감각·생각","word":"还","pinyin":"huán","meaning":"돌려주다, 갚다","example":"为了记住“还”，我写：“明天我还你这本书。”","examplePinyin":"wèile jìzhu “huán”, wǒ xiě: “míngtiān wǒ huán nǐ zhè běn shū.”","translation":"“还”를 기억하려고 저는 “내일 이 책을 돌려드릴게요.”라고 썼어요."},{"no":771,"category":"동작·감각·생각","word":"还","pinyin":"hái","meaning":"아직, 또","example":"为了记住“还”，我写：“他还在学校。”","examplePinyin":"wèile jìzhu “hái”, wǒ xiě: “tā hái zài xuéxiào.”","translation":"“还”를 기억하려고 저는 “그는 아직 학교에 있어요.”라고 썼어요."},{"no":772,"category":"동작·감각·생각","word":"借","pinyin":"jiè","meaning":"빌리다","example":"复习“借”时，我读到：“我想借一本书。”","examplePinyin":"fùxí “jiè” shí, wǒ dúdào: “wǒ xiǎng jiè yì běn shū.”","translation":"“借”를 복습할 때, 저는 “저는 책 한 권을 빌 ion":"수업에서 “找”를 배울 때, 선생님은 “저는 제 휴대전화를 찾고 있어요.”라고 말씀하셨어요."},{"no":781,"category":"동작·감각·생각","word":"查","pinyin":"chá","meaning":"조사하다, 찾아보다","example":"为了记住“查”，我写：“我查一下词典。”","examplePinyin":"wèile jìzhu “chá”, wǒ xiě: “wǒ chá yíxià cídiǎn.”","translation":"“查”를 기억하려고 저는 “저는 사전을 한번 찾아볼게요.”라고 썼어요."},{"no":782,"category":"동작·감각·생각","word":"发现","pinyin":"fāxiàn","meaning":"발견하다, 알아차리다","example":"课上学“发现”时，老师说：“我发现了一个问题。”","examplePinyin":"kè shàng xué “fāxiàn” shí, lǎoshī shuō: “wǒ fāxiàn le yí ge wèntí.”","translation":"수업에서 “发现”를 배울 때, 선생님은 “저는 문제 하나를 발견했어요.”라고 말씀하셨어요."},{"no":783,"category":"동작·감각·생각","word":"解决","pinyin":"jiějué","meaning":"해결하다","example":"老师用“解决”举例：“我们一起解决这个问题。”","examplePinyin":"lǎoshī yòng “jiějué” jǔlì: “wǒmen yìqǐ jiějué zhège wèntí.”","translation":"선생님은 “解决”를 사용해 “우리 함께 이 문제를 해결해요.”라고 예를 들었어요."},{"no":784,"category":"동작·감각·생각","word":"办","pinyin":"bàn","meaning":"처리하다,办理하다","example":"学“办”时，我写：“我去办一件事。”","examplePinyin":"xué “bàn” shí, wǒ xiě: “wǒ qù bàn yí jiàn shì.”","translation":"“办”를 배울 때 저는 “저는 일을 하나 처리하러 가요.”라고 썼어요."},{"no":785,"category":"동작·감각·생각","word":"办法","pinyin":"bànfǎ","meaning":"방법","example":"复习“办法”时，我读到：“我有一个好办法。”","examplePinyin":"fùxí “bànfǎ” shí, wǒ dúdào: “wǒ yǒu yí ge hǎo bànfǎ.”","translation":"“办法”를 복습할 때, 저는 “저에게 좋은 방법이 하나 있어요.”라는 문장을 읽었어요."},{"no":786,"category":"동작·감각·생각","word":"方法","pinyin":"fāngfǎ","meaning":"방법","example":"老师用“方法”举例：“这个学习方法很好。”","examplePinyin":"lǎoshī yòng “fāngfǎ” jǔlì: “zhège xuéxí fāngfǎ hěn hǎo.”","translation":"선생님은 “方法”를 사용해 “이 학습 방법은 아주 좋아요.”라고 예를 들었어요."},{"no":787,"category":"동작·감각·생각","word":"等¹","pinyin":"děng","meaning":"기다리다","example":"学“等¹”时，老师提醒：“请等我一下。”","examplePinyin":"xué “děng” shí, lǎoshī tíxǐng: “qǐng děng wǒ yíxià.”","translation":"“等¹”를 배울 때 선생님이 “저를 잠깐 기다려 주세요.”라고 당부했어요."},{"no":788,"category":"동작·감각·생각","word":"拿","pinyin":"ná","meaning":"들다, 가지다","example":"学“拿”时，老师提醒：“请拿走你的书。”","examplePinyin":"xué “ná” shí, lǎoshī tíxǐng: “qǐng ná zǒu nǐ de shū.”","translation":"
