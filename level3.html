<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 3.0 3급 음원 학습</title>
  <style>
    :root { --blue:#174ea6; --deep:#102a43; --line:#d8e2ec; --soft:#f2f7fb; --accent:#eaf2ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#eef3f7; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f5f9ff; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#e1edff; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #2b6ed2; background:#f7fbff; box-shadow:0 0 0 5px #2b6ed21c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#d7e7ff; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>
</head>
<body>
<!-- mobile playback controls v2 -->
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>HSK 3.0 3급 음원 학습</h1><div class="sub">한자단어와 예문을 원하는 횟수만큼 반복해서 들으세요.</div></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="번호·한자·병음·뜻 검색">
      <label>단어 <select id="wordRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>예문 <select id="sentenceRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>속도 <select id="speechRate"><option value="0.55">매우 느리게</option><option value="0.68">느리게</option><option value="0.78" selected>학습 속도</option><option value="0.9">조금 빠르게</option><option value="1">보통</option><option value="1.15">빠르게</option><option value="1.3">매우 빠르게</option></select></label>
      <button class="toggle on" id="pinyinToggle" type="button">병음 보임</button>
      <button class="toggle on" id="meaningToggle" type="button">뜻 보임</button>
      <button class="toggle on" id="translationToggle" type="button">해석 보임</button>
    </div>
    <div class="batch">
      <label class="startControl">시작 번호 <input id="startNo" type="number" min="1" max="1000" value="1"></label>
      <button type="button" id="playAllWords">▶ 선택 번호부터 단어</button>
      <button type="button" id="playAllSentences">▶ 선택 번호부터 예문</button>
      <button type="button" id="playAllBoth">▶ 선택 번호부터 단어+예문</button>
      <button type="button" class="pause" id="pauseResume" disabled>Ⅱ 일시정지</button>
      <button type="button" class="stop" id="stopAll">■ 재생 멈춤</button>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>
<div class="status" id="status"></div>
<button class="toTop" id="toTop" type="button" aria-label="맨 위로 가기" title="맨 위로 가기">↑</button>
<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"你","pinyin":"nǐ","meaning":"너, 당신","example":"你是做什么工作的？","examplePinyin":"nǐ shì zuò shénme gōngzuò de?","translation":"무슨 일을 하세요?"},{"no":2,"category":"인사·사람·대명사","word":"你们","pinyin":"nǐmen","meaning":"여러분, 너희들","example":"你们打算什么时候开始工作？","examplePinyin":"nǐmen dǎsuàn shénme shíhou kāishǐ gōngzuò?","translation":"여러분은 언제 일을 시작할 계획인가요?"},{"no":3,"category":"인사·사람·대명사","word":"您","pinyin":"nín","meaning":"당신(존칭)","example":"您来中国以前学过汉语吗？","examplePinyin":"nín lái Zhōngguó yǐqián xuéguo Hànyǔ ma?","translation":"중국에 오기 전에 중국어를 배운 적이 있으세요?"},{"no":4,"category":"인사·사람·대명사","word":"我","pinyin":"wǒ","meaning":"나, 저","example":"我是来这里学习汉语的留学生。","examplePinyin":"wǒ shì lái zhèlǐ xuéxí Hànyǔ de liúxuéshēng.","translation":"저는 이곳에 중국어를 배우러 온 유학생이에요."},{"no":5,"category":"인사·사람·대명사","word":"我们","pinyin":"wǒmen","meaning":"우리","example":"我们已经认识三年多了。","examplePinyin":"wǒmen yǐjīng rènshi sān nián duō le.","translation":"우리는 안 지 3년이 넘었어요."},{"no":6,"category":"인사·사람·대명사","word":"咱们","pinyin":"zánmen","meaning":"우리(상대방 포함)","example":"咱们先商量一下再做决定吧。","examplePinyin":"zánmen xiān shāngliang yíxià zài zuò juédìng ba.","translation":"우리 먼저 상의한 다음 결정해요."},{"no":7,"category":"인사·사람·대명사","word":"他","pinyin":"tā","meaning":"그, 그 사람","example":"他虽然工作很忙，但是每天运动。","examplePinyin":"tā suīrán gōngzuò hěn máng, dànshì měitiān yùndòng.","translation":"그는 일이 바쁘지만 매일 운동해요."},{"no":8,"category":"인사·사람·대명사","word":"他们","pinyin":"tāmen","meaning":"그들","example":"他们正在会议室里讨论工作。","examplePinyin":"tāmen zhèngzài huìyìshì lǐ tǎolùn gōngzuò.","translation":"그들은 회의실에서 업무를 논의하고 있어요."},{"no":9,"category":"인사·사람·대명사","word":"她","pinyin":"tā","meaning":"그녀","example":"她不但会说中文，还会说英语。","examplePinyin":"tā búdàn huì shuō Zhōngwén, hái huì shuō Yīngyǔ.","translation":"그녀는 중국어뿐 아니라 영어도 할 줄 알아요."},{"no":10,"category":"인사·사람·대명사","word":"她们","pinyin":"tāmen","meaning":"그녀들","example":"她们毕业以后都留在北京工作。","examplePinyin":"tāmen bìyè yǐhòu dōu liú zài Běijīng gōngzuò.","translation":"그녀들은 졸업 후 모두 베이징에 남아 일해요."},{"no":11,"category":"인사·사람·대명사","word":"它","pinyin":"tā","meaning":"그것(사물·동물)","example":"这只猫很可爱，我每天都陪它玩。","examplePinyin":"zhè zhī māo hěn kě'ài, wǒ měitiān dōu péi tā wán.","translation":"이 고양이는 귀여워서 저는 매일 함께 놀아요."},{"no":12,"category":"인사·사람·대명사","word":"它们","pinyin":"tāmen","meaning":"그것들","example":"这些书很重要，请把它们收好。","examplePinyin":"zhèxiē shū hěn zhòngyào, qǐng bǎ tāmen shōuhǎo.","translation":"이 책들은 중요하니 잘 보관해 주세요."},{"no":13,"category":"인사·사람·대명사","word":"自己","pinyin":"zìjǐ","meaning":"자기 자신","example":"遇到困难时，要相信自己能解决。","examplePinyin":"yùdào kùnnan shí, yào xiāngxìn zìjǐ néng jiějué.","translation":"어려움을 만나면 스스로 해결할 수 있다고 믿어야 해요."},{"no":14,"category":"인사·사람·대명사","word":"别人","pinyin":"biérén","meaning":"다른 사람","example":"不经过同意，不能随便拿别人的东西。","examplePinyin":"bù jīngguò tóngyì, bù néng suíbiàn ná biérén de dōngxi.","translation":"동의 없이 다른 사람의 물건을 함부로 가져가면 안 돼요."},{"no":15,"category":"인사·사람·대명사","word":"大家","pinyin":"dàjiā","meaning":"모두, 여러분","example":"大家好，今天我们一起学习吧。","examplePinyin":"dàjiā hǎo, jīntiān wǒmen yìqǐ xuéxí ba.","translation":"여러분 안녕하세요, 오늘 함께 공부해요."},{"no":16,"category":"인사·사람·대명사","word":"人","pinyin":"rén","meaning":"사람","example":"周末来公园散步的人特别多。","examplePinyin":"zhōumò lái gōngyuán sànbù de rén tèbié duō.","translation":"주말에는 공원에 산책하러 오는 사람이 특히 많아요."},{"no":17,"category":"인사·사람·대명사","word":"你好","pinyin":"nǐ hǎo","meaning":"안녕하세요","example":"你好，请问你是新来的同事吗？","examplePinyin":"nǐ hǎo, qǐngwèn nǐ shì xīn lái de tóngshì ma?","translation":"안녕하세요, 새로 오신 동료인가요?"},{"no":18,"category":"인사·사람·대명사","word":"请","pinyin":"qǐng","meaning":"청하다, ~하세요","example":"请把这份材料交给王老师。","examplePinyin":"qǐng bǎ zhè fèn cáiliào jiāo gěi Wáng lǎoshī.","translation":"이 자료를 왕 선생님께 전해 주세요."},{"no":19,"category":"인사·사람·대명사","word":"请问","pinyin":"qǐngwèn","meaning":"실례지만, 여쭙겠습니다","example":"请问，去火车站应该怎么走？","examplePinyin":"qǐngwèn, qù huǒchēzhàn yīnggāi zěnme zǒu?","translation":"실례지만 기차역에는 어떻게 가야 하나요?"},{"no":20,"category":"인사·사람·대명사","word":"谢谢","pinyin":"xièxie","meaning":"감사합니다","example":"谢谢你一直以来对我的帮助。","examplePinyin":"xièxie nǐ yìzhí yǐlái duì wǒ de bāngzhù.","translation":"그동안 계속 저를 도와주셔서 감사합니다."},{"no":21,"category":"인사·사람·대명사","word":"不客气","pinyin":"bú kèqi","meaning":"천만에요","example":"不客气，这是我应该做的事情。","examplePinyin":"bú kèqi, zhè shì wǒ yīnggāi zuò de shìqing.","translation":"천만에요, 이것은 제가 해야 할 일이에요."},{"no":22,"category":"인사·사람·대명사","word":"对不起","pinyin":"duìbuqǐ","meaning":"미안합니다","example":"对不起，我不小心把杯子打破了。","examplePinyin":"duìbuqǐ, wǒ bù xiǎoxīn bǎ bēizi dǎpò le.","translation":"미안해요, 제가 실수로 컵을 깨뜨렸어요."},{"no":23,"category":"인사·사람·대명사","word":"不好意思","pinyin":"bù hǎoyìsi","meaning":"죄송하다, 실례하다","example":"不好意思，能麻烦你再说一遍吗？","examplePinyin":"bù hǎoyìsi, néng máfan nǐ zài shuō yí biàn ma?","translation":"죄송하지만 한 번 더 말씀해 주시겠어요?"},{"no":24,"category":"인사·사람·대명사","word":"没关系","pinyin":"méi guānxi","meaning":"괜찮다","example":"没关系，下次注意一点儿就好。","examplePinyin":"méi guānxi, xià cì zhùyì yìdiǎnr jiù hǎo.","translation":"괜찮아요, 다음에는 조금 주의하면 돼요."},{"no":25,"category":"인사·사람·대명사","word":"没事","pinyin":"méishì","meaning":"괜찮다, 별일 없다","example":"我没事，你不用再担心我了。","examplePinyin":"wǒ méi shì, nǐ bú yòng zài dānxīn wǒ le.","translation":"저는 괜찮으니 더 이상 걱정하지 않아도 돼요."},{"no":26,"category":"인사·사람·대명사","word":"再见","pinyin":"zàijiàn","meaning":"안녕히 가세요","example":"明天还要上课，我们下课后再见。","examplePinyin":"míngtiān hái yào shàngkè, wǒmen xiàkè hòu zàijiàn.","translation":"내일도 수업이 있으니 수업 후에 다시 만나요."},{"no":27,"category":"인사·사람·대명사","word":"喂","pinyin":"wéi","meaning":"여보세요","example":"喂，请问张经理现在方便吗？","examplePinyin":"wéi, qǐngwèn Zhāng jīnglǐ xiànzài fāngbiàn ma?","translation":"여보세요, 장 매니저님은 지금 통화 가능하신가요?"},{"no":28,"category":"인사·사람·대명사","word":"欢迎","pinyin":"huānyíng","meaning":"환영하다","example":"我最近才发现，欢迎你来中国。","examplePinyin":"wǒ zuìjìn cái fāxiàn, huānyíng nǐ lái Zhōngguó.","translation":"저는 최근에야 중국에 오신 것을 환영해요."},{"no":29,"category":"인사·사람·대명사","word":"男","pinyin":"nán","meaning":"남자, 남성의","example":"经过认真了解，他是男老师。","examplePinyi pinyin":"bǐ","meaning":"~보다","example":"老师告诉我们，我比他高。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ bǐ tā gāo.","translation":"선생님은 우리에게 저는 그보다 키가 커요."},{"no":844,"category":"성질·상태·문법","word":"比较","pinyin":"bǐjiào","meaning":"비교적, 비교하다","example":"老师告诉我们，今天比较冷。","examplePinyin":"lǎoshī gàosu wǒmen, jīntiān bǐjiào lěng.","translation":"선생님은 우리에게 오늘은 비교적 추워요."},{"no":845,"category":"성질·상태·문법","word":"更","pinyin":"gèng","meaning":"더욱, 더","example":"听朋友说，今天比昨天更冷。","examplePinyin":"tīng péngyou shuō, jīntiān bǐ zuótiān gèng lěng.","translation":"친구에게 들으니 오늘은 어제보다 더 추워요."},{"no":846,"category":"성질·상태·문법","word":"最","pinyin":"zuì","meaning":"가장, 제일","example":"经过认真了解，我最喜欢汉语。","examplePinyin":"jīngguò rènzhēn liǎojiě, wǒ zuì xǐhuan Hànyǔ.","translation":"자세히 알아보니 저는 중국어를 가장 좋아해요."},{"no":847,"category":"성질·상태·문법","word":"越","pinyin":"yuè","meaning":"~할수록 더욱","example":"我最近才发现，天气越来越冷了。","examplePinyin":"wǒ zuìjìn cái fāxiàn, tiānqì yuè lái yuè lěng le.","translation":"저는 최근에야 날씨가 점점 더 추워지고 있어요."},{"no":848,"category":"성질·상태·문법","word":"很","pinyin":"hěn","meaning":"매우, 아주","example":"后来我才知道，她很漂亮。","examplePinyin":"hòulái wǒ cái zhīdào, tā hěn piàoliang.","translation":"나중에야 그녀는 아주 예뻐요."},{"no":849,"category":"성질·상태·문법","word":"非常","pinyin":"fēicháng","meaning":"매우","example":"经过认真了解，我非常高兴。","examplePinyin":"jīngguò rènzhēn liǎojiě, wǒ fēicháng gāoxìng.","translation":"자세히 알아보니 저는 매우 기뻐요."},{"no":850,"category":"성질·상태·문법","word":"太","pinyin":"tài","meaning":"너무, 몹시","example":"经过认真了解，今天太热了。","examplePinyin":"jīngguò rènzhēn liǎojiě, jīntiān tài rè le.","translation":"자세히 알아보니 오늘 너무 더워요."},{"no":851,"category":"성질·상태·문법","word":"真","pinyin":"zhēn","meaning":"정말, 진짜","example":"经过认真了解，这个菜真好吃。","examplePinyin":"jīngguò rènzhēn liǎojiě, zhège cài zhēn hǎochī.","translation":"자세히 알아보니 이 요리는 정말 맛있어요."},{"no":852,"category":"성질·상태·문법","word":"挺","pinyin":"tǐng","meaning":"꽤, 상당히","example":"听朋友说，这件衣服挺漂亮的。","examplePinyin":"tīng péngyou shuō, zhè jiàn yīfu tǐng piàoliang de.","translation":"친구에게 들으니 이 옷은 꽤 예뻐요."},{"no":853,"category":"성질·상태·문법","word":"极","pinyin":"jí","meaning":"매우, 극히","example":"后来我才知道，今天冷极了。","examplePinyin":"hòulái wǒ cái zhīdào, jīntiān lěng jí le.","translation":"나중에야 오늘은 정말 추워요."},{"no":854,"category":"성질·상태·문법","word":"大概","pinyin":"dàgài","meaning":"대략, 아마","example":"经过认真了解，他大概八点来。","examplePinyin":"jīngguò rènzhēn liǎojiě, tā dàgài bā diǎn lái.","translation":"자세히 알아보니 그는 아마 8시쯤 올 거예요."},{"no":855,"category":"성질·상태·문법","word":"几乎","pinyin":"jīhū","meaning":"거의","example":"老师告诉我们，我几乎每天都运动。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ jīhū měitiān dōu yùndòng.","translation":"선생님은 우리에게 저는 거의 매일 운동해요."},{"no":856,"category":"성질·상태·문법","word":"不","pinyin":"bù","meaning":"~않다, 아니다","example":"经过认真了解，我不喝茶。","examplePinyin":"jīngguò rènzhēn liǎojiě, wǒ bù hē chá.","translation":"자세히 알아보니 저는 차를 마시지 않아요."},{"no":857,"category":"성질·상태·문법","word":"没(有)","pinyin":"méi(yǒu)","meaning":"없다, ~하지 않았다","example":"经过认真了解，我没有车。","examplePinyin":"jīngguò rènzhēn liǎojiě, wǒ méiyǒu chē.","translation":"자세히 알아보니 저는 차가 없어요."},{"no":858,"category":"성질·상태·문법","word":"不要","pinyin":"búyào","meaning":"~하지 마라","example":"老师提醒我们：不要说话。","examplePinyin":"lǎoshī tíxǐng wǒmen: búyào shuōhuà.","translation":"선생님은 우리에게 이렇게 당부하셨어요. 말하지 마세요."},{"no":859,"category":"성질·상태·문법","word":"别¹","pinyin":"bié","meaning":"~하지 마라","example":"为了顺利完成任务，别说话。","examplePinyin":"wèile shùnlì wánchéng rènwu, bié shuōhuà.","translation":"일을 순조롭게 마치려면 말하지 마세요."},{"no":860,"category":"성질·상태·문법","word":"不用","pinyin":"búyòng","meaning":"~할 필요 없다","example":"老师告诉我们，不用担心。","examplePinyin":"lǎoshī gàosu wǒmen, búyòng dānxīn.","translation":"선생님은 우리에게 걱정하지 않아도 돼요."},{"no":861,"category":"성질·상태·문법","word":"不行","pinyin":"bùxíng","meaning":"안 되다","example":"后来我才知道，这样不行。","examplePinyin":"hòulái wǒ cái zhīdào, zhèyàng bùxíng.","translation":"나중에야 이렇게 하면 안 돼요."},{"no":862,"category":"성질·상태·문법","word":"只是","pinyin":"zhǐshì","meaning":"다만, 단지","example":"老师告诉我们，我只是想问一个问题。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ zhǐshì xiǎng wèn yí ge wèntí.","translation":"선생님은 우리에게 저는 단지 질문 하나를 하고 싶을 뿐이에요."},{"no":863,"category":"성질·상태·문법","word":"只有","pinyin":"zhǐyǒu","meaning":"오직 ~만, ~해야만","example":"听朋友说，只有认真学习，才能取得好成绩。","examplePinyin":"tīng péngyou shuō, zhǐyǒu rènzhēn xuéxí, cái néng qǔdé hǎo chéngjì.","translation":"친구에게 들으니 열심히 공부해야만 좋은 성적을 얻을 수 있어요."},{"no":864,"category":"성질·상태·문법","word":"只要","pinyin":"zhǐyào","meaning":"~하기만 하면","example":"我最近才发现，只要努力，就会进步。","examplePinyin":"wǒ zuìjìn cái fāxiàn, zhǐyào nǔlì, jiù huì jìnbù.","translation":"저는 최근에야 노력하기만 하면 발전할 거예요."},{"no":865,"category":"성질·상태·문법","word":"和","pinyin":"hé","meaning":"~와/과, 그리고","example":"听朋友说，我和朋友去电影院。","examplePinyin":"tīng péngyou shuō, wǒ hé péngyou qù diànyǐngyuàn.","translation":"친구에게 들으니 저는 친구와 영화관에 가요."},{"no":866,"category":"성질·상태·문법","word":"跟","pinyin":"gēn","meaning":"~와 함께, ~을 따라","example":"老师告诉我们，我跟朋友一起去。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ gēn péngyou yìqǐ qù.","translation":"선생님은 우리에게 저는 친구와 함께 가요."},{"no":867,"category":"성질·상태·문법","word":"或","pinyin":"huò","meaning":"또는, 혹은","example":"我最近才发现，你可以坐公交车或地铁。","examplePinyin":"wǒ zuìjìn cái fāxiàn, nǐ kěyǐ zuò gōngjiāochē huò dìtiě.","translation":"저는 최근에야 버스 또는 지하철을 타도 돼요."},{"no":868,"category":"성질·상태·문법","word":"或者","pinyin":"huòzhě","meaning":"또는, 혹은","example":"听朋友说，我们喝茶或者咖啡吧。","examplePinyin":"tīng péngyou shuō, wǒmen hē chá huòzhě kāfēi ba.","translation":"친구에게 들으니 우리 차나 커피를 마셔요."},{"no":869,"category":"성질·상태·문법","word":"还是","pinyin":"háishi","meaning":"또는, 여전히","example":"你能告诉我，你喝茶还是咖啡？","examplePinyin":"nǐ néng gàosu wǒ, nǐ hē chá háishi kāfēi?","translation":"저에게 알려 주실 수 있나요? 차를 마실래요, 커피를 마실래요?"},{"no":870,"category":"성질·상태·문법","word":"但","pinyin":"dàn","meaning":"그러나","example":"我最近才发现，我想去，但没时间。","examplePinyin":"wǒ zuìjìn cái fāxiàn, wǒ xiǎng qù, dàn méi shíjiān.","translation":"저는 최근에야 가고 싶지만 시간이 없어요."},{"no":871,"category":"성질·상태·문법","word":"但是","pinyin":"dànshì","meaning":"하지만","example":"听朋友说，我很累，但是很高兴。","examplePinyin":"tīng péngyou shuō, wǒ hěn lèi, dànshì hěn gāoxìng.","translation":"친구에게 들으니 저는 피곤하지만 기뻐요."},{"no":872,"category":"성질·상태·문법","word":"可是","pinyin":"kěshì","meaning":"그러나, 하지만","example":"后来我才知道，我想去，可是没有时间。","examplePinyin":"hòulái wǒ cái zhīdào, wǒ xiǎng qù, kěshì méiyǒu shíjiān.","translation":"나중에야 가고 싶지만 시간이 없어요."},{"no":873,"category":"성질·상태·문법","word":"虽然","pinyin":"suīrán","meaning":"비록 ~하지만","example":"后来我才知道，虽然很累，但是我很高兴。","examplePinyin":"hòulái wǒ cái zhīdào, suīrán hěn lèi, dànshì wǒ hěn gāoxìng.","translation":"나중에야 피곤하지만 저는 기뻐요."},{"no":874,"category":"성질·상태·문법","word":"而且","pinyin":"érqiě","meaning":"게다가, ~뿐만 아니라","example":"老师告诉我们，他很聪明，而且很努力。","examplePinyin":"lǎoshī gàosu wǒmen, tā hěn cōngming, érqiě hěn nǔlì.","translation":"선생님은 우리에게 그는 똑똑하고 게다가 노력도 많이 해요."},{"no":875,"category":"성질·상태·문법","word":"不但","pinyin":"búdàn","meaning":"~뿐만 아니라","example":"我最近才发现，他不但会英语，还会汉语。","examplePinyin":"wǒ zuìjìn cái fāxiàn, tā búdàn huì Yīngyǔ, hái huì Hànyǔ.","translation":"저는 최근에야 그는 영어뿐 아니라 중국어도 할 줄 알아요."},{"no":876,"category":"성질·상태·문법","word":"因为","pinyin":"yīnwèi","meaning":"왜냐하면, ~때문에","example":"老师告诉我们，因为下雨，我不出去。","examplePinyin":"lǎoshī gàosu wǒmen, yīnwèi xià yǔ, wǒ bù chūqù.","translation":"선생님은 우리에게 비가 오기 때문에 저는 나가지 않아요."},{"no":877,"category":"성질·상태·문법","word":"所以","pinyin":"suǒyǐ","meaning":"그래서","example":"老师告诉我们，今天下雨，所以我不出去。","examplePinyin":"lǎoshī gàosu wǒmen, jīntiān xià yǔ, suǒyǐ wǒ bù chūqù.","translation":"선생님은 우리에게 오늘 비가 와서 저는 나가지 않아요."},{"no":878,"category":"성질·상태·문법","word":"如果","pinyin":"rúguǒ","meaning":"만약 ~라면","example":"我最近才发现，如果下雨，我们就不去了。","examplePinyin":"wǒ zuìjìn cái fāxiàn, rúguǒ xià yǔ, wǒmen jiù bú qù le.","translation":"저는 최근에야 비가 오면 우리는 가지 않을 거예요."},{"no":879,"category":"성질·상태·문법","word":"的话","pinyin":"dehuà","meaning":"~라면, ~할 경우","example":"经过认真了解，你有时间的话，我们一起去。","examplePinyin":"jīngguò rènzhēn liǎojiě, nǐ yǒu shíjiān dehuà, wǒmen yìqǐ qù.","translation":"자세히 알아보니 시간이 있다면 우리 함께 가요."},{"no":880,"category":"성질·상태·문법","word":"也","pinyin":"yě","meaning":"~도, 또한","example":"经过认真了解，我也是学生。","examplePinyin":"jīngguò rènzhēn liǎojiě, wǒ yě shì xuéshēng.","translation":"자세히 알아보니 저도 학생이에요."},{"no":881,"category":"성질·상태·문법","word":"都","pinyin":"dōu","meaning":"모두, 다","example":"我最近才发现，我们都是学生。","examplePinyin":"wǒ zuìjìn cái fāxiàn, wǒmen dōu shì xuéshēng.","translation":"저는 최근에야 우리는 모두 학생이에요."},{"no":882,"category":"성질·상태·문법","word":"再","pinyin":"zài","meaning":"다시, 또","example":"开始工作以前，请再说一次。","examplePinyin":"kāishǐ gōngzuò yǐqián, qǐng zài shuō yí cì.","translation":"일을 시작하기 전에 다시 한 번 말해 주세요."},{"no":883,"category":"성질·상태·문법","word":"又","pinyin":"yòu","meaning":"또, 다시","example":"后来我才知道，他今天又迟到了。","examplePinyin":"hòulái wǒ cái zhīdào, tā jīntiān yòu chídào le.","translation":"나중에야 그는 오늘 또 지각했어요."},{"no":884,"category":"성질·상태·문법","word":"一起","pinyin":"yìqǐ","meaning":"함께","example":"我最近才发现，我们一起学习吧。","examplePinyin":"wǒ zuìjìn cái fāxiàn, wǒmen yìqǐ xuéxí ba.","translation":"저는 최근에야 우리 함께 공부해요."},{"no":885,"category":"성질·상태·문법","word":"一块儿","pinyin":"yíkuàir","meaning":"함께, 같이","example":"后来我才知道，我们一块儿去吧。","examplePinyin":"hòulái wǒ cái zhīdào, wǒmen yíkuàir qù ba.","translation":"나중에야 우리 함께 가요."},{"no":886,"category":"성질·상태·문법","word":"一边","pinyin":"yìbiān","meaning":"~하면서, 한쪽","example":"老师告诉我们，我一边听音乐，一边学习。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ yìbiān tīng yīnyuè, yìbiān xuéxí.","translation":"선생님은 우리에게 저는 음악을 들으면서 공부해요."},{"no":887,"category":"성질·상태·문법","word":"先","pinyin":"xiān","meaning":"먼저","example":"后来我才知道，你先坐一下。","examplePinyin":"hòulái wǒ cái zhīdào, nǐ xiān zuò yíxià.","translation":"나중에야 먼저 잠깐 앉으세요."},{"no":888,"category":"성질·상태·문법","word":"然后","pinyin":"ránhòu","meaning":"그런 다음에","example":"老师告诉我们，我先吃饭，然后做作业。","examplePinyin":"lǎoshī gàosu wǒmen, wǒ xiān chīfàn, ránhòu zuò zuòyè.","translation":"선생님은 우리에게 저는 먼저 밥을 먹고 숙제를 해요."},{"no":889,"category":"성질·상태·문법","word":"的","pinyin":"de","meaning":"~의","example":"老师告诉我们，这是我的书。","examplePinyin":"lǎoshī gàosu wǒmen, zhè shì wǒ const LEVEL = 3;
const state = { showPinyin:true, showMeaning:true, showTranslation:true, speaking:false, paused:false, resumeNext:null, resumeSpeech:null, speechToken:0, runId:0, currentAudio:null, currentNo:null };
const list = document.getElementById('list');
const statusBox = document.getElementById('status');
const pauseResumeBtn = document.getElementById('pauseResume');

function syncPauseButton() {
  pauseResumeBtn.disabled = !state.speaking;
  pauseResumeBtn.classList.toggle('paused', state.paused);
  pauseResumeBtn.textContent = state.paused ? '▶ 이어듣기' : 'Ⅱ 일시정지';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = DATA.filter(x => !q || [x.no,x.word,x.pinyin,x.meaning,x.example,x.examplePinyin,x.translation,x.category].join(' ').toLowerCase().includes(q));
  document.getElementById('count').textContent = `${filtered.length} / 1000`;
  let last = '';
  list.innerHTML = filtered.map(x => {
    const heading = x.category !== last ? `<h2 class="category">${esc(x.category)}</h2>` : '';
    last = x.category;
    return `${heading}<article class="card">
      <div class="wordline"><button class="startPick ${Number(document.getElementById('startNo')?.value||1)===x.no?'selected':''}" data-no="${x.no}" title="${x.no}번부터 연속 재생">${x.no}</button><div class="hanzi">${esc(x.word)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.pinyin)}</div><button class="play" data-kind="word" data-no="${x.no}">▶ 단어</button></div>
      <div class="answer meaning ${state.showMeaning?'':'hidden'}">${esc(x.meaning)}</div>
      <div class="exampleline"><div class="no">例</div><div class="hanzi sentence">${esc(x.example)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.examplePinyin)}</div><button class="play" data-kind="sentence" data-no="${x.no}">▶ 예문</button></div>
      <div class="answer translation ${state.showTranslation?'':'hidden'}">${esc(x.translation)}</div>
    </article>`;
  }).join('');
}

function getChineseVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /^zh(-|_)?CN/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null;
}
function playQueue(entries, label) {
  if (!('speechSynthesis' in window)) { showStatus('이 브라우저는 음성 재생을 지원하지 않습니다.'); return; }
  speechSynthesis.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  const runId = ++state.runId;
  state.speaking = true;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  syncPauseButton();
  document.querySelectorAll('.play').forEach(b => b.disabled = true);
  const voice = getChineseVoice();
  let done = 0;
  showStatus(`${label} 재생 준비 중…`);
  const next = () => {
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (done >= entries.length) {
      state.speaking = false;
      state.paused = false;
      syncPauseButton();
      document.querySelectorAll('.play').forEach(b => b.disabled = false);
      showStatus(`${label} 재생 완료`);
      setTimeout(() => statusBox.classList.remove('show'), 1500);
      return;
    }
    const item = entries[done];
    focusCurrent(item.no);
    showStatus(`${label} 재생 중 · ${item.progress || `${done+1}/${entries.length}`}`);
    if (item.audio) {
      const audio = new Audio(item.audio);
      state.currentAudio = audio;
      audio.playbackRate = Number(document.getElementById('speechRate').value);
      audio.onended = () => { state.currentAudio=null; done++; setTimeout(next,350); };
      audio.onerror = () => {
        if (runId !== state.runId) return;
        state.speaking=false; state.currentAudio=null;
        document.querySelectorAll('.play').forEach(b=>b.disabled=false);
        showStatus('63번 표준 발음 음원을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
      };
      audio.play().catch(() => audio.onerror());
      return;
    }
    const speakCurrent = () => {
      if (runId !== state.runId) return;
      if (state.paused) { state.resumeNext = speakCurrent; return; }
      const token = ++state.speechToken;
      state.resumeSpeech = speakCurrent;
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'zh-CN'; u.rate = Number(document.getElementById('speechRate').value); u.pitch = 1; if (voice) u.voice = voice;
      u.onend = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        state.resumeSpeech = null;
        done++;
        setTimeout(next, 350);
      };
      u.onerror = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        state.speaking=false;
        state.resumeSpeech=null;
        document.querySelectorAll('.play').forEach(b=>b.disabled=false);
        showStatus('음성 재생에 실패했습니다. 중국어 음성이 설치되어 있는지 확인하세요.');
      };
      speechSynthesis.speak(u);
    };
    speakCurrent();
  };
  next();
}
function fixedAudio(no, kind) {
  const level1Files = {
    26:{word:'item-026-word.wav',example:'item-026-example.wav'},
    63:{word:'item-063-word.wav',example:'item-063-example.wav'},
    103:{word:'item-103-word.wav',example:'item-103-example.wav'},
    152:{example:'item-152-example.wav'},
    182:{word:'item-182-word.wav',example:'item-182-example.wav'},
    248:{word:'item-248-word.wav',example:'item-248-example.wav'},
    273:{word:'item-273-word.wav',example:'item-273-example.wav'},
    299:{word:'item-299-word.wav',example:'item-299-example.wav'}
  };
  const level2Files = {
    34:{word:'item2-034-word.wav',example:'item2-034-example.wav'},
    76:{word:'item2-076-word.wav',example:'item2-076-example.wav'},
    86:{word:'item2-086-word.wav',example:'item2-086-example.wav'},
    147:{word:'item2-147-word.wav',example:'item2-147-example.wav'},
    214:{word:'item2-214-word.wav',example:'item2-214-example.wav'},
    258:{word:'item2-258-word.wav',example:'item2-258-example.wav'},
    395:{word:'item2-395-word.wav',example:'item2-395-example.wav'},
    446:{word:'item2-446-word.wav',example:'item2-446-example.wav'},
    467:{word:'item2-467-word.wav',example:'item2-467-example.wav'},
    468:{word:'item2-468-word.wav',example:'item2-468-example.wav'},
    469:{word:'item2-469-word.wav',example:'item2-469-example.wav'},
    470:{word:'item2-470-word.wav',example:'item2-470-example.wav'},
    476:{word:'item2-476-word.wav',example:'item2-476-example.wav'},
    491:{word:'item2-491-word.wav',example:'item2-491-example.wav'},
    497:{word:'item2-497-word.wav',example:'item2-497-example.wav'}
  };
  const files = LEVEL === 1 ? level1Files : (LEVEL === 2 ? level2Files : {});
  const file = files[no]?.[kind];
  if (!file) return null;
  return `https://raw.githubusercontent.com/yanchunnu/HSK3.0-/main/audio/${file}`;
}
function repeatEntries(text, repeat, progress, audio=null, no=null, kind=null) {
  return Array.from({length:repeat}, (_,i) => ({text, audio, no, kind, progress:`${progress} · ${i+1}/${repeat}회`}));
}
function focusCurrent(no) {
  if (!no) return;
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  const card = document.querySelector(`article.card:has(.startPick[data-no="${no}"])`);
  if (!card) return;
  card.classList.add('reading');
  if (state.currentNo !== no) card.scrollIntoView({behavior:'smooth', block:'center'});
  state.currentNo = no;
}
function stopPlayback() {
  state.runId++;
  state.speaking = false;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  speechSynthesis.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio.currentTime=0; state.currentAudio=null; }
  state.currentNo=null;
  syncPauseButton();
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  document.querySelectorAll('.play').forEach(b => b.disabled = false);
  showStatus('재생을 멈췄습니다.');
  setTimeout(() => statusBox.classList.remove('show'), 1500);
}
function togglePause() {
  if (!state.speaking) return;
  if (!state.paused) {
    state.paused = true;
    if (state.currentAudio && !state.currentAudio.paused) state.currentAudio.pause();
    if (!state.currentAudio && state.resumeSpeech) {
      state.resumeNext = state.resumeSpeech;
      state.speechToken++;
      speechSynthesis.cancel();
    }
    syncPauseButton();
    showStatus('일시정지됨 · 화면을 다시 누르거나 이어듣기 버튼을 누르세요');
    return;
  }
  state.paused = false;
  if (state.currentAudio && state.currentAudio.paused) {
    state.currentAudio.play().catch(() => showStatus('재생을 다시 시작하지 못했습니다.'));
  }
  const resume = state.resumeNext;
  state.resumeNext = null;
  if (resume) resume();
  syncPauseButton();
  showStatus('이어서 재생합니다');
}
function showStatus(msg) { statusBox.textContent = msg; statusBox.classList.add('show'); }
function selectedItems() {
  const input = document.getElementById('startNo');
  const start = Math.min(1000, Math.max(1, Number(input.value) || 1));
  input.value = start;
  return {start, items:DATA.filter(x => x.no >= start)};
}

list.addEventListener('click', e => {
  const pick = e.target.closest('.startPick');
  if (pick) {
    document.getElementById('startNo').value = pick.dataset.no;
    render();
    showStatus(`${pick.dataset.no}번을 연속 재생 시작 번호로 선택했습니다.`);
    setTimeout(() => statusBox.classList.remove('show'), 1500);
    return;
  }
  const btn = e.target.closest('.play'); if (!btn) return;
  const item = DATA.find(x => x.no === Number(btn.dataset.no));
  const isWord = btn.dataset.kind === 'word';
  const repeat = Number(document.getElementById(isWord?'wordRepeat':'sentenceRepeat').value);
  playQueue(repeatEntries(isWord?item.word:item.example, repeat, `${item.no}번`, fixedAudio(item.no,isWord?'word':'example'), item.no, isWord?'word':'example'), isWord?'단어':'예문');
});
document.getElementById('playAllWords').addEventListener('click', () => {
  const repeat = Number(document.getElementById('wordRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.word, repeat, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word')), `${start}~1000 전체 단어`);
});
document.getElementById('playAllSentences').addEventListener('click', () => {
  const repeat = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.example, repeat, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')), `${start}~1000 전체 예문`);
});
document.getElementById('playAllBoth').addEventListener('click', () => {
  const wr = Number(document.getElementById('wordRepeat').value);
  const sr = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => [...repeatEntries(x.word, wr, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word'), ...repeatEntries(x.example, sr, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')]), `${start}~1000 단어+예문`);
});
document.getElementById('stopAll').addEventListener('click', stopPlayback);
pauseResumeBtn.addEventListener('click', togglePause);
document.addEventListener('click', e => {
  if (e.target.closest('button, input, select, label, a, .status')) return;
  togglePause();
});
const toTop = document.getElementById('toTop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 450), {passive:true});
document.getElementById('startNo').addEventListener('change', () => { selectedItems(); render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('pinyinToggle').addEventListener('click', e => { state.showPinyin=!state.showPinyin; e.currentTarget.classList.toggle('on',state.showPinyin); e.currentTarget.textContent=state.showPinyin?'병음 보임':'병음 숨김'; render(); });
document.getElementById('meaningToggle').addEventListener('click', e => { state.showMeaning=!state.showMeaning; e.currentTarget.classList.toggle('on',state.showMeaning); e.currentTarget.textContent=state.showMeaning?'뜻 보임':'뜻 숨김'; render(); });
document.getElementById('translationToggle').addEventListener('click', e => { state.showTranslation=!state.showTranslation; e.currentTarget.classList.toggle('on',state.showTranslation); e.currentTarget.textContent=state.showTranslation?'해석 보임':'해석 숨김'; render(); });
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
render();
</script>
