rceNo":4333},{"no":1588,"category":"성질·상태·문법","word":"吉祥","pinyin":"jíxiáng","meaning":"상서롭다","example":"在中国文化中，数字八象征吉祥。","examplePinyin":"Zài Zhōngguó wénhuà zhōng, shùzì bā xiàngzhēng jíxiáng.","translation":"중국 문화에서 숫자 8은 행운을 상징합니다.","sourceNo":4334},{"no":1589,"category":"성질·상태·문법","word":"机遇","pinyin":"jīyù","meaning":"기회, 찬스","example":"这是一个千载难逢的发展机遇。","examplePinyin":"Zhè shì yí ge qiān zài nán féng de fāzhǎn jīyù.","translation":"이것은 일생에 한 번뿐인 개발 기회입니다.","sourceNo":4339},{"no":1590,"category":"성질·상태·문법","word":"剧烈","pinyin":"jùliè","meaning":"격렬하다","example":"比赛过后，他感到心跳非常剧烈。","examplePinyin":"Bǐsài guòhòu, tā gǎndào xīntiào fēicháng jùliè.","translation":"경기가 끝난 뒤 그는 심장이 심하게 뛰는 것을 느꼈다.","sourceNo":4354},{"no":1591,"category":"성질·상태·문법","word":"局面","pinyin":"júmiàn","meaning":"국면, 상황","example":"目前公司正面临着复杂的局面。","examplePinyin":"Mùqián gōngsī zhèng miànlín zhe fùzá de júmiàn.","translation":"회사는 현재 복잡한 상황에 직면해 있습니다.","sourceNo":4355},{"no":1592,"category":"성질·상태·문법","word":"均匀","pinyin":"jūnyún","meaning":"균등하다, 고르다","example":"请把颜料均匀地涂抹在画布上。","examplePinyin":"Qǐng bǎ yánliào jūnyún de túmǒ zài huàbù shàng.","translation":"캔버스에 물감을 고르게 펴 발라주세요.","sourceNo":4358},{"no":1593,"category":"성질·상태·문법","word":"局限","pinyin":"júxiàn","meaning":"제한하다, 국한하다","example":"他的知识面还局限在一个很小的范围。","examplePinyin":"Tā de zhīshimiàn hái júxiàn zài yí ge hěnxiǎo de fànwéi.","translation":"그의 지식은 여전히 매우 작은 범위에 국한되어 있습니다.","sourceNo":4359},{"no":1594,"category":"성질·상태·문법","word":"开头","pinyin":"kāitóu","meaning":"시작하다 / 시작, 첫머리","example":"这部小说的开头写得十分吸引人。","examplePinyin":"Zhè bù xiǎoshuō de kāitóu xiě de shífēn xīyǐn rén.","translation":"이 소설의 시작은 매우 매력적이다.","sourceNo":4364},{"no":1595,"category":"성질·상태·문법","word":"看似","pinyin":"kànsì","meaning":"겉보기에는 ~같다","example":"这道题看似简单，其实很不容易。","examplePinyin":"Zhè dào tí kànsì jiǎndān, qíshí hěn bù róngyì.","translation":"이 질문은 간단해 보이지만 실제로는 매우 어렵습니다.","sourceNo":4371},{"no":1596,"category":"성질·상태·문법","word":"可怜","pinyin":"kělián","meaning":"불쌍하다 / 불쌍히 여기다","example":"这个流浪的小孩看起来非常可怜。","examplePinyin":"Zhè ge liúlàng de xiǎohái kànqǐlai fēicháng kělián.","translation":"이 노숙자 아이는 매우 불쌍해 보입니다.","sourceNo":4383},{"no":1597,"category":"성질·상태·문법","word":"肯","pinyin":"kěn","meaning":"기꺼이 ~하다, 동의하다","example":"无论怎么劝，他都不肯改变主意。","examplePinyin":"Wúlùn zěnme quàn, tā dōu bùkěn gǎibiàn zhǔyi.","translation":"아무리 설득해도 그는 생각을 바꾸려 하지 않아요.","sourceNo":4385},{"no":1598,"category":"성질·상태·문법","word":"可行","pinyin":"kěxíng","meaning":"실행 가능하다","example":"经过讨论，大家认为这个方案可行。","examplePinyin":"Jīngguò tǎolùn, dàjiā rènwéi zhè ge fāng'àn kěxíng.","translation":"토론 후에 모두는 이 계획이 실현 가능하다고 믿었습니다.","sourceNo":4389},{"no":1599,"category":"성질·상태·문법","word":"酷","pinyin":"kù","meaning":"멋지다, 쿨하다","example":"他穿着一身黑色皮衣显得特别酷。","examplePinyin":"Tā chuānzhe yìshēn hēisè píyī xiǎnde tèbié kù.","translation":"특히 그는 블랙 가죽 재킷을 입고 멋스러운 모습을 보였다.","sourceNo":4398},{"no":1600,"category":"성질·상태·문법","word":"快捷","pinyin":"kuàijié","meaning":"빠르고 편리하다","example":"网上购物既方便又非常快捷。","examplePinyin":"Wǎngshàng gòuwù jì fāngbiàn yòu fēicháng kuàijié.","translation":"온라인 쇼핑은 편리하고 매우 빠릅니다.","sourceNo":4401},{"no":1601,"category":"성질·상태·문법","word":"夸张","pinyin":"kuāzhāng","meaning":"과장하다","example":"他形容起这件事来总是有点夸张。","examplePinyin":"Tā xíngróng qǐ zhè jiàn shì lái zǒngshì yǒudiǎn kuāzhāng.","translation":"그는 항상 약간 과장해서 설명했습니다.","sourceNo":4405},{"no":1602,"category":"성질·상태·문법","word":"枯燥","pinyin":"kūzào","meaning":"무미건조하다","example":"每天重复同样的工作让人感到枯燥。","examplePinyin":"Měi tiān chóngfù tóngyàng de gōngzuò ràng rén gǎndào kūzào.","translation":"매일 같은 일을 반복하는 것은 지루하게 느껴질 수 있습니다.","sourceNo":4409},{"no":1603,"category":"성질·상태·문법","word":"啦","pinyin":"la","meaning":"~네, ~구나(어기조사)","example":"快下雨了，大家赶紧回家啦！","examplePinyin":"Kuài xiàyǔ le, dàjiā gǎnjǐn huíjiā la!","translation":"비가 올 거예요. 빨리 집에 가자!","sourceNo":4410},{"no":1604,"category":"성질·상태·문법","word":"烂","pinyin":"làn","meaning":"썩다, 문드러지다","example":"这个苹果放了几天已经烂了。","examplePinyin":"Zhè ge píngguǒ fàng le jǐ tiān yǐjīng làn le.","translation":"이 사과는 며칠 동안 썩었어요.","sourceNo":4418},{"no":1605,"category":"성질·상태·문법","word":"牢","pinyin":"láo","meaning":"튼튼하다 / 감옥","example":"请把绳子的两端系得再牢一点儿。","examplePinyin":"Qǐng bǎ shéngzi de liǎngduān xì de zài láo yìdiǎnr.","translation":"끈의 양쪽 끝을 좀 더 단단하게 묶어주세요.","sourceNo":4422},{"no":1606,"category":"성질·상태·문법","word":"老实","pinyin":"lǎoshi","meaning":"성실하다, 정직하다","example":"他从小性格老实，从不撒谎骗人。","examplePinyin":"Tā cóngxiǎo xìnggé lǎoshi, cóngbù sāhuǎng piànrén.","translation":"그는 어릴 때부터 솔직했고, 거짓말을 하거나 남을 속이는 일이 없었다.","sourceNo":4424},{"no":1607,"category":"성질·상태·문법","word":"类别","pinyin":"lèibié","meaning":"종류, 카테고리","example":"请按照商品的类别分类摆放。","examplePinyin":"Qǐng ànzhào shāngpǐn de lèibié fēnlèi bǎifàng.","translation":"카테고리에 따라 제품을 정렬해 주세요.","sourceNo":4428},{"no":1608,"category":"성질·상태·문법","word":"乐于","pinyin":"lèyú","meaning":"기꺼이 ~하다","example":"他一直乐于帮助身边有困难的人。","examplePinyin":"Tā yìzhí lèyú bāngzhù shēnbiān yǒu kùnnan de rén.","translation":"그는 항상 도움이 필요한 주변 사람들을 기꺼이 도왔습니다.","sourceNo":4429},{"no":1609,"category":"성질·상태·문법","word":"理","pinyin":"lǐ","meaning":"도리, 이치 / 처리하다","example":"他说的这番话确实很有道理。","examplePinyin":"Tā shuō de zhèfānhuà quèshí hěn yǒu dàolǐ.","translation":"그가 말한 것은 의미가 있습니다.","sourceNo":4432},{"no":1610,"category":"성질·상태·문법","word":"立场","pinyin":"lìchǎng","meaning":"입장","example":"面对争议，他始终坚持自己的立场。","examplePinyin":"Miànduì zhēngyì, tā shǐzhōng jiānchí zìjǐ de lìchǎng.","translation":"그는 항상 논란에 맞서 자신의 입장을 고수했습니다.","sourceNo":4443},{"no":1611,"category":"성질·상태·문법","word":"力度","pinyin":"lìdù","meaning":"강도, 세기","example":"这次政策改革的力度非常大。","examplePinyin":"Zhè cì zhèngcè gǎigé de lìdù fēicháng dà.","translation":"이번 정책 개혁은 매우 강력합니다.","sourceNo":4444},{"no":1612,"category":"성질·상태·문법","word":"例外","pinyin":"lìwài","meaning":"예외로 하다 / 예외","example":"无论是谁，这次都没有任何例外。","examplePinyin":"Wúlùnshì shuí, zhè cì dōu méiyǒu rènhé lìwài.","translation":"누구라도 이번에는 예외는 없을 것이다.","sourceNo":4457},{"no":1613,"category":"성질·상태·문법","word":"理性","pinyin":"lǐxìng","meaning":"이성적이다 / 이성","example":"遇到问题时，我们应该理性思考。","examplePinyin":"Yùdào wèntí shí, wǒmen yīnggāi lǐxìng sīkǎo.","translation":"문제에 직면했을 때 우리는 합리적으로 생각해야 합니다.","sourceNo":4459},{"no":1614,"category":"성질·상태·문법","word":"漏洞","pinyin":"lòudòng","meaning":"허점, 결함","example":"这份合同存在几处明显的漏洞。","examplePinyin":"Zhè fèn hétong cúnzài jǐ chù míngxiǎn de lòudòng.","translation":"이 계약에는 몇 가지 눈에 띄는 허점이 있습니다.","sourceNo":4462},{"no":1615,"category":"성질·상태·문법","word":"落后","pinyin":"luòhòu","meaning":"낙후되다, 뒤떨어지다","example":"由于交通不便，这个地区比较落后。","examplePinyin":"Yóuyú jiāotōng búbiàn, zhè ge dìqū bǐjiào luòhòu.","translation":"불편한 교통으로 인해 이 지역은 상대적으로 낙후되어 있습니다.","sourceNo":4477},{"no":1616,"category":"성질·상태·문법","word":"嘛","pinyin":"ma","meaning":"~잖아(어기조사)","example":"你别生气嘛，我不是故意的。","examplePinyin":"Nǐ biéshēngqì ma, wǒ búshì gùyì de.","translation":"화내지 마요. 일부러 그런 게 아니잖아요.","sourceNo":4483},{"no":1617,"category":"성질·상태·문법","word":"马虎","pinyin":"mǎhu","meaning":"소홀하다, 대충대충하다","example":"做作业的时候千万不要马虎大意。","examplePinyin":"Zuòzuòyè de shíhou qiānwàn búyào mǎhu dàyì.","translation":"숙제를 할 때 결코 부주의하지 마십시오.","sourceNo":4484},{"no":1618,"category":"성질·상태·문법","word":"漫长","pinyin":"màncháng","meaning":"길고 지루하다","example":"追梦的路虽然漫长，但值得坚持。","examplePinyin":"Zhuī mèng de lù suīrán màncháng, dàn zhíde jiānchí.","translation":"꿈을 추구하는 길은 멀더라도 인내할 가치가 있습니다.","sourceNo":4488},{"no":1619,"category":"성질·상태·문법","word":"美观","pinyin":"měiguān","meaning":"아름답다, 보기 좋다","example":"这栋建筑的外观设计非常美观。","examplePinyin":"Zhè dòng jiànzhù de wàiguān shèjì fēicháng měiguān.","translation":"이 건물의 외관 디자인은 매우 아름답습니다.","sourceNo":4497},{"no":1620,"category":"성질·상태·문법","word":"密","pinyin":"mì","meaning":"빽빽하다","example":"这片竹林长得非常茂密幽深。","examplePinyin":"Zhè piàn zhúlín zhǎng de fēicháng màomì yōushēn.","translation":"이 대나무 숲은 매우 빽빽하고 깊습니다.","sourceNo":4500},{"no":1621,"category":"성질·상태·문법","word":"勉强","pinyin":"miǎnqiǎng","meaning":"억지로 하다 / 마지못해","example":"尽管很累，他还是勉强完成了任务。","examplePinyin":"Jǐnguǎn hěn lèi, tā háishi miǎnqiǎng wánchéng le rènwu.","translation":"매우 피곤했지만 그는 간신히 일을 끝냈어요.","sourceNo":4505},{"no":1622,"category":"성질·상태·문법","word":"面子","pinyin":"miànzi","meaning":"체면","example":"他做事一向很讲究面子和尊严。","examplePinyin":"Tā zuòshì yíxiàng hěn jiǎngjiū miànzi hé zūnyán.","translation":"그는 자신이 하는 모든 일에서 항상 체면과 위엄에 주의를 기울입니다.","sourceNo":4508},{"no":1623,"category":"성질·상태·문법","word":"妙","pinyin":"miào","meaning":"절묘하다, 훌륭하다","example":"这个解决问题的办法真是太妙了。","examplePinyin":"Zhè ge jiějué wèntí de bànfǎ zhēnshì tàimiàole.","translation":"문제에 대한 정말 훌륭한 해결책입니다.","sourceNo":4509},{"no":1624,"category":"성질·상태·문법","word":"密集","pinyin":"mìjí","meaning":"밀집하다","example":"这片地区的高楼建筑十分密集。","examplePinyin":"Zhè piàn dìqū de gāolóu jiànzhù shífēn mìjí.","translation":"이 지역은 고층빌딩이 밀집해 있는 지역이다.","sourceNo":4516},{"no":1625,"category":"성질·상태·문법","word":"明亮","pinyin":"míngliàng","meaning":"밝다","example":"打扫过后，房间显得格外明亮整洁。","examplePinyin":"Dǎsǎo guòhòu, fángjiān xiǎnde géwài míngliàng zhěngjié.","translation":"청소 후 방은 특히 밝고 깔끔해 보였습니다.","sourceNo":4519},{"no":1626,"category":"성질·상태·문법","word":"明明","pinyin":"míngmíng","meaning":"분명히","example":"他明明知道答案，却故意不说。","examplePinyin":"Tā míngmíng zhīdao dá'àn, què gùyì bù shuō.","translation":"그는 분명히 대답을 알고 있었지만 일부러 말하지 않았습니다.","sourceNo":4521},{"no":1627,"category":"성질·상태·문법","word":"名气","pinyin":"míngqi","meaning":"명성","example":"这家老字号餐厅在当地很有名气。","examplePinyin":"Zhè jiā lǎozìhào cāntīng zài dāngdì hěn yǒu míngqi.","translation":"이 유서 깊은 레스토랑은 지역에서 매우 유명합니다.","sourceNo":4523},{"no":1628,"category":"성질·상태·문법","word":"迷人","pinyin":"mírén","meaning":"매력적이다","example":"夕阳下的海边风景显得格外迷人。","examplePinyin":"Xīyáng xià de hǎibiān fēngjǐng xiǎnde géwài mírén.","translation":"노을이 지는 바닷가 풍경이 유난히 매력적이다.","sourceNo":4530},{"no":1629,"category":"성질·상태·문법","word":"默默","pinyin":"mòmò","meaning":"묵묵히","example":"他一直默默地在背后支持着家人。","examplePinyin":"Tā yìzhí mòmòde zài bèihòu zhīchí zhe jiārén.","translation":"그는 뒤에서 묵묵히 가족을 응원해 왔다.","sourceNo":4532},{"no":1630,"category":"성질·상태·문법","word":"模样","pinyin":"múyàng","meaning":"모습, 생김새","example":"多年不见，他的模样已经发生了变化。","examplePinyin":"Duōnián bújiàn, tā de múyàng yǐjīng fāshēng le biànhuà.","translation":"오랜만에 보니 그의 모습이 이미 달라져 있었어요.","sourceNo":4540},{"no":1631,"category":"성질·상태·문법","word":"难免","pinyin":"nánmiǎn","meaning":"피하기 어렵다","example":"刚开始学习新技能，难免会遇到困难。","examplePinyin":"Gāng kāishǐ xuéxí xīnjìnéng, nánmiǎn huì yùdào kùnnan.","translation":"새로운 기술을 처음 배우기 시작하면 필연적으로 어려움에 직면하게 됩니다.","sourceNo":4546},{"no":1632,"category":"성질·상태·문법","word":"内涵","pinyin":"nèihán","meaning":"내포, 함의","example":"这首诗的内涵十分丰富，耐人寻味。","examplePinyin":"Zhè shǒu shī de nèihán shífēn fēngfù, nài rén xúnwèi.","translation":"이 시의 의미는 매우 풍부하고 생각을 자극합니다.","sourceNo":4549},{"no":1633,"category":"성질·상태·문법","word":"浓厚","pinyin":"nónghòu","meaning":"짙다, 농후하다","example":"他对天文学一直保持着浓厚的兴趣。","examplePinyin":"Tā duì tiānwénxué yìzhí bǎochí zhe nónghòu de xìngqù.","translation":"그는 항상 천문학에 깊은 관심을 가져왔습니다.","sourceNo":4561},{"no":1634,"category":"성질·상태·문법","word":"排名","pinyin":"páimíng","meaning":"순위를 매기다","example":"他在这次考试中排名全班第一。","examplePinyin":"Tā zài zhè cì kǎoshì zhōng páimíng quánbān dìyī.","translation":"그는 이번 시험에서 반에서 1등을 했다.","sourceNo":4569},{"no":1635,"category":"성질·상태·문법","word":"庞大","pinyin":"pángdà","meaning":"방대하다","example":"这项建设工程规模庞大，需要多年才能完成。","examplePinyin":"Zhè xiàng jiànshè gōngchéng guīmó pángdà, xūyào duōnián cái néng wánchéng.","translation":"이 건설 공사는 규모가 방대해 완공까지 여러 해가 걸려요.","sourceNo":4571},{"no":1636,"category":"성질·상태·문법","word":"片面","pinyin":"piànmiàn","meaning":"편파적이다, 일방적이다","example":"只从一个角度考虑问题未免太片面。","examplePinyin":"Zhǐ cóng yí ge jiǎodù kǎolǜ wèntí wèimiǎntài piànmiàn.","translation":"한 각도에서만 문제를 고려하는 것은 너무 일방적일 것입니다.","sourceNo":4587},{"no":1637,"category":"성질·상태·문법","word":"平等","pinyin":"píngděng","meaning":"평등하다","example":"每个人都应该受到公平平等的对待。","examplePinyin":"Měi ge rén dōu yīnggāi shòudào gōngpíng píngděng de duìdài.","translation":"모든 사람은 공정하고 평등하게 대우받아야 합니다.","sourceNo":4595},{"no":1638,"category":"성질·상태·문법","word":"平凡","pinyin":"píngfán","meaning":"평범하다","example":"他虽然过着平凡的生活，却很充实。","examplePinyin":"Tā suīrán guo zhe píngfán de shēnghuó, què hěn chōngshí.","translation":"그는 평범하게 살지만 일상은 매우 알차요.","sourceNo":4596},{"no":1639,"category":"성질·상태·문법","word":"贫困","pinyin":"pínkùn","meaning":"빈곤하다","example":"政府一直致力于帮助贫困地区脱贫。","examplePinyin":"Zhèngfǔ yìzhí zhìlìyú bāngzhù pínkùn dìqū tuōpín.","translation":"정부는 가난한 지역의 빈곤 퇴치를 돕기 위해 노력해 왔습니다.","sourceNo":4602},{"no":1640,"category":"성질·상태·문법","word":"迫切","pinyin":"pòqiè","meaning":"절박하다, 절실하다","example":"灾区人民迫切需要外界的援助支持。","examplePinyin":"Zāiqū rénmín pòqiè xūyào wàijiè de yuánzhù zhīchí.","translation":"재해 지역 주민들은 외부의 도움이 절실히 필요해요.","sourceNo":4607},{"no":1641,"category":"성질·상태·문법","word":"朴素","pinyin":"pǔsù","meaning":"소박하다, 검소하다","example":"她生活一向简单，穿着也十分朴素。","examplePinyin":"Tā shēnghuó yíxiàng jiǎndān, chuānzhe yě shífēn pǔsù.","translation":"그녀는 생활이 소박하고 옷차림도 검소해요.","sourceNo":4611},{"no":1642,"category":"성질·상태·문법","word":"恰当","pinyin":"qiàdàng","meaning":"적절하다","example":"在这种场合说这种话很不恰当。","examplePinyin":"Zài zhè zhǒng chǎnghé shuō zhè zhǒng huà hěn bú qiàdàng.","translation":"이런 자리에서 그런 말을 하는 것은 매우 부적절해요.","sourceNo":4612},{"no":1643,"category":"성질·상태·문법","word":"恰好","pinyin":"qiàhǎo","meaning":"마침, 공교롭게도","example":"我到达车站的时候，恰好赶上了末班车。","examplePinyin":"Wǒ dàodá chēzhàn de shíhou, qiàhǎo gǎnshàng le mòbānchē.","translation":"역에 도착했을 때 우연히 막차를 탔습니다.","sourceNo":4613},{"no":1644,"category":"성질·상태·문법","word":"前景","pinyin":"qiánjǐng","meaning":"전망","example":"专家普遍看好新能源汽车的前景。","examplePinyin":"Zhuānjiā pǔbiàn kànhǎo xīnnéngyuán qìchē de qiánjǐng.","translation":"전문가들은 일반적으로 신에너지 차량의 전망에 대해 낙관적입니다.","sourceNo":4621},{"no":1645,"category":"성질·상태·문법","word":"潜力","pinyin":"qiánlì","meaning":"잠재력","example":"教练认为这名年轻选手很有潜力。","examplePinyin":"Jiàoliàn rènwéi zhè míng niánqīng xuǎnshǒu hěn yǒu qiánlì.","translation":"코치는 이 어린 선수가 큰 잠재력을 갖고 있다고 생각합니다.","sourceNo":4622},{"no":1646,"category":"성질·상태·문법","word":"前提","pinyin":"qiántí","meaning":"전제","example":"互相信任是长期合作的重要前提。","examplePinyin":"Hùxiāng xìnrèn shì chángqī hézuò de zhòngyào qiántí.","translation":"상호 신뢰는 장기적인 협력을 위한 중요한 전제 조건입니다.","sourceNo":4624},{"no":1647,"category":"성질·상태·문법","word":"谦虚","pinyin":"qiānxū","meaning":"겸손하다 / 겸손해하다","example":"尽管成绩优异，他依然十分谦虚。","examplePinyin":"Jǐnguǎn chéngjì yōuyì, tā yīrán shífēn qiānxū.","translation":"그의 뛰어난 업적에도 불구하고 그는 매우 겸손한 태도를 유지했습니다.","sourceNo":4625},{"no":1648,"category":"성질·상태·문법","word":"巧妙","pinyin":"qiǎomiào","meaning":"교묘하다","example":"他用一个巧妙的方法解决了难题。","examplePinyin":"Tā yòng yí ge qiǎomiào de fāngfǎ jiějué le nántí.","translation":"그는 독창적인 방법으로 문제를 해결했습니다.","sourceNo":4629},{"no":1649,"category":"성질·상태·문법","word":"恰恰","pinyin":"qiàqià","meaning":"바로, 정확히","example":"这恰恰就是我一直期待的结果。","examplePinyin":"Zhè qiàqià jiùshì wǒ yìzhí qīdài de jiēguǒ.","translation":"이것이 바로 내가 기다려온 것입니다.","sourceNo":4630},{"no":1650,"category":"성질·상태·문법","word":"切实","pinyin":"qièshí","meaning":"확실한; 실질적으로","example":"政府承诺切实解决群众关心的问题。","examplePinyin":"Zhèngfǔ chéngnuò qièshí jiějué qúnzhòng guānxīn de wèntí.","translation":"정부는 국민의 관심사를 효과적으로 해결하기 위해 최선을 다하고 있습니다.","sourceNo":4634},{"no":1651,"category":"성질·상태·문법","word":"气氛","pinyin":"qìfēn","meaning":"분위기","example":"节日期间，街上洋溢着热闹的气氛。","examplePinyin":"Jiérì qījiān, jiēshang yángyìzhe rènao de qìfēn.","translation":"축제 기간 동안 거리는 활기 넘치는 분위기로 가득 차 있습니다.","sourceNo":4636},{"no":1652,"category":"성질·상태·문법","word":"清","pinyin":"qīng","meaning":"맑다 / 정리하다","example":"山涧里的溪水清澈见底，十分怡人。","examplePinyin":"Shānjiàn lǐ de xīshuǐ qīngchè jiàndǐ, shífēn yí rén.","translation":"계류의 물은 수정처럼 맑고 매우 쾌적합니다.","sourceNo":4638},{"no":1653,"category":"성질·상태·문법","word":"清晰","pinyin":"qīngxī","meaning":"뚜렷하다, 선명하다","example":"这张照片拍得非常清晰，细节分明。","examplePinyin":"Zhè zhāng zhàopiàn pāi de fēicháng qīngxī, xìjié fēnmíng.","translation":"이 사진은 뚜렷한 디테일로 매우 선명하게 촬영되었습니다.","sourceNo":4650},{"no":1654,"category":"성질·상태·문법","word":"情形","pinyin":"qíngxing","meaning":"상황, 정황","example":"当时突发的紧急情形让人措手不及。","examplePinyin":"Dāngshí tūfā de jǐnjí qíngxing ràng rén cuòshǒu bùjí.","translation":"당시 갑작스러운 긴급 상황은 사람들을 놀라게 했다.","sourceNo":4652},{"no":1655,"category":"성질·상태·문법","word":"清醒","pinyin":"qīngxǐng","meaning":"맑다, 또렷하다 / 깨어나다","example":"手术后，他很快就恢复了清醒意识。","examplePinyin":"Shǒushù hòu, tā hěn kuài jiù huīfù le qīngxǐng yìshí.","translation":"수술 후 그는 빠르게 의식을 되찾았습니다.","sourceNo":4653},{"no":1656,"category":"성질·상태·문법","word":"勤劳","pinyin":"qínláo","meaning":"근면하다","example":"这个村子的村民一向以勤劳著称。","examplePinyin":"Zhè ge cūnzi de cūnmín yíxiàng yǐ qínláo zhùchēng.","translation":"이 마을 주민들은 항상 열심히 일하는 것으로 알려져 왔습니다.","sourceNo":4654},{"no":1657,"category":"성질·상태·문법","word":"齐全","pinyin":"qíquán","meaning":"완비되다, 완전히 갖추다","example":"这家超市商品种类齐全，买东西很方便。","examplePinyin":"Zhè jiā chāoshì shāngpǐn zhǒnglèi qíquán, mǎi dōngxi hěn fāngbiàn.","translation":"이 슈퍼마켓은 상품 종류가 다 갖춰져 있어 쇼핑하기 편해요.","sourceNo":4658},{"no":1658,"category":"성질·상태·문법","word":"气质","pinyin":"qìzhì","meaning":"기질, 분위기","example":"她举止优雅，浑身散发着独特气质。","examplePinyin":"Tā jǔzhǐ yōuyǎ, húnshēn sànfā zhe dútè qìzhì.","translation":"그녀는 우아하게 행동하고 독특한 기질을 발산합니다.","sourceNo":4671},{"no":1659,"category":"성질·상태·문법","word":"缺陷","pinyin":"quēxiàn","meaning":"결함","example":"这批产品在质量上存在明显缺陷。","examplePinyin":"Zhè pī chǎnpǐn zài zhìliàng shàng cúnzài míngxiǎn quēxiàn.","translation":"이 제품 배치에는 품질에 명백한 결함이 있습니다.","sourceNo":4682},{"no":1660,"category":"성질·상태·문법","word":"认可","pinyin":"rènkě","meaning":"인정하다, 허가하다","example":"他的努力和成绩得到了大家一致认可。","examplePinyin":"Tā de nǔlì hé chéngjì dédào le dàjiā yízhì rènkě.","translation":"그의 노력과 업적은 모든 사람이 만장일치로 인정했습니다.","sourceNo":4697},{"no":1661,"category":"성질·상태·문법","word":"人为","pinyin":"rénwéi","meaning":"인위적인","example":"这场事故很大程度上是由人为疏忽造成的。","examplePinyin":"Zhè chǎng shìgù hěn dà chéngdù shàng shì yóu rénwéi shūhū zàochéng de.","translation":"이번 사고는 대부분 인간의 부주의로 인해 발생했다.","sourceNo":4703},{"no":1662,"category":"성질·상태·문법","word":"荣誉","pinyin":"róngyù","meaning":"영예","example":"他因为出色的表现获得了很高荣誉。","examplePinyin":"Tā yīnwèi chūsè de biǎoxiàn huòdé le hěn gāo róngyù.","translation":"그는 뛰어난 성과로 높은 영예를 얻었습니다.","sourceNo":4717},{"no":1663,"category":"성질·상태·문법","word":"柔软","pinyin":"róuruǎn","meaning":"부드럽다","example":"这条毛毯摸起来非常柔软舒适。","examplePinyin":"Zhè tiáo máotǎn mōqǐlai fēicháng róuruǎn shūshì.","translation":"이 담요는 매우 부드럽고 편안한 느낌을 줍니다.","sourceNo":4718},{"no":1664,"category":"성질·상태·문법","word":"弱点","pinyin":"ruòdiǎn","meaning":"약점","example":"教练帮助运动员找出了自身弱点。","examplePinyin":"Jiàoliàn bāngzhù yùndòngyuán zhǎochū le zìshēn ruòdiǎn.","translation":"코치는 운동선수가 자신의 약점을 식별하도록 돕습니다.","sourceNo":4721},{"no":1665,"category":"성질·상태·문법","word":"上进","pinyin":"shàngjìn","meaning":"발전하다, 향상하려 애쓰다","example":"他一直是一个非常努力上进的孩子。","examplePinyin":"Tā yìzhí shì yí ge fēicháng nǔlì shàngjìn de háizi.","translation":"그는 늘 열심히 노력하며 발전하려는 아이였어요.","sourceNo":4744},{"no":1666,"category":"성질·상태·문법","word":"上述","pinyin":"shàngshù","meaning":"상술한","example":"以上述方案为基础，我们继续讨论细节。","examplePinyin":"Yǐ shàngshù fāng'àn wéi jīchǔ, wǒmen jìxù tǎolùn xìjié.","translation":"위의 시나리오를 바탕으로 세부 사항에 대한 논의를 진행합니다.","sourceNo":4747},{"no":1667,"category":"성질·상태·문법","word":"剩余","pinyin":"shèngyú","meaning":"남다 / 나머지","example":"项目结束后，还剩余一些经费未用完。","examplePinyin":"Xiàngmù jiéshù hòu, hái shèngyú yìxiē jīngfèi wèi yòng wán.","translation":"프로젝트가 종료된 후에도 아직 사용되지 않은 자금이 남아 있었습니다.","sourceNo":4766},{"no":1668,"category":"성질·상태·문법","word":"神奇","pinyin":"shénqí","meaning":"신기하다","example":"大自然中隐藏着许多神奇的奥秘。","examplePinyin":"Dàzìrán zhōng yǐncáng zhe xǔduō shénqí de àomì.","translation":"자연에는 많은 마법의 신비가 숨겨져 있습니다.","sourceNo":4769},{"no":1669,"category":"성질·상태·문법","word":"适度","pinyin":"shìdù","meaning":"적당하다, 적절하다","example":"医生建议他保持适度的运动锻炼。","examplePinyin":"Yīshēng jiànyì tā bǎochí shìdù de yùndòng duànliàn.","translation":"의사들은 그에게 적당한 운동을 유지하라고 조언했습니다.","sourceNo":4781},{"no":1670,"category":"성질·상태·문법","word":"适宜","pinyin":"shìyí","meaning":"적합하다","example":"这里气候温和，非常适宜种植水果。","examplePinyin":"Zhèlǐ qìhòu wēnhé, fēicháng shìyí zhòngzhí shuǐguǒ.","translation":"이곳의 기후는 온화하여 과일 재배에 적합합니다.","sourceNo":4802},{"no":1671,"category":"성질·상태·문법","word":"实质","pinyin":"shízhì","meaning":"본질, 실질","example":"这场争论的实质其实是利益的分配。","examplePinyin":"Zhè chǎng zhēnglùn de shízhì qíshí shì lìyì de fēnpèi.","translation":"이 논쟁의 본질은 사실 이익을 나누는 문제예요.","sourceNo":4805},{"no":1672,"category":"성질·상태·문법","word":"十足","pinyin":"shízú","meaning":"충분하다, 완전하다","example":"他信心十足地站上了演讲台。","examplePinyin":"Tā xìnxīn shízú de zhànshàng le yǎnjiǎngtái.","translation":"그는 자신감이 가득한 모습으로 연단에 섰어요.","sourceNo":4807},{"no":1673,"category":"성질·상태·문법","word":"首要","pinyin":"shǒuyào","meaning":"가장 중요한","example":"保障学生安全是学校工作的首要任务。","examplePinyin":"Bǎozhàng xuésheng ānquán shì xuéxiào gōngzuò de shǒuyào rènwu.","translation":"학생의 안전을 보장하는 것이 학교의 최우선 과제입니다.","sourceNo":4815},{"no":1674,"category":"성질·상태·문법","word":"竖","pinyin":"shù","meaning":"세로의, 수직의 / 세우다","example":"他把这块牌子竖立在了路口显眼处。","examplePinyin":"Tā bǎ zhè kuài páizi shùlì zài le lùkǒu xiǎnyǎn chù.","translation":"그는 교차로의 눈에 띄는 곳에 이 표지판을 세웠습니다.","sourceNo":4818},{"no":1675,"category":"성질·상태·문법","word":"率先","pinyin":"shuàixiān","meaning":"앞장서서","example":"他在讨论中率先提出了自己的看法。","examplePinyin":"Tā zài tǎolùn zhōng shuàixiān tíchū le zìjǐ de kànfǎ.","translation":"그는 토론에서 자신의 견해를 가장 먼저 제시했습니다.","sourceNo":4822},{"no":1676,"category":"성질·상태·문법","word":"松","pinyin":"sōng","meaning":"느슨하다 / 느슨하게 하다","example":"这条腰带系得太松了，容易滑落。","examplePinyin":"Zhè tiáo yāodài xì de tài sōng le, róngyì huáluò.","translation":"이 벨트는 너무 느슨해서 쉽게 벗겨집니다.","sourceNo":4842},{"no":1677,"category":"성질·상태·문법","word":"算了","pinyin":"suànle","meaning":"됐다, 그만두다","example":"事情已经过去了，就这样算了吧。","examplePinyin":"Shìqing yǐjīng guòqu le, jiù zhèyàng suàn le ba.","translation":"끝났으니 잊어버리자.","sourceNo":4845},{"no":1678,"category":"성질·상태·문법","word":"算是","pinyin":"suànshì","meaning":"~인 셈이다","example":"经过多次尝试，这也算是一种收获。","examplePinyin":"Jīngguò duōcì chángshì, zhè yě suànshì yì zhǒng shōuhuò.","translation":"많은 시도 끝에 이것은 수확으로 간주될 수 있습니다.","sourceNo":4846},{"no":1679,"category":"성질·상태·문법","word":"虽","pinyin":"suī","meaning":"비록","example":"他虽年纪不大，做事却十分稳重。","examplePinyin":"Tā suī niánjì búdà, zuòshì què shífēn wěnzhòng.","translation":"나이는 어리지만 일에는 매우 꾸준하다.","sourceNo":4847},{"no":1680,"category":"성질·상태·문법","word":"所2","pinyin":"suǒ","meaning":"~하는 바","example":"这正是我今天所了解的全部情况。","examplePinyin":"Zhè zhèngshì wǒ jīntiān suǒ liǎojiě de quánbù qíngkuàng.","translation":"이것이 바로 제가 오늘 파악한 상황의 전부예요.","sourceNo":4852},{"no":1681,"category":"성질·상태·문법","word":"素质","pinyin":"sùzhì","meaning":"소양, 자질","example":"良好的道德素质是做人的根本基础。","examplePinyin":"Liánghǎo de dàodé sùzhì shì zuòrén de gēnběn jīchǔ.","translation":"좋은 도덕적 자질은 인간 존재의 근본적인 기초입니다.","sourceNo":4854},{"no":1682,"category":"성질·상태·문법","word":"弹性","pinyin":"tánxìng","meaning":"탄력성","example":"这种新型材料具有极佳的弹性和韧性。","examplePinyin":"Zhè zhǒng xīnxíng cáiliào jùyǒu jíjiā de tánxìng hé rènxìng.","translation":"이 신소재는 탄성과 인성이 뛰어납니다.","sourceNo":4867},{"no":1683,"category":"성질·상태·문법","word":"淘气","pinyin":"táoqì","meaning":"장난꾸러기이다","example":"邻居家的孩子既活泼又特别淘气。","examplePinyin":"Línjūjiā de háizi jì huópo yòu tèbié táoqì.","translation":"이웃집 아이들은 활기차고 매우 장난꾸러기입니다.","sourceNo":4872},{"no":1684,"category":"성질·상태·문법","word":"踏实","pinyin":"tāshi","meaning":"착실하다, 마음이 놓이다","example":"他工作勤奋，做事一向十分踏实。","examplePinyin":"Tā gōngzuò qínfèn, zuòshì yíxiàng shífēn tāshi.","translation":"그는 부지런히 일하며 무슨 일이든 착실하게 해요.","sourceNo":4874},{"no":1685,"category":"성질·상태·문법","word":"特","pinyin":"tè","meaning":"특별히","example":"妈妈特地为我准备了一顿丰盛晚餐。","examplePinyin":"Māma tèdì wèi wǒ zhǔnbèi le yí dùn fēngshèng wǎncān.","translation":"어머니는 나를 위해 특별히 호화로운 저녁을 준비하셨다.","sourceNo":4875},{"no":1686,"category":"성질·상태·문법","word":"特长","pinyin":"tècháng","meaning":"특기","example":"每个学生都有自己独特的兴趣和特长。","examplePinyin":"Měi ge xuésheng dōu yǒu zìjǐ dútè de xìngqù hé tècháng.","translation":"모든 학생은 자신만의 독특한 관심분야와 장점을 가지고 있습니다.","sourceNo":4876},{"no":1687,"category":"성질·상태·문법","word":"特地","pinyin":"tèdì","meaning":"특별히, 일부러","example":"他特地请假一天，赶来参加婚礼。","examplePinyin":"Tā tèdì qǐngjià yì tiān, gǎnlái cānjiā hūnlǐ.","translation":"그는 결혼식에 오려고 일부러 하루 휴가를 냈어요.","sourceNo":4877},{"no":1688,"category":"성질·상태·문법","word":"特定","pinyin":"tèdìng","meaning":"특정한","example":"这类症状通常只在特定条件下出现。","examplePinyin":"Zhè lèi zhèngzhuàng tōngcháng zhǐ zài tèdìng tiáojiàn xià chūxiàn.","translation":"이러한 증상은 일반적으로 특정 조건에서만 나타납니다.","sourceNo":4878},{"no":1689,"category":"성질·상태·문법","word":"特性","pinyin":"tèxìng","meaning":"특성","example":"每种材料都有各自独特的物理特性。","examplePinyin":"Měi zhǒng cáiliào dōu yǒu gèzì dútè de wùlǐ tèxìng.","translation":"각 재료는 고유한 물리적 특성을 가지고 있습니다.","sourceNo":4879},{"no":1690,"category":"성질·상태·문법","word":"特意","pinyin":"tèyì","meaning":"특별히, 일부러","example":"为了给她惊喜，他特意提前赶了回来。","examplePinyin":"Wèile gěi tā jīngxǐ, tā tèyì tíqián gǎn le huílai.","translation":"그녀를 놀라게 하기 위해 그는 일찍 서둘러 돌아왔다.","sourceNo":4880},{"no":1691,"category":"성질·상태·문법","word":"天然","pinyin":"tiānrán","meaning":"천연의","example":"这种护肤品全部选用天然植物成分。","examplePinyin":"Zhè zhǒng hùfūpǐn quánbù xuǎnyòng tiānrán zhíwù chéngfèn.","translation":"이 스킨케어 제품은 천연 식물 성분을 모두 사용합니다.","sourceNo":4886},{"no":1692,"category":"성질·상태·문법","word":"天真","pinyin":"tiānzhēn","meaning":"천진하다, 순진하다","example":"孩子那份天真无邪的笑容令人感动。","examplePinyin":"Háizi nà fèn tiānzhēn wúxié de xiàoróng lìngrén gǎndòng.","translation":"아이의 천진난만한 미소가 감동적이다.","sourceNo":4890},{"no":1693,"category":"성질·상태·문법","word":"听话","pinyin":"tīnghuà","meaning":"말을 잘 듣다","example":"这个孩子从小就非常懂事听话。","examplePinyin":"Zhè ge háizi cóngxiǎo jiù fēicháng dǒngshì tīnghuà.","translation":"이 아이는 어렸을 때부터 매우 현명하고 순종적이었습니다.","sourceNo":4897},{"no":1694,"category":"성질·상태·문법","word":"体系","pinyin":"tǐxì","meaning":"체계","example":"学校建立了一套完善的教学评价体系。","examplePinyin":"Xuéxiào jiànlì le yí tào wánshàn de jiàoxué píngjià tǐxì.","translation":"학교는 완전한 교육 평가 시스템을 구축했습니다.","sourceNo":4902},{"no":1695,"category":"성질·상태·문법","word":"同类","pinyin":"tónglèi","meaning":"동류의 / 같은 종류","example":"市场上同类产品竞争十分激烈。","examplePinyin":"Shìchǎng shàng tónglèi chǎnpǐn jìngzhēng shífēn jīliè.","translation":"시장에서는 유사한 제품 간의 경쟁이 치열합니다.","sourceNo":4911},{"no":1696,"category":"성질·상태·문법","word":"通用","pinyin":"tōngyòng","meaning":"통용되다, 범용의","example":"这种插头在世界大多数国家都通用。","examplePinyin":"Zhè zhǒng chātóu zài shìjiè dàduōshù guójiā dōu tōngyòng.","translation":"이 플러그는 세계 대부분의 나라에서 쓸 수 있어요.","sourceNo":4915},{"no":1697,"category":"성질·상태·문법","word":"透明","pinyin":"tòumíng","meaning":"투명하다","example":"这个玻璃杯做得非常精致透明。","examplePinyin":"Zhè ge bōlíbēi zuò de fēicháng jīngzhì tòumíng.","translation":"이 유리컵은 정교하게 만들어졌으며 투명해요.","sourceNo":4920},{"no":1698,"category":"성질·상태·문법","word":"偷偷","pinyin":"tōutōu","meaning":"몰래","example":"他偷偷藏起了一份珍贵的礼物。","examplePinyin":"Tā tōutōu cáng qǐ le yí fèn zhēnguì de lǐwù.","translation":"그는 귀중한 선물을 비밀리에 숨겼습니다.","sourceNo":4924},{"no":1699,"category":"성질·상태·문법","word":"团结","pinyin":"tuánjié","meaning":"단결하다 / 단결적이다","example":"团队只有团结一致才能取得胜利。","examplePinyin":"Tuánduì zhǐyǒu tuánjié yízhì cái néng qǔdé shènglì.","translation":"팀은 서로 협력해야만 승리할 수 있습니다.","sourceNo":4929},{"no":1700,"category":"성질·상태·문법","word":"团体","pinyin":"tuántǐ","meaning":"단체","example":"这是一个专注公益事业的团体组织。","examplePinyin":"Zhè shì yí ge zhuānzhù gōngyì shìyè de tuántǐ zǔzhī.","translation":"공공복지에 초점을 맞춘 단체조직입니다.","sourceNo":4930},{"no":1701,"category":"성질·상태·문법","word":"突发","pinyin":"tūfā","meaning":"돌발하다","example":"医院及时处理了这起突发意外事件。","examplePinyin":"Yīyuàn jíshí chǔlǐ le zhè qǐ tūfā yìwài shìjiàn.","translation":"병원에서는 예상치 못한 사건을 신속하게 처리했습니다.","sourceNo":4934},{"no":1702,"category":"성질·상태·문법","word":"途径","pinyin":"tújìng","meaning":"경로, 방법","example":"我们要探索解决问题的最佳途径。","examplePinyin":"Wǒmen yào tànsuǒ jiějué wèntí de zuìjiā tújìng.","translation":"우리는 문제를 해결하는 최선의 방법을 찾아야 합니다.","sourceNo":4939},{"no":1703,"category":"성질·상태·문법","word":"歪","pinyin":"wāi","meaning":"비뚤다, 기울다","example":"这幅画挂得有点儿歪，请调整一下。","examplePinyin":"Zhè fú huà guà de yǒudiǎnr wāi, qǐng tiáozhěng yíxià.","translation":"이 그림이 조금 비뚤어지게 걸려 있으니 조정해 주세요.","sourceNo":4949},{"no":1704,"category":"성질·상태·문법","word":"外表","pinyin":"wàibiǎo","meaning":"외모, 겉모습","example":"他外表看起来严肃，其实性格温和。","examplePinyin":"Tā wàibiǎo kànqǐlai yánsù, qíshí xìnggé wēnhé.","translation":"겉으로는 진지해 보이지만 실제로는 온화한 성격을 갖고 있다.","sourceNo":4950},{"no":1705,"category":"성질·상태·문법","word":"顽强","pinyin":"wánqiáng","meaning":"완강하다, 강인하다","example":"面对困境，他表现出顽强的斗志。","examplePinyin":"Miànduì kùnjìng, tā biǎoxiàn chū wánqiáng de dòuzhì.","translation":"어려움 속에서도 그는 끈질긴 투지를 보여주었다.","sourceNo":4962},{"no":1706,"category":"성질·상태·문법","word":"弯曲","pinyin":"wānqū","meaning":"구부러지다","example":"这条山路蜿蜒弯曲，通向山顶。","examplePinyin":"Zhè tiáo shānlù wānyán wānqū, tōngxiàng shāndǐng.","translation":"이 산길은 구불구불하며 산 정상까지 이어진다.","sourceNo":4963},{"no":1707,"category":"성질·상태·문법","word":"未","pinyin":"wèi","meaning":"아직 ~하지 않다","example":"由于交通堵塞，他至今尚未到场。","examplePinyin":"Yóuyú jiāotōng dǔsè, tā zhìjīn shàngwèi dàochǎng.","translation":"교통 체증으로 인해 그는 아직 도착하지 않았습니다.","sourceNo":4966},{"no":1708,"category":"성질·상태·문법","word":"未必","pinyin":"wèibì","meaning":"반드시 ~한 것은 아니다","example":"这件事情的结果未必如你所想。","examplePinyin":"Zhè jiàn shìqing de jiēguǒ wèibì rú nǐ suǒ xiǎng.","translation":"이 문제의 결과는 귀하가 생각하는 것과 다를 수 있습니다.","sourceNo":4967},{"no":1709,"category":"성질·상태·문법","word":"为此","pinyin":"wèicǐ","meaning":"이 때문에","example":"他工作出了差错，为此深感自责。","examplePinyin":"Tā gōngzuò chū le chācuò, wèicǐ shēngǎn zìzé.","translation":"그는 직장에서 실수를 했고 그것에 대해 깊은 죄책감을 느꼈습니다.","sourceNo":4969},{"no":1710,"category":"성질·상태·문법","word":"为何","pinyin":"wèihé","meaning":"왜, 어째서","example":"大家都不明白他为何突然辞职。","examplePinyin":"Dàjiā dōu bù míngbai tā wèihé tūrán cízhí.","translation":"그가 갑자기 사임한 이유를 아무도 이해하지 못했습니다.","sourceNo":4971},{"no":1711,"category":"성질·상태·문법","word":"危机","pinyin":"wēijī","meaning":"위기","example":"公司管理层正在设法化解经营危机。","examplePinyin":"Gōngsī guǎnlǐcéng zhèngzài shèfǎ huàjiě jīngyíng wēijī.","translation":"회사 경영진은 경영 위기를 해결하기 위해 노력하고 있습니다.","sourceNo":4973},{"no":1712,"category":"성질·상태·문법","word":"微小","pinyin":"wēixiǎo","meaning":"미세하다, 작다","example":"一次微小的疏忽也可能酿成大错。","examplePinyin":"Yí cì wēixiǎo de shūhū yě kěnéng niàngchéng dà cuò.","translation":"작은 실수가 큰 실수로 이어질 수 있습니다.","sourceNo":4982},{"no":1713,"category":"성질·상태·문법","word":"温和","pinyin":"wēnhé","meaning":"온화하다","example":"他性格温和，从不轻易发脾气。","examplePinyin":"Tā xìnggé wēnhé, cóngbù qīngyì fāpíqi.","translation":"성격은 온순하고 쉽게 화를 내지 않는 편이다.","sourceNo":4985},{"no":1714,"category":"성질·상태·문법","word":"闻名","pinyin":"wénmíng","meaning":"유명하다","example":"这座古城以悠久历史闻名于世。","examplePinyin":"Zhè zuò gǔchéng yǐ yōujiǔ lìshǐ wénmíng yú shì.","translation":"이 고대 도시는 오랜 역사로 유명합니다.","sourceNo":4989},{"no":1715,"category":"성질·상태·문법","word":"温柔","pinyin":"wēnróu","meaning":"온유하다, 부드럽다","example":"她说话轻声细语，性格十分温柔。","examplePinyin":"Tā shuōhuà qīngshēng xìyǔ, xìnggé shífēn wēnróu.","translation":"그녀는 말투가 부드럽고 매우 온화한 성격을 가지고 있습니다.","sourceNo":4990},{"no":1716,"category":"성질·상태·문법","word":"无所谓","pinyin":"wúsuǒwèi","meaning":"상관없다","example":"输赢对他来说无所谓，参与的过程更重要。","examplePinyin":"Shūyíng duì tā láishuō wúsuǒwèi, cānyù de guòchéng gèng zhòngyào.","translation":"그에게 승패는 상관없으며 참여 과정이 더 중요해요.","sourceNo":4999},{"no":1717,"category":"성질·상태·문법","word":"物体","pinyin":"wùtǐ","meaning":"물체","example":"科学家研究了这个未知的漂浮物体。","examplePinyin":"Kēxuéjiā yánjiū le zhè ge wèizhī de piāofú wùtǐ.","translation":"과학자들은 이 알려지지 않은 떠다니는 물체를 연구했습니다.","sourceNo":5000},{"no":1718,"category":"성질·상태·문법","word":"无疑","pinyin":"wúyí","meaning":"의심할 여지 없이","example":"这份努力对他的成功无疑起了作用。","examplePinyin":"Zhè fèn nǔlì duì tā de chénggōng wúyí qǐ le zuòyòng.","translation":"이러한 노력은 의심할 여지없이 그의 성공에 중요한 역할을 했습니다.","sourceNo":5001},{"no":1719,"category":"성질·상태·문법","word":"险","pinyin":"xiǎn","meaning":"위험하다 / 하마터면","example":"他在山路上开车，情况十分惊险。","examplePinyin":"Tā zài shānlù shang kāichē, qíngkuàng shífēn jīngxiǎn.","translation":"그는 매우 위험한 상황에서 산길을 운전하고 있었습니다.","sourceNo":5010},{"no":1720,"category":"성질·상태·문법","word":"现存","pinyin":"xiàncún","meaning":"현존하다","example":"这是目前现存最古老的木质建筑。","examplePinyin":"Zhè shì mùqián xiàncún zuì gǔlǎo de mùzhì jiànzhù.","translation":"현존하는 가장 오래된 목조 건물이다.","sourceNo":5011},{"no":1721,"category":"성질·상태·문법","word":"限度","pinyin":"xiàndù","meaning":"한도","example":"每个人的耐心都有一定的限度。","examplePinyin":"Měi ge rén de nàixīn dōu yǒu yídìng de xiàndù.","translation":"모든 사람의 인내심에는 일정한 한계가 있습니다.","sourceNo":5012},{"no":1722,"category":"성질·상태·문법","word":"相差","pinyin":"xiāngchà","meaning":"차이가 나다","example":"他们两个人的年龄相差不到一岁。","examplePinyin":"Tāmen liǎng ge rén de niánlíng xiāngchà búdào yí suì.","translation":"두 사람의 나이 차이는 1살도 채 안 된다.","sourceNo":5013},{"no":1723,"category":"성질·상태·문법","word":"相等","pinyin":"xiāngděng","meaning":"같다, 대등하다","example":"这两条边的长度基本相等。","examplePinyin":"Zhè liǎng tiáo biān de chángdù jīběn xiāngděng.","translation":"이 두 변의 길이는 거의 같습니다.","sourceNo":5016},{"no":1724,"category":"성질·상태·문법","word":"相连","pinyin":"xiānglián","meaning":"서로 연결되다","example":"这两座城市之间由高速公路相连。","examplePinyin":"Zhè liǎng zuò chéngshì zhījiān yóu gāosù gōnglù xiānglián.","translation":"두 도시는 고속도로로 연결되어 있습니다.","sourceNo":5018},{"no":1725,"category":"성질·상태·문법","word":"相应","pinyin":"xiāngyìng","meaning":"상응하다","example":"遇到问题，公司会采取相应措施。","examplePinyin":"Yùdào wèntí, gōngsī huì cǎiqǔ xiāngyìng cuòshī.","translation":"문제가 발생할 경우 회사는 적절한 조치를 취합니다.","sourceNo":5023},{"no":1726,"category":"성질·상태·문법","word":"鲜明","pinyin":"xiānmíng","meaning":"뚜렷하다, 선명하다","example":"这幅画色彩鲜明，风格独树一帜。","examplePinyin":"Zhè fú huà sècǎi xiānmíng, fēnggé dú shù yí zhì.","translation":"이 그림은 밝은 색상과 독특한 스타일을 가지고 있습니다.","sourceNo":5025},{"no":1727,"category":"성질·상태·문법","word":"线索","pinyin":"xiànsuǒ","meaning":"단서","example":"侦探根据一个细小线索破了案。","examplePinyin":"Zhēntàn gēnjù yí ge xìxiǎo xiànsuǒ pò le àn.","translation":"형사는 작은 단서를 바탕으로 사건을 해결했습니다.","sourceNo":5028},{"no":1728,"category":"성질·상태·문법","word":"鲜艳","pinyin":"xiānyàn","meaning":"화려하다, 산뜻하다","example":"花园里的花朵开得十分鲜艳夺目。","examplePinyin":"Huāyuánlǐ de huāduǒ kāi de shífēn xiānyàn duómù.","translation":"정원에 핀 꽃들은 색이 매우 선명하고 아름다워요.","sourceNo":5029},{"no":1729,"category":"성질·상태·문법","word":"限于","pinyin":"xiànyú","meaning":"~에 국한되다","example":"这项政策目前只限于特定地区实行。","examplePinyin":"Zhè xiàng zhèngcè mùqián zhǐ xiànyú tèdìng dìqū shíxíng.","translation":"이 정책은 현재 특정 지역으로 제한되어 있습니다.","sourceNo":5030},{"no":1730,"category":"성질·상태·문법","word":"显著","pinyin":"xiǎnzhù","meaning":"뚜렷하다, 현저하다","example":"这项新药的治疗效果非常显著。","examplePinyin":"Zhè xiàng xīnyào de zhìliáo xiàoguǒ fēicháng xiǎnzhù.","translation":"이 신약의 치료 효과는 매우 뚜렷해요.","sourceNo":5031},{"no":1731,"category":"성질·상태·문법","word":"小气","pinyin":"xiǎoqi","meaning":"인색하다","example":"他为人小气，从不愿意帮助别人。","examplePinyin":"Tā wèi rén xiǎoqi, cóngbú yuànyì bāngzhù biéren.","translation":"그는 인색하고 결코 다른 사람을 돕지 않습니다.","sourceNo":5038},{"no":1732,"category":"성질·상태·문법","word":"效应","pinyin":"xiàoyìng","meaning":"효과, 반응","example":"这项改革措施带来了明显的经济效应。","examplePinyin":"Zhè xiàng gǎigé cuòshī dàilái le míngxiǎn de jīngjì xiàoyìng.","translation":"이번 개혁 조치는 분명한 경제적 효과를 가져왔습니다.","sourceNo":5041},{"no":1733,"category":"성질·상태·문법","word":"系列","pinyin":"xìliè","meaning":"시리즈","example":"这款手机是公司新推出的系列产品。","examplePinyin":"Zhè kuǎn shǒujī shì gōngsī xīn tuīchū de xìliè chǎnpǐn.","translation":"이 휴대폰은 회사에서 출시한 새로운 제품 시리즈입니다.","sourceNo":5053},{"no":1734,"category":"성질·상태·문법","word":"性能","pinyin":"xìngnéng","meaning":"성능","example":"这台新设备的整体性能十分出色。","examplePinyin":"Zhè tái xīn shèbèi de zhěngtǐ xìngnéng shífēn chūsè.","translation":"이 새로운 장치의 전반적인 성능은 훌륭합니다.","sourceNo":5058},{"no":1735,"category":"성질·상태·문법","word":"形态","pinyin":"xíngtài","meaning":"형태","example":"不同气候条件下，植物形态各异。","examplePinyin":"Bùtóng qìhòu tiáojiàn xià, zhíwù xíngtài gèyì.","translation":"식물의 형태는 기후 조건에 따라 다양합니다.","sourceNo":5060},{"no":1736,"category":"성질·상태·문법","word":"新兴","pinyin":"xīnxīng","meaning":"신흥의","example":"人工智能是近年来兴起的新兴产业。","examplePinyin":"Réngōngzhìnéng shì jìnniánlái xīngqǐ de xīnxīng chǎnyè.","translation":"인공지능(AI)은 최근 몇 년간 새롭게 떠오르는 신흥 산업이다.","sourceNo":5070},{"no":1737,"category":"성질·상태·문법","word":"新颖","pinyin":"xīnyǐng","meaning":"참신하다","example":"这个设计构思十分新颖独特。","examplePinyin":"Zhè ge shèjì gòusī shífēn xīnyǐng dútè.","translation":"이 디자인 컨셉은 매우 참신하고 독특합니다.","sourceNo":5071},{"no":1738,"category":"성질·상태·문법","word":"细致","pinyin":"xìzhì","meaning":"세밀하다, 세심하다","example":"他做事一向认真细致，从不马虎。","examplePinyin":"Tā zuòshì yíxiàng rènzhēn xìzhì, cóngbù mǎhu.","translation":"그는 일을 할 때 항상 진지하고 꼼꼼하며 결코 부주의하지 않습니다.","sourceNo":5083},{"no":1739,"category":"성질·상태·문법","word":"严","pinyin":"yán","meaning":"엄격하다","example":"老师对学生的要求一向十分严格。","examplePinyin":"Lǎoshī duì xuésheng de yāoqiú yíxiàng shífēn yángé.","translation":"선생님들은 항상 학생들에게 매우 엄격하셨습니다.","sourceNo":5100},{"no":1740,"category":"성질·상태·문법","word":"眼看","pinyin":"yǎnkàn","meaning":"곧, 눈앞에 / 눈으로 보다","example":"眼看就要迟到了，他赶紧加快脚步。","examplePinyin":"Yǎnkàn jiùyào chídào le, tā gǎnjǐn jiākuài jiǎobù.","translation":"그는 늦을 뻔한 것을 알고 서둘러 속도를 높였다.","sourceNo":5113},{"no":1741,"category":"성질·상태·문법","word":"严厉","pinyin":"yánlì","meaning":"엄격하다, 준엄하다","example":"老师用严厉的语气批评了迟到的学生。","examplePinyin":"Lǎoshī yòng yánlì de yǔqì pīpíng le chídào de xuésheng.","translation":"선생님은 엄한 어조로 지각한 학생들을 꾸짖었다.","sourceNo":5114},{"no":1742,"category":"성질·상태·문법","word":"要点","pinyin":"yàodiǎn","meaning":"요점","example":"请把这份报告的要点整理出来。","examplePinyin":"Qǐng bǎ zhè fèn bàogào de yàodiǎn zhěnglǐ chūlai.","translation":"본 보고서의 핵심 내용을 정리해주세요.","sourceNo":5125},{"no":1743,"category":"성질·상태·문법","word":"要么","pinyin":"yàome","meaning":"아니면(要么...要么...)","example":"你要么听我的，要么自己想办法。","examplePinyin":"Nǐ yàome tīng wǒ de, yàome zìjǐ xiǎng bànfǎ.","translation":"내 말을 듣거나 스스로 알아내세요.","sourceNo":5126},{"no":1744,"category":"성질·상태·문법","word":"要素","pinyin":"yàosù","meaning":"요소","example":"团结协作是团队成功的重要要素。","examplePinyin":"Tuánjié xiézuò shì tuánduì chénggōng de zhòngyào yàosù.","translation":"단결과 협업은 팀 성공의 중요한 요소입니다.","sourceNo":5127},{"no":1745,"category":"성질·상태·문법","word":"遥远","pinyin":"yáoyuǎn","meaning":"요원하다, 아득히 멀다","example":"他梦想有一天能到那个遥远的国家。","examplePinyin":"Tā mèngxiǎng yǒu yì tiān néng dào nà ge yáoyuǎn de guójiā.","translation":"그는 언젠가 그 먼 나라를 방문하는 꿈을 꾼다.","sourceNo":5128},{"no":1746,"category":"성질·상태·문법","word":"也好","pinyin":"yěhǎo","meaning":"~도 괜찮다","example":"无论结果如何，尝试一下也好。","examplePinyin":"Wúlùn jiēguǒ rúhé, chángshì yíxià yě hǎo.","translation":"결과가 어떻든 한번 시도해 보세요.","sourceNo":5132},{"no":1747,"category":"성질·상태·문법","word":"以便","pinyin":"yǐbiàn","meaning":"~하기 위하여","example":"请提前预约，以便安排好行程。","examplePinyin":"Qǐng tíqián yùyuē, yǐbiàn ānpái hǎo xíngchéng.","translation":"여행 준비를 위해 사전에 예약하시기 바랍니다.","sourceNo":5138},{"no":1748,"category":"성질·상태·문법","word":"异常","pinyin":"yìcháng","meaning":"이상하다 / 매우(부사)","example":"他今天的行为显得有些异常。","examplePinyin":"Tā jīntiān de xíngwéi xiǎnde yǒuxiē yìcháng.","translation":"오늘 그의 행동은 조금 이상해 보였습니다.","sourceNo":5140},{"no":1749,"category":"성질·상태·문법","word":"益处","pinyin":"yìchù","meaning":"이익, 좋은 점","example":"坚持阅读对孩子成长很有益处。","examplePinyin":"Jiānchí yuèdú duì háizi chéngzhǎng hěn yǒu yìchù.","translation":"꾸준한 독서는 아이들의 성장에 매우 유익합니다.","sourceNo":5141},{"no":1750,"category":"성질·상태·문법","word":"一道","pinyin":"yídào","meaning":"함께","example":"我们决定一道去博物馆参观。","examplePinyin":"Wǒmen juédìng yí dào qù bówùguǎn cānguān.","translation":"우리는 함께 박물관을 방문하기로 결정했습니다.","sourceNo":5144},{"no":1751,"category":"성질·상태·문법","word":"一帆风顺","pinyin":"yìfān fēngshùn","meaning":"순조롭다","example":"祝你今后的事业一帆风顺。","examplePinyin":"Zhù nǐ jīnhòu de shìyè yìfānfēngshùn.","translation":"앞으로 하시는 일이 모두 순조롭기를 바라요.","sourceNo":5145},{"no":1752,"category":"성질·상태·문법","word":"一流","pinyin":"yīliú","meaning":"일류의","example":"这所大学在国内堪称一流学府。","examplePinyin":"Zhè suǒ dàxué zài guónèi kānchēng yìliú xuéfǔ.","translation":"이 대학은 국내에서 일류 대학으로 꼽혀요.","sourceNo":5151},{"no":1753,"category":"성질·상태·문법","word":"以免","pinyin":"yǐmiǎn","meaning":"~하지 않도록","example":"请提前出发，以免路上耽误时间。","examplePinyin":"Qǐng tíqián chūfā, yǐmiǎn lùshang dānwu shíjiān.","translation":"이동 중에 시간을 낭비하지 않도록 일찍 출발하시기 바랍니다.","sourceNo":5154},{"no":1754,"category":"성질·상태·문법","word":"一模一样","pinyin":"yìmú yíyàng","meaning":"똑같다","example":"这两件衣服的款式一模一样。","examplePinyin":"Zhè liǎng jiàn yīfu de kuǎnshì yìmúyíyàng.","translation":"이 두 옷의 스타일은 완전히 동일합니다.","sourceNo":5156},{"no":1755,"category":"성질·상태·문법","word":"因","pinyin":"yīn","meaning":"~때문에(개사) / ~때문에(접속사)","example":"他因迟到而受到了老师的批评。","examplePinyin":"Tā yīn chídào ér shòudào le lǎoshī de pīpíng.","translation":"그는 늦었다고 선생님으로부터 비난을 받았습니다.","sourceNo":5160},{"no":1756,"category":"성질·상태·문법","word":"一身","pinyin":"yìshēn","meaning":"온몸","example":"他浑身湿透，一身泥泞地回家了。","examplePinyin":"Tā húnshēn shītòu, yìshēn nínìng de huíjiā le.","translation":"그는 흠뻑 젖어 진흙투성이가 되어 집으로 돌아왔습니다.","sourceNo":5174},{"no":1757,"category":"성질·상태·문법","word":"一同","pinyin":"yìtóng","meaning":"함께","example":"我们决定周末一同去郊外爬山。","examplePinyin":"Wǒmen juédìng zhōumò yìtóng qù jiāowài páshān.","translation":"우리는 주말에 함께 시골로 하이킹을 가기로 결정했습니다.","sourceNo":5178},{"no":1758,"category":"성질·상태·문법","word":"易于","pinyin":"yìyú","meaning":"~하기 쉽다","example":"这种材料轻便，非常易于携带运输。","examplePinyin":"Zhè zhǒng cáiliào qīngbiàn, fēicháng yìyú xiédài yùnshū.","translation":"이 소재는 가벼워 휴대하고 운반하기 쉬워요.","sourceNo":5184},{"no":1759,"category":"성질·상태·문법","word":"用处","pinyin":"yòngchù","meaning":"쓸모, 용도","example":"这份说明书对新手来说很有用处。","examplePinyin":"Zhè fèn shuōmíngshū duì xīnshǒu láishuō hěn yǒu yòngchù.","translation":"이 매뉴얼은 초보자에게 매우 유용합니다.","sourceNo":5190},{"no":1760,"category":"성질·상태·문법","word":"用心","pinyin":"yòngxīn","meaning":"열심이다, 전심전력하다","example":"她对待工作一向十分认真用心。","examplePinyin":"Tā duìdài gōngzuò yíxiàng shífēn rènzhēn yòngxīn.","translation":"그녀는 늘 자신의 일에 진지하게 정성을 들여요.","sourceNo":5195},{"no":1761,"category":"성질·상태·문법","word":"勇于","pinyin":"yǒngyú","meaning":"용감하게 ~하다","example":"年轻人应该勇于面对生活的挑战。","examplePinyin":"Niánqīngrén yīnggāi yǒngyú miànduì shēnghuó de tiǎozhàn.","translation":"젊은이들은 삶의 도전에 직면할 만큼 용감해야 합니다.","sourceNo":5196},{"no":1762,"category":"성질·상태·문법","word":"有劲","pinyin":"yǒujìn","meaning":"힘이 있다, 재미있다","example":"打完篮球后，他浑身都很有劲。","examplePinyin":"Dǎ wán lánqiú hòu, tā húnshēn dōu hěn yǒujìn.","translation":"농구를 하고 난 후 그는 온몸에 활력이 넘쳤습니다.","sourceNo":5199},{"no":1763,"category":"성질·상태·문법","word":"由来","pinyin":"yóulái","meaning":"유래","example":"这个成语的由来有一段有趣故事。","examplePinyin":"Zhè ge chéngyǔ de yóulái yǒu yí duàn yǒuqù gùshi.","translation":"이 관용어의 유래에 관한 흥미로운 이야기가 있습니다.","sourceNo":5200},{"no":1764,"category":"성질·상태·문법","word":"犹如","pinyin":"yóurú","meaning":"마치 ~와 같다","example":"夜空中的繁星犹如闪烁的宝石。","examplePinyin":"Yèkōng zhōng de fánxīng yóurú shǎnshuò de bǎoshí.","translation":"밤하늘의 별들은 반짝이는 보석과 같습니다.","sourceNo":5202},{"no":1765,"category":"성질·상태·문법","word":"优先","pinyin":"yōuxiān","meaning":"우선하다","example":"医院对危重病人实行优先救治。","examplePinyin":"Yīyuàn duì wēizhòngbìng rén shíxíng yōuxiān jiùzhì.","translation":"병원은 위중한 환자를 우선 치료해요.","sourceNo":5203},{"no":1766,"category":"성질·상태·문법","word":"有序","pinyin":"yǒuxù","meaning":"질서정연하다","example":"大家有序排队进场，现场没有出现拥挤。","examplePinyin":"Dàjiā yǒuxù páiduì jìnchǎng, xiànchǎng méiyǒu chūxiàn yōngjǐ.","translation":"모두 질서 있게 줄을 서서 입장하여 현장이 붐비지 않았어요.","sourceNo":5204},{"no":1767,"category":"성질·상태·문법","word":"优异","pinyin":"yōuyì","meaning":"우수하다","example":"他凭借优异的成绩考上了名校。","examplePinyin":"Tā píngjiè yōuyì de chéngjì kǎoshàng le míngxiào.","translation":"그는 우수한 성적으로 명문학교에 입학했다.","sourceNo":5205},{"no":1768,"category":"성질·상태·문법","word":"于","pinyin":"yú","meaning":"~에서, ~에게(개사)","example":"这座图书馆建于上个世纪初。","examplePinyin":"Zhè zuò túshūguǎn jiàn yú shàngge shìjì chū.","translation":"이 도서관은 지난 세기 초에 지어졌습니다.","sourceNo":5206},{"no":1769,"category":"성질·상태·문법","word":"原本","pinyin":"yuánběn","meaning":"원래","example":"他原本打算辞职，后来改变了主意。","examplePinyin":"Tā yuánběn dǎsuàn cízhí, hòulái gǎibiàn le zhǔyi.","translation":"그는 원래 사임할 계획이었으나 나중에 마음을 바꾸었다.","sourceNo":5208},{"no":1770,"category":"성질·상태·문법","word":"远程","pinyin":"yuǎnchéng","meaning":"원격의","example":"疫情期间，很 function playQueue(entries, label) {

  let done = 0;
  showStatus(`${label} 재생 준비 중…`);
  const fail = message => {
    if (runId !== state.runId) return;
    state.speaking = false;
    state.paused = false;
    state.resumeNext = null;
    state.resumeSpeech = null;
    state.speechToken++;
    if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
    syncPauseButton();
    document.querySelectorAll('.play').forEach(b => b.disabled = false);
    showStatus(message);
  };
  const scheduleNext = item => {
    const gap = item.kind === 'word' && [...item.text].length === 1 ? 850 : 350;
    state.nextTimer = setTimeout(() => { state.nextTimer = null; next(); }, gap);
  };
  const next = async () => {
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (done >= entries.length) {
      state.speaking = false;
      state.paused = false;
      syncPauseButton();
      document.querySelectorAll('.play').forEach(b => b.disabled = false);
      showStatus(`${label} 재생 완료`);
      hideStatusLater();
      return;
    }
    const item = entries[done];

        }
      });
      return;
    }
    fail(`${item.no}번 음원을 찾지 못했습니다. 잠시 후 다시 시도해 주세요.`);

}

function fixedAudio(no, kind) { return FIXED_AUDIO[no]?.[kind] || null; }
function repeatEntries(text, repeat, progress, audio=null, no=null, kind=null) {
  return Array.from({length:repeat}, (_,i) => ({text, audio, no, kind, progress:`${progress} · ${i+1}/${repeat}회`}));
}
function focusCurrent(no) {
  if (!no) return;
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  const card = document.querySelector(`article.card:has(.startPick[data-no="${no}"])`);
  if (!card) return;
  card.classList.add('reading');
  if (state.currentNo !== no) card.scrollIntoView({behavior:'smooth', block:'center'});
  state.currentNo = no;
}
function stopPlayback() {
  state.runId++;
  clearTimeout(state.nextTimer);
  state.nextTimer = null;
  state.speaking = false;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio.currentTime=0; state.currentAudio=null; }
  state.currentNo=null;
  syncPauseButton();
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  document.querySelectorAll('.play').forEach(b => b.disabled = false);
  showStatus('재생을 멈췄습니다.');
  hideStatusLater();
}
function togglePause() {
  if (!state.speaking) return;
  if (!state.paused) {
    state.paused = true;
    if (state.currentAudio && !state.currentAudio.paused) state.currentAudio.pause();

    syncPauseButton();
    showStatus('일시정지됨 · 화면을 다시 누르거나 이어듣기 버튼을 누르세요');
    return;
  }
  state.paused = false;
  if (state.currentAudio && state.currentAudio.paused) {
    const audio = state.currentAudio;
    const runId = state.runId;
    audio.play().catch(() => {
      if (runId === state.runId && state.currentAudio === audio) audio.onerror();
    });
  }
  const resume = state.resumeNext;
  state.resumeNext = null;
  if (resume) resume();
  syncPauseButton();
  showStatus('이어서 재생합니다');
}
function showStatus(msg) {
  clearTimeout(state.statusTimer);
  statusBox.textContent = msg;
  statusBox.classList.add('show');
}
function hideStatusLater() {
  clearTimeout(state.statusTimer);
  state.statusTimer = setTimeout(() => statusBox.classList.remove('show'), 1500);
}
function selectedItems() {
  const input = document.getElementById('startNo');
  const start = Math.min(1800, Math.max(1, Math.floor(Number(input.value) || 1)));
  input.value = start;
  return {start, items:DATA.filter(x => x.no >= start)};
}

list.addEventListener('click', e => {
  const pick = e.target.closest('.startPick');
  if (pick) {
    document.getElementById('startNo').value = pick.dataset.no;
    render();
    showStatus(`${pick.dataset.no}번을 연속 재생 시작 번호로 선택했습니다.`);
    hideStatusLater();
    return;
  }
  const btn = e.target.closest('.play'); if (!btn) return;
  const item = DATA.find(x => x.no === Number(btn.dataset.no));
  const isWord = btn.dataset.kind === 'word';
  const repeat = Number(document.getElementById(isWord?'wordRepeat':'sentenceRepeat').value);
  playQueue(repeatEntries(isWord?wordSpeechText(item):item.example, repeat, `${item.no}번`, fixedAudio(item.no,isWord?'word':'example'), item.no, isWord?'word':'example'), isWord?'단어':'예문');
});
document.getElementById('playAllWords').addEventListener('click', () => {
  const repeat = Number(document.getElementById('wordRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(wordSpeechText(x), repeat, `${x.no}/1800 단어`, fixedAudio(x.no,'word'), x.no, 'word')), `${start}~1800 전체 단어`);
});
document.getElementById('playAllSentences').addEventListener('click', () => {
  const repeat = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.example, repeat, `${x.no}/1800 예문`, fixedAudio(x.no,'example'), x.no, 'example')), `${start}~1800 전체 예문`);
});
document.getElementById('playAllBoth').addEventListener('click', () => {
  const wr = Number(document.getElementById('wordRepeat').value);
  const sr = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => [...repeatEntries(wordSpeechText(x), wr, `${x.no}/1800 단어`, fixedAudio(x.no,'word'), x.no, 'word'), ...repeatEntries(x.example, sr, `${x.no}/1800 예문`, fixedAudio(x.no,'example'), x.no, 'example')]), `${start}~1800 단어+예문`);
});
document.getElementById('stopAll').addEventListener('click', stopPlayback);
pauseResumeBtn.addEventListener('click', togglePause);
document.addEventListener('click', e => {
  if (e.target.closest('button, input, select, label, a, .status')) return;
  togglePause();
});
const toTop = document.getElementById('toTop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 450), {passive:true});
document.getElementById('startNo').addEventListener('change', () => { selectedItems(); render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('pinyinToggle').addEventListener('click', e => { state.showPinyin=!state.showPinyin; e.currentTarget.classList.toggle('on',state.showPinyin); e.currentTarget.textContent=state.showPinyin?'병음 보임':'병음 숨김'; render(); });
document.getElementById('meaningToggle').addEventListener('click', e => { state.showMeaning=!state.showMeaning; e.currentTarget.classList.toggle('on',state.showMeaning); e.currentTarget.textContent=state.showMeaning?'뜻 보임':'뜻 숨김'; render(); });
document.getElementById('translationToggle').addEventListener('click', e => { state.showTranslation=!state.showTranslation; e.currentTarget.classList.toggle('on',state.showTranslation); e.currentTarget.textContent=state.showTranslation?'해석 보임':'해석 숨김'; render(); });
render();
if (window.HskTypingTest) HskTypingTest.mount(DATA);
