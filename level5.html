e":"天气不稳定，旅行社为行程准备了替代方案。","examplePinyin":"Tiānqì bù wěndìng, lǚxíngshè wèi xíngchéng zhǔnbèi le tìdài fāng'àn.","translation":"날씨가 불안정해 여행사는 일정의 대안을 준비했어요."},{"no":680,"category":"이동·교통","word":"游览","pinyin":"yóulǎn","meaning":"유람하다, 관람하다","example":"游览古迹时，了解背景比只顾拍照更有收获。","examplePinyin":"Yóulǎn gǔjì shí, liǎojiě bèijǐng bǐ zhǐgù pāizhào gèng yǒu shōuhuò.","translation":"유적을 둘러볼 때 사진만 찍기보다 배경을 알면 더 많이 배워요."},{"no":681,"category":"이동·교통","word":"预订","pinyin":"yùdìng","meaning":"예약하다, 미리 정하다","example":"旺季出行最好提前预订，以免临时找不到住处。","examplePinyin":"Wàngjì chūxíng zuìhǎo tíqián yùdìng, yǐmiǎn línshí zhǎo budào zhùchù.","translation":"성수기 여행은 숙소를 못 구하지 않도록 미리 예약하는 게 좋아요."},{"no":682,"category":"이동·교통","word":"住宿","pinyin":"zhùsù","meaning":"숙박, 숙소","example":"山区住宿条件有限，出发前需要做好充分准备。","examplePinyin":"Shānqū zhùsù tiáojiàn yǒuxiàn, chūfā qián xūyào zuòhǎo chōngfèn zhǔnbèi.","translation":"산간 지역은 숙박 여건이 제한돼 출발 전에 충분히 준비해야 해요."},{"no":683,"category":"이동·교통","word":"安全带","pinyin":"ānquándài","meaning":"안전벨트","example":"即使只坐几分钟的车，也必须系好安全带。","examplePinyin":"Jíshǐ zhǐ zuò jǐ fēnzhōng de chē, yě bìxū jì hǎo ānquándài.","translation":"차를 몇 분만 타더라도 반드시 안전벨트를 매야 해요."},{"no":684,"category":"이동·교통","word":"超速","pinyin":"chāosù","meaning":"과속하다, 속도 위반","example":"即使路上车辆很少，超速驾驶仍然十分危险。","examplePinyin":"Jíshǐ lùshang chēliàng hěn shǎo, chāosù jiàshǐ réngrán shífēn wēixiǎn.","translation":"도로에 차가 적어도 과속 운전은 매우 위험해요."},{"no":685,"category":"이동·교통","word":"车祸","pinyin":"chēhuò","meaning":"교통사고","example":"这场车祸提醒我们，驾驶时绝不能分心。","examplePinyin":"Zhè chǎng chēhuò tíxǐng wǒmen, jiàshǐ shí juébùnéng fēnxīn.","translation":"이번 교통사고는 운전 중 한눈팔면 안 된다는 것을 일깨워 줘요."},{"no":686,"category":"이동·교통","word":"车主","pinyin":"chēzhǔ","meaning":"차주, 차량 소유자","example":"发现车辆漏油后，车主立即停止驾驶并求助。","examplePinyin":"Fāxiàn chēliàng lòuyóu hòu, chēzhǔ lìjí tíngzhǐ jiàshǐ bìng qiúzhù.","translation":"차량의 기름 누출을 발견한 차주는 즉시 운전을 멈추고 도움을 요청했어요."},{"no":687,"category":"이동·교통","word":"驾驶","pinyin":"jiàshǐ","meaning":"운전하다, 조종하다","example":"驾驶过程中，任何时候都不应该查看手机消息。","examplePinyin":"Jiàshǐ guòchéng zhōng, rènhé shíhou dōu bù yīnggāi chákàn shǒujī xiāoxi.","translation":"운전 중에는 언제든 휴대전화 메시지를 확인해서는 안 돼요."},{"no":688,"category":"이동·교통","word":"驾照","pinyin":"jiàzhào","meaning":"운전면허증","example":"持有驾照只是开始，安全习惯还需要不断培养。","examplePinyin":"Chíyǒu jiàzhào zhǐshì kāishǐ, ānquán xíguàn hái xūyào búduàn péiyǎng.","translation":"면허 취득은 시작일 뿐 안전 습관은 계속 길러야 해요."},{"no":689,"category":"이동·교통","word":"汽油","pinyin":"qìyóu","meaning":"휘발유, 가솔린","example":"汽油价格变化，会影响部分家庭的出行安排。","examplePinyin":"Qìyóu jiàgé biànhuà, huì yǐngxiǎng bùfen jiātíng de chūxíng ānpái.","translation":"휘발유 가격의 변화는 일부 가정의 이동 계획에 영향을 줘요."},{"no":690,"category":"이동·교통","word":"行驶","pinyin":"xíngshǐ","meaning":"주행하다, 운행하다","example":"车辆在山区行驶时，应提前了解天气和路况。","examplePinyin":"Chēliàng zài shānqū xíngshǐ shí, yīng tíqián liǎojiě tiānqì hé lùkuàng.","translation":"차량이 산길을 달릴 때는 날씨와 도로 상태를 미리 알아야 해요."},{"no":691,"category":"집·공간·생활","word":"场所","pinyin":"chǎngsuǒ","meaning":"장소, 현장","example":"公共场所的无障碍设施，关系到许多人的出行。","examplePinyin":"Gōnggòng chǎngsuǒ de wúzhàng'ài shèshī, guānxì dào xǔduō rén de chūxíng.","translation":"공공장소의 장애인 편의시설은 많은 사람의 이동에 영향을 줘요."},{"no":692,"category":"집·공간·생활","word":"车库","pinyin":"chēkù","meaning":"차고, 주차장","example":"地下车库增设了充电设施，方便电动车用户。","examplePinyin":"Dìxià chēkù zēngshè le chōngdiàn shèshī, fāngbiàn diàndòngchē yònghù.","translation":"지하 주차장에 충전 시설을 추가해 전기차 이용자의 편의를 높였어요."},{"no":693,"category":"집·공간·생활","word":"窗台","pinyin":"chuāngtái","meaning":"창턱, 창 아래 받침대","example":"她把几盆耐寒的植物放在朝南的窗台上。","examplePinyin":"Tā bǎ jǐpén nàihán de zhíwù fàng zài cháonán de chuāngtái shàng.","translation":"그녀는 추위에 강한 식물이 담긴 화분 몇 개를 남향 창턱에 뒀어요."},{"no":694,"category":"집·공간·생활","word":"大厦","pinyin":"dàshà","meaning":"대형 건물, 큰 빌딩","example":"这座大厦采用节能设计，夏季也能减少用电。","examplePinyin":"Zhè zuò dàshà cǎiyòng jiénéng shèjì, xiàjì yě néng jiǎnshǎo yòngdiàn.","translation":"이 대형 건물은 에너지 절약 설계로 여름 전력 소비도 줄여요."},{"no":695,"category":"집·공간·생활","word":"房屋","pinyin":"fángwū","meaning":"집, 주택, 건물","example":"老旧房屋改造，应优先解决安全和通风问题。","examplePinyin":"Lǎo jiù fángwū gǎizào, yīng yōuxiān jiějué ānquán hé tōngfēng wèntí.","translation":"노후 주택을 고칠 때는 안전과 환기 문제를 먼저 해결해야 해요."},{"no":696,"category":"집·공간·생활","word":"公寓","pinyin":"gōngyù","meaning":"아파트, 공동 주택","example":"这栋公寓靠近地铁站，因此很受上班族欢迎。","examplePinyin":"Zhè dòng gōngyù kàojìn dìtiězhàn, yīncǐ hěn shòu shàngbānzú huānyíng.","translation":"이 아파트는 지하철역에서 가까워 직장인들에게 인기가 있어요."},{"no":697,"category":"집·공간·생활","word":"广场","pinyin":"guǎngchǎng","meaning":"광장, 마당","example":"改造后的广场增加了树荫，也保留了活动空间。","examplePinyin":"Gǎizào hòu de guǎngchǎng zēngjiā le shùyīn, yě bǎoliú le huódòng kōngjiān.","translation":"정비한 광장은 그늘을 늘리면서 활동 공간도 남겨 뒀어요."},{"no":698,"category":"집·공간·생활","word":"胡同","pinyin":"hútòng","meaning":"골목, 좁은 골목길","example":"这条胡同保留了老房子，也引入了新的公共服务。","examplePinyin":"Zhè tiáo hútòng bǎoliú le lǎo fángzi, yě yǐnrù le xīn de gōnggòng fúwù.","translation":"이 골목은 옛집을 보존하면서 새로운 공공 서비스도 도입했어요."},{"no":699,"category":"집·공간·생활","word":"建","pinyin":"jiàn","meaning":"세우다, 건립하다; 설립하다","example":"村里计划建一座小桥，方便孩子雨天上学。","examplePinyin":"Cūnlǐ jìhuà jiàn yí zuò xiǎoqiáo, fāngbiàn háizi yǔtiān shàngxué.","translation":"마을은 아이들이 비 오는 날 통학하기 쉽도록 작은 다리를 지을 계획이에요."},{"no":700,"category":"집·공간·생활","word":"建设","pinyin":"jiànshè","meaning":"건설하다, 시설을 세우다","example":"公共设施建设，应优先满足居民最基本的需求。","examplePinyin":"Gōnggòng shèshī jiànshè, yīng yōuxiān mǎnzú jūmín zuì jīběn de xūqiú.","translation":"공공시설 건설은 주민의 가장 기본적인 수요부터 충족해야 해요."},{"no":701,"category":"집·공간·생활","word":"建造","pinyin":"jiànzào","meaning":"건축하다, 짓다","example":"建造这座桥时，工程师充分考虑了当地的水流。","examplePinyin":"Jiànzào zhè zuò qiáo shí, gōngchéngshī chōngfèn kǎolǜ le dāngdì de shuǐliú.","translation":"이 다리를 지을 때 기술자들은 현지의 물살을 충분히 고려했어요."},{"no":702,"category":"집·공간·생활","word":"建筑","pinyin":"jiànzhù","meaning":"건물, 건축","example":"好的建筑不只追求外观，还要考虑长期使用。","examplePinyin":"Hǎo de jiànzhù bù zhǐ zhuīqiú wàiguān, hái yào kǎolǜ chángqī shǐyòng.","translation":"좋은 건축은 외관뿐 아니라 장기간의 사용도 고려해야 해요."},{"no":703,"category":"집·공간·생활","word":"居住","pinyin":"jūzhù","meaning":"거주하다, 살다","example":"在这里居住多年后，他已熟悉附近的每条小路。","examplePinyin":"Zài zhèlǐ jūzhù duōnián hòu, tā yǐ shúxī fùjìn de měi tiáo xiǎolù.","translation":"여기서 여러 해 산 그는 주변의 골목길을 모두 잘 알아요."},{"no":704,"category":"집·공간·생활","word":"空间","pinyin":"kōngjiān","meaning":"공간, 빈 공간","example":"减少不必要的隔断，可以让公共空间更加灵活。","examplePinyin":"Jiǎnshǎo búbìyào de géduàn, kěyǐ ràng gōnggòng kōngjiān gèngjiā línghuó.","translation":"불필요한 칸막이를 줄이면 공용 공간을 더 유연하게 활용할 수 있어요."},{"no":705,"category":"집·공간·생활","word":"库","pinyin":"kù","meaning":"창고, 저장소","example":"合作社建了冷库，减少农产品运输前的损耗。","examplePinyin":"Hézuòshè jiàn le lěngkù, jiǎnshǎo nóngchǎnpǐn yùnshū qián de sǔnhào.","translation":"협동조합은 운송 전 농산물 손실을 줄이려고 냉장 창고를 지었어요."},{"no":706,"category":"집·공간·생활","word":"墙","pinyin":"qiáng","meaning":"벽, 담","example":"老墙经过加固以后，仍保留着原来的砖石纹理。","examplePinyin":"Lǎo qiáng jīngguò jiāgù yǐhòu, réng bǎoliú zhe yuánlái de zhuānshí wénlǐ.","translation":"옛 담은 보강한 뒤에도 원래 벽돌과 돌의 무늬를 간직하고 있어요."},{"no":707,"category":"집·공간·생활","word":"书房","pinyin":"shūfáng","meaning":"서재, 글방","example":"他把书房的一角留给孩子，鼓励他们安静阅读。","examplePinyin":"Tā bǎ shūfáng de yì jiǎo liúgěi háizi, gǔlì tāmen ānjìng yuèdú.","translation":"그는 아이들이 조용히 책을 읽도록 서재 한편을 내줬어요."},{"no":708,"category":"집·공간·생활","word":"宿舍","pinyin":"sùshè","meaning":"기숙사, 숙소","example":"宿舍实行公共区域轮值制度，由大家共同维护环境。","examplePinyin":"Sùshè shíxíng gōnggòng qūyù lúnzhí zhìdù, yóu dàjiā gòngtóng wéihù huánjìng.","translation":"기숙사는 공용 공간 당번제를 통해 모두가 환경을 관리해요."},{"no":709,"category":"집·공간·생활","word":"台阶","pinyin":"táijiē","meaning":"계단, 단계","example":"入口增设坡道后，不便爬台阶的人也能顺利进入。","examplePinyin":"Rùkǒu zēngshè pōdào hòu, búbiàn pá táijiē de rén yě néng shùnlì jìnrù.","translation":"입구에 경사로를 설치해 계단이 불편한 사람도 쉽게 들어갈 수 있어요."},{"no":710,"category":"집·공간·생활","word":"卧室","pinyin":"wòshì","meaning":"침실, 방","example":"为了保证睡眠，卧室里尽量减少强光和噪声。","examplePinyin":"Wèile bǎozhèng shuìmián, wòshì lǐ jǐnliàng jiǎnshǎo qiángg ,"example":"气温突然下降，民宿老板特意多准备了被子。","examplePinyin":"Qìwēn tūrán xiàjiàng, mínsù lǎobǎn tèyì duō zhǔnbèi le bèizi.","translation":"기온이 갑자기 내려가 민박집 주인이 이불을 더 준비했어요."},{"no":719,"category":"집·공간·생활","word":"床单","pinyin":"chuángdān","meaning":"침대 시트","example":"旅馆采用统一标准清洗床单，确保住宿卫生。","examplePinyin":"Lǚguǎn cǎiyòng tǒngyī biāozhǔn qīngxǐ chuángdān, quèbǎo zhùsù wèishēng.","translation":"여관은 정해진 기준에 따라 시트를 세탁해 위생을 지켜요."},{"no":720,"category":"집·공간·생활","word":"柜子","pinyin":"guìzi","meaning":"장롱, 찬장","example":"重要资料锁在柜子里，只有指定人员可以取用。","examplePinyin":"Zhòngyào zīliào suǒ zài guìzi lǐ, zhǐyǒu zhǐdìng rényuán kěyǐ qǔyòng.","translation":"중요 자료는 장에 잠가 두고 지정된 사람만 꺼내 쓸 수 있어요."},{"no":721,"category":"집·공간·생활","word":"灰","pinyin":"huī","meaning":"재, 먼지; 회색의","example":"施工结束后，窗台上落了一层厚厚的灰。","examplePinyin":"Shīgōng jiéshù hòu, chuāngtái shàng luò le yì céng hòuhòu de huī.","translation":"공사가 끝난 뒤 창턱에 먼지가 두껍게 쌓였어요."},{"no":722,"category":"집·공간·생활","word":"浇","pinyin":"jiāo","meaning":"붓다, 물을 따르다","example":"他根据土壤的湿度，决定是否给花浇水。","examplePinyin":"Tā gēnjù tǔrǎng de shīdù, juédìng shìfǒu gěi huā jiāoshuǐ.","translation":"그는 흙의 습도를 보고 꽃에 물을 줄지 결정해요."},{"no":723,"category":"집·공간·생활","word":"家务","pinyin":"jiāwù","meaning":"집안일, 가사","example":"家务由谁承担，应通过协商而不是按性别决定。","examplePinyin":"Jiāwù yóu shuí chéngdān, yīng tōngguò xiéshāng ér búshì àn xìngbié juédìng.","translation":"집안일은 성별이 아니라 협의를 통해 나눠야 해요."},{"no":724,"category":"집·공간·생활","word":"盆","pinyin":"pén","meaning":"대야, 화분","example":"她用旧盆种菜，让闲置的小阳台有了生机。","examplePinyin":"Tā yòng jiù pén zhòngcài, ràng xiánzhì de xiǎo yángtái yǒu le shēngjī.","translation":"그녀는 낡은 대야에 채소를 심어 비어 있던 발코니를 활기차게 했어요."},{"no":725,"category":"집·공간·생활","word":"日历","pinyin":"rìlì","meaning":"달력","example":"他在日历上标出每次复查的日期，避免忘记。","examplePinyin":"Tā zài rìlì shàng biāochū měi cì fùchá de rìqī, bìmiǎn wàngjì.","translation":"그는 잊지 않으려고 달력에 재검 날짜를 매번 표시했어요."},{"no":726,"category":"집·공간·생활","word":"晒","pinyin":"shài","meaning":"쬐다, 햇빛에 말리다","example":"雨季难以晒干衣物，居民希望改善公共晾衣设施。","examplePinyin":"Yǔjì nányǐ shàigān yīwù, jūmín xīwàng gǎishàn gōnggòng liàngyī shèshī.","translation":"우기에는 옷을 말리기 어려워 주민들은 공용 건조 시설 개선을 바라요."},{"no":727,"category":"집·공간·생활","word":"扇子","pinyin":"shànzi","meaning":"부채","example":"这把扇子不仅实用，扇面上还画着当地风景。","examplePinyin":"Zhè bǎ shànzi bùjǐn shíyòng, shànmiàn shàng hái huà zhe dāngdì fēngjǐng.","translation":"이 부채는 실용적일 뿐 아니라 표면에 지역 풍경도 그려져 있어요."},{"no":728,"category":"집·공간·생활","word":"书架","pinyin":"shūjià","meaning":"책꽂이, 선반","example":"书架按照主题重新整理以后，找书方便多了。","examplePinyin":"Shūjià ànzhào zhǔtí chóngxīn zhěnglǐ yǐhòu, zhǎo shū fāngbiàn duō le.","translation":"책장을 주제별로 다시 정리하니 책 찾기가 훨씬 편해졌어요."},{"no":729,"category":"집·공간·생활","word":"维修","pinyin":"wéixiū","meaning":"수리, 유지 보수","example":"维修完成后，工作人员再次测试了设备的稳定性。","examplePinyin":"Wéixiū wánchéng hòu, gōngzuò rényuán zàicì cèshì le shèbèi de wěndìngxìng.","translation":"수리를 마친 뒤 직원은 장비의 안정성을 다시 시험했어요."},{"no":730,"category":"집·공간·생활","word":"装饰","pinyin":"zhuāngshì","meaning":"장식하다, 꾸미다","example":"装饰不必复杂，方便使用和保持整洁更重要。","examplePinyin":"Zhuāngshì búbì fùzá, fāngbiàn shǐyòng hé bǎochí zhěngjié gèng zhòngyào.","translation":"장식은 복잡할 필요 없으며 편리함과 청결 유지가 더 중요해요."},{"no":731,"category":"집·공간·생활","word":"装修","pinyin":"zhuāngxiū","meaning":"실내를 꾸미다, 인테리어 공사를 하다","example":"装修之前，应向邻居说明施工时间和可能的影响。","examplePinyin":"Zhuāngxiū zhīqián, yīng xiàng línjū shuōmíng shīgōng shíjiān hé kěnéng de yǐngxiǎng.","translation":"실내 공사 전에 이웃에게 공사 시간과 예상 영향을 알려야 해요."},{"no":732,"category":"집·공간·생활","word":"安装","pinyin":"ānzhuāng","meaning":"설치하다, 장착하다","example":"安装新设备之前，请先仔细阅读使用说明。","examplePinyin":"Ānzhuāng xīn shèbèi zhīqián, qǐng xiān zǐxì yuèdú shǐyòng shuōmíng.","translation":"새 설비를 설치하기 전에 사용 설명서를 꼼꼼히 읽으세요."},{"no":733,"category":"집·공간·생활","word":"充电","pinyin":"chōngdiàn","meaning":"충전하다(전기)","example":"公共座椅旁增加了充电接口，方便旅客使用。","examplePinyin":"Gōnggòng zuòyǐ páng zēngjiā le chōngdiàn jiēkǒu, fāngbiàn lǚkè shǐyòng.","translation":"공공 의자 옆에 충전 단자를 추가해 여행객들이 쓰기 편해졌어요."},{"no":734,"category":"집·공간·생활","word":"灯光","pinyin":"dēngguāng","meaning":"등불, 조명","example":"适当调整灯光，可以改善长时间阅读时的舒适度。","examplePinyin":"Shìdàng tiáozhěng dēngguāng, kěyǐ gǎishàn chángshíjiān yuèdú shí de shūshìdù.","translation":"조명을 적절히 조절하면 오래 책을 읽을 때 더 편안해져요."},{"no":735,"category":"집·공간·생활","word":"电池","pinyin":"diànchí","meaning":"배터리, 전지","example":"废旧电池应送到专门的回收点，不能随意丢弃。","examplePinyin":"Fèijiù diànchí yīng sòngdào zhuānmén de huíshōu diǎn, bùnéng suíyì diūqì.","translation":"폐건전지는 함부로 버리지 말고 전용 수거 장소에 보내야 해요."},{"no":736,"category":"집·공간·생활","word":"电器","pinyin":"diànqì","meaning":"전기 기기, 가전","example":"离家前关闭不用的电器，既节能又能减少隐患。","examplePinyin":"Líjiā qián guānbì búyòng de diànqì, jì jiénéng yòu néng jiǎnshǎo yǐnhuàn.","translation":"외출 전에 안 쓰는 전기 기기를 끄면 절약과 사고 예방에 좋아요."},{"no":737,"category":"집·공간·생활","word":"工具","pinyin":"gōngjù","meaning":"도구, 공구","example":"工具使用完毕，应放回指定位置并做好记录。","examplePinyin":"Gōngjù shǐyòng wánbì, yīng fàng huí zhǐdìng wèizhi bìng zuòhǎo jìlù.","translation":"공구를 다 썼으면 지정된 자리에 돌려놓고 기록해야 해요."},{"no":738,"category":"집·공간·생활","word":"架","pinyin":"jià","meaning":"선반, 거치대","example":"图书馆增设了低书架，方便儿童自己取书。","examplePinyin":"Túshūguǎn zēngshè le dī shūjià, fāngbiàn értóng zìjǐ qǔ shū.","translation":"도서관은 어린이가 직접 책을 꺼내도록 낮은 책장을 추가했어요."},{"no":739,"category":"집·공간·생활","word":"家电","pinyin":"jiādiàn","meaning":"가전 제품, 가정용 기기","example":"选择家电时，除了价格，也应考虑耗电量。","examplePinyin":"Xuǎnzé jiādiàn shí, chúle jiàgé, yě yīng kǎolǜ hàodiànliàng.","translation":"가전제품을 고를 때는 가격뿐 아니라 소비 전력도 고려해야 해요."},{"no":740,"category":"집·공간·생활","word":"剪刀","pinyin":"jiǎndāo","meaning":"가위","example":"使用剪刀之后，应及时收好，避免儿童误拿。","examplePinyin":"Shǐyòng jiǎndāo zhīhòu, yīng jíshí shōu hǎo, bìmiǎn értóng wù ná.","translation":"가위를 사용한 뒤에는 아이가 잘못 집지 않도록 바로 치워야 해요."},{"no":741,"category":"집·공간·생활","word":"铃","pinyin":"líng","meaning":"방울(종), 벨","example":"下课铃响起后，学生们仍围着老师继续讨论。","examplePinyin":"Xiàkèlíng xiǎngqǐ hòu, xuéshengmen réng wéizhe lǎoshī jìxù tǎolùn.","translation":"수업 종료 종이 울렸는데도 학생들은 선생님 곁에서 계속 토론했어요."},{"no":742,"category":"집·공간·생활","word":"闹钟","pinyin":"nàozhōng","meaning":"자명종,알람시계","example":"怕打扰室友，他把闹钟换成了轻微的振动提示。","examplePinyin":"Pà dǎrǎo shìyǒu, tā bǎ nàozhōng huànchéng le qīngwēi de zhèndòng tíshì.","translation":"룸메이트를 방해하지 않으려고 그는 알람을 약한 진동으로 바꿨어요."},{"no":743,"category":"집·공간·생활","word":"设施","pinyin":"shèshī","meaning":"시설, 설비","example":"公共设施维护得当，才能持续为居民提供服务。","examplePinyin":"Gōnggòng shèshī wéihù dédàng, cái néng chíxù wèi jūmín tígōng fúwù.","translation":"공공시설을 잘 관리해야 주민에게 꾸준히 서비스를 제공할 수 있어요."},{"no":744,"category":"집·공간·생활","word":"锁","pinyin":"suǒ","meaning":"잠그다, 자물쇠","example":"档案柜要锁好，钥匙由指定人员保管。","examplePinyin":"Dàng'ànguì yào suǒhǎo, yàoshi yóu zhǐdìng rényuán bǎoguǎn.","translation":"문서 보관장은 잘 잠그고 열쇠는 지정된 사람이 관리해요."},{"no":745,"category":"집·공간·생활","word":"台灯","pinyin":"táidēng","meaning":"탁상등, 스탠드","example":"选择台灯时，应关注照明稳定性，而不是只看外形。","examplePinyin":"Xuǎnzé táidēng shí, yīng guānzhù zhàomíng wěndìngxìng, ér búshì zhǐ kàn wàixíng.","translation":"스탠드를 고를 때는 모양뿐 아니라 조명의 안정성을 봐야 해요."},{"no":746,"category":"건강·날씨","word":"安","pinyin":"ān","meaning":"편안하다, 안전하다, 안정시키다","example":"得知家人平安到达，他才安下心来工作。","examplePinyin":"Dézhī jiārén píng'ān dàodá, tā cái ān xià xīn lái gōngzuò.","translation":"가족이 무사히 도착했다는 소식에 안심하고 일했어요."},{"no":747,"category":"건강·날씨","word":"熬夜","pinyin":"áoyè","meaning":"밤새다, 밤을 새우다","example":"长期熬夜会影响记忆力，也容易降低效率。","examplePinyin":"Chángqī áoyè huì yǐngxiǎng jìyìlì, yě róngyì jiàngdī xiàolǜ.","translation":"오랫동안 밤을 새우면 기억력과 효율이 떨어지기 쉬워요."},{"no":748,"category":"건강·날씨","word":"大脑","pinyin":"dànǎo","meaning":"뇌, 두뇌","example":"睡眠不足会影响大脑处理信息的能力。","examplePinyin":"Shuìmián bùzú huì yǐngxiǎng dànǎo chǔlǐ xìnxī de nénglì.","translation":"수면 부족은 뇌의 정보 처리 능력에 영향을 줘요."},{"no":749,"category":"건강·날씨","word":"汗水","pinyin":"hànshuǐ","meaning":"땀, 땀방울","example":"这片重新变绿的土地，凝结着志愿者的汗水。","examplePinyin":"Zhè piàn chóngxīn biànlǜ de tǔdì, níngjié zhe zhìyuànzhě de hànshuǐ.","translation":"다시 푸르러진 이 땅에는 자원봉사자들의 땀이 배어 있어요."},{"no":750,"category":"건강·날씨","word":"呼吸","pinyin":"hūxī","meaning":"호흡하다, 숨쉬다","example":"他停下脚步，调整呼吸后才继续向上攀登。","examplePinyin":"Tā tíngxià jiǎobù, tiáozhěng hūxī hòu cái jìxù xiàngshàng pāndēng.","translation":"그는 걸음을 멈추고 호흡을 고른 뒤 다시 올라갔어요."},{"no":751,"category":"건강·날씨","word":"减肥","pinyin":"jiǎnféi","meaning":"다이어트, 살빼기","example":"科学减肥应重视长期习惯，而不是短期少吃。","examplePinyin":"Kēxué jiǎnféi yīng zhòngshì chángqī xíguàn, ér búshì duǎnqī shǎo chī.","translation":"건강한 체중 감량에는 잠깐 덜 먹기보다 장기적인 습관이 중요해요."},{"no":752,"category":"건강·날씨","word":"精力","pinyin":"jīnglì","meaning":"기력, 에너지, 집중할 힘","example":"把精力集中在关键任务上，比同时做很多事更有效。","examplePinyin":"Bǎ jīnglì jízhōng zài guānjiàn rènwu shàng, bǐ tóngshí zuò hěn duō shì gèng yǒuxiào.","translation":"많은 일을 동시에 하기보다 핵심 과제에 힘을 모으는 게 더 효과적이에요."},{"no":753,"category":"건강·날씨","word":"精神","pinyin":"jīngshen","meaning":"기운차다, 활기 있다","example":"适当休息以后，他精神多了，又能专心工作了。","examplePinyin":"Shìdàng xiūxi yǐhòu, tā jīngshen duō le, yòu néng zhuānxīn gōngzuò le.","translation":"적당히 쉬고 나니 기운이 훨씬 나서 다시 집중해 일할 수 있었어요."},{"no":754,"category":"건강·날씨","word":"肌肉","pinyin":"jīròu","meaning":"근육","example":"恢复训练应逐步进行，避免给肌肉造成额外负担。","examplePinyin":"Huīfù xùnliàn yīng zhúbù jìnxíng, bìmiǎn gěi jīròu zàochéng éwài fùdān.","translation":"재활 운동은 근육에 부담이 더해지지 않도록 점진적으로 해야 해요."},{"no":755,"category":"건강·날씨","word":"力","pinyin":"lì","meaning":"힘, 능력","example":"长期缺乏休息，会使人感到有心无力。","examplePinyin":"Chángqī quēfá xiūxi, huì shǐ rén gǎndào yǒuxīn wúlì.","translation":"오랫동안 쉬지 못하면 마음은 있어도 힘이 없다고 느끼게 돼요."},{"no":756,"category":"건강·날씨","word":"脸色","pinyin":"liǎnsè","meaning":"얼굴색, 안색","example":"看到他脸色苍白，同事建议他先去医院检查。","examplePinyin":"Kàndào tā liǎnsè cāngbái, tóngshì jiànyì tā xiān qù yīyuàn jiǎnchá.","translation":"동료는 그의 창백한 안색을 보고 병원에서 검사받으라고 권했어요."},{"no":757,"category":"건강·날씨","word":"力量","pinyin":"lìliang","meaning":"힘, 세력","example":"个人的力量有限，但相互合作可以改变许多事情。","examplePinyin":"Gèrén de lìliang yǒuxiàn, dàn xiānghù hézuò kěyǐ gǎibiàn xǔduō shìqing.","translation":"개인의 힘은 한정돼 있지만 협력하면 많은 일을 바꿀 수 있어요."},{"no":758,"category":"건강·날씨","word":"命1","pinyin":"mìng","meaning":"목숨, 생명","example":"紧急时刻，正确的急救方法有时能救回一条命。","examplePinyin":"Jǐnjí shíkè, zhèngquè de jíjiù fāngfǎ yǒushí néng jiùhuí yì tiáo mìng.","translation":"위급할 때 올바른 응급 처치가 생명을 구할 수 있어요."},{"no":759,"category":"건강·날씨","word":"平安","pinyin":"píng'ān","meaning":"편안하다,무사하다","example":"听到所有队员平安返回的消息，他终于松了口气。","examplePinyin":"Tīngdào suǒyǒu duìyuán píng'ān fǎnhuí de xiāoxi, tā zhōngyú sōng le kǒuqì.","translation":"대원 모두 무사히 돌아왔다는 소식에 그는 비로소 안도했어요."},{"no":760,"category":"건강·날씨","word":"人体","pinyin":"réntǐ","meaning":"인체, 신체","example":"人体需要适当活动，长时间久坐容易造成不适。","examplePinyin":"Réntǐ xūyào shìdàng huódòng, chángshíjiān jiǔzuò róngyì zàochéng búshì.","translation":"인체는 적절히 움직여야 하며 오래 앉아 있으면 불편해지기 쉬워요."},{"no":761,"category":"건강·날씨","word":"身材","pinyin":"shēncái","meaning":"체격, 몸매","example":"健康的身材没有单一标准，不必盲目追求消瘦。","examplePinyin":"Jiànkāng de shēncái méiyǒu dānyī biāozhǔn, búbì mángmù zhuīqiú xiāoshòu.","translation":"건강한 체형에는 하나의 기준이 없으니 마른 몸만 좇을 필요가 없어요."},{"no":762,"category":"건강·날씨","word":"手指","pinyin":"shǒuzhǐ","meaning":"손가락","example":"反复操作同一工具，容易使手指感到酸痛。","examplePinyin":"Fǎnfù cāozuò tóngyī gōngjù, róngyì shǐ shǒuzhǐ gǎndào suāntòng.","translation":"같은 공구를 반복해서 사용하면 손가락이 뻐근해지기 쉬워요."},{"no":763,"category":"건강·날씨","word":"水分","pinyin":"shuǐfèn","meaning":"수분, 물기","example":"高温环境下工作，要注意及时补充水分。","examplePinyin":"Gāowēn huánjìng xià gōngzuò, yào zhùyì jíshí bǔchōng shuǐfèn.","translation":"고온 환경에서 일할 때는 제때 수분을 보충해야 해요."},{"no":764,"category":"건강·날씨","word":"睡眠","pinyin":"shuìmián","meaning":"수면, 잠","example":"睡眠质量下降时，先检查生活规律是否被打乱。","examplePinyin":"Shuìmián zhìliàng xiàjiàng shí, xiān jiǎnchá shēnghuó guīlǜ shìfǒu bèi dǎluàn.","translation":"수면의 질이 떨어지면 생활 리듬이 흐트러졌는지 먼저 살펴보세요."},{"no":765,"category":"건강·날씨","word":"体力","pinyin":"tǐlì","meaning":"체력, 육체적 힘","example":"登山时合理分配体力，比一开始走得快更重要。","examplePinyin":"Dēngshān shí hélǐ fēnpèi tǐlì, bǐ yì kāishǐ zǒu de kuài gèng zhòngyào.","translation":"등산할 때는 처음부터 빨리 가기보다 체력을 잘 안배하는 게 중요해요."},{"no":766,"category":"건강·날씨","word":"胃","pinyin":"wèi","meaning":"위, 뱃속","example":"他经常不按时吃饭，最近胃总觉得不舒服。","examplePinyin":"Tā jīngcháng bú ànshí chīfàn, zuìjìn wèi zǒng juéde bù shūfu.","translation":"그는 식사 시간을 자주 거른 탓에 요즘 위가 늘 불편해요."},{"no":767,"category":"건강·날씨","word":"消化","pinyin":"xiāohuà","meaning":"소화하다, 소화","example":"信息接收得太快，也需要留出时间慢慢消化。","examplePinyin":"Xìnxī jiēshōu de tài kuài, yě xūyào liúchū shíjiān mànmàn xiāohuà.","translation":"정보를 너무 빨리 받으면 천천히 소화할 시간도 필요해요."},{"no":768,"category":"건강·날씨","word":"牙齿","pinyin":"yáchǐ","meaning":"치아, 이빨","example":"定期检查牙齿，可以及早发现不易察觉的问题。","examplePinyin":"Dìngqī jiǎnchá yáchǐ, kěyǐ jízǎo fāxiàn búyì chájué de wèntí.","translation":"치아를 정기 점검하면 알아채기 힘든 문제를 일찍 찾을 수 있어요."},{"no":769,"category":"건강·날씨","word":"眼","pinyin":"yǎn","meaning":"눈, 눈알","example":"他亲眼看到修复过程后，才理解这份工作的价值。","examplePinyin":"Tā qīnyǎn kàndào xiūfù guòchéng hòu, cái lǐjiě zhè fèn gōngzuò de jiàzhí.","translation":"직접 복원 과정을 본 뒤 그는 이 일의 가치를 이해했어요."},{"no":770,"category":"건강·날씨","word":"腰","pinyin":"yāo","meaning":"허리","example":"长时间弯着腰工作，容易引起腰部不适。","examplePinyin":"Chángshíjiān wān zhe yāo gōngzuò, róngyì yǐnqǐ yāobù búshì.","translation":"오랫동안 허리를 굽혀 일하면 허리가 불편해지기 쉬워요."},{"no":771,"category":"건강·날씨","word":"姿势","pinyin":"zīshì","meaning":"자세, 포즈","example":"工作姿势不合适，容易让身体长期处于紧张状态。","examplePinyin":"Gōngzuò zīshì bù héshì, róngyì ràng shēntǐ chángqī chǔyú jǐnzhāng zhuàngtài.","translation":"업무 자세가 나쁘면 몸이 오랫동안 긴장 상태에 놓이기 쉬워요."},{"no":772,"category":"건강·날씨","word":"醉","pinyin":"zuì","meaning":"(술)에 취하다,심취하다 ","example":"他喝醉以后，朋友及时叫车送他安全回家。","examplePinyin":"Tā hēzuì yǐhòu, péngyou jíshí jiào chē sòng tā ānquán huíjiā.","translation":"그가 술에 취하자 친구가 바로 차를 불러 안전하게 귀가시켰어요."},{"no":773,"category":"건강·날씨","word":"嘴巴","pinyin":"zuǐba","meaning":"입","example":"孩子嘴巴受了点小伤，医生建议暂时避免刺激性食物。","examplePinyin":"Háizi zuǐba shòu le diǎn xiǎo shāng, yīshēng jiànyì zànshí bìmiǎn cìjīxìng shíwù.","translation":"아이는 입에 조금 상처가 나서 의사가 자극적인 음식을 피하라 동안 학교는 교실 환기와 건강 관찰을 강화했어요."},{"no":782,"category":"건강·날씨","word":"门诊","pinyin":"ménzhěn","meaning":"외래 진료, 클리닉","example":"医院延长了晚间门诊时间，方便白天工作的患者。","examplePinyin":"Yīyuàn yáncháng le wǎnjiān ménzhěn shíjiān, fāngbiàn báitiān gōngzuò de huànzhě.","translation":"병원은 낮에 일하는 환자들을 위해 야간 외래 진료를 늘렸어요."},{"no":783,"category":"건강·날씨","word":"抢救","pinyin":"qiǎngjiù","meaning":"구조하다, 소생시키다","example":"救援人员争分夺秒，抢救被困的群众。","examplePinyin":"Jiùyuán rényuán zhēng fēn duó miǎo, qiǎngjiù bèikùn de qúnzhòng.","translation":"구조대원들은 시간을 다투며 갇힌 사람들을 구조했어요."},{"no":784,"category":"건강·날씨","word":"伤","pinyin":"shāng","meaning":"상처, 다치다","example":"他手上的伤还没完全好，暂时不能搬重物。","examplePinyin":"Tā shǒushàng de shāng hái méi wánquán hǎo, zànshí bùnéng bān zhòngwù.","translation":"그는 손의 상처가 다 낫지 않아 당분간 무거운 것을 들면 안 돼요."},{"no":785,"category":"건강·날씨","word":"失眠","pinyin":"shīmián","meaning":"불면증, 잠 못 이룸","example":"长期失眠影响日常生活时，应及时寻求专业帮助。","examplePinyin":"Chángqī shīmián yǐngxiǎng rìcháng shēnghuó shí, yīng jíshí xúnqiú zhuānyè bāngzhù.","translation":"장기 불면증이 일상에 지장을 주면 전문가의 도움을 구해야 해요."},{"no":786,"category":"건강·날씨","word":"手术","pinyin":"shǒushù","meaning":"수술","example":"手术前，医生向患者详细说明了可能的风险。","examplePinyin":"Shǒushù qián, yīshēng xiàng huànzhě xiángxì shuōmíng le kěnéng de fēngxiǎn.","translation":"수술 전에 의사는 환자에게 가능한 위험을 자세히 설명했어요."},{"no":787,"category":"건강·날씨","word":"疼痛","pinyin":"téngtòng","meaning":"아픔, 통증","example":"如果疼痛持续加重，不应只靠忍耐而延误就医。","examplePinyin":"Rúguǒ téngtòng chíxù jiāzhòng, bù yīng zhǐ kào rěnnài ér yánwù jiùyī.","translation":"통증이 계속 심해지면 참느라 진료를 늦춰서는 안 돼요."},{"no":788,"category":"건강·날씨","word":"药品","pinyin":"yàopǐn","meaning":"약품, 의약품","example":"购买药品时，应通过正规渠道并核对相关信息。","examplePinyin":"Gòumǎi yàopǐn shí, yīng tōngguò zhèngguī qúdào bìng héduì xiāngguān xìnxī.","translation":"의약품은 정식 경로로 사고 관련 정보를 확인해야 해요."},{"no":789,"category":"건강·날씨","word":"药物","pinyin":"yàowù","meaning":"약물","example":"药物使用应遵循专业指导，不能随意增减剂量。","examplePinyin":"Yàowù shǐyòng yīng zūnxún zhuānyè zhǐdǎo, bùnéng suíyì zēngjiǎn jìliàng.","translation":"약물은 전문가의 지시에 따라 쓰고 용량을 함부로 바꾸면 안 돼요."},{"no":790,"category":"건강·날씨","word":"医疗","pinyin":"yīliáo","meaning":"의료, 진료","example":"医疗资源应合理分配，让偏远地区也能获得基本服务。","examplePinyin":"Yīliáo zīyuán yīng hélǐ fēnpèi, ràng piānyuǎn dìqū yě néng huòdé jīběn fúwù.","translation":"의료 자원은 외딴 지역도 기본 서비스를 받도록 합리적으로 배분해야 해요."},{"no":791,"category":"건강·날씨","word":"预防","pinyin":"yùfáng","meaning":"예방하다, 방지","example":"预防疾病不能只靠药物，也要重视生活习惯。","examplePinyin":"Yùfáng jíbìng bùnéng zhǐ kào yàowù, yě yào zhòngshì shēnghuó xíguàn.","translation":"질병 예방에는 약물뿐 아니라 생활 습관도 중요해요."},{"no":792,"category":"건강·날씨","word":"着凉","pinyin":"zháoliáng","meaning":"감기에 걸리다, 찬기를 먹다","example":"气温下降时及时增添衣物，避免夜里着凉。","examplePinyin":"Qìwēn xiàjiàng shí jíshí zēngtiān yīwù, bìmiǎn yèli zháoliáng.","translation":"기온이 떨어지면 옷을 더 입어 밤에 몸이 차가워지지 않도록 하세요."},{"no":793,"category":"건강·날씨","word":"诊断","pinyin":"zhěnduàn","meaning":"진단하다, 진단","example":"作出诊断之前，医生需要结合症状与检查结果。","examplePinyin":"Zuòchū zhěnduàn zhīqián, yīshēng xūyào jiéhé zhèngzhuàng yǔ jiǎnchá jiéguǒ.","translation":"진단을 내리기 전에 의사는 증상과 검사 결과를 함께 봐야 해요."},{"no":794,"category":"건강·날씨","word":"治","pinyin":"zhì","meaning":"다스리다, 치료하다","example":"牙病要及时治，拖得越久，治疗往往越复杂。","examplePinyin":"Yábìng yào jíshí zhì, tuō de yuè jiǔ, zhìliáo wǎngwǎng yuè fùzá.","translation":"치과 질환은 제때 치료해야 하며 미룰수록 치료가 복잡해져요."},{"no":795,"category":"건강·날씨","word":"治疗","pinyin":"zhìliáo","meaning":"치료하다, 치료","example":"治疗方案应根据病情变化，由专业人员及时调整。","examplePinyin":"Zhìliáo fāng'àn yīng gēnjù bìngqíng biànhuà, yóu zhuānyè rényuán jíshí tiáozhěng.","translation":"치료 방침은 병세 변화에 따라 전문가가 제때 조정해야 해요."},{"no":796,"category":"건강·날씨","word":"中药","pinyin":"zhōngyào","meaning":"중국 전통 약물, 중약, 한약","example":"使用中药前，也应向专业人员说明正在服用的药物。","examplePinyin":"Shǐyòng zhōngyào qián, yě yīng xiàng zhuānyè rényuán shuōmíng zhèngzài fúyòng de yàowù.","translation":"중약을 쓰기 전에도 복용 중인 약을 전문가에게 알려야 해요."},{"no":797,"category":"건강·날씨","word":"中医","pinyin":"zhōngyī","meaning":"중의학; 중의사(중국 전통 의학 의사)","example":"这位中医强调，治疗之外也要注意日常作息。","examplePinyin":"Zhè wèi zhōngyī qiángdiào, zhìliáo zhīwài yě yào zhùyì rìcháng zuòxī.","translation":"이 중의사는 치료 외에도 평소 생활 리듬을 살펴야 한다고 강조해요."},{"no":798,"category":"건강·날씨","word":"翅膀","pinyin":"chìbǎng","meaning":"날개","example":"小鸟反复展开翅膀，尝试着离开树枝。","examplePinyin":"Xiǎoniǎo fǎnfù zhǎnkāi chìbǎng, chángshì zhe líkāi shùzhī.","translation":"어린 새는 거듭 날개를 펴며 나뭇가지를 떠나려 했어요."},{"no":799,"category":"건강·날씨","word":"宠物","pinyin":"chǒngwù","meaning":"반려동물","example":"饲养宠物之前，应认真考虑时间和经济条件。","examplePinyin":"Sìyǎng chǒngwù zhīqián, yīng rènzhēn kǎolǜ shíjiān hé jīngjì tiáojiàn.","translation":"반려동물을 기르기 전에 시간과 경제적 여건을 신중히 생각해야 해요."},{"no":800,"category":"건강·날씨","word":"虫子","pinyin":"chóngzi","meaning":"벌레, 곤충","example":"农民利用某些虫子的天敌，减少农药的使用。","examplePinyin":"Nóngmín lìyòng mǒuxiē chóngzi de tiāndí, jiǎnshǎo nóngyào de shǐyòng.","translation":"농민은 일부 해충의 천적을 이용해 농약 사용을 줄여요."},{"no":801,"category":"건강·날씨","word":"大象","pinyin":"dàxiàng","meaning":"코끼리","example":"保护大象，不仅要禁止捕猎，也要保护它们生活的环境。","examplePinyin":"Bǎohù dàxiàng, bùjǐn yào jìnzhǐ bǔliè, yě yào bǎohù tāmen shēnghuó de huánjìng.","translation":"코끼리를 보호하려면 사냥을 금지하고 서식 환경도 지켜야 해요."},{"no":802,"category":"건강·날씨","word":"根","pinyin":"gēn","meaning":"뿌리, 근본; (양사) 가닥, 개비","example":"移栽时要尽量保护树根，避免影响后续生长。","examplePinyin":"Yízāi shí yào jǐnliàng bǎohù shùgēn, bìmiǎn yǐngxiǎng hòuxù shēngzhǎng.","translation":"나무를 옮겨 심을 때는 뿌리를 보호해야 이후 생장에 지장이 적어요."},{"no":803,"category":"건강·날씨","word":"果实","pinyin":"guǒshí","meaning":"열매, 과실","example":"枝头结满果实，提醒人们收获季节已经到来。","examplePinyin":"Zhītóu jiēmǎn guǒshí, tíxǐng rénmen shōuhuò jìjié yǐjīng dàolái.","translation":"가지에 열매가 가득 달려 수확철이 왔음을 알려 줘요."},{"no":804,"category":"건강·날씨","word":"猴子","pinyin":"hóuzi","meaning":"원숭이, 잔나비","example":"游客不应随意给猴子喂食，以免改变它们的习性。","examplePinyin":"Yóukè bù yīng suíyì gěi hóuzi wèishí, yǐmiǎn gǎibiàn tāmen de xíxìng.","translation":"원숭이의 습성을 바꿀 수 있으니 관광객은 함부로 먹이를 주면 안 돼요."},{"no":805,"category":"건강·날씨","word":"蝴蝶","pinyin":"húdié","meaning":"나비","example":"花园不再大量使用农药后，蝴蝶逐渐多了起来。","examplePinyin":"Huāyuán búzài dàliàng shǐyòng nóngyào hòu, húdié zhújiàn duō le qǐlai.","translation":"정원에서 농약 사용을 줄이자 나비가 차차 많아졌어요."},{"no":806,"category":"건강·날씨","word":"昆虫","pinyin":"kūnchóng","meaning":"곤충, 벌레","example":"某些昆虫能够帮助植物传粉，对生态十分重要。","examplePinyin":"Mǒuxiē kūnchóng nénggòu bāngzhù zhíwù chuánfěn, duì shēngtài shífēn zhòngyào.","translation":"어떤 곤충은 식물의 수분을 도와 생태계에 매우 중요해요."},{"no":807,"category":"건강·날씨","word":"玫瑰","pinyin":"méigui","meaning":"장미, 장미꽃","example":"这片玫瑰园减少了化肥使用，更重视土壤管理。","examplePinyin":"Zhè piàn méiguiyuán jiǎnshǎo le huàféi shǐyòng, gèng zhòngshì tǔrǎng guǎnlǐ.","translation":"이 장미원은 화학 비료를 줄이고 토양 관리를 더 중시해요."},{"no":808,"category":"건강·날씨","word":"品种","pinyin":"pǐnzhǒng","meaning":"품종, 종류","example":"种植不同品种的作物，可以降低单一品种的风险。","examplePinyin":"Zhòngzhí bùtóng pǐnzhǒng de zuòwù, kěyǐ jiàngdī dānyī pǐnzhǒng de fēngxiǎn.","translation":"품종이 다른 작물을 심으면 단일 품종 재배의 위험을 줄일 수 있어요."},{"no":809,"category":"건강·날씨","word":"蛇","pinyin":"shé","meaning":"뱀","example":"遇到蛇时应保持距离，不要主动追赶或惊扰。","examplePinyin":"Yùdào shé shí yīng bǎochí jùlí, búyào zhǔdòng zhuīgǎn huò jīngrǎo.","translation":"뱀을 만나면 거리를 두고 쫓거나 놀라게 하지 마세요."},{"no":810,"category":"건강·날씨","word":"生存","pinyin":"shēngcún","meaning":"생존하다, 살다","example":"保护野生动物，关键是保留它们生存所需的环境。","examplePinyin":"Bǎohù yěshēng dòngwù, guānjiàn shì bǎoliú tāmen shēngcún suǒ xū de huánjìng.","translation":"야생 동물 보호의 핵심은 생존에 필요한 환경을 지키는 것이에요."},{"no":811,"category":"건강·날씨","word":"生物","pinyin":"shēngwù","meaning":"생물, 생명체","example":"土壤中丰富的生物，对维持土地健康十分重要。","examplePinyin":"Tǔrǎng zhōng fēngfù de shēngwù, duì wéichí tǔdì jiànkāng shífēn zhòngyào.","translation":"토양 속의 다양한 생물은 땅의 건강을 유지하는 데 중요해요."},{"no":812,"category":"건강·날씨","word":"生长","pinyin":"shēngzhǎng","meaning":"성장하다, 자라다","example":"光照不足，会影响这些植物的正常生长。","examplePinyin":"Guāngzhào bùzú, huì yǐngxiǎng zhèxiē zhíwù de zhèngcháng shēngzhǎng.","translation":"빛이 부족하면 이 식물들의 정상적인 생장에 영향을 줘요."},{"no":813,"category":"건강·날씨","word":"树木","pinyin":"shùmù","meaning":"나무, 수목","example":"保护老树木，既有生态意义，也能保存地方记忆。","examplePinyin":"Bǎohù lǎo shùmù, jìyǒu shēngtài yìyì, yě néng bǎocún dìfāng jìyì.","translation":"오래된 나무를 보호하면 생태계를 지키고 지역의 기억도 보존해요."},{"no":814,"category":"건강·날씨","word":"兔子","pinyin":"tùzi","meaning":"토끼","example":"孩子照顾兔子的过程，也是学习承担责任的过程。","examplePinyin":"Háizi zhàogu tùzi de guòchéng, yě shì xuéxí chéngdān zérèn de guòchéng.","translation":"아이가 토끼를 돌보는 과정은 책임을 배우는 과정이기도 해요."},{"no":815,"category":"건강·날씨","word":"喂2","pinyin":"wèi","meaning":"먹이다, 먹이를 주다","example":"不要随意给野生动物喂食，以免影响正常习性。","examplePinyin":"Búyào suíyì gěi yěshēng dòngwù wèishí, yǐmiǎn yǐngxiǎng zhèngcháng xíxìng.","translation":"야생 동물의 습성에 영향을 주지 않도록 함부로 먹이를 주지 마세요."},{"no":816,"category":"건강·날씨","word":"尾巴","pinyin":"wěiba","meaning":"꼬리","example":"猫轻轻摆动尾巴，安静地观察着窗外的鸟。","examplePinyin":"Māo qīngqīng bǎidòng wěiba, ānjìng de guānchá zhe chuāngwài de niǎo.","translation":"고양이는 꼬리를 살짝 움직이며 창밖의 새를 조용히 바라봐요."},{"no":817,"category":"건강·날씨","word":"鸭子","pinyin":"yāzi","meaning":"오리","example":"池边的鸭子慢慢游近，又在游客靠近时离开。","examplePinyin":"Chíbiān de yāzi mànmàn yóu jìn, yòu zài yóukè kàojìn shí líkāi.","translation":"연못가의 오리들이 다가왔다가 관광객이 가까워지자 떠났어요."},{"no":818,"category":"건강·날씨","word":"种植","pinyin":"zhòngzhí","meaning":"심다, 파종하다","example":"种植作物之前，先了解土壤和当地的气候条件。","examplePinyin":"Zhòngzhí zuòwù zhīqián, xiān liǎojiě tǔrǎng hé dāngdì de qìhòu tiáojiàn.","translation":"작물을 심기 전에 토양과 지역 기후 조건부터 알아보세요."},{"no":819,"category":"건강·날씨","word":"种子","pinyin":"zhǒngzi","meaning":"종자, 씨","example":"保存传统种子，有助于维持作物品种的多样性。","examplePinyin":"Bǎocún chuántǒng zhǒngzi, yǒuzhùyú wéichí zuòwù pǐnzhǒng de duōyàngxìng.","translation":"전통 종자를 보존하면 작물 품종의 다양성을 유지하는 데 도움이 돼요."},{"no":820,"category":"건강·날씨","word":"猪","pinyin":"zhū","meaning":"돼지","example":"养猪场改进了废水处理方式，减少对河流的影响。","examplePinyin":"Yǎngzhūchǎng gǎijìn le fèishuǐ chǔlǐ fāngshì, jiǎnshǎo duì héliú de yǐngxiǎng.","translation":"양돈장은 폐수 처리 방식을 개선해 강에 주는 영향을 줄였어요."},{"no":821,"category":"건강·날씨","word":"竹子","pinyin":"zhúzi","meaning":"대나무","example":"竹子经过合理加工，可以制成多种耐用生活用品。","examplePinyin":"Zhúzi jīngguò hélǐ jiāgōng, kěyǐ zhìchéng duōzhǒng nàiyòng shēnghuó yòngpǐn.","translation":"대나무는 알맞게 가공하면 다양한 튼튼한 생활용품을 만들 수 있어요."},{"no":822,"category":"건강·날씨","word":"暴雨","pinyin":"bàoyǔ","meaning":"폭우, 큰비","example":"受暴雨影响，山区部分路段暂时禁止通行。","examplePinyin":"Shòu bàoyǔ yǐngxiǎng, shānqū bùfen lùduàn zànshí jìnzhǐ tōngxíng.","translation":"폭우로 산간 지역 일부 도로의 통행이 일시 금지됐어요."},{"no":823,"category":"건강·날씨","word":"池","pinyin":"chí","meaning":"못, 연못; 수조","example":"这个雨水收集池，为附近花园提供了灌溉用水。","examplePinyin":"Zhè ge yǔshuǐ shōují chí, wèi fùjìn huāyuán tígōng le guàngài yòngshuǐ.","translation":"이 빗물 수조는 인근 정원에 관개용수를 공급해요."},{"no":824,"category":"건강·날씨","word":"地震","pinyin":"dìzhèn","meaning":"지진","example":"地震发生后，学校按照演练过的路线组织撤离。","examplePinyin":"Dìzhèn fāshēng hòu, xuéxiào ànzhào yǎnliàn guo de lùxiàn zǔzhī chèlí.","translation":"지진이 나자 학교는 연습한 경로에 따라 대피를 실시했어요."},{"no":825,"category":"건강·날씨","word":"冻","pinyin":"dòng","meaning":"얼다, 얼리다","example":"为了防止水管冻裂，居民提前做好保温措施。","examplePinyin":"Wèile fángzhǐ shuǐguǎn dòngliè, jūmín tíqián zuòhǎo bǎowēn cuòshī.","translation":"수도관 동파를 막으려고 주민들이 미리 보온 조치를 했어요."},{"no":826,"category":"건강·날씨","word":"洞","pinyin":"dòng","meaning":"구멍,동굴 ","example":"洞内温度较低，参观时最好带件外套。","examplePinyin":"Dòng nèi wēndù jiào dī, cānguān shí zuìhǎo dài jiàn wàitào.","translation":"동굴 안은 기온이 낮으니 관람할 때 외투를 챙기는 게 좋아요."},{"no":827,"category":"건강·날씨","word":"光线","pinyin":"guāngxiàn","meaning":"광선, 빛","example":"拍摄时利用自然光线，能使画面显得更柔和。","examplePinyin":"Pāishè shí lìyòng zìrán guāngxiàn, néng shǐ huàmiàn xiǎnde gèng róuhé.","translation":"촬영할 때 자연광을 이용하면 화면이 더 부드럽게 보여요."},{"no":828,"category":"건강·날씨","word":"河流","pinyin":"héliú","meaning":"강, 하천","example":"沿岸工厂减少排放后，河流的水质明显改善。","examplePinyin":"Yán'àn gōngchǎng jiǎnshǎo páifàng hòu, héliú de shuǐzhì míngxiǎn gǎishàn.","translation":"강변 공장들이 배출을 줄이자 강의 수질이 뚜렷이 좋아졌어요."},{"no":829,"category":"건강·날씨","word":"湖","pinyin":"hú","meaning":"호수, 못","example":"湖边恢复湿地后，迁来的水鸟明显增加。","examplePinyin":"Húbiān huīfù shīdì hòu, qiān lái de shuǐniǎo míngxiǎn zēngjiā.","translation":"호숫가 습지를 복원하자 찾아오는 물새가 눈에 띄게 늘었어요."},{"no":830,"category":"건강·날씨","word":"降水","pinyin":"jiàngshuǐ","meaning":"강수(비·눈 등이 내림)","example":"今年春季降水偏少，农民提前调整了播种计划。","examplePinyin":"Jīnnián chūnjì jiàngshuǐ piānshǎo, nóngmín tíqián tiáozhěng le bōzhǒng jìhuà.","translation":"올봄에는 강수량이 적어 농민들이 파종 계획을 미리 조정했어요."},{"no":831,"category":"건강·날씨","word":"陆地","pinyin":"lùdì","meaning":"육지, 땅","example":"长期在海上工作，使他更加珍惜回到陆地的时间。","examplePinyin":"Chángqī zài hǎishàng gōngzuò, shǐ tā gèngjiā zhēnxī huídào lùdì de shíjiān.","translation":"오랫동안 바다에서 일하니 그는 육지에 머무는 시간을 더 소중히 여겨요."},{"no":832,"category":"건강·날씨","word":"燃烧","pinyin":"ránshāo","meaning":"타오르다, 연소하다","example":"物质燃烧时可能产生有害气体，实验必须注意通风。","examplePinyin":"Wùzhì ránshāo shí kěnéng chǎnshēng yǒuhài qìtǐ, shíyàn bìxū zhùyì tōngfēng.","translation":"물질이 탈 때 유해 기체가 생길 수 있어 실험 중 환기가 필요해요."},{"no":833,"category":"건강·날씨","word":"沙漠","pinyin":"shāmò","meaning":"사막","example":"沙漠中的植物，往往具有独特的节水能力。","examplePinyin":"Shāmò zhōng de zhíwù, wǎngwǎng jùyǒu dútè de jiéshuǐ nénglì.","translation":"사막 식물은 독특한 수분 절약 능력을 가진 경우가 많아요."},{"no":834,"category":"건강·날씨","word":"沙子","pinyin":"shāzi","meaning":"모래","example":"工人把沙子与其他材料，按规定比例混合。","examplePinyin":"Gōngrén bǎ shāzi yǔ qítā cáiliào, àn guīdìng bǐlì hùnhé.","translation":"인부들은 모래와 다른 자재를 정해진 비율로 섞었어요."},{"no":835,"category":"건강·날씨","word":"升温","pinyin":"shēngwēn","meaning":"온도가 오르다, 기온이 상승하다","example":"春季升温以后，农民开始安排露地种植。","examplePinyin":"Chūnjì shēngwēn yǐhòu, nóngmín kāishǐ ānpái lùdì zhòngzhí.","translation":"봄에 기온이 오른 뒤 농민들은 노지 재배를 준비하기 시작해요."},{"no":836,"category":"건강·날씨","word":"石头","pinyin":"shítou","meaning":"돌, 돌멩이","example":"他捡起河边的石头，发现上面有清晰的纹路。","examplePinyin":"Tā jiǎnqǐ hébiān de shítou, fāxiàn shàngmiàn yǒu qīngxī de wénlù.","translation":"그는 강가의 돌을 집어 들고 선명한 무늬를 발견했어요."},{"no":837,"category":"건강·날씨","word":"天空","pinyin":"tiānkōng","meaning":"하늘, 창공","example":"雨后的天空格外清澈，远处的山也清晰可见。","examplePinyin":"Yǔ hòu de tiānkōng géwài qīngchè, yuǎnchù de shān yě qīngxī kějiàn.","translation":"비 온 뒤 하늘이 유난히 맑아 먼 산도 선명하게 보여요."},{"no":838,"category":"건강·날씨","word":"雾","pinyin":"wù","meaning":"안개, 박무","example":"大雾降低了能见度，部分道路暂时限制通行。","examplePinyin":"Dàwù jiàngdī le néngjiàndù, bùfen dàolù zànshí xiànzhì tōngxíng.","translation":"짙은 안개로 가시거리가 짧아져 일부 도로의 통행이 제한됐어요."},{"no":839,"category":"건강·날씨","word":"预报","pinyin":"yùbào","meaning":"예보, 예측","example":"天气预报提示可能降雨，主办方准备了室内场地。","examplePinyin":"Tiānqì yùbào tíshì kěnéng jiàngyǔ, zhǔbànfāng zhǔnbèi le shìnèi chǎngdì.","translation":"일기 예보에 비 소식이 있어 주최 측은 실내 장소를 준비했어요."},{"no":840,"category":"건강·날씨","word":"雨水","pinyin":"yǔshuǐ","meaning":"빗물, 비","example":"收集雨水用于浇花，可以减少部分自来水消耗。","examplePinyin":"Shōují yǔshuǐ yòngyú jiāohuā, kěyǐ jiǎnshǎo bùfen zìláishuǐ xiāohào.","translation":"빗물을 모아 꽃에 주면 수돗물 사용을 조금 줄일 수 있어요."},{"no":841,"category":"건강·날씨","word":"爱护","pinyin":"àihù","meaning":"아끼다, 보호하다, 소중히 하다","example":"爱护森林不仅是口号，更需要每个人行动。","examplePinyin":"Àihù sēnlín bùjǐn shì kǒuhào, gèng xūyào měi ge rén xíngdòng.","translation":"숲을 아끼는 일은 구호에 그치지 않고 모두의 실천이 필요해요."},{"no":842,"category":"건강·날씨","word":"回收","pinyin":"huíshōu","meaning":"회수하다, 수거하다","example":"建立旧家电回收体系，可以减少资源浪费。","examplePinyin":"Jiànlì jiù jiādiàn huíshōu tǐxì, kěyǐ jiǎnshǎo zīyuán làngfèi.","translation":"폐가전 수거 체계를 만들면 자원 낭비를 줄일 수 있어요."},{"no":843,"category":"건강·날씨","word":"破坏","pinyin":"pòhuài","meaning":"파괴하다, 손상시키다","example":"过度开发可能破坏景观，也可能影响居民生活。","examplePinyin":"Guòdù kāifā kěnéng pòhuài jǐngguān, yě kěnéng yǐngxiǎng jūmín shēnghuó.","translation":"과도한 개발은 경관을 파괴하고 주민의 삶에도 영향을 줄 수 있어요."},{"no":844,"category":"건강·날씨","word":"土地","pinyin":"tǔdì","meaning":"토지, 땅","example":"保护土地，不只是限制开发，也包括修复受损环境。","examplePinyin":"Bǎohù tǔdì, bù zhǐshì xiànzhì kāifā, yě bāokuò xiūfù shòusǔn huánjìng.","translation":"토지를 보호하는 일에는 개발 제한뿐 아니라 훼손 환경 복구도 포함돼요."},{"no":845,"category":"건강·날씨","word":"资源","pinyin":"zīyuán","meaning":"자원","example":"资源再丰富，也不能忽视合理利用和长期保护。","examplePinyin":"Zīyuán zài fēngfù, yě bùnéng hūshì hélǐ lìyòng hé chángqī bǎohù.","translation":"자원이 아무리 풍부해도 합리적인 이용과 장기 보호를 소홀히 하면 안 돼요."},{"no":846,"category":"여가·미디어·소통","word":"比分","pinyin":"bǐfēn","meaning":"점수, 스코어","example":"虽然最终比分落后，队员们仍坚持到了最后。","examplePinyin":"Suīrán zuìzhōng bǐfēn luòhòu, duìyuánmen réng jiānchí dào le zuìhòu.","translation":"최종 점수는 뒤졌지만 선수들은 끝까지 포기하지 않았어요."},{"no":847,"category":"여가·미디어·소통","word":"裁判","pinyin":"cáipàn","meaning":"심판, 재판관 / 재판하다","example":"无论结果如何，运动员都应尊重裁判的决定。","examplePinyin":"Wúlùn jiéguǒ rúhé, yùndòngyuán dōu yīng zūnzhòng cáipàn de juédìng.","translation":"결과와 관계없이 선수는 심판의 결정을 존중해야 해요."},{"no":848,"category":"여가·미디어·소통","word":"对手","pinyin":"duìshǒu","meaning":"상대, 적수","example":"真正的高手，会从对手的表现中学习。","examplePinyin":"Zhēnzhèng de gāoshǒu, huì cóng duìshǒu de biǎoxiàn zhōng xuéxí.","translation":"진정한 고수는 상대의 경기 모습에서도 배워요."},{"no":849,"category":"여가·미디어·소통","word":"冠军","pinyin":"guànjūn","meaning":"우승자, 챔피언","example":"获得冠军之后，她仍然坚持每天的基础训练。","examplePinyin":"Huòdé guànjūn zhīhòu, tā réngrán jiānchí měi tiān de jīchǔ xùnliàn.","translation":"우승한 뒤에도 그녀는 매일 기초 훈련을 계속했어요."},{"no":850,"category":"여가·미디어·소통","word":"划","pinyin":"huá","meaning":"노를 젓다; 그어 자국을 내다","example":"两人轮流划船，终于在天黑前回到了岸边。","examplePinyin":"Liǎng rén lúnliú huáchuán, zhōngyú zài tiānhēi qián huídào le ànbiān.","translation":"두 사람이 번갈아 노를 저어 마침내 어두워지기 전에 강가로 돌아왔어요."},{"no":851,"category":"여가·미디어·소통","word":"纪录","pinyin":"jìlù","meaning":"기록, 기록물","example":"他刷新纪录后表示，成绩来自团队长期的支持。","examplePinyin":"Tā shuāxīn jìlù hòu biǎoshì, chéngjì láizì tuánduì chángqī de zhīchí.","translation":"기록을 경신한 뒤 그는 팀의 오랜 지원 덕분이라고 말했어요."},{"no":852,"category":"여가·미디어·소통","word":"决赛","pinyin":"juésài","meaning":"결승전, 최종전","example":"进入决赛之后，队员们更加重视基本动作的训练。","examplePinyin":"Jìnrù juésài zhīhòu, duìyuánmen gèngjiā zhòngshì jīběn dòngzuò de xùnliàn.","translation":"결승에 진출한 뒤 선수들은 기본 동작 훈련을 더욱 중시했어요."},{"no":853,"category":"여가·미디어·소통","word":"领先","pinyin":"lǐngxiān","meaning":"앞서다, 선두를 달리다","example":"暂时领先不代表最终获胜，队员们仍不敢松懈。","examplePinyin":"Zànshí lǐngxiān bú dàibiǎo zuìzhōng huòshèng, duìyuánmen réng bùgǎn sōngxiè.","translation":"잠시 앞선다고 승리한 것은 아니라 선수들은 긴장을 늦추지 않았어요."},{"no":854,"category":"여가·미디어·소통","word":"跑道","pinyin":"pǎodào","meaning":"활주로, 트랙","example":"雨后跑道仍有积水，比赛因此推迟了半小时。","examplePinyin":"Yǔ hòu pǎodào réng yǒu jīshuǐ, bǐsài yīncǐ tuīchí le bàn xiǎoshí.","translation":"비 온 뒤 트랙에 물이 남아 경기가 30분 늦어졌어요."},{"no":855,"category":"여가·미디어·소통","word":"赛场","pinyin":"sàichǎng","meaning":"경기장, 시합 장소","example":"离开赛场后，运动员开始认真总结比赛经验。","examplePinyin":"Líkāi sàichǎng hòu, yùndòngyuán kāishǐ rènzhēn zǒngjié bǐsài jīngyàn.","translation":"경기장을 떠난 뒤 선수들은 경기 경험을 차분히 정리했어요."},{"no":856,"category":"여가·미디어·소통","word":"胜","pinyin":"shèng","meaning":"이기다, 승리하다","example":"这场比赛他们以微弱优势获胜，过程十分艰难。","examplePinyin":"Zhè chǎng bǐsài tāmen yǐ wēiruò yōushì huòshèng, guòchéng shífēn jiānnán.","translation":"그들은 이 경기에서 근소하게 이겼고 과정은 매우 힘들었어요."},{"no":857,"category":"여가·미디어·소통","word":"胜利","pinyin":"shènglì","meaning":"승리; 승리하다","example":"胜利值得庆祝，但更值得总结的是合作的经验。","examplePinyin":"Shènglì zhíde qìngzhù, dàn gèng zhíde zǒngjié de shì hézuò de jīngyàn.","translation":"승리는 축하할 일이지만 협력의 경험을 돌아보는 것이 더 중요해요."},{"no":858,"category":"여가·미디어·소통","word":"跳高","pinyin":"tiàogāo","meaning":"높이뛰기","example":"跳高训练不仅练力量，也要掌握合适的节奏。","examplePinyin":"Tiàogāo xùnliàn bùjǐn liàn lìliang, yě yào zhǎngwò héshì de jiézòu.","translation":"높이뛰기는 힘뿐 아니라 적절한 리듬도 익혀야 해요."},{"no":859,"category":"여가·미디어·소통","word":"跳远","pinyin":"tiàoyuǎn","meaning":"멀리뛰기","example":"跳远比赛结束后，教练与队员共同分析起跳动作。","examplePinyin":"Tiàoyuǎn bǐsài jiéshù hòu, jiàoliàn yǔ duìyuán gòngtóng fēnxī qǐtiào dòngzuò.","translation":"멀리뛰기 경기 후 감독과 선수가 함께 도약 동작을 분석했어요."},{"no":860,"category":"여가·미디어·소통","word":"武术","pinyin":"wǔshù","meaning":"무술, 쿵푸","example":"学习武术不仅练动作，也需要培养自我约束。","examplePinyin":"Xuéxí wǔshù bùjǐn liàn dòngzuò, yě xūyào péiyǎng zìwǒ yuēshù.","translation":"무술을 배울 때는 동작뿐 아니라 자기 절제도 길러야 해요."},{"no":861,"category":"여가·미디어·소통","word":"选手","pinyin":"xuǎnshǒu","meaning":"선수, 경기자","example":"年轻选手虽然缺少经验，却表现出良好的心理素质。","examplePinyin":"Niánqīng xuǎnshǒu suīrán quēshǎo jīngyàn, què biǎoxiàn chū liánghǎo de xīnlǐ sùzhì.","translation":"젊은 선수는 경험은 적어도 좋은 심리적 자질을 보였어요."},{"no":862,"category":"여가·미디어·소통","word":"训练","pinyin":"xùnliàn","meaning":"훈련, 연습","example":"训练计划应根据身体反应调整，不能一味增加强度。","examplePinyin":"Xùnliàn jìhuà yīng gēnjù shēntǐ fǎnyìng tiáozhěng, bùnéng yíwèi zēngjiā qiángdù.","translation":"훈련 계획은 몸의 반응에 따라 조절해야 하며 강도만 높이면 안 돼요."},{"no":863,"category":"여가·미디어·소통","word":"博物馆","pinyin":"bówùguǎn","meaning":"박물관","example":"博物馆通过互动展览，让观众了解城市历史。","examplePinyin":"Bówùguǎn tōngguò hùdòng zhǎnlǎn, ràng guānzhòng liǎojiě chéngshì lìshǐ.","translation":"박물관은 체험형 전시로 관람객에게 도시의 역사를 알려 줘요."},{"no":864,"category":"여가·미디어·소통","word":"创作","pinyin":"chuàngzuò","meaning":"창작하다, 작품을 쓰다","example":"这位作家深入乡村生活，为下一部小说积累创作素材。","examplePinyin":"Zhè wèi zuòjiā shēnrù xiāngcūn shēnghuó, wèi xià yí bù xiǎoshuō jīlěi chuàngzuò sùcái.","translation":"이 작가는 다음 소설의 소재를 모으려고 농촌 생활을 깊이 체험했어요."},{"no":865,"category":"여가·미디어·소통","word":"传说","pinyin":"chuánshuō","meaning":"전설, 이야기","example":"关于这座山的传说，反映了当地人的生活愿望。","examplePinyin":"Guānyú zhè zuò shān de chuánshuō, fǎnyìng le dāngdìrén de shēnghuó yuànwàng.","translation":"이 산에 관한 전설에는 지역 주민의 삶에 대한 소망이 담겨 있어요."},{"no":866,"category":"여가·미디어·소통","word":"传统","pinyin":"chuántǒng","meaning":"전통, 관습","example":"保护传统文化，不等于拒绝一切新的表达方式。","examplePinyin":"Bǎohù chuántǒng wénhuà, bù děngyú jùjué yíqiè xīn de biǎodá fāngshì.","translation":"전통문화를 지킨다고 새로운 표현 방식을 모두 거부하는 것은 아니에요."},{"no":867,"category":"여가·미디어·소통","word":"导演","pinyin":"dǎoyǎn","meaning":"감독하다,연출하다/감독","example":"导演通过细节，表现出普通家庭面对变化的心情。","examplePinyin":"Dǎoyǎn tōngguò xìjié, biǎoxiàn chū pǔtōng jiātíng miànduì biànhuà de xīnqíng.","translation":"감독은 세부 묘사를 통해 변화에 직면한 평범한 가족의 심정을 보여 줘요."},{"no":868,"category":"여가·미디어·소통","word":"动画","pinyin":"dònghuà","meaning":"애니메이션","example":"这部动画用轻松的方式，讨论了人与自然的关系。","examplePinyin":"Zhè bù dònghuà yòng qīngsōng de fāngshì, tǎolùn le rén yǔ zìrán de guānxi.","translation":"이 애니메이션은 편안한 방식으로 인간과 자연의 관계를 다뤘어요."},{"no":869,"category":"여가·미디어·소통","word":"风格","pinyin":"fēnggé","meaning":"스타일, 풍격","example":"这位设计师的风格简洁，却十分注重使用体验。","examplePinyin":"Zhè wèi shèjìshī de fēnggé jiǎnjié, què shífēn zhùzhòng shǐyòng tǐyàn.","translation":"이 디자이너의 스타일은 간결하면서도 사용 경험을 중시해요."},{"no":870,"category":"여가·미디어·소통","word":"风俗","pinyin":"fēngsú","meaning":"풍속, 관습","example":"了解当地风俗，能减少旅行中不必要的误会。","examplePinyin":"Liǎojiě dāngdì fēngsú, néng jiǎnshǎo lǚxíng zhōng búbìyào de wùhuì.","translation":"현지 풍속을 알면 여행 중 불필요한 오해를 줄일 수 있어요."},{"no":871,"category":"여가·미디어·소통","word":"歌词","pinyin":"gēcí","meaning":"가사, 노래 가사","example":"歌词没有华丽的辞句，却写出了普通人的心声。","examplePinyin":"Gēcí méiyǒu huálì de cíjù, què xiěchū le pǔtōngrén de xīnshēng.","translation":"가사에 화려한 표현은 없지만 평범한 사람들의 속마음을 담았어요."},{"no":872,"category":"여가·미디어·소통","word":"歌曲","pinyin":"gēqǔ","meaning":"노래, 곡","example":"这首歌曲旋律简单，却让人想起故乡的生活。","examplePinyin":"Zhè shǒu gēqǔ xuánlǜ jiǎndān, què ràng rén xiǎngqǐ gùxiāng de shēnghuó.","translation":"이 노래는 선율이 단순하지만 고향의 삶을 떠올리게 해요."},{"no":873,"category":"여가·미디어·소통","word":"工艺","pinyin":"gōngyì","meaning":"공예, 기술","example":"传统工艺结合现代设计，吸引了新的消费群体。","examplePinyin":"Chuántǒng gōngyì jiéhé xiàndài shèjì, xīyǐn le xīn de xiāofèi qúntǐ.","translation":"전통 공예가 현대 디자인과 결합해 새로운 소비층을 끌었어요."},{"no":874,"category":"여가·미디어·소통","word":"鼓","pinyin":"gǔ","meaning":"북, 북을 치다","example":"鼓声响起时，舞台上的演员缓缓走到中央。","examplePinyin":"Gǔshēng xiǎngqǐ shí, wǔtái shàng de yǎnyuán huǎnhuǎn zǒu dào zhōngyāng.","translation":"북소리가 울리자 무대 위 배우가 천천히 중앙으로 걸어갔어요."},{"no":875,"category":"여가·미디어·소통","word":"国画","pinyin":"guóhuà","meaning":"중국 전통 회화, 중국화","example":"这幅国画留白很多，却营造出开阔的空间感。","examplePinyin":"Zhè fú guóhuà liúbái hěn duō, què yíngzào chū kāikuò de kōngjiāngǎn.","translation":"이 중국화는 여백이 많아 넓은 공간감을 자아내요."},{"no":876,"category":"여가·미디어·소통","word":"经典","pinyin":"jīngdiǎn","meaning":"고전, 클래식","example":"经典作品的意义，会随着读者的经历不断丰富。","examplePinyin":"Jīngdiǎn zuòpǐn de yìyì, huì suízhe dúzhě de jīnglì búduàn fēngfù.","translation":"고전 작품의 의미는 독자의 경험에 따라 더욱 풍부해져요."},{"no":877,"category":"여가·미디어·소통","word":"剧场","pinyin":"jùchǎng","meaning":"극장, 연극장","example":"这座小剧场为年轻演员提供了实践的舞台。","examplePinyin":"Zhè zuò xiǎojùchǎng wèi niánqīng yǎnyuán tígōng le shíjiàn de wǔtái.","translation":"이 소극장은 젊은 배우들에게 실전 무대를 제공해요."},{"no":878,"category":"여가·미디어·소통","word":"角色","pinyin":"juésè","meaning":"역할, 배역","example":"为了演好这个角色，她专门体验了工人的生活。","examplePinyin":"Wèile yǎn hǎo zhè ge juésè, tā zhuānmén tǐyàn le gōngrén de shēnghuó.","translation":"이 배역을 잘 연기하려고 그녀는 노동자의 삶을 직접 체험했어요."},{"no":879,"category":"여가·미디어·소통","word":"流传","pinyin":"liúchuán","meaning":"유포되다, 전해지다","example":"这个故事在当地流传多年，细节已有不同版本。","examplePinyin":"Zhè ge gùshi zài dāngdì liúchuán duōnián, xìjié yǐyǒu bùtóng bǎnběn.","translation":"이 이야기는 현지에 오랫동안 전해져 세부 내용에 여러 판본이 생겼어요."},{"no":880,"category":"여가·미디어·소통","word":"龙","pinyin":"lóng","meaning":"용","example":"展览介绍了龙的形象在不同历史时期的变化。","examplePinyin":"Zhǎnlǎn jièshào le lóng de xíngxiàng zài bùtóng lìshǐ shíqī de biànhuà.","translation":"전시는 시대별 용의 형상 변화를 소개했어요."},{"no":881,"category":"여가·미디어·소통","word":"毛笔","pinyin":"máobǐ","meaning":"붓","example":"练习毛笔字，需要耐心观察每一笔的变化。","examplePinyin":"Liànxí máobǐzì, xūyào nàixīn guānchá měi yì bǐ de biànhuà.","translation":"붓글씨를 연습하려면 획마다 생기는 변화를 찬찬히 봐야 해요."},{"no":882,"category":"여가·미디어·소통","word":"美术","pinyin":"měishù","meaning":"미술, 예술","example":"美术教育不仅培养技巧，也鼓励学生观察和表达。","examplePinyin":"Měishù jiàoyù bùjǐn péiyǎng jìqiǎo, yě gǔlì xuésheng guānchá hé biǎodá.","translation":"미술 교육은 기술을 기르고 관찰과 표현도 장려해요."},{"no":883,"category":"여가·미디어·소통","word":"明星","pinyin":"míngxīng","meaning":"스타, 유명인","example":"这位明星利用自身影响力，呼吁公众关注乡村教育。","examplePinyin":"Zhè wèi míngxīng lìyòng zìshēn yǐngxiǎnglì, hūyù gōngzhòng guānzhù xiāngcūn jiàoyù.","translation":"이 유명인은 자신의 영향력으로 농촌 교육에 관심을 갖자고 호소했어요."},{"no":884,"category":"여가·미디어·소통","word":"人物","pinyin":"rénwù","meaning":"인물, 사람","example":"这位作家善于通过小事，表现人物复杂的内心。","examplePinyin":"Zhè wèi zuòjiā shànyú tōngguò xiǎoshì, biǎoxiàn rénwù fùzá de nèixīn.","translation":"이 작가는 작은 일을 통해 인물의 복잡한 내면을 잘 보여 줘요."},{"no":885,"category":"여가·미디어·소통","word":"色彩","pinyin":"sècǎi","meaning":"색채, 색","example":"不同色彩的搭配，会影响观众对画面的感受。","examplePinyin":"Bùtóng sècǎi de dāpèi, huì yǐngxiǎng guānzhòng duì huàmiàn de gǎnshòu.","translation":"색채의 조합에 따라 관객이 장면에서 받는 느낌이 달라져요."},{"no":886,"category":"여가·미디어·소통","word":"生肖","pinyin":"shēngxiào","meaning":"십이지(동물), 띠","example":"生肖文化体现了人们对生活的想象与祝愿。","examplePinyin":"Shēngxiào wénhuà tǐxiàn le rénmen duì shēnghuó de xiǎngxiàng yǔ zhùyuàn.","translation":"띠 문화에는 삶에 대한 사람들의 상상과 기원이 나타나요."},{"no":887,"category":"여가·미디어·소통","word":"神话","pinyin":"shénhuà","meaning":"신화","example":"神话故事常常反映古人对自然现象的理解。","examplePinyin":"Shénhuà gùshi chángcháng fǎnyìng gǔrén duì zìrán xiànxiàng de lǐjiě.","translation":"신화는 옛사람들이 자연 현상을 어떻게 이해했는지 보여 주곤 해요."},{"no":888,"category":"여가·미디어·소통","word":"摄影","pinyin":"shèyǐng","meaning":"촬영, 사진","example":"摄影不仅记录景色，也能记录人与城市的关系。","examplePinyin":"Shèyǐng bùjǐn jìlù jǐngsè, yě néng jìlù rén yǔ chéngshì de guānxi.","translation":"사진은 풍경뿐 아니라 사람과 도시의 관계도 기록할 수 있어요."},{"no":889,"category":"여가·미디어·소통","word":"诗","pinyin":"shī","meaning":"시(문학)","example":"这首诗没有直接写乡愁，却处处流露出思念。","examplePinyin":"Zhè shǒu shī méiyǒu zhíjiē xiě xiāngchóu, què chùchù liúlùchū sīniàn.","translation":"이 시는 향수를 직접 쓰지 않았지만 곳곳에 그리움이 배어 있어요."},{"no":890,"category":"여가·미디어·소통","word":"诗人","pinyin":"shīrén","meaning":"시인","example":"这位诗人从普通劳动者的生活中寻找创作灵感。","examplePinyin":"Zhè wèi shīrén cóng pǔtōng láodòngzhě de shēnghuó zhōng xúnzhǎo chuàngzuò línggǎn.","translation":"이 시인은 평범한 노동자의 삶에서 창작 영감을 찾아요."},{"no":891,"category":"여가·미디어·소통","word":"手工","pinyin":"shǒugōng","meaning":"수공, 수작업","example":"手工制作虽然慢，却能根据个别需求灵活调整。","examplePinyin":"Shǒugōng zhìzuò suīrán màn, què néng gēnjù gèbié xūqiú línghuó tiáozhěng.","translation":"수작업은 느리지만 개별 수요에 유연하게 맞출 수 있어요."},{"no":892,"category":"여가·미디어·소통","word":"书法","pinyin":"shūfǎ","meaning":"서예, 글씨","example":"练习书法不仅是写字，也需要观察结构和节奏。","examplePinyin":"Liànxí shūfǎ bùjǐn shì xiězì, yě xūyào guānchá jiégòu hé jiézòu.","translation":"서예는 글씨를 쓰는 것뿐 아니라 구조와 리듬을 보는 연습도 필요해요."},{"no":893,"category":"여가·미디어·소통","word":"图画","pinyin":"túhuà","meaning":"그림, 회화","example":"孩子通过图画，表达了自己对未来城市的想象。","examplePinyin":"Háizi tōngguò túhuà, biǎodá le zìjǐ duì wèilái chéngshì de xiǎngxiàng.","translation":"아이는 그림으로 미래 도시의 모습을 상상해 표현했어요."},{"no":894,"category":"여가·미디어·소통","word":"文学","pinyin":"wénxué","meaning":"문학, 문예","example":"文学让我们有机会，理解与自己不同的人生。","examplePinyin":"Wénxué ràng wǒmen yǒu jīhuì, lǐjiě yǔ zìjǐ bùtóng de rénshēng.","translation":"문학은 우리와 다른 삶을 이해할 기회를 줘요."},{"no":895,"category":"여가·미디어·소통","word":"舞蹈","pinyin":"wǔdǎo","meaning":"무용, 춤","example":"这段舞蹈借鉴传统动作，却表达了现代生活的节奏。","examplePinyin":"Zhè duàn wǔdǎo jièjiàn chuántǒng dòngzuò, què biǎodá le xiàndài shēnghuó de jiézòu.","translation":"이 춤은 전통 동작을 참고하면서 현대 생활의 리듬을 표현했어요."},{"no":896,"category":"여가·미디어·소통","word":"舞台","pinyin":"wǔtái","meaning":"무대, 단","example":"舞台上的短短几分钟，背后是长期反复的练习。","examplePinyin":"Wǔtái shàng de duǎnduǎn jǐ fēnzhōng, bèihòu shì chángqī fǎnfù de liànxí.","translation":"짧은 무대 몇 분 뒤에는 오랫동안 거듭한 연습이 있어요."},{"no":897,"category":"여가·미디어·소통","word":"戏","pinyin":"xì","meaning":"연극, 극; 장난하다, 놀리다","example":"这出戏通过一家人的争论，表现社会观念的变化。","examplePinyin":"Zhè chū xì tōngguò yìjiārén de zhēnglùn, biǎoxiàn shèhuì guānniàn de biànhuà.","translation":"이 연극은 한 가족의 논쟁으로 사회 관념의 변화를 보여 줘요."},{"no":898,"category":"여가·미디어·소통","word":"象征","pinyin":"xiàngzhēng","meaning":"상징하다, 상징","example":"这棵老树象征着村庄的延续，被居民共同保护。","examplePinyin":"Zhè kē lǎoshù xiàngzhēng zhe cūnzhuāng de yánxù, bèi jūmín gòngtóng bǎohù.","translation":"이 오래된 나무는 마을의 지속을 상징해 주민들이 함께 보호해요."},{"no":899,"category":"여가·미디어·소통","word":"戏剧","pinyin":"xìjù","meaning":"희곡, 연극","example":"戏剧通过人物冲突，让观众重新思考日常生活。","examplePinyin":"Xìjù tōngguò rénwù chōngtū, ràng guānzhòng chóngxīn sīkǎo rìcháng shēnghuó.","translation":"연극은 인물 간 갈등을 통해 관객이 일상을 새로 생각하게 해요."},{"no":900,"category":"여가·미디어·소통","word":"形象","pinyin":"xíngxiàng","meaning":"형상, 이미지","example":"好的形象不只靠宣传，更靠实际行动维护。","examplePinyin":"Hǎo de xíngxiàng bù zhǐ kào xuānchuán, gèng kào shíjì xíngdòng wéihù.","translation":"좋은 이미지는 홍보뿐 아니라 실제 행동으로 유지해야 해요."},{"no":901,"category":"여가·미디어·소통","word":"欣赏","pinyin":"xīnshǎng","meaning":"감상하다, 평가하다","example":"欣赏作品时，了解创作背景可以丰富理解。","examplePinyin":"Xīnshǎng zuòpǐn shí, liǎojiě chuàngzuò bèijǐng kěyǐ fēngfù lǐjiě.","translation":"작품을 감상할 때 창작 배경을 알면 이해가 풍부해져요."},{"no":902,"category":"여가·미디어·소통","word":"展出","pinyin":"zhǎnchū","meaning":"전시하다, 출품하다","example":"展出的不仅是成品，也包括工匠反复修改的草图。","examplePinyin":"Zhǎnchū de bùjǐn shì chéngpǐn, yě bāokuò gōngjiàng fǎnfù xiūgǎi de cǎotú.","translation":"완성품뿐 아니라 장인이 거듭 수정한 밑그림도 전시돼 있어요."},{"no":903,"category":"여가·미디어·소통","word":"展览","pinyin":"zhǎnlǎn","meaning":"전람회, 전시","example":"这次展览通过生活用品，讲述普通家庭的历史。","examplePinyin":"Zhè cì zhǎnlǎn tōngguò shēnghuó yòngpǐn, jiǎngshù pǔtōng jiātíng de lìshǐ.","translation":"이번 전시는 생활용품으로 평범한 가정의 역사를 이야기해요."},{"no":904,"category":"여가·미디어·소통","word":"制作","pinyin":"zhìzuò","meaning":"제작하다, 창작하다","example":"制作学习资料时，准确性应放在外观之前。","examplePinyin":"Zhìzuò xuéxí zīliào shí, zhǔnquèxìng yīng fàng zài wàiguān zhīqián.","translation":"학습 자료를 제작할 때는 겉모양보다 정확성을 우선해야 해요."},{"no":905,"category":"여가·미디어·소통","word":"中华","pinyin":"Zhōnghuá","meaning":"중화(중국)","example":"展览通过书法和工艺，展示中华文化的多样面貌。","examplePinyin":"Zhǎnlǎn tōngguò shūfǎ hé gōngyì, zhǎnshì Zhōnghuá wénhuà de duōyàng miànmào.","translation":"전시는 서예와 공예로 중국 문화의 다채로운 모습을 보여 줘요."},{"no":906,"category":"여가·미디어·소통","word":"保存","pinyin":"bǎocún","meaning":"보존하다, 저장하다","example":"重要文件除了保存在电脑里，还应另做备份。","examplePinyin":"Zhòngyào wénjiàn chúle bǎocún zài diànnǎo lǐ, hái yīng lìng zuò bèifèn.","translation":"중요한 파일은 컴퓨터에 저장하고 별도로 백업해야 해요."},{"no":907,"category":"여가·미디어·소통","word":"报道","pinyin":"bàodào","meaning":"보도하다, 기사 / 보도","example":"这篇报道从普通居民的角度介绍了城市变化。","examplePinyin":"Zhè piān bàodào cóng pǔtōng jūmín de jiǎodù jièshào le chéngshì biànhuà.","translation":"이 기사는 일반 주민의 시각으로 도시의 변화를 소개했어요."},{"no":908,"category":"여가·미디어·소통","word":"采访","pinyin":"cǎifǎng","meaning":"인터뷰하다, 취재하다","example":"记者深入社区采访，记录居民真实的生活。","examplePinyin":"Jìzhě shēnrù shèqū cǎifǎng, jìlù jūmín zhēnshí de shēnghuó.","translation":"기자는 지역 사회를 깊이 취재해 주민들의 실제 삶을 기록했어요."},{"no":909,"category":"여가·미디어·소통","word":"传播","pinyin":"chuánbō","meaning":"전파하다, 퍼뜨리다","example":"未经核实的信息，可能通过网络迅速传播。","examplePinyin":"Wèijīng héshí de xìnxī, kěnéng tōngguò wǎngluò xùnsù chuánbō.","translation":"확인되지 않은 정보는 인터넷에서 빠르게 퍼질 수 있어요."},{"no":910,"category":"여가·미디어·소통","word":"出版","pinyin":"chūbǎn","meaning":"출판하다, 발행하다","example":"这部小说出版后，引起了读者对家庭关系的讨论。","examplePinyin":"Zhè bù xiǎoshuō chūbǎn hòu, yǐnqǐ le dúzhě duì jiātíng guānxi de tǎolùn.","translation":"이 소설은 출판된 뒤 가족 관계에 관한 독자들의 논의를 불렀어요."},{"no":911,"category":"여가·미디어·소통","word":"登录","pinyin":"dēnglù","meaning":"로그인, 등록","example":"在公共电脑上登录账号后，离开时务必退出。","examplePinyin":"Zài gōnggòng diànnǎo shàng dēnglù zhànghào hòu, líkāi shí wùbì tuìchū.","translation":"공용 컴퓨터로 계정에 로그인했다면 떠날 때 꼭 로그아웃하세요."},{"no":912,"category":"여가·미디어·소통","word":"电视台","pinyin":"diànshìtái","meaning":"텔레비전 방송국","example":"电视台邀请专家，对网上流传的说法进行解释。","examplePinyin":"Diànshìtái yāoqǐng zhuānjiā, duì wǎngshàng liúchuán de shuōfǎ jìnxíng jiěshì.","translation":"방송국은 전문가를 초청해 인터넷에 퍼진 주장들을 설명했어요."},{"no":913,"category":"여가·미디어·소통","word":"点赞","pinyin":"diǎnzàn","meaning":"좋아요(클릭)","example":"比起随手点赞，更有价值的是提出具体建议。","examplePinyin":"Bǐqǐ suíshǒu diǎnzàn, gèng yǒu jiàzhí de shì tíchū jùtǐ jiànyì.","translation":"가볍게 좋아요를 누르기보다 구체적인 제안을 하는 것이 더 가치 있어요."},{"no":914,"category":"여가·미디어·소통","word":"电子版","pinyin":"diànzǐbǎn","meaning":"전자 버전","example":"这份报告同时提供电子版，方便读者检索资料。","examplePinyin":"Zhè fèn bàogào tóngshí tígōng diànzǐbǎn, fāngbiàn dúzhě jiǎnsuǒ zīliào.","translation":"이 보고서는 독자의 자료 검색을 위해 전자판도 제공해요."},{"no":915,"category":"여가·미디어·소통","word":"二维码","pinyin":"èrwéimǎ","meaning":"QR코드","example":"扫描展品旁的二维码，就能听到详细的讲解。","examplePinyin":"Sǎomiáo zhǎnpǐn páng de èrwéimǎ, jiù néng tīngdào xiángxì de jiǎngjiě.","translation":"전시품 옆의 QR코드를 스캔하면 자세한 설명을 들을 수 있어요."},{"no":916,"category":"여가·미디어·소통","word":"发布","pinyin":"fābù","meaning":"출시하다, 공개하다","example":"有关部门及时发布信息，回应了公众的疑问。","examplePinyin":"Yǒuguān bùmén jíshí fābù xìnxī, huíyìng le gōngzhòng de yíwèn.","translation":"관계 부처가 제때 정보를 공개해 대중의 의문에 답했어요."},{"no":917,"category":"여가·미디어·소통","word":"复制","pinyin":"fùzhì","meaning":"복제하다, 복사","example":"复制他人的成果而不说明来源，属于不诚实的行为。","examplePinyin":"Fùzhì tārén de chéngguǒ ér bù shuōmíng láiyuán, shǔyú bùchéngshí de xíngwéi.","translation":"출처를 밝히지 않고 남의 성과를 복제하는 것은 부정직한 행동이에요."},{"no":918,"category":"여가·미디어·소통","word":"更新","pinyin":"gēngxīn","meaning":"갱신하다, 업데이트","example":"这份统计资料每季度更新一次，便于追踪变化。","examplePinyin":"Zhè fèn tǒngjì zīliào měi jìdù gēngxīn yí cì, biànyú zhuīzōng biànhuà.","translation":"이 통계 자료는 변화를 추적할 수 있게 분기마다 갱신해요."},{"no":919,"category":"여가·미디어·소통","word":"共享","pinyin":"gòngxiǎng","meaning":"공유하다, 함께 쓰다","example":"开放公共数据，有助于实现信息资源的共享。","examplePinyin":"Kāifàng gōnggòng shùjù, yǒuzhùyú shíxiàn xìnxī zīyuán de gòngxiǎng.","translation":"공공 데이터를 개방하면 정보 자원의 공유를 촉진할 수 있어요."},{"no":920,"category":"여가·미디어·소통","word":"画面","pinyin":"huàmiàn","meaning":"화면, 그림 면","example":"影片没有激烈冲突，却用平静的画面打动了观众。","examplePinyin":"Yǐngpiàn méiyǒu jīliè chōngtū, què yòng píngjìng de huàmiàn dǎdòng le guānzhòng.","translation":"영화는 격한 갈등 없이 잔잔한 화면으로 관객의 마음을 움직였어요."},{"no":921,"category":"여가·미디어·소통","word":"集","pinyin":"jí","meaning":"모으다, 모이다; 모음집; (양사) 편, 회","example":"这部纪录片共六集，每集介绍一种传统技艺。","examplePinyin":"Zhè bù jìlùpiàn gòng liù jí, měi jí jièshào yì zhǒng chuántǒng jìyì.","translation":"이 다큐멘터리는 총 여섯 편으로 편마다 전통 기술 하나를 소개해요."},{"no":922,"category":"여가·미디어·소통","word":"接收","pinyin":"jiēshōu","meaning":"수신하다, 받다","example":"系统接收到信号后，会自动记录相关数据。","examplePinyin":"Xìtǒng jiēshōu dào xìnhào hòu, huì zìdòng jìlù xiāngguān shùjù.","translation":"시스템은 신호를 받으면 관련 자료를 자동으로 기록해요."},{"no":923,"category":"여가·미디어·소통","word":"纪录片","pinyin":"jìlùpiàn","meaning":"다큐멘터리","example":"这部纪录片通过一家人的生活，呈现城市的变化。","examplePinyin":"Zhè bù jìlùpiàn tōngguò yìjiārén de shēnghuó, chéngxiàn chéngshì de biànhuà.","translation":"이 다큐멘터리는 한 가족의 삶을 통해 도시의 변화를 보여 줘요."},{"no":924,"category":"여가·미디어·소통","word":"浏览","pinyin":"liúlǎn","meaning":"훑어보다 대강 둘러보다","example":"浏览新闻时，应区分事实报道与个人评论。","examplePinyin":"Liúlǎn xīnwén shí, yīng qūfēn shìshí bàodào yǔ gèrén pínglùn.","translation":"뉴스를 훑어볼 때는 사실 보도와 개인 논평을 구분해야 해요."},{"no":925,"category":"여가·미디어·소통","word":"留言","pinyin":"liúyán","meaning":"메시지, 글 남기기","example":"读者在留言中提出的问题，成为下一期节目的主题。","examplePinyin":"Dúzhě zài liúyán zhōng tíchū de wèntí, chéngwéi xià yì qī jiémù dì zhǔtí.","translation":"독자가 댓글로 제기한 문제가 다음 방송의 주제가 됐어요."},{"no":926,"category":"여가·미디어·소통","word":"录","pinyin":"lù","meaning":"녹음하다, 기록하다","example":"采访前要征得同意，不能随意录下他人的谈话。","examplePinyin":"Cǎifǎng qián yào zhēngdé tóngyì, bùnéng suíyì lùxià tārén de tánhuà.","translation":"인터뷰 전에 동의를 받아야 하며 함부로 남의 말을 녹음하면 안 돼요."},{"no":927,"category":"여가·미디어·소통","word":"录音","pinyin":"lùyīn","meaning":"녹음하다, 녹음","example":"经过本人同意，这段录音被用于口述历史研究。","examplePinyin":"Jīngguò běnrén tóngyì, zhè duàn lùyīn bèi yòngyú kǒushù lìshǐ yánjiū.","translation":"본인 동의를 받아 이 녹음을 구술사 연구에 사용했어요."},{"no":928,"category":"여가·미디어·소통","word":"媒体","pinyin":"méitǐ","meaning":"미디어, 매체","example":"媒体报道公共事件时，应核实信息并保护个人隐私。","examplePinyin":"Méitǐ bàodào gōnggòng shìjiàn shí, yīng héshí xìnxī bìng bǎohù gèrén yǐnsī.","translation":"언론은 공적 사건을 보도할 때 정보를 확인하고 사생활을 보호해야 해요."},{"no":929,"category":"여가·미디어·소통","word":"拍摄","pinyin":"pāishè","meaning":"촬영하다, 찍다","example":"拍摄野生动物时，应保持距离，避免干扰它们。","examplePinyin":"Pāishè yěshēng dòngwù shí, yīng bǎochí jùlí, bìmiǎn gānrǎo tāmen.","translation":"야생 동물을 촬영할 때는 거리를 두어 방해하지 않아야 해요."},{"no":930,"category":"여가·미디어·소통","word":"屏幕","pinyin":"píngmù","meaning":"화면, 스크린","example":"屏幕上的文字太小，可以调整显示比例。","examplePinyin":"Píngmù shàng de wénzì tài xiǎo, kěyǐ tiáozhěng xiǎnshì bǐlì.","translation":"화면의 글씨가 너무 작으면 표시 비율을 조절할 수 있어요."},{"no":931,"category":"여가·미디어·소통","word":"平台","pinyin":"píngtái","meaning":"플랫폼, 단","example":"这个平台让小型剧团，也有机会接触更多观众。","examplePinyin":"Zhè ge píngtái ràng xiǎoxíng jùtuán, yě yǒu jīhuì jiēchù gèng duō guānzhòng.","translation":"이 플랫폼은 소규모 극단도 더 많은 관객을 만날 기회를 줘요."},{"no":932,"category":"여가·미디어·소통","word":"删","pinyin":"shān","meaning":"삭제하다, 지우다","example":"删掉重复资料之前，先确认有没有遗漏重要内容。","examplePinyin":"Shāndiào chóngfù zīliào zhīqián, xiān quèrèn yǒuméiyǒu yílòu zhòngyào nèiróng.","translation":"중복 자료를 지우기 전에 중요한 내용이 빠지지 않았는지 확인하세요."},{"no":933,"category":"여가·미디어·소통","word":"删除","pinyin":"shānchú","meaning":"삭제하다, 지우다","example":"涉及个人隐私的资料，用完后应按规定删除。","examplePinyin":"Shèjí gèrén yǐnsī de zīliào, yòng wán hòu yīng àn guīdìng shānchú.","translation":"개인 정보 자료는 사용 후 규정에 따라 삭제해야 해요."},{"no":934,"category":"여가·미디어·소통","word":"上传","pinyin":"shàngchuán","meaning":"업로드하다, 올리다","example":"上传照片之前，应征得照片中其他人的同意。","examplePinyin":"Shàngchuán zhàopiàn zhīqián, yīng zhēngdé zhàopiàn zhōng qítārén de tóngyì.","translation":"사진을 올리기 전에 사진에 나온 다른 사람들의 동의를 받아야 해요."},{"no":935,"category":"여가·미디어·소통","word":"收看","pinyin":"shōukàn","meaning":"시청하다, 보다","example":"不能到场的居民，也可以通过网络收看会议直播。","examplePinyin":"Bùnéng dàochǎng de jūmín, yě kěyǐ tōngguò wǎngluò shōukàn huìyì zhíbō.","translation":"현장에 못 오는 주민도 인터넷으로 회의 생중계를 볼 수 있어요."},{"no":936,"category":"여가·미디어·소통","word":"搜","pinyin":"sōu","meaning":"찾다, 검색하다","example":"搜资料时，关键词越准确，越容易找到相关内容。","examplePinyin":"Sōu zīliào shí, guānjiàncí yuè zhǔnquè, yuè róngyì zhǎodào xiāngguān nèiróng.","translation":"자료를 찾을 때는 검색어가 정확할수록 관련 내용을 찾기 쉬워요."},{"no":937,"category":"여가·미디어·소통","word":"搜索","pinyin":"sōusuǒ","meaning":"검색, 찾기","example":"搜索结果排在前面，并不一定代表信息更可靠。","examplePinyin":"Sōusuǒ jiéguǒ pái zài qiánmiàn, bìng bùyídìng dàibiǎo xìnxī gèng kěkào.","translation":"검색 결과가 앞에 나온다고 정보가 더 믿을 만한 것은 아니에요."},{"no":938,"category":"여가·미디어·소통","word":"退出","pinyin":"tuìchū","meaning":"물러나다, 탈퇴하다; 종료하다","example":"使用公共设备后，请退出个人账号并清理记录。","examplePinyin":"Shǐyòng gōnggòng shèbèi hòu, qǐng tuìchū gèrén zhànghào bìng qīnglǐ jìlù.","translation":"공용 기기를 쓴 뒤에는 개인 계정에서 나가고 기록을 지우세요."},{"no":939,"category":"여가·미디어·소통","word":"图书","pinyin":"túshū","meaning":"도서, 책","example":"图书捐赠活动，应重视实际需要，而不是只看数量。","examplePinyin":"Túshū juānzèng huódòng, yīng zhòngshì shíjì xūyào, ér búshì zhǐ kàn shùliàng.","translation":"도서 기증은 수량뿐 아니라 실제 필요를 중시해야 해요."},{"no":940,"category":"여가·미디어·소통","word":"网络","pinyin":"wǎngluò","meaning":"네트워크, 망","example":"网络扩大了信息来源，也增加了判断真假的难度。","examplePinyin":"Wǎngluò kuòdà le xìnxī láiyuán, yě zēngjiā le pànduàn zhēnjiǎ de nándù.","translation":"인터넷은 정보원을 넓히면서도 진위를 판단하기 어렵게 만들었어요."},{"no":941,"category":"여가·미디어·소통","word":"相册","pinyin":"xiàngcè","meaning":"사진첩, 앨범","example":"翻开旧相册，许多被遗忘的生活细节重新浮现。","examplePinyin":"Fānkāi jiù xiàngcè, xǔduō bèi yíwàng de shēnghuó xìjié chóngxīn fúxiàn.","translation":"옛 사진첩을 펴니 잊었던 일상의 세부 장면들이 다시 떠올랐어요."},{"no":942,"category":"여가·미디어·소통","word":"显示","pinyin":"xiǎnshì","meaning":"표시하다, 보여주다","example":"屏幕显示的信息与现场情况不符，需要检查系统。","examplePinyin":"Píngmù xiǎnshì de xìnxī yǔ xiànchǎng qíngkuàng bùfú, xūyào jiǎnchá xìtǒng.","translation":"화면의 정보가 현장과 맞지 않아 시스템을 점검해야 해요."},{"no":943,"category":"여가·미디어·소통","word":"下载","pinyin":"xiàzài","meaning":"다운로드, 내려받기","example":"下载文件之前，先确认网站来源是否可靠。","examplePinyin":"Xiàzài wénjiàn zhīqián, xiān quèrèn wǎngzhàn láiyuán shìfǒu kěkào.","translation":"파일을 내려받기 전에 사이트의 출처가 믿을 만한지 확인하세요."},{"no":944,"category":"여가·미디어·소통","word":"宣传","pinyin":"xuānchuán","meaning":"홍보하다, 선전","example":"宣传内容应与实际服务相符，不能夸大效果。","examplePinyin":"Xuānchuán nèiróng yīng yǔ shíjì fúwù xiāngfú, bùnéng kuādà xiàoguǒ.","translation":"홍보 내용은 실제 서비스와 맞아야 하며 효과를 과장해서는 안 돼요."},{"no":945,"category":"여가·미디어·소통","word":"影片","pinyin":"yǐngpiàn","meaning":"영화, 필름","example":"影片没有回避矛盾，而是让观众看到不同立场。","examplePinyin":"Yǐngpiàn méiyǒu huíbì máodùn, érshì ràng guānzhòng kàndào bùtóng lìchǎng.","translation":"영화는 갈등을 피하지 않고 관객에게 다양한 입장을 보여 줬어요."},{"no":946,"category":"여가·미디어·소통","word":"影视","pinyin":"yǐngshì","meaning":"영화와 텔레비전","example":"影视作品影响广泛，创作者应认真核实历史细节。","examplePinyin":"Yǐngshì zuòpǐn yǐngxiǎng guǎngfàn, chuàngzuòzhě yīng rènzhēn héshí lìshǐ xìjié.","translation":"영상 작품은 영향력이 크므로 창작자는 역사적 세부 사항을 확인해야 해요."},{"no":947,"category":"여가·미디어·소통","word":"音量","pinyin":"yīnliàng","meaning":"음량, 볼륨","example":"在公共区域播放音乐，应控制音量，避免影响他人。","examplePinyin":"Zài gōnggòng qūyù bōfàng yīnyuè, yīng kòngzhì yīnliàng, bìmiǎn yǐngxiǎng tārén.","translation":"공공장소에서 음악을 틀 때는 다른 사람에게 방해되지 않도록 음량을 조절하세요."},{"no":948,"category":"여가·미디어·소통","word":"印刷","pinyin":"yìnshuā","meaning":"인쇄; 인쇄하다","example":"印刷之前再次校对，可以减少纸张和费用的浪费。","examplePinyin":"Yìnshuā zhīqián zàicì jiàoduì, kěyǐ jiǎnshǎo zhǐzhāng hé fèiyòng de làngfèi.","translation":"인쇄 전에 교정하면 종이와 비용 낭비를 줄일 수 있어요."},{"no":949,"category":"여가·미디어·소통","word":"用户","pinyin":"yònghù","meaning":"사용자, 유저","example":"产品更新不能只增加功能，也要听取用户意见。","examplePinyin":"Chǎnpǐn gēngxīn bùnéng zhǐ zēngjiā gōngnéng, yě yào tīngqǔ yònghù yìjiàn.","translation":"제품을 갱신할 때는 기능 추가뿐 아니라 사용자 의견도 들어야 해요."},{"no":950,"category":"여가·미디어·소통","word":"在线","pinyin":"zàixiàn","meaning":"온라인의, 온라인으로","example":"在线服务应保留人工帮助，避免让不熟悉技术的人为难。","examplePinyin":"Zàixiàn fúwù yīng bǎoliú réngōng bāngzhù, bìmiǎn ràng bù shúxī jìshù de rén wéinán.","translation":"온라인 서비스에도 직원의 도움을 남겨 기술이 낯선 사람을 배려해야 해요."},{"no":951,"category":"여가·미디어·소통","word":"账号","pinyin":"zhànghào","meaning":"계정","example":"重要账号应使用不同密码，避免一次泄露影响全部。","examplePinyin":"Zhòngyào zhànghào yīng shǐyòng bùtóng mìmǎ, bìmiǎn yí cì xièlòu yǐngxiǎng quánbù.","translation":"중요한 계정은 한 번 유출돼도 모두 피해 보지 않도록 비밀번호를 달리해야 해요."},{"no":952,"category":"여가·미디어·소통","word":"展示","pinyin":"zhǎnshì","meaning":"전시하다, 보여주다","example":"展示成果时，也应说明研究中存在的局限。","examplePinyin":"Zhǎnshì chéngguǒ shí, yě yīng shuōmíng yánjiū zhōng cúnzài de júxiàn.","translation":"성과를 보여 줄 때는 연구에 존재하는 한계도 밝혀야 해요."},{"no":953,"category":"여가·미디어·소통","word":"展现","pinyin":"zhǎnxiàn","meaning":"나타내다, 보여주다","example":"这些照片展现了城市边缘地区容易被忽视的生活。","examplePinyin":"Zhèxiē zhàopiàn zhǎnxiàn le chéngshì biānyuán dìqū róngyì bèi hūshì de shēnghuó.","translation":"이 사진들은 소외되기 쉬운 도시 변두리의 삶을 보여 줘요."},{"no":954,"category":"여가·미디어·소통","word":"直播","pinyin":"zhíbō","meaning":"생방송, 라이브","example":"直播让更多人看到现场，也要求主持人核实信息。","examplePinyin":"Zhíbō ràng gèng duō rén kàndào xiànchǎng, yě yāoqiú zhǔchírén héshí xìnxī.","translation":"생중계는 현장을 널리 보여 주는 만큼 진행자의 정보 확인도 필요해요."},{"no":955,"category":"여가·미디어·소통","word":"注册","pinyin":"zhùcè","meaning":"등록하다, 등기","example":"注册账号时，只应填写服务所必需的信息。","examplePinyin":"Zhùcè zhànghào shí, zhǐ yīng tiánxiě fúwù suǒ bìxū de xìnxī.","translation":"계정에 가입할 때는 서비스에 꼭 필요한 정보만 입력해야 해요."},{"no":956,"category":"여가·미디어·소통","word":"拨打","pinyin":"bōdǎ","meaning":"걸다(전화), 누르다(다이얼)","example":"遇到紧急情况，请立即拨打当地救援电话。","examplePinyin":"Yùdào jǐnjí qíngkuàng, qǐng lìjí bōdǎ dāngdì jiùyuán diànhuà.","translation":"긴급 상황이 생기면 즉시 현지 구조 전화로 연락하세요."},{"no":957,"category":"여가·미디어·소통","word":"吵","pinyin":"chǎo","meaning":"시끄럽다, 떠들다; 말다툼하다","example":"与其吵个不停，不如坐下来讨论解决办法。","examplePinyin":"Yǔqí chǎo ge bùtíng, bùrú zuòxià lai tǎolùn jiějué bànfǎ.","translation":"끝없이 다투기보다 앉아서 해결 방법을 논의하는 게 나아요."},{"no":958,"category":"여가·미디어·소통","word":"称赞","pinyin":"chēngzàn","meaning":"칭찬하다, 기리다","example":"老师不仅称赞结果，也肯定学生坚持探索的精神。","examplePinyin":"Lǎoshī bùjǐn chēngzàn jiéguǒ, yě kěndìng xuésheng jiānchí tànsuǒ de jīngshén.","translation":"선생님은 결과뿐 아니라 꾸준히 탐구한 정신도 칭찬했어요."},{"no":959,"category":"여가·미디어·소통","word":"沉默","pinyin":"chénmò","meaning":"침묵하다, 조용하다","example":"面对尖锐的问题，发言人沉默片刻后作出回应。","examplePinyin":"Miànduì jiānruì de wèntí, fāyánrén chénmò piànkè hòu zuòchū huíyìng.","translation":"날카로운 질문에 대변인은 잠시 침묵한 뒤 답했어요."},{"no":960,"category":"여가·미디어·소통","word":"传","pinyin":"chuán","meaning":"전하다, 전달하다","example":"消息传到村里时，大家都主动赶来帮忙。","examplePinyin":"Xiāoxi chuándào cūnlǐ shí, dàjiā dōu zhǔdòng gǎnlái bāngmáng.","translation":"소식이 마을에 전해지자 모두 자발적으로 도우러 왔어요."},{"no":961,"category":"여가·미디어·소통","word":"传递","pinyin":"chuándì","meaning":"전달하다, 옮기다","example":"志愿者把物资一箱箱传递到山上的救援点。","examplePinyin":"Zhìyuànzhě bǎ wùzī yìxiāng xiāng chuándì dào shānshàng de jiùyuán diǎn.","translation":"자원봉사자들은 물자를 한 상자씩 산 위 구조 지점으로 전달했어요."},{"no":962,"category":"여가·미디어·소통","word":"催","pinyin":"cuī","meaning":"재촉하다, 독촉하다","example":"事情还没调查清楚，不能一再催他下结论。","examplePinyin":"Shìqing hái méi diàochá qīngchu, bùnéng yízài cuī tā xià jiélùn.","translation":"아직 조사가 끝나지 않았으니 결론을 내리라고 재촉하면 안 돼요."},{"no":963,"category":"여가·미디어·소통","word":"打断","pinyin":"dǎduàn","meaning":"끊다, 중단시키다; 말을 가로막다","example":"别人陈述观点时，不应随意打断对方的话。","examplePinyin":"Biéren chénshù guāndiǎn shí, bù yīng suíyì dǎduàn duìfāng de huà.","translation":"다른 사람이 의견을 말할 때는 함부로 말을 끊으면 안 돼요."},{"no":964,"category":"여가·미디어·소통","word":"打听","pinyin":"dǎting","meaning":"묻다, 캐묻다","example":"他向几位老居民打听，终于找到了故居的位置。","examplePinyin":"Tā xiàng jǐ wèi lǎo jūmín dǎting, zhōngyú zhǎodào le gùjū de wèizhi.","translation":"그는 오래 산 주민들에게 물어 마침내 옛집의 위치를 찾았어요."},{"no":965,"category":"여가·미디어·소통","word":"发表","pinyin":"fābiǎo","meaning":"발표하다, 공표하다","example":"发表意见之前，应先了解相关事实。","examplePinyin":"Fābiǎo yìjiàn zhīqián, yīng xiān liǎojiě xiāngguān shìshí.","translation":"의견을 발표하기 전에 관련 사실부터 알아야 해요."},{"no":966,"category":"여가·미디어·소통","word":"发言","pinyin":"fāyán","meaning":"발언하다, 연설하다","example":"发言时间有限，请先说最核心的观点。","examplePinyin":"Fāyán shíjiān yǒuxiàn, qǐng xiān shuō zuì héxīn de guāndiǎn.","translation":"발언 시간이 제한되어 있으니 핵심 의견부터 말씀해 주세요."},{"no":967,"category":"여가·미디어·소통","word":"分享","pinyin":"fēnxiǎng","meaning":"나누다, 공유하다","example":"主动分享经验，能让整个团队少走弯路。","examplePinyin":"Zhǔdòng fēnxiǎng jīngyàn, néng ràng zhěngge tuánduì shǎo zǒuwānlù.","translation":"경험을 적극 공유하면 팀 전체가 시행착오를 줄일 수 있어요."},{"no":968,"category":"여가·미디어·소통","word":"否认","pinyin":"fǒurèn","meaning":"부인하다, 인정하지 않다","example":"他没有否认自己的责任，而是提出了补救方案。","examplePinyin":"Tā méiyǒu fǒurèn zìjǐ de zérèn, érshì tíchū le bǔjiù fāng'àn.","translation":"그는 자기 책임을 부인하지 않고 수습 방안을 제시했어요."},{"no":969,"category":"여가·미디어·소통","word":"话题","pinyin":"huàtí","meaning":"화제, 이야깃거리","example":"他把话题引向共同关心的问题，气氛逐渐轻松。","examplePinyin":"Tā bǎ huàtí yǐnxiàng gòngtóng guānxīn de wèntí, qìfēn zhújiàn qīngsōng.","translation":"그가 공통 관심사로 화제를 돌리자 분위기가 차차 편안해졌어요."},{"no":970,"category":"여가·미디어·소통","word":"互动","pinyin":"hùdòng","meaning":"상호 작용, 인터랙션","example":"课堂互动不只是回答问题，也包括提出自己的疑惑。","examplePinyin":"Kètáng hùdòng bù zhǐshì huídá wèntí, yě bāokuò tíchū zìjǐ de yíhuò.","translation":"수업 중 상호 작용에는 답변뿐 아니라 질문도 포함돼요."},{"no":971,"category":"여가·미디어·소통","word":"讲话","pinyin":"jiǎnghuà","meaning":"말하다, 이야기하다; 연설, 훈시","example":"他在讲话中强调，安全始终是生产的前提。","examplePinyin":"Tā zài jiǎnghuà zhōng qiángdiào, ānquán shǐzhōng shì shēngchǎn de qiántí.","translation":"그는 연설에서 안전이 언제나 생산의 전제라고 강조했어요."},{"no":972,"category":"여가·미디어·소통","word":"讲述","pinyin":"jiǎngshù","meaning":"이야기하다, 서술하다","example":"老人通过亲身经历，讲述了这条河的变化。","examplePinyin":"Lǎorén tōngguò qīnshēn jīnglì, jiǎngshù le zhè tiáo hé de biànhuà.","translation":"노인은 자신의 경험으로 이 강의 변화를 이야기했어요."},{"no":973,"category":"여가·미디어·소통","word":"骂","pinyin":"mà","meaning":"욕하다, 꾸짖다","example":"孩子犯错时，耐心引导往往比一味骂他更有效。","examplePinyin":"Háizi fàncuò shí, nàixīn yǐndǎo wǎngwǎng bǐ yíwèi mà tā gèng yǒuxiào.","translation":"아이가 잘못했을 때는 꾸짖기만 하기보다 차분히 이끄는 게 효과적이에요."},{"no":974,"category":"여가·미디어·소통","word":"秘密","pinyin":"mìmì","meaning":"비밀, 은밀","example":"保护客户的商业秘密，是合作中的基本责任。","examplePinyin":"Bǎohù kèhù de shāngyè mìmì, shì hézuò zhōng de jīběn zérèn.","translation":"고객의 영업 비밀을 보호하는 것은 협력 관계의 기본 책임이에요."},{"no":975,"category":"여가·미디어·소통","word":"闹","pinyin":"nào","meaning":"시끄럽다, 소란하다","example":"遇到分歧别急着闹情绪，先把事实弄清楚。","examplePinyin":"Yùdào fēnqí bié jí zhe nàoqíngxù, xiān bǎ shìshí nòngqīngchu.","translation":"의견이 다르면 감정적으로 굴지 말고 먼저 사실부터 분명히 하세요."},{"no":976,"category":"여가·미디어·소통","word":"强调","pinyin":"qiángdiào","meaning":"강조하다","example":"他反复强调，记录失败与记录成功同样重要。","examplePinyin":"Tā fǎnfù qiángdiào, jìlù shībài yǔ jìlù chénggōng tóngyàng zhòngyào.","translation":"그는 실패를 기록하는 일도 성공 기록만큼 중요하다고 거듭 강조했어요."},{"no":977,"category":"여가·미디어·소통","word":"请求","pinyin":"qǐngqiú","meaning":"요청하다, 청구하다","example":"这项请求涉及其他人的权益，需要谨慎处理。","examplePinyin":"Zhè xiàng qǐngqiú shèjí qítārén de quányì, xūyào jǐnshèn chǔlǐ.","translation":"이 요청은 다른 사람의 권익과 관련돼 신중히 처리해야 해요."},{"no":978,"category":"여가·미디어·소통","word":"劝","pinyin":"quàn","meaning":"권고하다, 충고하다","example":"他劝朋友先查清事实，不要急着转发消息。","examplePinyin":"Tā quàn péngyou xiān cháqīng shìshí, búyào jí zhe zhuǎnfā xiāoxi.","translation":"그는 친구에게 메시지를 급히 공유하지 말고 사실부터 확인하라고 권했어요."},{"no":979,"category":"여가·미디어·소통","word":"说服","pinyin":"shuōfú","meaning":"설득하다, 납득시키다","example":"要说服别人，不能只重复结论，还要解释依据。","examplePinyin":"Yào shuōfú biéren, bùnéng zhǐ chóngfù jiélùn, hái yào jiěshì yījù.","translation":"남을 설득하려면 결론을 반복하지 말고 근거도 설명해야 해요."},{"no":980,"category":"여가·미디어·소통","word":"谈话","pinyin":"tánhuà","meaning":"대화, 이야기","example":"这次谈话没有急着下结论，而是先确认双方需求。","examplePinyin":"Zhè cì tánhuà méiyǒu jí zhe xià jiélùn, érshì xiān quèrèn shuāngfāng xūqiú.","translation":"이번 대화는 결론을 서두르지 않고 양측의 요구부터 확인했어요."},{"no":981,"category":"여가·미디어·소통","word":"提倡","pinyin":"tíchàng","meaning":"제창하다, 주장하다","example":"学校提倡步行上学，同时改善周边道路的安全。","examplePinyin":"Xuéxiào tíchàng bùxíng shàngxué, tóngshí gǎishàn zhōubiān dàolù de ānquán.","translation":"학교는 도보 통학을 권장하며 주변 도로의 안전도 개선해요."},{"no":982,"category":"여가·미디어·소통","word":"提起","pinyin":"tíqǐ","meaning":"꺼내다(이야기 등을); 제기하다; 들어 올리다","example":"提起故乡的小河，老人脸上露出了熟悉的笑容。","examplePinyin":"Tíqǐ gùxiāng de xiǎohé, lǎorén liǎnshàng lùchū le shúxī de xiàoróng.","translation":"고향의 작은 강 이야기가 나오자 노인은 익숙한 미소를 지었어요."},{"no":983,"category":"여가·미디어·소통","word":"推荐","pinyin":"tuījiàn","meaning":"추천하다, 권하다","example":"推荐书籍时，应先了解读者的兴趣和阅读经验。","examplePinyin":"Tuījiàn shūjí shí, yīng xiān liǎojiě dúzhě de xìngqù hé yuèdú jīngyàn.","translation":"책을 추천할 때는 독자의 관심과 독서 경험부터 알아야 해요."},{"no":984,"category":"여가·미디어·소통","word":"宣布","pinyin":"xuānbù","meaning":"선언하다, 공포하다","example":"主办方宣布延期后，及时提供了退票办法。","examplePinyin":"Zhǔbànfāng xuānbù yánqī hòu, jíshí tígōng le tuìpiào bànfǎ.","translation":"주최 측은 연기를 발표한 뒤 신속히 환불 방법을 안내했어요."},{"no":985,"category":"여가·미디어·소통","word":"询问","pinyin":"xúnwèn","meaning":"묻다, 질문하다","example":"询问个人经历之前，应先说明调查的目的。","examplePinyin":"Xúnwèn gèrén jīnglì zhīqián, yīng xiān shuōmíng diàochá de mùdì.","translation":"개인 경험을 묻기 전에 조사의 목적부터 설명해야 해요."},{"no":986,"category":"여가·미디어·소통","word":"演讲","pinyin":"yǎnjiǎng","meaning":"연설, 강연","example":"演讲打动听众，靠的不只是语言，还有真实经历。","examplePinyin":"Yǎnjiǎng dǎdòng tīngzhòng, kào de bù zhǐshì yǔyán, háiyǒu zhēnshí jīnglì.","translation":"연설이 청중을 움직이는 데는 말뿐 아니라 실제 경험도 필요해요."},{"no":987,"category":"여가·미디어·소통","word":"邮寄","pinyin":"yóujì","meaning":"우편으로 보내다, 우송","example":"申请材料既可以邮寄，也可以通过线上系统提交。","examplePinyin":"Shēnqǐng cáiliào jì kěyǐ yóujì, yě kěyǐ tōngguò xiàn shàng xìtǒng tíjiāo.","translation":"신청 자료는 우편이나 온라인 시스템으로 제출할 수 있어요."},{"no":988,"category":"여가·미디어·소통","word":"邮局","pinyin":"yóujú","meaning":"우체국, 우편국","example":"偏远村庄的邮局，也承担着联系外界的重要作用。","examplePinyin":"Piānyuǎn cūnzhuāng de yóujú, yě chéngdān zhe liánxì wàijiè de zhòngyào zuòyòng.","translation":"외딴 마을의 우체국은 외부와 연결하는 중요한 역할도 맡아요."},{"no":989,"category":"여가·미디어·소통","word":"邮票","pinyin":"yóupiào","meaning":"우표","example":"这些旧邮票记录了当时的社会生活和审美趣味。","examplePinyin":"Zhèxiē jiù yóupiào jìlù le dāngshí de shèhuì shēnghuó hé shěnměi qùwèi.","translation":"이 옛 우표들은 당시의 사회생활과 미적 취향을 기록해요."},{"no":990,"category":"여가·미디어·소통","word":"语气","pinyin":"yǔqì","meaning":"어조, 말투","example":"同样一句话，语气不同，给人的感受也会不同。","examplePinyin":"Tóngyàng yí jù huà, yǔqì bùtóng, gěi rén de gǎnshòu yě huì bùtóng.","translation":"같은 말도 어조에 따라 받는 느낌이 달라져요."},{"no":991,"category":"여가·미디어·소통","word":"占线","pinyin":"zhànxiàn","meaning":"통화 중이다, 회선이 사용 중이다","example":"服务电话一直占线，他便选择在网上提交问题。","examplePinyin":"Fúwù diànhuà yìzhí zhànxiàn, tā biàn xuǎnzé zài wǎngshàng tíjiāo wèntí.","translation":"문의 전화가 계속 통화 중이라 그는 인터넷으로 문제를 제출했어요."},{"no":992,"category":"여가·미디어·소통","word":"争","pinyin":"zhēng","meaning":"다투다, 싸우다","example":"不必事事争个输赢，解决问题才是讨论的目的。","examplePinyin":"Búbì shìshì zhēng ge shūyíng, jiějué wèntí cái shì tǎolùn de mùdì.","translation":"모든 일에 승패를 따질 필요는 없으며 토론의 목적은 문제 해결이에요."},{"no":993,"category":"여가·미디어·소통","word":"转告","pinyin":"zhuǎngào","meaning":"전하다, 알리다","example":"如果负责人不在，请帮我转告会议时间已经调整。","examplePinyin":"Rúguǒ fùzérén búzài, qǐng bāng wǒ zhuǎngào huìyì shíjiān yǐjīng tiáozhěng.","translation":"책임자가 없으면 회의 시간이 바뀌었다고 전해 주세요."},{"no":994,"category":"여가·미디어·소통","word":"闭幕式","pinyin":"bìmùshì","meaning":"폐막식","example":"闭幕式结束后，志愿者仍留下来整理场地。","examplePinyin":"Bìmùshì jiéshù hòu, zhìyuànzhě réng liúxiàlai zhěnglǐ chǎngdì.","translation":"폐막식이 끝난 뒤에도 자원봉사자들은 남아 행사장을 정리했어요."},{"no":995,"category":"여가·미디어·소통","word":"出席","pinyin":"chūxí","meaning":"출석하다, 참석하다","example":"由于天气原因，部分代表改为通过视频出席会议。","examplePinyin":"Yóuyú tiānqì yuányīn, bùfen dàibiǎo gǎiwéi tōngguò shìpín chūxí huìyì.","translation":"날씨 때문에 일부 대표는 화상으로 회의에 참석했어요."},{"no":996,"category":"여가·미디어·소통","word":"大会","pinyin":"dàhuì","meaning":"대회, 총회","example":"大会通过了新的章程，明确了各部门的职责。","examplePinyin":"Dàhuì tōngguò le xīn de zhāngchéng, míngquè le gè bùmén de zhízé.","translation":"총회는 새 정관을 통과시켜 부서별 책임을 명확히 했어요."},{"no":997,"category":"여가·미디어·소통","word":"鼓掌","pinyin":"gǔzhǎng","meaning":"박수치다, 갈채","example":"观众起立鼓掌，向坚持完成演出的演员致敬。","examplePinyin":"Guānzhòng qǐlì gǔzhǎng, xiàng jiānchí wánchéng yǎnchū de yǎnyuán zhìjìng.","translation":"관객들은 일어나 박수를 치며 공연을 끝까지 마친 배우에게 경의를 표했어요."},{"no":998,"category":"여가·미디어·소통","word":"合影","pinyin":"héyǐng","meaning":"함께 사진을 찍다; 단체 사진","example":"活动结束后，大家在修复后的古桥前合影留念。","examplePinyin":"Huódòng jiéshù hòu, dàjiā zài xiūfù hòu de gǔqiáo qián héyǐng liúniàn.","translation":"행사를 마친 뒤 모두 복원한 옛 다리 앞에서 기념사진을 찍었어요."},{"no":999,"category":"여가·미디어·소통","word":"户外","pinyin":"hùwài","meaning":"야외, 실외","example":"户外活动前，应了解天气并准备必要的装备。","examplePinyin":"Hùwài huódòng qián, yīng liǎojiě tiānqì bìng zhǔnbèi bìyào de zhuāngbèi.","translation":"야외 활동 전에 날씨를 알아보고 필요한 장비를 준비해야 해요."},{"no":1000,"category":"여가·미디어·소통","word":"纪念","pinyin":"jìniàn","meaning":"기념하다, 기념","example":"这座小馆通过照片，纪念参与修桥的普通工人。","examplePinyin":"Zhè zuò xiǎo guǎn tōngguò zhàopiàn, jìniàn cānyù xiū qiáo de pǔtōng gōngrén.","translation":"이 작은 전시관은 사진으로 다리 건설에 참여한 평범한 노동자들을 기려요."},{"no":1001,"category":"여가·미디어·소통","word":"酒吧","pinyin":"jiǔbā","meaning":"술집, 바","example":"这家酒吧每周安排现场演出，支持本地乐队。","examplePinyin":"Zhè jiā jiǔbā měi zhōu ānpái xiànchǎng yǎnchū, zhīchí běndì yuèduì.","translation":"이 바는 현지 밴드를 지원하기 위해 매주 라이브 공연을 마련해요."},{"no":1002,"category":"여가·미디어·소통","word":"开幕","pinyin":"kāimù","meaning":"개막하다, 시작","example":"展览开幕之前，工作人员反复检查了所有设备。","examplePinyin":"Zhǎnlǎn kāimù zhīqián, gōngzuò rényuán fǎnfù jiǎnchá le suǒyǒu shèbèi.","translation":"전시 개막 전에 직원들이 모든 장비를 거듭 점검했어요."},{"no":1003,"category":"여가·미디어·소통","word":"开幕式","pinyin":"kāimùshì","meaning":"개막식, 오프닝","example":"开幕式没有铺张的场面，却体现出鲜明的地方特色。","examplePinyin":"Kāimùshì méiyǒu pūzhāng de chǎngmiàn, què tǐxiàn chū xiānmíng de dìfāng tèsè.","translation":"개막식은 호화롭지 않았지만 뚜렷한 지역 특색을 보여 줬어요."},{"no":1004,"category":"여가·미디어·소통","word":"气球","pinyin":"qìqiú","meaning":"풍선, 기구","example":"活动结束后，志愿者把散落的气球逐一收好。","examplePinyin":"Huódòng jiéshù hòu, zhìyuànzhě bǎ sànluò de qìqiú zhúyì shōu hǎo.","translation":"행사가 끝난 뒤 자원봉사자들이 흩어진 풍선을 하나씩 거뒀어요."},{"no":1005,"category":"여가·미디어·소통","word":"赏","pinyin":"shǎng","meaning":"감상하다, 주다","example":"春日赏花时，请沿着步道走，不要踩进花田。","examplePinyin":"Chūnrì shǎnghuā shí, qǐng yánzhe bùdào zǒu, búyào cǎi jìn huā tián.","translation":"봄꽃을 감상할 때는 꽃밭을 밟지 말고 산책로로 다니세요."},{"no":1006,"category":"여가·미디어·소통","word":"休闲","pinyin":"xiūxián","meaning":"레저, 여가","example":"适当安排休闲活动，有助于恢复工作后的精力。","examplePinyin":"Shìdàng ānpái xiūxián huódòng, yǒuzhùyú huīfù gōngzuò hòu de jīnglì.","translation":"여가 활동을 적절히 하면 일한 뒤의 기력을 회복하는 데 도움이 돼요."},{"no":1007,"category":"여가·미디어·소통","word":"业余","pinyin":"yèyú","meaning":"아마추어, 여가","example":"他利用业余时间学习修理，渐渐掌握了实用技能。","examplePinyin":"Tā lìyòng y
