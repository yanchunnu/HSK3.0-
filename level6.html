<!doctype html>

<head>

  <style>
    :root { --blue:#245eb4; --deep:#102a43; --line:#d5e3f5; --soft:#f1f6fe; --accent:#dceaff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#f5f9ff; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .gradeLinks { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:9px; font-size:13px; }
    .gradeLinks a {color:var(--blue); font-weight:700; text-underline-offset:3px;}
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f1f6fe; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#dceaff; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #3576cd; background:#f1f6ff; box-shadow:0 0 0 5px #3576cd1c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#caddfa; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>

<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"榜样","pinyin":"bǎngyàng","meaning":"본보기, 모범","example":"他就是我们学习的榜样，大家都很佩服他。","examplePinyin":"Tā jiùshì wǒmen xuéxí de bǎngyàng, dàjiā dōu hěn pèifú tā.","translation":"그는 우리가 배울 수 있는 롤모델이고 모두가 그를 존경합니다.","sourceNo":3619},{"no":2,"category":"인사·사람·대명사","word":"称号","pinyin":"chēnghào","meaning":"칭호, 호칭","example":"他的称号是“劳动模范”，是大家学习的榜样。","examplePinyin":"Tā de chēnghào shì “ láodòng mófàn ”, shì dàjiā xuéxí de bǎngyàng.","translation":"그의 직함은 \"모범 노동자\"이며 모든 사람이 배울 수 있는 모범입니다.","sourceNo":3756},{"no":3,"category":"인사·사람·대명사","word":"称呼","pinyin":"chēnghu","meaning":"부르다, 칭하다","example":"在中国，称呼别人要用尊称。","examplePinyin":"Zài Zhōngguó, chēnghu biéren yào yòng zūnchēng.","translation":"중국에서는 다른 사람을 존댓말로 불러야 합니다.","sourceNo":3757},{"no":4,"category":"인사·사람·대명사","word":"大伙儿","pinyin":"dàhuǒr","meaning":"모두들, 모든사람","example":"大伙儿一起努力，一定能完成这项任务。","examplePinyin":"Dàhuǒr yìqǐ nǔlì, yídìng néng wánchéng zhè xiàng rènwu.","translation":"우리 모두가 함께 노력한다면 우리는 이 일을 완수할 수 있을 것입니다.","sourceNo":3843},{"no":5,"category":"인사·사람·대명사","word":"大师","pinyin":"dàshī","meaning":"대가, 스승","example":"他是一位国画大师，作品很有名。","examplePinyin":"Tā shì yí wèi guóhuà dàshī, zuòpǐn hěn yǒumíng.","translation":"그는 중국 전통 회화의 대가이며 그의 작품은 매우 유명합니다.","sourceNo":3877},{"no":6,"category":"인사·사람·대명사","word":"夫人","pinyin":"fūrén","meaning":"부인, 아내","example":"他是一位受人尊敬的学者，他夫人也是一位教授。","examplePinyin":"Tā shì yí wèi shòu rén zūnjìng de xuézhě, tā fūrén yě shì yí wèi jiàoshòu.","translation":"그는 존경받는 학자이고 그의 아내도 교수입니다.","sourceNo":4008},{"no":7,"category":"인사·사람·대명사","word":"高手","pinyin":"gāoshǒu","meaning":"고수, 전문가","example":"他是围棋界的一位高手，从未输过。","examplePinyin":"Tā shì wéiqíjiè de yí wèi gāoshǒu, cóngwèi shū guo.","translation":"그는 바둑의 달인이고 한 번도 진 적이 없습니다.","sourceNo":4037},{"no":8,"category":"인사·사람·대명사","word":"个体","pinyin":"gètǐ","meaning":"개인, 개체","example":"我们在研究这个问题时，要考虑到个体差异。","examplePinyin":"Wǒmen zài yánjiū zhè ge wèntí shí, yào kǎolǜ dào gètǐ chāyì.","translation":"이 문제를 연구할 때 개인차를 고려해야 합니다.","sourceNo":4048},{"no":9,"category":"인사·사람·대명사","word":"公众","pinyin":"gōngzhòng","meaning":"공중, 대중","example":"公众对这件事情的看法各有不同。","examplePinyin":"Gōngzhòng duì zhè jiàn shìqing de kànfǎ gè yǒu bùtóng.","translation":"이 문제에 대한 여론은 다양했습니다.","sourceNo":4068},{"no":10,"category":"인사·사람·대명사","word":"公主","pinyin":"gōngzhǔ","meaning":"공주, 공주","example":"她是这个国家受人爱戴的公主。","examplePinyin":"Tā shì zhè ge guójiā shòu rén àidài de gōngzhǔ.","translation":"그녀는 이 나라의 사랑받는 공주입니다.","sourceNo":4069},{"no":11,"category":"인사·사람·대명사","word":"国王","pinyin":"guówáng","meaning":"국왕","example":"从前有一个国王统治着这片土地。","examplePinyin":"Cóngqián yǒu yí ge guówáng tǒngzhì zhe zhè piàn tǔdì.","translation":"옛날에 이 땅을 다스리는 왕이 있었습니다.","sourceNo":4107},{"no":12,"category":"인사·사람·대명사","word":"古人","pinyin":"gǔrén","meaning":"옛사람","example":"古人虽然生活简朴，却很有智慧。","examplePinyin":"Gǔrén suīrán shēnghuó jiǎnpiáo, què hěn yǒu zhìhuì.","translation":"고대인들은 단순한 삶을 살았지만 매우 현명했습니다.","sourceNo":4109},{"no":13,"category":"인사·사람·대명사","word":"顾问","pinyin":"gùwèn","meaning":"고문","example":"他是这家公司请来的法律顾问。","examplePinyin":"Tā shì zhè jiā gōngsī qǐnglái de fǎlǜ gùwèn.","translation":"그는 회사에서 고용한 법률 고문입니다.","sourceNo":4113},{"no":14,"category":"인사·사람·대명사","word":"嘿","pinyin":"hēi","meaning":"어이(감탄사)","example":"嘿，你怎么这么早就来上班了？","examplePinyin":"Hēi, nǐ zěnme zhème zǎojiù lái shàngbān le?","translation":"어이, 오늘은 왜 이렇게 일찍 출근했어요?","sourceNo":4139},{"no":15,"category":"인사·사람·대명사","word":"后人","pinyin":"hòurén","meaning":"후세 사람","example":"后人会永远铭记他做出的贡献。","examplePinyin":"Hòurén huì yǒngyuǎn míngjì tā zuòchū de gòngxiàn.","translation":"미래 세대는 그의 공헌을 항상 기억할 것입니다.","sourceNo":4153},{"no":16,"category":"인사·사람·대명사","word":"后者","pinyin":"hòuzhě","meaning":"후자","example":"相比之下，前者比后者更加容易。","examplePinyin":"Xiāngbǐ zhīxià, qiánzhě bǐ hòuzhě gèngjiā róngyì.","translation":"그에 비해 전자가 후자보다 쉽습니다.","sourceNo":4155},{"no":17,"category":"인사·사람·대명사","word":"军人","pinyin":"jūnrén","meaning":"군인","example":"他的父亲是一名光荣的军人。","examplePinyin":"Tā de fùqīn shì yì míng guāngróng de jūnrén.","translation":"그의 아버지는 명예로운 군인이었습니다.","sourceNo":4357},{"no":18,"category":"인사·사람·대명사","word":"老太太","pinyin":"lǎotàitai","meaning":"할머니(노부인)","example":"那位白发老太太每天都来公园散步。","examplePinyin":"Nà wèi báifà lǎotàitai měi tiān dōu lái gōngyuán sànbù.","translation":"백발의 노부인은 매일 공원에 산책하러 온다.","sourceNo":4426},{"no":19,"category":"인사·사람·대명사","word":"盲人","pinyin":"mángrén","meaning":"시각장애인","example":"这条盲道是专门为盲人设计的。","examplePinyin":"Zhè tiáo máng dào shì zhuānmén wèi mángrén shèjì de.","translation":"이 점자 보도는 시각장애인을 위해 만들어졌어요.","sourceNo":4489},{"no":20,"category":"인사·사람·대명사","word":"母","pinyin":"mǔ","meaning":"어머니; 모체; 암컷","example":"每年校庆，他都会回到母校参加活动。","examplePinyin":"Měi nián xiàoqìng, tā dōu huì huídào mǔxiào cānjiā huódòng.","translation":"매년 개교기념일이 되면 그는 모교로 돌아가 활동에 참여하곤 했습니다.","sourceNo":4537},{"no":21,"category":"인사·사람·대명사","word":"偶像","pinyin":"ǒuxiàng","meaning":"우상, 아이돌","example":"这位歌手是很多年轻人心中的偶像。","examplePinyin":"Zhè wèi gēshǒu shì hěn duō niánqīngrén xīnzhōng de ǒuxiàng.","translation":"가수는 많은 젊은이들의 우상이다.","sourceNo":4565},{"no":22,"category":"인사·사람·대명사","word":"骗子","pinyin":"piànzi","meaning":"사기꾼","example":"大家都要提高警惕，小心遇到骗子。","examplePinyin":"Dàjiā dōu yào tígāo jǐngtì, xiǎoxīn yùdào piànzi.","translation":"다들 조심하시고 사기꾼을 조심하셔야 합니다.","sourceNo":4588},{"no":23,"category":"인사·사람·대명사","word":"前者","pinyin":"qiánzhě","meaning":"전자","example":"相比之下，前者的方案更加合理。","examplePinyin":"Xiāngbǐ zhīxià, qiánzhě de fāng'àn gèngjiā hélǐ.","translation":"이에 비해 전자의 솔루션이 더 합리적입니다.","sourceNo":4626},{"no":24,"category":"인사·사람·대명사","word":"群众","pinyin":"qúnzhòng","meaning":"대중, 군중","example":"干部应该时刻把群众的利益放在心上。","examplePinyin":"Gànbù yīnggāi shíkè bǎ qúnzhòng de lìyì fàng zài xīn shàng.","translation":"간부는 항상 대중의 이익을 마음에 두어야 합니다.","sourceNo":4684},{"no":25,"category":"인사·사람·대명사","word":"人家","pinyin":"rénjia","meaning":"남, 다른 사람","example":"你不要总是拿自己和人家比较。","examplePinyin":"Nǐ búyào zǒngshì ná zìjǐ hé rénjia bǐjiào.","translation":"항상 자신을 다른 사람과 비교하지 마십시오.","sourceNo":4695},{"no":26,"category":"인사·사람·대명사","word":"人士","pinyin":"rénshì","meaning":"인사","example":"这场慈善晚宴邀请了不少社会知名人士。","examplePinyin":"Zhè chǎng císhàn wǎnyàn yāoqǐng le bùshǎo shèhuì zhīmíng rénshì.","translation":"이번 자선 만찬에는 사회의 많은 유명 인사들이 초대되었습니다.","sourceNo":4699},{"no":27,"category":"인사·사람·대명사","word":"少儿","pinyin":"shào'ér","meaning":"아동, 어린이","example":"这个电视台专门开设了一档少儿节目。","examplePinyin":"Zhè ge diànshìtái zhuānmén kāishè le yídàng shào'ér jiémù.","translation":"이 TV 방송국에는 어린이를 위한 특별 프로그램이 있습니다.","sourceNo":4753},{"no":28,"category":"인사·사람·대명사","word":"师父","pinyin":"shīfu","meaning":"사부님","example":"他跟随师父学习传统武术多年。","examplePinyin":"Tā gēnsuí shīfu xuéxí chuántǒng wǔshù duōnián.","translation":"그는 수년 동안 스승과 함께 전통 무술을 공부해 왔습니다.","sourceNo":4785},{"no":29,"category":"인사·사람·대명사","word":"天才","pinyin":"tiāncái","meaning":"천재","example":"他从小展现出惊人的音乐天才。","examplePinyin":"Tā cóngxiǎo zhǎnxiànchū jīngrén de yīnyuè tiāncái.","translation":"그는 어린 시절부터 놀라운 음악적 재능을 보여주었습니다.","sourceNo":4883},{"no":30,"category":"인사·사람·대명사","word":"同伴","pinyin":"tóngbàn","meaning":"동반자, 동료","example":"他和几位同伴一起结伴出游探险。","examplePinyin":"Tā hé jǐ wèi tóngbàn yìqǐ jiébàn chūyóu tànxiǎn.","translation":"그는 여러 동료들과 함께 모험을 떠났습니다.","sourceNo":4904},{"no":31,"category":"인사·사람·대명사","word":"徒弟","pinyin":"túdì","meaning":"제자","example":"老师傅收了一个年轻聪明的徒弟。","examplePinyin":"Lǎoshīfu shōu le yí ge niánqīng cōngming de túdì.","translation":"늙은 스승은 젊고 똑똑한 견습생을 받아들였습니다.","sourceNo":4933},{"no":32,"category":"인사·사람·대명사","word":"哇","pinyin":"wā","meaning":"와!(감탄사)","example":"哇，这里的风景真是太美了！","examplePinyin":"Wā, zhèlǐ de fēngjǐng zhēnshìtài měi le!","translation":"와, 이곳 풍경은 정말 아름답네요!","sourceNo":4948},{"no":33,"category":"인사·사람·대명사","word":"王子","pinyin":"wángzǐ","meaning":"왕자","example":"童话故事里，王子最终娶了公主。","examplePinyin":"Tónghuà gùshi lǐ, wángzǐ zuìzhōng qǔ le gōngzhǔ.","translation":"동화에서는 왕자가 결국 공주와 결혼하게 됩니다.","sourceNo":4961},{"no":34,"category":"인사·사람·대명사","word":"未成年人","pinyin":"wèichéng niánrén","meaning":"미성년자","example":"商家不得向未成年人出售烟酒。","examplePinyin":"Shāngjiā bùdé xiàng wèichéngniánrén chūshòu yānjiǔ.","translation":"판매자는 미성년자에게 담배나 술을 판매할 수 없습니다.","sourceNo":4968},{"no":35,"category":"인사·사람·대명사","word":"小偷儿","pinyin":"xiǎotōur","meaning":"도둑","example":"警察终于抓住了那个惯犯小偷儿。","examplePinyin":"Jǐngchá zhōngyú zhuāzhù le nà ge guànfàn xiǎotōur.","translation":"경찰은 마침내 상습 도둑을 잡았습니다.","sourceNo":5040},{"no":36,"category":"인사·사람·대명사","word":"学员","pinyin":"xuéyuán","meaning":"학원생, 훈련생","example":"这个培训班一共招收了三十名学员。","examplePinyin":"Zhè ge péixùnbān yígòng zhāoshōu le sānshí míng xuéyuán.","translation":"이번 교육과정에는 총 30명의 학생이 등록되었습니다.","sourceNo":5094},{"no":37,"category":"인사·사람·대명사","word":"婴儿","pinyin":"yīng'ér","meaning":"영아, 아기","example":"新生婴儿需要精心的护理照顾。","examplePinyin":"Xīnshēng yīng'ér xūyào jīngxīn de hùlǐ zhàogu.","translation":"신생아에게는 세심한 간호가 필요합니다.","sourceNo":5164},{"no":38,"category":"인사·사람·대명사","word":"英雄","pinyin":"yīngxióng","meaning":"영웅","example":"他在关键时刻挺身而出成为英雄。","examplePinyin":"Tā zài guānjiàn shíkè tǐngshēn ér chū chéngwéi yīngxióng.","translation":"그는 결정적인 순간에 일어서서 영웅이 되었습니다.","sourceNo":5165},{"no":39,"category":"인사·사람·대명사","word":"艺人","pinyin":"yìrén","meaning":"연예인","example":"这位年轻艺人在演艺圈很受欢迎。","examplePinyin":"Zhè wèi niánqīng yìrén zài yǎnyìquān hěn shòuhuānyíng.","translation":"젊은 예술가는 연예계에서 매우 인기가 높습니다.","sourceNo":5173},{"no":40,"category":"인사·사람·대명사","word":"游人","pinyin":"yóurén","meaning":"여행객, 관광객","example":"假期期间，景区里挤满了游人。","examplePinyin":"Jiàqī qījiān, jǐngqū lǐ jǐmǎn le yóurén.","translation":"연휴 기간에는 명승지가 관광객으로 붐빈다.","sourceNo":5201},{"no":41,"category":"인사·사람·대명사","word":"众人","pinyin":"zhòngrén","meaning":"많은 사람들","example":"他在众人面前发表了一场精彩演讲。","examplePinyin":"Tā zài zhòngrén miànqián fābiǎo le yì chǎng jīngcǎi yǎnjiǎng.","translation":"그는 모든 사람 앞에서 훌륭한 연설을 했습니다.","sourceNo":5328},{"no":42,"category":"인사·사람·대명사","word":"主播","pinyin":"zhǔbō","meaning":"진행자, 앵커","example":"她是这家电视台的著名新闻主播。","examplePinyin":"Tā shì zhè jiā diànshìtái de zhùmíng xīnwén zhǔbō.","translation":"그녀는 이 TV 방송국의 유명한 뉴스 앵커입니다.","sourceNo":5359},{"no":43,"category":"인사·사람·대명사","word":"主角","pinyin":"zhǔjué","meaning":"주인공","example":"她凭借出色表演成为这部剧的主角。","examplePinyin":"Tā píngjiè chūsè biǎoyǎn chéngwéi zhè bù jù de zhǔjué.","translation":"그녀는 뛰어난 연기력으로 쇼의 주인공이 됐다.","sourceNo":5365},{"no":44,"category":"인사·사람·대명사","word":"主演","pinyin":"zhǔyǎn","meaning":"주연하다 / 주연","example":"这部电影由一位知名演员主演。","examplePinyin":"Zhè bù diànyǐng yóu yí wèi zhīmíng yǎnyuán zhǔyǎn.","translation":"영화에는 유명한 배우가 출연한다.","sourceNo":5370},{"no":45,"category":"인사·사람·대명사","word":"总裁","pinyin":"zǒngcái","meaning":"총재, 사장","example":"他多年后终于成为公司的总裁。","examplePinyin":"Tā duōnián hòu zhōngyú chéngwéi gōngsī de zǒngcái.","translation":"몇 년 후 그는 마침내 회사의 사장이 되었습니다.","sourceNo":5386},{"no":46,"category":"인사·사람·대명사","word":"总理","pinyin":"zǒnglǐ","meaning":"총리","example":"国家总理出席了这次重要的会议。","examplePinyin":"Guójiā zǒnglǐ chūxí le zhè cì zhòngyào de huìyì.","translation":"이 중요한 회의에는 국가 총리가 참석했습니다.","sourceNo":5388},{"no":47,"category":"가족·관계","word":"拜访","pinyin":"bàifǎng","meaning":"방문하다, 찾아가다","example":"他打算明天去拜访他的大学老师。","examplePinyin":"Tā dǎsuàn míngtiān qù bàifǎng tā de dàxué lǎoshī.","translation":"그는 내일 대학 선생님을 방문할 계획이다.","sourceNo":3609},{"no":48,"category":"가족·관계","word":"拜年","pinyin":"bàinián","meaning":"새해 인사, 세배","example":"大年初一，他挨家挨户地拜年。","examplePinyin":"Dà nián chūyī, tā āijiā āihù de bàinián.","translation":"설날에는 집집마다 돌아다니며 새해 인사를 했습니다.","sourceNo":3614},{"no":49,"category":"가족·관계","word":"吵架","pinyin":"chǎojià","meaning":"다투다, 언쟁","example":"他们因为一些小事在吵架，声音很大。","examplePinyin":"Tāmen yīnwèi yìxiē xiǎoshì zài chǎojià, shēngyīn hěn dà.","translation":"그들은 사소한 문제로 큰 소리로 논쟁을 벌이고 있었습니다.","sourceNo":3740},{"no":50,"category":"가족·관계","word":"打交道","pinyin":"dǎ jiāodao","meaning":"교섭하다, 접촉하다","example":"做生意，难免要和各种各样的人打交道。","examplePinyin":"Zuò shēngyi, nánmiǎn yào hé gèzhǒng gèyàng de rén dǎjiāodao.","translation":"사업을 하다 보면 필연적으로 ,"meaning":"결혼, 혼인","example":"他们结婚多年，婚姻生活一直很幸福。","examplePinyin":"Tāmen jiéhūn duōnián, hūnyīn shēnghuó yìzhí hěn xìngfú.","translation":"두 사람은 결혼한 지 오래되었으며 줄곧 행복하게 지내요.","sourceNo":4193},{"no":60,"category":"가족·관계","word":"互助","pinyin":"hùzhù","meaning":"서로 돕다","example":"同学们组成互助小组，一起解决学习上的困难。","examplePinyin":"Tóngxuémen zǔchéng hùzhù xiǎozǔ, yìqǐ jiějué xuéxí shàng de kùnnan.","translation":"학생들은 서로 돕는 모둠을 만들어 학습상의 어려움을 함께 해결해요.","sourceNo":4200},{"no":61,"category":"가족·관계","word":"嫁","pinyin":"jià","meaning":"시집가다","example":"按照旧俗，她十八岁就嫁给了一位医生。","examplePinyin":"Ànzhào jiùsú, tā shíbā suì jiù jiàgěi le yí wèi yīshēng.","translation":"옛 풍습에 따르면 그녀는 18세에 의사와 결혼했습니다.","sourceNo":4202},{"no":62,"category":"가족·관계","word":"家常","pinyin":"jiācháng","meaning":"일상적인 집안일; 집안 이야기","example":"几个老朋友坐在一起，聊了很多家常。","examplePinyin":"Jǐ ge lǎopéngyou zuò zài yìqǐ, liáo le hěn duō jiācháng.","translation":"오랜 친구 몇 명이 함께 앉아 집안일에 대해 많은 이야기를 나눴습니다.","sourceNo":4205},{"no":63,"category":"가족·관계","word":"家家户户","pinyin":"jiājiāhùhù","meaning":"집집마다","example":"过年的时候，家家户户都挂上了红灯笼。","examplePinyin":"Guònián de shíhou, jiājiāhùhù dōu guà shàng le hóngdēnglong.","translation":"설날에는 집집마다 빨간 등불을 걸어 놓습니다.","sourceNo":4206},{"no":64,"category":"가족·관계","word":"交际","pinyin":"jiāojì","meaning":"교제하다, 사교하다","example":"他性格开朗，非常擅长与人交际。","examplePinyin":"Tā xìnggé kāilǎng, fēicháng shàncháng yǔ rén jiāojì.","translation":"성격은 쾌활하고 사람들과의 소통이 매우 능숙합니다.","sourceNo":4241},{"no":65,"category":"가족·관계","word":"家属","pinyin":"jiāshǔ","meaning":"가족, 부양가족","example":"病人的家属焦急地在门外来回等着。","examplePinyin":"Bìngrén de jiāshǔ jiāojí de zài ménwài láihuí děng zhe.","translation":"문밖에는 환자 가족들이 초조하게 기다리고 있었다.","sourceNo":4251},{"no":66,"category":"가족·관계","word":"继承","pinyin":"jìchéng","meaning":"계승하다, 물려받다","example":"作为长子，他继承了父亲留下的事业。","examplePinyin":"Zuòwéi chángzǐ, tā jìchéng le fùqīn liúxià de shìyè.","translation":"그는 장남으로서 아버지가 물려준 사업을 물려받았다.","sourceNo":4257},{"no":67,"category":"가족·관계","word":"舅舅","pinyin":"jiùjiu" :84,"category":"가족·관계","word":"祖先","pinyin":"zǔxiān","meaning":"조상","example":"我们应当铭记并尊重先辈祖先。","examplePinyin":"Wǒmen yīngdāng míngjì bìng zūnzhòng xiānbèi zǔxiān.","translation":"우리는 조상을 기억하고 존경해야 합니다.","sourceNo":5399},{"no":85,"category":"숫자·수량·화폐","word":"百分点","pinyin":"bǎifēndiǎn","meaning":"퍼센트 포인트","example":"这次投票的支持率比上次提高了两个百分点。","examplePinyin":"Zhè cì tóupiào de zhīchílǜ bǐ shàngcì tígāo le liǎng ge bǎifēndiǎn.","translation":"이번 투표의 지지율은 지난번보다 2퍼센트포인트 높아졌어요.","sourceNo":3611},{"no":86,"category":"숫자·수량·화폐","word":"倍增","pinyin":"bèizēng","meaning":"배가 되다, 갑절","example":"由于生产效率的提高，产量倍增。","examplePinyin":"Yóuyú shēngchǎn xiàolǜ de tígāo, chǎnliàng bèizēng.","translation":"생산 효율성이 향상되어 생산량이 두 배로 늘어났습니다.","sourceNo":3643},{"no":87,"category":"숫자·수량·화폐","word":"比重","pinyin":"bǐzhòng","meaning":"비중, 비율","example":"农业在国民经济中的比重正在下降。","examplePinyin":"Nóngyè zài guómín jīngjì zhōng de bǐzhòng zhèngzài xiàjiàng.","translation":"국민경제에서 농업이 차지하는 비중은 감소하고 있다.","sourceNo":3661},{"no":88,"category":"숫자·수량·화폐","word":"场次","pinyin":"chǎngcì","meaning":"회차, 경기 번호","example":"这部电影今天有好几个放映场次，买票很方便。","examplePinyin":"Zhè bù diànyǐng jīntiān yǒu hǎo jǐ ge fàngyìng chǎngcì, mǎipiào hěn fāngbiàn.","translation":"이 영화는 오늘 여러 차례 상영되어 표를 사기 편해요.","sourceNo":3722},{"no":89,"category":"숫자·수량·화폐","word":"乘2","pinyin":"chéng","meaning":"곱셈하다","example":"三乘以二等于六。","examplePinyin":"Sān chéngyǐ èr děngyú liù.","translation":"3 곱하기 2는 6과 같습니다.","sourceNo":3751},{"no":90,"category":"숫자·수량·화폐","word":"成千上万","pinyin":"chéngqiān shàngwàn","meaning":"수천 수만, 엄청나게","example":"广场上的人成千上万，热闹非凡。","examplePinyin":"Guǎngchǎng shàng de rén chéngqiānshàngwàn, rènao fēifán.","translation":"광장에는 수천 명의 사람들이 있었고 매우 활기가 넘쳤습니다.","sourceNo":3760},{"no":91,"category":"숫자·수량·화폐","word":"尺寸","pinyin":"chǐcùn","meaning":"치수, 크기","example":"请在纸上量好尺寸，再进行裁剪。","examplePinyin":"Qǐng zài zhǐ shàng liàng hǎo chǐcùn, zài jìnxíng cáijiǎn.","translation":"절단하기 전에 용지의 크기를 측정하십시오.","sourceNo":3770},{"no":92,"category":"숫자·수량·화폐","word":"次数","pinyin":"cìshù","meaning":"횟수, 번수","example":"经过反复练习，他在比赛中失误的次数减少了。","examplePinyin":"Jīngguò fǎnfù liànxí, tā zài bǐsài zhōng shīwù de cìshù jiǎnshǎo le.","translation":"반복해서 연습하자 경기에서 실수하는 횟수가 줄었어요.","sourceNo":3821},{"no":93,"category":"숫자·수량·화폐","word":"寸","pinyin":"cùn","meaning":"촌(중국의 길이 단위)","example":"请再往前挪一寸，就刚好够到了。","examplePinyin":"Qǐng zài wǎngqián nuó yícùn, jiù gānghǎo gòu dào le.","translation":"한 촌만 더 앞으로 옮기면 딱 닿겠어요.","sourceNo":3829},{"no":94,"category":"숫자·수량·화폐","word":"滴","pinyin":"dī","meaning":"떨어지다, 방울","example":"滴答一声，雨滴落在了他的脸上。","examplePinyin":"Dīdā yìshēng, yǔdī luò zài le tā de liǎnshàng.","translation":"똑딱거리는 소리와 함께 빗방울이 그의 얼굴에 떨어졌다.","sourceNo":3887},{"no":95,"category":"숫자·수량·화폐","word":"栋","pinyin":"dòng","meaning":"동(건물의 양사), 기둥","example":"这栋大楼是城市的新地标，气势恢宏。","examplePinyin":"Zhè dòng dàlóu shì chéngshì de xīn debiāo, qìshì huīhóng.","translation":"이 건물은 도시의 새로운 랜드마크이며 웅장합니다.","sourceNo":3916},{"no":96,"category":"숫자·수량·화폐","word":"番","pinyin":"fān","meaning":"번(차례), 갑절","example":"这个方案我们已经反复讨论了好几番，终于确定了。","examplePinyin":"Zhè ge fāng'àn wǒmen yǐjīng fǎnfù tǎolùn le hǎojǐfān, zhōngyú quèdìng le.","translation":"우리는 이 계획에 대해 여러 번 논의했고 마침내 결정했습니다.","sourceNo":3959},{"no":97,"category":"숫자·수량·화폐","word":"幅度","pinyin":"fúdù","meaning":"폭, 너비","example":"这次的涨价幅度很大，超出了很多人的预期。","examplePinyin":"Zhè cì de zhǎngjià fúdù hěn dà, chāochū le hěn duō rén de yùqī.","translation":"이번 가격 인상 폭은 커서 많은 사람의 예상을 넘었어요.","sourceNo":4002},{"no":98,"category":"숫자·수량·화폐","word":"概率","pinyin":"gàilǜ","meaning":"확률, 개연성","example":"这件事发生的概率很小，但也不是完全不可能。","examplePinyin":"Zhè jiàn shì fāshēng de gàilǜ hěnxiǎo, dàn yě búshì wánquán bù kěnéng.","translation":"이런 일이 일어날 확률은 적지만 완전히 불가능한 것은 아닙니다.","sourceNo":4015},{"no":99,"category":"숫자·수량·화폐","word":"共计","pinyin":"gòngjì","meaning":"총계, 합계","example":"参加这次活动的人数共计一百人。","examplePinyin":"Cānjiā zhè cì huódòng de rénshù gòngjì yìbǎi rén.","translation":"이날 행사에는 총 100명이 참석했다.","sourceNo":4056},{"no":100,"category":"숫자·수량·화폐","word":"海拔","pinyin":"hǎibá","meaning":"해발","example":"这座山峰的海拔高度接近五千米。","examplePinyin":"Zhè zuò shānfēng de hǎibá gāodù jiējìn wǔqiān mǐ.","translation":"이 산의 고도는 거의 5,000미터에 이른다.","sourceNo":4119},{"no":101,"category":"숫자·수량·화폐","word":"毫米","pinyin":"háomǐ","meaning":"밀리미터","example":"这根铁丝大约有十毫米那么粗。","examplePinyin":"Zhè gēn tiěsī dàyuē yǒu shí háomǐ nàme cū.","translation":"이 와이어의 두께는 약 10mm입니다.","sourceNo":4132},{"no":102,"category":"숫자·수량·화폐","word":"毫升","pinyin":"háoshēng","meaning":"밀리리터","example":"这瓶矿泉水的容量大约是五百毫升。","examplePinyin":"Zhè píng kuàngquánshuǐ de róngliàng dàyuē shì wǔbǎi háoshēng.","translation":"이 생수병의 용량은 약 500ml입니다.","sourceNo":4134},{"no":103,"category":"숫자·수량·화폐","word":"户","pinyin":"hù","meaning":"가구, 세대(양사)","example":"这个小区一共住着大约一百户人家。","examplePinyin":"Zhè ge xiǎoqū yígòng zhù zhe dàyuē yìbǎihù rénjia.","translation":"이 지역 사회에는 약 100가구가 살고 있습니다.","sourceNo":4157},{"no":104,"category":"숫자·수량·화폐","word":"货币","pinyin":"huòbì","meaning":"화폐","example":"人民币是中华人民共和国的法定货币。","examplePinyin":"Rénmínbì shì Zhōnghuá rénmín gònghé guó de fǎdìng huòbì.","translation":"위안화(RMB)는 중화인민공화국의 법정화폐입니다.","sourceNo":4194},{"no":105,"category":"숫자·수량·화폐","word":"加倍","pinyin":"jiābèi","meaning":"배가하다 / 갑절로","example":"为了赶上进度，他决定加倍努力学习。","examplePinyin":"Wèile gǎnshàng jìndù, tā juédìng jiābèi nǔlì xuéxí.","translation":"따라잡기 위해 그는 더 열심히 공부하기로 결정했습니다.","sourceNo":4204},{"no":106,"category":"숫자·수량·화폐","word":"间隔","pinyin":"jiàngé","meaning":"간격 / 간격을 두다","example":"这两棵树之间的间隔大约三米左右。","examplePinyin":"Zhè liǎngkēshù zhījiān de jiàngé dàyuē sān mǐ zuǒyòu.","translation":"두 나무 사이의 거리는 약 3미터 정도 됩니다.","sourceNo":4219},{"no":107,"category":"숫자·수량·화폐","word":"金额","pinyin":"jīn'é","meaning":"금액","example":"这笔交易涉及的金额相当巨大。","examplePinyin":"Zhè bǐ jiāoyì shèjí de jīn'é xiāngdāng jùdà.","translation":"이 거래에 관련된 금액은 상당히 커요.","sourceNo":4291},{"no":108,"category":"숫자·수량·화폐","word":"款","pinyin":"kuǎn","meaning":"종류, 스타일(양사) / 돈, 자금","example":"这是今年最新推出的一款手机。","examplePinyin":"Zhè shì jīnnián zuìxīn tuīchū de yìkuǎn shǒujī.","translation":"올해 출시된 최신 휴대폰이다.","sourceNo":4403},{"no":109,"category":"숫자·수량·화폐","word":"粒","pinyin":"lì","meaning":"알, 낱개(양사)","example":"几粒米饭不小心洒在了桌子上。","examplePinyin":"Jǐlì mǐfàn bù xiǎoxīn sǎ zài le zhuōzi shàng.","translation":"밥 몇 알이 실수로 식탁에 떨어졌어요.","sourceNo":4431},{"no":110,"category":"숫자·수량·화폐","word":"率","pinyin":"lǜ","meaning":"~율(비율)","example":"这次考试的整体通过率很高。","examplePinyin":"Zhè cì kǎoshì de zhěngtǐ tōngguòlǜ hěn gāo.","translation":"이번 시험의 전체 합격률은 매우 높았습니다.","sourceNo":4464},{"no":111,"category":"숫자·수량·화폐","word":"密度","pinyin":"mìdù","meaning":"밀도","example":"大城市的人口密度普遍非常高。","examplePinyin":"Dàchéngshì de rénkǒu mìdù pǔbiàn fēicháng gāo.","translation":"대도시의 인구 밀도는 일반적으로 매우 높습니다.","sourceNo":4513},{"no":112,"category":"숫자·수량·화폐","word":"名额","pinyin":"míng'é","meaning":"정원, 인원수","example":"这次留学项目的名额十分有限。","examplePinyin":"Zhè cì liúxué xiàngmù dì míng'é shífēn yǒuxiàn.","translation":"이번 유학 프로그램의 모집 정원은 매우 적어요.","sourceNo":4517},{"no":113,"category":"숫자·수량·화폐","word":"平方","pinyin":"píngfāng","meaning":"제곱, 평방","example":"这套房子的面积大约是九十平方米。","examplePinyin":"Zhè tào fángzi de miànjī dàyuē shì jiǔshí píngfāngmǐ.","translation":"집의 면적은 약 90평방미터입니다.","sourceNo":4597},{"no":114,"category":"숫자·수량·화폐","word":"平方米","pinyin":"píngfāngmǐ","meaning":"평방미터","example":"这个客厅的面积超过了三十平方米。","examplePinyin":"Zhè ge kètīng de miànjī chāoguò le sānshí píngfāngmǐ.","translation":"이 거실의 면적은 30제곱미터가 넘습니다.","sourceNo":4598},{"no":115,"category":"숫자·수량·화폐","word":"频率","pinyin":"pínlǜ","meaning":"주파수, 빈도","example":"他最近去健身房锻炼的频率提高了。","examplePinyin":"Tā zuìjìn qù jiànshēnfáng duànliàn de pínlǜ tígāo le.","translation":"그는 최근 체육관에 더 자주 가고 있습니다.","sourceNo":4603},{"no":116,"category":"숫자·수량·화폐","word":"圈","pinyin":"quān","meaning":"원, 동그라미 / 원을 그리다","example":"老师在错题旁边画了一个红色圆圈。","examplePinyin":"Lǎoshī zài cuòtí pángbiān huà le yí ge hóngsè yuánquān.","translation":"선생님은 틀린 문제 옆에 빨간색 원을 그렸습니다.","sourceNo":4676},{"no":117,"category":"숫자·수량·화폐","word":"人均","pinyin":"rénjūn","meaning":"1인당","example":"随着经济发展，这里的人均收入提高了。","examplePinyin":"Suízhe jīngjì fāzhǎn, zhèlǐ de rénjūn shōurù tígāo le.","translation":"경제가 발전하면서 1인당 국민소득도 늘었습니다.","sourceNo":4696},{"no":118,"category":"숫자·수량·화폐","word":"容量","pinyin":"róngliàng","meaning":"용량","example":"这款手机的存储容量非常大。","examplePinyin":"Zhè kuǎn shǒujī de cúnchǔ róngliàng fēicháng dà.","translation":"이 휴대폰의 저장 용량은 매우 큽니다.","sourceNo":4715},{"no":119,"category":"숫자·수량·화폐","word":"扇","pinyin":"shàn","meaning":"짝(문, 창문 세는 양사)","example":"这扇木门年久失修，已经变形了。","examplePinyin":"Zhè shàn mùmén nián jiǔ shīxiū, yǐjīng biànxíng le.","translation":"이 나무 문은 오래 수리하지 않아 변형되었어요.","sourceNo":4736},{"no":120,"category":"숫자·수량·화폐","word":"升2","pinyin":"shēng","meaning":"리터","example":"这辆汽车油箱容量大约是五十升。","examplePinyin":"Zhè liàng qìchē yóuxiāng róngliàng dàyuē shì wǔshí shēng.","translation":"자동차의 연료 탱크 용량은 약 50리터입니다.","sourceNo":4760},{"no":121,"category":"숫자·수량·화폐","word":"时速","pinyin":"shísù","meaning":"시속","example":"这列高速列车的最高时速可达三百公里。","examplePinyin":"Zhè liè gāosù lièchē de zuìgāo shísù kě dá sān bǎi gōnglǐ.","translation":"이 고속 열차의 최고 시속은 300킬로미터에 달해요.","sourceNo":4798},{"no":122,"category":"숫자·수량·화폐","word":"数目","pinyin":"shùmù","meaning":"수, 수량","example":"请仔细核对书籍的数目，避免出现遗漏。","examplePinyin":"Qǐng zǐxì héduì shūjí de shùmù, bìmiǎn chūxiàn yílòu.","translation":"누락되지 않도록 책의 수를 꼼꼼히 확인해 주세요.","sourceNo":4833},{"no":123,"category":"숫자·수량·화폐","word":"艘","pinyin":"sōu","meaning":"척(배 세는 양사)","example":"港口停靠着一艘巨大的远洋货轮。","examplePinyin":"Gǎngkǒu tíngkào zhe yìsōu jùdà de yuǎnyáng huòlún.","translation":"거대한 해상 화물선이 항구에 정박해 있습니다.","sourceNo":4843},{"no":124,"category":"숫자·수량·화폐","word":"体积","pinyin":"tǐjī","meaning":"부피, 체적","example":"这个纸箱的体积比想象中要大很多。","examplePinyin":"Zhè ge zhǐxiāng de tǐjī bǐ xiǎngxiàng zhōng yào dà hěn duō.","translation":"이 판지 상자의 부피는 상상했던 것보다 훨씬 큽니다.","sourceNo":4896},{"no":125,"category":"숫자·수량·화폐","word":"样","pinyin":"yàng","meaning":" e zhōu.","translation":"캘리포니아는 미국에서 면적이 넓은 주 중 하나예요.","sourceNo":5336},{"no":175,"category":"지시·의문·위치","word":"周边","pinyin":"zhōubiān","meaning":"주변","example":"学校周边聚集了很多小吃店铺。","examplePinyin":"Xuéxiào zhōubiān jùjí le hěn duō xiǎochī diànpù.","translation":"학교 주변에는 간식가게가 많이 모여있습니다.","sourceNo":5338},{"no":176,"category":"시간·날짜","word":"不曾","pinyin":"bùcéng","meaning":"일찍이 ~않다, 결코","example":"他从不曾忘记过自己的初心，一直努力着。","examplePinyin":"Tā cóng bùcéng wàngjì guo zìjǐ de chū xīn, yìzhí nǔlì zhe.","translation":"그는 초심을 잊지 않고 계속해서 노력했다.","sourceNo":3672},{"no":177,"category":"시간·날짜","word":"不时","pinyin":"bùshí","meaning":"수시로, 때때로","example":"他学习时，不时地看一下手机，很不专心。","examplePinyin":"Tā xuéxí shí, bùshí de kàn yíxià shǒujī, hěn bù zhuānxīn.","translation":"그는 공부할 때 가끔 휴대폰을 보았고 매우 부주의했습니다.","sourceNo":3682},{"no":178,"category":"시간·날짜","word":"常年","pinyin":"chángnián","meaning":"연중, 항년","example":"他常年在外工作，很少回家。","examplePinyin":"Tā chángnián zàiwài gōngzuò, hěn shǎo huíjiā.","translation":"그는 일년 내내 밖에서 일하며 집에 거의 들어오지 않습니다.","sourceNo":3731},{"no":179,"category":"시간·날짜","word":"持久","pinyin":"chíjiǔ","meaning":"오래 지속되다, 지속","example":"他们之间的友谊持久而深厚。","examplePinyin":"Tāmen zhījiān de yǒuyì chíjiǔ ér shēnhòu.","translation":"그들의 우정은 지속적이고 깊었습니다.","sourceNo":3771},{"no":180,"category":"시간·날짜","word":"此刻","pinyin":"cǐkè","meaning":"지금, 바로 이때","example":"就在此刻，他突然明白了其中的道理。","examplePinyin":"Jiù zài cǐkè, tā tūrán míngbai le qízhōng de dàolǐ.","translation":"그 순간 그는 문득 그 이유를 깨달았다.","sourceNo":3819},{"no":181,"category":"시간·날짜","word":"从未","pinyin":"cóngwèi","meaning":"이전에 ~하지 않다","example":"他从未说过谎，是个诚实可靠的人。","examplePinyin":"Tā cóngwèi shuō guo huǎng, shì ge chéngshí kěkào de rén.","translation":"그는 결코 거짓말을 하지 않았고 정직하고 믿음직한 사람이었습니다.","sourceNo":3824},{"no":182,"category":"시간·날짜","word":"当场","pinyin":"dāngchǎng","meaning":"현장에서, 그 자리에서","example":"事故发生后，他当场就晕了过去。","examplePinyin":"Shìgù fāshēng hòu, tā dāngchǎng jiù yūn le guòqu.","translation":"사고 이후 A씨는 그 자리에서 기절했다.","sourceNo":3858},{"no":183,"category":"시간·날짜","word":"当初","pinyin":"dāngchū","meaning":"당시, 그때","example":"当初如果听了你的话就好了，现在后悔也来不及了。","examplePinyin":"Dāngchū rúguǒ tīng le nǐ de huà jiù hǎo le, xiànzài hòuhuǐ yě láibují le.","translation":"당신의 말을 들었더라면 좋았을 텐데, 이제는 후회하기엔 너무 늦었습니다.","sourceNo":3859},{"no":184,"category":"시간·날짜","word":"当代","pinyin":"dāngdài","meaning":"현대, 현대","example":"许多当代年轻人的生活方式已经和过去大不一样了。","examplePinyin":"Xǔduō dāngdài niánqīngrén de shēnghuó fāngshì yǐjīng hé guòqu dà bù yíyàng le.","translation":"많은 현대 젊은이들의 생활 방식은 과거와 매우 다릅니다.","sourceNo":3860},{"no":185,"category":"시간·날짜","word":"当今","pinyin":"dāngjīn","meaning":"현재, 요즘","example":"当今社会，科技发展日新月异。","examplePinyin":"Dāngjīn shèhuì, kējì fāzhǎn rì xīnyuè yì.","translation":"현대사회에서는 과학과 기술이 급속도로 발전하고 있습니다.","sourceNo":3861},{"no":186,"category":"시간·날짜","word":"当天","pinyin":"dàngtiān","meaning":"그날, 당일","example":"他当天就完成了任务，效率很高。","examplePinyin":"Tā dàngtiān jiù wánchéng le rènwu, xiàolǜ hěn gāo.","translation":"그는 그날 작업을 완료했고 매우 효율적이었습니다.","sourceNo":3863},{"no":187,"category":"시간·날짜","word":"当下","pinyin":"dāngxià","meaning":"현재, 지금","example":"当下，最重要的是冷静下来，分析问题。","examplePinyin":"Dāngxià, zuì zhòngyào de shì lěngjìng xiàlai, fēnxī wèntí.","translation":"현재 가장 중요한 것은 진정하고 문제를 분석하는 것입니다.","sourceNo":3864},{"no":188,"category":"시간·날짜","word":"定时","pinyin":"dìngshí","meaning":"정시, 시간 설정","example":"这趟班车定时发车，很准时。","examplePinyin":"Zhè tàng bānchē dìngshí fāchē, hěn zhǔnshí.","translation":"이 셔틀 버스는 정시에 출발하며 시간을 엄수합니다.","sourceNo":3908},{"no":189,"category":"시간·날짜","word":"顿时","pinyin":"dùnshí","meaning":"갑자기, 순식간에","example":"听到这消息，他顿时愣住了。","examplePinyin":"Tīngdào zhè xiāoxi, tā dùnshí lèngzhù le.","translation":"그 소식을 듣고 그는 깜짝 놀랐다.","sourceNo":3934},{"no":190,"category":"시간·날짜","word":"高峰","pinyin":"gāofēng","meaning":"고봉, 정상","example":"上班高峰期的地铁站人流量很大。","examplePinyin":"Shàngbān gāofēngqī de dìtiězhàn rén liúliàng hěn dà.","translation":"출근 시간대의 지하철역에는 사람이 아주 많아요.","sourceNo":4034},{"no":191,"category":"시간·날짜","word":"工夫","pinyin":"gōngfu","meaning":"(들인)시간,틈,여가","example":"周末他喜欢花工夫修理家里的电器。","examplePinyin":"Zhōumò tā xǐhuan huā gōngfu xiūlǐ jiālǐ de diànqì.","translation":"주말에는 집에서 전자제품을 수리하며 시간을 보내는 것을 좋아합니다.","sourceNo":4053},{"no":192,"category":"시간·날짜","word":"公元","pinyin":"gōngyuán","meaning":"서기, 기원","example":"公元2020年是不平凡的一年。","examplePinyin":"Gōngyuán 2  2  nián shì bù píngfán de yì nián.","translation":"서기 2020년은 특별한 해입니다.","sourceNo":4066},{"no":193,"category":"시간·날짜","word":"过后","pinyin":"guòhòu","meaning":"그 후에","example":"等事情过后，我再详细告诉你。","examplePinyin":"Děng shìqing guòhòu, wǒ zài xiángxì gàosu nǐ.","translation":"사건 이후에 자세히 말씀드리겠습니다.","sourceNo":4103},{"no":194,"category":"시간·날짜","word":"寒冬","pinyin":"hándōng","meaning":"엄동, 추운 겨울","example":"寒冬来临之后，气温骤然下降不少。","examplePinyin":"Hándōng láilín zhīhòu, qìwēn zhòurán xiàjiàng bùshǎo.","translation":"혹한이 닥치자 기온이 갑자기 크게 내려갔어요.","sourceNo":4122},{"no":195,"category":"시간·날짜","word":"后期","pinyin":"hòuqī","meaning":"후기","example":"这个项目目前正处于后期收尾阶段。","examplePinyin":"Zhè ge xiàngmù mùqián zhèng chǔyú hòuqī shōuwěi jiēduàn.","translation":"이 사업은 현재 후기 마무리 단계에 있어요.","sourceNo":4152},{"no":196,"category":"시간·날짜","word":"接连","pinyin":"jiēlián","meaning":"연이어, 잇달아","example":"接到消息后，他接连打了三个紧急电话。","examplePinyin":"Jiēdào xiāoxi hòu, tā jiēlián dǎ le sān ge jǐnjí diànhuà.","translation":"이 소식을 들은 그는 연속으로 세 차례 긴급 전화를 걸었다.","sourceNo":4270},{"no":197,"category":"시간·날짜","word":"截至","pinyin":"jiézhì","meaning":"~까지(마감)","example":"截至今天，报名人数已经超过一千人。","examplePinyin":"Jiézhì jīntiān, bàomíng rénshù yǐjīng chāoguò yìqiān rén.","translation":"오늘까지 신청자가 이미 천 명을 넘었어요.","sourceNo":4276},{"no":198,"category":"시간·날짜","word":"截止","pinyin":"jiézhǐ","meaning":"마감하다","example":"本次活动的报名将于周五截止。","examplePinyin":"Běncì huódòng de bàomíng jiāng yú zhōuwǔ jiézhǐ.","translation":"이번 행사의 신청은 금요일에 마감돼요.","sourceNo":4277},{"no":199,"category":"시간·날짜","word":"进度","pinyin":"jìndù","meaning":"진도","example":"由于人手不足，项目的进度稍微落后了。","examplePinyin":"Yóuyú rénshǒu bùzú, xiàngmù dì jìndù shāowēi luòhòu le.","translation":"인력 부족으로 인해 프로젝트가 일정보다 약간 늦어졌습니다.","sourceNo":4290},{"no":200,"category":"시간·날짜","word":"近来","pinyin":"jìnlái","meaning":"근래, 요즘","example":"近来天气变化无常，请注意保暖。","examplePinyin":"Jìnlái tiānqì biànhuà wúcháng, qǐng zhùyì bǎonuǎn.","translation":"요즘 날씨가 예측불허인데 따뜻하게 지내시기 바랍니다.","sourceNo":4310},{"no":201,"category":"시간·날짜","word":"空闲","pinyin":"kòngxián","meaning":"한가하다 / 여가시간","example":"周末难得有空闲时间陪陪家人。","examplePinyin":"Zhōumò nándé yǒu kòngxián shíjiān péipéi jiārén.","translation":"주말에 가족과 함께할 여유 시간이 모처럼 생겼어요.","sourceNo":4392},{"no":202,"category":"시간·날짜","word":"来临","pinyin":"láilín","meaning":"다가오다, 도래하다","example":"随着春天的来临，万物开始复苏。","examplePinyin":"Suízhe chūntiān de láilín, wànwù kāishǐ fùsū.","translation":"봄이 오면 모든 것이 활기를 띠기 시작합니다.","sourceNo":4413},{"no":203,"category":"시간·날짜","word":"凌晨","pinyin":"língchén","meaning":"새벽","example":"他每天都工作到凌晨才回家休息。","examplePinyin":"Tā měi tiān dōu gōngzuò dào língchén cái huíjiā xiūxi.","translation":"그는 매일 새벽까지 일한 뒤 집에 가서 쉬어요.","sourceNo":4448},{"no":204,"category":"시간·날짜","word":"历年","pinyin":"lìnián","meaning":"역대의, 매년","example":"这所学校历年的升学率都很高。","examplePinyin":"Zhè suǒ xuéxiào lìnián de shēngxuélǜ dōu hěn gāo.","translation":"이 학교의 역대 진학률은 매우 높아요.","sourceNo":4449},{"no":205,"category":"시간·날짜","word":"年度","pinyin":"niándù","meaning":"연도","example":"公司即将召开一场年度总结大会。","examplePinyin":"Gōngsī jíjiāng zhàokāi yì chǎng niándù zǒngjié dàhuì.","translation":"회사는 연례 요약 회의를 개최할 예정입니다.","sourceNo":4556},{"no":206,"category":"시간·날짜","word":"年终","pinyin":"niánzhōng","meaning":"연말","example":"每到年终，公司都会举办联欢晚会。","examplePinyin":"Měi dào niánzhōng, gōngsī dōu huì jǔbàn liánhuān wǎnhuì.","translation":"매년 말, 회사에서는 갈라파티를 개최합니다.","sourceNo":4558},{"no":207,"category":"시간·날짜","word":"片刻","pinyin":"piànkè","meaning":"잠깐, 잠시","example":"请稍等片刻，医生马上就出来了。","examplePinyin":"Qǐng shāoděng piànkè, yīshēng mǎshàng jiù chūlai le.","translation":"잠시만 기다리십시오. 의사가 곧 나갈 것입니다.","sourceNo":4586},{"no":208,"category":"시간·날짜","word":"频繁","pinyin":"pínfán","meaning":"빈번하다","example":"最近他频繁出差，几乎没有时间休息。","examplePinyin":"Zuìjìn tā pínfán chūchāi, jīhū méiyǒu shíjiān xiūxi.","translation":"최근 그는 출장이 잦아 쉴 시간이 거의 없어요.","sourceNo":4594},{"no":209,"category":"시간·날짜","word":"前期","pinyin":"qiánqī","meaning":"전기, 초기","example":"项目开工前期需要做大量的准备工作。","examplePinyin":"Xiàngmù kāigōng qiánqī xūyào zuò dàliàng de zhǔnbèi gōngzuò.","translation":"프로젝트가 시작되기 전에 많은 준비 작업을 완료해야 합니다.","sourceNo":4623},{"no":210,"category":"시간·날짜","word":"起初","pinyin":"qǐchū","meaning":"처음","example":"起初大家都不相信这件事是真的。","examplePinyin":"Qǐchū dàjiā dōu bù xiāngxìn zhè jiàn shì shì zhēnde.","translation":"처음에는 누구도 그것이 사실이라고 믿지 않았습니다.","sourceNo":4631},{"no":211,"category":"시간·날짜","word":"其间","pinyin":"qíjiān","meaning":"그 사이, 그 동안","example":"他在国外留学多年，其间收获颇丰。","examplePinyin":"Tā zài guówài liúxué duōnián, qíjiān shōuhuò pǒfēng.","translation":"그는 수년간 해외에서 공부했으며 이 기간 동안 많은 것을 얻었습니다.","sourceNo":4637},{"no":212,"category":"시간·날짜","word":"清晨","pinyin":"qīngchén","meaning":"새벽, 이른 아침","example":"清晨的空气格外清新，令人心旷神怡。","examplePinyin":"Qīngchén de kōngqì géwài qīngxīn, lìngrén xīn kuàng shén yí.","translation":"아침 공기는 유난히 신선하고 상쾌합니다.","sourceNo":4639},{"no":213,"category":"시간·날짜","word":"青春","pinyin":"qīngchūn","meaning":"청춘","example":"他常常怀念自己无忧无虑的青春岁月。","examplePinyin":"Tā chángcháng huáiniàn zìjǐ wú yōu wú lǜ de qīngchūn suìyuè.","translation":"그는 종종 평온한 젊음을 그리워합니다.","sourceNo":4640},{"no":214,"category":"시간·날짜","word":"青春期","pinyin":"qīngchūnqī","meaning":"사춘기","example":"孩子进入青春期后情绪常常起伏不定。","examplePinyin":"Háizi jìnrù qīngchūnqī hòu qíngxù chángcháng qǐfú búdìng.","translation":"아이들은 청소년기에 들어서면서 기분 변화를 경험하는 경우가 많습니다.","sourceNo":4641},{"no":215,"category":"시간·날짜","word":"期限","pinyin":"qīxiàn","meaning":"기한","example":"这项工程必须在规定期限内完成。","examplePinyin":"Zhè xiàng gōngchéng bìxū zài guīdìng qīxiàn nèi wánchéng.","translation":"이 프로젝트는 지정된 시간 내에 완료되어야 합니다.","sourceNo":4669},{"no":216,"category":"시간·날짜","word":"全程","pinyin":"quánchéng","meaning":"전 과정; 전 구간","example":"这场马拉松比赛他坚持跑完了全程。","examplePinyin":"Zhè chǎng mǎlāsōng bǐsài tā jiānchí pǎo wán le quánchéng.","translation":"그는 이번 마라톤에서 끝까지 달려 전 구간을 완주했어요.","sourceNo":4677},{"no":217,"category":"시간·날짜","word":"仍旧","pinyin":"réngjiù","meaning":"여전히","example":"尽管年事已高，他仍旧坚持每天锻炼。","examplePinyin":"Jǐnguǎn niánshì yǐ gāo, tā réngjiù jiānchí měi tiān duànliàn.","translation":"노령에도 불구하고 그는 여전히 매일 운동을 한다.","sourceNo":4693},{"no":218,"category":"시간·날짜","word":"日后","pinyin":"rìhòu","meaning":"훗날, 나중에","example":"他相信日后一定会有机会再见面。","examplePinyin":"Tā xiāngxìn rìhòu yídìng huì yǒu jīhuì zàijiànmiàn.","translation":"그는 앞으로도 다시 만날 기회가 있을 것이라고 믿었다.","sourceNo":4709},{"no":219,"category":"시간·날짜","word":"日前","pinyin":"rìqián","meaning":"며칠 전","example":"日前，该公司宣布了一项重要决定。","examplePinyin":"Rìqián, gāi gōngsī xuānbù le yí xiàng zhòngyào juédìng.","translation":"최근 회사는 중요한 결정을 발표했습니다.","sourceNo":4710},{"no":220,"category":"시간·날짜","word":"日夜","pinyin":"rìyè","meaning":"밤낮으로","example":"医护人员日夜奋战在抗疫的第一线。","examplePinyin":"Yīhù rényuán rìyè fènzhàn zài kàng yì de dìyīxiàn.","translation":"의료진은 전염병 퇴치의 최전선에서 밤낮으로 일하고 있습니다.","sourceNo":4711},{"no":221,"category":"시간·날짜","word":"日益","pinyin":"rìyì","meaning":"나날이","example":"随着经济发展，人们的生活日益富裕。","examplePinyin":"Suízhe jīngjì fāzhǎn, rénmen de shēnghuó rìyì fùyù.","translation":"경제가 발전하면서 사람들의 삶은 점점 더 풍요로워지고 있습니다.","sourceNo":4712},{"no":222,"category":"시간·날짜","word":"上旬","pinyin":"shàngxún","meaning":"상순","example":"他计划下个月上旬出差去外地。","examplePinyin":"Tā jìhuà xiàgeyuè shàngxún chūchāi qù wàidì.","translation":"그는 다음달 초 출장을 갈 예정이다.","sourceNo":4750},{"no":223,"category":"시간·날짜","word":"深夜","pinyin":"shēnyè","meaning":"심야, 깊은 밤","example":"他习惯在深夜安静的时候专心写作。","examplePinyin":"Tā xíguàn zài shēnyè ānjìng de shíhou zhuānxīn xiězuò.","translation":"그는 밤늦게까지 조용할 때 글쓰기에 집중하곤 했습니다.","sourceNo":4771},{"no":224,"category":"시간·날짜","word":"时光","pinyin":"shíguāng","meaning":"세월, 시간","example":"童年那段无忧无虑的时光令人怀念。","examplePinyin":"Tóngnián nà duàn wú yōu wú lǜ de shíguāng lìngrén huáiniàn.","translation":"어린 시절의 평온한 시절은 향수를 불러일으킵니다.","sourceNo":4787},{"no":225,"category":"시간·날짜","word":"事后","pinyin":"shìhòu","meaning":"사후","example":"事后他才意识到自己犯了大错。","examplePinyin":"Shìhòu tā cái yìshí dào zìjǐ fàn le dà cuò.","translation":"나중에서야 그는 자신이 큰 실수를 저질렀다는 것을 깨달았습니다.","sourceNo":4788},{"no":226,"category":"시간·날짜","word":"时机","pinyin":"shíjī","meaning":"시기, 기회","example":"领导认为现在正是采取行动的好时机。","examplePinyin":"Lǐngdǎo rènwéi xiànzài zhèngshì cǎiqǔ xíngdòng de hǎo shíjī.","translation":"지도자들은 지금이 조치를 취하기에 좋은 시기라고 결정했습니다.","sourceNo":4791},{"no":227,"category":"시간·날짜","word":"实时","pinyin":"shíshí","meaning":"실시간의","example":"这款软件可以实时监控交通路况。","examplePinyin":"Zhè kuǎn ruǎnjiàn kěyǐ shíshí jiānkòng jiāotōng lùkuàng.","translation":"이 소프트웨어는 실시간으로 교통 상황을 모니터링할 수 있습니다.","sourceNo":4797},{"no":228,"category":"시간·날짜","word":"瞬间","pinyin":"shùnjiān","meaning":"순간","example":"相机准确捕捉到了他微笑的瞬间。","examplePinyin":"Xiàngjī zhǔnquè bǔzhuōdào le tā wēixiào de shùnjiān.","translation":"카메라는 그가 웃는 순간을 정확하게 포착했다.","sourceNo":4834},{"no":229,"category":"시간·날짜","word":"岁数","pinyin":"suìshu","meaning":"나이","example":"别看他岁数不大，经验却很丰富。","examplePinyin":"Bié kàn tā suìshu búdà, jīngyàn què hěn fēngfù.","translation":"어린 나이에도 불구하고 풍부한 경험을 갖고 있다.","sourceNo":4848},{"no":230,"category":"시간·날짜","word":"岁月","pinyin":"suìyuè","meaning":"세월","example":"那段艰苦的岁月磨炼了他的意志。","examplePinyin":"Nà duàn jiānkǔ de suìyuè móliàn le tā de yìzhì.","translation":"그 어려운 시절이 그의 의지를 단련시켰습니다.","sourceNo":4849},{"no":231,"category":"시간·날짜","word":"往后","pinyin":"wǎnghòu","meaning":"앞으로, 이후","example":"往后的日子里，我们要更加努力。","examplePinyin":"Wǎnghòu de rìzi lǐ, wǒmen yào gèngjiā nǔlì.","translation":"앞으로 우리는 더 열심히 일해야 합니다.","sourceNo":4958},{"no":232,"category":"시간·날짜","word":"往年","pinyin":"wǎngnián","meaning":"지난 몇 년, 예년","example":"今年的销售额远远超过了往年。","examplePinyin":"Jīnnián de xiāoshòu'é yuǎnyuǎn chāoguò le wǎngnián.","translation":"올해 매출은 예년보다 훨씬 많았다.","sourceNo":4960},{"no":233,"category":"시간·날짜","word":"为期","pinyin":"wéiqī","meaning":"기한을 ~로 하다","example":"公司组织了一次为期三天的培训。","examplePinyin":"Gōngsī zǔzhī le yí cì wéiqī sān tiān de péixùn.","translation":"회사는 3일간의 교육을 조직했습니다.","sourceNo":4978},{"no":234,"category":"시간·날짜","word":"为止","pinyin":"wéizhǐ","meaning":"~까지","example":"到本周五为止，大家都可以提交报名申请。","examplePinyin":"Dào běn zhōuwǔ wéizhǐ, dàjiā dōu kěyǐ tíjiāo bàomíng shēnqǐng.","translation":"이번 금요일까지 누구나 참가 신청서를 낼 수 있어요.","sourceNo":4983},{"no":235,"category":"시간·날짜","word":"先前","pinyin":"xiānqián","meaning":"이전, 예전","example":"相比先前，他的态度有了很大改变。","examplePinyin":"Xiāngbǐ xiānqián, tā de tàidu yǒu le hěn dà gǎibiàn.","translation":"예전과 비교하면 태도가 많이 달라졌다.","sourceNo":5026},{"no":236,"category":"시간·날짜","word":"下旬","pinyin":"xiàxún","meaning":"하순","example":"他打算下个月下旬回国探亲。","examplePinyin":"Tā dǎsuàn xiàgeyuè xiàxún huíguó tànqīn.","translation":"그는 다음 달 말 중국으로 돌아가 친척들을 방문할 계획이다.","sourceNo":5043},{"no":237,"category":"시간·날짜","word":"一辈子","pinyin":"yíbèizi","meaning":"한평생","example":"她这一辈子都在从事教育工作。","examplePinyin":"Tā zhè yíbèizi dōu zài cóngshì jiàoyù gōngzuò.","translation":"그녀는 평생 교육 분야에서 일해 왔습니다.","sourceNo":5137},{"no":238,"category":"시간·날짜","word":"一贯","pinyin":"yíguàn","meaning":"일관된","example":"他做事一贯认真负责，从不马虎。","examplePinyin":"Tā zuòshì yíguàn rènzhēn fùzé, cóngbù mǎhu.","translation":"그는 언제나 진지하고 책임감 있게 일하며 소홀히 하지 않아요.","sourceNo":5146},{"no":239,"category":"시간·날짜","word":"依旧","pinyin":"yījiù","meaning":"여전히","example":"多年过去，他对家乡依旧十分怀念。","examplePinyin":"Duōnián guòqu, tā duì jiāxiāng yījiù shífēn huáiniàn.","translation":"수년이 지난 후에도 그는 여전히 고향을 몹시 그리워합니다.","sourceNo":5148},{"no":240,"category":"시간·날짜","word":"一口气","pinyin":"yìkǒuqì","meaning":"단숨에","example":"他一口气跑完了全程马拉松。","examplePinyin":"Tā yì kǒu qì pǎo wán le quánchéng mǎlāsōng.","translation":"그는 단번에 풀마라톤을 완주했다.","sourceNo":5149},{"no":241,"category":"시간·날짜","word":"一律","pinyin":"yílǜ","meaning":"일률적으로","example":"参赛选手一律要遵守比赛规则。","examplePinyin":"Cānsài xuǎnshǒu yílǜ yào zūnshǒu bǐsài guīzé.","translation":"모든 참가자는 대회 규정을 준수해야 합니다.","sourceNo":5152},{"no":242,"category":"시간·날짜","word":"一时","pinyin":"yìshí","meaning":"잠시, 한때","example":"他一时想不起对方的名字来。","examplePinyin":"Tā yìshí xiǎngbùqǐ duìfāng de míngzi lái.","translation":"그는 잠시 동안 상대방의 이름을 기억하지 못했습니다.","sourceNo":5176},{"no":243,"category":"시간·날짜","word":"以往","pinyin":"yǐwǎng","meaning":"과거, 지난날","example":"相比以往，他的成绩进步明显。","examplePinyin":"Xiāngbǐ yǐwǎng, tā de chéngjì jìnbù míngxiǎn.","translation":"예전에 비해 그의 성적은 눈에 띄게 좋아졌어요.","sourceNo":5179},{"no":244,"category":"시간·날짜","word":"一向","pinyin":"yíxiàng","meaning":"줄곧","example":"他一向乐于助人，深受同事喜爱。","examplePinyin":"Tā yíxiàng lèyú zhùrén, shēnshòu tóngshì xǐ'ài.","translation":"그는 항상 다른 사람들을 기꺼이 돕고 동료들로부터 좋은 평가를 받습니다.","sourceNo":5180},{"no":245,"category":"시간·날짜","word":"一再","pinyin":"yízài","meaning":"거듭, 재삼","example":"他一再叮嘱大家要注意行车安全。","examplePinyin":"Tā yízài dīngzhǔ dàjiā yào zhùyì xíngchē ānquán.","translation":"그는 모든 사람이 운전 안전에 유의할 것을 거듭 촉구했습니다.","sourceNo":5185},{"no":246,"category":"시간·날짜","word":"原先","pinyin":"yuánxiān","meaning":"원래, 애초","example":"原先他计划留在城市工作生活。","examplePinyin":"Yuánxiān tā jìhuà liú zài chéngshì gōngzuò shēnghuó.","translation":"원래 그는 도시에 머물면서 일하고 생활할 계획이었습니다.","sourceNo":5218},{"no":247,"category":"시간·날짜","word":"再三","pinyin":"zàisān","meaning":"재삼, 거듭","example":"临行前，母亲再三嘱咐他注意安全。","examplePinyin":"Línxíng qián, mǔqīn zàisān zhǔfù tā zhùyì ānquán.","translation":"떠나기 전 그의 어머니는 그에게 안전에 주의하라고 거듭 당부했다.","sourceNo":5243},{"no":248,"category":"시간·날짜","word":"终身","pinyin":"zhōngshēn","meaning":"종신의, 평생의","example":"这段经历将成为他终身难忘的回忆。","examplePinyin":"Zhè duàn jīnglì jiāng chéngwéi tā zhōngshēn nánwàng de huíyì.","translation":"이 경험은 그에게 결코 잊지 못할 추억이 될 것이다.","sourceNo":5329},{"no":249,"category":"시간·날짜","word":"钟头","pinyin":"zhōngtóu","meaning":"시간(한 시간)","example":"他在医院足足等了两个钟头。","examplePinyin":"Tā zài yīyuàn zúzú děng le liǎng ge zhōngtóu.","translation":"그는 병원에서 두 시간 동안 기다렸다.","sourceNo":5332},{"no":250,"category":"시간·날짜","word":"中旬","pinyin":"zhōngxún","meaning":"중순","example":"他打算下个月中旬去外地出差。","examplePinyin":"Tā dǎsuàn xiàgeyuè zhōngxún qù wàidì chūchāi.","translation":"그는 다음 달 중순에 출장을 갈 예정이다.","sourceNo":5334},{"no":251,"category":"시간·날짜","word":"周期","pinyin":"zhōuqī","meaning":"주기","example":"植物生长有其自身固定的周期规律。","examplePinyin":"Zhíwù shēngzhǎng yǒu qí zìshēn gùdìng de zhōuqī guīlǜ.","translation":"식물의 성장에는 고유한 고정 주기가 있습니다.","sourceNo":5340},{"no":252,"category":"시간·날짜","word":"总算","pinyin":"zǒngsuàn","meaning":"드디어, 마침내","example":"经过反复努力，他总算通过了考试。","examplePinyin":"Jīngguò fǎnfù nǔlì, tā zǒngsuàn tōngguò le kǎoshì.","translation":"거듭된 노력 끝에 그는 마침내 시험에 합격했다.","sourceNo":5390},{"no":253,"category":"학교·학습·언어","word":"必修","pinyin":"bìxiū","meaning":"필수 교과, 필수","example":"这门课是中文专业的必修课，非常重要。","examplePinyin":"Zhè mén kè shì Zhōngwén zhuānyè de bìxiūkè, fēicháng zhòngyào.","translation":"본 과목은 중국어 전공자에게 필수과목이며 매우 중요하다.","sourceNo":3660},{"no":254,"category":"학교·학습·언어","word":"补课","pinyin":"bǔkè","meaning":"보충 수업, 과외","example":"他正在给基础不好的学生补课，帮助他们提高。","examplePinyin":"Tā zhèngzài gěi jīchǔ bùhǎo de xuésheng bǔkè, bāngzhù tāmen tígāo.","translation":"그는 기초가 부족한 학생에게 보충 수업을 해 주며 실력 향상을 도와요.","sourceNo":3679},{"no":255,"category":"학교·학습·언어","word":"补习","pinyin":"bǔxí","meaning":"보충 학원, 과외","example":"他利用周末的时间去参加补习班。","examplePinyin":"Tā lìyòng zhōumò de shíjiān qù cānjiā bǔxíbān.","translation":"그는 주말을 이용해 학원에 다녔습니다.","sourceNo":3685},{"no":256,"category":"학교·학습·언어","word":"抄","pinyin":"chāo","meaning":"베끼다, 복사","example":"他抄了一份笔记，以便复习。","examplePinyin":"Tā chāo le yí fèn bǐjì, yǐbiàn fùxí.","translation":"그는 복습하려고 필기를 한 부 베꼈어요.","sourceNo":3737},{"no":257,"category":"학교·학습·언어","word":"成语","pinyin":"chéngyǔ","meaning":"성어, 속담","example":"“百发百中”是一个常用的成语。","examplePinyin":"“ bǎi fā bǎi zhōng ” shì yí ge chángyòng de chéngyǔ.","translation":"‘백발백중’은 자주 쓰는 성어예요.","sourceNo":3764},{"no":258,"category":"학교·학습·언어","word":"传授","pinyin":"chuánshòu","meaning":"전수하다, 가르치다","example":"老师傅正在向徒弟传授他的手艺。","examplePinyin":"Lǎoshīfu zhèngzài xiàng túdì chuánshòu tā de shǒuyì.","translation":"숙련된 스승이 제자에게 기술을 전수하고 있어요.","sourceNo":3797},{"no":259,"category":"학교·학습·언어","word":"初等","pinyin":"chūděng","meaning":"초등, 기초","example":"初等教育是孩子们成长的基础。","examplePinyin":"Chūděng jiàoyù shì háizimen chéngzhǎng de jīchǔ.","translation":"초등교육은 아이들의 성장을 위한 기초입니다.","sourceNo":3805},{"no":260,"category":"학교·학습·언어","word":"导师","pinyin":"dǎoshī","meaning":"지도교수, 멘토","example":"他是我的研究生导师，对我很照顾。","examplePinyin":"Tā shì wǒ de yánjiūshēng dǎoshī, duì wǒ hěn zhàogu.","translation":"그는 저의 대학원 지도교수이며 저를 잘 챙겨 주세요.","sourceNo":3874},{"no":261,"category":"학교·학습·언어","word":"等级","pinyin":"děngjí","meaning":"등급, 레벨","example":"等级考试的成绩将在下周公布。","examplePinyin":"Děngjí kǎoshì de chéngjì jiāng zài xiàzhōu gōngbù.","translation":"등급 시험의 성적은 다음 주에 발표돼요.","sourceNo":3883},{"no":262,"category":"학교·학습·언어","word":"定义","pinyin":"dìngyì","meaning":"정의, 정의","example":"请用清晰的语言给这个概念下定义。","examplePinyin":"Qǐng yòng qīngxī de yǔyán gěi zhè ge gàiniàn xiàdìngyì.","translation":"이 개념을 명확한 언어로 정의해 주십시오.","sourceNo":3910},{"no":263,"category":"학교·학습·언어","word":"辅导","pinyin":"fǔdǎo","meaning":"지도하다, 코치","example":"老师正在辅导学生写作业，很耐心。","examplePinyin":"Lǎoshī zhèngzài fǔdǎo xuésheng xiě zuòyè, hěn nàixīn.","translation":"교사는 학생들의 숙제를 돕고 있으며 매우 인내심을 갖고 있습니다.","sourceNo":4001},{"no":264,"category":"학교·학습·언어","word":"符号","pinyin":"fúhào","meaning":"기호, 부호","example":"在数学里，加减乘除等符号都有特定的含义。","examplePinyin":"Zài shùxué lǐ, jiā jiǎn chéngchú děng fúhào dōu yǒu tèdìng de hányì.","translation":"수학에서 덧셈, 뺄셈, 곱셈, 나눗셈과 같은 기호는 특정한 의미를 갖습니다.","sourceNo":4004},{"no":265,"category":"학교·학습·언어","word":"钢笔","pinyin":"gāngbǐ","meaning":"만년필, 펜","example":"他习惯用钢笔写字，觉得很有感觉。","examplePinyin":"Tā xíguàn yòng gāngbǐ xiězì, jué dehěn yǒu gǎnjué.","translation":"그는 만년필로 글 쓰는 데 익숙하고 그 느낌을 좋아해요.","sourceNo":4020},{"no":266,"category":"학교·학습·언어","word":"高等","pinyin":"gāoděng","meaning":"고등, 상급","example":"高等教育是培养专业人才的重要途径 ","example":"在开始讨论之前，我们先做一个假设。","examplePinyin":"Zài kāishǐ tǎolùn zhīqián, wǒmen xiān zuò yí ge jiǎshè.","translation":"논의를 시작하기 전에 가정을 하나 해보자.","sourceNo":4250},{"no":275,"category":"학교·학습·언어","word":"解","pinyin":"jiě","meaning":"풀다","example":"请大家认真思考并解答这道数学题。","examplePinyin":"Qǐng dàjiā rènzhēn sīkǎo bìng jiědá zhè dào shùxuétí.","translation":"잘 생각해 보시고 이 수학 문제에 답해 보세요.","sourceNo":4261},{"no":276,"category":"학교·학습·언어","word":"解答","pinyin":"jiědá","meaning":"답을 풀이하다","example":"做题遇到困难时，老师耐心地帮我解答。","examplePinyin":"Zuò tí yùdào kùnnan shí, lǎoshī nàixīn de bāng wǒ jiědá.","translation":"문제를 풀다 막히면 선생님이 차근차근 풀이를 도와주세요.","sourceNo":4265},{"no":277,"category":"학교·학습·언어","word":"解读","pinyin":"jiědú","meaning":"해독하다, 해석하다","example":"请你试着解读一下这段话背后的意思。","examplePinyin":"Qǐng nǐ shì zhe jiědú yíxià zhè duàn huà bèihòu de yìsi.","translation":"이 구절 뒤에 숨은 의미를 해독해 보시기 바랍니다.","sourceNo":4266},{"no":278,"category":"학교·학습·언어","word":"借鉴","pinyin":"jièjiàn","meaning":"본보기로 삼다, 참고하다","example":"写作时，我们不妨借鉴别人的成功经验。","examplePinyin":"Xiězuò shí, wǒmen bùfáng jièjiàn biéren de chénggōng jīngyàn.","translation":"글을 쓸 때, 우리는 다른 사람들의 성공적인 경험으로부터 배울 수도 있습니다.","sourceNo":4269},{"no":279,"category":"학교·학습·언어","word":"精通","pinyin":"jīngtōng","meaning":"정통하다, 통달하다","example":"经过多年学习，他已经精通三门外语。","examplePinyin":"Jīngguò duōnián xuéxí, tā yǐjīng jīngtōng sān mén wàiyǔ.","translation":"수년간의 공부 끝에 그는 세 가지 외국어에 능숙해졌습니다.","sourceNo":4301},{"no":280,"category":"학교·학습·언어","word":"就读","pinyin":"jiùdú","meaning":"재학하다","example":"他目前正在这所重点大学就读。","examplePinyin":"Tā mùqián zhèngzài zhè suǒ zhòngdiǎn dàxué jiùdú.","translation":"그는 현재 이 중점 대학에 재학 중이에요.","sourceNo":4322},{"no":281,"category":"학교·학습·언어","word":"纠正","pinyin":"jiūzhèng","meaning":"교정하다, 바로잡다","example":"老师耐心地帮我纠正了发音错误。","examplePinyin":"Lǎoshī nàixīn de bāng wǒ jiūzhèng le fāyīn cuòwù.","translation":"선생님은 제가 발음 오류를 바로잡도록 참을성 있게 도와주셨습니다.","sourceNo":4331},{"no":282,"category":"학교·학습·언어","word":"考察","pinyin":"kǎochá","meaning":"시찰하다, 답사하다","example":"专家组前往当地进行实地考察。","examplePinyin":"Zhuānjiāzǔ qiánwǎng dāngdì jìnxíng shídì kǎochá.","translation":"전문가팀이 현장점검을 위해 현지로 출동했습니다.","sourceNo":4374},{"no":283,"category":"학교·학습·언어","word":"考古","pinyin":"kǎogǔ","meaning":"고고학을 연구하다 / 고고학","example":"他大学时选择了考古专业学习。","examplePinyin":"Tā dàxué shí xuǎnzé le kǎogǔ zhuānyè xuéxí.","translation":"그는 대학에서 고고학을 공부하기로 결정했습니다.","sourceNo":4375},{"no":284,"category":"학교·학습·언어","word":"考核","pinyin":"kǎohé","meaning":"심사하다, 평가하다","example":"公司每季度都会对员工进行考核。","examplePinyin":"Gōngsī měijìdù dōu huì duì yuángōng jìnxíng kǎohé.","translation":"회사는 분기마다 직원을 평가합니다.","sourceNo":4376},{"no":285,"category":"학교·학습·언어","word":"考验","pinyin":"kǎoyàn","meaning":"시험하다, 시련을 주다","example":"这次疫情对每个人都是一次考验。","examplePinyin":"Zhè cì yìqíng duì měi ge rén dōu shì yí cì kǎoyàn.","translation":"이번 전염병은 모든 사람을 위한 시험입니다.","sourceNo":4377},{"no":286,"category":"학교·학습·언어","word":"科","pinyin":"kē","meaning":"과(학과·진료과)","example":"他因为牙疼去医院看了牙科。","examplePinyin":"Tā yīnwèi yáténg qù yīyuàn kàn le yákē.","translation":"그는 치통 때문에 치과 치료를 받으러 병원에 갔다.","sourceNo":4379},{"no":287,"category":"학교·학습·언어","word":"科目","pinyin":"kēmù","meaning":"과목","example":"这次考试一共有六门考试科目。","examplePinyin":"Zhè cì kǎoshì yígòng yǒu liù mén kǎoshì kēmù.","translation":"이번 시험에는 총 6과목이 출제됩니다.","sourceNo":4384},{"no":288,"category":"학교·학습·언어","word":"科普","pinyin":"kēpǔ","meaning":"과학을 보급하다","example":"这本杂志专门刊登科普类文章。","examplePinyin":"Zhè běn zázhì zhuānmén kāndēng kēpǔ lèi wénzhāng.","translation":"이 잡지는 대중 과학 기사를 전문으로 다루고 있습니다.","sourceNo":4386},{"no":289,"category":"학교·학습·언어","word":"课题","pinyin":"kètí","meaning":"과제","example":"他正在研究一个很有意义的课题。","examplePinyin":"Tā zhèngzài yánjiū yí ge hěn yǒu yìyì de kètí.","translation":"그는 매우 흥미로운 주제를 연구하고 있습니다.","sourceNo":4387},{"no":290,"category":"학교·학습·언어","word":"朗读","pinyin":"lǎngdú","meaning":"낭독하다","example":"每天早晨，同学们都要朗读课文。","examplePinyin":"Měi tiān zǎochén, tóngxuémen dōu yào lǎngdú kèwén.","translation":"매일 아침 학생들은 본문을 큰 소리로 읽었습니 eaning":"깨우쳐주다, 계발하다","example":"这本书带给了我很大的人生启发。","examplePinyin":"Zhè běn shū dàigěi le wǒ hěn dà de rénshēng qǐfā.","translation":"이 책은 나에게 인생에 큰 영감을 주었다.","sourceNo":4635},{"no":300,"category":"학교·학습·언어","word":"启示","pinyin":"qǐshì","meaning":"시사하다 / 시사점","example":"这个失败的经历给了他深刻的启示。","examplePinyin":"Zhè ge shībài de jīnglì gěi le tā shēnkè de qǐshì.","translation":"이 실패 경험은 그에게 깊은 영감을 주었다.","sourceNo":4659},{"no":301,"category":"학교·학습·언어","word":"区分","pinyin":"qūfēn","meaning":"구분하다","example":"老师教我们如何区分这两个近义词。","examplePinyin":"Lǎoshī jiāo wǒmen rúhé qūfēn zhè liǎng ge jìnyìcí.","translation":"선생님은 뜻이 비슷한 두 단어를 구별하는 법을 가르쳐 주세요.","sourceNo":4683},{"no":302,"category":"학교·학습·언어","word":"人工智能","pinyin":"réngōng zhìnéng","meaning":"인공지능","example":"人工智能技术正在深刻改变我们的生活。","examplePinyin":"Réngōngzhìnéng jìshù zhèngzài shēnkè gǎibiàn wǒmen de shēnghuó.","translation":"인공지능 기술은 우리 삶을 근본적으로 변화시키고 있습니다.","sourceNo":4694},{"no":303,"category":"학교·학습·언어","word":"入门","pinyin":"rùmén","meaning":"입문하다 / 입문","example":"这本教材专门为初学者提供入门指导。","examplePinyin":"Zhè běn jiàocái zhuānmén wèi chūxuézhě tígōng rùmén zhǐdǎo.","translation":"이 교재는 초보자를 위한 입문 지침을 제공하기 위해 고안되었습니다.","sourceNo":4720},{"no":304,"category":"학교·학습·언어","word":"声调","pinyin":"shēngdiào","meaning":"성조","example":"学习汉语时，声调的准确非常重要。","examplePinyin":"Xuéxí Hànyǔ shí, shēngdiào de zhǔnquè fēicháng zhòngyào.","translation":"중국어를 배울 때는 정확한 성조가 매우 중요해요.","sourceNo":4762},{"no":305,"category":"학교·학습·언어","word":"升学","pinyin":"shēngxué","meaning":"진학하다","example":"他今年顺利通过了升学考试。","examplePinyin":"Tā jīnnián shùnlì tōngguò le shēngxué kǎoshì.","translation":"그는 올해 입학시험에 성공적으로 합격했다.","sourceNo":4765},{"no":306,"category":"학교·학습·언어","word":"识","pinyin":"shí","meaning":"알다, 인식하다","example":"他从小接受教育，识字很多，也爱读书。","examplePinyin":"Tā cóngxiǎo jiēshòu jiàoyù, shízì hěn duō, yě ài dúshū.","translation":"그는 어려서부터 교육을 받아 글자를 많이 알고 독서도 좋아해요.","sourceNo":4776},{"no":307,"category":"학교·학습·언어","word":"示范","pinyin":"shìfàn","meaning":"시범을 보이다","e dìng cái zuìzhōng dìnggǎo.","translation":"이 교과서는 완성되기까지 많은 수정을 거쳤습니다.","sourceNo":5080},{"no":316,"category":"학교·학습·언어","word":"选修","pinyin":"xuǎnxiū","meaning":"선택 이수하다","example":"他这学期选修了一门心理学课程。","examplePinyin":"Tā zhè xuéqī xuǎnxiū le yì mén xīnlǐxué kèchéng.","translation":"그는 이번 학기에 심리학 수업을 듣고 있다.","sourceNo":5085},{"no":317,"category":"학교·학습·언어","word":"学会","pinyin":"xuéhuì","meaning":"학회","example":"他加入了本地的一个书法学会组织。","examplePinyin":"Tā jiārù le běnde de yí ge shūfǎ xuéhuì zǔzhī.","translation":"그는 지역 서예 학회에 가입했어요.","sourceNo":5088},{"no":318,"category":"학교·학습·언어","word":"学位","pinyin":"xuéwèi","meaning":"학위","example":"他经过多年努力终于获得了博士学位。","examplePinyin":"Tā jīngguò duōnián nǔlì zhōngyú huòdé le bóshì xuéwèi.","translation":"수년간의 노력 끝에 그는 마침내 박사 학위를 취득했습니다.","sourceNo":5089},{"no":319,"category":"학교·학습·언어","word":"学问","pinyin":"xuéwen","meaning":"학문","example":"老先生一生钻研历史，学问渊博。","examplePinyin":"Lǎoxiānsheng yishēng zuānyán lìshǐ, xuéwen yuānbó.","translation":"노신사는 평생 역사를 공부해 지식이 풍부하다.","sourceNo":5090},{"no":320,"category":"학교·학습·언어","word":"音节","pinyin":"yīnjié","meaning":"음절","example":"这个单词一共由三个音节组成。","examplePinyin":"Zhè ge dāncí yígòng yóu sān ge yīnjié zǔchéng.","translation":"이 단어는 총 3음절로 구성되어 있습니다.","sourceNo":5167},{"no":321,"category":"학교·학습·언어","word":"仪器","pinyin":"yíqì","meaning":"기기, 계기","example":"实验室新添置了一批精密仪器。","examplePinyin":"Shíyànshì xīn tiānzhì le yìpī jīngmì yíqì.","translation":"연구실에서는 새로운 정밀 기기를 구입했습니다.","sourceNo":5172},{"no":322,"category":"학교·학습·언어","word":"用功","pinyin":"yònggōng","meaning":"열심히 공부하다","example":"他学习一向十分用功，从不懈怠。","examplePinyin":"Tā xuéxí yíxiàng shífēn yònggōng, cóngbú xièdài.","translation":"그는 항상 열심히 공부했고 결코 게으르지 않았습니다.","sourceNo":5191},{"no":323,"category":"학교·학습·언어","word":"原理","pinyin":"yuánlǐ","meaning":"원리","example":"老师详细讲解了这台机器的工作原理。","examplePinyin":"Lǎoshī xiángxì jiǎngjiě le zhè tái jīqì de gōngzuò yuánlǐ.","translation":"선생님은 이 기계의 작동 원리를 자세히 설명하셨습니다.","sourceNo":5212},{"no":324,"category":"학교·학습·언어","word":"招生","pinyin":"zhāoshēng","meaning":"신입생을 모집하다","example":"学校今年扩大了招生规模，为学生提供更多机会。","examplePinyin":"Xuéxiào jīnnián kuòdà le zhāoshēng guīmó, wèi xuésheng tígōng gèng duō jīhuì.","translation":"학교는 올해 모집 규모를 늘려 학생들에게 기회를 더 제공해요.","sourceNo":5272},{"no":325,"category":"학교·학습·언어","word":"招收","pinyin":"zhāoshōu","meaning":"모집하다","example":"这所大学今年招收了不少留学生。","examplePinyin":"Zhè suǒ dàxué jīnnián zhāoshōu le bùshǎo liúxuésheng.","translation":"본 대학에는 올해 많은 유학생이 입학했습니다.","sourceNo":5274},{"no":326,"category":"학교·학습·언어","word":"专科","pinyin":"zhuānkē","meaning":"전문대 과정; 전문 분야","example":"他毕业于一所医学专科学校。","examplePinyin":"Tā bìyè yú yìsuǒ yīxué zhuānkē xuéxiào.","translation":"그는 의학 전문대 과정을 졸업했어요.","sourceNo":5349},{"no":327,"category":"직업·일과","word":"白领","pinyin":"báilǐng","meaning":"사무직","example":"他是一家公司的白领，工作很体面。","examplePinyin":"Tā shì yìjiā gōngsī de báilǐng, gōngzuò hěn tǐmiàn.","translation":"그는 회사의 사무직 직원이고 괜찮은 직업을 가지고 있습니다.","sourceNo":3613},{"no":328,"category":"직업·일과","word":"暴力","pinyin":"bàolì","meaning":"폭력, 난폭","example":"家庭暴力是法律所禁止的行为。","examplePinyin":"Jiātíng bàolì shì fǎlǜ suǒ jìnzhǐ de xíngwéi.","translation":"가정폭력은 법으로 금지되어 있습니다.","sourceNo":3627},{"no":329,"category":"직업·일과","word":"保障","pinyin":"bǎozhàng","meaning":"보장하다,보장,보증","example":"社会保障体系的建设让老百姓老有所依。","examplePinyin":"Shèhuì bǎozhàng tǐxì de jiànshè ràng lǎobǎixìng lǎo yǒusuǒ yī.","translation":"사회보장제도가 건설되면 사람들은 노후에도 의지할 곳을 갖게 된다.","sourceNo":3633},{"no":330,"category":"직업·일과","word":"兵","pinyin":"bīng","meaning":"병사, 병력","example":"他立志成为一名优秀的特种兵。","examplePinyin":"Tā lìzhì chéngwéi yì míng yōuxiù de tèzhǒngbīng.","translation":"그는 뛰어난 특수부대원이 되는 것을 꿈꾼다.","sourceNo":3658},{"no":331,"category":"직업·일과","word":"补偿","pinyin":"bǔcháng","meaning":"보상하다, 배상","example":"他因为工伤，公司给了他一定的经济补偿。","examplePinyin":"Tā yīnwèi gōngshāng, gōngsī gěi le tā yídìng de jīngjì bǔcháng.","translation":"업무상 부상으로 인해 회사는 그에게 일정 금액의 금전적 보상을 지급했습니다.","sourceNo":3673},{"no":332,"category":"직업·일과","word":"部队","pinyin":"bùduì","meaning":"군대, 부대","example":"一支英勇的部队正在前线抵抗敌人。","examplePinyin":"Yì zhī yīngyǒng de bùduì zhèngzài qiánxiàn dǐkàng dírén.","translation":"영웅적인 군대가 최전선에서 적에게 저항하고 있습니다.","sourceNo":3676},{"no":333,"category":"직업·일과","word":"补贴","pinyin":"bǔtiē","meaning":"보조금, 수당","example":"公司会给外派员工一定的生活补贴。","examplePinyin":"Gōngsī huì gěi wàipài yuángōng yídìng de shēnghuó bǔtiē.","translation":"회사는 외지에 파견된 직원에게 생활 보조금을 지급해요.","sourceNo":3683},{"no":334,"category":"직업·일과","word":"财务","pinyin":"cáiwù","meaning":"재무, 회계","example":"公司的财务状况良好，没有负债。","examplePinyin":"Gōngsī de cáiwù zhuàngkuàng liánghǎo, méiyǒu fùzhài.","translation":"회사의 재무상태는 건전하고 부채도 없습니다.","sourceNo":3704},{"no":335,"category":"직업·일과","word":"策划","pinyin":"cèhuà","meaning":"기획하다, 계획","example":"团队正在策划一个大型的宣传活动。","examplePinyin":"Tuánduì zhèngzài cèhuà yī ge dàxíng de xuānchuán huódòng.","translation":"팀은 대규모 홍보 캠페인을 계획하고 있습니다.","sourceNo":3712},{"no":336,"category":"직업·일과","word":"策略","pinyin":"cèlüè","meaning":"전략, 책략","example":"面对强大的对手，我们需要制定合理的策略。","examplePinyin":"Miànduì qiángdà de duìshǒu, wǒmen xūyào zhìdìng hélǐ de cèlüè.","translation":"강력한 상대를 만나려면 합리적인 전략을 세워야 합니다.","sourceNo":3714},{"no":337,"category":"직업·일과","word":"产出","pinyin":"chǎnchū","meaning":"산출하다, 생산하다","example":"这家工厂的产出非常高，效益很好。","examplePinyin":"Zhè jiā gōngchǎng de chǎnchū fēicháng gāo, xiàoyì hěn hǎo.","translation":"이 공장의 생산량은 매우 높으며 효율성도 매우 좋습니다.","sourceNo":3719},{"no":338,"category":"직업·일과","word":"厂家","pinyin":"chǎngjiā","meaning":"제조업체, 공장","example":"这家厂家生产的食品质量有保障。","examplePinyin":"Zhè jiā chǎngjiā shēngchǎn de shípǐn zhìliàng yǒu bǎozhàng.","translation":"이 제조업체가 생산하는 식품의 품질은 보장됩니다.","sourceNo":3728},{"no":339,"category":"직업·일과","word":"厂商","pinyin":"chǎngshāng","meaning":"제조사, 상사","example":"这个厂商的信誉很好，大家都很信任。","examplePinyin":"Zhè ge chǎngshāng de xìnyù hěn hǎo, dàjiā dōu hěn xìnrèn.","translation":"이 제조업체는 매우 좋은 평판을 갖고 있으며 모두가 이를 신뢰합니다.","sourceNo":3732},{"no":340,"category":"직업·일과","word":"承办","pinyin":"chéngbàn","meaning":"주관하다, 맡다","example":"这次活动由我们公司承办，大家都很重视。","examplePinyin":"Zhè cì huódòng yóu wǒmen gōngsī chéngbàn, dàjiā dōu hěn zhòngshì.","translation":"이 행사는 우리 회사에서 주최하며 모두가 이를 매우 중요하게 생각합니다.","sourceNo":3754},{"no":341,"category":"직업·일과","word":"惩罚","pinyin":"chéngfá","meaning":"처벌, 벌","example":"交通违法会面临罚款等惩罚。","examplePinyin":"Jiāotōng wéifǎ huì miànlín fákuǎn děng chéngfá.","translation":"교통 위반은 벌금 등의 처벌을 받게 됩니다.","sourceNo":3755},{"no":342,"category":"직업·일과","word":"撤销","pinyin":"chèxiāo","meaning":"취소하다, 철회하다","example":"由于证据不足，法院撤销了对他的指控。","examplePinyin":"Yóuyú zhèngjù bùzú, fǎyuàn chèxiāo le duì tā de zhǐkòng.","translation":"법원은 증거불충분으로 그에 대한 혐의를 기각했다.","sourceNo":3768},{"no":343,"category":"직업·일과","word":"创办","pinyin":"chuàngbàn","meaning":"창설하다, 설립하다","example":"他创办了一家科技公司，发展很快。","examplePinyin":"Tā chuàngbàn le yìjiā kējì gōngsī, fāzhǎn hěn kuài.","translation":"그는 빠르게 성장하는 기술 회사를 설립했습니다.","sourceNo":3789},{"no":344,"category":"직업·일과","word":"创建","pinyin":"chuàngjiàn","meaning":"창건하다, 만들다","example":"我们要创建和谐文明的社区环境。","examplePinyin":"Wǒmen yào chuàngjiàn héxié wénmíng de shèqū huánjìng.","translation":"우리는 조화롭고 문명화된 지역사회 환경을 만들고 싶습니다.","sourceNo":3790},{"no":345,"category":"직업·일과","word":"创立","pinyin":"chuànglì","meaning":"설립하다, 세우다","example":"这个基金会是多年前创立的。","examplePinyin":"Zhè ge jījīnhuì shì duōnián qián chuànglì de.","translation":"이 재단은 수년 전에 만들어졌습니다.","sourceNo":3792},{"no":346,"category":"직업·일과","word":"传真","pinyin":"chuánzhēn","meaning":"팩스, 전송","example":"请把这份文件通过传真发给我。","examplePinyin":"Qǐng bǎ zhè fèn wénjiàn tōngguò chuánzhēn fāgěi wǒ.","translation":"이 문서를 나에게 팩스로 보내주세요.","sourceNo":3799},{"no":347,"category":"직업·일과","word":"处罚","pinyin":"chǔfá","meaning":"처벌, 벌하다","example":"违反规定会面临严厉的处罚。","examplePinyin":"Wéifǎn guīdìng huì miànlín yánlì de chǔfá.","translation":"규칙을 위반하면 심각한 처벌을 받게 됩니다.","sourceNo":3806},{"no":348,"category":"직업·일과","word":"从业","pinyin":"cóngyè","meaning":"업계, 직업에 종사하다","example":"他在教育领域从业多年，积累了丰富的经验。","examplePinyin":"Tā zài jiàoyù lǐngyù cóngyè duōnián, jīlěi le fēngfù de jīngyàn.","translation":"그는 교육 분야에 오랫동안 종사하며 풍부한 경험을 쌓았어요.","sourceNo":3825},{"no":349,"category":"직업·일과","word":"大臣","pinyin":"dàchén","meaning":"대신, 고관","example":"在朝中，他是皇帝信任的大臣。","examplePinyin":"Zài cháo zhōng, tā shì huángdì xìnrèn de dàchén.","translation":"궁정에서 그는 황제가 신뢰하는 대신이었습니다.","sourceNo":3835},{"no":350,"category":"직업·일과","word":"代理","pinyin":"dàilǐ","meaning":"대리, 대행","example":"他现在是公司的代理经理，负责日常事务。","examplePinyin":"Tā xiànzài shì gōngsī de dàilǐ jīnglǐ, fùzé rìcháng shìwù.","translation":"그는 현재 회사의 대리 관리자이며 일상적인 업무를 담당하고 있습니다.","sourceNo":3848},{"no":351,"category":"직업·일과","word":"打卡","pinyin":"dǎkǎ","meaning":"출근 기록을 찍다, 체크인","example":"他每天上班都要在公司打卡签到。","examplePinyin":"Tā měi tiān shàngbān dōu yào zài gōngsī dǎkǎ qiāndào.","translation":"그는 출근할 때마다 회사에서 출근 기록을 찍어야 해요.","sourceNo":3852},{"no":352,"category":"직업·일과","word":"档案","pinyin":"dàng'àn","meaning":"서류, 파일","example":"请把这个人的档案调出来，我们需要查看一下。","examplePinyin":"Qǐng bǎ zhè ge rén de dàng'àn diào chūlai, wǒmen xūyào chákàn yíxià.","translation":"이 사람의 기록 서류를 꺼내 주세요. 확인해야 해요.","sourceNo":3857},{"no":353,"category":"직업·일과","word":"当选","pinyin":"dāngxuǎn","meaning":"당선되다, 선출되다","example":"他在这次选举中当选为社区代表。","examplePinyin":"Tā zài zhè cì xuǎnjǔ zhōng dāngxuǎn wèi shèqū dàibiǎo.","translation":"그는 이번 선거에서 지역 대표로 당선되었어요.","sourceNo":3865},{"no":354,"category":"직업·일과","word":"大使","pinyin":"dàshǐ","meaning":"대사, 사절","example":"中国驻外大使代表国家处理外交事务。","examplePinyin":"Zhōngguó zhùwài dàshǐ dàibiǎo guójiā chǔlǐ wàijiāo shìwù.","translation":"중국 대사는 외교 업무를 처리할 때 국가를 대표합니다.","sourceNo":3876},{"no":355,"category":"직업·일과","word":"打仗","pinyin":"dǎzhàng","meaning":"전쟁, 싸움","example":"在古代，人们打仗用的都是冷兵器。","examplePinyin":"Zài gǔdài, rénmen dǎzhàng yòng de dōu shì lěngbīngqì.","translation":"옛날 전쟁에서는 주로 칼과 창 같은 무기를 사용했어요.","sourceNo":3880},{"no":356,"category":"직업·일과","word":"电力","pinyin":"diànlì","meaning":"전력, 동력","example":"这座城市的电力供应很充足，很少停电。","examplePinyin":"Zhè zuò chéngshì de diànlì gōngyìng hěn chōngzú, hěn shǎo tíngdiàn.","translation":"도시의 전력 공급은 풍부하고 정전은 거의 발생하지 않습니다.","sourceNo":3890},{"no":357,"category":"직업·일과","word":"调动","pinyin":"diàodòng","meaning":"이동시키다, 전근","example":"公司正在调动各部门的人员，支援一线。","examplePinyin":"Gōngsī zhèngzài diàodòng gè bùmén de rényuán, zhīyuán yíxiàn.","translation":"회사는 일선 지원을 위해 다양한 부서의 인력을 동원하고 있다.","sourceNo":3897},{"no":358,"category":"직업·일과","word":"法定","pinyin":"fǎdìng","meaning":"법정, 법률","example":"这些是他的法定权利，受法律保护。","examplePinyin":"Zhèxiē shì tā de fǎdìng quánlì, shòu fǎlǜ bǎohù.","translation":"이는 그의 법적 권리이며 법으로 보호됩니다.","sourceNo":3952},{"no":359,"category":"직업·일과","word":"法官","pinyin":"fǎguān","meaning":"법관, 판사","example":"法官宣布了最终的判决结果。","examplePinyin":"Fǎguān xuānbù le zuìzhōng de pànjué jiēguǒ.","translation":"판사는 최종 판결을 발표했습니다.","sourceNo":3955},{"no":360,"category":"직업·일과","word":"法规","pinyin":"fǎguī","meaning":"법규, 규정","example":"我们应当遵守国家的法律法规。","examplePinyin":"Wǒmen yīngdāng zūnshǒu guójiā de fǎlǜ fǎguī.","translation":"우리는 해당 국가의 법률과 규정을 준수해야 합니다.","sourceNo":3957},{"no":361,"category":"직업·일과","word":"反馈","pinyin":"fǎnkuì","meaning":"피드백을 하다 (받다)","example":"对于客户的意见，我们要及时给予反馈。","examplePinyin":"Duìyú kèhù de yìjiàn, wǒmen yào jíshí jǐyǔ fǎnkuì.","translation":"우리는 고객의 의견을 적시에 피드백해야 합니다.","sourceNo":3969},{"no":362,"category":"직업·일과","word":"分工","pinyin":"fēngōng","meaning":"분업, 분업","example":"团队内部要进行合理分工，提高工作效率。","examplePinyin":"Tuánduì nèibù yào jìnxíng hélǐ fēngōng, tígāo gōngzuò xiàolǜ.","translation":"업무 효율성을 높이기 위해서는 팀 내에서 합리적인 분업이 이루어져야 합니다.","sourceNo":3988},{"no":363,"category":"직업·일과","word":"副2","pinyin":"fù","meaning":"부(副), 차석","example":"他是我的副手，在我出差时会帮我处理工作。","examplePinyin":"Tā shì wǒ de fùshǒu, zài wǒ chūchāi shí huì bāng wǒ chǔlǐ gōngzuò.","translation":"그는 제 보좌역으로, 제가 출장 가면 업무를 도와줘요.","sourceNo":3999},{"no":364,"category":"직업·일과","word":"福利","pinyin":"fúlì","meaning":"복지, 후생","example":"社会福利制度需要不断完善，保障弱势群体。","examplePinyin":"Shèhuì fúlì zhìdù xūyào búduàn wánshàn, bǎozhàng ruòshì qúntǐ.","translation":"취약계층을 보호하기 위해서는 사회복지제도를 지속적으로 개선해야 한다.","sourceNo":4006},{"no":365,"category":"직업·일과","word":"岗位","pinyin":"gǎngwèi","meaning":"직무; 일자리","example":"他在公司的重要岗位上工作，责任重大。","examplePinyin":"Tā zài gōngsī de zhòngyào gǎngwèi shàng gōngzuò, zérèn zhòngdà.","translation":"그는 회사에서 중요한 위치에 있으며 막중한 책임을 맡고 있습니다.","sourceNo":4022},{"no":366,"category":"직업·일과","word":"革命","pinyin":"gémìng","meaning":"혁명, 혁명","example":"工业革命极大地推动了人类社会的进步。","examplePinyin":"Gōngyè gémìng jídà dì tuīdòng le rénlèi shèhuì de jìnbù.","translation":"산업혁명은 인류사회의 발전을 크게 촉진시켰다.","sourceNo":4044},{"no":367,"category":"직업·일과","word":"公安","pinyin":"gōng'ān","meaning":"공안, 경찰","example":"他拨打了公安报警电话。","examplePinyin":"Tā bōdǎ le gōng'ān bàojǐng diànhuà.","translation":"그는 경찰에 전화했습니다.","sourceNo":4051},{"no":368,"category":"직업·일과","word":"工地","pinyin":"gōngdì","meaning":"공사장, 건설 현장","example":"建筑工地上，工人们正在忙碌地工作。","examplePinyin":"Jiànzhù gōngdì shang, gōngrénmen zhèngzài mánglù de gōngzuò.","translation":"건설현장에서는 근로자들이 분주하게 일하고 있습니다.","sourceNo":4052},{"no":369,"category":"직업·일과","word":"公告","pinyin":"gōnggào","meaning":"공고, 발표","example":"公司发布了一则重要公告，请全体员工注意。","examplePinyin":"Gōngsī fābù le yìzé zhòngyào gōnggào, qǐng quántǐ yuángōng zhùyì.","translation":"회사가 중요한 공고를 냈으니 직원 모두 확인해 주세요.","sourceNo":4054},{"no":370,"category":"직업·일과","word":"公民","pinyin":"gōngmín","meaning":"공민, 시민","example":"每位公民都应当依法行使权利，履行义务。","examplePinyin":"Měi wèi gōngmín dōu yīngdāng yīfǎ xíngshǐ quánlì, lǚxíng yìwù.","translation":"모든 시민은 법에 따라 권리를 행사하고 의무를 이행해야 해요.","sourceNo":4060},{"no":371,"category":"직업·일과","word":"工序","pinyin":"gōngxù","meaning":"공정, 절차","example":"生产一件衣服需要经过很多道工序。","examplePinyin":"Shēngchǎn yí jiàn yīfu xūyào jīngguò hěn duō dào gōngxù.","translation":"옷 한 벌을 생산하려면 많은 공정이 필요합니다.","sourceNo":4063},{"no":372,"category":"직업·일과","word":"公益","pinyin":"gōngyì","meaning":"공익, 공공 이익","example":"他积极参加各种公益活动，回报社会。","examplePinyin":"Tā jījí cānjiā gèzhǒng gōngyì huódòng, huíbào shèhuì.","translation":"그는 다양한 자선 활동에 적극적으로 참여하고 사회에 보답합니다.","sourceNo":4064},{"no":373,"category":"직업·일과","word":"供应","pinyin":"gōngyìng","meaning":"공급, 조달","example":"这次的医疗物资供应很及时，保障了需求。","examplePinyin":"Zhè cì de yīliáo wùzī gōngyìng hěn jíshí, bǎozhàng le xūqiú.","translation":"이번 의료용품 공급은 매우 시의적절하여 수요를 충족시켰습니다.","sourceNo":4065},{"no":374,"category":"직업·일과","word":"官","pinyin":"guān","meaning":"관리, 벼슬아치","example":"他从小立志长大后要成为一名清廉的官。","examplePinyin":"Tā cóngxiǎo lìzhì zhǎngdà hòu yào chéngwéi yì míng qīnglián de guān.","translation":"그는 자라서 정직한 관리가 되겠다고 결심했습니다.","sourceNo":4076},{"no":375,"category":"직업·일과","word":"官方","pinyin":"guānfāng","meaning":"공식적인; 당국의","example":"这是政府昨天刚刚发布的官方消息。","examplePinyin":"Zhè shì zhèngfǔ zuótiān gānggāng fābù de guānfāng xiāoxi.","translation":"어제 정부가 발표한 공식 소식입니다.","sourceNo":4079},{"no":376,"category":"직업·일과","word":"官员","pinyin":"guānyuán","meaning":"관료, 공무원","example":"他工作勤恳，如今已是一名政府官员。","examplePinyin":"Tā gōngzuò qínkěn, rújīn yǐ shì yì míng zhèngfǔ guānyuán.","translation":"그는 열심히 일했고 지금은 공무원이 되었습니다.","sourceNo":4085},{"no":377,"category":"직업·일과","word":"规范","pinyin":"guīfàn","meaning":"규범, 표준 / 규범적이다 / 규범화하다","example":"公司要求所有员工都按规范做事。","examplePinyin":"Gōngsī yāoqiú suǒyǒu yuángōng dōu àn guīfàn zuòshì.","translation":"회사는 모든 직원이 규정에 따라 근무할 것을 요구합니다.","sourceNo":4092},{"no":378,"category":"직업·일과","word":"规划","pinyin":"guīhuà","meaning":"계획, 기획 / 계획하다","example":"政府为这座城市做了详细的规划。","examplePinyin":"Zhèngfǔ wèi zhè zuò chéngshì zuò le xiángxì de guīhuà.","translation":"정부는 도시에 대한 세부 계획을 세웠습니다.","sourceNo":4093},{"no":379,"category":"직업·일과","word":"规矩","pinyin":"guīju","meaning":"규칙 / 단정하다, 예의 바르다","example":"做任何事情都要遵守应有的规矩。","examplePinyin":"Zuò rènhé shìqing dōu yào zūnshǒu yīngyǒu de guīju.","translation":"무엇을 하든지 적절한 규칙을 따라야 합니다.","sourceNo":4095},{"no":380,"category":"직업·일과","word":"国旗","pinyin":"guóqí","meaning":"국기","example":"广场中央高高地飘扬着一面国旗。","examplePinyin":"Guǎngchǎng zhōngyāng gāogāode piāoyáng zhe yímiàn guóqí.","translation":"광장 중앙에는 국기가 높이 휘날리고 있었습니다.","sourceNo":4104},{"no":381,"category":"직업·일과","word":"国情","pinyin":"guóqíng","meaning":"국가 실정, 국정","example":"我们应该多了解自己国家的国情。","examplePinyin":"Wǒmen yīnggāi duō liǎojiě zìjǐ guójiā de guóqíng.","translation":"우리는 우리나라의 국내 실정을 더 잘 알아야 합니다.","sourceNo":4105},{"no":382,"category":"직업·일과","word":"号召","pinyin":"hàozhào","meaning":"호소하다","example":"政府号召大家节约用水，保护环境。","examplePinyin":"Zhèngfǔ hàozhào dàjiā jiéyuē yòng shuǐ, bǎohù huánjìng.","translation":"정부는 모든 사람에게 물을 절약하고 환경을 보호할 것을 촉구합니다.","sourceNo":4136},{"no":383,"category":"직업·일과","word":"合并","pinyin":"hébìng","meaning":"합병하다","example":"为了扩大规模，两家公司决定合并。","examplePinyin":"Wèile kuòdà guīmó, liǎngjiā gōngsī juédìng hébìng.","translation":"확장을 위한 노력의 일환으로 두 회사는 합병을 결정했습니다.","sourceNo":4137},{"no":384,"category":"직업·일과","word":"和平","pinyin":"hépíng","meaning":"평화","example":"全世界人民都渴望持久的和平。","examplePinyin":"Quánshìjiè rénmín dōu kěwàng chíjiǔ de hépíng.","translation":"전 세계 사람들은 지속적인 평화를 갈망하고 있습니다.","sourceNo":4146},{"no":385,"category":"직업·일과","word":"皇帝","pinyin":"huángdì","meaning":"황제","example":"古代有很多皇帝一心追求长生不老。","examplePinyin":"Gǔdài yǒu hěn duō huángdì yìxīn zhuīqiú chángshēng bù lǎo.","translation":"고대에는 불멸을 추구한 황제들이 많았습니다.","sourceNo":4168},{"no":386,"category":"직업·일과","word":"汇报","pinyin":"huìbào","meaning":"보고하다","example":"开会的时候，他向经理汇报了工作进展。","examplePinyin":"Kāihuì de shíhou, tā xiàng jīnglǐ huìbào le gōngzuò jìnzhǎn.","translation":"회의 중에 그는 자신의 업무 진행 상황을 상사에게 보고했습니다.","sourceNo":4181},{"no":387,"category":"직업·일과","word":"会见","pinyin":"huìjiàn","meaning":"회견하다, 만나다","example":"国家元首在人民大会堂会见了外国代表。","examplePinyin":"Guójiā yuánshǒu zài rénmín dà huìtáng huìjiàn le wàiguó dàibiǎo.","translation":"국가 원수는 인민대회당에서 외국 대표들을 만났습니다.","sourceNo":4185},{"no":388,"category":"직업·일과","word":"监督","pinyin":"jiāndū","meaning":"감독하다","example":"工地上安排了专人监督工程质量。","examplePinyin":"Gōngdì shang ānpái le zhuānrén jiāndū gōngchéng zhìliàng.","translation":"프로젝트 품질을 감독하기 위해 건설 현장에 특별
