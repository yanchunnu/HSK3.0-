<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 3.0 5급 음원 학습</title>
  <style>
    :root { --blue:#245eb4; --deep:#102a43; --line:#d5e3f5; --soft:#f1f6fe; --accent:#dceaff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#f5f9ff; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .gradeLinks { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:9px; font-size:13px; }
    .gradeLinks a {color:var(--blue); font-weight:700; text-underline-offset:3px;}
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f1f6fe; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#dceaff; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #3576cd; background:#f1f6ff; box-shadow:0 0 0 5px #3576cd1c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#caddfa; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>
</head>
<body>
<!-- mobile playback controls v2 -->
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>HSK 3.0 5급 음원 학습</h1><div class="sub">검수한 5급 1600단어 · 단어와 예문을 듣고 반복 학습하세요.</div><nav class="gradeLinks"><a href="level4.html">4급 복습하기</a><a href="HSK3.0_5급단어장_표지포함.pdf" download>5급 PDF 내려받기</a></nav></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="번호·한자·병음·뜻 검색">
      <label>단어 <select id="wordRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>예문 <select id="sentenceRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>속도 <select id="speechRate"><option value="0.55">매우 느리게</option><option value="0.68">느리게</option><option value="0.78" selected>학습 속도</option><option value="0.9">조금 빠르게</option><option value="1">보통</option><option value="1.15">빠르게</option><option value="1.3">매우 빠르게</option></select></label>
      <button class="toggle on" id="pinyinToggle" type="button">병음 보임</button>
      <button class="toggle on" id="meaningToggle" type="button">뜻 보임</button>
      <button class="toggle on" id="translationToggle" type="button">해석 보임</button>
    </div>
    <div class="batch">
      <label class="startControl">시작 번호 <input id="startNo" type="number" min="1" max="1600" value="1"></label>
      <button type="button" id="playAllWords">▶ 선택 번호부터 단어</button>
      <button type="button" id="playAllSentences">▶ 선택 번호부터 예문</button>
      <button type="button" id="playAllBoth">▶ 선택 번호부터 단어+예문</button>
      <button type="button" class="pause" id="pauseResume" disabled>Ⅱ 일시정지</button>
      <button type="button" class="stop" id="stopAll">■ 재생 멈춤</button>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>
<div class="status" id="status"></div>
<button class="toTop" id="toTop" type="button" aria-label="맨 위로 가기" title="맨 위로 가기">↑</button>
<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"唉","pinyin":"ài","meaning":"아이고, 에휴","example":"唉，要是早点听取建议，就不会走弯路了。","examplePinyin":"Ài, yàoshi zǎodiǎn tīngqǔ jiànyì, jiù búhuì zǒuwānlù le.","translation":"에휴, 진작 조언을 들었다면 시행착오를 겪지 않았을 텐데요."},{"no":2,"category":"인사·사람·대명사","word":"哎","pinyin":"āi","meaning":"아이, 어이","example":"哎，前面的路正在施工，请从右边绕过去。","examplePinyin":"Āi, qiánmiàn de lù zhèngzài shīgōng, qǐng cóng yòubian ràoguòqu.","translation":"저기요, 앞길이 공사 중이니 오른쪽으로 돌아가세요."},{"no":3,"category":"인사·사람·대명사","word":"哎呀","pinyin":"āiyā","meaning":"아이고, 어머나","example":"哎呀，光顾着讨论方案，竟然忘了开会时间。","examplePinyin":"Āiyā, guānggù zhe tǎolùn fāng'àn, jìngrán wàng le kāihuì shíjiān.","translation":"아이고, 방안을 논의하느라 회의 시간을 잊어버렸네요."},{"no":4,"category":"인사·사람·대명사","word":"恭喜","pinyin":"gōngxǐ","meaning":"축하하다, 축하","example":"恭喜你完成这项挑战，愿你继续保持探索的热情。","examplePinyin":"Gōngxǐ nǐ wánchéng zhè xiàng tiǎozhàn, yuàn nǐ jìxù bǎochí tànsuǒ de rèqíng.","translation":"이 도전을 완수한 것을 축하하며 앞으로도 탐구의 열정을 간직하길 바라요."},{"no":5,"category":"인사·사람·대명사","word":"光临","pinyin":"guānglín","meaning":"방문하다, 찾아오다","example":"欢迎各位光临展览，工作人员将提供免费讲解。","examplePinyin":"Huānyíng gèwèi guānglín zhǎnlǎn, gōngzuò rényuán jiāng tígōng miǎnfèi jiǎngjiě.","translation":"전시에 오신 여러분을 환영하며 직원이 무료 해설을 제공해요."},{"no":6,"category":"인사·사람·대명사","word":"贵姓","pinyin":"guìxìng","meaning":"성(姓)을 묻는 높임말","example":"请问您贵姓？我核对一下今天的访客名单。","examplePinyin":"Qǐngwèn nín guìxìng? Wǒ héduì yíxià jīntiān de fǎngkè míngdān.","translation":"실례지만 성이 어떻게 되세요? 오늘 방문자 명단을 확인할게요."},{"no":7,"category":"인사·사람·대명사","word":"哈","pinyin":"hā","meaning":"아, (탄성)","example":"哈，原来问题出在这里，难怪刚才一直没成功。","examplePinyin":"Hā, yuánlái wèntí chū zài zhèlǐ, nánguài gāngcái yìzhí méi chénggōng.","translation":"아하, 문제가 여기 있었군요. 어쩐지 아까 계속 안 되더라니요."},{"no":8,"category":"인사·사람·대명사","word":"哦","pinyin":"ò","meaning":"아, (감탄사)","example":"哦，原来这份资料还有更新版本，难怪数据不同。","examplePinyin":"Ò, yuánlái zhè fèn zīliào háiyǒu gēngxīn bǎnběn, nánguài shùjù bùtóng.","translation":"아, 이 자료에 갱신판이 있었군요. 어쩐지 수치가 다르더라니요."},{"no":9,"category":"인사·사람·대명사","word":"握手","pinyin":"wòshǒu","meaning":"악수, 손잡기","example":"讨论结束后，双方握手，表示愿意继续沟通。","examplePinyin":"Tǎolùn jiéshù hòu, shuāngfāng wòshǒu, biǎoshì yuànyì jìxù gōutōng.","translation":"논의를 마친 뒤 양측은 악수하며 대화를 이어 가겠다고 했어요."},{"no":10,"category":"인사·사람·대명사","word":"呀","pinyin":"yā","meaning":"야, 아이고(감탄사)","example":"呀，原来你就是写那篇调查报告的人！","examplePinyin":"Yā, yuánlái nǐ jiùshì xiě nà piān diàochá bàogào de rén!","translation":"아, 그 조사 보고서를 쓰신 분이 바로 당신이군요!"},{"no":11,"category":"인사·사람·대명사","word":"一路顺风","pinyin":"yílù-shùnfēng","meaning":"여행길이 순조롭기를, 잘 다녀오세요","example":"祝你一路顺风，到了以后记得告诉大家。","examplePinyin":"Zhù nǐ yílùshùnfēng, dào le yǐhòu jìde gàosu dàjiā.","translation":"여행길이 순조롭기를 바라며 도착하면 모두에게 알려 주세요."},{"no":12,"category":"인사·사람·대명사","word":"迎","pinyin":"yíng","meaning":"맞이하다, 영접하다","example":"看到老同学走进院子，他连忙迎上前去。","examplePinyin":"Kàndào lǎotóngxué zǒujìn yuànzi, tā liánmáng yíng shàng qiánqù.","translation":"옛 친구가 마당에 들어오는 것을 보자 그는 급히 마중 나갔어요."},{"no":13,"category":"인사·사람·대명사","word":"迎接","pinyin":"yíngjiē","meaning":"맞이하다, 마중하다","example":"村民们准备好热茶，迎接远道而来的客人。","examplePinyin":"Cūnmínmen zhǔnbèi hǎo rèchá, yíngjiē yuǎn dào ér lái de kèrén.","translation":"주민들은 따뜻한 차를 준비해 멀리서 온 손님을 맞이했어요."},{"no":14,"category":"인사·사람·대명사","word":"成人","pinyin":"chéngrén","meaning":"성인, 어른","example":"这部动画既适合儿童，也能引发成人的思考。","examplePinyin":"Zhè bù dònghuà jì shìhé értóng, yě néng yǐnfā chéngrén de sīkǎo.","translation":"이 애니메이션은 어린이에게 적합하며 어른도 생각하게 해요."},{"no":15,"category":"인사·사람·대명사","word":"大妈","pinyin":"dàmā","meaning":"아주머니, 큰엄마","example":"社区的大妈们自发组织起来，照顾独居老人。","examplePinyin":"Shèqū de dàmāmen zìfā zǔzhī qǐlai, zhàogu dújū lǎorén.","translation":"마을 아주머니들이 자발적으로 모여 홀로 사는 노인들을 돌봐요."},{"no":16,"category":"인사·사람·대명사","word":"大爷","pinyin":"dàye","meaning":"어르신(나이 든 남성의 존칭)","example":"邻居大爷退休后，主动承担了小区的绿化维护。","examplePinyin":"Línjū dàye tuìxiū hòu, zhǔdòng chéngdān le xiǎoqū de lǜhuà wéihù.","translation":"이웃 할아버지는 은퇴 후 자발적으로 단지의 녹지를 가꿨어요."},{"no":17,"category":"인사·사람·대명사","word":"伙","pinyin":"huǒ","meaning":"무리, 동료; (양사) 무리","example":"一伙年轻人利用周末，为村里老人维修电器。","examplePinyin":"Yì huǒ niánqīngrén lìyòng zhōumò, wèi cūnlǐ lǎorén wéixiū diànqì.","translation":"젊은이 한 무리가 주말을 이용해 마을 노인의 가전제품을 수리해 줘요."},{"no":18,"category":"인사·사람·대명사","word":"嘉宾","pinyin":"jiābīn","meaning":"귀빈, 손님","example":"主持人先介绍嘉宾，再邀请观众提出问题。","examplePinyin":"Zhǔchírén xiān jièshào jiābīn, zài yāoqǐng guānzhòng tíchū wèntí.","translation":"진행자는 초대 손님을 소개한 뒤 관객에게 질문을 받았어요."},{"no":19,"category":"인사·사람·대명사","word":"路人","pinyin":"lùrén","meaning":"행인, 보행자","example":"一位路人主动停下脚步，帮助游客找到车站。","examplePinyin":"Yí wèi lùrén zhǔdòng tíngxià jiǎobù, bāngzhù yóukè zhǎodào chēzhàn.","translation":"행인 한 명이 자발적으로 멈춰 관광객에게 역을 찾아 줬어요."},{"no":20,"category":"인사·사람·대명사","word":"男子","pinyin":"nánzǐ","meaning":"남성, 사내","example":"那名男子发现孩子落单，主动带他去服务中心。","examplePinyin":"Nà míng nánzǐ fāxiàn háizi luòdān, zhǔdòng dài tā qù fúwù zhōngxīn.","translation":"그 남성은 혼자 남은 아이를 발견하고 안내 센터로 데려갔어요."},{"no":21,"category":"인사·사람·대명사","word":"女子","pinyin":"nǚzǐ","meaning":"여자, 여성","example":"这名女子凭借多年训练，完成了高难度救援任务。","examplePinyin":"Zhè míng nǚzǐ píngjiè duōnián xùnliàn, wánchéng le gāo nándù jiùyuán rènwu.","translation":"이 여성은 오랜 훈련을 바탕으로 고난도 구조 임무를 마쳤어요."},{"no":22,"category":"인사·사람·대명사","word":"人类","pinyin":"rénlèi","meaning":"인류, 인간","example":"技术发展应当服务于人类，而不是增加无谓负担。","examplePinyin":"Jìshù fāzhǎn yīngdāng fúwù yú rénlèi, ér búshì zēngjiā wúwèi fùdān.","translation":"기술 발전은 불필요한 부담을 더하기보다 인류에 이바지해야 해요."},{"no":23,"category":"인사·사람·대명사","word":"人群","pinyin":"rénqún","meaning":"군중, 사람들","example":"志愿者在人群中举起指示牌，帮助游客找到出口。","examplePinyin":"Zhìyuànzhě zài rénqún zhōng jǔqǐ zhǐshìpái, bāngzhù yóukè zhǎodào chūkǒu.","translation":"자원봉사자는 사람들 속에서 표지판을 들어 출구를 안내했어요."},{"no":24,"category":"인사·사람·대명사","word":"太太","pinyin":"tàitai","meaning":"부인, 마님","example":"陈太太把闲置房间借给社区，用于开展阅读活动。","examplePinyin":"Chén tàitai bǎ xiánzhì fángjiān jiègěi shèqū, yòngyú kāizhǎn yuèdú huódòng.","translation":"천 여사는 비어 있는 방을 마을 독서 활동에 쓰도록 빌려줬어요."},{"no":25,"category":"인사·사람·대명사","word":"他人","pinyin":"tārén","meaning":"타인, 다른 사람","example":"表达自己观点时，也应给他人留下发言空间。","examplePinyin":"Biǎodá zìjǐ guāndiǎn shí, yě yīng gěi tārén liúxià fāyán kōngjiān.","translation":"자신의 견해를 말할 때도 타인에게 발언할 여지를 줘야 해요."},{"no":26,"category":"인사·사람·대명사","word":"小姐","pinyin":"xiǎojie","meaning":"아가씨, 미스","example":"林小姐，请您核对一下预约时间和联系方式。","examplePinyin":"Lín xiǎojie, qǐng nín héduì yíxià yùyuē shíjiān hé liánxì fāngshì.","translation":"린 씨, 예약 시간과 연락처를 확인해 주세요."},{"no":27,"category":"인사·사람·대명사","word":"行人","pinyin":"xíngrén","meaning":"보행자, 행인","example":"道路改造不能只考虑车辆，也要保障行人安全。","examplePinyin":"Dàolù gǎizào bùnéng zhǐ kǎolǜ chēliàng, yě yào bǎozhàng xíngrén ānquán.","translation":"도로를 정비할 때는 차량뿐 아니라 보행자의 안전도 보장해야 해요."},{"no":28,"category":"인사·사람·대명사","word":"主人","pinyin":"zhǔrén","meaning":"주인, 호스트","example":"主人向客人介绍院子的历史，邀请大家随意参观。","examplePinyin":"Zhǔrén xiàng kèrén jièshào yuànzi de lìshǐ, yāoqǐng dàjiā suíyì cānguān.","translation":"주인은 손님에게 마당의 역사를 설명하고 편히 둘러보라고 했어요."},{"no":29,"category":"인사·사람·대명사","word":"本人","pinyin":"běnrén","meaning":"본인, 자신","example":"涉及个人信息的材料，必须由本人签字确认。","examplePinyin":"Shèjí gèrén xìnxī de cáiliào, bìxū yóu běnrén qiānzì quèrèn.","translation":"개인 정보 관련 자료는 반드시 본인이 서명해 확인해야 해요."},{"no":30,"category":"인사·사람·대명사","word":"成年1","pinyin":"chéngnián","meaning":"성인(成年), 장성하다","example":"成年并不意味着立刻成熟，而是开始学会负责。","examplePinyin":"Chéngnián bìng bú yìwèizhe lìkè chéngshú, érshì kāishǐ xuéhuì fùzé.","translation":"성인이 된다는 것은 바로 성숙해지는 게 아니라 책임을 배워 가는 일이에요."},{"no":31,"category":"인사·사람·대명사","word":"成长","pinyin":"chéngzhǎng","meaning":"성장하다, 자라다","example":"独立处理困难，是年轻人成长过程中重要的一步。","examplePinyin":"Dúlì chǔlǐ kùnnan, shì niánqīngrén chéngzhǎng guòchéng zhōng zhòngyào de yí bù.","translation":"어려움을 스스로 해결하는 것은 청년의 성장에 중요한 단계예요."},{"no":32,"category":"인사·사람·대명사","word":"代","pinyin":"dài","meaning":"대리, 세대 / 갈다, 대신","example":"这门传统技艺，已经在村里传了好几代。","examplePinyin":"Zhè mén chuántǒng jìyì, yǐjīng zài cūnlǐ chuán le hǎo jǐ dài.","translation":"이 전통 기술은 마을에서 여러 세대에 걸쳐 전해졌어요."},{"no":33,"category":"인사·사람·대명사","word":"个人","pinyin":"gèrén","meaning":"개인, 개별","example":"个人的发展，往往与所在群体的环境密切相关。","examplePinyin":"Gèrén de fāzhǎn, wǎngwǎng yǔ suǒzài qúntǐ de huánjìng mìqiè xiāngguān.","translation":"개인의 발전은 소속 집단의 환경과 밀접한 관련이 있곤 해요."},{"no":34,"category":"인사·사람·대명사","word":"命运","pinyin":"mìngyùn","meaning":"운명, 숙명","example":"教育能够影响个人命运，也能改变一个家庭的未来。","examplePinyin":"Jiàoyù nénggòu yǐngxiǎng gèrén mìngyùn, yě néng gǎibiàn yí ge jiātíng de wèilái.","translation":"교육은 개인의 운명과 한 가정의 미래를 바꿀 수 있어요."},{"no":35,"category":"인사·사람·대명사","word":"年纪","pinyin":"niánjì","meaning":"나이, 연령","example":"学习新技能不应受年纪限制，关键是保持好奇。","examplePinyin":"Xuéxí xīn jìnéng bù yīng shòu niánjì xiànzhì, guānjiàn shì bǎochí hàoqí.","translation":"새 기술을 배우는 데는 나이보다 호기심을 유지하는 것이 중요해요."},{"no":36,"category":"인사·사람·대명사","word":"前途","pinyin":"qiántú","meaning":"앞날, 장래, 전망","example":"选择职业时，既要考虑前途，也要了解自身兴趣。","examplePinyin":"Xuǎnzé zhíyè shí, jì yào kǎolǜ qiántú, yě yào liǎojiě zìshēn xìngqù.","translation":"직업을 선택할 때는 전망과 자신의 관심을 함께 고려해야 해요."},{"no":37,"category":"인사·사람·대명사","word":"去世","pinyin":"qùshì","meaning":"돌아가시다(사망)","example":"老师去世以后，学生们整理了他留下的研究笔记。","examplePinyin":"Lǎoshī qùshì yǐhòu, xuéshengmen zhěnglǐ le tā liúxià de yánjiū bǐjì.","translation":"선생님이 돌아가신 뒤 학생들은 남겨진 연구 노트를 정리했어요."},{"no":38,"category":"인사·사람·대명사","word":"身份","pinyin":"shēnfèn","meaning":"신분, 자격","example":"无论身份如何变化，他始终尊重普通劳动者。","examplePinyin":"Wúlùn shēnfèn rúhé biànhuà, tā shǐzhōng zūnzhòng pǔtōng láodòngzhě.","translation":"신분이 어떻게 바뀌든 그는 늘 평범한 노동자를 존중해요."},{"no":39,"category":"인사·사람·대명사","word":"一代","pinyin":"yídài","meaning":"한 세대; 한 시대","example":"一代人的生活经历，能够为后来者提供丰富经验。","examplePinyin":"Yí dài rén de shēnghuó jīnglì, nénggòu wèi hòuláizhě tígōng fēngfù jīngyàn.","translation":"한 세대의 생활 경험은 후대에 풍부한 배움을 줄 수 있어요."},{"no":40,"category":"인사·사람·대명사","word":"自身","pinyin":"zìshēn","meaning":"자신, 자기","example":"学习别人的方法时，应结合自身条件灵活调整。","examplePinyin":"Xuéxí biéren de fāngfǎ shí, yīng jiéhé zìshēn tiáojiàn línghuó tiáozhěng.","translation":"남의 방법을 배울 때는 자신의 여건에 맞게 유연하게 조정해야 해요."},{"no":41,"category":"가족·관계","word":"宝贝","pinyin":"bǎobèi","meaning":"보배, 귀여운 사람","example":"这只旧木箱里，装着奶奶珍藏多年的宝贝。","examplePinyin":"Zhè zhī jiù mùxiāng lǐ, zhuāng zhe nǎinai zhēncáng duōnián de bǎobèi.","translation":"이 낡은 나무 상자에는 할머니가 간직해 온 보물이 있어요."},{"no":42,"category":"가족·관계","word":"儿女","pinyin":"érnǚ","meaning":"자녀, 아들딸","example":"父母尊重儿女的选择，并不意味着放弃必要的引导。","examplePinyin":"Fùmǔ zūnzhòng érnǚ de xuǎnzé, bìng bú yìwèizhe fàngqì bìyào de yǐndǎo.","translation":"자녀의 선택을 존중한다고 필요한 지도까지 포기하는 것은 아니에요."},{"no":43,"category":"가족·관계","word":"福","pinyin":"fú","meaning":"복, 행운","example":"对奶奶来说，全家健康平安就是最大的福。","examplePinyin":"Duì nǎinai láishuō, quánjiā jiànkāng píng'ān jiùshì zuì dà de fú.","translation":"할머니에게는 가족 모두가 건강하고 무탈한 것이 가장 큰 복이에요."},{"no":44,"category":"가족·관계","word":"夫妇","pinyin":"fūfù","meaning":"부부, 내외","example":"这对夫妇退休后，共同经营一家社区书店。","examplePinyin":"Zhè duì fūfù tuìxiū hòu, gòngtóng jīngyíng yìjiā shèqū shūdiàn.","translation":"이 부부는 은퇴한 뒤 동네 서점을 함께 운영해요."},{"no":45,"category":"가족·관계","word":"老公","pinyin":"lǎogōng","meaning":"남편","example":"她和老公轮流照顾孩子，各自保留学习的时间。","examplePinyin":"Tā hé lǎogōng lúnliú zhàogu háizi, gèzì bǎoliú xuéxí de shíjiān.","translation":"그녀와 남편은 번갈아 아이를 돌보며 각자의 공부 시간을 확보해요."},{"no":46,"category":"가족·관계","word":"姥姥","pinyin":"lǎolao","meaning":"외할머니","example":"姥姥把旧照片整理成册，向孩子们讲过去的故事。","examplePinyin":"Lǎolao bǎ jiù zhàopiàn zhěnglǐ chéngcè, xiàng háizimen jiǎng guòqu de gùshi.","translation":"외할머니는 옛 사진을 앨범으로 정리해 아이들에게 지난 이야기를 들려줘요."},{"no":47,"category":"가족·관계","word":"老婆","pinyin":"lǎopo","meaning":"아내","example":"他与老婆商量后，决定共同分担照顾老人的责任。","examplePinyin":"Tā yǔ lǎopo shāngliang hòu, juédìng gòngtóng fēndān zhàogu lǎorén de zérèn.","translation":"그는 아내와 의논해 노인 돌봄 책임을 함께 나누기로 했어요."},{"no":48,"category":"가족·관계","word":"姥爷","pinyin":"lǎoye","meaning":"외할아버지","example":"姥爷退休后学会了摄影，经常记录家乡的变化。","examplePinyin":"Lǎoye tuìxiū hòu xuéhuì le shèyǐng, jīngcháng jìlù jiāxiāng de biànhuà.","translation":"외할아버지는 은퇴 후 사진을 배워 고향의 변화를 자주 기록해요."},{"no":49,"category":"가족·관계","word":"亲情","pinyin":"qīnqíng","meaning":"가족애, 혈육의 정","example":"距离虽然遥远，定期通话仍让亲情保持温度。","examplePinyin":"Jùlí suīrán yáoyuǎn, dìngqī tōnghuà réng ràng qīnqíng bǎochí wēndù.","translation":"거리는 멀지만 정기적인 통화로 가족의 정을 따뜻하게 이어 가요."},{"no":50,"category":"가족·관계","word":"亲人","pinyin":"qīnrén","meaning":"가족, 친인척","example":"遭遇困难时，亲人的理解给了他重新出发的力量。","examplePinyin":"Zāoyù kùnnan shí, qīnrén de lǐjiě gěi le tā chóngxīn chūfā de lìliang.","translation":"어려울 때 가족의 이해는 그가 다시 시작할 힘을 줬어요."},{"no":51,"category":"가족·관계","word":"外公","pinyin":"wàigōng","meaning":"외할아버지, 외조부","example":"外公把修理工具交给他，也把耐心做事的态度传给了他。","examplePinyin":"Wàigōng bǎ xiūlǐ gōngjù jiāogěi tā, yě bǎ nàixīn zuòshì de tàidu chuángěi le tā.","translation":"외할아버지는 공구와 함께 인내심 있는 일처리 태도도 전해 주셨어요."},{"no":52,"category":"가족·관계","word":"外婆","pinyin":"wàipó","meaning":"외할머니, 외조모","example":"外婆虽然不会打字，却学会了用语音消息联系家人。","examplePinyin":"Wàipó suīrán búhuì dǎzì, què xuéhuì le yòng yǔyīn xiāoxi liánxì jiārén.","translation":"외할머니는 타자를 못 쳐도 음성 메시지로 가족과 연락하는 법을 배우셨어요."},{"no":53,"category":"가족·관계","word":"压岁钱","pinyin":"yāsuìqián","meaning":"세뱃돈","example":"孩子把部分压岁钱存起来，学习规划自己的开支。","examplePinyin":"Háizi bǎ bùfen yāsuìqián cún qǐlai, xuéxí guīhuà zìjǐ de kāizhī.","translation":"아이는 세뱃돈 일부를 저축하며 지출 계획을 배워요."},{"no":54,"category":"가족·관계","word":"子女","pinyin":"zǐnǚ","meaning":"자녀, 자식","example":"父母支持子女独立，也应尊重他们不同的人生选择。","examplePinyin":"Fùmǔ zhīchí zǐnǚ dúlì, yě yīng zūnzhòng tāmen bùtóng de rénshēng xuǎnzé.","translation":"부모는 자녀의 독립을 지원하며 서로 다른 삶의 선택도 존중해야 해요."},{"no":55,"category":"가족·관계","word":"分手","pinyin":"fēnshǒu","meaning":"이별하다, 헤어지다","example":"分手以后，他们仍然尊重彼此曾经的付出。","examplePinyin":"Fēnshǒu yǐhòu, tāmen réngrán zūnzhòng bǐcǐ céngjīng de fùchū.","translation":"헤어진 뒤에도 두 사람은 서로의 지난 노력을 존중해요."},{"no":56,"category":"가족·관계","word":"婚礼","pinyin":"hūnlǐ","meaning":"결혼식, 혼례","example":"他们决定简办婚礼，把节省下来的钱用于生活。","examplePinyin":"Tāmen juédìng jiǎn bàn hūnlǐ, bǎ jiéshěng xiàlai de qián yòngyú shēnghuó.","translation":"두 사람은 결혼식을 간소하게 하고 아낀 돈을 생활에 쓰기로 했어요."},{"no":57,"category":"가족·관계","word":"恋爱","pinyin":"liàn'ài","meaning":"연애, 사랑","example":"恋爱中的双方，也需要尊重彼此独立的生活空间。","examplePinyin":"Liàn'ài zhōng de shuāngfāng, yě xūyào zūnzhòng bǐcǐ dúlì de shēnghuó kōngjiān.","translation":"연애 중인 두 사람도 서로의 독립적인 생활 공간을 존중해야 해요."},{"no":58,"category":"가족·관계","word":"离婚","pinyin":"líhūn","meaning":"이혼하다","example":"离婚后，他们仍努力共同承担照顾孩子的责任。","examplePinyin":"Líhūn hòu, tāmen réng nǔlì gòngtóng chéngdān zhàogu háizi de zérèn.","translation":"이혼 후에도 두 사람은 아이를 돌볼 책임을 함께 지려고 노력해요."},{"no":59,"category":"가족·관계","word":"亲爱","pinyin":"qīn'ài","meaning":"친애하다, 사랑하는","example":"亲爱的朋友，愿你在新的环境里继续保持热爱。","examplePinyin":"Qīn'ài de péngyou, yuàn nǐ zài xīn de huánjìng lǐ jìxù bǎochí rè'ài.","translation":"사랑하는 친구여, 새로운 환경에서도 열정을 간직하길 바라요."},{"no":60,"category":"가족·관계","word":"失恋","pinyin":"shīliàn","meaning":"실연, 이별","example":"失恋带来的痛苦，需要时间，也需要适当的支持。","examplePinyin":"Shīliàn dàilái de tòngkǔ, xūyào shíjiān, yě xūyào shìdàng de zhīchí.","translation":"실연의 아픔에는 시간과 적절한 도움이 필요해요."},{"no":61,"category":"가족·관계","word":"新郎","pinyin":"xīnláng","meaning":"신랑, 새남편","example":"新郎在婚礼上，感谢两家人一直以来的支持。","examplePinyin":"Xīnláng zài hūnlǐ shàng, gǎnxiè liǎngjiā rén yìzhí yǐlái de zhīchí.","translation":"신랑은 결혼식에서 두 가족의 한결같은 지원에 감사했어요."},{"no":62,"category":"가족·관계","word":"新娘","pinyin":"xīnniáng","meaning":"신부, 새색시","example":"新娘希望婚礼简单温馨，不必过分追求排场。","examplePinyin":"Xīnniáng xīwàng hūnlǐ jiǎndān wēnxīn, búbì guòfèn zhuīqiú páichang.","translation":"신부는 겉치레보다 소박하고 따뜻한 결혼식을 바랐어요."},{"no":63,"category":"가족·관계","word":"彼此","pinyin":"bǐcǐ","meaning":"서로, 각자","example":"只有愿意听取不同意见，彼此才能建立信任。","examplePinyin":"Zhǐyǒu yuànyì tīngqǔ bùtóng yìjiàn, bǐcǐ cái néng jiànlì xìnrèn.","translation":"다른 의견을 들으려 해야 서로 신뢰를 쌓을 수 있어요."},{"no":64,"category":"가족·관계","word":"处","pinyin":"chǔ","meaning":"지내다, 사귀다; 처하다, 처리하다","example":"和不同背景的人相处，能让我们理解更多观点。","examplePinyin":"Hé bùtóng bèijǐng de rén xiāngchǔ, néng ràng wǒmen lǐjiě gèng duō guāndiǎn.","translation":"배경이 다른 사람들과 어울리면 더 다양한 관점을 이해할 수 있어요."},{"no":65,"category":"가족·관계","word":"对待","pinyin":"duìdài","meaning":"대하다, 다루다","example":"对待不同背景的人，应保持同样的尊重。","examplePinyin":"Duìdài bùtóng bèijǐng de rén, yīng bǎochí tóngyàng de zūnzhòng.","translation":"배경이 다른 사람들에게도 똑같이 존중하는 태도를 보여야 해요."},{"no":66,"category":"가족·관계","word":"告别","pinyin":"gàobié","meaning":"이별하다, 작별하다","example":"告别熟悉的环境，需要勇气，也意味着新的开始。","examplePinyin":"Gàobié shúxī de huánjìng, xūyào yǒngqì, yě yìwèizhe xīn de kāishǐ.","translation":"익숙한 환경과의 작별에는 용기가 필요하며 새 출발을 뜻하기도 해요."},{"no":67,"category":"가족·관계","word":"沟通","pinyin":"gōutōng","meaning":"소통하다, 의사소통","example":"出现分歧及时沟通，能避免小误会变成大矛盾。","examplePinyin":"Chūxiàn fēnqí jíshí gōutōng, néng bìmiǎn xiǎo wùhuì biànchéng dà máodùn.","translation":"의견이 다를 때 제때 소통하면 작은 오해가 큰 갈등으로 번지는 것을 막아요."},{"no":68,"category":"가족·관계","word":"伙伴","pinyin":"huǒbàn","meaning":"동료, 파트너","example":"可靠的合作伙伴，往往能在困难时共同承担压力。","examplePinyin":"Kěkào de hézuò huǒbàn, wǎngwǎng néng zài kùnnan shí gòngtóng chéngdān yālì.","translation":"믿음직한 협력자는 어려울 때 부담을 함께 감당해 줘요."},{"no":69,"category":"가족·관계","word":"交往","pinyin":"jiāowǎng","meaning":"교제하다, 사귀다","example":"与不同年龄的人交往，可以扩大对生活的理解。","examplePinyin":"Yǔ bùtóng niánlíng de rén jiāowǎng, kěyǐ kuòdà duì shēnghuó de lǐjiě.","translation":"다른 연령대의 사람들과 교류하면 삶에 대한 이해를 넓힐 수 있어요."},{"no":70,"category":"가족·관계","word":"看望","pinyin":"kànwàng","meaning":"방문하다, 문병하다","example":"节日前，志愿者到社区看望独居老人。","examplePinyin":"Jiérì qián, zhìyuànzhě dào shèqū kànwàng dújū lǎorén.","translation":"명절 전에 자원봉사자들이 마을의 독거노인들을 찾아뵀어요."},{"no":71,"category":"가족·관계","word":"矛盾","pinyin":"máodùn","meaning":"모순, 대립, 갈등","example":"面对矛盾，先理解对方的需求比急着争论更重要。","examplePinyin":"Miànduì máodùn, xiān lǐjiě duìfāng de xūqiú bǐ jí zhe zhēnglùn gèng zhòngyào.","translation":"갈등이 생기면 서둘러 논쟁하기보다 상대의 요구를 먼저 이해해야 해요."} 른 사진들이 같은 거리의 변화를 기록했어요."},{"no":191,"category":"시간·날짜","word":"期间","pinyin":"qījiān","meaning":"기간, 동안","example":"维修期间，图书馆会把部分服务转到线上。","examplePinyin":"Wéixiū qījiān, túshūguǎn huì bǎ bùfen fúwù zhuǎn dào xiàn shàng.","translation":"보수 기간 동안 도서관의 일부 서비스는 온라인으로 옮겨져요."},{"no":192,"category":"시간·날짜","word":"如今","pinyin":"rújīn","meaning":"요즘, 현재","example":"如今，村民不用出门，也能通过网络销售产品。","examplePinyin":"Rújīn, cūnmín búyòng chūmén, yě néng tōngguò wǎngluò xiāoshòu chǎnpǐn.","translation":"요즘은 주민들이 외출하지 않고도 인터넷으로 제품을 팔 수 있어요."},{"no":193,"category":"시간·날짜","word":"时差","pinyin":"shíchā","meaning":"시차, 시간 차이","example":"跨国会议需要考虑时差，不能只方便一方。","examplePinyin":"Kuàguó huìyì xūyào kǎolǜ shíchā, bùnéng zhǐ fāngbiàn yìfāng.","translation":"국제 회의는 시차를 고려해 한쪽만 편하지 않도록 해야 해요."},{"no":194,"category":"시간·날짜","word":"时代","pinyin":"shídài","meaning":"시대","example":"每个时代都有不同挑战，也都有值得保存的经验。","examplePinyin":"Měi ge shídài dōu yǒu bùtóng tiǎozhàn, yě dōu yǒu zhíde bǎocún de jīngyàn.","translation":"시대마다 다른 과제와 보존할 만한 경험이 있어요."},{"no":195,"category":"시간·날짜","word":"时刻","pinyin":"shíkè","meaning":"시각, 때","example":"在关键时刻，清楚的分工能减少现场混乱。","examplePinyin":"Zài guānjiàn shíkè, qīngchu de fēngōng néng jiǎnshǎo xiànchǎng hùnluàn.","translation":"중요한 순간에는 분명한 역할 분담으로 현장의 혼란을 줄일 수 있어요."},{"no":196,"category":"시간·날짜","word":"时期","pinyin":"shíqī","meaning":"시기, 기간","example":"在转型时期，稳定的培训和就业支持十分必要。","examplePinyin":"Zài zhuǎnxíng shíqī, wěndìng de péixùn hé jiùyè zhīchí shífēn bìyào.","translation":"전환기에는 안정적인 교육과 고용 지원이 매우 필요해요."},{"no":197,"category":"시간·날짜","word":"未来","pinyin":"wèilái","meaning":"미래, 장래","example":"规划未来时，既要有目标，也要允许适当调整。","examplePinyin":"Guīhuà wèilái shí, jì yào yǒu mùbiāo, yě yào yǔnxǔ shìdàng tiáozhěng.","translation":"미래를 계획할 때는 목표와 적절히 조정할 여지가 모두 필요해요."},{"no":198,"category":"시간·날짜","word":"现代","pinyin":"xiàndài","meaning":"현대적, 현대","example":"现代生活越方便，我们越需要珍惜资源。","examplePinyin":"Xiàndài shēnghuó yuè fāngbiàn, wǒmen yuè xūyào zhēnxī zīyuán.","translation":"현대 생활이 편리해질수록 자원을 더 소중히 해야 dào zhèlǐ huì biànhuà zhème dà.","translation":"당시 고향을 떠날 때 그는 이곳이 이토록 변할 줄 몰랐어요."},{"no":215,"category":"시간·날짜","word":"改天","pinyin":"gǎitiān","meaning":"다음에, 나중에","example":"今天的材料还没准备齐，我们改天再深入讨论。","examplePinyin":"Jīntiān de cáiliào hái méi zhǔnbèi qí, wǒmen gǎitiān zài shēnrù tǎolùn.","translation":"오늘은 자료가 다 준비되지 않았으니 다른 날 더 깊이 논의해요."},{"no":216,"category":"시간·날짜","word":"刚好","pinyin":"gānghǎo","meaning":"마침, 정확히 / 때마침","example":"他赶到车站时，刚好听到检票的广播。","examplePinyin":"Tā gǎndào chēzhàn shí, gānghǎo tīngdào jiǎnpiào de guǎngbō.","translation":"그가 역에 도착했을 때 마침 개찰 안내 방송이 나왔어요."},{"no":217,"category":"시간·날짜","word":"古","pinyin":"gǔ","meaning":"고대, 옛날","example":"这条古街修缮时，尽可能保留了原有的格局。","examplePinyin":"Zhè tiáo gǔjiē xiūshàn shí, jǐnkěnéng bǎoliú le yuányǒu de géjú.","translation":"이 옛 거리를 보수할 때 원래 구조를 최대한 유지했어요."},{"no":218,"category":"시간·날짜","word":"古代","pinyin":"gǔdài","meaning":"고대, 옛날","example":"研究古代交通，可以帮助我们理解城市的发展。","examplePinyin":"Yánjiū gǔdài jiāotōng, kěyǐ bāngzhù wǒmen lǐjiě chéngshì de fāzhǎn.","translation":"고대 교통을 연구하면 도시의 발전을 이해하는 데 도움이 돼요."},{"no":219,"category":"시간·날짜","word":"过期","pinyin":"guòqī","meaning":"기한이 지나다, 만료되다","example":"证件已经过期，需要更新后才能办理手续。","examplePinyin":"Zhèngjiàn yǐjīng guòqī, xūyào gēngxīn hòu cái néng bànlǐ shǒuxù.","translation":"증명서의 기한이 지나 갱신한 뒤에야 수속할 수 있어요."},{"no":220,"category":"시간·날짜","word":"阶段","pinyin":"jiēduàn","meaning":"단계, 국면","example":"项目进入新阶段后，评价标准也应相应调整。","examplePinyin":"Xiàngmù jìnrù xīn jiēduàn hòu, píngjià biāozhǔn yě yīng xiāngyìng tiáozhěng.","translation":"사업이 새 단계에 들어가면 평가 기준도 그에 맞춰 바꿔야 해요."},{"no":221,"category":"시간·날짜","word":"即将","pinyin":"jíjiāng","meaning":"곧, 바로","example":"新图书馆即将开放，旧馆的部分服务暂时调整。","examplePinyin":"Xīn túshūguǎn jíjiāng kāifàng, jiù guǎn de bùfen fúwù zànshí tiáozhěng.","translation":"새 도서관이 곧 문을 열어 기존 도서관의 일부 서비스가 잠시 바뀌어요."},{"no":222,"category":"시간·날짜","word":"近代","pinyin":"jìndài","meaning":"근대","example":"这座车站的历史，反映了近代城市交通的发展。","examplePinyin":"Zhè zuò chēzhàn de lìshǐ, fǎnyìng le ngchǎn fāngshì.","translation":"지리적 여건의 차이는 지역별 생산 방식에 영향을 줘요."},{"no":255,"category":"학교·학습·언어","word":"高级","pinyin":"gāojí","meaning":"고급, 상급","example":"完成基础训练之后，学员才能进入高级课程。","examplePinyin":"Wánchéng jīchǔ xùnliàn zhīhòu, xuéyuán cái néng jìnrù gāojí kèchéng.","translation":"기초 훈련을 마쳐야 수강생이 고급 과정에 들어갈 수 있어요."},{"no":256,"category":"학교·학습·언어","word":"化学","pinyin":"huàxué","meaning":"화학","example":"化学实验既要关注结果，也要遵守安全规范。","examplePinyin":"Huàxué shíyàn jì yào guānzhù jiéguǒ, yě yào zūnshǒu ānquán guīfàn.","translation":"화학 실험은 결과에 주목하면서 안전 규범도 지켜야 해요."},{"no":257,"category":"학교·학습·언어","word":"讲座","pinyin":"jiǎngzuò","meaning":"강연, 강좌","example":"这场讲座用生活中的例子，解释复杂的经济现象。","examplePinyin":"Zhè chǎng jiǎngzuò yòng shēnghuó zhōng de lìzi, jiěshì fùzá de jīngjì xiànxiàng.","translation":"이 강연은 일상 사례로 복잡한 경제 현상을 설명해요."},{"no":258,"category":"학교·학습·언어","word":"教材","pinyin":"jiàocái","meaning":"교재, 교과서","example":"教材增加了真实案例，帮助学生理解抽象概念。","examplePinyin":"Jiàocái zēngjiā le zhēnshí ànlì, bāngzhù xuésheng lǐjiě chōuxiàng gàiniàn.","translation":"교재는 실제 사례를 늘려 학생들의 추상 개념 이해를 도왔어요."},{"no":259,"category":"학교·학습·언어","word":"录取","pinyin":"lùqǔ","meaning":"선발하다, 합격시키다; 선발되다","example":"被理想的大学录取后，她开始规划新的学习生活。","examplePinyin":"Bèi lǐxiǎng de dàxué lùqǔ hòu, tā kāishǐ guīhuà xīn de xuéxí shēnghuó.","translation":"원하던 대학에 합격한 뒤 그녀는 새로운 학업 생활을 계획했어요."},{"no":260,"category":"학교·학습·언어","word":"培养","pinyin":"péiyǎng","meaning":"양성하다, 배양하다","example":"培养责任感，不能只靠说教，还要提供实践机会。","examplePinyin":"Péiyǎng zérèngǎn, bùnéng zhǐ kào shuōjiào, hái yào tígōng shíjiàn jīhuì.","translation":"책임감을 기르려면 훈계뿐 아니라 실천 기회도 필요해요."},{"no":261,"category":"학교·학습·언어","word":"普及","pinyin":"pǔjí","meaning":"보급하다, 널리 알리다","example":"智能手机的普及，改变了人们获取信息的方式。","examplePinyin":"Zhìnéng shǒujī de pǔjí, gǎibiàn le rénmen huòqǔ xìnxī de fāngshì.","translation":"스마트폰의 보급은 사람들이 정보를 얻는 방식을 바꿨어요."},{"no":262,"category":"학교·학습·언어","word":"实验室","pinyin":"shíyànshì","meaning":"실험실, 연구실","example":"进入实验室前，学生必须接受安全操作培训。","examplePinyin":"Jìnrù shíyànshì qián, xuésheng bìxū jiēshòu ānquán cāozuò péixùn.","translation":"실험실에 들어가기 전에 학생들은 안전 교육을 받아야 해요."},{"no":263,"category":"학교·학습·언어","word":"物理","pinyin":"wùlǐ","meaning":"물리, 물리학","example":"把物理知识联系到生活，学生会更容易理解。","examplePinyin":"Bǎ wùlǐ zhīshi liánxì dào shēnghuó, xuésheng huì gèng róngyì lǐjiě.","translation":"물리 지식을 생활과 연결하면 학생들이 더 쉽게 이해해요."},{"no":264,"category":"학교·학습·언어","word":"物质","pinyin":"wùzhì","meaning":"물질, 재질","example":"物质条件改善以后，居民更加重视精神生活。","examplePinyin":"Wùzhì tiáojiàn gǎishàn yǐhòu, jūmín gèngjiā zhòngshì jīngshén shēnghuó.","translation":"물질적인 여건이 나아지자 주민들은 정신적인 삶을 더 중시했어요."},{"no":265,"category":"학교·학습·언어","word":"系","pinyin":"xì","meaning":"학과; 계통, 체계; 관계","example":"中文系组织学生到乡村，记录当地的口头故事。","examplePinyin":"Zhōngwén xì zǔzhī xuésheng dào xiāngcūn, jìlù dāngdì de kǒutóu gùshi.","translation":"중문과는 학생들을 농촌에 보내 현지의 구전 이야기를 기록하게 했어요."},{"no":266,"category":"학교·학습·언어","word":"学分","pinyin":"xuéfēn","meaning":"학점","example":"学生完成实践任务后，可以获得相应学分。","examplePinyin":"Xuésheng wánchéng shíjiàn rènwu hòu, kěyǐ huòdé xiāngyìng xuéfēn.","translation":"학생은 실습 과제를 마치면 해당 학점을 받을 수 있어요."},{"no":267,"category":"학교·학습·언어","word":"学科","pinyin":"xuékē","meaning":"학과, 학문","example":"不同学科之间的交流，往往能产生新的研究问题。","examplePinyin":"Bùtóng xuékē zhījiān de jiāoliú, wǎngwǎng néng chǎnshēng xīn de yánjiū wèntí.","translation":"학문 간 교류는 새로운 연구 문제를 낳곤 해요."},{"no":268,"category":"학교·학습·언어","word":"学历","pinyin":"xuélì","meaning":"학력","example":"学历可以说明学习经历，却不能完全代表工作能力。","examplePinyin":"Xuélì kěyǐ shuōmíng xuéxí jīnglì, què bùnéng wánquán dàibiǎo gōngzuò nénglì.","translation":"학력은 학습 이력을 보여 주지만 업무 능력을 전부 나타내지는 않아요."},{"no":269,"category":"학교·학습·언어","word":"医学","pinyin":"yīxué","meaning":"의학, 의술","example":"医学的发展，需要严格研究，也需要尊重患者。","examplePinyin":"Yīxué de fāzhǎn, xūyào yángé yánjiū, yě xūyào zūnzhòng huànzhě.","translation":"의학의 발전에는 엄격한 연구와 환자에 대한 존중이 필요해요."},{"no":270,"category":"학교·학습·언어","word":"幼儿园","pinyin":"yòu'éryuán","meaning":"유치원, 어린이집","example":"幼儿园通过游戏，让孩子学习合作和表达。","examplePinyin":"Yòu'éryuán tōngguò yóuxì, ràng háizi xuéxí hézuò hé biǎodá.","translation":"유치원은 놀이를 통해 아이들이 협력과 표현을 배우게 해요."},{"no":271,"category":"학교·학습·언어","word":"语文","pinyin":"yǔwén","meaning":"어문, 언어","example":"语文课不仅训练阅读，也应鼓励真实表达。","examplePinyin":"Yǔwénkè bùjǐn xùnliàn yuèdú, yě yīng gǔlì zhēnshí biǎodá.","translation":"어문 수업은 독해뿐 아니라 진솔한 표현도 장려해야 해요."},{"no":272,"category":"학교·학습·언어","word":"哲学","pinyin":"zhéxué","meaning":"철학","example":"哲学不只是抽象讨论，也能帮助人思考生活选择。","examplePinyin":"Zhéxué bù zhǐshì chōuxiàng tǎolùn, yě néng bāngzhù rén sīkǎo shēnghuó xuǎnzé.","translation":"철학은 추상적 논의뿐 아니라 삶의 선택을 생각하는 데도 도움을 줘요."},{"no":273,"category":"학교·학습·언어","word":"中级","pinyin":"zhōngjí","meaning":"중급, 중간","example":"这门中级课程要求学员具备一定的基础知识。","examplePinyin":"Zhè mén zhōngjí kèchéng yāoqiú xuéyuán jùbèi yídìng de jīchǔ zhīshi.","translation":"이 중급 강좌는 일정한 기초 지식을 갖춘 학습자를 대상으로 해요."},{"no":274,"category":"학교·학습·언어","word":"背","pinyin":"bèi","meaning":"등; 외우다; 등지다, 어기다","example":"光背答案不理解原理，很难灵活运用知识。","examplePinyin":"Guāng bèi dá'àn bù lǐjiě yuánlǐ, hěn nán línghuó yùnyòng zhīshi.","translation":"답만 외우고 원리를 이해하지 못하면 지식을 활용하기 어려워요."},{"no":275,"category":"학교·학습·언어","word":"参考","pinyin":"cānkǎo","meaning":"참고하다, 참조","example":"别人的经验可以参考，却不能完全照搬。","examplePinyin":"Biéren de jīngyàn kěyǐ cānkǎo, què bùnéng wánquán zhàobān.","translation":"다른 사람의 경험을 참고할 수는 있어도 그대로 모방해서는 안 돼요."},{"no":276,"category":"학교·학습·언어","word":"测试","pinyin":"cèshì","meaning":"테스트하다, 시험하다","example":"正式投入使用前，系统还需要经过多轮测试。","examplePinyin":"Zhèngshì tóurù shǐyòng qián, xìtǒng hái xūyào jīngguò duōlún cèshì.","translation":"정식으로 사용하기 전에 시스템을 여러 차례 시험해야 해요."},{"no":277,"category":"학교·학습·언어","word":"常识","pinyin":"chángshí","meaning":"상식, 일반 지식","example":"掌握基本急救常识，关键时刻也许能救人。","examplePinyin":"Zhǎngwò jīběn jíjiù chángshí, guānjiàn shíkè yěxǔ néng jiùrén.","translation":"기본적인 응급 처치 상식을 알면 위급할 때 사람을 구할 수 있어요."},{"no":278,"category":"학교·학습·언어","word":"成果","pinyin":"chéngguǒ","meaning":"성과, 업적","example":"研究成果只有用于实践，才能真正产生价值。","examplePinyin":"Yánjiū chéngguǒ zhǐyǒu yòngyú shíjiàn, cái néng zhēnzhèng chǎnshēng jiàzhí.","translation":"연구 성과는 실제로 활용해야 진정한 가치를 만들 수 있어요."},{"no":279,"category":"학교·학습·언어","word":"尺子","pinyin":"chǐzi","meaning":"자(길이 측정 도구)","example":"设计图完成后，他用尺子再次核对各部分尺寸。","examplePinyin":"Shèjìtú wánchéng hòu, tā yòng chǐzi zàicì héduì gè bùfen chǐcun.","translation":"설계도를 완성한 뒤 그는 자로 각 부분의 치수를 다시 확인했어요."},{"no":280,"category":"학교·학습·언어","word":"调研","pinyin":"diàoyán","meaning":"조사 연구","example":"充分调研之后，团队才决定是否进入这个市场。","examplePinyin":"Chōngfèn diàoyán zhīhòu, tuánduì cái juédìng shìfǒu jìnrù zhè ge shìchǎng.","translation":"충분한 조사 연구 후에야 팀은 이 시장의 진출 여부를 결정해요."},{"no":281,"category":"학교·학습·언어","word":"概念","pinyin":"gàiniàn","meaning":"개념, 관념","example":"理解概念之间的联系，比单独背下定义更有效。","examplePinyin":"Lǐjiě gàiniàn zhījiān de liánxì, bǐ dāndú bèi xiàdìngyì gèng yǒuxiào.","translation":"개념 간의 관계를 이해하는 것이 정의를 따로 외우는 것보다 효과적이에요."},{"no":282,"category":"학교·학습·언어","word":"奖励","pinyin":"jiǎnglì","meaning":"장려하다, 포상하다","example":"奖励不应只看成绩，也应鼓励持续的进步。","examplePinyin":"Jiǎnglì bù yīng zhǐ kàn chéngjì, yě yīng gǔlì chíxù de jìnbù.","translation":"포상은 성적만 보지 말고 꾸준한 발전도 장려해야 해요."},{"no":283,"category":"학교·학습·언어","word":"及格","pinyin":"jígé","meaning":"합격하다, 통과하다","example":"考试刚刚及格，并不说明已经真正掌握知识。","examplePinyin":"Kǎoshì gānggāng jígé, bìng bù shuōmíng yǐjīng zhēnzhèng zhǎngwò zhīshi.","translation":"시험에 간신히 합격했다고 지식을 제대로 익힌 것은 아니에요."},{"no":284,"category":"학교·학습·언어","word":"记录","pinyin":"jìlù","meaning":"기록하다, 기록","example":"记录实验过程时，应保留与预期不符的结果。","examplePinyin":"Jìlù shíyàn guòchéng shí, yīng bǎoliú yǔ yùqī bùfú de jiéguǒ.","translation":"실험 과정을 기록할 때는 예상과 다른 결과도 남겨야 해요."},{"no":285,"category":"학교·학습·언어","word":"记忆","pinyin":"jìyì","meaning":"기억, 기억력","example":"记忆不是简单储存信息，还与理解和经验有关。","examplePinyin":"Jìyì búshì jiǎndān chǔcún xìnxī, hái yǔ lǐjiě hé jīngyàn yǒuguān.","translation":"기억은 단순한 정보 저장이 아니라 이해와 경험에도 관련돼요."},{"no":286,"category":"학교·학습·언어","word":"科研","pinyin":"kēyán","meaning":"과학 연구","example":"科研需要耐心，也需要允许探索过程中出现失败。","examplePinyin":"Kēyán xūyào nàixīn, yě xūyào yǔnxǔ tànsuǒ guòchéng zhōng chūxiàn shībài.","translation":"과학 연구에는 인내와 탐구 과정의 실패를 허용하는 태도가 필요해요."},{"no":287,"category":"학교·학습·언어","word":"理论","pinyin":"lǐlùn","meaning":"이론","example":"理论是否成立，需要接受实际经验的检验。","examplePinyin":"Lǐlùn shìfǒu chénglì, xūyào jiēshòu shíjì jīngyàn de jiǎnyàn.","translation":"이론의 성립 여부는 실제 경험을 통해 검증해야 해요."},{"no":288,"category":"학교·학습·언어","word":"领域","pinyin":"lǐngyù","meaning":"영역, 분야","example":"跨领域交流，常常能为研究带来新的启发。","examplePinyin":"Kuà lǐngyù jiāoliú, chángcháng néng wèi yánjiū dàilái xīn de qǐfā.","translation":"분야를 넘나드는 교류는 연구에 새 영감을 주곤 해요."},{"no":289,"category":"학교·학습·언어","word":"论文","pinyin":"lùnwén","meaning":"논문, 학위 논문","example":"论文的结论应与证据相符，不能夸大研究结果。","examplePinyin":"Lùnwén de jiélùn yīng yǔ zhèngjù xiāngfú, bùnéng kuādà yánjiū jiéguǒ.","translation":"논문의 결론은 증거와 맞아야 하며 결과를 과장해서는 안 돼요."},{"no":290,"category":"학교·학습·언어","word":"请教","pinyin":"qǐngjiào","meaning":"묻다(가르침을 청하다)","example":"遇到拿不准的问题，他会主动向有经验的人请教。","examplePinyin":"Yùdào ná bu zhǔn de wèntí, tā huì zhǔdòng xiàng yǒu jīngyàn de rén qǐngjiào.","translation":"확신이 안 서는 문제가 생기면 그는 경험 있는 사람에게 물어봐요."},{"no":291,"category":"학교·학습·언어","word":"实践","pinyin":"shíjiàn","meaning":"실천, 실습; 실천하다","example":"知识只有经过实践，才能转化为真正的能力。","examplePinyin":"Zhīshi zhǐyǒu jīngguò shíjiàn, cái néng zhuǎnhuà wéi zhēnzhèng de nénglì.","translation":"지식은 실천을 거쳐야 진정한 능력이 될 수 있어요."},{"no":292,"category":"학교·학습·언어","word":"试卷","pinyin":"shìjuàn","meaning":"시험지, 시험 문제","example":"分析试卷时，不仅要看错题，还要弄清错误原因。","examplePinyin":"Fēnxī shìjuàn shí, bùjǐn yào kàn cuòtí, hái yào nòngqīng cuòwù yuányīn.","translation":"시험지를 분석할 때는 틀린 문제뿐 아니라 원인도 파악해야 해요."},{"no":293,"category":"학교·학습·언어","word":"实验","pinyin":"shíyàn","meaning":"실험, 시험","example":"实验结果与预期相反，也可能具有重要研究价值。","examplePinyin":"Shíyàn jiéguǒ yǔ yùqī xiāngfǎn, yě kěnéng jùyǒu zhòngyào yánjiū jiàzhí.","translation":"예상과 반대인 실험 결과도 중요한 연구 가치를 지닐 수 있어요."},{"no":294,"category":"학교·학습·언어","word":"试验","pinyin":"shìyàn","meaning":"실험, 테스트","example":"新材料经过多次试验后，才被用于实际工程。","examplePinyin":"Xīn cáiliào jīngguò duōcì shìyàn hòu, cái bèi yòngyú shíjì gōngchéng.","translation":"새 소재는 여러 번 시험한 뒤에야 실제 공사에 사용됐어요."},{"no":295,"category":"학교·학습·언어","word":"数据","pinyin":"shùjù","meaning":"데이터, 수치","example":"数据数量庞大，并不意味着结论一定可靠。","examplePinyin":"Shùjù shùliàng pángdà, bìng bú yìwèizhe jiélùn yídìng kěkào.","translation":"자료의 양이 방대하다고 결론이 반드시 믿을 만한 것은 아니에요."},{"no":296,"category":"학교·학습·언어","word":"题目","pinyin":"tímù","meaning":"제목, 주제","example":"研究题目不能太宽，否则很难展开深入讨论。","examplePinyin":"Yánjiū tímù bùnéng tài kuān, fǒuzé hěn nán zhǎnkāi shēnrù tǎolùn.","translation":"연구 주제가 너무 넓으면 깊이 있게 논의하기 어려워요."},{"no":297,"category":"학교·학습·언어","word":"提问","pinyin":"tíwèn","meaning":"질문하다, 묻다","example":"允许学生自由提问，能帮助老师发现理解上的困难。","examplePinyin":"Yǔnxǔ xuésheng zìyóu tíwèn, néng bāngzhù lǎoshī fāxiàn lǐjiě shàng de kùnnan.","translation":"자유롭게 질문하게 하면 선생님이 학생의 이해 문제를 찾는 데 도움이 돼요."},{"no":298,"category":"학교·학습·언어","word":"统计","pinyin":"tǒngjì","meaning":"통계; 통계 내다","example":"统计结果公布时，应同时说明样本的范围。","examplePinyin":"Tǒngjì jiéguǒ gōngbù shí, yīng tóngshí shuōmíng yàngběn de fànwéi.","translation":"통계 결과를 발표할 때는 표본의 범위도 함께 밝혀야 해요."},{"no":299,"category":"학교·학습·언어","word":"问卷","pinyin":"wènjuàn","meaning":"설문지, 앙케이트","example":"设计问卷时，要避免用问题引导受访者作答。","examplePinyin":"Shèjì wènjuàn shí, yào bìmiǎn yòng wèntí yǐndǎo shòufǎngzhě zuòdá.","translation":"설문지를 만들 때는 질문으로 특정 답을 유도하지 말아야 해요."},{"no":300,"category":"학교·학습·언어","word":"橡皮","pinyin":"xiàngpí","meaning":"지우개, 고무","example":"画草图时，她先用铅笔，方便用橡皮修改。","examplePinyin":"Huà cǎotú shí, tā xiān yòng qiānbǐ, fāngbiàn yòng xiàngpí xiūgǎi.","translation":"초안을 그릴 때 그녀는 지우개로 고치기 쉽도록 연필부터 써요."},{"no":301,"category":"학교·학습·언어","word":"学术","pinyin":"xuéshù","meaning":"학술, 학문","example":"学术讨论应允许不同解释，但不能忽视证据。","examplePinyin":"Xuéshù tǎolùn yīng yǔnxǔ bùtóng jiěshì, dàn bùnéng hūshì zhèngjù.","translation":"학술 토론은 다양한 해석을 허용하되 증거를 무시해서는 안 돼요."},{"no":302,"category":"학교·학습·언어","word":"掌握","pinyin":"zhǎngwò","meaning":"익히다, 파악하다; 장악하다","example":"掌握基本方法之后，才能更灵活地处理新问题。","examplePinyin":"Zhǎngwò jīběn fāngfǎ zhīhòu, cái néng gèng línghuó de chǔlǐ xīn wèntí.","translation":"기본 방법을 익혀야 새 문제를 더 유연하게 처리할 수 있어요."},{"no":303,"category":"학교·학습·언어","word":"证据","pinyin":"zhèngjù","meaning":"증거","example":"提出重要指控时，必须有充分而可靠的证据。","examplePinyin":"Tíchū zhòngyào zhǐkòng shí, bìxū yǒu chōngfèn ér kěkào de zhèngjù.","translation":"중요한 혐의를 제기할 때는 충분하고 믿을 만한 증거가 필요해요."},{"no":304,"category":"학교·학습·언어","word":"证书","pinyin":"zhèngshū","meaning":"증서, 자격증","example":"取得证书只是开始，能力还需要在工作中不断提高。","examplePinyin":"Qǔdé zhèngshū zhǐshì kāishǐ, nénglì hái xūyào zài gōngzuò zhōng búduàn tígāo.","translation":"자격증 취득은 시작일 뿐 능력은 업무에서 계속 높여야 해요."},{"no":305,"category":"학교·학습·언어","word":"指导","pinyin":"zhǐdǎo","meaning":"지도하다, 가르치다","example":"教师的指导，应让学生逐渐具备独立解决问题的能力。","examplePinyin":"Jiàoshī de zhǐdǎo, yīng ràng xuésheng zhújiàn jùbèi dúlì jiějué wèntí de nénglì.","translation":"교사의 지도는 학생이 점차 스스로 문제를 풀 수 있게 해야 해요."},{"no":306,"category":"학교·학습·언어","word":"本2","pinyin":"běn","meaning":"책, 판본; 근본, 기본","example":"这个译本保留了原作的风格，值得反复阅读。","examplePinyin":"Zhè ge yìběn bǎoliú le yuánzuò de fēnggé, zhíde fǎnfù yuèdú.","translation":"이 번역본은 원작의 문체를 살려 거듭 읽을 가치가 있어요."},{"no":307,"category":"학교·학습·언어","word":"表达","pinyin":"biǎodá","meaning":"표현하다, 나타내다","example":"表达不同意见时，也应尊重对方的立场。","examplePinyin":"Biǎodá bùtóng yìjiàn shí, yě yīng zūnzhòng duìfāng de lìchǎng.","translation":"다른 의견을 표현할 때도 상대방의 입장을 존중해야 해요."},{"no":308,"category":"학교·학습·언어","word":"标题","pinyin":"biāotí","meaning":"제목, 표제","example":"文章的标题应突出主题，而不是一味吸引眼球。","examplePinyin":"Wénzhāng de biāotí yīng tūchū zhǔtí, ér búshì yíwèi xīyǐn yǎnqiú.","translation":"글의 제목은 눈길만 끌기보다 주제를 드러내야 해요."},{"no":309,"category":"학교·학습·언어","word":"比喻","pinyin":"bǐyù","meaning":"비유하다, 은유","example":"作者用一条河比喻时间，形象地表达了感慨。","examplePinyin":"Zuòzhě yòng yì tiáo hé bǐyù shíjiān, xíngxiàng de biǎodá le gǎnkǎi.","translation":"작가는 강에 시간을 비유해 감회를 생생하게 표현했어요."},{"no":310,"category":"학교·학습·언어","word":"称1","pinyin":"chēng","meaning":"부르다, 칭하다 ","example":"当地居民称这座古桥为城市的历史名片。","examplePinyin":"Dāngdì jūmín chēng zhè zuò gǔqiáo wéi chéngshì de lìshǐ míngpiàn.","translation":"주민들은 이 옛 다리를 도시의 역사를 보여 주는 명함이라 불러요."},{"no":311,"category":"학교·학습·언어","word":"称为","pinyin":"chēngwéi","meaning":"라고 하다, 칭하다","example":"这种利用自然光发电的技术，被称为光伏技术。","examplePinyin":"Zhè zhǒng lìyòng zìránguāng fādiàn de jìshù, bèi chēngwéi guāngfú jìshù.","translation":"자연광으로 전기를 만드는 이 기술은 태양광 발전 기술이라 해요."},{"no":312,"category":"학교·학습·언어","word":"出自","pinyin":"chūzì","meaning":"출처가 ~이다, ~에서 나오다","example":"这句话出自哪本书，最好查明后再引用。","examplePinyin":"Zhè jù huà chūzì nǎ běn shū, zuìhǎo chámíng hòu zài yǐnyòng.","translation":"이 말이 어느 책에서 나왔는지 확인한 뒤 인용하는 것이 좋아요."},{"no":313,"category":"학교·학습·언어","word":"词汇","pinyin":"cíhuì","meaning":"어휘, 단어","example":"阅读不同主题的文章，有助于扩大词汇范围。","examplePinyin":"Yuèdú bùtóng zhǔtí de wénzhāng, yǒuzhùyú kuòdà cíhuì fànwéi.","translation":"주제가 다양한 글을 읽으면 어휘의 폭을 넓히는 데 도움이 돼요."},{"no":314,"category":"학교·학습·언어","word":"读音","pinyin":"dúyīn","meaning":"발음, 독음","example":"同一个汉字在不同词语中，读音可能发生变化。","examplePinyin":"Tóngyīge Hànzì zài bùtóng cíyǔ zhōng, dúyīn kěnéng fāshēng biànhuà.","translation":"같은 한자라도 단어에 따라 발음이 달라질 수 있어요."},{"no":315,"category":"학교·학습·언어","word":"发音","pinyin":"fāyīn","meaning":"발음, 음성","example":"学会发音规律，有助于分辨听起来相近的词。","examplePinyin":"Xuéhuì fāyīn guīlǜ, yǒuzhùyú fēnbiàn tīng qǐlai xiāngjìn de cí.","translation":"발음 규칙을 배우면 비슷하게 들리는 단어를 구별하기 쉬워요."},{"no":316,"category":"학교·학습·언어","word":"概括","pinyin":"gàikuò","meaning":"요약하다, 개괄하다","example":"请用自己的话，概括这篇文章的核心观点。","examplePinyin":"Qǐng yòng zìjǐ de huà, gàikuò zhè piān wénzhāng de héxīn guāndiǎn.","translation":"이 글의 핵심 주장을 자신의 말로 요약해 보세요."},{"no":317,"category":"학교·학습·언어","word":"记载","pinyin":"jìzǎi","meaning":"기재하다, 기록하다","example":"地方志详细记载了河道改变前后的村庄分布。","examplePinyin":"Dìfāngzhì xiángxì jìzǎi le hédào gǎibiàn qiánhòu de cūnzhuāng fēnbù.","translation":"지방지는 강줄기 변화 전후의 마을 분포를 자세히 기록했어요."},{"no":318,"category":"학교·학습·언어","word":"来源","pinyin":"láiyuán","meaning":"출처, 근원","example":"引用数据时说明来源，是研究诚信的基本要求。","examplePinyin":"Yǐnyòng shùjù shí shuōmíng láiyuán, shì yánjiū chéngxìn de jīběn yāoqiú.","translation":"자료를 인용할 때 출처를 밝히는 것은 연구 윤리의 기본이에요."},{"no":319,"category":"학교·학습·언어","word":"描述","pinyin":"miáoshù","meaning":"기술하다, 묘사하다","example":"准确描述观察到的现象，是科学记录的基础。","examplePinyin":"Zhǔnquè miáoshù guānchá dào de xiànxiàng, shì kēxué jìlù de jīchǔ.","translation":"관찰한 현상을 정확히 묘사하는 것은 과학 기록의 기초예요."},{"no":320,"category":"학교·학습·언어","word":"名称","pinyin":"míngchēng","meaning":"명칭, 이름","example":"系统更新了栏目名称，但主要功能没有改变。","examplePinyin":"Xìtǒng gēngxīn le lánmù míngchēng, dàn zhǔyào gōngnéng méiyǒu gǎibiàn.","translation":"시스템은 항목 이름을 바꿨지만 주요 기능은 바꾸지 않았어요."},{"no":321,"category":"학교·학습·언어","word":"念","pinyin":"niàn","meaning":"소리 내어 읽다; 생각하다, 그리워하다","example":"请先把这段话念一遍，再说明你对它的理解。","examplePinyin":"Qǐng xiān bǎ zhè duàn huà niàn yí biàn, zài shuōmíng nǐ duì tā de lǐjiě.","translation":"이 문장을 먼저 소리 내어 읽고 어떻게 이해했는지 설명해 보세요."},{"no":322,"category":"학교·학습·언어","word":"拼音","pinyin":"pīnyīn","meaning":"병음(중국어 로마자 표기)","example":"拼音不仅标示读音，也有一定的分词书写规则。","examplePinyin":"Pīnyīn bùjǐn biāoshì dúyīn, yě yǒu yídìng de fēncí shūxiě guīzé.","translation":"병음에는 발음 표시뿐 아니라 단어를 나눠 적는 규칙도 있어요."},{"no":323,"category":"학교·학습·언어","word":"写作","pinyin":"xiězuò","meaning":"쓰기, 글짓기","example":"写作之前先整理结构，可以减少后期反复修改。","examplePinyin":"Xiězuò zhīqián xiān zhěnglǐ jiégòu, kěyǐ jiǎnshǎo hòuqī fǎnfù xiūgǎi.","translation":"쓰기 전에 구조를 정리하면 나중의 반복 수정을 줄일 수 있어요."},{"no":324,"category":"학교·학습·언어","word":"形容","pinyin":"xíngróng","meaning":"묘사하다, 형용","example":"他用熟悉的生活经验，形容这项复杂技术的作用。","examplePinyin":"Tā yòng shúxī de shēnghuó jīngyàn, xíngróng zhè xiàng fùzá jìshù de zuòyòng.","translation":"그는 익숙한 생활 경험으로 이 복잡한 기술의 작용을 묘사했어요."},{"no":325,"category":"학교·학습·언어","word":"用法","pinyin":"yòngfǎ","meaning":"사용법, 용도","example":"同一个词在不同语境中，可能有不同的用法。","examplePinyin":"Tóngyīge cí zài bùtóng yǔjìng zhōng, kěnéng yǒu bùtóng de yòngfǎ.","translation":"같은 단어도 문맥에 따라 용법이 달라질 수 있어요."},{"no":326,"category":"학교·학습·언어","word":"语音","pinyin":"yǔyīn","meaning":"발음, 음성","example":"听清语音细节，有助于区分意思不同的相近词。","examplePinyin":"Tīng qīng yǔyīn xìjié, yǒuzhùyú qūfēn yìsi bùtóng de xiāngjìn cí.","translation":"세부 발음을 잘 들으면 소리가 비슷한 다른 단어를 구별하기 쉬워요."},{"no":327,"category":"학교·학습·언어","word":"主题","pinyin":"zhǔtí","meaning":"주제, 테마","example":"围绕同一主题阅读不同文章，可以比较多种观点。","examplePinyin":"Wéirào tóngyī zhǔtí yuèdú bùtóng wénzhāng, kěyǐ bǐjiào duōzhǒng guāndiǎn.","translation":"한 주제의 글을 다양하게 읽으면 여러 관점을 비교할 수 있어요."},{"no":328,"category":"학교·학습·언어","word":"字母","pinyin":"zìmǔ","meaning":"알파벳, 문자","example":"这些字母组成的缩写，在不同领域可能有不同含义。","examplePinyin":"Zhèxiē zìmǔ zǔchéng de suōxiě, zài bùtóng lǐngyù kěnéng yǒu bùtóng hányì.","translation":"이 알파벳 약어는 분야에 따라 다른 의미를 가질 수 있어요."},{"no":329,"category":"학교·학습·언어","word":"操作","pinyin":"cāozuò","meaning":"조작하다, 운영하다","example":"没有接受培训的人员，不得独立操作这台机器。","examplePinyin":"Méiyǒu jiēshòu péixùn de rényuán, bùdé dúlì cāozuò zhè tái jīqì.","translation":"교육받지 않은 사람은 이 기계를 혼자 조작해서는 안 돼요."},{"no":330,"category":"학교·학습·언어","word":"测","pinyin":"cè","meaning":"측정하다, 재다","example":"施工之前，工程师先测了地面的高度差。","examplePinyin":"Shīgōng zhīqián, gōngchéngshī xiān cè le dìmiàn de gāodù chā.","translation":"공사 전에 기술자가 지면의 높이 차를 측정했어요."},{"no":331,"category":"학교·학습·언어","word":"创新","pinyin":"chuàngxīn","meaning":"혁신하다; 새로운 것을 창조하다","example":"创新并非完全推翻过去，也可以是细小的改进。","examplePinyin":"Chuàngxīn bìngfēi wánquán tuīfān guòqu, yě kěyǐ shì xìxiǎo de gǎijìn.","translation":"혁신은 과거를 완전히 뒤집는 것뿐 아니라 작은 개선일 수도 있어요."},{"no":332,"category":"학교·학습·언어","word":"发明","pinyin":"fāmíng","meaning":"발명하다, 발명","example":"这项发明看似简单，却解决了长期存在的难题。","examplePinyin":"Zhè xiàng fāmíng kànsì jiǎndān, què jiějué le chángqī cúnzài de nántí.","translation":"이 발명은 단순해 보여도 오랜 난제를 해결했어요."},{"no":333,"category":"학교·학습·언어","word":"高科技","pinyin":"gāokējì","meaning":"첨단 기술, 하이테크","example":"高科技设备进入农业，为精准灌溉提供了可能。","examplePinyin":"Gāokējì shèbèi jìnrù nóngyè, wèi jīngzhǔn guàngài tígōng le kěnéng.","translation":"첨단 장비가 농업에 도입되며 정밀 관개가 가능해졌어요."},{"no":334,"category":"학교·학습·언어","word":"功能","pinyin":"gōngnéng","meaning":"기능, 효용","example":"开发新功能之前，先要明确用户真正的需求。","examplePinyin":"Kāifā xīn gōngnéng zhīqián, xiān yào míngquè yònghù zhēnzhèng de xūqiú.","translation":"새 기능을 개발하기 전에 사용자의 실제 요구를 파악해야 해요."},{"no":335,"category":"학교·학습·언어","word":"键","pinyin":"jiàn","meaning":"키, 버튼; 건(화학 결합)","example":"误按删除键以后，他通过备份找回了文件。","examplePinyin":"Wù àn shānchú jiàn yǐhòu, tā tōngguò bèifèn zhǎohuí le wénjiàn.","translation":"삭제 키를 잘못 누른 뒤 그는 백업에서 파일을 복구했어요."},{"no":336,"category":"학교·학습·언어","word":"键盘","pinyin":"jiànpán","meaning":"키보드, 건반","example":"长时间使用键盘后，最好适当活动一下手腕。","examplePinyin":"Chángshíjiān shǐyòng jiànpán hòu, zuìhǎo shìdàng huódòng yíxià shǒuwàn.","translation":"키보드를 오래 사용한 뒤에는 손목을 적당히 움직여 주는 게 좋아요."},{"no":337,"category":"학교·학습·언어","word":"机器","pinyin":"jīqì","meaning":"기계, 장치","example":"机器替人完成重复劳动，并不意味着人不再重要。","examplePinyin":"Jīqì tìrén wánchéng chóngfù láodòng, bìng bú yìwèizhe rén búzài zhòngyào.","translation":"기계가 반복 노동을 대신한다고 사람이 중요하지 않은 것은 아니에요."},{"no":338,"category":"학교·학습·언어","word":"机器人","pinyin":"jīqìrén","meaning":"로봇","example":"机器人能够进入狭窄空间，协助人员检查管道。","examplePinyin":"Jīqìrén nénggòu jìnrù xiázhǎi kōngjiān, xiézhù rényuán jiǎnchá guǎndào.","translation":"로봇은 좁은 공간에 들어가 사람이 배관을 점검하도록 도울 수 있어요."},{"no":339,"category":"학교·학습·언어","word":"计算机","pinyin":"jìsuànjī","meaning":"컴퓨터, 전산기","example":"计算机能够快速处理数据，但结果仍需人来解释。","examplePinyin":"Jìsuànjī nénggòu kuàisù chǔlǐ shùjù, dàn jiéguǒ réng xū rén lái jiěshì.","translation":"컴퓨터는 자료를 빨리 처리하지만 결과의 해석은 여전히 사람의 몫이에요."},{"no":340,"category":"학교·학습·언어","word":"人工","pinyin":"réngōng","meaning":"사람의 손으로 하는; 인공; 인력","example":"人工审核与自动检测相结合，能减少遗漏。","examplePinyin":"Réngōng shěnhé yǔ zìdòng jiǎncè xiāng jiéhé, néng jiǎnshǎo yílòu.","translation":"사람의 검토와 자동 검사를 결합하면 누락을 줄일 수 있어요."},{"no":341,"category":"학교·학습·언어","word":"软件","pinyin":"ruǎnjiàn","meaning":"소프트웨어","example":"更新软件之前，应先备份重要文件。","examplePinyin":"Gēngxīn ruǎnjiàn zhīqián, yīng xiān bèifèn zhòngyào wénjiàn.","translation":"소프트웨어를 갱신하기 전에 중요한 파일부터 백업해야 해요."},{"no":342,"category":"학교·학습·언어","word":"设备","pinyin":"shèbèi","meaning":"장비, 설비","example":"设备越先进，越需要专业人员进行维护。","examplePinyin":"Shèbèi yuè xiānjìn, yuè xūyào zhuānyè rényuán jìnxíng wéihù.","translation":"장비가 첨단일수록 전문 인력의 관리가 더 필요해요."},{"no":343,"category":"학교·학습·언어","word":"设计","pinyin":"shèjì","meaning":"설계하다, 디자인","example":"好的设计，应该让不同能力的人都方便使用。","examplePinyin":"Hǎo de shèjì, yīnggāi ràng bùtóng nénglì de rén dōu fāngbiàn shǐyòng.","translation":"좋은 디자인은 능력이 다양한 사람들 모두에게 편리해야 해요."},{"no":344,"category":"학교·학습·언어","word":"设置","pinyin":"shèzhì","meaning":"설정하다, 조정하다","example":"设置账号权限时，应遵循完成任务所需的最低范围。","examplePinyin":"Shèzhì zhànghào quánxiàn shí, yīng zūnxún wánchéng rènwu suǒ xū de zuì dī fànwéi.","translation":"계정 권한은 업무에 필요한 최소 범위로 설정해야 해요."},{"no":345,"category":"학교·학습·언어","word":"鼠标","pinyin":"shǔbiāo","meaning":"마우스(컴퓨터)","example":"为了减轻手腕负担，他更换了更合适的鼠标。","examplePinyin":"Wèile jiǎnqīng shǒuwàn fùdān, tā gēnghuàn le gèng héshì de shǔbiāo.","translation":"손목 부담을 줄이려고 그는 더 적합한 마우스로 바꿨어요."},{"no":346,"category":"학교·학습·언어","word":"输入","pinyin":"shūrù","meaning":"입력하다, 넣다","example":"输入信息以后，请再次检查姓名和联系方式。","examplePinyin":"Shūrù xìnxī yǐhòu, qǐng zàicì jiǎnchá xìngmíng hé liánxì fāngshì.","translation":"정보를 입력한 뒤 이름과 연락처를 다시 확인하세요."},{"no":347,"category":"학교·학습·언어","word":"系统","pinyin":"xìtǒng","meaning":"체계,시스템/체계적으로","example":"系统出现异常后，技术人员立即检查了运行记录。","examplePinyin":"Xìtǒng chūxiàn yìcháng hòu, jìshù rényuán lìjí jiǎnchá le yùnxíng jìlù.","translation":"시스템에 이상이 생기자 기술자가 즉시 작동 기록을 점검했어요."},{"no":348,"category":"학교·학습·언어","word":"研发","pinyin":"yánfā","meaning":"연구 개발, 개발","example":"研发经费有限，团队必须明确优先解决的问题。","examplePinyin":"Yánfā jīngfèi yǒuxiàn, tuánduì bìxū míngquè yōuxiān jiějué de wèntí.","translation":"연구 개발비가 한정돼 있어 팀은 우선 해결할 문제를 정해야 해요."},{"no":349,"category":"학교·학습·언어","word":"研制","pinyin":"yánzhì","meaning":"연구 개발, 개발","example":"团队正在研制一种成本更低的净水设备。","examplePinyin":"Tuánduì zhèngzài yánzhì yì zhǒng chéngběn gèng dī de jìngshuǐ shèbèi.","translation":"팀은 비용이 더 낮은 정수 장치를 연구 개발하고 있어요."},{"no":350,"category":"학교·학습·언어","word":"硬件","pinyin":"yìngjiàn","meaning":"하드웨어, 물적 설비","example":"改善服务不能只升级硬件，还要加强人员培训。","examplePinyin":"Gǎishàn fúwù bùnéng zhǐ shēngjí yìngjiàn, hái yào jiāqiáng rényuán péixùn.","translation":"서비스 개선에는 하드웨어 갱신뿐 아니라 직원 교육도 필요해요."},{"no":351,"category":"학교·학습·언어","word":"应用","pinyin":"yìngyòng","meaning":"응용하다, 적용하다","example":"新技术应用到实际生产，还需要考虑成本和维护。","examplePinyin":"Xīn jìshù yìngyòng dào shíjì shēngchǎn, hái xūyào kǎolǜ chéngběn hé wéihù.","translation":"신기술을 실제 생산에 적용할 때는 비용과 유지 관리도 고려해야 해요."},{"no":352,"category":"학교·학습·언어","word":"智能","pinyin":"zhìnéng","meaning":"지능; 지능형","example":"智能设备应该帮助老人，而不是增加使用负担。","examplePinyin":"Zhìnéng shèbèi yīnggāi bāngzhù lǎorén, ér búshì zēngjiā shǐyòng fùdān.","translation":"지능형 기기는 노인에게 사용 부담을 늘리기보다 도움을 줘야 해요."},{"no":353,"category":"학교·학습·언어","word":"自动","pinyin":"zìdòng","meaning":"자동의, 자동으로; 자발적인","example":"自动生成的结果，也需要人工检查关键内容。","examplePinyin":"Zìdòng shēngchéng de jiéguǒ, yě xūyào réngōng jiǎnchá guānjiàn nèiróng.","translation":"자동 생성된 결과도 핵심 내용은 사람이 확인해야 해요."},{"no":354,"category":"직업·일과","word":"保安","pinyin":"bǎo'ān","meaning":"경비(원), 안전을 유지하다","example":"保安发现出口被堵住后，立即联系了负责人。","examplePinyin":"Bǎo'ān fāxiàn chūkǒu bèi dǔzhù hòu, lìjí liánxì le fùzérén.","translation":"경비원은 출구가 막힌 것을 보고 즉시 책임자에게 연락했어요."},{"no":355,"category":"직업·일과","word":"乘务员","pinyin":"chéngwùyuán","meaning":"승무원, 객실 승무원","example":"列车突然停车后，乘务员及时向旅客解释原因。","examplePinyin":"Lièchē tūrán tíngchē hòu, chéngwùyuán jíshí xiàng lǚkè jiěshì yuányīn.","translation":"열차가 갑자기 멈추자 승무원이 승객들에게 원인을 설명했어요."},{"no":356,"category":"직업·일과","word":"创业","pinyin":"chuàngyè","meaning":"창업하다, 사업을 시작하다","example":"创业之前，他花了半年时间了解行业现状。","examplePinyin":"Chuàngyè zhīqián, tā huā hánggèyè dōu zài tànsuǒ, rúhé shìyìng xīn de jìshù biànhuà.","translation":"각 업계는 새로운 기술 변화에 적응할 방법을 모색하고 있어요."},{"no":365,"category":"직업·일과","word":"工程师","pinyin":"gōngchéngshī","meaning":"엔지니어, 기술자","example":"工程师通过现场检测，找出了设备异常的原因。","examplePinyin":"Gōngchéngshī tōngguò xiànchǎng jiǎncè, zhǎochū le shèbèi yìcháng de yuányīn.","translation":"기술자는 현장 검사로 장비 이상 원인을 찾아냈어요."},{"no":366,"category":"직업·일과","word":"公务员","pinyin":"gōngwùyuán","meaning":"공무원, 공직자","example":"公务员的服务态度，直接影响群众的办事体验。","examplePinyin":"Gōngwùyuán de fúwù tàidu, zhíjiē yǐngxiǎng qúnzhòng de bànshì tǐyàn.","translation":"공무원의 응대 태도는 민원인이 느끼는 업무 경험에 직접 영향을 줘요."},{"no":367,"category":"직업·일과","word":"行","pinyin":"háng","meaning":"업종, 직업 분야; 줄, 행","example":"进入这一行之后，他才体会到专业积累的重要。","examplePinyin":"Jìnrù zhè yì háng zhīhòu, tā cái tǐhuì dào zhuānyè jīlěi de zhòngyào.","translation":"이 업종에 들어온 뒤에야 그는 전문성 축적의 중요성을 느꼈어요."},{"no":368,"category":"직업·일과","word":"简历","pinyin":"jiǎnlì","meaning":"이력서, 간단한 이력","example":"写简历时，要突出与申请岗位直接相关的经历。","examplePinyin":"Xiě jiǎnlì shí, yào tūchū yǔ shēnqǐng gǎngwèi zhíjiē xiāngguān de jīnglì.","translation":"이력서에는 지원 직무와 직접 관련된 경력을 강조해야 해요."},{"no":369,"category":"직업·일과","word":"技能","pinyin":"jìnéng","meaning":"기능, 기술, 숙련된 능력","example":"掌握一项实用技能，能为职业选择增加可能。","examplePinyin":"Zhǎngwò yí xiàng shíyòng jìnéng, néng wèi zhíyè xuǎnzé zēngjiā kěnéng.","translation":"실용 기술 하나를 익히면 직업 선택의 가능성이 넓어져요."},{"no":370,"category":"직업·일과","word":"就业","pinyin":"jiùyè","meaning":"취업하다,취직하다","example":"技能培训与实际岗位需求结合，才能促进就业。","examplePinyin":"Jìnéng péixùn yǔ shíjì gǎngwèi xūqiú jiéhé, cái néng cùjìn jiùyè.","translation":"기술 교육이 실제 직무 수요와 맞물려야 고용을 촉진할 수 있어요."},{"no":371,"category":"직업·일과","word":"看","pinyin":"kān","meaning":"지키다, 돌보다, 감시하다","example":"夜班工人轮流看守仓库，防止设备丢失。","examplePinyin":"Yèbān gōngrén lúnliú kānshǒu cāngkù, fángzhǐ shèbèi diūshī.","translation":"야간 근무자들이 번갈아 창고를 지키며 장비 분실을 막아요."},{"no":372,"category":"직업·일과","word":"老板","pinyin":"lǎobǎn","meaning":"사장, 주인","example":"老板把决定过程向员工公开，减少了不必要的猜测。","examplePinyin":"Lǎobǎn bǎ juédìng guòchéng xiàng yuángōng gōngkāi, jiǎnshǎo le búbìyào de cāicè.","translation":"사장은 결정 과정을 직원들에게 공개해 불필요한 추측을 줄였어요."},{"no":373,"category":"직업·일과","word":"劳动","pinyin":"láodòng","meaning":"노동, 일","example":"尊重劳动，不应该只看职业名称和收入高低。","examplePinyin":"Zūnzhòng láodòng, bù yīnggāi zhǐ kàn zhíyè míngchēng hé shōurù gāodī.","translation":"노동을 존중할 때는 직업명과 수입만 보아서는 안 돼요."},{"no":374,"category":"직업·일과","word":"领导","pinyin":"lǐngdǎo","meaning":"지도자, 리더","example":"好的领导愿意承认不足，也愿意听取基层意见。","examplePinyin":"Hǎo de lǐngdǎo yuànyì chéngrèn bùzú, yě yuànyì tīngqǔ jīcéng yìjiàn.","translation":"좋은 지도자는 자신의 부족함을 인정하고 일선의 의견도 들어요."},{"no":375,"category":"직업·일과","word":"离职","pinyin":"lízhí","meaning":"이직, 퇴직","example":"离职前做好工作交接，是对同事和客户负责。","examplePinyin":"Lízhí qián zuòhǎo gōngzuò jiāojiē, shì duì tóngshì hé kèhù fùzé.","translation":"퇴직 전에 인수인계를 잘하는 것은 동료와 고객에 대한 책임이에요."},{"no":376,"category":"직업·일과","word":"秘书","pinyin":"mìshū","meaning":"비서, 서기","example":"秘书提前整理议题，使会议能够集中讨论重点。","examplePinyin":"Mìshū tíqián zhěnglǐ yìtí, shǐ huìyì nénggòu jízhōng tǎolùn zhòngdiǎn.","translation":"비서는 의제를 미리 정리해 회의가 핵심에 집중하도록 했어요."},{"no":377,"category":"직업·일과","word":"农民","pinyin":"nóngmín","meaning":"농민, 농부","example":"新技术能否推广，还要看农民是否真正受益。","examplePinyin":"Xīn jìshù néngfǒu tuīguǎng, hái yào kàn nóngmín shìfǒu zhēnzhèng shòuyì.","translation":"새 기술의 보급 여부는 농민이 실제로 혜택을 보는지에 달려 있어요."},{"no":378,"category":"직업·일과","word":"培训","pinyin":"péixùn","meaning":"교육 훈련, 연수","example":"培训结束后，员工还需要在实际工作中巩固技能。","examplePinyin":"Péixùn jiéshù hòu, yuángōng hái xūyào zài shíjì gōngzuò zhōng gǒnggù jìnéng.","translation":"교육이 끝난 뒤에도 직원들은 실무에서 기술을 다져야 해요."},{"no":379,"category":"직업·일과","word":"聘请","pinyin":"pìnqǐng","meaning":"초빙하다, 고용하다","example":"学校聘请当地工匠，指导学生学习传统手艺。","examplePinyin":"Xuéxiào pìnqǐng dāngdì gōngjiàng, zhǐdǎo xuésheng xuéxí chuántǒng shǒuyì.","translation":"학교는 지역 장인을 초빙해 학생들에게 전통 기술을 가르치게 했어요."},{"no":380,"category":"직업·일과","word":"人才","pinyin ·식사","word":"梨","pinyin":"lí","meaning":"배, 서양배","example":"今年的梨产量较高，合作社正在寻找新的销售渠道。","examplePinyin":"Jīnnián de lí chǎnliàng jiào gāo, hézuòshè zhèngzài xúnzhǎo xīn de xiāoshòu qúdào.","translation":"올해는 배 수확량이 많아 협동조합이 새 판로를 찾고 있어요."},{"no":508,"category":"음식·식사","word":"粮食","pinyin":"liángshi","meaning":"식량, 양식","example":"减少粮食浪费，需要从采购和储存环节开始。","examplePinyin":"Jiǎnshǎo liángshi làngfèi, xūyào cóng cǎigòu hé chǔcún huánjié kāishǐ.","translation":"식량 낭비는 구매와 보관 단계부터 줄여야 해요."},{"no":509,"category":"음식·식사","word":"蔬菜","pinyin":"shūcài","meaning":"채소, 야채","example":"当季蔬菜通常运输距离较短，也更容易保持新鲜。","examplePinyin":"Dāng jì shūcài tōngcháng yùnshū jùlí jiào duǎn, yě gèng róngyì bǎochí xīnxiān.","translation":"제철 채소는 보통 운송 거리가 짧아 신선도를 유지하기 쉬워요."},{"no":510,"category":"음식·식사","word":"桃","pinyin":"táo","meaning":"복숭아","example":"今年桃的产量增加，果农开始尝试加工新产品。","examplePinyin":"Jīnnián táo de chǎnliàng zēngjiā, guǒnóng kāishǐ chángshì jiāgōng xīn chǎnpǐn.","translation":"올해 복숭아 수확량이 늘어 재배 농가는 새 가공품을 시도해요."},{"no":511,"category":"음식·식사","word":"甜品","pinyin":"tiánpǐn","meaning":"디저트, 단 음식","example":"这家店的甜品分量不大，强调食材本身的味道。","examplePinyin":"Zhè jiā diàn de tiánpǐn fènliang búdà, qiángdiào shí cái běnshēn de wèidao.","translation":"이 가게의 디저트는 양이 적고 재료 본연의 맛을 중시해요."},{"no":512,"category":"음식·식사","word":"土豆","pinyin":"tǔdòu","meaning":"감자","example":"土豆储存不当容易发芽，应注意保持适宜环境。","examplePinyin":"Tǔdòu chǔcún búdàng róngyì fāyá, yīng zhùyì bǎochí shìyí huánjìng.","translation":"감자는 잘못 보관하면 싹이 나기 쉬우니 알맞은 환경에 둬야 해요."},{"no":513,"category":"음식·식사","word":"雪糕","pinyin":"xuěgāo","meaning":"아이스크림, 빙과","example":"天气炎热，商家加强了雪糕运输过程中的温度管理。","examplePinyin":"Tiānqì yánrè, shāngjiā jiāqiáng le xuěgāo yùnshū guòchéng zhōng de wēndù guǎnlǐ.","translation":"더운 날씨에 판매자는 아이스크림 운송 중의 온도 관리를 강화했어요."},{"no":514,"category":"음식·식사","word":"油条","pinyin":"yóutiáo","meaning":"유탸오(튀긴 밀가루 음식)","example":"油条虽然受欢迎，也应与其他食物合理搭配。","examplePinyin":"Yóutiáo suīrán shòuhuānyíng, yě yīng yǔ qítā shíwù hélǐ dāpèi.","translation":"유탸오는 인기가 23,"category":"음식·식사","word":"火锅","pinyin":"huǒguō","meaning":"훠궈, 중국식 샤브샤브","example":"吃火锅时应适量取菜，避免最后剩下太多。","examplePinyin":"Chī huǒguō shí yīng shìliàng qǔ cài, bìmiǎn zuìhòu shèngxià tài duō.","translation":"훠궈를 먹을 때는 마지막에 많이 남지 않도록 적당히 가져오세요."},{"no":524,"category":"음식·식사","word":"加热","pinyin":"jiārè","meaning":"가열하다, 데우다","example":"剩余饭菜再次加热时，应确保内部也充分受热。","examplePinyin":"Shèngyú fàncài zàicì jiārè shí, yīng quèbǎo nèibù yě chōngfèn shòurè.","translation":"남은 음식을 다시 데울 때는 속까지 충분히 익혀야 해요."},{"no":525,"category":"음식·식사","word":"开水","pinyin":"kāishuǐ","meaning":"끓인 물, 끓는 물","example":"冲泡这种茶时，不宜直接使用刚烧好的开水。","examplePinyin":"Chōngpào zhè zhǒng chá shí, bùyí zhíjiē shǐyòng gāng shāo hǎo de kāishuǐ.","translation":"이 차를 우릴 때는 방금 끓인 물을 바로 쓰지 않는 것이 좋아요."},{"no":526,"category":"음식·식사","word":"年夜饭","pinyin":"niányèfàn","meaning":"섣달 그믐날 저녁 식사","example":"年夜饭不必追求排场，一家人团聚才最重要。","examplePinyin":"Niányèfàn búbì zhuīqiú páichang, yìjiārén tuánjù cái zuì zhòngyào.","translation":"그믐날 저녁 식사는 겉치레보다 가족이 모이는 것이 가장 중요해요."},{"no":527,"category":"음식·식사","word":"切","pinyin":"qiē","meaning":"자르다, 베다 / 끊다","example":"把蔬菜切成大小相近的块，才能受热均匀。","examplePinyin":"Bǎ shūcài qiēchéng dàxiǎo xiāngjìn de kuài, cái néng shòurè jūnyún.","translation":"채소를 비슷한 크기로 잘라야 고르게 익어요."},{"no":528,"category":"음식·식사","word":"烧","pinyin":"shāo","meaning":"불태우다; 가열하다, 끓이다; 굽다","example":"离开厨房前，要确认炉上的水是否已经烧开。","examplePinyin":"Líkāi chúfáng qián, yào quèrèn lú shàng de shuǐ shìfǒu yǐjīng shāokāi.","translation":"주방을 떠나기 전에 가열 중인 물이 끓었는지 확인해야 해요."},{"no":529,"category":"음식·식사","word":"烧烤","pinyin":"shāokǎo","meaning":"구이, 바비큐; 불에 굽다","example":"户外烧烤结束后，必须彻底处理剩余火源。","examplePinyin":"Hùwài shāokǎo jiéshù hòu, bìxū chèdǐ chǔlǐ shèngyú huǒyuán.","translation":"야외 바비큐를 마친 뒤에는 남은 불씨를 완전히 처리해야 해요."},{"no":530,"category":"음식·식사","word":"西餐","pinyin":"xīcān","meaning":"서양식, 양식","example":"这家西餐店结合本地食材，推出了新的季节菜单。","examplePinyin":"Zhè jiā xīcāndiàn jiéhé běndì shí cái, tuīchū le xīn de jìjié càidān.","translation":"이 양식당은 지역 식재료를 활용해 새 계절 메뉴를 내놨어요."},{"no":531,"category":"음식·식사","word":"吸管","pinyin":"xīguǎn","meaning":"빨대, 흡관","example":"减少一次性吸管的使用，需要商家与顾客共同配合。","examplePinyin":"Jiǎnshǎo yícìxìng xīguǎn de shǐyòng, xūyào shāngjiā yǔ gùkè gòngtóng pèihé.","translation":"일회용 빨대 사용을 줄이려면 판매자와 고객이 함께 협력해야 해요."},{"no":532,"category":"음식·식사","word":"炸","pinyin":"zhá","meaning":"(기름에) 튀기다","example":"炸食物时，要控制油温，避免表面焦了里面未熟。","examplePinyin":"Zhá shíwù shí, yào kòngzhì yóuwēn, bìmiǎn biǎomiàn jiāo le lǐmiàn wèi shú.","translation":"음식을 튀길 때는 겉만 타고 속이 덜 익지 않도록 기름 온도를 조절하세요."},{"no":533,"category":"음식·식사","word":"煮","pinyin":"zhǔ","meaning":"삶다, 끓이다","example":"这种豆子需要充分煮熟，才能安全食用。","examplePinyin":"Zhè zhǒng dòuzi xūyào chōngfèn zhǔshú, cái néng ānquán shíyòng.","translation":"이 콩은 충분히 삶아 익혀야 안전하게 먹을 수 있어요."},{"no":534,"category":"음식·식사","word":"保质期","pinyin":"bǎozhìqī","meaning":"품질 유지 기한","example":"购买打折食品时，尤其要留意保质期。","examplePinyin":"Gòumǎi dǎzhé shípǐn shí, yóuqí yào liúyì bǎozhìqī.","translation":"할인 식품을 살 때는 특히 품질 유지 기한을 살펴야 해요."},{"no":535,"category":"음식·식사","word":"成分","pinyin":"chéngfèn","meaning":"성분, 구성 요소","example":"购买护肤品前，最好先了解其中的主要成分。","examplePinyin":"Gòumǎi hùfūpǐn qián, zuìhǎo xiān liǎojiě qízhōng de zhǔyào chéngfèn.","translation":"화장품을 사기 전에 주요 성분부터 알아보는 것이 좋아요."},{"no":536,"category":"음식·식사","word":"淡","pinyin":"dàn","meaning":"싱겁다, 엷다 / 희미하다","example":"这道汤味道偏淡，可以根据个人口味适量加盐。","examplePinyin":"Zhè dào tāng wèidao piān dàn, kěyǐ gēnjù gèrén kǒuwèi shìliàng jiāyán.","translation":"이 국은 싱거운 편이니 입맛에 맞게 소금을 조금 넣어도 돼요."},{"no":537,"category":"음식·식사","word":"含量","pinyin":"hánliàng","meaning":"함량, 함유량","example":"阅读营养标签时，应留意每份食品的盐含量。","examplePinyin":"Yuèdú yíngyǎng biāoqiān shí, yīng liúyì měi fèn shípǐn de yán hánliàng.","translation":"영양 표시를 읽을 때는 1회 제공량의 소금 함량을 살펴야 해요."},{"no":538,"category":"음식·식사","word":"口味","pinyin":"kǒuwèi","meaning":"입맛, 취향","example":"食堂根据学生口味，适当调整了菜品。","examplePinyin":"Shítáng gēnjù xuésheng kǒuwèi, shìdàng tiáozhěng le càipǐn.","translation":"급식실은 학생들의 입맛에 맞춰 메뉴를 적절히 조정했어요."},{"no":539,"category":"음식·식사","word":"美味","pinyin":"měiwèi","meaning":"맛있는 음식, 진미; 맛있다","example":"普通的食材经过巧妙搭配，也能做出令人惊喜的美味。","examplePinyin":"Pǔtōng de shí cái jīngguò qiǎomiào dāpèi, yě néng zuòchū lìngrén jīngxǐ de měiwèi.","translation":"평범한 재료도 잘 조합하면 놀라울 만큼 맛있는 음식을 만들 수 있어요."},{"no":540,"category":"음식·식사","word":"浓","pinyin":"nóng","meaning":"진하다, 농밀하다","example":"咖啡味太浓，她加了一些牛奶来调整口感。","examplePinyin":"Kāfēi wèi tài nóng, tā jiā le yìxiē niúnǎi lái tiáozhěng kǒugǎn.","translation":"커피 맛이 너무 진해 그녀는 우유를 넣어 맛을 조절했어요."},{"no":541,"category":"음식·식사","word":"品","pinyin":"pǐn","meaning":"물품, 제품; 품질; 맛보다, 음미하다","example":"慢慢品这杯茶，能感受到不同层次的香味。","examplePinyin":"Mànmàn pǐn zhè bēi chá, néng gǎnshòu dào bùtóng céngcì de xiāngwèi.","translation":"이 차를 천천히 음미하면 여러 겹의 향을 느낄 수 있어요."},{"no":542,"category":"음식·식사","word":"热量","pinyin":"rèliàng","meaning":"열량, 칼로리","example":"食物热量相近，营养成分却可能有很大不同。","examplePinyin":"Shíwù rèliàng xiāngjìn, yíngyǎng chéngfèn què kěnéng yǒu hěn dà bùtóng.","translation":"음식의 열량이 비슷해도 영양 성분은 크게 다를 수 있어요."},{"no":543,"category":"음식·식사","word":"食用","pinyin":"shíyòng","meaning":"먹다, 식용으로 쓰다","example":"这种野生植物外形普通，却不适合直接食用。","examplePinyin":"Zhè zhǒng yěshēng zhíwù wàixíng pǔtōng, què bú shìhé zhíjiē shíyòng.","translation":"이 야생 식물은 평범하게 생겼지만 바로 먹기에는 적합하지 않아요."},{"no":544,"category":"음식·식사","word":"营养","pinyin":"yíngyǎng","meaning":"영양, 양분","example":"饮食多样化，有助于获得更加均衡的营养。","examplePinyin":"Yǐnshí duōyànghuà, yǒuzhùyú huòdé gèngjiā jūnhéng de yíngyǎng.","translation":"다양하게 먹으면 영양을 더 균형 있게 섭취하는 데 도움이 돼요."},{"no":545,"category":"음식·식사","word":"饮食","pinyin":"yǐnshí","meaning":"음식, 식생활","example":"调整饮食习惯需要长期坚持，不能只依靠短期控制。","examplePinyin":"Tiáozhěng yǐnshí xíguàn xūyào chángqī jiānchí, bùnéng zhǐ yīkào duǎnqī kòngzhì.","translation":"식습관 개선은 잠깐의 조절이 아니라 꾸준한 실천이 필요해요."},{"no":546,"category":"쇼핑·물건·장소","word":"包装","pinyin":"bāozhuāng","meaning":"포장하다, 포장","example":"减少过度包装，既能降低成本，也能节约资源。","examplePinyin":"Jiǎnshǎo guòdù bāozhuāng, jì néng jiàngdī Pinyin":"Xiǎodiàn kāiyè dìyī tiān, fùjìn jūmín fēnfēn qiánlái zhīchí.","translation":"작은 가게가 개업한 첫날 이웃 주민들이 잇따라 응원하러 왔어요."},{"no":555,"category":"쇼핑·물건·장소","word":"客服","pinyin":"kèfú","meaning":"고객 서비스, 상담원","example":"客服认真记录投诉，并说明了后续处理流程。","examplePinyin":"Kèfú rènzhēn jìlù tóusù, bìng shuōmíng le hòuxù chǔlǐ liúchéng.","translation":"고객 상담원은 불만을 꼼꼼히 기록하고 이후 절차를 설명했어요."},{"no":556,"category":"쇼핑·물건·장소","word":"客户","pinyin":"kèhù","meaning":"고객, 거래처","example":"了解客户的真正需求，比急于推销产品更重要。","examplePinyin":"Liǎojiě kèhù de zhēnzhèng xūqiú, bǐ jíyú tuīxiāo chǎnpǐn gèng zhòngyào.","translation":"서둘러 제품을 팔기보다 고객의 진짜 요구를 아는 게 더 중요해요."},{"no":557,"category":"쇼핑·물건·장소","word":"买卖","pinyin":"mǎimai","meaning":"매매, 거래","example":"做买卖不能只顾眼前利益，更要珍惜长期信誉。","examplePinyin":"Zuò mǎimai bùnéng zhǐgù yǎnqián lìyì, gèng yào zhēnxī chángqī xìnyù.","translation":"장사를 할 때는 당장의 이익보다 장기적인 신용을 소중히 해야 해요."},{"no":558,"category":"쇼핑·물건·장소","word":"配送","pinyin":"pèisòng","meaning":"배송하다, 보내다","example":"优化配送路线，可以减少空车行驶和燃料消耗。","examplePinyin":"Yōuhuà pèisòng lùxiàn, kěyǐ jiǎnshǎo kōngchē xíngshǐ hé ránliào xiāohào.","translation":"배송 경로를 최적화하면 빈 차 운행과 연료 소비를 줄일 수 있어요."},{"no":559,"category":"쇼핑·물건·장소","word":"品牌","pinyin":"pǐnpái","meaning":"브랜드, 상표","example":"品牌的信誉，需要长期稳定的服务来维护。","examplePinyin":"Pǐnpái de xìnyù, xūyào chángqī wěndìng de fúwù lái wéihù.","translation":"브랜드의 신뢰는 장기간 안정적인 서비스로 유지해야 해요."},{"no":560,"category":"쇼핑·물건·장소","word":"品质","pinyin":"pǐnzhì","meaning":"품질, 질","example":"消费者愿意回购，往往是因为信任产品的品质。","examplePinyin":"Xiāofèizhě yuànyì huígòu, wǎngwǎng shì yīnwèi xìnrèn chǎnpǐn de pǐnzhì.","translation":"소비자가 재구매하는 것은 제품의 품질을 믿기 때문인 경우가 많아요."},{"no":561,"category":"쇼핑·물건·장소","word":"商家","pinyin":"shāngjiā","meaning":"판매자, 상점, 업체","example":"商家应清楚标明价格，不得隐瞒额外收费。","examplePinyin":"Shāngjiā yīng qīngchu biāomíng jiàgé, bùdé yǐnmán éwài shōufèi.","translation":"판매자는 가격을 분명히 표시하고 추가 요금을 숨겨서는 안 돼요."},{"no":562,"category":"쇼핑·물건·장소","word":"试用","pinyin":"shìyòng","meaning":"시험 사용하다, 시용하다","example":"正式购买之前，客户可以申请试用一段时间。","examplePinyin":"Zhèngshì gòumǎi zhīqián, kèhù kěyǐ shēnqǐng shìyòng yí duàn shíjiān.","translation":"고객은 정식 구매 전에 일정 기간의 시험 사용을 신청할 수 있어요."},{"no":563,"category":"쇼핑·물건·장소","word":"售价","pinyin":"shòujià","meaning":"판매 가격, 판매가","example":"售价降低以后，商家仍然保持了原有的品质。","examplePinyin":"Shòujià jiàngdī yǐhòu, shāngjiā réngrán bǎochí le yuányǒu de pǐnzhì.","translation":"판매가가 낮아진 뒤에도 판매자는 기존 품질을 지켰어요."},{"no":564,"category":"쇼핑·물건·장소","word":"特产","pinyin":"tèchǎn","meaning":"특산품, 특산","example":"当地特产通过统一包装，更容易被外地顾客识别。","examplePinyin":"Dāngdì tèchǎn tōngguò tǒngyī bāozhuāng, gèng róngyì bèi wàidì gùkè shíbié.","translation":"지역 특산품은 포장을 통일하니 외지 고객들이 더 쉽게 알아봐요."},{"no":565,"category":"쇼핑·물건·장소","word":"消费者","pinyin":"xiāofèizhě","meaning":"소비자","example":"消费者有权知道商品的真实成分和收费标准。","examplePinyin":"Xiāofèizhě yǒuquán zhīdao shāngpǐn de zhēnshí chéngfèn hé shōufèi biāozhǔn.","translation":"소비자에게는 상품의 실제 성분과 요금 기준을 알 권리가 있어요."},{"no":566,"category":"쇼핑·물건·장소","word":"销量","pinyin":"xiāoliàng","meaning":"판매량, 실적","example":"销量增加的同时，企业也要保证售后服务跟得上。","examplePinyin":"Xiāoliàng zēngjiā de tóngshí, qǐyè yě yào bǎozhèng shòuhòu fúwù gēndeshàng.","translation":"판매량이 늘면 사후 서비스도 그에 맞게 제공해야 해요."},{"no":567,"category":"쇼핑·물건·장소","word":"销售","pinyin":"xiāoshòu","meaning":"판매하다, 판매","example":"合作社统一销售产品，使小农户有了更稳定的收入。","examplePinyin":"Hézuòshè tǒngyī xiāoshòu chǎnpǐn, shǐ xiǎo nónghù yǒu le gèng wěndìng de shōurù.","translation":"협동조합이 제품을 공동 판매해 소농의 수입이 더 안정됐어요."},{"no":568,"category":"쇼핑·물건·장소","word":"夜市","pinyin":"yèshì","meaning":"야시장, 야간 시장","example":"夜市增加垃圾回收点，引导摊主保持环境整洁。","examplePinyin":"Yèshì zēngjiā lājī huíshōu diǎn, yǐndǎo tānzhǔ bǎochí huánjìng zhěngjié.","translation":"야시장은 쓰레기 수거 장소를 늘려 상인들이 청결을 지키도록 해요."},{"no":569,"category":"쇼핑·물건·장소","word":"营业","pinyin":"yíngyè","meaning":"영업하다, 장사하다","example":"商店延长营业时间后，需要合理安排员工轮休。","examplePinyin":"Shāngdiàn yáncháng yíngyè shíjiān hòu, xūyào hélǐ ānpái yuángōng lúnxiū.","translation":"가게의 영업시간을 늘린 뒤에는 직원의 교대 휴식을 잘 배분해야 해요."},{"no":570,"category":"쇼핑·물건·장소","word":"优惠","pinyin":"yōuhuì","meaning":"혜택, 우대","example":"优惠结束之前，也应想清楚自己是否真的需要。","examplePinyin":"Yōuhuì jiéshù zhīqián, yě yīng xiǎng qīngchu zìjǐ shìfǒu zhēnde xūyào.","translation":"할인이 끝나기 전이라도 정말 필요한지 생각해야 해요."},{"no":571,"category":"쇼핑·물건·장소","word":"涨价","pinyin":"zhǎngjià","meaning":"가격 인상, 인상","example":"原材料涨价以后，企业尝试通过节约减少压力。","examplePinyin":"Yuáncáiliào zhǎngjià yǐhòu, qǐyè chángshì tōngguò jiéyuē jiǎnshǎo yālì.","translation":"원자재 가격이 오른 뒤 기업은 절약으로 부담을 줄이려 해요."},{"no":572,"category":"쇼핑·물건·장소","word":"折扣","pinyin":"zhékòu","meaning":"할인, 깎기","example":"折扣再大，如果商品不实用，也未必值得购买。","examplePinyin":"Zhékòu zài dà, rúguǒ shāngpǐn bù shíyòng, yě wèibì zhíde gòumǎi.","translation":"할인율이 커도 실용적이지 않은 상품은 살 가치가 없을 수 있어요."},{"no":573,"category":"쇼핑·물건·장소","word":"中介","pinyin":"zhōngjiè","meaning":"중개, 브로커","example":"选择房屋中介时，应核实资质并了解收费标准。","examplePinyin":"Xuǎnzé fángwū zhōngjiè shí, yīng héshí zīzhì bìng liǎojiě shōufèi biāozhǔn.","translation":"부동산 중개업체를 고를 때는 자격과 요금 기준을 확인해야 해요."},{"no":574,"category":"쇼핑·물건·장소","word":"保险","pinyin":"bǎoxiǎn","meaning":"보험","example":"购买旅游保险之前，要了解清楚保障范围。","examplePinyin":"Gòumǎi lǚyóu bǎoxiǎn zhīqián, yào liǎojiě qīngchu bǎozhàng fànwéi.","translation":"여행자 보험에 가입하기 전에 보장 범위를 알아보세요."},{"no":575,"category":"쇼핑·물건·장소","word":"成本","pinyin":"chéngběn","meaning":"비용, 원가","example":"使用统一零件，能降低维修成本并提高效率。","examplePinyin":"Shǐyòng tǒngyī língjiàn, néng jiàngdī wéixiū chéngběn bìng tígāo xiàolǜ.","translation":"규격화된 부품을 쓰면 수리비를 줄이고 효율을 높일 수 있어요."},{"no":576,"category":"쇼핑·물건·장소","word":"充值","pinyin":"chōngzhí","meaning":"충전하다(카드 등)","example":"公交卡可以通过手机充值，不必再到窗口排队。","examplePinyin":"Gōngjiāo kǎ kěyǐ tōngguò shǒujī chōngzhí, búbì zài dào chuāngkǒu páiduì.","translation":"교통카드는 휴대전화로 충전할 수 있어 창구에서 줄 설 필요가 없어요."},{"no":577,"category":"쇼핑·물건·장소","word":"存款","pinyin":"cúnkuǎn","meaning":"예금, 저금","example":"除了应付日常支出，他还坚持每月留下一笔存款。","examplePinyin":"Chúle yìngfu rìcháng zhīchū, tā hái jiānchí měi yuè liúxià yì bǐ cúnkuǎn.","translation":"그는 생활비를 쓰고도 매달 일정 금액을 저축해요."},{"no":578,"category":"쇼핑·물건·장소","word":"到期","pinyin":"dàoqī","meaning":"기한이 되다, 만기가 되다","example":"租赁合同即将到期，双方正在商量是否续签。","examplePinyin":"Zūlìn hétong jíjiāng dàoqī, shuāngfāng zhèngzài shāngliang shìfǒu xùqiān.","translation":"임대 계약 만기가 다가와 양측이 갱신 여부를 논의하고 있어요."},{"no":579,"category":"쇼핑·물건·장소","word":"风险","pinyin":"fēngxiǎn","meaning":"위험, 리스크","example":"作出投资决定前，不能只看收益而忽略风险。","examplePinyin":"Zuòchū tóuzī juédìng qián, bùnéng zhǐ kàn shōuyì ér hūlüè fēngxiǎn.","translation":"투자를 결정하기 전에 수익만 보고 위험을 무시하면 안 돼요."},{"no":580,"category":"쇼핑·물건·장소","word":"富","pinyin":"fù","meaning":"부유하다, 넉넉하다","example":"农民富起来以后，更重视村里的公共环境。","examplePinyin":"Nóngmín fù qǐlai yǐhòu, gèng zhòngshì cūnlǐ de gōnggòng huánjìng.","translation":"농민들은 생활이 넉넉해진 뒤 마을의 공공 환경을 더 중시해요."},{"no":581,"category":"쇼핑·물건·장소","word":"负担","pinyin":"fùdān","meaning":"부담, 짐","example":"过高的住房支出，给年轻家庭带来不小负担。","examplePinyin":"Guò gāo de zhùfáng zhīchū, gěi niánqīng jiātíng dàilái bùxiǎo fùdān.","translation":"지나치게 높은 주거비는 젊은 가정에 큰 부담이 돼요."},{"no":582,"category":"쇼핑·물건·장소","word":"话费","pinyin":"huàfèi","meaning":"통화 요금, 통신비","example":"出国前了解漫游话费，可以避免产生意外支出。","examplePinyin":"Chūguó qián liǎojiě mànyóu huàfèi, kěyǐ bìmiǎn chǎnshēng yìwài zhīchū.","translation":"출국 전에 로밍 요금을 알아두면 예상치 못한 지출을 피할 수 있어요."},{"no":583,"category":"쇼핑·물건·장소","word":"花费","pinyin":"huāfèi","meaning":"소비하다, 쓰다","example":"修复古建筑往往要花费大量时间和专业人力。","examplePinyin":"Xiūfù gǔjiànzhù wǎngwǎng yào huāfèi dàliàng shíjiān hé zhuānyè rénlì.","translation":"고건축물을 복원하려면 많은 시간과 전문 인력이 필요하곤 해요."},{"no":584,"category":"쇼핑·물건·장소","word":"黄金","pinyin":"huángjīn","meaning":"금, 황금","example":"投资黄金也会面临价格波动，并非完全没有风险。","examplePinyin":"Tóuzī huángjīn yě huì miànlín jiàgé bōdòng, bìngfēi wánquán méiyǒu fēngxiǎn.","translation":"금 투자도 가격 변동을 겪으며 위험이 전혀 없는 것은 아니에요."},{"no":585,"category":"쇼핑·물건·장소","word":"汇率","pinyin":"huìlǜ","meaning":"환율, 교환 비율","example":"汇率的变化，会影响企业的进口成本。","examplePinyin":"Huìlǜ y":"이동·교통","word":"返回","pinyin":"fǎnhuí","meaning":"돌아가다, 귀환","example":"确认没有遗漏物品后，考察队才返回营地。","examplePinyin":"Quèrèn méiyǒu yílòu wùpǐn hòu, kǎocháduì cái fǎnhuí yíngdì.","translation":"빠뜨린 물품이 없는지 확인한 뒤 조사대가 야영지로 돌아갔어요."},{"no":657,"category":"이동·교통","word":"飞行","pinyin":"fēixíng","meaning":"비행, 항공","example":"恶劣天气可能影响飞行，请留意航班通知。","examplePinyin":"Èliè tiānqì kěnéng yǐngxiǎng fēixíng, qǐng liúyì hángbān tōngzhī.","translation":"악천후가 비행에 영향을 줄 수 있으니 항공편 안내를 확인하세요."},{"no":658,"category":"이동·교통","word":"开通","pinyin":"kāitōng","meaning":"개통하다, 연결하다","example":"铁路开通后，两地之间的运输时间明显缩短。","examplePinyin":"Tiělù kāitōng hòu, liǎngdì zhījiān de yùnshū shíjiān míngxiǎn suōduǎn.","translation":"철도가 개통된 뒤 두 지역 사이의 운송 시간이 크게 줄었어요."},{"no":659,"category":"이동·교통","word":"列车","pinyin":"lièchē","meaning":"열차","example":"列车因前方线路检修，临时调整了停靠站点。","examplePinyin":"Lièchē yīn qiánfāng xiànlù jiǎnxiū, línshí tiáozhěng le tíngkàozhàn diǎn.","translation":"열차는 앞쪽 선로 보수 때문에 정차역을 일시 조정했어요."},{"no":660,"category":"이동·교통","word":"路线","pinyin":"lùxiàn","meaning":"노선, 코스","example":"选择运输路线时，要同时考虑时间、成本和安全。","examplePinyin":"Xuǎnzé yùnshū lùxiàn shí, yào tóngshí kǎolǜ shíjiān, chéngběn hé ānquán.","translation":"운송 경로를 정할 때는 시간과 비용, 안전을 함께 고려해야 해요."},{"no":661,"category":"이동·교통","word":"迷路","pinyin":"mílù","meaning":"길을 잃다","example":"在陌生城市迷路时，不妨先找一个可靠的问路点。","examplePinyin":"Zài mòshēng chéngshì mílù shí, bùfáng xiān zhǎo yí ge kěkào de wènlù diǎn.","translation":"낯선 도시에서 길을 잃으면 믿을 만한 안내 장소부터 찾아보세요."},{"no":662,"category":"이동·교통","word":"前进","pinyin":"qiánjìn","meaning":"전진하다, 나아가다","example":"只要方向没有错，缓慢前进也比原地抱怨更好。","examplePinyin":"Zhǐyào fāngxiàng méiyǒu cuò, huǎnmàn qiánjìn yě bǐ yuándì bàoyuàn gèng hǎo.","translation":"방향이 맞다면 제자리에서 불평하기보다 천천히라도 나아가는 게 나아요."},{"no":663,"category":"이동·교통","word":"前来","pinyin":"qiánlái","meaning":"오다(전진해 오다)","example":"接到通知后，技术人员立即前来协助维修。","examplePinyin":"Jiēdào tōngzhī hòu, jìshù rényuán lìjí qiánlái xiézhù wéixiū.","translation":"통지를 받은 기술자가 즉시 수리를 도우러 왔어요."},{"
