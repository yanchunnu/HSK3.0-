971,"category":"여가·미디어·소통","word":"录制","pinyin":"lùzhì","meaning":"녹음/녹화 제작하다","example":"这首歌是他在专业录音棚录制的。","examplePinyin":"Zhè shǒu gē shì tā zài zhuānyè lùyīnpéng lùzhì de.","translation":"이 곡은 그가 전문 녹음실에서 녹음한 곡이다.","sourceNo":4482},{"no":972,"category":"여가·미디어·소통","word":"漫画","pinyin":"mànhuà","meaning":"만화","example":"他从小就非常喜欢看日本漫画。","examplePinyin":"Tā cóngxiǎo jiù fēicháng xǐhuan kàn rìběn mànhuà.","translation":"그는 어렸을 때부터 일본 만화를 읽는 것을 매우 좋아했습니다.","sourceNo":4490},{"no":973,"category":"여가·미디어·소통","word":"描绘","pinyin":"miáohuì","meaning":"묘사하다, 그려내다","example":"作家在小说中生动描绘了乡村生活。","examplePinyin":"Zuòjiā zài xiǎoshuō zhōng shēngdòng miáohuì le xiāngcūn shēnghuó.","translation":"작가는 소설 속에서 시골생활을 생생하게 묘사하고 있다.","sourceNo":4510},{"no":974,"category":"여가·미디어·소통","word":"描写","pinyin":"miáoxiě","meaning":"묘사하다","example":"这段文字细腻地描写了主人公心理。","examplePinyin":"Zhè duàn wénzì xìnì de miáoxiě le zhǔréngōng xīnlǐ.","translation":"이 구절은 주인공의 심리를 섬세하게 묘사하고 있다.","sourceNo":4511},{"no":975,"category":"여가·미디어·소통","word":"民歌","pinyin":"míngē","meaning":"민요","example":"她用甜美的嗓音唱了一首民歌。","examplePinyin":"Tā yòng tiánměi de sǎngyīn chàng le yì shǒu míngē.","translation":"그녀는 감미로운 목소리로 민요를 불렀다.","sourceNo":4518},{"no":976,"category":"여가·미디어·소통","word":"名胜","pinyin":"míngshèng","meaning":"명승지","example":"这座古城拥有许多著名的名胜古迹。","examplePinyin":"Zhè zuò gǔchéng yōngyǒu xǔduō zhùmíng de míngshèng gǔjì.","translation":"이 고대 도시에는 많은 유명한 명소가 있습니다.","sourceNo":4524},{"no":977,"category":"여가·미디어·소통","word":"民间","pinyin":"mínjiān","meaning":"민간의; 민간","example":"这个传说在民间流传了很多年。","examplePinyin":"Zhè ge chuánshuō zài mínjiān liúchuán le hěnduōnián.","translation":"이 전설은 수년 동안 사람들 사이에 퍼져 왔습니다.","sourceNo":4525},{"no":978,"category":"여가·미디어·소통","word":"民俗","pinyin":"mínsú","meaning":"민속","example":"这座小镇至今保留着独特的民俗文化。","examplePinyin":"Zhè zuò xiǎozhèn zhìjīn bǎoliú zhe dútè de mínsú wénhuà.","translation":"이 마을에는 아직도 독특한 민속문화가 남아있습니다.","sourceNo":4526},{"no":979,"category":"여가·미디어·소통","word":"民宿","pinyin":" :"学校公告栏上贴了一张寻物启事。","examplePinyin":"Xuéxiào gōnggàolán shàng tiē le yì zhāng xúnwù qǐshì.","translation":"학교 게시판에 물건 분실 알림이 게시되었습니다.","sourceNo":4660},{"no":988,"category":"여가·미디어·소통","word":"棋子","pinyin":"qízǐ","meaning":"바둑알, 장기말","example":"他小心翼翼地把棋子放到了棋盘上。","examplePinyin":"Tā xiǎoxīn yìyì de bǎ qízǐ fàngdào le qípán shàng.","translation":"그는 바둑알을 조심스럽게 바둑판에 놓았어요.","sourceNo":4672},{"no":989,"category":"여가·미디어·소통","word":"曲","pinyin":"qǔ","meaning":"곡, 노래","example":"这位作曲家谱写了一首动人的乐曲。","examplePinyin":"Zhè wèi zuòqǔjiā pǔxiě le yì shǒu dòngrén de yuèqǔ.","translation":"작곡가는 아름다운 음악을 작곡했습니다.","sourceNo":4673},{"no":990,"category":"여가·미디어·소통","word":"趣味","pinyin":"qùwèi","meaning":"흥미, 재미","example":"这本科普读物写得生动，充满趣味。","examplePinyin":"Zhè běn kēpǔ dúwù xiě de shēngdòng, chōngmǎn qùwèi.","translation":"이 인기 과학 도서는 생생하게 쓰여져 있고 흥미가 가득합니다.","sourceNo":4685},{"no":991,"category":"여가·미디어·소통","word":"热点","pinyin":"rèdiǎn","meaning":"핫이슈","example":"这个话题最近成了社交媒体上的热点。","examplePinyin":"Zhè ge huàtí zuìjìn chéng le shèjiāo méitǐ shàng de rèdiǎn.","translation":"이 주제는 최근 SNS에서 화제가 됐다.","sourceNo":4688},{"no":992,"category":"여가·미디어·소통","word":"热度","pinyin":"rèdù","meaning":"열기, 관심도","example":"这部电视剧播出后热度一直居高不下。","examplePinyin":"Zhè bù diànshìjù bōchū hòu rèdù yìzhí jū gāo búxià.","translation":"이 TV 시리즈는 방영 이후 높은 인기를 유지하고 있습니다.","sourceNo":4689},{"no":993,"category":"여가·미디어·소통","word":"热门","pinyin":"rèmén","meaning":"인기 있는","example":"这部电影一上映就成为了热门话题。","examplePinyin":"Zhè bù diànyǐng yí shàngyìng jiù chéngwèi le rèmén huàtí.","translation":"영화는 개봉되자마자 화제가 됐다.","sourceNo":4690},{"no":994,"category":"여가·미디어·소통","word":"热线","pinyin":"rèxiàn","meaning":"핫라인","example":"遇到消费纠纷可以拨打投诉热线电话。","examplePinyin":"Yùdào xiāofèi jiūfēn kěyǐ bōdǎ tóusù rèxiàn diànhuà.","translation":"소비자 분쟁이 발생하면 불만 사항 핫라인에 전화할 수 있습니다.","sourceNo":4707},{"no":995,"category":"여가·미디어·소통","word":"热议","pinyin":"rèyì","meaning":"열띠게 논의하다","example":"这条新闻一经发布便引发网友热议。","examplePinyin":"Zhè tiáo xīnwén yìjīng fābù biàn yǐnfā wǎngyǒu rèyì.","translation":"이 소식은 공개되자마자 네티즌들 사이에서 뜨거운 논의를 불러일으켰다.","sourceNo":4708},{"no":996,"category":"여가·미디어·소통","word":"赛事","pinyin":"sàishì","meaning":"경기","example":"这场国际赛事吸引了众多观众到场。","examplePinyin":"Zhè chǎng guójì sàishì xīyǐn le zhòngduō guānzhòng dàochǎng.","translation":"이번 국제 경기는 많은 관중을 끌어모았어요.","sourceNo":4725},{"no":997,"category":"여가·미디어·소통","word":"散文","pinyin":"sǎnwén","meaning":"산문","example":"她最喜欢在闲暇时阅读优美的散文。","examplePinyin":"Tā zuì xǐhuan zài xiánxiá shí yuèdú yōuměi de sǎnwén.","translation":"그녀는 여가 시간에 아름다운 산문을 읽는 것을 가장 즐깁니다.","sourceNo":4731},{"no":998,"category":"여가·미디어·소통","word":"扫描","pinyin":"sǎomiáo","meaning":"스캔하다","example":"请用手机扫描二维码完成付款。","examplePinyin":"Qǐng yòng shǒujī sǎomiáo èrwéimǎ wánchéng fùkuǎn.","translation":"휴대폰으로 QR코드를 스캔하시면 결제가 완료됩니다.","sourceNo":4732},{"no":999,"category":"여가·미디어·소통","word":"上台","pinyin":"shàngtái","meaning":"무대에 오르다","example":"他鼓起勇气走上台，发表了演讲。","examplePinyin":"Tā gǔqǐ yǒngqì zǒu shàngtái, fābiǎo le yǎnjiǎng.","translation":"그는 용기를 내어 무대에 올라 연설을 했습니다.","sourceNo":4748},{"no":1000,"category":"여가·미디어·소통","word":"射击","pinyin":"shèjī","meaning":"사격하다","example":"他从小学习射击，如今已是国家运动员。","examplePinyin":"Tā cóngxiǎo xuéxí shèjī, rújīn yǐ shì guójiā yùndòngyuán.","translation":"그는 어려서부터 사격을 배웠고 지금은 국가대표가 됐다.","sourceNo":4758},{"no":1001,"category":"여가·미디어·소통","word":"神","pinyin":"shén","meaning":"신 / 신기하다","example":"古代人们相信山川湖海之中住着神灵。","examplePinyin":"Gǔdài rénmen xiāngxìn shānchuān húhǎi zhīzhōng zhù zhe shénlíng.","translation":"고대 사람들은 산, 호수, 바다에 신이 산다고 믿었습니다.","sourceNo":4759},{"no":1002,"category":"여가·미디어·소통","word":"审美","pinyin":"shěnměi","meaning":"심미하다; 미적 감각","example":"良好的审美能力需要长期培养训练。","examplePinyin":"Liánghǎo de shěnměi nénglì xūyào chángqī péiyǎng xùnliàn.","translation":"좋은 미적 능력은 장기적인 개발과 훈련이 필요합니다.","sourceNo":4768},{"no":1003,"category":"여가·미디어·소통","word":"摄像","pinyin":"shèxiàng","meaning":"촬영하다","example":"摄影师正在会场认真进行摄像工作。","examplePinyin":"Shèyǐngshī zhèngzài huìchǎng rènzhēn jìnxíng shèxiàng gōngzuò.","translation":"촬영 기사가 행사장에서 진지하게 영상을 찍고 있어요.","sourceNo":4773},{"no":1004,"category":"여가·미디어·소통","word":"诗词","pinyin":"shīcí","meaning":"시와 사(詞)","example":"他自幼喜爱背诵古典诗词名篇。","examplePinyin":"Tā zìyòu xǐ'ài bèisòng gǔdiǎn shīcí míngpiān.","translation":"그는 어려서부터 고전 시와 사를 외우는 것을 좋아했어요.","sourceNo":4780},{"no":1005,"category":"여가·미디어·소통","word":"诗歌","pinyin":"shīgē","meaning":"시가","example":"他从中学时代起就热爱创作诗歌。","examplePinyin":"Tā cóng zhōngxué shídài qǐ jiù rè'ài chuàngzuò shīgē.","translation":"그는 중학교 때부터 시 쓰는 것을 좋아했다.","sourceNo":4786},{"no":1006,"category":"여가·미디어·소통","word":"实话","pinyin":"shíhuà","meaning":"진실한 말","example":"他决定坦诚相待，说出了实话。","examplePinyin":"Tā juédìng tǎnchéng xiāngdài, shuōchū le shíhuà.","translation":"그는 정직하고 진실을 말하기로 결정했습니다.","sourceNo":4789},{"no":1007,"category":"여가·미디어·소통","word":"收藏","pinyin":"shōucáng","meaning":"소장하다, 수집하다","example":"他多年来一直热衷于收藏古董邮票。","examplePinyin":"Tā duōnián lái yìzhí rèzhōngyú shōucáng gǔdǒng yóupiào.","translation":"그는 수년 동안 열렬한 골동품 우표 수집가였습니다.","sourceNo":4809},{"no":1008,"category":"여가·미디어·소통","word":"手法","pinyin":"shǒufǎ","meaning":"수법, 기법","example":"这位画家的绘画手法独具一格。","examplePinyin":"Zhè wèi huàjiā de huìhuà shǒufǎ dújù yì gé.","translation":"화가의 그림 기법은 독특하다.","sourceNo":4810},{"no":1009,"category":"여가·미디어·소통","word":"手势","pinyin":"shǒushì","meaning":"손짓, 제스처","example":"他打了个手势示意大家安静下来。","examplePinyin":"Tā dǎlege shǒushì shìyì dàjiā ānjìng xiàlai.","translation":"그는 모두에게 조용히 하라고 손짓했다.","sourceNo":4814},{"no":1010,"category":"여가·미디어·소통","word":"书画","pinyin":"shūhuà","meaning":"서화","example":"他年轻时就非常喜爱收藏名家书画。","examplePinyin":"Tā niánqīng shí jiù fēicháng xǐ'ài shōucáng míngjiā shūhuà.","translation":"그는 어렸을 때 유명 화가들의 그림과 서예를 수집하는 것을 좋아했습니다.","sourceNo":4824},{"no":1011,"category":"여가·미디어·소통","word":"书面","pinyin":"shūmiàn","meaning":"서면의","example":"请将你的意见以书面形式提交给我。","examplePinyin":"Qǐng jiāng nǐ de yìjiàn yǐ shūmiàn xíngshì tíjiāo gěi wǒ.","translation":"귀하의 의견을 서면으로 제게 제출해 주십시오.","sourceNo":4832},{"no":1012,"category":"여가·미디어·소통","word":"搜集","pinyin":"sōují","meaning":"수집하다","example":"他花了大半年时间搜集相关资料。","examplePinyin":"Tā huā le dà bàn nián shíjiān sōují xiāngguān zīliào.","translation":"그는 관련 정보를 수집하는 데 반년 이상을 소비했습니다.","sourceNo":4844},{"no":1013,"category":"여가·미디어·소통","word":"塑造","pinyin":"sùzào","meaning":"형상화하다, 조각하다","example":"这位演员成功塑造了一个经典角色。","examplePinyin":"Zhè wèi yǎnyuán chénggōng sùzào le yí ge jīngdiǎn juésè.","translation":"배우는 성공적으로 고전 캐릭터를 만들었습니다.","sourceNo":4853},{"no":1014,"category":"여가·미디어·소통","word":"台球","pinyin":"táiqiú","meaning":"당구","example":"周末闲暇时，他喜欢和朋友打台球。","examplePinyin":"Zhōumò xiánxiá shí, tā xǐhuan hé péngyou dǎ táiqiú.","translation":"주말의 여가 시간에는 친구들과 당구를 치는 것을 좋아합니다.","sourceNo":4858},{"no":1015,"category":"여가·미디어·소통","word":"谈论","pinyin":"tánlùn","meaning":"논하다, 이야기하다","example":"大家聚在一起，热烈谈论着比赛结果。","examplePinyin":"Dàjiā jù zài yìqǐ, rèliè tánlùn zhe bǐsài jiēguǒ.","translation":"모두가 함께 모여 경기 결과에 대해 열정적으로 이야기했습니다.","sourceNo":4863},{"no":1016,"category":"여가·미디어·소통","word":"谈判","pinyin":"tánpàn","meaning":"담판하다, 협상하다","example":"双方经过多轮谈判，终于达成了协议。","examplePinyin":"Shuāngfāng jīngguò duōlún tánpàn, zhōngyú dáchéng le xiéyì.","translation":"여러 차례의 협상 끝에 양측은 마침내 합의에 이르렀습니다.","sourceNo":4864},{"no":1017,"category":"여가·미디어·소통","word":"探讨","pinyin":"tàntǎo","meaning":"탐구하다, 토의하다","example":"这场学术研讨会深入探讨了环保问题。","examplePinyin":"Zhè chǎng xuéshù yántǎohuì shēnrù tàntǎo le huánbǎo wèntí.","translation":"이번 학술세미나는 환경 문제를 심도 깊게 다루었습니다.","sourceNo":4866},{"no":1018,"category":"여가·미디어·소통","word":"田径","pinyin":"tiánjìng","meaning":"육상경기","example":"他从中学起就一直坚持田径训练。","examplePinyin":"Tā cóng zhōngxué qǐ jiù yìzhí jiānchí tiánjìng xùnliàn.","translation":"그는 중학교 때부터 육상 훈련을 해왔습니다.","sourceNo":4885},{"no":1019,"category":"여가·미디어·소통","word":"跳水","pinyin":"tiàoshuǐ","meaning":"다이빙하다","example":"她从小学习跳水，动作十分优美。","examplePinyin":"Tā cóngxiǎo xuéxí tiàoshuǐ, dòngzuò shífēn yōuměi.","translation":"그녀는 어렸을 때부터 다이빙을 배웠고 그녀의 움직임은 매우 우아합니다.","sourceNo":4892},{"no":1020,"category":"여가·미디어·소통","word":"题材","pinyin":"tícái","meaning":"소재, 제재","example":"这部小说选取了一个非常独特的题材。","examplePinyin":"Zhè bù xiǎoshuō xuǎnqǔ le yí ge fēicháng dútè de tícái.","translation":"이 소설은 매우 독특한 소재를 선택했다.","sourceNo":4893},{"no":1021,"category":"여가·미디어·소통","word":"体操","pinyin":"tǐcāo","meaning":"체조","example":"她每天坚持练习体操，柔韧性很好。","examplePinyin":"Tā měi tiān jiānchí liànxí tǐcāo, róurènxìng hěn hǎo.","translation":"그녀는 매일 체조를 연습하고 있으며 유연성이 좋습니다.","sourceNo":4894},{"no":1022,"category":"여가·미디어·소통","word":"童话","pinyin":"tónghuà","meaning":"동화","example":"妈妈每天晚上都给孩子讲童话故事。","examplePinyin":"Māma měi tiān wǎnshang dōu gěi háizi jiǎng tónghuà gùshi.","translation":"어머니는 매일 밤 아이들에게 동화를 들려준다.","sourceNo":4908},{"no":1023,"category":"여가·미디어·소통","word":"通话","pinyin":"tōnghuà","meaning":"통화하다","example":"他正在用手机和远方的朋友通话。","examplePinyin":"Tā zhèngzài yòng shǒujī hé yuǎnfāng de péngyou tōnghuà.","translation":"그는 휴대전화로 멀리 있는 친구와 통화를 하고 있었다.","sourceNo":4909},{"no":1024,"category":"여가·미디어·소통","word":"铜牌","pinyin":"tóngpái","meaning":"동메달","example":"他在这次比赛中获得了一枚铜牌。","examplePinyin":"Tā zài zhè cì bǐsài zhōng huòdé le yìméi tóngpái.","translation":"그는 이번 대회에서 동메달을 획득했다.","sourceNo":4912},{"no":1025,"category":"여가·미디어·소통","word":"通信","pinyin":"tōngxìn","meaning":"통신하다","example":"现代科技让远距离通信变得十分便捷。","examplePinyin":"Xiàndài kējì ràng yuǎnjùlí tōngxìn biànde shífēn biànjié.","translation":"현대 기술은 장거리 통신을 매우 편리하게 만듭니다.","sourceNo":4913},{"no":1026,"category":"여가·미디어·소통","word":"通讯","pinyin":"tōngxùn","meaning":"통신","example":"这家公司主要从事通讯设备的研发。","examplePinyin":"Zhè jiā gōngsī zhǔyào cóngshì tōngxùn shèbèi de yánfā.","translation":"이 회사는 주로 통신 장비의 연구 개발에 종사하고 있습니다.","sourceNo":4914},{"no":1027,"category":"여가·미디어·소통","word":"透露","pinyin":"tòulù","meaning":"누설하다, 알려주다","example":"记者会上，发言人透露了部分细节。","examplePinyin":"Jìzhěhuì shàng, fāyánrén tòulù le bùfen xìjié.","translation":"기자회견에서 대변인은 몇 가지 세부사항을 공개했다.","sourceNo":4919},{"no":1028,"category":"여가·미디어·소통","word":"图案","pinyin":"tú'àn","meaning":"도안, 무늬","example":"这件衣服上印着一幅精美的图案。","examplePinyin":"Zhè jiàn yīfu shàng yìn zhe yì fú jīngměi de tú'àn.","translation":"이 드레스에는 아름다운 무늬가 프린트되어 있습니다.","sourceNo":4928},{"no":1029,"category":"여가·미디어·소통","word":"图表","pinyin":"túbiǎo","meaning":"도표","example":"报告中附上了详细的数据图表。","examplePinyin":"Bàogào zhōng fùshàng le xiángxì de shùjù túbiǎo.","translation":"자세한 데이터 차트는 보고서에 첨부되어 있습니다.","sourceNo":4932},{"no":1030,"category":"여가·미디어·소통","word":"图像","pinyin":"túxiàng","meaning":"이미지, 화상","example":"这台摄像机拍摄的图像十分清晰。","examplePinyin":"Zhè tái shèxiàngjī pāishè de túxiàng shífēn qīngxī.","translation":"이 카메라로 촬영한 이미지는 매우 선명합니다.","sourceNo":4946},{"no":1031,"category":"여가·미디어·소통","word":"围棋","pinyin":"wéiqí","meaning":"바둑","example":"爷爷每天下午都喜欢下围棋。","examplePinyin":"Yéye měi tiān xiàwǔ dōu xǐhuan xià wéiqí.","translation":"할아버지는 매일 오후 바둑 두기를 좋아하세요.","sourceNo":4977},{"no":1032,"category":"여가·미디어·소통","word":"文物","pinyin":"wénwù","meaning":"문물, 문화재","example":"博物馆珍藏着大量珍贵的历史文物。","examplePinyin":"Bówùguǎn zhēncáng zhe dàliàng zhēnguì de lìshǐ wénwù.","translation":"박물관은 귀중한 역사적 유물을 많이 수집하고 있습니다.","sourceNo":4991},{"no":1033,"category":"여가·미디어·소통","word":"文艺","pinyin":"wényì","meaning":"문예","example":"学校每年都会举办一场文艺晚会。","examplePinyin":"Xuéxiào měi nián dōu huì jǔbàn yì chǎng wényì wǎnhuì.","translation":"학교는 매년 문예 공연 행사를 열어요.","sourceNo":4993},{"no":1034,"category":"여가·미디어·소통","word":"夏令营","pinyin":"xiàlìngyíng","meaning":"여름캠프","example":"孩子们参加了为期一周的夏令营。","examplePinyin":"Háizimen cānjiā le wéiqī yì zhōu de xiàlìngyíng.","translation":"아이들은 일주일간 여름 캠프에 참석했습니다.","sourceNo":5005},{"no":1035,"category":"여가·미디어·소통","word":"相传","pinyin":"xiāngchuán","meaning":"전해지다","example":"相传这座寺庙已有千年历史。","examplePinyin":"Xiāngchuán zhè zuò sìmiào yǐyǒu qiān nián lìshǐ.","translation":"이 절은 천 년의 역사를 지녔다고 전해져요.","sourceNo":5015},{"no":1036,"category":"여가·미디어·소통","word":"象棋","pinyin":"xiàngqí","meaning":"장기","example":"爷爷经常在公园里和老朋友下象棋。","examplePinyin":"Yéye jīngcháng zài gōngyuán lǐ hé lǎopéngyou xià xiàngqí.","translation":"할아버지는 공원에서 옛 친구와 장기를 자주 두세요.","sourceNo":5019},{"no":1037,"category":"여가·미디어·소통","word":"相声","pinyin":"xiàngsheng","meaning":"만담","example":"他们表演了一段十分幽默的相声。","examplePinyin":"Tāmen biǎoyǎn le yí duàn shífēn yōumò de xiàngsheng.","translation":"그들은 매우 익살스러운 만담 한 편을 공연했어요.","sourceNo":5020},{"no":1038,"category":"여가·미디어·소통","word":"笑容","pinyin":"xiàoróng","meaning":"미소, 웃는 얼굴","example":"见到老朋友，他脸上露出灿烂笑容。","examplePinyin":"Jiàndào lǎopéngyou, tā liǎnshàng lùchū cànlàn xiàoróng.","translation":"그의 오랜 친구를 본 그의 얼굴에는 큰 미소가 떠올랐습니다.","sourceNo":5039},{"no":1039,"category":"여가·미디어·소통","word":"喜剧","pinyin":"xǐjù","meaning":"코미디, 희극","example":"他喜欢在闲暇时看一部轻松喜剧。","examplePinyin":"Tā xǐhuan zài xiánxiá shí kàn yí bù qīngsōng xǐjù.","translation":"그는 여가 시간에 가벼운 코미디를 보는 것을 좋아합니다.","sourceNo":5051},{"no":1040,"category":"여가·미디어·소통","word":"新媒体","pinyin":"xīnméitǐ","meaning":"뉴미디어","example":"越来越多年轻人开始从事新媒体工作。","examplePinyin":"Yuèláiyuè duō niánqīngrén kāishǐ cóngshì xīnméitǐ gōngzuò.","translation":"점점 더 많은 젊은이들이 뉴미디어 분야에서 일하기 시작하고 있습니다.","sourceNo":5064},{"no":1041,"category":"여가·미디어·소통","word":"戏曲","pinyin":"xìqǔ","meaning":"전통극","example":"老人从年轻时就非常喜爱传统戏曲。","examplePinyin":"Lǎorén cóng niánqīng shí jiù fēicháng xǐ'ài chuántǒng xìqǔ.","translation":"그 어르신은 젊을 때부터 중국 전통극을 좋아하셨어요.","sourceNo":5075},{"no":1042,"category":"여가·미디어·소통","word":"习俗","pinyin":"xísú","meaning":"풍습","example":"每个地区都有自己独特的习俗。","examplePinyin":"Měi ge dìqū dōu yǒu zìjǐ dútè de xísú.","translation":"지역마다 저마다 독특한 풍습이 있어요.","sourceNo":5079},{"no":1043,"category":"여가·미디어·소통","word":"修复","pinyin":"xiūfù","meaning":"복원하다","example":"专家花费数月才修复了这幅古画。","examplePinyin":"Zhuānjiā huāfèi shù yuè cái xiūfù le zhè fú gǔhuà.","translation":"전문가들이 고대 그림을 복원하는 데 몇 달이 걸렸습니다.","sourceNo":5081},{"no":1044,"category":"여가·미디어·소통","word":"叙述","pinyin":"xùshù","meaning":"서술하다","example":"他向警方详细叙述了事情的经过。","examplePinyin":"Tā xiàng jǐngfāng xiángxì xùshù le shìqing de jīngguò.","translation":"그는 경찰에 무슨 일이 일어났는지 자세히 설명했다.","sourceNo":5098},{"no":1045,"category":"여가·미디어·소통","word":"亚军","pinyin":"yàjūn","meaning":"준우승","example":"他在这次比赛中获得了亚军的成绩。","examplePinyin":"Tā zài zhè cì bǐsài zhōng huòdé le yàjūn de chéngjì.","translation":"그는 이번 대회에서 2위를 했다.","sourceNo":5099},{"no":1046,"category":"여가·미디어·소통","word":"宴会","pinyin":"yànhuì","meaning":"연회","example":"公司为庆祝周年举办了一场宴会。","examplePinyin":"Gōngsī wèi qìngzhù zhōunián jǔbàn le yì chǎng yànhuì.","translation":"회사에서는 기념일을 축하하기 위해 연회를 열었습니다.","sourceNo":5111},{"no":1047,"category":"여가·미디어·소통","word":"研讨","pinyin":"yántǎo","meaning":"연구토의하다","example":"专家们围绕这个课题展开了研讨。","examplePinyin":"Zhuānjiāmen wéirào zhè ge kètí zhǎnkāi le yántǎo.","translation":"전문가들은 이 주제에 관해 토론을 진행했습니다.","sourceNo":5119},{"no":1048,"category":"여가·미디어·소통","word":"言语","pinyin":"yányǔ","meaning":"언어, 말","example":"他为人温和，言语间充满了善意。","examplePinyin":"Tā wèi rén wēnhé, yányǔ jiān chōngmǎn le shànyì.","translation":"그는 온화하고 그의 말에는 친절이 가득합니다.","sourceNo":5121},{"no":1049,"category":"여가·미디어·소통","word":"验证","pinyin":"yànzhèng","meaning":"검증하다","example":"科学家通过实验验证了这个理论。","examplePinyin":"Kēxuéjiā tōngguò shíyàn yànzhèng le zhè ge lǐlùn.","translation":"과학자들은 실험을 통해 이 이론을 검증했습니다.","sourceNo":5123},{"no":1050,"category":"여가·미디어·소통","word":"演奏","pinyin":"yǎnzòu","meaning":"연주하다","example":"他即兴为大家演奏了一首钢琴曲。","examplePinyin":"Tā jíxìng wèi dàjiā yǎnzòu le yì shǒu gāngqínqǔ.","translation":"그는 즉석에서 모든 사람을 위해 피아노 곡을 연주했습니다.","sourceNo":5124},{"no":1051,"category":"여가·미디어·소통","word":"遗产","pinyin":"yíchǎn","meaning":"유산","example":"这座古城被列为世界文化遗产。","examplePinyin":"Zhè zuò gǔchéng bèi lièwèi shìjiè wénhuà yíchǎn.","translation":"이 고대 도시는 세계문화유산으로 등록되어 있습니다.","sourceNo":5139},{"no":1052,"category":"여가·미디어·소통","word":"议论","pinyin":"yìlùn","meaning":"논의하다 / 논의","example":"大家议论纷纷，猜测事情真相。","examplePinyin":"Dàjiā yìlùn fēnfēn, cāicè shìqing zhēnxiàng.","translation":"모두가 문제의 진실에 대해 이야기하고 추측하고 있었습니다.","sourceNo":5153},{"no":1053,"category":"여가·미디어·소통","word":"银牌","pinyin":"yínpái","meaning":"은메달","example":"他在游泳比赛中夺得了一枚银牌。","examplePinyin":"Tā zài yóuyǒng bǐsài zhōng duódé le yìméi yínpái.","translation":"그는 수영에서 은메달을 땄습니다.","sourceNo":5168},{"no":1054,"category":"여가·미디어·소통","word":"仪式","pinyin":"yíshì","meaning":"의식","example":"学校为新生举行了隆重的开学仪式。","examplePinyin":"Xuéxiào wèi xīnshēng jǔxíng le lóngzhòng de kāixué yíshì.","translation":"학교는 신입생을 위해 성대한 입학식을 열었어요.","sourceNo":5175},{"no":1055,"category":"여가·미디어·소통","word":"遗址","pinyin":"yízhǐ","meaning":"유적지","example":"考古学家在这里发现了古城遗址。","examplePinyin":"Kǎogǔ xué jiā zài zhèlǐ fāxiàn le gǔchéng yízhǐ.","translation":"고고학자들은 이곳에서 고대 도시의 유적을 발견했습니다.","sourceNo":5187},{"no":1056,"category":"여가·미디어·소통","word":"乐器","pinyin":"yuèqì","meaning":"악기","example":"他从小学习各种传统民族乐器。","examplePinyin":"Tā cóngxiǎo xuéxí gèzhǒng chuántǒng mínzú yuèqì.","translation":"그는 어렸을 때부터 다양한 전통 민족 악기를 배웠습니다.","sourceNo":5223},{"no":1057,"category":"여가·미디어·소통","word":"乐曲","pinyin":"yuèqǔ","meaning":"악곡","example":"这首乐曲旋律优美，深受喜爱。","examplePinyin":"Zhè shǒu yuèqǔ xuánlǜ yōuměi, shēnshòu xǐ'ài.","translation":"이 곡은 아름다운 멜로디를 가지고 있어 매우 인기가 높습니다.","sourceNo":5225},{"no":1058,"category":"여가·미디어·소통","word":"造型","pinyin":"zàoxíng","meaning":"조형하다 / 조형, 스타일","example":"这座建筑的造型设计十分独特。","examplePinyin":"Zhè zuò jiànzhù de zàoxíng shèjì shífēn dútè.","translation":"이 건물의 모양과 디자인은 매우 독특합니다.","sourceNo":5251},{"no":1059,"category":"여가·미디어·소통","word":"争论","pinyin":"zhēnglùn","meaning":"논쟁하다","example":"大家就这个话题展开了热烈争论。","examplePinyin":"Dàjiā jiù zhè ge huàtí zhǎnkāi le rèliè zhēnglùn.","translation":"이 주제에 관해 활발한 토론이 있었습니다.","sourceNo":5283},{"no":1060,"category":"여가·미디어·소통","word":"争议","pinyin":"zhēngyì","meaning":"논쟁하다, 다투다","example":"这项决定引发了社会各界的争议。","examplePinyin":"Zhè xiàng juédìng yǐnfā le shèhuì gèjiè de zhēngyì.","translation":"이 결정은 각계각층에서 논란을 불러일으켰다.","sourceNo":5288},{"no":1061,"category":"여가·미디어·소통","word":"真相","pinyin":"zhēnxiàng","meaning":"진상","example":"记者经过深入调查揭露了事件真相。","examplePinyin":"Jìzhě jīngguò shēnrù diàochá jiēlù le shìjiàn zhēnxiàng.","translation":"기자는 심층 조사 끝에 사건의 진실을 밝혔다.","sourceNo":5291},{"no":1062,"category":"여가·미디어·소통","word":"专题","pinyin":"zhuāntí","meaning":"특집, 전문 주제","example":"记者制作了一期关于环保的专题节目。","examplePinyin":"Jìzhě zhìzuò le yì qī guānyú huánbǎo de zhuāntí jiémù.","translation":"기자는 환경 보호에 관한 특별 프로그램을 제작했습니다.","sourceNo":5353},{"no":1063,"category":"여가·미디어·소통","word":"祝福","pinyin":"zhùfú","meaning":"축복하다","example":"朋友们纷纷送上了真挚的生日祝福。","examplePinyin":"Péngyoumen fēnfēn sòng shàng le zhēnzhì de shēngrì zhùfú.","translation":"친구들이 진심 어린 생일 축하 메시지를 보냈습니다.","sourceNo":5362},{"no":1064,"category":"여가·미디어·소통","word":"祝愿","pinyin":"zhùyuàn","meaning":"축원하다","example":"我衷心祝愿你在新的一年心想事成。","examplePinyin":"Wǒ zhōngxīn zhùyuàn nǐ zài xīn de yì nián xīnxiǎng shì chéng.","translation":"새해에는 원하시는 모든 일들이 이루어지길 진심으로 기원합니다.","sourceNo":5371},{"no":1065,"category":"여가·미디어·소통","word":"著作","pinyin":"zhùzuò","meaning":"저작","example":"这位学者一生留下了许多珍贵著作。","examplePinyin":"Zhè wèi xuézhě yìshēng liúxià le xǔduō zhēnguì zhùzuò.","translation":"이 학자는 평생 귀중한 저작을 많이 남겼어요.","sourceNo":5374},{"no":1066,"category":"여가·미디어·소통","word":"字幕","pinyin":"zìmù","meaning":"자막","example":"这部外国电影配上了中文字幕。","examplePinyin":"Zhè bù wàiguó diànyǐng pèi shàng le Zhōngwén zìmù.","translation":"이 외국영화에는 중국어 자막이 있습니다.","sourceNo":5380},{"no":1067,"category":"여가·미디어·소통","word":"自言自语","pinyin":"zìyánzìyǔ","meaning":"혼잣말하다","example":"他常常一个人对着镜子自言自语。","examplePinyin":"Tā chángcháng yí ge rén duì zhe jìngzi zìyánzìyǔ.","translation":"그는 종종 거울 앞에서 혼잣말을 한다.","sourceNo":5383},{"no":1068,"category":"동작·감각·생각","word":"案例","pinyin":"ànlì","meaning":"사례, 사건","example":"他向我们分享了一个典型的成功案例。","examplePinyin":"Tā xiàng wǒmen fēnxiǎng le yí ge diǎnxíng de chénggōng ànlì.","translation":"그는 우리에게 전형적인 성공 사례를 들려주었습니다.","sourceNo":3603},{"no":1069,"category":"동작·감각·생각","word":"暗示","pinyin":"ànshì","meaning":"암시하다, 넌지시 알리다","example":"他的话暗示着事情并没有那么简单。","examplePinyin":"Tā de huà ànshì zhe shìqing bìng méiyǒu nàme jiǎndān.","translation":"그의 말은 상황이 그렇게 간단하지 않다는 것을 시사했습니다.","sourceNo":3605},{"no":1070,"category":"동작·감각·생각","word":"败","pinyin":"bài","meaning":"패배하다, 지다","example":"他在比赛中败给了对手，很沮丧。","examplePinyin":"Tā zài bǐsài zhōng bàigěi le duìshǒu, hěn jǔsàng.","translation":"그는 상대에게 패해 좌절감을 느꼈다.","sourceNo":3606},{"no":1071,"category":"동작·감각·생각","word":"摆","pinyin":"bǎi","meaning":"배치하다, 진열하다","example":"请把桌椅摆好，准备上课。","examplePinyin":"Qǐng bǎ zhuōyǐ bǎihǎo, zhǔnbèi shàngkè.","translation":"책상과 의자를 잘 배치하고 수업을 준비해 주세요.","sourceNo":3607},{"no":1072,"category":"동작·감각·생각","word":"摆放","pinyin":"bǎifàng","meaning":"진열하다, 놓다","example":"他把物品整齐地摆放在货架上。","examplePinyin":"Tā bǎ wùpǐn zhěngqí de bǎifàng zài huòjià shàng.","translation":"그는 선반 위에 있는 물건들을 가지런히 정리했습니다.","sourceNo":3610},{"no":1073,"category":"동작·감각·생각","word":"摆脱","pinyin":"bǎituō","meaning":"벗어나다, 탈피하다","example":"他终于摆脱了困境，重新开始了生活。","examplePinyin":"Tā zhōngyú bǎituō le kùnjìng, chóngxīn kāishǐ le shēnghuó.","translation":"그는 마침내 어려움에서 벗어나 다시 인생을 시작했습니다.","sourceNo":3615},{"no":1074,"category":"동작·감각·생각","word":"伴随","pinyin":"bànsuí","meaning":"동반하다, 함께 하다","example":"经济发展伴随着环境问题的出现。","examplePinyin":"Jīngjì fāzhǎn bànsuí zhe huánjìng wèntí de chūxiàn.","translation":"경제 발전은 환경 문제의 출현을 동반합니다.","sourceNo":3620},{"no":1075,"category":"동작·감각·생각","word":"爆","pinyin":"bào","meaning":"터지다, 폭발하다","example":"气球突然爆了，把大家吓了一跳。","examplePinyin":"Qìqiú tūrán bào le, bǎ dàjiā xià le yí tiào.","translation":"풍선이 갑자기 터져 모두를 놀라게 했습니다.","sourceNo":3622},{"no":1076,"category":"동작·감각·생각","word":"爆发","pinyin":"bàofā","meaning":"폭발하다, 분출하다","example":"火山爆发造成的威力非常大。","examplePinyin":"Huǒshān bàofā zàochéng de wēilì fēicháng dà.","translation":"화산 폭발은 매우 강력합니다.","sourceNo":3623},{"no":1077,"category":"동작·감각·생각","word":"保管","pinyin":"bǎoguǎn","meaning":"보관하다, 맡다","example":"请帮我保管好这个箱子，里面有贵重物品。","examplePinyin":"Qǐng bāng wǒ bǎoguǎn hǎo zhè ge xiāngzi, lǐmiàn yǒu guìzhòng wùpǐn.","translation":"이 상자를 안전하게 보관할 수 있도록 도와주세요. 그 안에 귀중품이 있습니다.","sourceNo":3624},{"no":1078,"category":"동작·감각·생각","word":"暴露","pinyin":"bàolù","meaning":"노출되다, 드러나다","example":"他小心地隐藏着自己的真实身份，避免暴露。","examplePinyin":"Tā xiǎoxīn de yǐncáng zhe zìjǐ de zhēnshí shēnfèn, bìmiǎn bàolù.","translation":"그는 노출을 피하기 위해 자신의 정체를 조심스럽게 숨깁니다.","sourceNo":3628},{"no":1079,"category":"동작·감각·생각","word":"爆炸","pinyin":"bàozhà","meaning":"폭발; 폭파","example":"化工厂的爆炸事故造成了人员伤亡和财产损失。","examplePinyin":"Huàgōngchǎng de bàozhà shìgù zàochéng le rényuán shāngwáng hé cáichǎn sǔnshī.","translation":"화학 공장의 폭발 사고로 인명과 재산 피해가 발생했어요.","sourceNo":3632},{"no":1080,"category":"동작·감각·생각","word":"悲观","pinyin":"bēiguān","meaning":"비관적, 비관","example":"对于未来，我们不能太悲观，要充满信心。","examplePinyin":"Duìyú wèilái, wǒmen bùnéng tài bēiguān, yào chōngmǎn xìnxīn.","translation":"우리는 미래에 대해 너무 비관할 수 없으며 자신감을 가져야 합니다.","sourceNo":3635},{"no":1081,"category":"동작·감각·생각","word":"被迫","pinyin":"bèipò","meaning":"강제로, 억지로","example":"他被迫放弃了这项计划，感到很遗憾。","examplePinyin":"Tā bèipò fàngqì le zhè xiàng jìhuà, gǎndào hěn yíhàn.","translation":"그는 프로젝트를 포기할 수밖에 없었고 후회했습니다.","sourceNo":3639},{"no":1082,"category":"동작·감각·생각","word":"悲伤","pinyin":"bēishāng","meaning":"슬프다, 애처롭다","example":"看到他悲伤的样子，我也很难过。","examplePinyin":"Kàndào tā bēishāng de yàngzi, wǒ yě hěn nánguò.","translation":"그가 슬퍼하는 모습을 보니 나도 슬펐다.","sourceNo":3640},{"no":1083,"category":"동작·감각·생각","word":"奔跑","pinyin":"bēnpǎo","meaning":"달리다, 질주하다","example":"他快速地奔跑，追赶即将到站的公交车。","examplePinyin":"Tā kuàisù de bēnpǎo, zhuīgǎn jíjiāng dào zhàn de gōngjiāochē.","translation":"그는 정류장에 도착하려는 버스를 따라잡기 위해 재빨리 달렸다.","sourceNo":3645},{"no":1084,"category":"동작·감각·생각","word":"闭","pinyin":"bì","meaning":"닫다, 폐쇄하다","example":"他闭上眼睛，静静地感受着周围的一切。","examplePinyin":"Tā bìshàng yǎnjing, jìngjìngde gǎnshòu zhe zhōuwéi de yíqiè.","translation":"그는 눈을 감고 조용히 주변의 모든 것을 느꼈습니다.","sourceNo":3648},{"no":1085,"category":"동작·감각·생각","word":"避","pinyin":"bì","meaning":"피하다, 회피하다","example":"我们要学会规避风险，而不是逃避。","examplePinyin":"Wǒmen yào xuéhuì guībì fēngxiǎn, ér búshì táobì.","translation":"우리는 위험으로부터 도망가는 대신 위험을 피하는 법을 배워야 합니다.","sourceNo":3649},{"no":1086,"category":"동작·감각·생각","word":"逼","pinyin":"bī","meaning":"강요하다, 억압하다","example":"他逼着对方做出了让步，手段很强硬。","examplePinyin":"Tā bī zhe duìfāng zuòchū le ràngbù, shǒuduàn hěn qiángyìng.","translation":"그는 매우 강경한 방법으로 상대방에게 양보를 강요했습니다.","sourceNo":3650},{"no":1087,"category":"동작·감각·생각","word":"编","pinyin":"biān","meaning":"엮다, 짜다","example":"他正在把那些松散的竹条编织在一起。","examplePinyin":"Tā zhèngzài bǎ nàxiē sōngsǎn de zhútiáo biānzhī zài yìqǐ.","translation":"그는 느슨한 대나무 조각들을 함께 엮고 있었습니다.","sourceNo":3651},{"no":1088,"category":"동작·감각·생각","word":"比方","pinyin":"bǐfang","meaning":"비유, 은유","example":"我打个比方，你就能明白这个原理了。","examplePinyin":"Wǒ dǎ ge bǐfang, nǐ jiù néng míngbai zhè ge yuánlǐ le.","translation":"제가 예를 들면 이 원리를 이해하실 수 있을 거예요.","sourceNo":3657},{"no":1089,"category":"동작·감각·생각","word":"补","pinyin":"bǔ","meaning":"보충하다, 보태다","example":"我们要补充体力，才能继续工作。","examplePinyin":"Wǒmen yào bǔchōng tǐlì, cái néng jìxù gōngzuò.","translation":"계속 일할 수 있도록 힘을 보충해야합니다.","sourceNo":3668},{"no":1090,"category":"동작·감각·생각","word":"捕","pinyin":"bǔ","meaning":"잡다; 체포하다","example":"警察正在抓捕一个危险的在逃犯。","examplePinyin":"Jǐngchá zhèngzài zhuābǔ yí ge wēixiǎn de zàitáofàn.","translation":"경찰은 도주 중인 위험한 범인을 체포하고 있어요.","sourceNo":3669},{"no":1091,"category":"동작·감각·생각","word":"不耐烦","pinyin":"bú nàifán","meaning":"못 참다 ,조급해 하다","example":"他总是对别人不耐烦，脾气很不好。","examplePinyin":"Tā zǒngshì duì biéren búnàifán, píqi hěn bùhǎo.","translation":"그는 항상 다른 사람들에게 참을성이 없고 성격이 좋지 않습니다.","sourceNo":3670},{"no":1092,"category":"동작·감각·생각","word":"不安","pinyin":"bù'ān","meaning":"불안하다, 초조하다","example":"夜里一个人在家，他感到有些不安。","examplePinyin":"Yèli yí ge rén zàijiā, tā gǎndào yǒuxiē bù'ān.","translation":"그는 밤에 집에 혼자 있으면 조금 불안했습니다.","sourceNo":3671},{"no":1093,"category":"동작·감각·생각","word":"布置","pinyin":"bùzhì","meaning":"배치하다, 정리하다","example":"老师正在布置教室，准备开家长会。","examplePinyin":"Lǎoshī zhèngzài bùzhì jiàoshì, zhǔnbèi kāi jiāzhǎnghuì.","translation":"선생님은 교실을 꾸미고 학부모-교사 모임을 준비하고 있습니다.","sourceNo":3689},{"no":1094,"category":"동작·감각·생각","word":"踩","pinyin":"cǎi","meaning":"밟다, 디디다","example":"他不小心踩到了别人的脚，连忙道歉。","examplePinyin":"Tā bù xiǎoxīn cǎi dào le biéren de jiǎo, liánmáng dàoqiàn.","translation":"실수로 다른 사람의 발을 밟은 뒤 재빨리 사과했다.","sourceNo":3693},{"no":1095,"category":"동작·감각·생각","word":"猜测","pinyin":"cāicè","meaning":"추측하다, 짐작하다","example":"大家对这件事的结果都有过各种猜测，但谁也不敢肯定。","examplePinyin":"Dàjiā duì zhè jiàn shì de jiēguǒ dōu yǒu guo gèzhǒng cāicè, dàn shuí yě bù gǎn kěndìng.","translation":"이 문제의 결과에 대해 모두가 다양한 추측을 내놓았지만 누구도 확신할 수 없습니다.","sourceNo":3694},{"no":1096,"category":"동작·감각·생각","word":"采集","pinyin":"cǎijí","meaning":"수집하다, 채집하다","example":"科学家在野外采集了许多珍贵的植物标本。","examplePinyin":"Kēxuéjiā zài yěwài cǎijí le xǔduō zhēnguì de zhíwù biāoběn.","translation":"과학자들은 야생에서 귀중한 식물 표본을 많이 수집했습니다.","sourceNo":3700},{"no":1097,"category":"동작·감각·생각","word":"采纳","pinyin":"cǎinà","meaning":"채택하다, 받아들이다","example":"他的建议得到了采纳，大家一致通过。","examplePinyin":"Tā de jiànyì dédào le cǎinà, dàjiā yízhì tōngguò.","translation":"그의 제안은 만장일치로 채택됐다.","sourceNo":3701},{"no":1098,"category":"동작·감각·생각","word":"测量","pinyin":"cèliáng","meaning":"측정하다, 재다","example":"他正在用工具测量这块木板的长度和宽度。","examplePinyin":"Tā zhèngzài yòng gōngjù cèliáng zhè kuài mùbǎn de chángdù hé kuāndù.","translation":"그는 도구를 사용하여 보드의 길이와 너비를 측정하고 있습니다.","sourceNo":3713},{"no":1099,"category":"동작·감각·생각","word":"嘲笑","pinyin":"cháoxiào","meaning":"비웃다, 조롱하다","example":"他因为说错话，受到了同事们的嘲笑。","examplePinyin":"Tā yīnwèi shuō cuòhuà, shòudào le tóngshìmen de cháoxiào.","translation":"그는 말을 잘못해서 동료들로부터 조롱을 받았습니다.","sourceNo":3743},{"no":1100,"category":"동작·감각·생각","word":"超越","pinyin":"chāoyuè","meaning":"초월하다, 넘다","example":"我们要不断超越自我，才能进步。","examplePinyin":"Wǒmen yào búduàn chāoyuè zìwǒ, cái néng jìnbù.","translation":"우리는 발전하기 위해 끊임없이 자신을 능가해야 합니다.","sourceNo":3744},{"no":1101,"category":"동작·감각·생각","word":"查询","pinyin":"cháxún","meaning":"조회하다, 문의하다","example":"他正在电脑上查询最新的航班信息。","examplePinyin":"Tā zhèngzài diànnǎo shàng cháxún zuìxīn de hángbān xìnxī.","translation":"그는 컴퓨터로 최신 항공편 정보를 확인하고 있었습니다.","sourceNo":3745},{"no":1102,"category":"동작·감각·생각","word":"撤回","pinyin":"chèhuí","meaning":"취소하다, 철회하다","example":"他决定撤回之前的申请，重新考虑。","examplePinyin":"Tā juédìng chèhuí zhīqián de shēnqǐng, chóngxīn kǎolǜ.","translation":"그는 이전 신청을 철회하고 다시 고려하기로 결정했습니다.","sourceNo":3748},{"no":1103,"category":"동작·감각·생각","word":"成","pinyin":"chéng","meaning":"이루어지다; 성사되다","example":"经过努力，他的理想终于成了现实。","examplePinyin":"Jīngguò nǔlì, tā de lǐxiǎng zhōngyú chéng le xiànshí.","translation":"열심히 노력한 끝에 그의 이상은 마침내 현실이 되었습니다.","sourceNo":3750},{"no":1104,"category":"동작·감각·생각","word":"撑","pinyin":"chēng","meaning":"버티다, 지탱하다","example":"他用双手撑住身体，从地上爬了起来。","examplePinyin":"Tā yòng shuāngshǒu chēngzhù shēntǐ, cóng dì shangpá le qǐlai.","translation":"그는 손으로 몸을 지탱하고 땅에서 일어났다.","sourceNo":3753},{"no":1105,"category":"동작·감각·생각","word":"承诺","pinyin":"chéngnuò","meaning":"약속하다,승낙하다","example":"他承诺会按时完成这项任务。","examplePinyin":"Tā chéngnuò huì ànshí wánchéng zhè xiàng rènwu.","translation":"그는 그 일을 제 시간에 완료하겠다고 약속했습니다.","sourceNo":3759},{"no":1106,"category":"동작·감각·생각","word":"呈现","pinyin":"chéngxiàn","meaning":"나타나다, 드러나다","example":"舞台上呈现出一幅美丽的景象。","examplePinyin":"Wǔtái shàng chéngxiàn chū yì fú měilì de jǐngxiàng.","translation":"아름다운 장면이 무대에 등장했습니다.","sourceNo":3761},{"no":1107,"category":"동작·감각·생각","word":"称作","pinyin":"chēngzuò","meaning":"~라고 부르다, 칭하다","example":"大家都把他称作“老李”，听起来很亲切。","examplePinyin":"Dàjiā dōu bǎ tā chēngzuò “ lǎolǐ ”, tīng qǐlai hěn qīnqiè.","translation":"모두 그를 ‘라오리’라고 부르는데 무척 친근하게 들려요.","sourceNo":3766},{"no":1108,"category":"동작·감각·생각","word":"持有","pinyin":"chíyǒu","meaning":"가지다, 보유하다","example":"公司持有该品牌百分之六十的股份。","examplePinyin":"Gōngsī chíyǒu gāi pǐnpái bǎi fēnzhī liùshí de gǔfèn.","translation":"회사는 브랜드 지분 60%를 보유하고 있다.","sourceNo":3772},{"no":1109,"category":"동작·감각·생각","word":"冲","pinyin":"chòng","meaning":"돌진하다, 돌격","example":"他猛地冲进房间，把大家吓了一跳。","examplePinyin":"Tā měngde chòngjìn fángjiān, bǎ dàjiā xià le yí tiào.","translation":"그는 방으로 뛰어들어 모두를 놀라게 했다.","sourceNo":3773},{"no":1110,"category":"동작·감각·생각","word":"崇拜","pinyin":"chóngbài","meaning":"숭배하다, 존경","example":"他非常崇拜这位科学家，是他的粉丝。","examplePinyin":"Tā fēicháng chóngbài zhè wèi kēxuéjiā, shì tā de fěnsī.","translation":"그는 과학자를 매우 존경했고 그의 팬이었습니다.","sourceNo":3774},{"no":1111,"category":"동작·감각·생각","word":"冲动","pinyin":"chōngdòng","meaning":"충동, 충동","example":"年轻人有时容易冲动，做错决定。","examplePinyin":"Niánqīngrén yǒushí róngyì chōngdòng, zuò cuò juédìng.","translation":"젊은이들은 때때로 충동적이고 잘못된 결정을 내립니다.","sourceNo":3775},{"no":1112,"category":"동작·감각·생각","word":"冲击","pinyin":"chōngjī","meaning":"충격, 충격","example":"这次事件对行业造成了巨大的冲击。","examplePinyin":"Zhè cì shìjiàn duì hángyè zàochéng le jùdà de chōngjī.","translation":"이번 사건은 업계에 큰 영향을 미쳤다.","sourceNo":3776},{"no":1113,"category":"동작·감각·생각","word":"冲突","pinyin":"chōngtū","meaning":"충돌, 갈등","example":"他们因为利益冲突，经常产生矛盾。","examplePinyin":"Tāmen yīnwèi lìyì chōngtū, jīngcháng chǎnshēng máodùn.","translation":"이해상충으로 인해 갈등을 겪는 경우가 많습니다.","sourceNo":3779},{"no":1114,"category":"동작·감각·생각","word":"愁","pinyin":"chóu","meaning":"근심하다, 걱정","example":"他为明天的考试而发愁，很担心。","examplePinyin":"Tā wèi míngtiān de kǎoshì ér fāchóu, hěn dānxīn.","translation":"그는 내일 시험이 걱정되어 매우 걱정됩니다.","sourceNo":3780},{"no":1115,"category":"동작·감각·생각","word":"筹备","pinyin":"chóubèi","meaning":"준비하다, 모금하다","example":"他们正在为这次婚礼筹备各种物品。","examplePinyin":"Tāmen zhèngzài wèi zhè cì hūnlǐ chóubèi gèzhǒng wùpǐn.","translation":"그들은 결혼식을 위해 다양한 물건을 준비하고 있습니다.","sourceNo":3781},{"no":1116,"category":"동작·감각·생각","word":"抽奖","pinyin":"chōujiǎng","meaning":"추첨, 복권","example":"公司在年会时设置了抽奖环节，大家很开心。","examplePinyin":"Gōngsī zài nián huì shí shèzhì le chōujiǎng huánjié, dàjiā hěn kāixīn.","translation":"회사는 송년 행사에 경품 추첨을 마련해 모두 즐거워했어요.","sourceNo":3782},{"no":1117,"category":"동작·감각·생각","word":"串","pinyin":"chuàn","meaning":"이어지다, 전하다","example":"这些事件串起来，就构成了一个完整的故事。","examplePinyin":"Zhèxiē shìjiàn chuàn qǐlai, jiù gòuchéng le yí ge wánzhěng de gùshi.","translation":"이러한 사건들은 서로 연결되어 완전한 이야기를 형성합니다.","sourceNo":3785},{"no":1118,"category":"동작·감각·생각","word":"闯","pinyin":"chuǎng","meaning":"들어가다, 돌진하다","example":"他一下子闯进了我的办公室，很着急。","examplePinyin":"Tā yíxiàzi chuǎngjìn le wǒ de bàngōngshì, hěn zháojí.","translation":"그는 매우 불안해하며 갑자기 내 사무실로 들어왔습니다.","sourceNo":3788},{"no":1119,"category":"동작·감각·생각","word":"穿过","pinyin":"chuānguò","meaning":"뚫다, 통과하다","example":"他穿过一条小巷，来到了大街上。","examplePinyin":"Tā chuānguò yì tiáo xiǎoxiàng, láidào le dàjiē shang.","translation":"그는 골목을 지나 거리로 나왔다.","sourceNo":3793},{"no":1120,"category":"동작·감각·생각","word":"出力","pinyin":"chūlì","meaning":"힘을 내다, 노력하다","example":"只要大家一起出力，就一定能克服眼前的困难。","examplePinyin":"Zhǐyào dàjiā yìqǐ chūlì, jiù yídìng néngkèfú yǎnqián de kùnnan.","translation":"모두 함께 힘을 보태면 눈앞의 어려움을 이겨 낼 수 있어요.","sourceNo":3810},{"no":1121,"category":"동작·감각·생각","word":"出入","pinyin":"chūrù","meaning":"출입, 드나듬","example":"进出大楼的人都要登记，不能随意出入。","examplePinyin":"Jìnchū dàlóu de rén dōu yào dēngjì, bùnéng suíyì chūrù.","translation":"건물을 드나드는 사람은 모두 등록해야 하며 마음대로 출입할 수 없어요.","sourceNo":3813},{"no":1122,"category":"동작·감각·생각","word":"出示","pinyin":"chūshì","meaning":"제시하다, 내보이다","example":"他出示了身份证件，证明了自己的身份。","examplePinyin":"Tā chūshì le shēnfènzhèng jiàn, zhèngmíng le zìjǐ de shēnfèn.","translation":"그는 신분증을 보여주며 신분을 증명했다.","sourceNo":3814},{"no":1123,"category":"동작·감각·생각","word":"刺","pinyin":"cì","meaning":"찌르다, 찌르다","example":"他不小心被玫瑰花刺扎了一下手指。","examplePinyin":"Tā bù xiǎoxīn bèi méiguīhuā cìzhā le yíxià shǒuzhǐ.","translation":"그는 실수로 장미 가시에 손가락을 찔렸습니다.","sourceNo":3818},{"no":1124,"category":"동작·감각·생각","word":"挫折","pinyin":"cuòzhé","meaning":"좌절, 난관","example":"他经历了很多挫折，但从不放弃希望。","examplePinyin":"Tā jīnglì le hěn duō cuòzhé, dàn cóngbú fàngqì xīwàng.","translation":"그는 많은 어려움을 겪었지만 결코 희망을 버리지 않았습니다.","sourceNo":3832},{"no":1125,"category":"동작·감각·생각","word":"搭","pinyin":"dā","meaning":"걸다, 얽다","example":"他把外套搭在椅背上，然后坐了下来。 耽误了重要的会议。","examplePinyin":"Yīnwèi dǔchē, tā dānwu le zhòngyào de huìyì.","translation":"그는 교통 체증 때문에 중요한 회의에 늦었어요.","sourceNo":3867},{"no":1134,"category":"동작·감각·생각","word":"担忧","pinyin":"dānyōu","meaning":"근심, 걱정","example":"他总是为孩子的未来而担忧。","examplePinyin":"Tā zǒngshì wèi háizi de wèilái ér dānyōu.","translation":"그는 늘 아이들의 미래를 걱정한다.","sourceNo":3868},{"no":1135,"category":"동작·감각·생각","word":"搭配","pinyin":"dāpèi","meaning":"배합하다, 어울리다","example":"红色和黑色搭配在一起，非常经典。","examplePinyin":"Hóngsè hé hēisè dāpèi zài yìqǐ, fēicháng jīngdiǎn.","translation":"레드와 블랙의 조합이 참 클래식하네요.","sourceNo":3875},{"no":1136,"category":"동작·감각·생각","word":"打造","pinyin":"dǎzào","meaning":"만들어 내다, 조성하다","example":"他们正在打造一个全新的国产品牌。","examplePinyin":"Tāmen zhèngzài dǎzào yí ge quánxīn de guóchǎn pǐnpái.","translation":"그들은 새로운 국내 브랜드를 구축하고 있습니다.","sourceNo":3879},{"no":1137,"category":"동작·감각·생각","word":"得知","pinyin":"dézhī","meaning":"알다, 깨닫다","example":"他得知自己获奖后，激动地跳了起来。","examplePinyin":"Tā dézhī zìjǐ huòjiǎng hòu, jīdòng de tiào le qǐlai.","translation":"그는 자신이 상을 받았다는 소식을 듣고 흥분해서 펄쩍 뛰었다.","sourceNo":3886},{"no":1138,"category":"동작·감각·생각","word":"点燃","pinyin":"diǎnrán","meaning":"점화하다, 불붙이다","example":"他点燃了一根蜡烛，屋里变得亮堂起来。","examplePinyin":"Tā diǎnrán le yìgēn làzhú, wūlǐ biànde liàngtáng qǐlai.","translation":"촛불을 켜니 방이 밝아졌습니다.","sourceNo":3893},{"no":1139,"category":"동작·감각·생각","word":"吊","pinyin":"diào","meaning":"매달다, 감다","example":"他把一幅画吊在墙上，作为装饰。","examplePinyin":"Tā bǎ yì fú huà diào zài qiángshàng, zuòwéi zhuāngshì.","translation":"그는 장식으로 벽에 그림을 걸었습니다.","sourceNo":3896},{"no":1140,"category":"동작·감각·생각","word":"跌","pinyin":"diē","meaning":"떨어지다, 추락","example":"股票的价格下跌了很多，投资者损失惨重。","examplePinyin":"Gǔpiào de jiàgé xiàdiē le hěn duō, tóuzīzhě sǔnshī cǎnzhòng.","translation":"주가가 많이 떨어져 투자자들은 큰 손실을 입었다.","sourceNo":3901},{"no":1141,"category":"동작·감각·생각","word":"抵抗","pinyin":"dǐkàng","meaning":"저항하다; 맞서다","example":"他带领队伍抵抗了敌人的多次进攻。","examplePinyin":"Tā dàilǐng duìwǔ dǐkàng le dírén de duōcì jìng yú zìjǐ de dōngxi.","translation":"그는 힘을 다해 자기 것을 되찾았어요.","sourceNo":3935},{"no":1150,"category":"동작·감각·생각","word":"躲避","pinyin":"duǒbì","meaning":"피하다, 회피하다","example":"下雨了，他赶紧躲避到屋檐下。","examplePinyin":"Xiàyǔ le, tā gǎnjǐn duǒbì dào wūyánxià.","translation":"비가 내리기 시작하자 그는 서둘러 처마 밑으로 피신했다.","sourceNo":3936},{"no":1151,"category":"동작·감각·생각","word":"夺取","pinyin":"duóqǔ","meaning":"빼앗다, 탈취","example":"他想要夺取比赛的冠军，为此付出了很多努力。","examplePinyin":"Tā xiǎngyào duóqǔ bǐsài de guànjūn, wèicǐ fùchū le hěn duō nǔlì.","translation":"그는 경기의 우승을 차지하려고 큰 노력을 기울였어요.","sourceNo":3940},{"no":1152,"category":"동작·감각·생각","word":"发愁","pinyin":"fāchóu","meaning":"근심하다, 걱정하다","example":"他正在为如何解决这个难题而发愁。","examplePinyin":"Tā zhèngzài wèi rúhé jiějué zhè ge nántí ér fāchóu.","translation":"그는 이 문제를 어떻게 해결해야 할지 고민하고 있었습니다.","sourceNo":3950},{"no":1153,"category":"동작·감각·생각","word":"发动","pinyin":"fādòng","meaning":"발동하다, 시작하다","example":"汽车引擎发动了，我们准备出发。","examplePinyin":"Qìchē yǐnqíng fādòng le, wǒmen zhǔnbèi chūfā.","translation":"자동차 엔진이 시동되었고 우리는 갈 준비가 되었습니다.","sourceNo":3953},{"no":1154,"category":"동작·감각·생각","word":"发放","pinyin":"fāfàng","meaning":"지급하다, 발급하다","example":"政府正在向受灾群众发放救援物资。","examplePinyin":"Zhèngfǔ zhèngzài xiàng shòuzāi qúnzhòng fāfàng jiùyuán wùzī.","translation":"정부는 피해 주민들에게 구호물자를 배포하고 있다.","sourceNo":3954},{"no":1155,"category":"동작·감각·생각","word":"发光","pinyin":"fāguāng","meaning":"발광하다, 빛나다","example":"夜幕降临后，广场上的灯开始发光。","examplePinyin":"Yèmù jiànglín hòu, guǎngchǎng shàng de dēng kāishǐ fāguāng.","translation":"밤이 되자 광장의 등이 빛나기 시작했어요.","sourceNo":3956},{"no":1156,"category":"동작·감각·생각","word":"犯","pinyin":"fàn","meaning":"범하다, 저지르다","example":"他犯了错，主动向老师承认了错误。","examplePinyin":"Tā fàn le cuò, zhǔdòng xiàng lǎoshī chéngrèn le cuòwù.","translation":"그는 실수를 했고 솔선하여 교사에게 그것을 인정했습니다.","sourceNo":3958},{"no":1157,"category":"동작·감각·생각","word":"妨碍","pinyin":"fáng'ài","meaning":"방해하다, 저지하다","example":"噪音会妨碍我们集中注意力，影响学习效率。","examplePinyin":"Zàoyīn huì fáng'ài wǒmen jízhōng zhùyìlì, yǐngxiǎng xuéxí xiàolǜ.","translation":"소음은 집중력을 방해하고 학습 효율성에 영향을 줄 수 있습니다.","sourceNo":3960},{"no":1158,"category":"동작·감각·생각","word":"放大","pinyin":"fàngdà","meaning":"확대하다, 키우다","example":"请把这张照片放大一些，看得更清楚。","examplePinyin":"Qǐng bǎ zhè zhāng zhàopiàn fàngdà yìxiē, kàn de gèng qīngchu.","translation":"이 사진을 확대하시면 더 선명하게 보실 수 있습니다.","sourceNo":3961},{"no":1159,"category":"동작·감각·생각","word":"放飞","pinyin":"fàngfēi","meaning":"날려 보내다, 비행","example":"春天到了，孩子们在广场上放飞风筝。","examplePinyin":"Chūntiān dào le, háizimen zài guǎngchǎng shàng fàngfēi fēngzhēng.","translation":"봄이 왔습니다. 아이들이 광장에서 연을 날리고 있습니다.","sourceNo":3963},{"no":1160,"category":"동작·감각·생각","word":"反思","pinyin":"fǎnsī","meaning":"반성하다, 회고하다","example":"对于过去的错误，我们要认真反思，避免再犯。","examplePinyin":"Duìyú guòqu de cuòwù, wǒmen yào rènzhēn fǎnsī, bìmiǎn zàifàn.","translation":"우리는 과거의 잘못을 진지하게 반성하고 다시는 그런 일을 저지르지 않도록 해야 합니다.","sourceNo":3972},{"no":1161,"category":"동작·감각·생각","word":"封闭","pinyin":"fēngbì","meaning":"폐쇄하다, 닫다","example":"为了安全，这条道路已经被封闭了。","examplePinyin":"Wèile ānquán, zhè tiáo dàolù yǐjīng bèi fēngbì le.","translation":"안전을 위해 도로가 폐쇄되었습니다.","sourceNo":3985},{"no":1162,"category":"동작·감각·생각","word":"奉献","pinyin":"fèngxiàn","meaning":"헌신하다, 바치다","example":"他把自己的一生奉献给了教育事业。","examplePinyin":"Tā bǎ zìjǐ de yìshēng fèngxiàn gěi le jiàoyù shìyè.","translation":"그는 평생을 교육에 바쳤습니다.","sourceNo":3990},{"no":1163,"category":"동작·감각·생각","word":"愤怒","pinyin":"fènnù","meaning":"분노, 격노","example":"对于这种不公正的现象，他表示出强烈的愤怒。","examplePinyin":"Duìyú zhè zhǒng bù gōngzhèng de xiànxiàng, tā biǎoshì chū qiángliè de fènnù.","translation":"그는 이러한 불의에 대해 강한 분노를 표시했습니다.","sourceNo":3993},{"no":1164,"category":"동작·감각·생각","word":"分散","pinyin":"fēnsàn","meaning":"분산, 퍼뜨리다","example":"我们要把精力分散到各个方面，全面发展。","examplePinyin":"Wǒmen yào bǎ jīnglì fēnsàn dào gège fāngmiàn, quánmiàn fāzhǎn.","translation":"우리는 에너지를 모든 면에 분산시키고 전방위적으로 발전해야 합니다.","sourceNo":3995},{"no":1165,"category":"동작·감각·생각","word":"服","pinyin":"fú","meaning":"복종하다, 따르다","example":"我们要服从上级的安排，认真执行任务。","examplePinyin":"Wǒmen yào fúcóng shàngjí de ānpái, rènzhēn zhíxíng rènwu.","translation":"우리는 상사의 지시에 복종하고 성실하게 업무를 수행해야 합니다.","sourceNo":3997},{"no":1166,"category":"동작·감각·생각","word":"浮","pinyin":"fú","meaning":"뜨다; 떠오르다","example":"落叶在水面上静静地漂浮着，随风飘荡。","examplePinyin":"Luòyè zài shuǐmiàn shàng jìngjìngde piāofú zhe, suífēng piāodàng.","translation":"낙엽이 물 위에 조용히 떠서 바람에 날립니다.","sourceNo":3998},{"no":1167,"category":"동작·감각·생각","word":"服从","pinyin":"fúcóng","meaning":"복종하다, 따르다","example":"人人都要服从法律，没有例外。","examplePinyin":"Rénrén dōu yào fúcóng fǎlǜ, méiyǒu lìwài.","translation":"모든 사람은 예외 없이 법을 준수해야 합니다.","sourceNo":4000},{"no":1168,"category":"동작·감각·생각","word":"覆盖","pinyin":"fùgài","meaning":"덮다, 덮다","example":"积雪覆盖了山路，车辆暂时无法通行。","examplePinyin":"Jīxuě fùgài le shānlù, chēliàng zànshí wúfǎ tōngxíng.","translation":"눈이 산길을 덮어 차량이 잠시 통행할 수 없어요.","sourceNo":4003},{"no":1169,"category":"동작·감각·생각","word":"赋予","pinyin":"fùyǔ","meaning":"(임무 사명 등)을 부여하다","example":"这本书赋予了我新的视角来看待世界。","examplePinyin":"Zhè běn shū fùyǔ le wǒ xīn de shìjiǎo lái kàndài shìjiè.","translation":"이 책은 나에게 세상을 바라보는 새로운 시각을 주었다.","sourceNo":4011},{"no":1170,"category":"동작·감각·생각","word":"辅助","pinyin":"fǔzhù","meaning":"보조하다, 보조","example":"他作为主要辅助人员，参与了整个项目。","examplePinyin":"Tā zuòwéi zhǔyào fǔzhù rényuán, cānyù le zhěngge xiàngmù.","translation":"그는 주요 지원 직원으로 전체 프로젝트에 참여했습니다.","sourceNo":4012},{"no":1171,"category":"동작·감각·생각","word":"改造","pinyin":"gǎizào","meaning":"개조하다, 변경하다","example":"我们需要改造旧设备，提高生产效率。","examplePinyin":"Wǒmen xūyào gǎizào jiù shèbèi, tígāo shēngchǎn xiàolǜ.","translation":"오래된 장비를 개조하고 생산 효율성을 높여야 합니다.","sourceNo":4016},{"no":1172,"category":"동작·감각·생각","word":"感激","pinyin":"gǎnjī","meaning":"감사하다, 고맙게 여기다","example":"我非常感激他对我无私的帮助。","examplePinyin":"Wǒ fēicháng gǎnjī tā duì wǒ wúsī de bāngzhù.","translation":"나는 그의 사심없는 도움에 매우 감사합니다.","sourceNo":4024},{"no":1173,"category":"동작·감각·생각","word":"赶忙","pinyin":"gǎnmáng","meaning":"급히, 서둘러","example":"听到警报声，他赶忙跑了出来。 , ràng mínzhòng liǎojiě zhēnxiàng.","translation":"정부는 국민이 진실을 알 수 있도록 정보를 공개해야 한다.","sourceNo":4059},{"no":1182,"category":"동작·감각·생각","word":"顾","pinyin":"gù","meaning":"돌보다; 고려하다","example":"我们要顾及大家的感受，不能太自私。","examplePinyin":"Wǒmen yào gùjí dàjiā de gǎnshòu, bùnéng tài zìsī.","translation":"우리는 모든 사람의 감정을 고려해야 하며 너무 이기적이지 않아야 합니다.","sourceNo":4072},{"no":1183,"category":"동작·감각·생각","word":"拐","pinyin":"guǎi","meaning":"돌아서다, 구부러지다 절다","example":"前方正在施工，请从右边拐过去。","examplePinyin":"Qiánfāng zhèngzài shīgōng, qǐng cóng yòubian guǎiguòqu.","translation":"앞에서 공사 중이니 오른쪽으로 돌아가세요.","sourceNo":4073},{"no":1184,"category":"동작·감각·생각","word":"孤独","pinyin":"gūdú","meaning":"고독하다, 외롭다","example":"一个人在异乡生活，难免感到孤独。","examplePinyin":"Yí ge rén zài yìxiāng shēnghuó, nánmiǎn gǎndào gūdú.","translation":"낯선 땅에서 혼자 생활하다 보면 외로움을 느낄 수밖에 없습니다.","sourceNo":4087},{"no":1185,"category":"동작·감각·생각","word":"跪","pinyin":"guì","meaning":"무릎을 꿇다","example":"他不小心摔了一跤，跪在了地上。","examplePinyin":"Tā bù xiǎoxīn shuāi le yì jiāo, guì zài le dìshang.","translation":"그는 우연히 넘어져 무릎을 꿇었습니다.","sourceNo":4089},{"no":1186,"category":"동작·감각·생각","word":"归","pinyin":"guī","meaning":"돌아가다 / ~에게 속하다","example":"这本书的所有权最终归他一个人所有。","examplePinyin":"Zhè běn shū de suǒyǒuquán zuìzhōng guī tā yí ge rén suǒyǒu.","translation":"그 책은 결국 그 혼자만의 소유가 된다.","sourceNo":4090},{"no":1187,"category":"동작·감각·생각","word":"归还","pinyin":"guīhuán","meaning":"반환하다","example":"请把借来的书籍及时归还给图书馆。","examplePinyin":"Qǐng bǎ jièlái de shūjí jíshí guīhuán gěi túshūguǎn.","translation":"대출한 도서는 즉시 도서관에 반납해 주시기 바랍니다.","sourceNo":4094},{"no":1188,"category":"동작·감각·생각","word":"过渡","pinyin":"guòdù","meaning":"전환하다; 이행하다","example":"这个项目正处在一个过渡阶段。","examplePinyin":"Zhè ge xiàngmù zhèng chùzài yí ge guòdù jiēduàn.","translation":"이 프로젝트는 전환 단계에 있습니다.","sourceNo":4101},{"no":1189,"category":"동작·감각·생각","word":"鼓舞","pinyin":"gǔwǔ","meaning":"고무하다, 격려하다 / 고무적이다","example":"老师的鼓励极大地鼓舞了大家。","examplePinyin":"Lǎoshī de gǔlì jídà dì gǔwǔ le dàjiā.","translation":"선생님의 격려는 모두에게 큰 영감을 주었습니다.","sourceNo":4114},{"no":1190,"category":"동작·감각·생각","word":"好感","pinyin":"hǎogǎn","meaning":"호감","example":"第一次见面，我就对他产生了好感。","examplePinyin":"Dìyīcì jiànmiàn, wǒ jiù duì tā chǎnshēng le hǎogǎn.","translation":"처음 만났을 때 저는 그에게 호감을 느꼈어요.","sourceNo":4130},{"no":1191,"category":"동작·감각·생각","word":"合成","pinyin":"héchéng","meaning":"합성하다","example":"这种新型材料是人工合成出来的。","examplePinyin":"Zhè zhǒng xīnxíng cáiliào shì réngōng héchéng chūlai de.","translation":"이 새로운 물질은 인공적으로 합성되었습니다.","sourceNo":4138},{"no":1192,"category":"동작·감각·생각","word":"黑暗","pinyin":"hēi'àn","meaning":"어둡다","example":"停电以后，整个房间陷入了黑暗。","examplePinyin":"Tíngdiàn yǐhòu, zhěngge fángjiān xiànrù le hēi'àn.","translation":"정전이 되자 방 전체가 어둠에 잠겼어요.","sourceNo":4140},{"no":1193,"category":"동작·감각·생각","word":"恨","pinyin":"hèn","meaning":"미워하다, 원망하다","example":"虽然他做错了事，我并不恨他。","examplePinyin":"Suīrán tā zuò cuò le shì, wǒ bìng bú hèn tā.","translation":"그 사람이 뭔가 잘못을 했어도 나는 그 사람을 미워하지 않아요.","sourceNo":4141},{"no":1194,"category":"동작·감각·생각","word":"狠","pinyin":"hěn","meaning":"모질다, 매섭다 / 심하게","example":"他狠下心来，卖掉了自己心爱的摩托车。","examplePinyin":"Tā hěn xià xīn lái, màidiào le zìjǐ xīn'ài de mótuōchē.","translation":"그는 마음을 독하게 먹고 아끼던 오토바이를 팔았어요.","sourceNo":4142},{"no":1195,"category":"동작·감각·생각","word":"衡量","pinyin":"héngliáng","meaning":"가늠하다, 저울질하다","example":"我们做决定之前要衡量利弊得失。","examplePinyin":"Wǒmen zuò juédìng zhīqián yào héngliáng lìbì deshī.","translation":"우리는 결정을 내리기 전에 장단점을 따져봅니다.","sourceNo":4144},{"no":1196,"category":"동작·감각·생각","word":"痕迹","pinyin":"hénjì","meaning":"흔적","example":"岁月在这堵老墙上留下了痕迹。","examplePinyin":"Suìyuè zài zhè dǔ lǎo qiángshàng liúxià le hénjì.","translation":"시간이 이 오래된 벽에 흔적을 남겼습니다.","sourceNo":4145},{"no":1197,"category":"동작·감각·생각","word":"后退","pinyin":"hòutuì","meaning":"후퇴하다","example":"遇到危险时，大家应该主动后退。","examplePinyin":"Yùdào wēixiǎn shí, dàjiā yīnggāi zhǔdòng hòutuì.","translation":"위험에 직면하면 모두가 먼저 물러나야 합니다.","sourceNo":4154},{"no":1198,"category":"동작·감각·생각","word":"划","pinyin":"huà","meaning":"긋다, 젓다","example":"他随手拿起刀在木板上划了一道线。","examplePinyin":"Tā suíshǒu ná qǐ dāo zài mùbǎn shàng huà le yí dào xiàn.","translation":"그는 칼을 들어 나무판에 선 하나를 그었어요.","sourceNo":4158},{"no":1199,"category":"동작·감각·생각","word":"划分","pinyin":"huàfēn","meaning":"구분하다, 나누다","example":"老师把全班同学划分成了五个小组。","examplePinyin":"Lǎoshī bǎ quánbān tóngxué huàfēn chéng le wǔ ge xiǎozǔ.","translation":"선생님은 학급을 다섯 그룹으로 나누었습니다.","sourceNo":4161},{"no":1200,"category":"동작·감각·생각","word":"怀","pinyin":"huái","meaning":"품다 / 품","example":"他心里怀着希望，一直努力工作着。","examplePinyin":"Tā xīnlǐ huáizhe xīwàng, yìzhí nǔlì gōngzuò zhe.","translation":"그는 희망을 가슴에 품고 계속 열심히 일했습니다.","sourceNo":4162},{"no":1201,"category":"동작·감각·생각","word":"怀念","pinyin":"huáiniàn","meaning":"그리워하다","example":"离开家乡多年，他常常怀念故乡的味道。","examplePinyin":"Líkāi jiāxiāng duōnián, tā chángcháng huáiniàn gùxiāng de wèidao.","translation":"그는 오랜 세월 고향을 떠나 살다 보니 고향의 맛이 그리워질 때가 많다.","sourceNo":4163},{"no":1202,"category":"동작·감각·생각","word":"幻想","pinyin":"huànxiǎng","meaning":"공상하다 / 공상","example":"他常常幻想将来能够环游世界。","examplePinyin":"Tā chángcháng huànxiǎng jiānglái nénggòu huányóu shìjiè.","translation":"그는 종종 미래에 세계를 여행할 수 있다는 환상을 품는다.","sourceNo":4170},{"no":1203,"category":"동작·감각·생각","word":"还原","pinyin":"huányuán","meaning":"원상복구하다","example":"请把桌子和椅子还原到原来的位置。","examplePinyin":"Qǐng bǎ zhuōzi hé yǐzi huányuán dào yuánlái de wèizhi.","translation":"테이블과 의자를 원래 위치로 되돌려주세요.","sourceNo":4171},{"no":1204,"category":"동작·감각·생각","word":"回报","pinyin":"huíbào","meaning":"보답하다","example":"孩子长大以后，总想回报父母的养育之恩。","examplePinyin":"Háizi zhǎngdà yǐhòu, zǒng xiǎng huíbào fùmǔ de yǎngyù zhī ēn.","translation":"아이들은 자라면서 항상 부모에게 양육에 대해 보답하고 싶어합니다.","sourceNo":4180},{"no":1205,"category":"동작·감각·생각","word":"回顾","pinyin":"huígù","meaning":"돌이켜보다, 회고하다","example":"趁着假期，让我们一起回顾一下历史。","examplePinyin":"Chènzhe jiàqī, ràng wǒmen yìqǐ huígù yíxià lìshǐ.","translation":"연휴 동안 역사를 되돌아보자.","sourceNo":4183},{"no":1206,"category":"동작·감각·생각","word":"回头","pinyin":"huítóu","meaning":"고개를 돌리다 / 나중에 / 그런 다음","example":"他突然回头，看了我一眼就走了。","examplePinyin":"Tā tūrán huítóu, kàn le wǒ yì yǎn jiù zǒu le.","translation":"그는 갑자기 돌아 서서 나를 쳐다보고 떠났다.","sourceNo":4187},{"no":1207,"category":"동작·감각·생각","word":"灰心","pinyin":"huīxīn","meaning":"낙담하다","example":"考试没考好，他有点儿灰心丧气。","examplePinyin":"Kǎoshì méi kǎo hǎo, tā yǒudiǎnr huīxīn sàngqì.","translation":"그는 시험을 잘 보지 못했고 약간 낙담했습니다.","sourceNo":4188},{"no":1208,"category":"동작·감각·생각","word":"忽略","pinyin":"hūlüè","meaning":"소홀히 하다, 간과하다","example":"我们千万不能忽略这个重要问题。","examplePinyin":"Wǒmen qiānwàn bùnéng hūlüè zhè ge zhòngyào wèntí.","translation":"우리는 이 중요한 문제를 무시해서는 안 됩니다.","sourceNo":4189},{"no":1209,"category":"동작·감각·생각","word":"混","pinyin":"hùn","meaning":"섞다 / 함부로","example":"做饭时千万不要把不同的液体混在一起。","examplePinyin":"Zuòfàn shí qiānwàn búyào bǎ bùtóng de yètǐ hùn zài yìqǐ.","translation":"요리할 때 서로 다른 액체를 함께 섞지 마십시오.","sourceNo":4190},{"no":1210,"category":"동작·감각·생각","word":"混合","pinyin":"hùnhé","meaning":"섞다, 혼합하다","example":"调色的时候，要把这两种颜色混合均匀。","examplePinyin":"Tiáosè de shíhou, yào bǎ zhè liǎng zhǒng yánsè hùnhé jūnyún.","translation":"색을 섞을 때는 두 색을 고르게 섞어주세요.","sourceNo":4191},{"no":1211,"category":"동작·감각·생각","word":"加剧","pinyin":"jiājù","meaning":"격화되다, 악화되다","example":"处理不当会加剧矛盾，必须及时沟通。","examplePinyin":"Chǔlǐ búdàng huì jiājù máodùn, bìxū jíshí gōutōng.","translation":"처리가 적절하지 않으면 갈등이 심해지므로 제때 소통해야 해요.","sourceNo":4207},{"no":1212,"category":"동작·감각·생각","word":"鉴定","pinyin":"jiàndìng","meaning":"감정하다 / 감정","example":"专家对这幅古画进行了专业鉴定。","examplePinyin":"Zhuānjiā duì zhè fú gǔhuà jìnxíng le zhuānyè jiàndìng.","translation":"전문가들은 이 고대 그림에 대해 전문적인 평가를 실시했습니다.","sourceNo":4215},{"no":1213,"category":"동작·감각·생각","word":"简化","pinyin":"jiǎnhuà","meaning":"간소화하다","example":"为了提高效率，我们要简化办事流程。","examplePinyin":"Wèile tígāo xiàolǜ, wǒmen yào jiǎnhuà bànshì liúchéng.","translation":"효율성을 높이려면 업무 프로세스를 단순화해야 합니다.","sourceNo":4226},{"no":1214,"category":"동작·감각·생각","word":"减弱","pinyin":"jiǎnruò","meaning":"약화되다","example":"随着冷空气逐渐离开，风力也开始减弱。","examplePinyin":"Suízhe lěngkōngqì zhújiàn líkāi, fēnglì yě kāishǐ jiǎnruò.","translation":"찬 공기가 물러가면서 바람도 약해지기 시작했어요.","sourceNo":4232},{"no":1215,"category":"동작·감각·생각","word":"减压","pinyin":"jiǎnyā","meaning":"스트레스를 줄이다","example":"适当运动有助于减压，也能改善睡眠质量。","examplePinyin":"Shìdàng yùndòng yǒuzhùyú jiǎnyā, yě néng gǎishàn shuìmián zhìliàng.","translation":"적당한 운동은 스트레스를 줄이고 수면의 질도 높여 줘요.","sourceNo":4234},{"no":1216,"category":"동작·감각·생각","word":"焦点","pinyin":"jiāodiǎn","meaning":"초점","example":"这是最近全社会都在关注的焦点问题。","examplePinyin":"Zhè shì zuìjìn quán shèhuì dōu zài guānzhù de jiāodiǎn wèntí.","translation":"이는 최근 사회 전체가 주목하고 있는 화두이다.","sourceNo":4240},{"no":1217,"category":"동작·감각·생각","word":"焦虑","pinyin":"jiāolǜ","meaning":"초조하다, 불안하다","example":"考试快到了，他因准备不足而感到焦虑。","examplePinyin":"Kǎoshì kuài dào le, tā yīn zhǔnbèi bùzú ér gǎndào jiāolǜ.","translation":"시험이 다가오자 그는 준비가 부족해 불안해했어요.","sourceNo":4242},{"no":1218,"category":"동작·감각·생각","word":"脚印","pinyin":"jiǎoyìn","meaning":"발자국","example":"雪地上清晰地留下了一串脚印。","examplePinyin":"Xuědì shang qīngxī de liúxià le yíchuàn jiǎoyìn.","translation":"눈 위에는 분명히 일련의 발자국이 남아 있었습니다.","sourceNo":4249},{"no":1219,"category":"동작·감각·생각","word":"加以","pinyin":"jiāyǐ","meaning":"~을 가하다; ~하도록 하다","example":"遇到这类难题，我们都要设法加以解决。","examplePinyin":"Yùdào zhè lèi nántí, wǒmen dōu yào shèfǎ jiāyǐ jiějué.","translation":"그러한 문제에 직면하면 우리는 이를 해결하려고 노력해야 합니다.","sourceNo":4252},{"no":1220,"category":"동작·감각·생각","word":"加重","pinyin":"jiāzhòng","meaning":"가중하다, 무거워지다","example":"经过治疗，他的病情反而有所加重。","examplePinyin":"Jīngguò zhìliáo, tā de bìngqíng fǎn'ér yǒusuǒ jiāzhòng.","translation":"치료 후 그의 상태는 더욱 악화되었습니다.","sourceNo":4254},{"no":1221,"category":"동작·감각·생각","word":"击败","pinyin":"jībài","meaning":"물리치다, 격파하다","example":"经过艰苦拼搏，我们终于击败了对手。","examplePinyin":"Jīngguò jiānkǔ pīnbó, wǒmen zhōngyú jībài le duìshǒu.","translation":"열심히 노력한 끝에 우리는 마침내 상대를 물리쳤습니다.","sourceNo":4255},{"no":1222,"category":"동작·감각·생각","word":"结","pinyi
