lePinyin":"Zhè ge guójiā yìzhí zài tuījìn mínzhǔ zhìdù jiànshè.","translation":"이 나라는 민주적 제도의 건설을 진전시켜 왔습니다.","sourceNo":4529},{"no":415,"category":"직업·일과","word":"农产品","pinyin":"nóngchǎnpǐn","meaning":"농산물","example":"这个集市每天出售新鲜的农产品。","examplePinyin":"Zhè ge jíshì měi tiān chūshòu xīnxiān de nóngchǎnpǐn.","translation":"이 시장에서는 매일 신선한 농산물을 판매합니다.","sourceNo":4560},{"no":416,"category":"직업·일과","word":"求职","pinyin":"qiúzhí","meaning":"구직하다","example":"毕业以后，他一直积极参加求职面试。","examplePinyin":"Bìyè yǐhòu, tā yìzhí jījí cānjiā qiúzhí miànshì.","translation":"그는 졸업한 뒤 적극적으로 취업 면접을 보고 있어요.","sourceNo":4665},{"no":417,"category":"직업·일과","word":"权力","pinyin":"quánlì","meaning":"권력","example":"他身居要职，手中掌握着不小的权力。","examplePinyin":"Tā shēn jū yàozhí, shǒuzhōng zhǎngwò zhe bùxiǎo de quánlì.","translation":"그는 중요한 위치를 차지하고 있으며 상당한 권력을 손에 쥐고 있습니다.","sourceNo":4678},{"no":418,"category":"직업·일과","word":"认定","pinyin":"rèndìng","meaning":"확정짓다, 인정하다","example":"经过反复调查，警方最终认定他有罪。","examplePinyin":"Jīngguò fǎnfù diàochá, jǐngfāng zuìzhōng rèndìng tā yǒuzuì.","translation":"경찰은 반복 조사 끝에 그에게 죄가 있다고 판단했어요.","sourceNo":4692},{"no":419,"category":"직업·일과","word":"人事","pinyin":"rénshì","meaning":"인사(업무)","example":"公司最近对内部人事进行了一次调整。","examplePinyin":"Gōngsī zuìjìn duì nèibù rénshì jìnxíng le yí cì tiáozhěng.","translation":"회사는 최근 내부 인사 조정을 단행했다.","sourceNo":4700},{"no":420,"category":"직업·일과","word":"上级","pinyin":"shàngjí","meaning":"상급자, 상부","example":"他需要向上级汇报工作的最新进展。","examplePinyin":"Tā xūyào xiàng shàngjí huìbào gōngzuò de zuìxīn jìnzhǎn.","translation":"그는 자신의 업무 진행 상황을 상사에게 보고해야 합니다.","sourceNo":4743},{"no":421,"category":"직업·일과","word":"社","pinyin":"shè","meaning":"사(단체)","example":"他大学毕业后进入了一家出版社工作。","examplePinyin":"Tā dàxué bìyè hòu jìnrù le yìjiā chūbǎnshè gōngzuò.","translation":"대학 졸업 후 출판사에서 일했다.","sourceNo":4755},{"no":422,"category":"직업·일과","word":"士兵","pinyin":"shìbīng","meaning":"병사","example":"边防线上，士兵们日夜坚守岗位。","examplePinyin":"Biānfángxiàn shàng, shìbīngmen rìyè jiānshǒu gǎngwèi.","translation":"국경선에서는 군인들이 밤낮으로 자기 자리에 머물렀다.","sourceNo":4779},{"no":423,"category":"직업·일과","word":"势力","pinyin":"shìlì","meaning":"세력","example":"这个家族在当地一直拥有很大势力。","examplePinyin":"Zhè ge jiāzú zài dāngdì yìzhí yōngyǒu hěn dà shìlì.","translation":"이 가족은 항상 지역에서 큰 영향력을 발휘해 왔습니다.","sourceNo":4794},{"no":424,"category":"직업·일과","word":"事务","pinyin":"shìwù","meaning":"사무, 업무","example":"秘书每天负责处理大量的日常事务。","examplePinyin":"Mìshū měi tiān fùzé chǔlǐ dàliàng de rìcháng shìwù.","translation":"비서는 매일 수많은 일상 업무를 처리하는 역할을 담당합니다.","sourceNo":4800},{"no":425,"category":"직업·일과","word":"事项","pinyin":"shìxiàng","meaning":"사항","example":"请大家认真阅读会议通知里的注意事项。","examplePinyin":"Qǐng dàjiā rènzhēn yuèdú huìyì tōngzhī lǐ de zhùyì shìxiàng.","translation":"모임 공지사항에 있는 주의사항을 주의 깊게 읽어보시기 바랍니다.","sourceNo":4801},{"no":426,"category":"직업·일과","word":"收取","pinyin":"shōuqǔ","meaning":"징수하다, 받다","example":"银行为这项服务收取一定的手续费。","examplePinyin":"Yínxíng wéi zhè xiàng fúwù shōuqǔ yídìng de shǒuxùfèi.","translation":"은행은 이 서비스에 대해 수수료를 부과합니다.","sourceNo":4813},{"no":427,"category":"직업·일과","word":"率领","pinyin":"shuàilǐng","meaning":"인솔하다, 이끌다","example":"队长率领全体队员完成了这次任务。","examplePinyin":"Duìzhǎng shuàilǐng quántǐ duìyuán wánchéng le zhè cì rènwu.","translation":"대장은 대원 전원을 이끌고 이번 임무를 마쳤어요.","sourceNo":4821},{"no":428,"category":"직업·일과","word":"同行","pinyin":"tóngháng","meaning":"동종 업계 사람; 동업자","example":"这两位医生是同行，经常交流治疗经验。","examplePinyin":"Zhè liǎng wèi yīshēng shì tóngháng, jīngcháng jiāoliú zhìliáo jīngyàn.","translation":"이 두 의사는 같은 직종으로 치료 경험을 자주 나눠요.","sourceNo":4907},{"no":429,"category":"직업·일과","word":"投票","pinyin":"tóupiào","meaning":"투표하다","example":"全体成员通过投票决定了活动方案。","examplePinyin":"Quántǐ chéngyuán tōngguò tóupiào juédìng le huódòng fāng'àn.","translation":"모든 회원들은 투표를 통해 활동 계획을 결정했습니다.","sourceNo":4922},{"no":430,"category":"직업·일과","word":"投诉","pinyin":"tóusù","meaning":"항의하다; 민원을 제기하다","example":"顾客因服务态度差而投诉了商家。","examplePinyin":"Gùkè yīn fúwù tàidu chà ér tóusù le shāngjiā.","translation":"고객은 서비스 불량으로 인해 판매자에 대해 불만을 토로했습니다.","sourceNo":4923},{"no":431,"category":"직업·일과","word":"推行","pinyin":"tuīxíng","meaning":"시행하다, 보급하다","example":"政府正在全国范围推行新的政策。","examplePinyin":"Zhèngfǔ zhèngzài quánguó fànwéi tuīxíng xīn de zhèngcè.","translation":"정부는 전국적으로 새로운 정책을 시행하고 있습니다.","sourceNo":4938},{"no":432,"category":"직업·일과","word":"外交","pinyin":"wàijiāo","meaning":"외교","example":"两国正在通过外交途径解决争端。","examplePinyin":"Liǎng guó zhèngzài tōngguò wàijiāo tújìng jiějué zhēngduān.","translation":"양국은 외교채널을 통해 분쟁을 해결하고 있다.","sourceNo":4951},{"no":433,"category":"직업·일과","word":"违规","pinyin":"wéiguī","meaning":"규정을 위반하다","example":"这位司机因超速违规被处以罚款。","examplePinyin":"Zhè wèi sījī yīn chāosù wéiguī bèi chǔyǐ fákuǎn.","translation":"운전자는 과속 위반으로 벌금을 물었습니다.","sourceNo":4970},{"no":434,"category":"직업·일과","word":"维护","pinyin":"wéihù","meaning":"유지하다, 보호하다","example":"保安人员认真维护小区治安秩序。","examplePinyin":"Bǎo'ān rényuán rènzhēn wéihù xiǎoqū zhì'ān zhìxù.","translation":"보안요원은 지역사회의 공공질서를 주의 깊게 유지합니다.","sourceNo":4972},{"no":435,"category":"직업·일과","word":"委托","pinyin":"wěituō","meaning":"위탁하다","example":"他委托律师全权处理这起纠纷。","examplePinyin":"Tā wěituō lǜshī quánquán chǔlǐ zhè qǐ jiūfēn.","translation":"그는 변호사에게 분쟁을 처리할 전권을 위임했습니다.","sourceNo":4981},{"no":436,"category":"직업·일과","word":"文档","pinyin":"wéndàng","meaning":"문서","example":"请及时保存好这份重要的文档。","examplePinyin":"Qǐng jíshí bǎocún hǎo zhè fèn zhòngyào de wéndàng.","translation":"이 중요한 문서를 즉시 저장하십시오.","sourceNo":4984},{"no":437,"category":"직업·일과","word":"文明","pinyin":"wénmíng","meaning":"문명 / 문명적이다","example":"我们要争做讲文明的好市民。","examplePinyin":"Wǒmen yào zhēngzuò jiǎngwénmíng de hǎo shìmín.","translation":"우리는 문명화되고 좋은 시민이 되기 위해 노력해야 합니다.","sourceNo":4988},{"no":438,"category":"직업·일과","word":"消防","pinyin":"xiāofáng","meaning":"소방","example":"消防人员迅速赶到现场进行扑救。","examplePinyin":"Xiāofáng rényuán xùnsù gǎndào xiànchǎng jìnxíng pūjiù.","translation":"소방대원들은 화재를 진압하기 위해 재빨리 현장으로 달려갔다.","sourceNo":5034},{"no":439,"category":"직업·일과","word":"下线","pinyin":"xiàxiàn","meaning":"접속 종료하다; 생산 완료되다","example":"这批新车终于顺利完成了组装下线。","examplePinyin":"Zhè pī xīnchē zhōngyú shùnlì wánchéng le zǔzhuāng xiàxiàn.","translation":"이 신차들은 마침내 조립을 끝내고 생산 라인에서 나왔어요.","sourceNo":5042},{"no":440,"category":"직업·일과","word":"协会","pinyin":"xiéhuì","meaning":"협회","example":"他加入了一个当地的作家协会组织。","examplePinyin":"Tā jiārù le yí ge dāngdì de zuòjiā xiéhuì zǔzhī.","translation":"그는 지역 작가 협회에 가입했어요.","sourceNo":5047},{"no":441,"category":"직업·일과","word":"协调","pinyin":"xiétiáo","meaning":"조화롭다 / 조율하다","example":"这项工作需要各部门之间密切协调。","examplePinyin":"Zhè xiàng gōngzuò xūyào gè bùmén zhījiān mìqiè xiétiáo.","translation":"이 작업에는 부서 간의 긴밀한 조정이 필요합니다.","sourceNo":5048},{"no":442,"category":"직업·일과","word":"协助","pinyin":"xiézhù","meaning":"협조하다, 돕다","example":"请你协助我一起完成这项重要任务。","examplePinyin":"Qǐng nǐ xiézhù wǒ yìqǐ wánchéng zhè xiàng zhòngyào rènwu.","translation":"제가 이 중요한 임무를 완수할 수 있도록 도와주세요.","sourceNo":5049},{"no":443,"category":"직업·일과","word":"薪水","pinyin":"xīnshui","meaning":"급여","example":"他对目前的薪水待遇比较满意。","examplePinyin":"Tā duì mùqián de xīnshui dàiyù bǐjiào mǎnyì.","translation":"그는 현재 받는 급여와 대우에 비교적 만족해요.","sourceNo":5068},{"no":444,"category":"직업·일과","word":"选拔","pinyin":"xuǎnbá","meaning":"선발하다","example":"学校组织了一场严格的人才选拔。","examplePinyin":"Xuéxiào zǔzhī le yì chǎng yángé de réncái xuǎnbá.","translation":"학교는 엄격한 인재 선발을 조직했습니다.","sourceNo":5084},{"no":445,"category":"직업·일과","word":"许可","pinyin":"xǔkě","meaning":"허가하다","example":"未经许可，任何人不得擅自进入。","examplePinyin":"Wèijīng xǔkě, rènhérén bùdé shànzì jìnrù.","translation":"허가 없이는 누구도 들어갈 수 없습니다.","sourceNo":5095},{"no":446,"category":"직업·일과","word":"养老","pinyin":"yǎnglǎo","meaning":"노후를 보내다","example":"他打算退休以后回老家养老度日。","examplePinyin":"Tā dǎsuàn tuìxiū yǐhòu huí lǎojiā yǎnglǎo dùrì.","translation":"그는 은퇴 후 고향에 돌아가 노후를 보낼 계획이에요.","sourceNo":5105},{"no":447,"category":"직업·일과","word":"养老院","pinyin":"yǎnglǎoyuàn","meaning":"양로원","example":"这家养老院环境优美，服务周到。","examplePinyin":"Zhè jiā yǎnglǎoyuàn huánjìng yōuměi, fúwù zhōudào.","translation":"이 요양원은 아름다운 환경과 세심한 서비스를 갖추고 있습니다.","sourceNo":5106},{"no":448,"category":"직업·일과","word":"严禁","pinyin":"yánjìn","meaning":"엄금하다","example":"图书馆内严禁大声喧哗和吃东西。","examplePinyin":"Túshūguǎn nèi yánjìn dàshēng xuānhuá hé chī dōngxi.","translation":"도서관 내에서는 큰 소음과 음식물 섭취가 엄격히 금지되어 있습니다.","sourceNo":5112},{"no":449,"category":"직업·일과","word":"业","pinyin":"yè","meaning":"업(접미사)","example":"他大学毕业后从事教育相关行业。","examplePinyin":"Tā dàxué bìyè hòu cóngshì jiàoyù xiāngguān hángyè.","translation":"대학을 졸업한 후 교육 관련 업계에서 일했다.","sourceNo":5130},{"no":450,"category":"직업·일과","word":"隐私","pinyin":"yǐnsī","meaning":"사생활, 프라이버시","example":"我们应该尊重每个人的隐私，不随意传播个人信息。","examplePinyin":"Wǒmen yīnggāi zūnzhòng měi ge rén de yǐnsī, bù suíyì chuánbō gerén xìnxī.","translation":"모든 사람의 사생활을 존중하고 개인정보를 함부로 퍼뜨리지 않아야 해요.","sourceNo":5170},{"no":451,"category":"직업·일과","word":"用人","pinyin":"yòngrén","meaning":"사람을 쓰다, 인재를 등용하다","example":"公司在用人方面一向注重能力。","examplePinyin":"Gōngsī zài yòngrén fāngmiàn yíxiàng zhùzhòng nénglì.","translation":"회사는 항상 인재 채용에 있어 역량을 중요하게 생각합니다.","sourceNo":5193},{"no":452,"category":"직업·일과","word":"约束","pinyin":"yuēshù","meaning":"구속하다, 단속하다","example":"良好的规章制度能约束员工行为。","examplePinyin":"Liánghǎo de guīzhāng zhìdù néng yuēshù yuángōng xíngwéi.","translation":"좋은 규칙과 규정은 직원의 행동을 제한할 수 있습니다.","sourceNo":5226},{"no":453,"category":"직업·일과","word":"运营","pinyin":"yùnyíng","meaning":"운영하다","example":"这家公司的日常运营十分规范。","examplePinyin":"Zhè jiā gōngsī de rìcháng yùnyíng shífēn guīfàn.","translation":"회사의 일상 업무는 매우 표준화되어 있습니다.","sourceNo":5232},{"no":454,"category":"직업·일과","word":"战斗","pinyin":"zhàndòu","meaning":"전투 / 전투하다","example":"士兵们在前线展开了激烈战斗。","examplePinyin":"Shìbīngmen zài qiánxiàn zhǎnkāi le jīliè zhàndòu.","translation":"군인들은 최전선에서 치열하게 싸웠습니다.","sourceNo":5258},{"no":455,"category":"직업·일과","word":"战争","pinyin":"zhànzhēng","meaning":"전쟁","example":"那场战争给两国人民带来了灾难。","examplePinyin":"Nà chǎng zhànzhēng gěi liǎngguó rénmín dàilái le zāinàn.","translation":"그 전쟁은 양국 국민에게 재앙을 가져왔습니다.","sourceNo":5268},{"no":456,"category":"직업·일과","word":"政策","pinyin":"zhèngcè","meaning":"정책","example":"政府出台了一项扶持中小企业的政策。","examplePinyin":"Zhèngfǔ chūtái le yí xiàng fúchí zhōng xiǎo qǐyè de zhèngcè.","translation":"정부가 중소기업 지원 정책을 내놨다.","sourceNo":5279},{"no":457,"category":"직업·일과","word":"正义","pinyin":"zhèngyì","meaning":"정의 / 정의로운","example":"他一直坚信正义终将战胜邪恶。","examplePinyin":"Tā yìzhí jiānxìn zhèngyì zhōngjiāng zhànshèng xié'è.","translation":"그는 항상 정의가 결국 악을 물리칠 것이라고 믿었습니다.","sourceNo":5287},{"no":458,"category":"직업·일과","word":"值班","pinyin":"zhíbān","meaning":"당직을 서다","example":"今晚轮到他在医院值班守夜。","examplePinyin":"Jīnwǎn lún dào tā zài yīyuàn zhíbān shǒuyè.","translation":"오늘 밤은 그가 병원에서 당직을 서는 차례예요.","sourceNo":5297},{"no":459,"category":"직업·일과","word":"治理","pinyin":"zhìlǐ","meaning":"다스리다, 관리하다","example":"政府加大力度治理河流污染问题。","examplePinyin":"Zhèngfǔ jiādà lìdù zhìlǐ héliú wūrǎn wèntí.","translation":"정부는 하천 오염 방지를 위한 노력을 강화했습니다.","sourceNo":5307},{"no":460,"category":"직업·일과","word":"指示","pinyin":"zhǐshì","meaning":"지시하다 / 지시","example":"士兵们严格按照上级指示行动。","examplePinyin":"Shìbīngmen yángé ànzhào shàngjí zhǐshì xíngdòng.","translation":"군인들은 상관의 지시를 엄격히 따랐다.","sourceNo":5309},{"no":461,"category":"직업·일과","word":"职位","pinyin":"zhíwèi","meaning":"직위","example":"经过努力，他终于升到了更高职位。","examplePinyin":"Jīngguò nǔlì, tā zhōngyú shēng dào le gèng gāo zhíwèi.","translation":"열심히 노력한 끝에 그는 마침내 더 높은 자리에 올랐습니다.","sourceNo":5311},{"no":462,"category":"직업·일과","word":"职务","pinyin":"zhíwù","meaning":"직무","example":"他目前在公司担任销售经理的职务。","examplePinyin":"Tā mùqián zài gōngsī dānrèn xiāoshòu jīnglǐ de zhíwù.","translation":"그는 현재 회사에서 영업 부장 직무를 맡고 있어요.","sourceNo":5312},{"no":463,"category":"직업·일과","word":"职员","pinyin":"zhíyuán","meaning":"직원","example":"他是这家银行的一名普通职员。","examplePinyin":"Tā shì zhè jiā yínháng de yì míng pǔtōng zhíyuán.","translation":"그는 이 은행의 평범한 사무원입니다.","sourceNo":5316},{"no":464,"category":"직업·일과","word":"职责","pinyin":"zhízé","meaning":"직책, 책무 sourceNo":4382},{"no":490,"category":"음식·식사","word":"口感","pinyin":"kǒugǎn","meaning":"식감","example":"这家餐厅的牛排口感非常鲜嫩。","examplePinyin":"Zhè jiā cāntīng de niúpái kǒugǎn fēicháng xiānnèn.","translation":"이 식당의 스테이크는 식감이 아주 부드러워요.","sourceNo":4394},{"no":491,"category":"음식·식사","word":"辣椒","pinyin":"làjiāo","meaning":"고추","example":"他做的这道菜放了很多辣椒。","examplePinyin":"Tā zuò de zhè dào cài fàng le hěn duō làjiāo.","translation":"그는 이 요리에 고추를 많이 넣었어요.","sourceNo":4415},{"no":492,"category":"음식·식사","word":"料1","pinyin":"liào","meaning":"재료","example":"冰箱里存放着做菜用的各种材料。","examplePinyin":"Bīngxiāng lǐ cúnfàng zhe zuòcài yòng de gèzhǒng cáiliào.","translation":"냉장고에는 다양한 요리 재료가 보관되어 있습니다.","sourceNo":4440},{"no":493,"category":"음식·식사","word":"面粉","pinyin":"miànfěn","meaning":"밀가루","example":"妈妈用面粉做了一锅香喷喷的馒头。","examplePinyin":"Māma yòng miànfěn zuò le yì guō xiāngpēnpēn de mántou.","translation":"엄마는 밀가루로 향긋한 찐빵을 만들었어요.","sourceNo":4504},{"no":494,"category":"음식·식사","word":"奶粉","pinyin":"nǎifěn","meaning":"분유","example":"妈妈每天按时给宝宝冲泡奶粉。","examplePinyin":"Māma měi tiān ànshí gěi bǎobǎo chōngpào nǎifěn.","translation":"엄마는 매일 제 시간에 아기를 위해 분유를 준비합니다.","sourceNo":4542},{"no":495,"category":"음식·식사","word":"盘","pinyin":"pán","meaning":"접시, 판(양사) / 돌다","example":"他一口气吃了整整两大盘水果。","examplePinyin":"Tā yì kǒu qì chī le zhěngzhěng liǎng dàpán shuǐguǒ.","translation":"그는 앉은 자리에서 과일 두 접시를 통째로 먹었습니다.","sourceNo":4570},{"no":496,"category":"음식·식사","word":"品尝","pinyin":"pǐncháng","meaning":"맛보다, 시식하다","example":"游客们排队品尝当地的特色小吃。","examplePinyin":"Yóukèmen páiduì pǐncháng dāngdì de tèsè xiǎochī.","translation":"관광객들이 현지 특산물을 맛보기 위해 줄을 섰다.","sourceNo":4592},{"no":497,"category":"음식·식사","word":"清淡","pinyin":"qīngdàn","meaning":"담백하다","example":"医生建议病人这几天饮食要清淡一些。","examplePinyin":"Yīshēng jiànyì bìngrén zhè jǐ tiān yǐnshí yào qīngdàn yìxiē.","translation":"의사는 환자에게 며칠 동안 담백하게 먹으라고 했어요.","sourceNo":4642},{"no":498,"category":"음식·식사","word":"气味","pinyin":"qìwèi","meaning":"냄새","example":"厨房里飘出一股诱人的饭菜气味。","examplePinyin":"Chúfáng lǐ piāo chū yì gǔ yòurén de fàncài qìwèi.","translation":"부엌에서 맛있는 음식 냄새가 풍겨왔습니다.","sourceNo":4668},{"no":499,"category":"음식·식사","word":"食欲","pinyin":"shíyù","meaning":"식욕","example":"天气炎热常常让人食欲明显下降。","examplePinyin":"Tiānqì yánrè chángcháng ràng rén shíyù míngxiǎn xiàjiàng.","translation":"더운 날씨는 종종 식욕을 크게 감소시킵니다.","sourceNo":4804},{"no":500,"category":"음식·식사","word":"薯片","pinyin":"shǔpiàn","meaning":"감자칩","example":"他一边看电视，一边悠闲地吃着薯片。","examplePinyin":"Tā yìbiān kàndiànshì, yìbiān yōuxiánde chī zhe shǔpiàn.","translation":"그는 한가로이 TV를 시청하며 감자칩을 먹고 있었습니다.","sourceNo":4835},{"no":501,"category":"음식·식사","word":"烫","pinyin":"tàng","meaning":"데다, 뜨겁다","example":"刚出炉的面包非常烫，要小心食用。","examplePinyin":"Gāng chūlú de miànbāo fēicháng tàng, yào xiǎoxīn shíyòng.","translation":"갓 구운 빵은 매우 뜨거우니 드실 때 주의하세요.","sourceNo":4860},{"no":502,"category":"음식·식사","word":"糖果","pinyin":"tángguǒ","meaning":"사탕","example":"孩子们最喜欢过年时收到的各种糖果。","examplePinyin":"Háizimen zuì xǐhuan guònián shí shōudào de gèzhǒng tángguǒ.","translation":"아이들은 설날에 받는 다양한 사탕을 좋아합니다.","sourceNo":4861},{"no":503,"category":"음식·식사","word":"汤圆","pinyin":"tāngyuán","meaning":"탕위안(찹쌀경단)","example":"元宵节那天，全家人一起动手包汤圆。","examplePinyin":"Yuánxiāojié nà tiān, quánjiārén yìqǐ dòngshǒu bāo tāngyuán.","translation":"정월 대보름에는 온 가족이 함께 탕위안을 만들어요.","sourceNo":4862},{"no":504,"category":"음식·식사","word":"套餐","pinyin":"tàocān","meaning":"세트메뉴","example":"这家快餐店推出了一款超值优惠套餐。","examplePinyin":"Zhè jiā kuàicāndiàn tuīchū le yìkuǎn chāozhí yōuhuì tàocān.","translation":"이 패스트푸드점은 가성비 좋은 세트 메뉴를 선보였어요.","sourceNo":4870},{"no":505,"category":"음식·식사","word":"味觉","pinyin":"wèijué","meaning":"미각","example":"长期吸烟会逐渐影响人的味觉。","examplePinyin":"Chángqī xīyān huì zhújiàn yǐngxiǎng rén de wèijué.","translation":"장기간의 흡연은 점차적으로 사람들의 미각에 영향을 미칠 것입니다.","sourceNo":4974},{"no":506,"category":"음식·식사","word":"胃口","pinyin":"wèikǒu","meaning":"식욕","example":"天气炎热让他最近胃口不太好。","examplePinyin":"Tiānqì yánrè ràng tā zuìjìn wèikǒu bútàihǎo.","translation":"최근 더운 날씨로 인해 식욕이 나빴습니다.","sourceNo":4975},{"no":507,"category":"음식·식사","word":"香肠","pinyin":"xiāngcháng","meaning":"소시지","example":"他早餐喜欢配上煎香肠一起吃。","examplePinyin":"Tā zǎocān xǐhuan pèi shàng jiān xiāngcháng yìqǐ chī.","translation":"그는 아침에 구운 소시지를 곁들여 먹는 것을 좋아해요.","sourceNo":5014},{"no":508,"category":"음식·식사","word":"小麦","pinyin":"xiǎomài","meaning":"밀","example":"农民正在田里辛勤地收割小麦。","examplePinyin":"Nóngmín zhèngzài tiánlǐ xīnqín de shōugē xiǎomài.","translation":"농부들은 밀을 수확하는 들판에서 열심히 일하고 있습니다.","sourceNo":5036},{"no":509,"category":"음식·식사","word":"饮用水","pinyin":"yǐnyòngshuǐ","meaning":"음용수","example":"灾区急需大量清洁的饮用水资源。","examplePinyin":"Zāiqū jíxū dàliàng qīngjié de yǐnyòngshuǐ zīyuán.","translation":"재해 지역에는 다량의 깨끗한 식수 자원이 시급히 필요합니다.","sourceNo":5171},{"no":510,"category":"음식·식사","word":"用餐","pinyin":"yòngcān","meaning":"식사하다","example":"请大家按时到食堂集合用餐。","examplePinyin":"Qǐng dàjiā ànshí dào shítáng jíhé yòngcān.","translation":"제때 식당에 모여 식사해 주세요.","sourceNo":5189},{"no":511,"category":"음식·식사","word":"有机","pinyin":"yǒujī","meaning":"유기의","example":"这家超市专门出售有机蔬菜水果。","examplePinyin":"Zhè jiā chāoshì zhuānmén chūshòu yǒu jī shūcài shuǐguǒ.","translation":"이 슈퍼마켓은 유기농 과일과 채소를 전문으로 취급합니다.","sourceNo":5198},{"no":512,"category":"음식·식사","word":"元宵","pinyin":"yuánxiāo","meaning":"위안샤오(정월대보름 음식)","example":"元宵节那天，全家人坐在一起吃元宵。","examplePinyin":"Yuánxiāojié nà tiān, quánjiārén zuò zài yìqǐ chī yuánxiāo.","translation":"정월 대보름에 온 가족이 모여 위안샤오를 먹어요.","sourceNo":5219},{"no":513,"category":"음식·식사","word":"粥","pinyin":"zhōu","meaning":"죽","example":"妈妈每天早上都会煮一锅热粥。","examplePinyin":"Māma měi tiān zǎoshang dōu huì zhǔ yì guō rè zhōu.","translation":"엄마는 매일 아침 뜨거운 죽 한 냄비를 요리합니다.","sourceNo":5337},{"no":514,"category":"음식·식사","word":"自助","pinyin":"zìzhù","meaning":"셀프서비스의","example":"这家餐厅提供丰富多样的自助餐。","examplePinyin":"Zhè jiā cāntīng tígōng fēngfù duōyàng de zìzhùcān.","translation":"이 레스토랑은 풍부하고 다양한 뷔페를 제공합니다.","sourceNo":5385},{"no":515,"category":"음식·식사","word":"粽子","pinyin":"zòngzi","meaning":"쭝쯔(단오절 음식)","example":"端午节那天，全家人一起包粽子。","examplePinyin":"Duānwǔjié nà tiān, quánjiārén yìqǐ bāo zòngzi.","translation":"단오절에는 온 가족이 함께 쭝쯔를 만들어요.","sourceNo":5391},{"no":516,"category":"쇼핑·물건·장소","word":"昂贵","pinyin":"ángguì","meaning":"비싸다, 고가","example":"这件古董的价格非常昂贵，一般人买不起。","examplePinyin":"Zhè jiàn gǔdǒng de jiàgé fēicháng ángguì, yìbān rén mǎibùqǐ.","translation":"이 골동품의 가격은 매우 비싸서 일반 사람들이 감당할 수 없습니다.","sourceNo":3602},{"no":517,"category":"쇼핑·물건·장소","word":"百货","pinyin":"bǎihuò","meaning":"백화점, 백화","example":"这家商场是市里最大的百货商店。","examplePinyin":"Zhè jiā shāngchǎng shì shìlǐ zuì dà de bǎihuò shāngdiàn.","translation":"이 쇼핑몰은 그 도시에서 가장 큰 백화점이에요.","sourceNo":3612},{"no":518,"category":"쇼핑·물건·장소","word":"保修","pinyin":"bǎoxiū","meaning":"보증, 품질 보증","example":"这台新电视享受三年的保修服务。","examplePinyin":"Zhè tái xīn diànshì xiǎngshòu sān nián de bǎoxiū fúwù.","translation":"이 새 TV에는 3년 보증이 제공됩니다.","sourceNo":3631},{"no":519,"category":"쇼핑·물건·장소","word":"背心","pinyin":"bèixīn","meaning":"조끼, 속옷","example":"夏天他喜欢穿一件背心，比较凉快。","examplePinyin":"Xiàtiān tā xǐhuan chuān yí jiàn bèixīn, bǐjiào liángkuài.","translation":"그는 여름에 몸을 시원하게 유지하기 위해 조끼를 입는 것을 좋아합니다.","sourceNo":3641},{"no":520,"category":"쇼핑·물건·장소","word":"博览会","pinyin":"bólǎnhuì","meaning":"박람회, 엑스포","example":"上海每年都会举办盛大的国际进口博览会。","examplePinyin":"Shànghǎi měi nián dōu huì jǔbàn shèngdà de guójì jìnkǒu bólǎnhuì.","translation":"상하이에서는 매년 성대한 국제수입박람회가 개최됩니다.","sourceNo":3663},{"no":521,"category":"쇼핑·물건·장소","word":"布","pinyin":"bù","meaning":"천, 포","example":"她买了一块布，准备给家人做衣服。","examplePinyin":"Tā mǎi le yíkuài bù, zhǔnbèi gěi jiārén zuò yīfu.","translation":"그녀는 가족을 위한 옷을 만들기 위해 천 조각을 샀습니다.","sourceNo":3667},{"no":522,"category":"쇼핑·물건·장소","word":"财产","pinyin":"cáichǎn","meaning":"재산, 자산","example":"他的财产主要是一些房产和股票。","examplePinyin":"Tā de cáichǎn zhǔyào shi yìxiē fángchǎn hé gǔpiào.","translation":"그의 자산은 주로 부동산과 주식으로 구성되어 있습니다.","sourceNo":3695},{"no":523,"category":"쇼핑·물건·장소","word":"财富","pinyin":"cáifù","meaning":"재물, 부","example":"知识就是最大的财富，要珍惜。","examplePinyin":"Zhīshi jiùshì zuì dà de cáifù, yào zhēnxī.","translation":"지식은 가장 큰 부이며 소중히 여겨야 합니다.","sourceNo":3696},{"no":524,"category":"쇼핑·물건·장소","word":"采购","pinyin":"cǎigòu","meaning":"구매하다, 조달하다","example":"他负责公司的物资采购，工作很忙。","examplePinyin":"Tā fùzé gōngsī de wùzī cǎigòu, gōngzuò hěn máng.","translation":"그는 회사의 자재 조달을 담당하고 있으며 업무에 매우 바쁘다.","sourceNo":3697},{"no":525,"category":"쇼핑·물건·장소","word":"彩票","pinyin":"cǎipiào","meaning":"복권, 로또","example":"他买了一张彩票，希望能中大奖。","examplePinyin":"Tā mǎi le yì zhāng cǎipiào, xīwàng néng zhōngdàjiǎng.","translation":"그는 잭팟에 당첨되기를 바라며 복권을 샀습니다.","sourceNo":3703},{"no":526,"category":"쇼핑·물건·장소","word":"财物","pinyin":"cáiwù","meaning":"금품; 재물","example":"他丢失了一些财物，心里很着急。","examplePinyin":"Tā diūshī le yìxiē cáiwù, xīnlǐ hěn zháojí.","translation":"그는 소지품을 잃어버려서 걱정하고 있었습니다.","sourceNo":3705},{"no":527,"category":"쇼핑·물건·장소","word":"材质","pinyin":"cáizhì","meaning":"재질, 소재","example":"这种桌椅的材质很坚固，非常耐用。","examplePinyin":"Zhè zhǒng zhuōyǐ de cáizhì hěn jiāngù, fēicháng nàiyòng.","translation":"이 테이블과 의자의 재질은 매우 튼튼하고 내구성이 뛰어납니다.","sourceNo":3706},{"no":528,"category":"쇼핑·물건·장소","word":"畅销","pinyin":"chàngxiāo","meaning":"잘 팔리다, 베스트셀러","example":"这本书在书店里非常畅销，已经卖了很多本。","examplePinyin":"Zhè běn shū zài shūdiàn lǐ fēicháng chàngxiāo, yǐjīng mài le hěn duō běn.","translation":"이 책은 서점에서 큰 인기를 끌며 많이 팔렸습니다.","sourceNo":3736},{"no":529,"category":"쇼핑·물건·장소","word":"炒股","pinyin":"chǎogǔ","meaning":"주식 거래, 주식 투자","example":"他最近开始学习炒股，但风险很大。","examplePinyin":"Tā zuìjìn kāishǐ xuéxí chǎogǔ, dàn fēngxiǎn hěn dà.","translation":"그는 최근 주식 거래를 배우기 시작했지만 위험이 높습니다.","sourceNo":3739},{"no":530,"category":"쇼핑·물건·장소","word":"成交","pinyin":"chéngjiāo","meaning":"성사되다, 거래가 이루어지다","example":"这笔生意终于成交了，双方都很满意。","examplePinyin":"Zhè bǐ shēngyi zhōngyú chéngjiāo le, shuāngfāng dōu hěn mǎnyì.","translation":"마침내 거래가 성사되었고 양측 모두 매우 만족했습니다.","sourceNo":3758},{"no":531,"category":"쇼핑·물건·장소","word":"储蓄","pinyin":"chǔxù","meaning":"저축, 예금","example":"他养成了储蓄的好习惯，不乱花钱。","examplePinyin":"Tā yǎngchéng le chǔxù de hǎo xíguàn, bú luànhuāqián.","translation":"그는 좋은 저축 습관을 길러왔고 함부로 돈을 쓰지 않습니다.","sourceNo":3815},{"no":532,"category":"쇼핑·물건·장소","word":"贷款","pinyin":"dàikuǎn","meaning":"대출, 융자","example":"他向银行申请了一笔贷款来创业。","examplePinyin":"Tā xiàng yínháng shēnqǐng le yì bǐ dàikuǎn lái chuàngyè.","translation":"그는 사업을 시작하기 위해 은행에 대출을 신청했습니다.","sourceNo":3847},{"no":533,"category":"쇼핑·물건·장소","word":"倒闭","pinyin":"dǎobì","meaning":"도산하다, 파산하다","example":"那家公司因为经营不善而倒闭了。","examplePinyin":"Nà jiā gōngsī yīnwèi jīngyíng búshàn ér dǎobì le.","translation":"그 회사는 경영 부실로 파산했다.","sourceNo":3870},{"no":534,"category":"쇼핑·물건·장소","word":"店铺","pinyin":"diànpù","meaning":"가게, 점포","example":"这家店铺的生意非常好，排着长队。","examplePinyin":"Zhè jiā diànpù de shēngyi fēicháng hǎo, pái zhe chángduì.","translation":"이 가게의 장사는 매우 좋으며 줄이 길다.","sourceNo":3892},{"no":535,"category":"쇼핑·물건·장소","word":"订单","pinyin":"dìngdān","meaning":"주문; 주문서","example":"他在网上下了一个订单，购买了一本书。","examplePinyin":"Tā zài wǎngshàng xià le yí ge dìngdān, gòumǎi le yì běn shū.","translation":"그는 온라인으로 책을 주문했습니다.","sourceNo":3905},{"no":536,"category":"쇼핑·물건·장소","word":"定价","pinyin":"dìngjià","meaning":"정가, 가격","example":"商家需要根据成本合理定价。","examplePinyin":"Shāngjiā xūyào gēnjù chéngběn hélǐ dìngjià.","translation":"판매자는 비용을 기준으로 합리적인 가격을 설정해야 합니다.","sourceNo":3907},{"no":537,"category":"쇼핑·물건·장소","word":"定制","pinyin":"dìngzhì","meaning":"맞춤형, 주문 제작","example":"这家公司可以为客户提供高端产品的定制服务。","examplePinyin":"Zhè jiā gōngsī kěyǐ wéi kèhù tígōng gāoduān chǎnpǐn de dìngzhì fúwù.","translation":"이 회사는 고객에게 고급 제품에 대한 맞춤형 서비스를 제공할 수 있습니다.","sourceNo":3911},{"no":538,"category":"쇼핑·물건·장소","word":"耳环","pinyin":"ěrhuán","meaning":"귀걸이, 이어링","example":"她戴着一副漂亮的耳环，很引人注目。","examplePinyin":"Tā dài zhe yí fù piàoliang de ěrhuán, hěn yǐn rén zhùmù.","translation":"그녀는 눈길을 사로잡는 아름다운 귀걸이를 착용하고 있습니다.","sourceNo":3945},{"no":539,"category":"쇼핑·물건·장소","word":"房价","pinyin":"fángjià","meaning":"집값, 주택 가격","example":"近来房价涨得很快，买房子越来越难了。","examplePinyin":"Jìnlái fángjià zhǎng de hěn kuài, mǎifángzi yuèláiyuè nán le.","translation":"최근 집값이 급격하게 오르면서 집을 사기가 점점 어려워지고 있다.","sourceNo":3964},{"no":540,"category":"쇼핑·물건·장소","word":"发票","pinyin":"fāpiào","meaning":"영수증, 인보이스","example":"购物后请索取发票，以方便退换货。","examplePinyin":"Gòuwù hòu qǐng suǒqǔ fāpiào, yǐ fāngbiàn tuìhuànhuò.","translation":"반품과 교환을 위해 구매 후 세금계산용 영수증을 받으세요.","sourceNo":3974},{"no":541,"category":"쇼핑·물건·장소","word":"分期","pinyin":"fēnqī","meaning":"분할, 분리","example":"这笔费用可以分期付款，减轻你的经济压力。","examplePinyin":"Zhè bǐ fèiyòng kěyǐ fēnqī fùkuǎn, jiǎnqīng nǐ de jīngjì yālì.","translation":"이 수수료는 분할 납부가 가능하므로 재정적 부담을 줄일 수 있습니다.","sourceNo":3994},{"no":542,"category":"쇼핑·물건·장소","word":"富裕","pinyin":"fùyù","meaning":"부유하다, 넉넉하다","example":"虽然生活变得富裕了，但他依然很勤俭。","examplePinyin":"Suīrán shēnghuó biànde fùyù le, dàn tā yīrán hěn qínjiǎn.","translation":"그의 삶은 더욱 풍요로워졌지만 여전히 매우 검소합니다.","sourceNo":4010},{"no":543,"category":"쇼핑·물건·장소","word":"贵重","pinyin":"guìzhòng","meaning":"귀중하다","example":"这条项链是一件非常贵重的物品。","examplePinyin":"Zhè tiáo xiàngliàn shì yí jiàn fēicháng guìzhòng de wùpǐn.","translation":"이 목걸이는 매우 귀중한 물건입니다.","sourceNo":4096},{"no":544,"category":"쇼핑·물건·장소","word":"国产","pinyin":"guóchǎn","meaning":"국산의","example":"他家里用的家电大多是国产品牌。","examplePinyin":"Tā jiālǐ yòng de jiādiàn dàduō shì guóchǎn pǐnpái.","translation":"그의 집에 사용되는 가전제품은 대부분 국내 브랜드다.","sourceNo":4100},{"no":545,"category":"쇼핑·물건·장소","word":"股票","pinyin":"gǔpiào","meaning":"주식","example":"他这几年一直在炒股票赚钱。","examplePinyin":"Tā zhè jǐ nián yìzhí zài chǎogǔpiào zhuànqián.","translation":"그는 지난 몇 년간 주식투자로 돈을 벌어왔다.","sourceNo":4108},{"no":546,"category":"쇼핑·물건·장소","word":"股市","pinyin":"gǔshì","meaning":"주식시장","example":"最近股市行情波动得非常厉害。","examplePinyin":"Zuìjìn gǔshì hángqíng bōdòng de fēicháng lìhai.","translation":"최근 주식시장은 매우 변동성이 심합니다.","sourceNo":4110},{"no":547,"category":"쇼핑·물건·장소","word":"化妆","pinyin":"huàzhuāng","meaning":"화장하다","example":"她每天出门前都要花时间化妆。","examplePinyin":"Tā měi tiān chūmén qián dōu yào huā shíjiān huàzhuāng.","translation":"그녀는 매일 외출 전 화장을 하는 데 시간을 보낸다.","sourceNo":4178},{"no":548,"category":"쇼핑·물건·장소","word":"汇","pinyin":"huì","meaning":"송금하다 / 모이다","example":"我上个月给他汇了一笔生活费。","examplePinyin":"Wǒ shànggeyuè gěi tā huì le yì bǐ shēnghuófèi.","translation":"나는 지난달에 그에게 생활비를 보냈습니다.","sourceNo":4179},{"no":549,"category":"쇼핑·물건·장소","word":"汇款","pinyin":"huìkuǎn","meaning":"송금하다 / 송금","example":"我已经给你汇款了，请注意查收。","examplePinyin":"Wǒ yǐjīng gěi nǐ huìkuǎn le, qǐng zhùyì cháshōu.","translation":"이미 돈을 보냈으니 확인해주세요.","sourceNo":4186},{"no":550,"category":"쇼핑·물건·장소","word":"戒指","pinyin":"jièzhi","meaning":"반지","example":"她伸出手，展示了一枚精美的戒指。","examplePinyin":"Tā shēnchūshǒu, zhǎnshì le yìméi jīngměi de jièzhi.","translation":"그녀는 손을 뻗어 아름다운 반지를 선보였습니다.","sourceNo":4278},{"no":551,"category":"쇼핑·물건·장소","word":"经商","pinyin":"jīngshāng","meaning":"장사하다","example":"他从年轻时就开始外出经商谋生。","examplePinyin":"Tā cóng niánqīng shí jiù kāishǐ wàichū jīngshāng móushēng.","translation":"그는 어려서부터 생계를 유지하기 위해 사업을 시작했습니다.","sourceNo":4300},{"no":552,"category":"쇼핑·물건·장소","word":"金钱","pinyin":"jīnqián","meaning":"돈, 금전","example":"幸福的生活不完全取决于金钱多少。","examplePinyin":"Xìngfú de shēnghuó bù wánquán qǔjuéyú jīnqián duōshao.","translation":"행복한 삶은 돈이 얼마나 있느냐에 전적으로 달려 있는 것이 아닙니다.","sourceNo":4312},{"no":553,"category":"쇼핑·물건·장소","word":"金属","pinyin":"jīnshǔ","meaning":"금속","example":"这件工艺品是用珍贵金属打造的。","examplePinyin":"Zhè jiàn gōngyìpǐn shì yòng zhēnguì jīnshǔ dǎzào de.","translation":"이 유물은 귀금속으로 제작되었습니다.","sourceNo":4315},{"no":554,"category":"쇼핑·물건·장소","word":"金子","pinyin":"jīnzi","meaning":"금","example":"这枚戒指是用纯金子打造而成的。","examplePinyin":"Zhè méi jièzhi shì yòng chún jīnzi dǎzào ér chéng de.","translation":"이 반지는 순금으로 만들어졌습니다.","sourceNo":4317},{"no":555,"category":"쇼핑·물건·장소","word":"卡片","pinyin":"kǎpiàn","meaning":"카드","example":"请仔细填写这张个人信息卡片。","examplePinyin":"Qǐng zǐxì tiánxiě zhè zhāng gerén xìnxī kǎpiàn.","translation":"본 개인정보 카드를 주의 깊게 작성해 暖内衣。","examplePinyin":"Tiānqì zhuǎn liáng, tā tiānzhì le jǐ jiàn bǎonuǎn nèiyī.","translation":"날씨가 점점 추워져서 그는 보온 속옷을 샀습니다.","sourceNo":4552},{"no":565,"category":"쇼핑·물건·장소","word":"赔偿","pinyin":"péicháng","meaning":"배상하다","example":"由于操作失误，公司需要赔偿损失。","examplePinyin":"Yóuyú cāozuò shīwù, gōngsī xūyào péicháng sǔnshī.","translation":"운영상의 오류로 인해 회사는 손실을 보상해야 합니다.","sourceNo":4576},{"no":566,"category":"쇼핑·물건·장소","word":"配套","pinyin":"pèitào","meaning":"세트를 맞추다, 세트로 갖추다","example":"这个小区的生活配套设施十分完善。","examplePinyin":"Zhè ge xiǎoqū de shēnghuó pèitào shèshī shífēn wánshàn.","translation":"이 지역 사회의 생활 시설은 매우 완벽합니다.","sourceNo":4578},{"no":567,"category":"쇼핑·물건·장소","word":"皮","pinyin":"pí","meaning":"가죽, 껍질 / 두껍다(뻔뻔하다)","example":"这个香蕉皮踩上去非常容易打滑。","examplePinyin":"Zhè ge xiāngjiāopí cǎi shàngqu fēicháng róngyì dǎhuá.","translation":"이 바나나 껍질은 밟으면 매우 미끄럽습니다.","sourceNo":4584},{"no":568,"category":"쇼핑·물건·장소","word":"破产","pinyin":"pòchǎn","meaning":"파산하다","example":"由于经营不善，这家公司最终破产了。","examplePinyin":"Yóuyú jīngyíng búshàn, zhè jiā gōngsī zuìzhōng pòchǎn le.","translation":"경영난으로 회사는 결국 파산했다.","sourceNo":4606},{"no":569,"category":"쇼핑·물건·장소","word":"券","pinyin":"quàn","meaning":"티켓, 쿠폰","example":"商场发放了一批购物优惠券给顾客。","examplePinyin":"Shāngchǎng fāfàng le yìpī gòuwù yōuhuìquàn gěi gùkè.","translation":"쇼핑몰은 고객에게 쇼핑 쿠폰을 일괄 발행했습니다.","sourceNo":4675},{"no":570,"category":"쇼핑·물건·장소","word":"渠道","pinyin":"qúdào","meaning":"경로, 채널","example":"公司正在积极拓宽产品的销售渠道。","examplePinyin":"Gōngsī zhèngzài jījí tuòkuān chǎnpǐn de xiāoshòu qúdào.","translation":"회사는 적극적으로 제품 판매 채널을 확대하고 있습니다.","sourceNo":4680},{"no":571,"category":"쇼핑·물건·장소","word":"商标","pinyin":"shāngbiāo","meaning":"상표","example":"这家企业花大力气注册了自己的商标。","examplePinyin":"Zhè jiā qǐyè huā dà lìqi zhùcè le zìjǐ de shāngbiāo.","translation":"회사는 상표 등록을 위해 많은 노력을 기울였습니다.","sourceNo":4741},{"no":572,"category":"쇼핑·물건·장소","word":"上市","pinyin":"shàngshì","meaning":"상장하다, 출시되다","example":"这家企业计划明年在证券市场上市。","examplePinyin":"Zhè jiā qǐyè jìhuà },{"no":606,"category":"이동·교통","word":"畅通","pinyin":"chàngtōng","meaning":"원활하다, 통하다","example":"这个路段现在很畅通，不会堵车。","examplePinyin":"Zhè ge lùduàn xiànzài hěn chàngtōng, búhuì dǔchē.","translation":"이제 이 도로 구간은 매우 원활해졌으며 교통 정체도 없을 것입니다.","sourceNo":3734},{"no":607,"category":"이동·교통","word":"船只","pinyin":"chuánzhī","meaning":"배, 선박","example":"港口里停靠着许多船只。","examplePinyin":"Gǎngkǒu lǐ tíngkào zhe xǔduō chuánzhī.","translation":"항구에는 많은 선박들이 정박되어 있습니다.","sourceNo":3800},{"no":608,"category":"이동·교통","word":"出境","pinyin":"chūjìng","meaning":"출국하다, 국외로 나가다","example":"他因为公事经常出境，去过很多国家。","examplePinyin":"Tā yīnwèi gōngshì jīngcháng chūjìng, qùguo hěn duō guójiā.","translation":"그는 공무상 해외 출장을 자주 다니고 여러 나라를 다녀왔다.","sourceNo":3809},{"no":609,"category":"이동·교통","word":"出游","pinyin":"chūyóu","meaning":"나들이, 외출","example":"周末他计划出游，放松心情。","examplePinyin":"Zhōumò tā jìhuà chūyóu, fàngsōng xīnqíng.","translation":"그는 주말에 여행을 가서 휴식을 취할 계획이다.","sourceNo":3816},{"no":610,"category":"이동·교통","word":"倒车","pinyin":"dàochē","meaning":"차를 후진하다","example":"他正在倒车，请注意后方安全。","examplePinyin":"Tā zhèngzài dàochē, qǐng zhùyì hòufāng ānquán.","translation":"후진 중이오니 후방 안전에 주의하시기 바랍니다.","sourceNo":3871},{"no":611,"category":"이동·교통","word":"抵达","pinyin":"dǐdá","meaning":"도착하다, 닿다","example":"经过长途飞行，他们抵达了目的地。","examplePinyin":"Jīngguò chángtú fēixíng, tāmen dǐdá le mùdìdì.","translation":"긴 비행 끝에 그들은 목적지에 도착했다.","sourceNo":3899},{"no":612,"category":"이동·교통","word":"定位","pinyin":"dìngwèi","meaning":"위치, 정위","example":"他正在用GPS进行定位，寻找目的地。","examplePinyin":"Tā zhèngzài yòng GPS jìnxíng dìngwèi, xúnzhǎo mùdìdì.","translation":"그는 GPS로 위치를 파악하며 목적지를 찾고 있어요.","sourceNo":3909},{"no":613,"category":"이동·교통","word":"渡","pinyin":"dù","meaning":"건너다, 나루터","example":"他驾驶小船渡过了河。","examplePinyin":"Tā jiàshǐ xiǎochuán dùguò le hé.","translation":"그는 배를 타고 강을 건넜습니다.","sourceNo":3925},{"no":614,"category":"이동·교통","word":"港口","pinyin":"gǎngkǒu","meaning":"항구, 포트","example":"轮船正在慢慢驶向港口，准备靠岸。","examplePinyin":"Lúnchuán zhèngzài mànmàn shǐxiàng gǎngkǒu, zhǔnbèi kào'àn.","translation":"배는 천천히 항구를 향해 항해하며 정박을 준비하고 있습니다.","sourceNo":4021},{"no":615,"category":"이동·교통","word":"拐弯","pinyin":"guǎiwān","meaning":"방향을 바꾸다 전환하다","example":"在路口拐弯处要减速慢行，注意安全。","examplePinyin":"Zài lùkǒu guǎiwān chù yào jiǎnsù mànxíng, zhùyì ānquán.","translation":"교차로에서는 속도를 줄이고 안전에 주의하세요.","sourceNo":4074},{"no":616,"category":"이동·교통","word":"观光","pinyin":"guānguāng","meaning":"관광하다","example":"放假的时候，我们一家人去云南观光。","examplePinyin":"Fàngjiǎ de shíhou, wǒmen yìjiārén qù yúnnán guānguāng.","translation":"휴일 동안 우리 가족은 운남성으로 관광을 갔습니다.","sourceNo":4081},{"no":617,"category":"이동·교통","word":"轨道","pinyin":"guǐdào","meaning":"궤도","example":"火车沿着固定的轨道平稳地行驶着。","examplePinyin":"Huǒchē yánzhe gùdìng de guǐdào píngwěn de xíngshǐ zhe.","translation":"열차는 고정된 선로를 따라 원활하게 운행됩니다.","sourceNo":4091},{"no":618,"category":"이동·교통","word":"航空","pinyin":"hángkōng","meaning":"항공","example":"毕业以后，他一直在航空公司工作。","examplePinyin":"Bìyè yǐhòu, tā yìzhí zài hángkōng gōngsī gōngzuò.","translation":"졸업 후 그는 항공사에 근무했다.","sourceNo":4123},{"no":619,"category":"이동·교통","word":"滑行","pinyin":"huáxíng","meaning":"활주하다, 미끄러지다","example":"飞机在跑道上缓缓地滑行了一段。","examplePinyin":"Fēijī zài pǎodào shàng huǎnhuǎn de huáxíng le yí duàn.","translation":"비행기는 활주로를 천천히 이동했습니다.","sourceNo":4176},{"no":620,"category":"이동·교통","word":"货车","pinyin":"huòchē","meaning":"화물차","example":"一辆装满货物的货车停在了路边。","examplePinyin":"Yí liàng zhuāngmǎn huòwù de huòchē tíng zài le lùbiān.","translation":"길가에는 물건을 실은 트럭이 주차되어 있었습니다.","sourceNo":4196},{"no":621,"category":"이동·교통","word":"机动车","pinyin":"jīdòngchē","meaning":"자동차, 기동차","example":"开车上路时，机动车必须遵守交通规则。","examplePinyin":"Kāichē shànglù shí, jīdòngchē bìxū zūnshǒu jiāotōng guīzé.","translation":"도로에서 운전할 때 자동차는 교통 법규를 준수해야 합니다.","sourceNo":4259},{"no":622,"category":"이동·교통","word":"客车","pinyin":"kèchē","meaning":"여객차, 버스","example":"长途客车已经准时从车站出发。","examplePinyin":"Chángtú kèchē yǐjīng zhǔnshí cóng chēzhàn chūfā.","translation":"장거리 버스가 정시에 역에서 출발했습니다.","sourceNo":4380},{"no":623,"category":"이동·교통","word":"路程","pinyin":"lùchéng","meaning":"노정, 거리","example":"从这里到火车站的路程比较远。","examplePinyin":"Cóng zhèlǐ dào huǒchēzhàn de lùchéng bǐjiào yuǎn.","translation":"여기서 기차역까지는 거리가 멀다.","sourceNo":4465},{"no":624,"category":"이동·교통","word":"旅程","pinyin":"lǚchéng","meaning":"여정","example":"这次去西藏的旅程令人难忘。","examplePinyin":"Zhè cì qù xīzàng de lǚchéng lìngrén nánwàng.","translation":"이번 티베트 여행은 잊지 못할 추억이 되었습니다.","sourceNo":4466},{"no":625,"category":"이동·교통","word":"路况","pinyin":"lùkuàng","meaning":"도로 상황","example":"由于修路施工，今天路况不太好。","examplePinyin":"Yóuyú xiūlù shīgōng, jīntiān lùkuàng bútàihǎo.","translation":"오늘은 도로공사로 인해 도로사정이 좋지 않습니다.","sourceNo":4468},{"no":626,"category":"이동·교통","word":"路面","pinyin":"lùmiàn","meaning":"도로면","example":"大雨过后，路面变得非常湿滑。","examplePinyin":"Dàyǔ guòhòu, lùmiàn biànde fēicháng shī huá.","translation":"비가 많이 내린 뒤 길이 매우 미끄러워졌습니다.","sourceNo":4469},{"no":627,"category":"이동·교통","word":"轮","pinyin":"lún","meaning":"바퀴 / 돌다, 차례로 하다 / 회, 번(양사)","example":"车轮飞快地在马路上转动着。","examplePinyin":"Chēlún fēikuài de zài mǎlùshang zhuàndòng zhe.","translation":"도로에서 바퀴가 빠르게 회전했습니다.","sourceNo":4470},{"no":628,"category":"이동·교통","word":"轮船","pinyin":"lúnchuán","meaning":"여객선","example":"一艘巨大的轮船正缓缓驶入港口。","examplePinyin":"Yìsōu jùdà de lúnchuán zhèng huǎnhuǎn shǐrù gǎngkǒu.","translation":"거대한 배가 천천히 항구로 항해하고 있습니다.","sourceNo":4471},{"no":629,"category":"이동·교통","word":"落地","pinyin":"luòdì","meaning":"착지하다, 착륙하다","example":"经过颠簸，飞机终于安全落地了。","examplePinyin":"Jīngguò diānbǒ, fēijī zhōngyú ānquán luòdì le.","translation":"난기류 끝에 비행기는 마침내 안전하게 착륙했습니다.","sourceNo":4476},{"no":630,"category":"이동·교통","word":"旅途","pinyin":"lǚtú","meaning":"여정, 여행길","example":"祝你在这次旅途中一切顺利平安。","examplePinyin":"Zhù nǐ zài zhè cì lǚtú zhōng yíqiè shùnlì píng'ān.","translation":"이번 여행길이 내내 순조롭고 무사하길 바라요.","sourceNo":4478},{"no":631,"category":"이동·교통","word":"码头","pinyin":"mǎtóu","meaning":"부두","example":"一艘货轮缓缓地靠近了繁忙的码头。","examplePinyin":"Y ":"원림, 정원","example":"苏州的古典园林闻名世界，吸引了许多游客。","examplePinyin":"Sūzhōu de gǔdiǎn yuánlín wénmíng shìjiè, xīyǐn le xǔduō yóukè.","translation":"쑤저우의 고전 정원은 세계적으로 유명해 관광객이 많이 찾아와요.","sourceNo":5214},{"no":707,"category":"집·공간·생활","word":"浴室","pinyin":"yùshì","meaning":"욕실","example":"请保持浴室的地面干燥清洁。","examplePinyin":"Qǐng bǎochí yùshì de dìmiàn gānzào qīngjié.","translation":"욕실 바닥을 건조하고 깨끗하게 유지해주세요.","sourceNo":5236},{"no":708,"category":"집·공간·생활","word":"照明","pinyin":"zhàomíng","meaning":"조명하다","example":"这条街道的照明设施亟需改善。","examplePinyin":"Zhè tiáo jiēdào de zhàomíng shèshī jíxū gǎishàn.","translation":"이 거리의 조명은 개선이 절실히 필요합니다.","sourceNo":5271},{"no":709,"category":"집·공간·생활","word":"枕头","pinyin":"zhěntou","meaning":"베개","example":"这个记忆棉枕头睡起来非常舒服。","examplePinyin":"Zhè ge jìyì mián zhěntou shuì qǐlai fēicháng shūfu.","translation":"이 메모리폼 베개는 잠을 자기에 매우 편안합니다.","sourceNo":5290},{"no":710,"category":"집·공간·생활","word":"砖","pinyin":"zhuān","meaning":"벽돌","example":"工人们用红砖建起了一堵围墙。","examplePinyin":"Gōngrénmen yòng hóngzhuān jiànqǐ le yìdǔ wéiqiáng.","translation":"노동자들은 붉은 벽돌로 벽을 쌓았습니다.","sourceNo":5343},{"no":711,"category":"집·공간·생활","word":"住宅","pinyin":"zhùzhái","meaning":"주택","example":"这片区域新建了不少高档住宅楼。","examplePinyin":"Zhè piàn qūyù xīnjiàn le bùshǎo gāodàng zhùzháilóu.","translation":"이 지역에는 고급 주거용 건물이 많이 지어졌습니다.","sourceNo":5372},{"no":712,"category":"집·공간·생활","word":"自来水","pinyin":"zìláishuǐ","meaning":"수돗물","example":"城市里的自来水经过严格净化处理。","examplePinyin":"Chéngshì lǐ de zìláishuǐ jīngguò yángé jìnghuà chǔlǐ.","translation":"도시의 수돗물은 엄격한 정화 과정을 거칩니다.","sourceNo":5378},{"no":713,"category":"집·공간·생활","word":"走廊","pinyin":"zǒuláng","meaning":"복도","example":"他站在教学楼的走廊里等候老师。","examplePinyin":"Tā zhàn zài jiàoxuélóu de zǒuláng lǐ děnghòu lǎoshī.","translation":"그는 학교 건물 복도에 서서 선생님을 기다려요.","sourceNo":5392},{"no":714,"category":"건강·날씨","word":"岸","pinyin":"àn","meaning":"언덕, 기슭","example":"船终于靠岸了，人们开始下船。","examplePinyin":"Chuán zhōngyú kào'àn le, rénmen kāishǐ xiàchuán.","translation":"마침내 배가 정박했고 사람들이 내리기 시작했다.","sourceNo":3601},{"no":715,"category":"건강·날씨","word":"按摩","pinyin":"ànmó","meaning":"마사지, 안마","example":"他通过按摩来缓解疲劳。","examplePinyin":"Tā tōngguò ànmó lái huǎnjiě píláo.","translation":"마사지로 피로를 풀어줍니다.","sourceNo":3604},{"no":716,"category":"건강·날씨","word":"保健","pinyin":"bǎojiàn","meaning":"보건, 건강","example":"大家越来越重视身体的保健，经常去健身。","examplePinyin":"Dàjiā yuèláiyuè zhòngshì shēntǐ de bǎojiàn, jīngcháng qù jiànshēn.","translation":"사람들은 건강 관리에 점점 더 신경 쓰며 자주 운동하러 가요.","sourceNo":3625},{"no":717,"category":"건강·날씨","word":"保暖","pinyin":"bǎonuǎn","meaning":"보온하다, 따뜻하게 하다","example":"冬天出门，要注意保暖，多穿衣服。","examplePinyin":"Dōngtiān chūmén, yào zhùyì bǎonuǎn, duō chuānyīfu.","translation":"겨울에 외출할 때는 따뜻하게 지내고 옷을 더 많이 입으세요.","sourceNo":3629},{"no":718,"category":"건강·날씨","word":"本能","pinyin":"běnnéng","meaning":"본능, 본능","example":"动物有求生的本能，遇到危险会逃跑。","examplePinyin":"Dòngwù yǒu qiúshēng de běnnéng, yùdào wēixiǎn huì táopǎo.","translation":"동물은 생존 본능이 있어서 위험에 처하면 도망가는 경향이 있습니다.","sourceNo":3644},{"no":719,"category":"건강·날씨","word":"病毒","pinyin":"bìngdú","meaning":"바이러스, 독","example":"这是一种新型的电脑病毒，危害很大。","examplePinyin":"Zhè shì yì zhǒng xīnxíng de diànnǎo bìngdú, wēihài hěn dà.","translation":"이것은 매우 유해한 새로운 유형의 컴퓨터 바이러스입니다.","sourceNo":3659},{"no":720,"category":"건강·날씨","word":"播种","pinyin":"bōzhǒng","meaning":"파종하다, 뿌리다","example":"春天来了，农民们正在田里播种。","examplePinyin":"Chūntiān lái le, nóngmínmen zhèngzài tiánlǐ bōzhǒng.","translation":"봄이 왔습니다. 농부들은 밭에 씨앗을 뿌리고 있습니다.","sourceNo":3665},{"no":721,"category":"건강·날씨","word":"脖子","pinyin":"bózi","meaning":"목, 넥","example":"长颈鹿的脖子很长，可以吃到树叶。","examplePinyin":"Chángjǐnglù de bózi hěn cháng, kěyǐ chī dào shùyè.","translation":"기린은 잎을 먹을 수 있을 만큼 긴 목을 가지고 있습니다.","sourceNo":3666},{"no":722,"category":"건강·날씨","word":"不适","pinyin":"búshì","meaning":"불편하다, 적응 안 됨","example":"他吃了药后，身体的不适感有所缓解。","examplePinyin":"Tā chī le yào hòu, shēntǐ de búshìgǎn yǒusuǒ huǎnjiě.","translation":"약을 복용한 후 그의 신체적 불편함은 완화되었습니다.","sourceNo":3681},{"no":723,"category":"건강·날씨","word":"部位","pinyin":"bùwèi","meaning":"부위, 위치","example":"这种病毒的入侵部位主要是呼吸道。","examplePinyin":"Zhè zhǒng bìngdú de rùqīn bùwèi zhǔyào shi hūxīdào.","translation":"이 바이러스의 주요 침입 부위는 호흡기입니다.","sourceNo":3684},{"no":724,"category":"건강·날씨","word":"彩虹","pinyin":"cǎihóng","meaning":"무지개, 색의","example":"雨过天晴，天空中出现了一道美丽的彩虹。","examplePinyin":"Yǔ guo tiān qíng, tiānkōng zhōng chūxiàn le yí dào měilì de cǎihóng.","translation":"비가 내린 뒤 하늘은 맑아지고 아름다운 무지개가 나타났다.","sourceNo":3698},{"no":725,"category":"건강·날씨","word":"残疾","pinyin":"cánjí","meaning":"장애, 불구","example":"他虽然有残疾，但意志力非常坚强。","examplePinyin":"Tā suīrán yǒu cánjí, dàn yìzhìlì fēicháng jiānqiáng.","translation":"그는 장애가 있지만 의지가 매우 강합니다.","sourceNo":3708},{"no":726,"category":"건강·날씨","word":"草原","pinyin":"cǎoyuán","meaning":"초원, 풀밭","example":"她从小就向往在辽阔的大草原上生活。","examplePinyin":"Tā cóngxiǎo jiù xiàngwǎng zài liáokuò de dà cǎoyuán shàng shēnghuó.","translation":"그녀는 어렸을 때부터 광활한 초원에서 살고 싶은 동경을 품고 있었습니다.","sourceNo":3710},{"no":727,"category":"건강·날씨","word":"产地","pinyin":"chǎndì","meaning":"산지, 생산지","example":"龙井茶的主要产地是杭州西湖。","examplePinyin":"Lóngjǐngchá de zhǔyào chǎndì shì hángzhōu xīhú.","translation":"용정차의 주요 산지는 항저우 서호이다.","sourceNo":3720},{"no":728,"category":"건강·날씨","word":"肠","pinyin":"cháng","meaning":"창자, 배","example":"他肠胃不好，经常拉肚子。","examplePinyin":"Tā chángwèi bùhǎo, jīngcháng lādùzi.","translation":"그는 위장 상태가 좋지 않고 설사를 자주 합니다.","sourceNo":3721},{"no":729,"category":"건강·날씨","word":"长寿","pinyin":"chángshòu","meaning":"장수, 오래 살다","example":"祝您健康长寿，这是最美好的祝福。","examplePinyin":"Zhù nín jiànkāng chángshòu, zhè shì zuì měihǎo de zhùfú.","translation":"건강과 장수를 기원합니다. 이것이 최고의 축복입니다.","sourceNo":3733},{"no":730,"category":"건강·날씨","word":"常温","pinyin":"chángwēn","meaning":"상온, 실온","example":"这种实验需要在常温下进行，温度不能太高。","examplePinyin":"Zhè zhǒng shíyàn xūyào zài chángwēn xià jìnxíng, wēndù bùnéng tài gāo.","translation":"이런 종류의 실험은 실온에서 수행해야 하며 온도가 너무 높으면 안 됩니다.","sourceNo":3735},{"no":731,"category":"건강·날씨","word":"潮湿","pinyin":"cháoshī","meaning":"습하다, 축축하다","example":"南方春天的空气很潮湿，要注意防潮。","examplePinyin":"Nánfāng chūntiān de kōngqì hěn cháoshī, yào zhùyì fángcháo.","translation":"봄철 남쪽 공기는 매우 습하므로 습기 방지에 주의하세요.","sourceNo":3742},{"no":732,"category":"건강·날씨","word":"传染","pinyin":"chuánrǎn","meaning":"전염되다; 전염시키다","example":"注意卫生，防止传染病传播。","examplePinyin":"Zhùyì wèishēng, fángzhǐ chuánrǎnbìng chuánbō.","translation":"위생에 유의하고 감염병 확산을 예방하세요.","sourceNo":3795},{"no":733,"category":"건강·날씨","word":"传染病","pinyin":"chuánrǎnbìng","meaning":"전염병, 감염병","example":"他得了传染病，需要隔离治疗。","examplePinyin":"Tā déle chuánrǎnbìng, xūyào gélí zhìliáo.","translation":"그는 전염병을 앓고 있어 격리 치료가 필요했습니다.","sourceNo":3796},{"no":734,"category":"건강·날씨","word":"大地","pinyin":"dàdì","meaning":"대지, 땅","example":"春回大地，万物复苏。","examplePinyin":"Chūn huí dàdì, wànwù fùsū.","translation":"봄은 땅에 돌아오고 모든 것이 살아납니다.","sourceNo":3837},{"no":735,"category":"건강·날씨","word":"打雷","pinyin":"dǎléi","meaning":"천둥이 치다","example":"昨晚的雷声特别大，打雷打得很响。","examplePinyin":"Zuówǎn de léishēng tèbié dà, dǎléi dǎ de hěn xiǎng.","translation":"어젯밤에는 천둥소리가 유난히 컸고, 천둥소리도 아주 크게 났습니다.","sourceNo":3853},{"no":736,"category":"건강·날씨","word":"诞生","pinyin":"dànshēng","meaning":"탄생하다, 태어나다","example":"一个新生命诞生了，给全家带来了喜悦。","examplePinyin":"Yí ge xīn shēngmìng dànshēng le, gěi quánjiā dàilái le xǐyuè.","translation":"새로운 생명이 탄생하여 온 가족에게 기쁨을 안겨주었습니다.","sourceNo":3866},{"no":737,"category":"건강·날씨","word":"岛","pinyin":"dǎo","meaning":"섬, 도서","example":"这座岛是候鸟迁徙途中的重要栖息地。","examplePinyin":"Zhè zuò dǎo shì hòuniǎo qiānxǐ túzhōng de zhòngyào qīxīdì.","translation":"이 섬은 철새가 이동하는 도중에 머무는 중요한 서식지예요.","sourceNo":3869},{"no":738,"category":"건강·날씨","word":"低碳","pinyin":"dītàn","meaning":"저탄소, 탄소 배출 적은","example":"我们应该倡导低碳环保的生活方式。","examplePinyin":"Wǒmen yīnggāi chàngdǎo dītàn huánbǎo de shēnghuó fāngshì.","translation":"우리는 저탄소, 환경친화적인 생활방식을 장려해야 합니다.","sourceNo":3912},{"no":739,"category":"건강·날씨","word":"地形","pinyin":"dìxíng","meaning":"지형, 지세","example":"这里的地形非常复杂，容易迷路。","examplePinyin":"Zhèlǐ de dìxíng fēicháng fùzá, róngyì mílù.","translation":"이곳의 지형은 매우 복잡하고 길을 잃기 쉽습니다.","sourceNo":3913},{"no":740,"category":"건강·날씨","word":"地质","pinyin":"dìzhì","meaning":"지질, 지질학","example":"他正在研究这个地区的地质构造。","examplePinyin":"Tā zhèngzài yánjiū zhè ge dìqū de dìzhì gòuzào.","translation":"그는 그 지역의 지질 구조를 연구하고 있습니다.","sourceNo":3915},{"no":741,"category":"건강·날씨","word":"毒","pinyin":"dú","meaning":"독, 독물","example":"这种化学物质有毒，要小心处理。","examplePinyin":"Zhè zhǒng huàxué wùzhì yǒudú, yào xiǎoxīn chǔlǐ.","translation":"이 화학물질은 독성이 있으므로 주의해서 취급해야 합니다.","sourceNo":3924},{"no":742,"category":"건강·날씨","word":"儿科","pinyin":"érkē","meaning":"소아과, 소아","example":"这家医院的儿科很出名，很多家长带孩子来看病。","examplePinyin":"Zhè jiā yīyuàn de érkē hěn chūmíng, hěn duō jiāzhǎng dài háizi lái kànbìng.","translation":"이 병원은 소아과로 매우 유명하며, 많은 부모들이 자녀를 데리고 의사를 만나러 옵니다.","sourceNo":3946},{"no":743,"category":"건강·날씨","word":"二氧化碳","pinyin":"èryǎnghuàtàn","meaning":"이산화탄소","example":"植物光合作用需要吸收二氧化碳和水。","examplePinyin":"Zhíwù guānghé zuòyòng xūyào xīshōu èryǎnghuàtàn hé shuǐ.","translation":"식물은 광합성을 위해 이산화탄소와 물을 흡수해야 합니다.","sourceNo":3947},{"no":744,"category":"건강·날씨","word":"恶心","pinyin":"ěxin","meaning":"구역질나다, 메스꺼움","example":"他因为晕车而感到恶心。","examplePinyin":"Tā yīnwèi yùnchē ér gǎndào ěxin.","translation":"그는 차멀미 때문에 메스꺼움을 느꼈어요.","sourceNo":3948},{"no":745,"category":"건강·날씨","word":"发病","pinyin":"fābìng","meaning":"병이 나다, 발병하다","example":"长期压力过大可能增加发病的风险。","examplePinyin":"Chángqī yālì guo dà kěnéng zēngjiā fābìng de fēngxiǎn.","translation":"오랫동안 스트레스가 지나치게 크면 발병 위험이 높아질 수 있어요.","sourceNo":3949},{"no":746,"category":"건강·날씨","word":"发电","pinyin":"fādiàn","meaning":"전기를 생산하다; 발전하다","example":"这座水电站的发电量足以满足附近居民的用电需求。","examplePinyin":"Zhè zuò shuǐdiànzhàn de fādiànliàng zúyǐ mǎnzú fùjìn jūmín de yòngdiàn xūqiú.","translation":"이 수력 발전소의 발전량은 인근 주민의 전력 수요를 충족하기에 충분해요.","sourceNo":3951},{"no":747,"category":"건강·날씨","word":"防治","pinyin":"fángzhì","meaning":"방지하다, 예방하다","example":"加强污染防治是保护环境的重要措施。","examplePinyin":"Jiāqiáng wūrǎn fángzhì shì bǎohù huánjìng de zhòngyào cuòshī.","translation":"오염 예방 및 통제를 강화하는 것은 환경을 보호하기 위한 중요한 조치입니다.","sourceNo":3968},{"no":748,"category":"건강·날씨","word":"繁殖","pinyin":"fánzhí","meaning":"번식하다, 증식하다","example":"春天是万物繁殖的季节。","examplePinyin":"Chūntiān shì wànwù fánzhí de jìjié.","translation":"봄은 만물이 번식하는 계절이다.","sourceNo":3973},{"no":749,"category":"건강·날씨","word":"发炎","pinyin":"fāyán","meaning":"염증, 발병","example":"他因为感冒，喉咙发炎了。","examplePinyin":"Tā yīnwèi gǎnmào, hóulóng fāyán le.","translation":"그는 감기로 인후염에 걸렸습니다.","sourceNo":3976},{"no":750,"category":"건강·날씨","word":"发育","pinyin":"fāyù","meaning":"발육하다, 성장하다","example":"良好的饮食营养有助于儿童的发育。","examplePinyin":"Liánghǎo de yǐnshí yíngyǎng yǒuzhùyú értóng de fāyù.","translation":"좋은 영양 섭취는 아이들의 발달에 도움이 됩니다.","sourceNo":3977},{"no":751,"category":"건강·날씨","word":"肺","pinyin":"fèi","meaning":"폐, 허파","example":"吸烟对肺的伤害很大，容易导致肺癌。","examplePinyin":"Xīyān duì fèi de shānghài hěn dà, róngyì dǎozhì fèi'ái.","translation":"흡연은 폐에 매우 해롭고 쉽게 폐암으로 이어질 수 있습니다.","sourceNo":3979},{"no":752,"category":"건강·날씨","word":"肥胖","pinyin":"féipàng","meaning":"비만, 뚱뚱하다","example":"现代人普遍面临肥胖问题，要多运动。","examplePinyin":"Xiàndàirén pǔbiàn miànlín féipàng wèntí, yào duō yùndòng.","translation":"현대인들은 일반적으로 비만 문제에 직면해 있으므로 운동을 더 많이 해야 합니다.","sourceNo":3980},{"no":753,"category":"건강·날씨","word":"肥沃","pinyin":"féiwò","meaning":"비옥하다, 기름지다","example":"这片土地非常肥沃，适合种植庄稼。","examplePinyin":"Zhè piàn tǔdì fēicháng féiwò, shìhé zhòngzhí zhuāngjia.","translation":"땅은 매우 비옥하여 농작물 재배에 적합합니다.","sourceNo":3982},{"no":754,"category":"건강·날씨","word":"肺炎","pinyin":"fèiyán","meaning":"폐렴, 폐염","example":"他因为肺炎住院了，需要休养。","examplePinyin":"Tā yīnwèi fèiyán zhùyuàn le, xūyào xiūyǎng.","translation":"그는 폐렴으로 입원해 회복이 필요했다.","sourceNo":3983},{"no":755,"category":"건강·날씨","word":"风光","pinyin":"fēngguāng","meaning":"풍경, 경치","example":"这座城市的风光非常秀丽，吸引了许多游客。","examplePinyin":"Zhè zuò chéngshì de fēngguāng fēicháng xiùlì, xīyǐn le xǔduō yóukè.","translation":"도시의 풍경은 매우 아름답고 많은 관광객을 끌어 모으고 있습니다.","sourceNo":3986},{"no":756,"category":"건강·날씨","word":"风力","pinyin":"fēnglì","meaning":"풍력, 바람의 힘","example":"今天风很大，风力有六七级。","examplePinyin":"Jīntiān fēng hěn dà, fēnglì yǒu liùqī jí.","translation":"오늘은 바람이 강하며 풍력은 6~7등급이에요.","sourceNo":3987},{"no":757,"category":"건강·날씨","word":"丰收","pinyin":"fēngshōu","meaning":"풍작, 풍년","example":"今年是一个丰收年，农民们脸上洋溢着喜悦。","examplePinyin":"Jīnnián shì yí ge fēngshōu nián, nóngmínmen liǎnshàng yángyìzhe xǐyuè.","translation":"올해는 풍년이다. 농부들의 얼굴에는 기쁨이 가득하다.","sourceNo":3989},{"no":758,"category":"건강·날씨","word":"风雨","pinyin":"fēngyǔ","meaning":"풍우, 비바람","example":"他经历了人生的风风雨雨，变得更加坚强了。","examplePinyin":"Tā jīnglì le rénshēng de fēng fēngyǔ yǔ, biànde gèngjiā jiānqiáng le.","translation":"그는 삶의 우여곡절을 경험했고 더욱 강해졌습니다.","sourceNo":3991},{"no":759,"category":"건강·날씨","word":"服用","pinyin":"fúyòng","meaning":"복용하다, 먹다","example":"这种药一天服用三次，饭后半小时吃。","examplePinyin":"Zhè zhǒng yào yì tiān fúyòng sān cì, fànhòu bàn xiǎoshí chī.","translation":"이 약은 하루 3번, 식후 30분에 복용합니다.","sourceNo":4009},{"no":760,"category":"건강·날씨","word":"肝","pinyin":"gān","meaning":"간(肝)","example":"喝酒伤肝，要注意适度饮酒。","examplePinyin":"Hējiǔ shāng gān, yào zhùyì shìdù yǐnjiǔ.","translation":"술을 마시면 간에 손상을 줄 수 있으므로 적당한 음주에 주의하세요.","sourceNo":4017},{"no":761,"category":"건강·날씨","word":"干旱","pinyin":"gānhàn","meaning":"가뭄, 건조","example":"今年夏天特别干旱，庄稼都缺水了。","examplePinyin":"Jīnnián xiàtiān tèbié gānhàn, zhuāngjia dōu quēshuǐ le.","translation":"올 여름은 유난히 건조해 농작물에 물이 부족했습니다.","sourceNo":4023},{"no":762,"category":"건강·날씨","word":"感染","pinyin":"gǎnrǎn","meaning":"감염, 전염","example":"这次感染来得很突然，要小心。","examplePinyin":"Zhè cì gǎnrǎn láide hěn tūrán, yào xiǎoxīn.","translation":"이번 감염은 매우 갑작스럽게 발생하므로 주의하시기 바랍니다.","sourceNo":4026},{"no":763,"category":"건강·날씨","word":"干燥","pinyin":"gānzào","meaning":"건조하다, 마르다","example":"这种水果在干燥的气候下也能生长得很好。","examplePinyin":"Zhè zhǒng shuǐguǒ zài gānzào de qìhòu xià yě néng shēngzhǎng de hěn hǎo.","translation":"이 과일은 건조한 기후에서도 잘 자랍니다.","sourceNo":4029},{"no":764,"category":"건강·날씨","word":"高原","pinyin":"gāoyuán","meaning":"고원","example":"青藏高原是世界上海拔最高的高原。","examplePinyin":"Qīngcáng gāoyuán shì shìjiè shàng hǎibá zuìgāo de gāoyuán.","translation":"티베트 고원은 세계에서 가장 높은 고원이다.","sourceNo":4039},{"no":765,"category":"건강·날씨","word":"沟","pinyin":"gōu","meaning":"도랑, 개천","example":"雨水顺着水沟流进了河里。","examplePinyin":"Yǔshuǐ shùnzhe shuǐgōu liú jìn le hélǐ.","translation":"빗물은 도랑을 따라 강으로 흘러 들어갔습니다.","sourceNo":4070},{"no":766,"category":"건강·날씨","word":"骨头","pinyin":"gǔtou","meaning":"뼈","example":"家里的小狗最喜欢啃骨头玩。","examplePinyin":"Jiālǐ de xiǎogǒu zuì xǐhuan kěngǔtou wán.","translation":"집에 있는 강아지는 뼈를 씹는 것을 좋아합니다.","sourceNo":4112},{"no":767,"category":"건강·날씨","word":"害","pinyin":"hài","meaning":"해, 해악 / 해치다","example":"医生提醒大家吸烟对身体有害。","examplePinyin":"Yīshēng tíxǐng dàjiā xīyān duì shēntǐ yǒuhài.","translation":"의사들은 흡연이 신체에 해롭다는 점을 모든 사람에게 상기시킵니다.","sourceNo":4116},{"no":768,"category":"건강·날씨","word":"旱灾","pinyin":"hànzāi","meaning":"가뭄 재해","example":"去年这个地区曾发生过严重旱灾。","examplePinyin":"Qùnián zhè ge dìqū céng fāshēng guo yánzhòng hànzāi.","translation":"지난해 이 지역에는 극심한 가뭄이 들었다.","sourceNo":4126},{"no":769,"category":"건강·날씨","word":"洪水","pinyin":"hóngshuǐ","meaning":"홍수","example":"去年夏天，这座城市曾发生严重洪水。","examplePinyin":"Qùnián xiàtiān, zhè zuò chéngshì céng fāshēng yánzhòng hóngshuǐ.","translation":"지난여름 이 도시에 심각한 홍수가 났어요.","sourceNo":4150},{"no":770,"category":"건강·날씨","word":"花朵","pinyin":"huāduǒ","meaning":"꽃송이","example":"这个季节，花园里到处开满了花朵。","examplePinyin":"Zhè ge jìjié, huāyuánlǐ dàochù kāi mǎn le huāduǒ.","translation":"이번 시즌에는 정원이 꽃으로 가득합니다.","sourceNo":4160},{"no":771,"category":"건강·날씨","word":"怀孕","pinyin":"huáiyùn","meaning":"임신하다","example":"她怀孕之后，家人都特别照顾她。","examplePinyin":"Tā huáiyùn zhīhòu, jiārén dōu tèbié zhàogu tā.","translation":"그녀가 임신한 뒤 가족들은 각별히 보살펴 주었어요.","sourceNo":4164},{"no":772,"category":"건강·날씨","word":"患","pinyin":"huàn","meaning":"(병 등에) 걸리다","example":"他不幸患了一种非常严重的疾病。","examplePinyin":"Tā búxìng huàn le yì zhǒng fēicháng yánzhòng de jíbìng.","translation":"불행하게도 그는 매우 심각한 질병을 앓고 있었습니다.","sourceNo":4166},{"no":773,"category":"건강·날씨","word":"患者","pinyin":"huànzhě","meaning":"환자","example":"医院里住着许多需要照顾的患者。","examplePinyin":"Yīyuàn lǐ zhù zhe xǔduō xūyào zhàogu de huànzhě.","translation":"병원에는 치료가 필요한 환자가 많이 있습니다.","sourceNo":4172},{"no":774,"category":"건강·날씨","word":"化石","pinyin":"huàshí","meaning":"화석","example":"科学家在博物馆展出了恐龙化石。","examplePinyin":"Kēxuéjiā zài bówùguǎn zhǎnchū le kǒnglóng huàshí.","translation":"과학자들이 박물관에 공룡 화석을 전시하고 있습니다.","sourceNo":4174},{"no":775,"category":"건강·날씨","word":"火灾","pinyin":"huǒzāi","meaning":"화재","example":"上个月，这一带发生了一场严重火灾。","examplePinyin":"Shànggeyuè, zhè yídài fāshēng le yì chǎng yánzhòng huǒzāi.","translation":"지난 달 이 지역에서 심각한 화재가 발생했습니다.","sourceNo":4199},{"no":776,"category":"건강·날씨","word":"胡子","pinyin":"húzi","meaning":"수염","example":"他年纪虽然不大，却已经留起了胡子。","examplePinyin":"Tā niánjì suīrán búdà, què yǐjīng liú qǐ le húzi.","translation":"그는 나이가 많지 않은데도 벌써 수염을 기르고 있어요.","sourceNo":4201},{"no":777,"category":"건강·날씨","word":"肩膀","pinyin":"jiānbǎng","meaning":"어깨","example":"他常年锻炼，肩膀显得又宽又厚实。","examplePinyin":"Tā chángnián duànliàn, jiānbǎng xiǎnde yòu kuān yòu hòushí.","translation":"그는 1년 내내 운동을 해서 어깨가 넓고 두꺼워 보였다.","sourceNo":4212},{"no":778,"category":"건강·날씨","word":"监测","pinyin":"jiāncè","meaning":"모니터링하다, 감측하다","example":"环保部门正在持续监测空气质量。","examplePinyin":"Huánbǎo bùmén zhèngzài chíxù jiāncè kōngqì zhìliàng.","translation":"환경 보호 부서는 대기 질을 지속적으로 모니터링하고 있습니다.","sourceNo":4214},{"no":779,"category":"건강·날씨","word":"饥饿","pinyin":"jī'è","meaning":"굶주리다","example":"由于长时间没有进食，他感到十分饥饿。","examplePinyin":"Yóuyú chángshíjiān méiyǒu jìnshí, tā gǎndào shífēn jī'è.","translation":"그는 오랫동안 아무것도 먹지 않았기 때문에 매우 배가 고팠습니다.","sourceNo":4263},{"no":780,"category":"건강·날씨","word":"节能","pinyin":"jiénéng","meaning":"에너지를 절약하다","example":"为了保护地球，我们要节能减排、爱护环境。","examplePinyin":"Wèile bǎohù dìqiú, wǒmen yào jiénéng jiǎnpái, àihù huánjìng.","translation":"지구를 보호하기 위해 우리는 에너지를 절약하고 배출량을 줄이며 환경을 보호해야 합니다.","sourceNo":4271},{"no":781,"category":"건강·날씨","word":"急救","pinyin":"jíjiù","meaning":"응급 처치하다","example":"急救人员正在争分夺秒地抢救病人。","examplePinyin":"Jíjiù rényuán zhèngzài zhēng fēn duó miǎo de qiǎngjiù bìngrén.","translation":"최초 대응자들은 환자를 구하기 위해 시간을 다투고 있습니다.","sourceNo":4283},{"no":782,"category":"건강·날씨","word":"景观","pinyin":"jǐngguān","meaning":"경관","example":"这座城市的夜间景观十分美丽壮观。","examplePinyin":"Zhè zuò chéngshì de yèjiān jǐngguān shífēn měilì zhuàngguān.","translation":"도시의 야경은 매우 아름답고 장관입니다.","sourceNo":4295},{"no":783,"category":"건강·날씨","word":"景象","pinyin":"jǐngxiàng","meaning":"경관, 광경","example":"眼前这幅丰收的景象让人格外欣喜。","examplePinyin":"Yǎnqián zhè fú fēngshōu de jǐngxiàng ràng rén géwài xīnxǐ.","translation":"우리 앞에 있는 이번 수확의 광경은 특히나 흐뭇합니다.","sourceNo":4303},{"no":784,"category":"건강·날씨","word":"颈椎","pinyin":"jǐngzhuī","meaning":"경추","example":"长时间低头看手机容易伤害颈椎。","examplePinyin":"Chángshíjiān dītóu kàn shǒujī róngyì shānghài jǐngzhuī.","translation":"오랫동안 휴대폰을 내려다보는 것은 경추를 쉽게 손상시킬 수 있습니다.","sourceNo":4307},{"no":785,"category":"건강·날씨","word":"进化","pinyin":"jìnhuà","meaning":"진화하다","example":"生物在漫长的岁月中不断进化演变。","examplePinyin":"Shēngwù zài màncháng de suìyuè zhōng búduàn jìnhuà yǎnbiàn.","translation":"생물은 시간이 지남에 따라 진화했습니다.","sourceNo":4309},{"no":786,"category":"건강·날씨","word":"近视","pinyin":"jìnshì","meaning":"근시이다","example":"长期用眼过度容易导致孩子近视。","examplePinyin":"Chángqī yòng yǎn guòdù róngyì dǎozhì háizi jìnshì.","translation":"장기간 눈을 과도하게 사용하면 어린이의 근시로 쉽게 이어질 수 있습니다.","sourceNo":4314},{"no":787,"category":"건강·날씨","word":"酒精","pinyin":"jiǔjīng","meaning":"알코올","example":"医生用酒精给伤口进行了消毒。","examplePinyin":"Yīshēng yòng jiǔjīng gěi shāngkǒu jìnxíng le xiāodú.","translation":"의사는 알코올로 상처를 소독했다.","sourceNo":4324},{"no":788,"category":"건강·날씨","word":"救命","pinyin":"jiùmìng","meaning":"목숨을 구하다, 살려주세요","example":"遇到危险时，他大声呼喊救命。","examplePinyin":"Yùdào wēixiǎn shí, tā dàshēng hūhǎn jiùmìng.","translation":"위험에 처하자 그는 큰 소리로 살려 달라고 외쳤어요.","sourceNo":4326},{"no":789,"category":"건강·날씨","word":"基因","pinyin":"jīyīn","meaning":"유전자","example":"科学家正在研究这种疾病的基因。","examplePinyin":"Kēxuéjiā zhèngzài yánjiū zhè zhǒng jíbìng de jīyīn.","translation":"과학자들은 질병의 유전자를 연구하고 있습니다.","sourceNo":4337},{"no":790,"category":"건강·날씨","word":"菊花","pinyin":"júhuā","meaning":"국화","example":"秋天来了，公园里的菊花竞相开放。","examplePinyin":"Qiūtiān lái le, gōngyuán lǐ de júhuā jìngxiāng kāifàng.","translation":"가을이 왔습니다. 공원에는 국화가 피어 있습니다.","sourceNo":4351},{"no":791,"category":"건강·날씨","word":"康复","pinyin":"kāngfù","meaning":"회복하다","example":"经过治疗，他的身体正在逐渐康复。","examplePinyin":"Jīngguò zhìliáo, tā de shēntǐ zhèngzài zhújiàn kāngfù.","translation":"치료 후 그의 몸은 점차 회복되고 있다.","sourceNo":4369},{"no":792,"category":"건강·날씨","word":"口腔","pinyin":"kǒuqiāng","meaning":"구강","example":"每天刷牙有助于保持口腔健康。","examplePinyin":"Měi tiān shuāyá yǒuzhùyú bǎochí kǒuqiāng jiànkāng.","translation":"매일 양치질을 하면 입을 건강하게 유지하는 데 도움이 됩니다.","sourceNo":4396},{"no":793,"category":"건강·날씨","word":"狼","pinyin":"láng","meaning":"늑대","example":"传说这片森林里曾经出没过狼。","examplePinyin":"Chuánshuō zhè piàn sēnlín lǐ céngjīng chūmò guo láng.","translation":"전설에 따르면 한때 늑대가 이 숲을 돌아다녔다고 합니다.","sourceNo":4419},{"no":794,"category":"건강·날씨","word":"兰花","pinyin":"lánhuā","meaning":"난초","example":"他在阳台上精心养了很多兰花。","examplePinyin":"Tā zài yángtái shàng jīngxīn yǎng le hěn duō lánhuā.","translation":"그는 발코니에서 많은 난초를 조심스럽게 재배했습니다.","sourceNo":4421},{"no":795,"category":"건강·날씨","word":"老鼠","pinyin":"lǎoshǔ","meaning":"쥐","example":"家里最近发现了几只老鼠。","examplePinyin":"Jiālǐ zuìjìn fāxiàn le jǐ zhī lǎoshǔ.","translation":"최근 집에서 쥐 여러 마리를 발견했습니다.","sourceNo":4425},{"no":796,"category":"건강·날씨","word":"雷","pinyin":"léi","meaning":"천둥","example":"昨天夜里外面一直在打雷下雨。","examplePinyin":"Zuótiān yèli wàimiàn yìzhí zài dǎléi xiàyǔ.","translation":"어젯밤 밖에는 천둥이 치고 비가 내렸다.","sourceNo":4427},{"no":797,"category":"건강·날씨","word":"露1","pinyin":"lù","meaning":"이슬","example":"清晨的草叶上挂满了晶莹的露珠。","examplePinyin":"Qīngchén de cǎoyè shàng guàmǎn le jīngyíng de lùzhū.","translation":"이른 아침 풀잎에 맑은 이슬이 가득 맺혔어요.","sourceNo":4463},{"no":798,"category":"건강·날씨","word":"绿化","pinyin":"lǜhuà","meaning":"녹화하다","example":"政府正在大力推进城市绿化建设。","examplePinyin":"Zhèngfǔ zhèngzài dàlì tuījìn chéngshì lǜhuà jiànshè.","translation":"정부에서는 도시녹화를 적극 추진하고 있습니다.","sourceNo":4467},{"no":799,"category":"건강·날씨","word":"蚂蚁","pinyin":"mǎyǐ","meaning":"개미","example":"一群小蚂蚁正忙着搬运食物回巢。","examplePinyin":"Yì qún xiǎo mǎyǐ zhèngmángzhe bānyùn shíwù huí cháo.","translation":"개미 떼가 먹이를 자신의 둥지로 나르느라 분주합니다.","sourceNo":4495},{"no":800,"category":"건강·날씨","word":"煤","pinyin":"méi","meaning":"석탄","example":"这个地区蕴藏着丰富的煤炭资源。","examplePinyin":"Zhè ge dìqū yùncáng zhe fēngfù de méitàn zīyuán.","translation":"이 지역은 석탄자원이 풍부하다.","sourceNo":4496},{"no":801,"category":"건강·날씨","word":"梅花","pinyin":"méihuā","meaning":"매화","example":"严冬时节，公园里的梅花竞相开放。","examplePinyin":"Yándōng shíjié, gōngyuán lǐ de méihuā jìngxiāng kāifàng.","translation":"추운 겨울이면 공원에 매화가 피어납니다.","sourceNo":4498},{"no":802,"category":"건강·날씨","word":"眉毛","pinyin":"méimao","meaning":"눈썹","example":"她精心修剪了自己的眉毛形状。","examplePinyin":"Tā jīngxīn xiūjiǎn le zìjǐ de méimao xíngzhuàng.","translation":"그녀는 자신의 눈썹 모양을 정성껏 다듬었어요.","sourceNo":4499},{"no":803,"category":"건강·날씨","word":"面部","pinyin":"miànbù","meaning":"얼굴, 안면","example":"医生仔细检查了他的面部伤口。","examplePinyin":"Yīshēng zǐxì jiǎnchá le tā de miànbù shāngkǒu.","translation":"의사들은 그의 얼굴 상처를 주의 깊게 검사했습니다.","sourceNo":4503},{"no":804,"category":"건강·날씨","word":"免疫","pinyin":"miǎnyì","meaning":"면역되다","example":"接种疫苗能够增强身体的免疫力。","examplePinyin":"Jiēzhǒng yìmiáo nénggòu zēngqiáng shēntǐ de miǎnyìlì.","translation":"예방접종을 하면 신체의 면역력이 강화될 수 있습니다.","sourceNo":4507},{"no":805,"category":"건강·날씨","word":"蜜蜂","pinyin":"mìfēng","meaning":"꿀벌","example":"春天到了，蜜蜂在花丛中忙碌采蜜。","examplePinyin":"Chūntiān dào le, mìfēng zài huācóng zhōng mánglù cǎi mì.","translation":"봄이 왔고, 벌들은 꽃에서 꿀을 모으느라 분주합니다.","sourceNo":4515},{"no":806,"category":"건강·날씨","word":"脑袋","pinyin":"nǎodai","meaning":"머리","example":"他不小心撞到了门框，磕破了脑袋。","examplePinyin":"Tā bù xiǎoxīn zhuàng dào le ménkuāng, kēpò le nǎodai.","translation":"그는 실수로 문틀에 부딪혀 머리에 상처가 났어요.","sourceNo":4547},{"no":807,"category":"건강·날씨","word":"脑子","pinyin":"nǎozi","meaning":"두뇌","example":"他脑子转得很快，反应十分敏捷。","examplePinyin":"Tā nǎozi zhuǎn de hěn kuài, fǎnyìng shífēn mǐnjié.","translation":"그는 머리 회전이 빨라 반응이 아주 민첩해요.","sourceNo":4548},{"no":808,"category":"건강·날씨","word":"内科","pinyin":"nèikē","meaning":"내과","example":"他因为发烧不退，去医院看了内科。","examplePinyin":"Tā yīnwèi fāshāo bú tuì, qù yīyuàn kàn le nèikē.","translation":"열이 내리지 않아 그는 병원 내과에 갔어요.","sourceNo":4550},{"no":809,"category":"건강·날씨","word":"能量","pinyin":"néngliàng","meaning":"에너지","example":"太阳每天为地球提供大量能量。","examplePinyin":"Tàiyáng měi tiān wèi dìqiú tígōng dàliàng néngliàng.","translation":"태양은 매일 지구에 많은 양의 에너지를 제공합니다.","sourceNo":4553},{"no":810,"category":"건강·날씨","word":"能源","pinyin":"néngyuán","meaning":"에너지 자원","example":"我们应该积极开发利用清洁能源。","examplePinyin":"Wǒmen yīnggāi jījí kāifā lìyòng qīngjié néngyuán.","translation":"청정에너지를 적극적으로 개발하고 활용해야 합니다.","sourceNo":4554},{"no":811,"category":"건강·날씨","word":"泥","pinyin":"ní","meaning":"진흙","example":"下雨过后，田间小路上到处都是泥。","examplePinyin":"Xiàyǔ guòhòu, tiánjiān xiǎo lùshang dàochù dōu shì ní.","translation":"비가 온 뒤 들판길은 진흙으로 가득 차 있었다.","sourceNo":4555},{"no":812,"category":"건강·날씨","word":"农田","pinyin":"nóngtián","meaning":"농지","example":"春天到了，农民们在农田里辛勤耕作。","examplePinyin":"Chūntiān dào le, nóngmínmen zài nóngtián lǐ xīnqín gēngzuò.","translation":"봄이 오자 농민들이 농지에서 부지런히 농사를 지어요.","sourceNo":4562},{"no":813,"category":"건강·날씨","word":"暖","pinyin":"nuǎn","meaning":"따뜻하다 / 따뜻하게 하다","example":"春天来临，天气渐渐变得温暖起来。","examplePinyin":"Chūntiān láilín, tiānqì jiànjiàn biànde wēnnuǎn qǐlai.","translation":"봄이 다가오고 날씨도 점차 따뜻해지고 있습니다.","sourceNo":4563},{"no":814,"category":"건강·날씨","word":"排放","pinyin":"páifàng","meaning":"배출하다","example":"工厂必须严格控制污水的排放量。","examplePinyin":"Gōngchǎng bìxū yángé kòngzhì wūshuǐ de páifàngliàng.","translation":"공장에서는 하수 배출을 엄격하게 통제해야 합니다.","sourceNo":4567},{"no":815,"category":"건강·날씨","word":"疲劳","pinyin":"píláo","meaning":"피곤하다","example":"长时间开车让他感到浑身疲劳。","examplePinyin":"Chángshíjiān kāichē ràng tā gǎndào húnshēn píláo.","translation":"장거리 운전으로 인해 그는 피곤함을 느꼈다.","sourceNo":4591},{"no":816,"category":"건강·날씨","word":"坡","pinyin":"pō","meaning":"비탈, 언덕","example":"他推着自行车艰难地爬上一道陡坡。","examplePinyin":"Tā tuī zhe zìxíngchē jiānnán de pá shàng yí dào dǒupō.","translation":"그는 자전거를 세게 밀고 가파른 경사면을 올라갔습니다.","sourceNo":4604},{"no":817,"category":"건강·날씨","word":"强壮","pinyin":"qiángzhuàng","meaning":"건장하다 / 강하게 하다","example":"长期锻炼让他的身体变得十分强壮。","examplePinyin":"Chángqī duànliàn ràng tā de shēntǐ biànde shífēn qiángzhuàng.","translation":"장기간의 운동으로 그의 몸은 매우 강해졌습니다.","sourceNo":4619},{"no":818,"category":"건강·날씨","word":"晴朗","pinyin":"qínglǎng","meaning":"맑고 쾌청하다","example":"今天天气晴朗，非常适合出门郊游。","examplePinyin":"Jīntiān tiānqì qínglǎng, fēicháng shìhé chūmén jiāoyóu.","translation":"오늘은 날씨가 화창해서 나들이하기 딱 좋아요.","sourceNo":4645},{"no":819,"category":"건강·날씨","word":"气体","pinyin":"qìtǐ","meaning":"기체","example":"实验室里存放着几种不同的气体。","examplePinyin":"Shíyànshì lǐ cúnfàng zhe jǐ zhǒng bùtóng de qìtǐ.","translation":"실험실에는 여러 가지 다른 가스가 저장되어 있습니다.","sourceNo":4661},{"no":820,"category":"건강·날씨","word":"嗓子","pinyin":"sǎngzi","meaning":"목소리, 목구멍","example":"唱了一整晚的歌，他的嗓子都哑了。","examplePinyin":"Chàng le yì zhěngwǎn de gē, tā de sǎngzi dōu yǎ le.","translation":"밤새도록 노래를 부르고 나면 목소리가 쉬어졌다.","sourceNo":4730},{"no":821,"category":"건강·날씨","word":"闪电","pinyin":"shǎndiàn","meaning":"번개","example":"一道闪电划破了漆黑的夜空。","examplePinyin":"Yí dào shǎndiàn huàpò le qīhēi de yèkōng.","translation":"어두운 밤하늘에 번개가 쳤다.","sourceNo":4738},{"no":822,"category":"건강·날씨","word":"山顶","pinyin":"shāndǐng","meaning":"산꼭대기","example":"经过一整天攀爬，他们终于登上山顶。","examplePinyin":"Jīngguò yìzhěngtiān pānpá, tāmen zhōngyú dēngshàng shāndǐng.","translation":"하루 종일 산을 오른 끝에 드디어 산 정상에 도착했습니다.","sourceNo":4739},{"no":823,"category":"건강·날씨","word":"山峰","pinyin":"shānfēng","meaning":"산봉우리","example":"远处那座高耸的山峰终年积雪。","examplePinyin":"Yuǎnchù nà zuò gāosǒng de shānfēng zhōngnián jīxuě.","translation":"멀리 우뚝 솟은 봉우리는 일년 내내 눈으로 덮여 있습니다.","sourceNo":4740},{"no":824,"category":"건강·날씨","word":"伤口","pinyin":"shāngkǒu","meaning":"상처","example":"医生仔细为病人的伤口进行了包扎。","examplePinyin":"Yīshēng zǐxì wèi bìngrén de shāngkǒu jìnxíng le bāozā.","translation":"의사는 환자의 상처에 조심스럽게 붕대를 감아주었다.","sourceNo":4745},{"no":825,"category":"건강·날씨","word":"伤亡","pinyin":"shāngwáng","meaning":"사상하다 / 사상자","example":"这场突如其来的地震造成了不少伤亡。","examplePinyin":"Zhè chǎng tū rú qí lái de dìzhèn zàochéng le bùshǎo shāngwáng.","translation":"이번 지진으로 많은 인명 피해가 발생했습니다.","sourceNo":4749},{"no":826,"category":"건강·날씨","word":"伤员","pinyin":"shāngyuán","meaning":"부상자","example":"医护人员正在紧张地抢救伤员。","examplePinyin":"Yīhù rényuán zhèngzài jǐnzhāng de qiǎngjiù shāngyuán.","translation":"의료진이 부상자를 구하려고 긴박하게 움직이고 있어요.","sourceNo":4751},{"no":827,"category":"건강·날씨","word":"山坡","pinyin":"shānpō","meaning":"산비탈","example":"春天时分，山坡上开满了各色野花。","examplePinyin":"Chūntiān shífēn, shānpō shàng kāi mǎn le gèsè yěhuā.","translation":"봄에는 언덕이 온갖 색의 야생화로 뒤덮입니다.","sourceNo":4752},{"no":828,"category":"건강·날씨","word":"鲨鱼","pinyin":"shāyú","meaning":"상어","example":"深海里生活着各种凶猛的鲨鱼。","examplePinyin":"Shēnhǎi lǐ shēnghuó zhe gèzhǒng xiōngměng de shāyú.","translation":"심해에는 다양한 사나운 상어가 살고 있습니다.","sourceNo":4754},{"no":829,"category":"건강·날씨","word":"生命力","pinyin":"shēngmìnglì","meaning":"생명력","example":"这种沙漠植物拥有极其顽强的生命力。","examplePinyin":"Zhè zhǒng shāmò zhíwù yōngyǒu jíqí wánqiáng de shēngmìnglì.","translation":"이 사막 식물은 매우 강인한 생명력을 가지고 있습니다.","sourceNo":4763},{"no":830,"category":"건강·날씨","word":"生态","pinyin":"shēngtài","meaning":"생태","example":"保护生态环境是我们共同的责任。","examplePinyin":"Bǎohù shēngtài huánjìng shì wǒmen gòngtóng de zérèn.","translation":"생태환경을 보호하는 것은 우리의 공동 책임입니다.","sourceNo":4764},{"no":831,"category":"건강·날씨","word":"神经","pinyin":"shénjīng","meaning":"신경","example":"长期紧张会导致人的神经十分敏感。","examplePinyin":"Chángqī jǐnzhāng huì dǎozhì rén de shénjīng shífēn mǐngǎn.","translation":"장기적인 스트레스는 사람들의 신경을 매우 민감하게 만들 수 있습니다.","sourceNo":4767},{"no":832,"category":"건강·날씨","word":"身心","pinyin":"shēnxīn","meaning":"심신","example":"坚持锻炼能够让人身心都变得健康。","examplePinyin":"Jiānchí duànliàn nénggòu ràng rén shēnxīn dōu biànde jiànkāng.","translation":"꾸준한 운동은 사람들을 육체적으로나 정신적으로 건강하게 만들 수 있습니다.","sourceNo":4770},{"no":833,"category":"건강·날씨","word":"舌头","pinyin":"shétou","meaning":"혀","example":"医生检查了他红肿发炎的舌头。","examplePinyin":"Yīshēng jiǎnchá le tā hóngzhǒng fāyán de shétou.","translation":"의사는 그의 붉고 부어오르고 염증이 생긴 혀를 검사했습니다.","sourceNo":4772},{"no":834,"category":"건강·날씨","word":"湿度","pinyin":"shīdù","meaning":"습도","example":"这台仪器能够精确检测空气湿度。","examplePinyin":"Zhè tái yíqì nénggòu jīngquè jiǎncè kōngqì shīdù.","translation":"이 장비는 공기의 습도를 정확하게 감지합니다.","sourceNo":4782},{"no":835,"category":"건강·날씨","word":"视觉","pinyin":"shìjué","meaning":"시각","example":"这部电影的画面带来了强烈的视觉冲击。","examplePinyin":"Zhè bù diànyǐng de huàmiàn dàilái le qiángliè de shìjué chōngjī.","translation":"이 영화의 이미지는 강렬한 시각적 충격을 가져온다.","sourceNo":4793},{"no":836,"category":"건강·날씨","word":"视力","pinyin":"shìlì","meaning":"시력","example":"长期熬夜用眼容易造成视力下降。","examplePinyin":"Chángqī áoyè yòng yǎn róngyì zàochéng shìlì xiàjiàng.","translation":"오랫동안 늦게까지 깨어 있으면 시력이 손상되기 쉽습니다.","sourceNo":4795},{"no":837,"category":"건강·날씨","word":"石油","pinyin":"shíyóu","meaning":"석유","example":"这个国家依靠丰富的石油资源发展经济。","examplePinyin":"Zhè ge guójiā yīkào fēngfù de shíyóu zīyuán fāzhǎn jīngjì.","translation":"국가는 경제 발전을 위해 풍부한 석유 자원에 의존합니다.","sourceNo":4803},{"no":838,"category":"건강·날씨","word":"狮子","pinyin":"shīzi","meaning":"사자","example":"动物园里的狮子每天都吸引很多游客。","examplePinyin":"Dòngwùyuán lǐ de shīzi měi tiān dōu xīyǐn hěn duō yóukè.","translation":"동물원의 사자들은 매일 많은 관광객을 끌어 모으고 있습니다.","sourceNo":4806},{"no":839,"category":"건강·날씨","word":"手臂","pinyin":"shǒubì","meaning":"팔","example":"长期锻炼让他的手臂变得十分有力。","examplePinyin":"Chángqī duànliàn ràng tā de shǒubì biànde shífēn yǒulì.","translation":"장기간의 운동으로 그의 팔은 매우 강해졌습니다.","sourceNo":4808},{"no":840,"category":"건강·날씨","word":"寿命","pinyin":"shòumìng","meaning":"수명","example":"良好的生活习惯可以延长人的寿命。","examplePinyin":"Liánghǎo de shēnghuó xíguàn kěyǐ yáncháng rén de shòumìng.","translation":"좋은 생활 습관은 사람들의 수명을 연장할 수 있습니다.","sourceNo":4812},{"no":841,"category":"건강·날씨","word":"受灾","pinyin":"shòuzāi","meaning":"재해를 입다","example":"政府迅速拨款援助受灾严重的地区。","examplePinyin":"Zhèngfǔ xùnsù bōkuǎn yuánzhù shòuzāi yánzhòng de dìqū.","translation":"정부는 피해가 심한 지역을 돕도록 신속히 자금을 배정했어요.","sourceNo":4817},{"no":842,"category":"건강·날씨","word":"衰老","pinyin":"shuāilǎo","meaning":"노쇠하다","example":"长期熬夜会加速人体衰老的过程。","examplePinyin":"Chángqī áoyè huì jiāsù réntǐ shuāilǎo de guòchéng.","translation":"오랫동안 늦게까지 깨어 있으면 인체의 노화 과정이 가속화됩니다.","sourceNo":4820},{"no":843,"category":"건강·날씨","word":"水稻","pinyin":"shuǐdào","meaning":"벼","example":"农民们正忙着在田里插秧种水稻。","examplePinyin":"Nóngmínmen zhèngmángzhe zài tiánlǐ chāyāng zhǒng shuǐdào.","translation":"농부들은 밭에 벼를 심느라 바쁘다.","sourceNo":4825},{"no":844,"category":"건강·날씨","word":"水库","pinyin":"shuǐkù","meaning":"저수지","example":"这座水库为周边地区提供灌溉用水。","examplePinyin":"Zhè zuò shuǐkù wèi zhōubiān dìqū tígōng guàngài yòngshuǐ.","translation":"이 저수지는 주변 지역에 관개용수를 제공합니다.","sourceNo":4826},{"no":845,"category":"건강·날씨","word":"水流","pinyin":"shuǐliú","meaning":"물의 흐름, 수류","example":"暴雨过后，河道里的水流变得湍急。","examplePinyin":"Bàoyǔ guòhòu, hédào lǐ de shuǐliú biànde tuānjí.","translation":"폭우가 내린 후에는 강물이 거칠어집니다.","sourceNo":4827},{"no":846,"category":"건강·날씨","word":"水面","pinyin":"shuǐmiàn","meaning":"수면","example":"夕阳洒在平静的水面上，波光粼粼。","examplePinyin":"Xīyáng sǎ zài píngjìng de shuǐmiàn shàng, bōguāng línlín.","translation":"지는 해가 잔잔한 수면에 비쳐 물결이 반짝여요.","sourceNo":4828},{"no":847,"category":"건강·날씨","word":"死亡","pinyin":"sǐwáng","meaning":"사망하다","example":"这场重大车祸导致多人不幸死亡。","examplePinyin":"Zhè chǎng zhòngdà chēhuò dǎozhì duō rén búxìng sǐwáng.","translation":"이번 대형 교통사고는 많은 사람들의 비극적인 죽음을 가져왔습니다.","sourceNo":4841},{"no":848,"category":"건강·날씨","word":"损伤","pinyin":"sǔnshāng","meaning":"손상되다","example":"剧烈运动过后，他的膝盖受到了损伤。","examplePinyin":"Jùliè yùndòng guòhòu, tā de xīgài shòudào le sǔnshāng.","translation":"격렬한 운동을 한 후 무릎이 부상당했습니다.","sourceNo":4851},{"no":849,"category":"건강·날씨","word":"台风","pinyin":"táifēng","meaning":"태풍","example":"强台风即将登陆沿海城市，请注意防范。","examplePinyin":"Qiángtáifēng jíjiāng dēnglù yánhǎi chéngshì, qǐng zhùyì fángfàn.","translation":"해안 도시에는 강한 태풍이 상륙할 예정이오니, 주의하시기 바랍니다.","sourceNo":4856},{"no":850,"category":"건강·날씨","word":"太空","pinyin":"tàikōng","meaning":"우주","example":"宇航员乘坐飞船顺利进入太空探索。","examplePinyin":"Yǔhángyuán chéngzuò fēichuán shùnlì jìnrù tàikōng tànsuǒ.","translation":"우주 비행사들은 우주선을 타고 우주 탐사에 성공했습니다.","sourceNo":4857},{"no":851,"category":"건강·날씨","word":"太阳能","pinyin":"tàiyángnéng","meaning":"태양 에너지","example":"这栋建筑安装了先进的太阳能发电系统。","examplePinyin":"Zhè dòng jiànzhù ānzhuāng le xiānjìn de tàiyángnéng fādiàn xìtǒng.","translation":"건물에는 첨단 태양광 발전 시스템이 갖춰져 있습니다.","sourceNo":4859},{"no":852,"category":"건강·날씨","word":"田","pinyin":"tián","meaning":"밭, 논","example":"农民正在自家的田里忙着收割水稻。","examplePinyin":"Nóngmín zhèngzài zìjiā de tiánlǐ máng zhe shōugē shuǐdào.","translation":"농민들이 자기 논에서 벼를 거두느라 바빠요.","sourceNo":4881},{"no":853,"category":"건강·날씨","word":"天文","pinyin":"tiānwén","meaning":"천문","example":"他从小就对浩瀚的天文学充满兴趣。","examplePinyin":"Tā cóngxiǎo jiù duì hàohàn de tiānwénxué chōngmǎn xìngqù.","translation":"그는 어렸을 때부터 천문학의 광대함에 관심을 가져왔습니다.","sourceNo":4888},{"no":854,"category":"건강·날씨","word":"听觉","pinyin":"tīngjué","meaning":"청각","example":"有些动物的听觉比人类更加灵敏。","examplePinyin":"Yǒuxiē dòngwù de tīngjué bǐ rénlèi gèngjiā língmǐn.","translation":"어떤 동물은 사람보다 청각이 더 예민해요.","sourceNo":4898},{"no":855,"category":"건강·날씨","word":"头脑","pinyin":"tóunǎo","meaning":"두뇌","example":"遇事冷静，说明他头脑十分清醒。","examplePinyin":"Yùshì lěngjìng, shuōmíng tā tóunǎo shífēn qīngxǐng.","translation":"어려움에 직면했을 때 침착함을 유지하는 것은 그 사람이 매우 명석하다는 것을 보여줍니다.","sourceNo":4921},{"no":856,"category":"건강·날씨","word":"土壤","pinyin":"tǔrǎng","meaning":"토양","example":"这片土壤十分肥沃，适合种庄稼。","examplePinyin":"Zhè piàn tǔrǎng shífēn féiwò, shìhé zhǒng zhuāngjia.","translation":"토양은 매우 비옥하여 농작물 재배에 적합합니다.","sourceNo":4945},{"no":857,"category":"건강·날씨","word":"外科","pinyin":"wàikē","meaning":"외과","example":"医院外科正在为他安排手术治疗。","examplePinyin":"Yīyuàn wàikē zhèngzài wèi tā ānpái shǒushù zhìliáo.","translation":"병원 외과에서는 그를 위한 수술적 치료를 준비하고 있다.","sourceNo":4953},{"no":858,"category":"건강·날씨","word":"万物","pinyin":"wànwù","meaning":"만물","example":"春回大地，万物开始复苏生长。","examplePinyin":"Chūn huí dàdì, wànwù kāishǐ fùsū shēngzhǎng.","translation":"봄이 땅에 돌아오고, 모든 것이 살아나고 자라기 시작합니다.","sourceNo":4964},{"no":859,"category":"건강·날씨","word":"维生素","pinyin":"wéishēngsù","meaning":"비타민","example":"新鲜水果富含多种维生素成分。","examplePinyin":"Xīnxiān shuǐguǒ fùhán duōzhǒng wéishēngsù chéngfèn.","translation":"신선한 과일에는 많은 비타민이 풍부합니다.","sourceNo":4980},{"no":860,"category":"건강·날씨","word":"乌龟","pinyin":"wūguī","meaning":"거북이","example":"池塘里的乌龟正慢慢爬向岸边。","examplePinyin":"Chítáng lǐ de wūguī zhèng mànmàn pá xiàng ànbiān.","translation":"연못의 거북이가 물가를 향해 천천히 기어가요.","sourceNo":4995},{"no":861,"category":"건강·날씨","word":"污水","pinyin":"wūshuǐ","meaning":"오수","example":"工厂排放的污水污染了河流。","examplePinyin":"Gōngchǎng páifàng de wūshuǐ wūrǎn le héliú.","translation":"공장에서 배출되는 하수로 인해 강이 오염되었습니다.","sourceNo":4998},{"no":862,"category":"건강·날씨","word":"消毒","pinyin":"xiāodú","meaning":"소독하다","example":"医院每天都会对病房进行彻底消毒。","examplePinyin":"Yīyuàn měi tiān dōu huì duì bìngfáng jìnxíng chèdǐ xiāodú.","translation":"병원에서는 매일 병동을 철저히 소독하겠습니다.","sourceNo":5033},{"no":863,"category":"건강·날씨","word":"细胞","pinyin":"xìbāo","meaning":"세포","example":"人体是由无数细小的细胞组成的。","examplePinyin":"Réntǐ shì yóu wúshù xìxiǎo de xìbāo zǔchéng de.","translation":"인간의 몸은 무수히 많은 작은 세포로 구성되어 있습니다.","sourceNo":5044},{"no":864,"category":"건강·날씨","word":"细菌","pinyin":"xìjūn","meaning":"세균","example":"饭前洗手可以有效去除手上细菌。","examplePinyin":"Fàn qián xǐshǒu kěyǐ yǒuxiào qùchú shǒushàng xìjūn.","translation":"식사 전 손을 씻으면 손에 있는 박테리아를 효과적으로 제거할 수 있습니다.","sourceNo":5052},{"no":865,"category":"건강·날씨","word":"新能源","pinyin":"xīnnéngyuán","meaning":"신에너지","example":"政府大力支持新能源汽车产业发展。","examplePinyin":"Zhèngfǔ dàlì zhīchí xīnnéngyuán qìchē chǎnyè fāzhǎn.","translation":"정부는 신에너지 자동차 산업의 발전을 강력히 지원하고 있습니다.","sourceNo":5066},{"no":866,"category":"건강·날씨","word":"心脏","pinyin":"xīnzàng","meaning":"심장","example":"医生仔细检查了他的心脏功能。","examplePinyin":"Yīshēng zǐxì jiǎnchá le tā de xīnzàng gōngnéng.","translation":"의사들은 그의 심장 기능을 주의 깊게 검사했습니다.","sourceNo":5073},{"no":867,"category":"건강·날씨","word":"胸","pinyin":"xiōng","meaning":"가슴","example":"他挺起胸膛，自信地走上了讲台。","examplePinyin":"Tā tǐngqǐ xiōngtáng, zìxìn de zǒushàng le jiǎngtái.","translation":"그는 가슴을 펴고 자신 있게 강단에 올랐어요.","sourceNo":5074},{"no":868,"category":"건강·날씨","word":"血管","pinyin":"xuèguǎn","meaning":"혈관","example":"长期熬夜会损害人体的血管健康。","examplePinyin":"Chángqī áoyè huì sǔnhài réntǐ de xuèguǎn jiànkāng.","translation":"장시간 늦게 자면 신체의 혈관 건강이 손상됩니다.","sourceNo":5087},{"no":869,"category":"건강·날씨","word":"血型","pinyin":"xuèxíng","meaning":"혈액형","example":"每个人的血型都由遗传因素决定。","examplePinyin":"Měi ge rén de xuèxíng dōu yóu yíchuán yīnsù juédìng.","translation":"각 사람의 혈액형은 유전적 요인에 의해 결정됩니다.","sourceNo":5091},{"no":870,"category":"건강·날씨","word":"血压","pinyin":"xuèyā","meaning":"혈압","example":"定期测量血压有助于监控健康。","examplePinyin":"Dìngqī cèliáng xuèyā yǒuzhùyú jiānkòng jiànkāng.","translation":"정기적인 혈압 측정은 건강을 모니터링하는 데 도움이 됩니다.","sourceNo":5092},{"no":871,"category":"건강·날씨","word":"血液","pinyin":"xuèyè","meaning":"혈액","example":"医生抽取了他的血液样本进行化验。","examplePinyin":"Yīshēng chōuqǔ le tā de xuèyè yàngběn jìnxíng huàyàn.","translation":"의사는 검사를 위해 혈액 샘플을 채취했습니다.","sourceNo":5093},{"no":872,"category":"건강·날씨","word":"痒","pinyin":"yǎng","meaning":"가렵다","example":"蚊子叮咬后，他的手臂十分痒。","examplePinyin":"Wénzi dīngyǎo hòu, tā de shǒubì shífēn yǎng.","translation":"모기에 물린 후 그의 팔은 매우 가렵습니다.","sourceNo":5104},{"no":873,"category":"건강·날씨","word":"氧气","pinyin":"yǎngqì","meaning":"산소","example":"高原地区空气稀薄，氧气不足。","examplePinyin":"Gāoyuán dìqū kōngqì xībó, yǎngqì bùzú.","translation":"고원 지역은 공기가 희박하고 산소가 부족합니다.","sourceNo":5107},{"no":874,"category":"건강·날씨","word":"严寒","pinyin":"yánhán","meaning":"혹한","example":"北方的冬天格外漫长，十分严寒。","examplePinyin":"Běifāng de dōngtiān géwài màncháng, shífēn yánhán.","translation":"북부의 겨울은 매우 길고 매우 춥습니다.","sourceNo":5110},{"no":875,"category":"건강·날씨","word":"炎热","pinyin":"yánrè","meaning":"무덥다","example":"夏天的南方地区气候十分炎热潮湿。","examplePinyin":"Xiàtiān de nánfāng dìqū qìhòu shífēn yánrè cháoshī.","translation":"남부의 기후는 여름에 매우 덥고 습합니다.","sourceNo":5117},{"no":876,"category":"건강·날씨","word":"炎症","pinyin":"yánzhèng","meaning":"염증","example":"医生诊断他的喉咙出现了轻微炎症。","examplePinyin":"Yīshēng zhěnduàn tā de hóulóng chūxiàn le qīngwēi yánzhèng.","translation":"의사들은 그의 목에 가벼운 염증이 있다고 진단했습니다.","sourceNo":5122},{"no":877,"category":"건강·날씨","word":"野","pinyin":"yě","meaning":"야생의","example":"山上开满了各种各样的野花野草。","examplePinyin":"Shānshàng kāi mǎn le gèzhǒng gèyàng de yěhuā yěcǎo.","translation":"산에는 온갖 종류의 야생화와 풀이 가득합니다.","sourceNo":5131},{"no":878,"category":"건강·날씨","word":"野生","pinyin":"yěshēng","meaning":"야생의","example":"保护区里生活着大量珍稀野生动物。","examplePinyin":"Bǎohùqū lǐ shēnghuó zhe dàliàng zhēnxī yěshēng dòngwù.","translation":"보호구역에는 희귀한 야생동물이 많이 살고 있습니다.","sourceNo":5133},{"no":879,"category":"건강·날씨","word":"液体","pinyin":"yètǐ","meaning":"액체","example":"实验室里存放着几种不同的液体。","examplePinyin":"Shíyànshì lǐ cúnfàng zhe jǐ zhǒng bùtóng de yètǐ.","translation":"실험실에는 여러 가지 액체가 보관되어 있습니다.","sourceNo":5134},{"no":880,"category":"건강·날씨","word":"遗传","pinyin":"yíchuán","meaning":"유전하다","example":"这种病具有一定的家族遗传性。","examplePinyin":"Zhè zhǒng bìng jùyǒu yídìng de jiāzú yíchuánxìng.","translation":"이 질병은 특정 가족 유전성을 가지고 있습니다.","sourceNo":5142},{"no":881,"category":"건강·날씨","word":"影子","pinyin":"yǐngzi","meaning":"그림자","example":"夕阳把他的影子拉得又细又长。","examplePinyin":"Xīyáng bǎ tā de yǐngzi lā de yòu xì yòu cháng.","translation":"지는 해가 그의 그림자를 가늘고 길게 늘렸다.","sourceNo":5166},{"no":882,"category":"건강·날씨","word":"医药","pinyin":"yīyào","meaning":"의약","example":"他大学毕业后进入了医药行业工作。","examplePinyin":"Tā dàxué bìyè hòu jìnrù le yīyào hángyè gōngzuò.","translation":"그는 대학을 졸업한 뒤 제약업계에 입사했다.","sourceNo":5182},{"no":883,"category":"건강·날씨","word":"月光","pinyin":"yuèguāng","meaning":"달빛","example":"皎洁的月光洒满了整个院子。","examplePinyin":"Jiǎojié de yuèguāng sǎmǎn le zhěngge yuànzi.","translation":"밝은 달빛이 마당 전체를 가득 채웠다.","sourceNo":5222},{"no":884,"category":"건강·날씨","word":"月球","pinyin":"yuèqiú","meaning":"달","example":"科学家正在研究月球表面的地质。","examplePinyin":"Kēxuéjiā zhèngzài yánjiū yuèqiú biǎomiàn de dìzhì.","translation":"과학자들은 달 표면의 지질학을 연구하고 있습니다.","sourceNo":5224},{"no":885,"category":"건강·날씨","word":"晕","pinyin":"yūn","meaning":"어지럽다 / 어지럽히다","example":"长时间看书让他感到头晕眼花。","examplePinyin":"Chángshíjiān kànshū ràng tā gǎndào tóuyūn yǎnhuā.","translation":"오랫동안 책을 읽으면 그는 어지러움을 느꼈다.","sourceNo":5228},{"no":886,"category":"건강·날씨","word":"灾","pinyin":"zāi","meaning":"재해","example":"这个地区去年遭遇了严重旱灾。","examplePinyin":"Zhè ge dìqū qùnián zāoyù le yánzhòng hànzāi.","translation":"이 지역은 지난해 극심한 가뭄을 겪었다.","sourceNo":5239},{"no":887,"category":"건강·날씨","word":"灾害","pinyin":"zāihài","meaning":"재해","example":"地震是一种破坏性极强的自然灾害。","examplePinyin":"Dìzhèn shì yì zhǒng pòhuàixìng jí qiáng de zìrán zāihài.","translation":"지진은 극도로 파괴적인 자연재해입니다.","sourceNo":5240},{"no":888,"category":"건강·날씨","word":"灾难","pinyin":"zāinàn","meaning":"재난","example":"这场灾难让整个村庄损失惨重。","examplePinyin":"Zhè chǎng zāinàn ràng zhěngge cūnzhuāng sǔnshī cǎnzhòng.","translation":"이번 재난으로 마을 전체가 큰 피해를 입었습니다.","sourceNo":5241},{"no":889,"category":"건강·날씨","word":"灾区","pinyin":"zāiqū","meaning":"재해 지역","example":"志愿者们纷纷前往灾区提供援助。","examplePinyin":"Zhìyuànzhěmen fēnfēn qiánwǎng zāiqū tígōng yuánzhù.","translation":"자원봉사자들이 재난 지역으로 가서 도움을 제공했습니다.","sourceNo":5242},{"no":890,"category":"건강·날씨","word":"再生","pinyin":"zàishēng","meaning":"재생하다","example"
