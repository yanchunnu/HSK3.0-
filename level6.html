n.","translation":"출신 때문에 다른 사람을 무시하지 마십시오.","sourceNo":4366},{"no":1247,"category":"동작·감각·생각","word":"看待","pinyin":"kàndài","meaning":"대하다, 취급하다","example":"我们应该用发展的眼光看待问题。","examplePinyin":"Wǒmen yīnggāi yòng fāzhǎn de yǎnguāng kàndài wèntí.","translation":"우리는 변화와 발전의 관점에서 문제를 바라봐야 해요.","sourceNo":4367},{"no":1248,"category":"동작·감각·생각","word":"看得起","pinyin":"kàndeqǐ","meaning":"존중하다, 대단하게 여기다","example":"你只要认真努力，大家就会看得起你。","examplePinyin":"Nǐ zhǐyào rènzhēn nǔlì, dàjiā jiù huì kàndeqǐ nǐ.","translation":"진지하게 노력하면 모두가 당신을 인정할 거예요.","sourceNo":4368},{"no":1249,"category":"동작·감각·생각","word":"看好","pinyin":"kànhǎo","meaning":"유망하게 보다","example":"投资者普遍看好这家公司的前景。","examplePinyin":"Tóuzīzhě pǔbiàn kànhǎo zhè jiā gōngsī de qiánjǐng.","translation":"투자자들은 일반적으로 회사의 전망에 대해 낙관적입니다.","sourceNo":4370},{"no":1250,"category":"동작·감각·생각","word":"看中","pinyin":"kànzhòng","meaning":"마음에 들다","example":"她在商场里看中了一件漂亮的连衣裙。","examplePinyin":"Tā zài shāngchǎng lǐ kànzhòng le yí jiàn piàoliang de liányīqún.","translation":"그녀는 백화점에서 예쁜 원피스 하나가 마음에 들었어요.","sourceNo":4372},{"no":1251,"category":"동작·감각·생각","word":"看重","pinyin":"kànzhòng","meaning":"중시하다","example":"公司在招聘时非常看重实际能力。","examplePinyin":"Gōngsī zài zhāopìn shí fēicháng kànzhòng shíjì nénglì.","translation":"회사에서는 채용 시 실무능력을 매우 중요하게 생각합니다.","sourceNo":4373},{"no":1252,"category":"동작·감각·생각","word":"渴望","pinyin":"kěwàng","meaning":"갈망하다","example":"每个孩子都渴望得到父母的关爱。","examplePinyin":"Měi ge háizi dōu kěwàng dédào fùmǔ de guān'ài.","translation":"모든 어린이는 부모의 사랑을 갈망합니다.","sourceNo":4388},{"no":1253,"category":"동작·감각·생각","word":"恐惧","pinyin":"kǒngjù","meaning":"두렵다","example":"面对未知的黑暗，孩子感到恐惧。","examplePinyin":"Miànduì wèizhī de hēi'àn, háizi gǎndào kǒngjù.","translation":"알 수 없는 어둠 앞에서 아이는 두려움을 느낀다.","sourceNo":4391},{"no":1254,"category":"동작·감각·생각","word":"扣","pinyin":"kòu","meaning":"채우다, 잠그다 / 단추","example":"请把外套上的扣子都扣好。","examplePinyin":"Qǐng bǎ wàitào shàng de kòuzi dōu kòuhǎo.","translation":"코트의 단추를 모두 채워주세요.","sourceNo":4393},{"no":1255,"category":"동작·감각·생각","word":"夸","pinyin":"kuā","meaning":"칭찬하다","example":"老师在班会上夸他学习认真，乐于助人。","examplePinyin":"Lǎoshī zài bān huìshàng kuā tā xuéxí rènzhēn, lèyú zhùrén.","translation":"선생님은 학급 회의에서 그가 성실히 공부하고 남을 잘 돕는다고 칭찬하셨어요.","sourceNo":4399},{"no":1256,"category":"동작·감각·생각","word":"夸奖","pinyin":"kuājiǎng","meaning":"칭찬하다","example":"老师当着全班同学夸奖了他。","examplePinyin":"Lǎoshī dāngzhe quánbān tóngxué kuājiǎng le tā.","translation":"선생님은 학급 전체가 보는 앞에서 그를 칭찬하셨습니다.","sourceNo":4402},{"no":1257,"category":"동작·감각·생각","word":"困扰","pinyin":"kùnrǎo","meaning":"곤란하게 하다, 괴롭히다","example":"这个难题已经困扰了他好几天。","examplePinyin":"Zhè ge nántí yǐjīng kùnrǎo le tā hǎo jǐ tiān.","translation":"이 문제는 며칠 동안 그를 괴롭혔다.","sourceNo":4407},{"no":1258,"category":"동작·감각·생각","word":"扩展","pinyin":"kuòzhǎn","meaning":"확장하다","example":"公司计划把业务扩展到海外市场。","examplePinyin":"Gōngsī jìhuà bǎ yèwù kuòzhǎn dào hǎiwài shìchǎng.","translation":"회사는 해외 시장으로 사업을 확대할 계획이다.","sourceNo":4408},{"no":1259,"category":"동작·감각·생각","word":"落","pinyin":"là","meaning":"빠뜨리다","example":"他出门时太匆忙，把手机落在家里了。","examplePinyin":"Tā chūménshí tài cōngmáng, bǎ shǒujī là zài jiālǐ le.","translation":"그는 너무 서둘러 나가느라 휴대전화를 집에 두고 왔어요.","sourceNo":4411},{"no":1260,"category":"동작·감각·생각","word":"赖","pinyin":"lài","meaning":"떼쓰다; 의지하다; 눌러앉다","example":"他每天早上总是赖床不肯起来。","examplePinyin":"Tā měi tiān zǎoshang zǒngshì làichuáng bùkěn qǐlai.","translation":"그는 매일 아침 항상 침대에 누워 일어나기를 거부합니다.","sourceNo":4412},{"no":1261,"category":"동작·감각·생각","word":"拦","pinyin":"lán","meaning":"막다, 저지하다","example":"保安在门口拦住了陌生的访客。","examplePinyin":"Bǎo'ān zài ménkǒu lánzhù le mòshēng de fǎngkè.","translation":"경비원은 문 앞에서 낯선 방문객을 막았습니다.","sourceNo":4416},{"no":1262,"category":"동작·감각·생각","word":"立","pinyin":"lì","meaning":"세우다","example":"工人们在广场中央立起了一块石碑。","examplePinyin":"Gōngrénmen zài guǎngchǎng zhōngyāng lì qǐ le yíkuài shíbēi.","translation":"노동자들은 광장 중앙에 비석을 세웠습니다.","sourceNo":4430},{"no":1263,"category":"동작·감각·생각","word":"联想","pinyin":"liánxiǎng","meaning":"연상하다","example":"这首熟悉的歌曲让我联想到童年。","examplePinyin":"Zhè shǒu shúxī de gēqǔ ràng wǒ liánxiǎng dào tóngnián.","translation":"이 익숙한 노래는 내 어린시절을 생각나게 합니다.","sourceNo":4439},{"no":1264,"category":"동작·감각·생각","word":"料2","pinyin":"liào","meaning":"예상하다","example":"他没有料到事情会发展成这样。","examplePinyin":"Tā méiyǒu liàodào shìqing huì fāzhǎn chéng zhèyàng.","translation":"그는 상황이 이렇게 전개될 것이라고는 예상하지 못했습니다.","sourceNo":4441},{"no":1265,"category":"동작·감각·생각","word":"历经","pinyin":"lìjīng","meaning":"거치다, 경험하다","example":"他历经千辛万苦才取得今天的成就。","examplePinyin":"Tā lìjīng qiān xīn wàn kǔ cái qǔdé jīntiān de chéngjiù.","translation":"그는 오늘 성취한 것을 달성하기 위해 많은 어려움을 겪었습니다.","sourceNo":4445},{"no":1266,"category":"동작·감각·생각","word":"淋","pinyin":"lín","meaning":"(비 등을) 맞다","example":"突如其来的大雨把他淋湿了全身。","examplePinyin":"Tū rú qí lái de dàyǔ bǎ tā línshī le quánshēn.","translation":"갑작스런 폭우가 그를 온통 흠뻑 적셨다.","sourceNo":4447},{"no":1267,"category":"동작·감각·생각","word":"流动","pinyin":"liúdòng","meaning":"유동하다, 이동하다","example":"春天来了，河水开始缓缓流动。","examplePinyin":"Chūntiān lái le, héshuǐ kāishǐ huǎnhuǎn liúdòng.","translation":"봄이 찾아왔고, 강물은 천천히 흐르기 시작합니다.","sourceNo":4452},{"no":1268,"category":"동작·감각·생각","word":"流入","pinyin":"liúrù","meaning":"유입되다","example":"大量河水从上游缓缓流入大海。","examplePinyin":"Dàliàng héshuǐ cóng shàngyóu huǎnhuǎn liúrù dàhǎi.","translation":"많은 양의 강물이 상류에서 천천히 바다로 흘러 들어갑니다.","sourceNo":4455},{"no":1269,"category":"동작·감각·생각","word":"露","pinyin":"lòu","meaning":"드러내다","example":"他不小心露出了紧张的表情。","examplePinyin":"Tā bù xiǎoxīn lòuchū le jǐnzhāng de biǎoqíng.","translation":"그는 우연히 긴장한 표정을 보였다.","sourceNo":4460},{"no":1270,"category":"동작·감각·생각","word":"轮流","pinyin":"lúnliú","meaning":"교대로, 돌아가면서","example":"值日生每周都要轮流打扫教室。","examplePinyin":"Zhírìshēng měi zhōu dōu yào lúnliú dǎsǎo jiàoshì.","translation":"당직 학생들은 매주 교대로 교실을 청소합니다.","sourceNo":4472},{"no":1271,"category":"동작·감각·생각","word":"埋","pinyin":"mái","meaning":"묻다","example":"考古学家挖出了一件被埋的文物。","examplePinyin":"Kǎogǔ xué jiā wāchū le yí jiàn bèi mái de wénwù.","translation":"고고학자들이 묻혀 있는 유물을 발굴했습니다.","sourceNo":4485},{"no":1272,"category":"동작·감각·생각","word":"迈","pinyin":"mài","meaning":"(발걸음을) 내딛다","example":"他鼓起勇气迈出了人生的第一步。","examplePinyin":"Tā gǔqǐ yǒngqì màichū le rénshēng de dìyībù.","translation":"그는 인생의 첫발을 내딛기 위해 용기를 냈습니다.","sourceNo":4486},{"no":1273,"category":"동작·감각·생각","word":"冒","pinyin":"mào","meaning":"무릅쓰다, 솟아나다","example":"屋顶的烟囱正冒出滚滚浓烟。","examplePinyin":"Wūdǐng de yāncōng zhèng mào chū gǔngǔn nóngyān.","translation":"지붕 굴뚝에서는 연기가 피어올랐다.","sourceNo":4491},{"no":1274,"category":"동작·감각·생각","word":"冒险","pinyin":"màoxiǎn","meaning":"모험하다","example":"年轻人应该勇于尝试，敢于冒险。","examplePinyin":"Niánqīngrén yīnggāi yǒngyú chángshì, gǎnyú màoxiǎn.","translation":"젊은이들은 위험을 감수할 만큼 용감해야 합니다.","sourceNo":4492},{"no":1275,"category":"동작·감각·생각","word":"免","pinyin":"miǎn","meaning":"면제하다","example":"政府决定免除贫困学生的学费。","examplePinyin":"Zhèngfǔ juédìng miǎnchú pínkùn xuésheng de xuéfèi.","translation":"정부는 가난한 학생들의 등록금을 면제하기로 결정했다.","sourceNo":4502},{"no":1276,"category":"동작·감각·생각","word":"弥补","pinyin":"míbǔ","meaning":"보충하다, 메우다","example":"他加倍努力，希望弥补之前的失误。","examplePinyin":"Tā jiābèi nǔlì, xīwàng míbǔ zhīqián de shīwù.","translation":"그는 이전의 실수를 만회하기 위해 노력을 배가했습니다.","sourceNo":4512},{"no":1277,"category":"동작·감각·생각","word":"灭","pinyin":"miè","meaning":"끄다, 소멸하다","example":"消防员迅速扑灭了这场大火。","examplePinyin":"Xiāofángyuán xùnsù pūmiè le zhè chǎng dàhuǒ.","translation":"소방관들은 재빨리 불을 진압했습니다.","sourceNo":4514},{"no":1278,"category":"동작·감각·생각","word":"命名","pinyin":"mìngmíng","meaning":"명명하다","example":"这颗新发现的星星被命名为希望星。","examplePinyin":"Zhè kē xīn fāxiàn de xīngxing bèi mìngmíng wèi xīwàng xīng.","translation":"새로 발견된 별의 이름은 호프스타(Hope Star)였다.","sourceNo":4522},{"no":1279,"category":"동작·감각·생각","word":"模仿","pinyin":"mófǎng","meaning":"모방하다","example":"小孩子从小就喜欢模仿大人的动作。","examplePinyin":"Xiǎoháizi cóngxiǎo jiù xǐhuan mófǎng dàren de dòngzuò.","translation":"아이들은 어릴 때부터 어른들의 행동을 흉내내는 것을 좋아합니다.","sourceNo":4531},{"no":1280,"category":"동작·감각·생각","word":"扭","pinyin":"niǔ","meaning":"비틀다, 삐다","example":"他在打篮球时不小心扭伤了脚踝。","examplePinyin":"Tā zài dǎlánqiú shí bù xiǎoxīn niǔshāng le jiǎohuái.","translation":"그는 농구를 하다가 실수로 발목을 삐었습니다.","sourceNo":4559},{"no":1281,"category":"동작·감각·생각","word":"排除","pinyin":"páichú","meaning":"배제하다, 제거하다","example":"经过检查，医生排除了他患病的可能。","examplePinyin":"Jīngguò jiǎnchá, yīshēng páichú le tā huànbìng de kěnéng.","translation":"검사 후 의사는 질병 가능성을 배제했습니다.","sourceNo":4566},{"no":1282,"category":"동작·감각·생각","word":"盼望","pinyin":"pànwàng","meaning":"간절히 바라다","example":"孩子们每天都盼望着假期快点儿到来。","examplePinyin":"Háizimen měi tiān dōu pànwàng zhe jiàqī kuàidiǎnr dàolái.","translation":"아이들은 방학이 빨리 오기를 매일 손꼽아 기다려요.","sourceNo":4572},{"no":1283,"category":"동작·감각·생각","word":"泡","pinyin":"pào","meaning":"거품 / 담그다","example":"睡觉前，他喜欢用热水泡一泡脚。","examplePinyin":"Shuìjiào qián, tā xǐhuan yòng rèshuǐ pào yi pào jiǎo.","translation":"그는 잠자리에 들기 전에 뜨거운 물에 발을 담그는 것을 좋아합니다.","sourceNo":4573},{"no":1284,"category":"동작·감각·생각","word":"抛","pinyin":"pāo","meaning":"던지다","example":"他用力把救生圈抛向落水的人。","examplePinyin":"Tā yònglì bǎ jiùshēngquān pāoxiàng luòshuǐ de rén.","translation":"그는 물에 빠진 사람을 향해 힘껏 구명환을 던졌어요.","sourceNo":4574},{"no":1285,"category":"동작·감각·생각","word":"佩服","pinyin":"pèifú","meaning":"감탄하다, 탄복하다","example":"大家都非常佩服他坚韧不拔的毅力。","examplePinyin":"Dàjiā dōu fēicháng pèifú tā jiānrèn bù bá de yìlì.","translation":"모두가 그의 꺾이지 않는 끈기에 탄복해요.","sourceNo":4577},{"no":1286,"category":"동작·감각·생각","word":"陪同","pinyin":"péitóng","meaning":"동행하다","example":"他全程陪同外国客人参观了工厂。","examplePinyin":"Tā quánchéng péitóng wàiguó kèrén cānguān le gōngchǎng.","translation":"그는 공장 견학 내내 외국인 손님과 동행했습니다.","sourceNo":4579},{"no":1287,"category":"동작·감각·생각","word":"培育","pinyin":"péiyù","meaning":"배양하다, 육성하다","example":"学校致力于培育更多优秀的人才。","examplePinyin":"Xuéxiào zhìlìyú péiyù gèng duō yōuxiù de réncái.","translation":"본교는 더욱 뛰어난 인재를 양성하는데 최선을 다하고 있습니다.","sourceNo":4580},{"no":1288,"category":"동작·감각·생각","word":"喷","pinyin":"pēn","meaning":"뿜다, 분사하다","example":"妈妈拿起喷壶给花草喷水浇灌。","examplePinyin":"Māma ná qǐ pēnhú gěi huācǎo pēnshuǐ jiāoguàn.","translation":"엄마는 물뿌리개를 들고 꽃과 식물에 물을 뿌렸습니다.","sourceNo":4581},{"no":1289,"category":"동작·감각·생각","word":"捧","pinyin":"pěng","meaning":"받쳐 들다 / 움큼(양사)","example":"他双手捧着一大束鲜花走进礼堂。","examplePinyin":"Tā shuāngshǒu pěng zhe yídà shù xiānhuā zǒujìn lǐtáng.","translation":"그는 커다란 꽃다발을 손에 들고 강당으로 들어갔습니다.","sourceNo":4582},{"no":1290,"category":"동작·감각·생각","word":"碰撞","pinyin":"pèngzhuàng","meaning":"충돌하다","example":"十字路口发生了一起严重的车辆碰撞。","examplePinyin":"Shízì lùkǒu fāshēng le yìqǐ yánzhòng de chēliàng pèngzhuàng.","translation":"교차로에서 심각한 차량 충돌이 발생했습니다.","sourceNo":4583},{"no":1291,"category":"동작·감각·생각","word":"披","pinyin":"pī","meaning":"걸치다, 두르다","example":"天气转凉，她随手披上了一件外套。","examplePinyin":"Tiānqì zhuǎn liáng, tā suíshǒu pīshàng le yí jiàn wàitào.","translation":"날씨가 추워져서 그녀는 코트를 입었습니다.","sourceNo":4585},{"no":1292,"category":"동작·감각·생각","word":"飘","pinyin":"piāo","meaning":"나부끼다, 흩날리다 / 가볍다","example":"冬天到了，窗外的雪花轻轻飘落。","examplePinyin":"Dōngtiān dào le, chuāngwài de xuěhuā qīngqīng piāoluò.","translation":"겨울이 왔습니다. 창밖에는 눈이 흩날리고 있습니다.","sourceNo":4589},{"no":1293,"category":"동작·감각·생각","word":"漂","pinyin":"piāo","meaning":"떠다니다","example":"河面上漂浮着几片枯黄的落叶。","examplePinyin":"Hémiànshàng piāofú zhe jǐ piàn kūhuáng de luòyè.","translation":"강물에는 시든 노란 나뭇잎 몇 개가 떠 있었다.","sourceNo":4590},{"no":1294,"category":"동작·감각·생각","word":"评估","pinyin":"pínggū","meaning":"평가하다","example":"专家小组对该项目进行了全面评估。","examplePinyin":"Zhuānjiā xiǎozǔ duì gāi xiàngmù jìnxíng le quánmiàn pínggū.","translation":"전문가 패널이 프로젝트에 대한 종합적인 평가를 실시했습니다.","sourceNo":4599},{"no":1295,"category":"동작·감각·생각","word":"泼","pinyin":"pō","meaning":"뿌리다, 끼얹다","example":"小心，不要把水泼到别人身上。","examplePinyin":"Xiǎoxīn, búyào bǎ shuǐ pōdào biéren shēnshang.","translation":"다른 사람에게 물을 흘리지 않도록 주의하세요.","sourceNo":4605},{"no":1296,"category":"동작·감각·생각","word":"扑","pinyin":"pū","meaning":"덤벼들다","example":"猫敏捷地扑向了正在逃跑的老鼠。","examplePinyin":"Māo mǐnjiéde pū xiàng le zhèngzài táopǎo de lǎoshǔ.","translation":"고양이는 도망가는 쥐를 재빠르게 덮쳤습니다.","sourceNo":4608},{"no":1297,"category":"동작·감각·생각","word":"扑灭","pinyin":"pūmiè","meaning":"진압하다, 소멸시키다","example":"消防队员经过努力终于扑灭了大火。","examplePinyin":"Xiāofáng duìyuán jīngguò nǔlì zhōngyú pūmiè le dàhuǒ.","translation":"소방관들은 열심히 노력한 끝에 마침내 불을 진압했습니다.","sourceNo":4610},{"no":1298,"category":"동작·감각·생각","word":"牵","pinyin":"qiān","meaning":"끌다, 잡아당기다","example":"妈妈紧紧牵着孩子的手过马路。","examplePinyin":"Māma jǐnjǐn qiān zhe háizi de shǒu guò mǎlù.","translation":"어머니는 길을 건너는 동안 아이의 손을 꽉 잡았습니다.","sourceNo":4614},{"no":1299,"category":"동작·감각·생각","word":"强化","pinyin":"qiánghuà","meaning":"강화하다","example":"教练要求队员们强化基本功训练。","examplePinyin":"Jiàoliàn yāoqiú duìyuánmen qiánghuà jīběngōng xùnliàn.","translation":"코치는 선수들에게 기본 기술 훈련을 강화할 것을 요구합니다.","sourceNo":4617},{"no":1300,"category":"동작·감각·생각","word":"强迫","pinyin":"qiǎngpò","meaning":"강요하다","example":"老师从不强迫学生死记硬背知识。","examplePinyin":"Lǎoshī cóngbù qiǎngpò xuésheng sǐjì yìng bèi zhīshi.","translation":"교사는 결코 학생들에게 지식을 암기하도록 강요하지 않습니다.","sourceNo":4618},{"no":1301,"category":"동작·감각·생각","word":"瞧","pinyin":"qiáo","meaning":"보다","example":"你瞧，天边出现了一道美丽的彩虹。","examplePinyin":"Nǐ qiáo, tiānbiān chūxiàn le yí dào měilì de cǎihóng.","translation":"그런데 보라, 지평선에 아름다운 무지개가 나타났다.","sourceNo":4627},{"no":1302,"category":"동작·감각·생각","word":"启动","pinyin":"qǐdòng","meaning":"시동을 걸다, 시작하다","example":"公司在大会上正式启动了新的合作项目。","examplePinyin":"Gōngsī zài dàhuì shàng zhèngshì qǐdòng le xīn de hézuò xiàngmù.","translation":"회사는 대회에서 새로운 협력 사업을 공식적으로 시작했어요.","sourceNo":4633},{"no":1303,"category":"동작·감각·생각","word":"倾向","pinyin":"qīngxiàng","meaning":"기울다, 경향이 있다 / 경향","example":"面对选择，他更倾向于稳妥的方案。","examplePinyin":"Miànduì xuǎnzé, tā gèng qīngxiàng yú wěntuǒ de fāng'àn.","translation":"선택의 여지가 있는 상황에서는 안전한 솔루션을 선호합니다.","sourceNo":4651},{"no":1304,"category":"동작·감각·생각","word":"欺骗","pinyin":"qīpiàn","meaning":"속이다, 기만하다","example":"他从来不会为了利益去欺骗任何人。","examplePinyin":"Tā cónglái búhuì wèile lìyì qù qīpiàn rènhérén.","translation":"그는 결코 이익을 위해 누구도 속이지 않을 것입니다.","sourceNo":4657},{"no":1305,"category":"동작·감각·생각","word":"求","pinyin":"qiú","meaning":"구하다, 청하다","example":"走投无路时，他只好开口求老师帮忙。","examplePinyin":"Zǒu tóu wú lù shí, tā zhǐhǎo kāikǒu qiú lǎoshī bāngmáng.","translation":"절망적이었을 때 그는 선생님에게 도움을 요청할 수밖에 없었습니다.","sourceNo":4662},{"no":1306,"category":"동작·감각·생각","word":"求救","pinyin":"qiújiù","meaning":"구조를 요청하다","example":"遇险的登山者发出了紧急的求救信号。","examplePinyin":"Yùxiǎn de dēngshānzhě fāchū le jǐnjí de qiújiù xìnhào.","translation":"조난당한 등반가들은 긴급 조난 신호를 보냈습니다.","sourceNo":4664},{"no":1307,"category":"동작·감각·생각","word":"求助","pinyin":"qiúzhù","meaning":"도움을 청하다","example":"遇到困难时，不要害怕向他人求助。","examplePinyin":"Yùdào kùnnan shí, búyào hàipà xiàng tārén qiúzhù.","translation":"어려움이 있을 때 다른 사람에게 도움을 요청하는 것을 두려워하지 마십시오.","sourceNo":4666},{"no":1308,"category":"동작·감각·생각","word":"期望","pinyin":"qīwàng","meaning":"기대하다","example":"父母对他的成长寄予了很高的期望。","examplePinyin":"Fùmǔ duì tā de chéngzhǎng jìyǔ le hěn gāo de qīwàng.","translation":"그의 부모는 그의 성장에 대한 기대가 높았다.","sourceNo":4667},{"no":1309,"category":"동작·감각·생각","word":"起源","pinyin":"qǐyuán","meaning":"기원하다 / 기원","example":"这个传统节日的起源可以追溯到古代。","examplePinyin":"Zhè ge chuántǒng jiérì de qǐyuán kěyǐ zhuīsùdào gǔdài.","translation":"이 전통 축제의 기원은 고대로 거슬러 올라갑니다.","sourceNo":4670},{"no":1310,"category":"동작·감각·생각","word":"取代","pinyin":"qǔdài","meaning":"대체하다","example":"随着科技发展，机器逐渐取代了人工。","examplePinyin":"Suízhe kējì fāzhǎn, jīqì zhújiàn qǔdài le réngōng.","translation":"과학과 기술의 발달로 점차 기계가 노동을 대체하게 되었습니다.","sourceNo":4679},{"no":1311,"category":"동작·감각·생각","word":"确立","pinyin":"quèlì","meaning":"확립하다","example":"团队会议上，大家共同确立了目标。","examplePinyin":"Tuánduì huìyì shàng, dàjiā gòngtóng quèlì le mùbiāo.","translation":"팀 회의에서는 모두가 공동으로 목표를 세웠습니다.","sourceNo":4681},{"no":1312,"category":"동작·감각·생각","word":"染","pinyin":"rǎn","meaning":"물들이다, 염색하다","example":"秋天到了，漫山遍野的枫叶被染成红色。","examplePinyin":"Qiūtiān dào le, màn shān biàn yě de fēngyè bèi rǎnchéng hóngsè.","translation":"가을이 왔습니다. 산과 들 곳곳에 단풍잎이 붉게 물들고 있습니다.","sourceNo":4686},{"no":1313,"category":"동작·감각·생각","word":"认错","pinyin":"rèncuò","meaning":"잘못을 인정하다","example":"意识到自己的错误后，他主动认错道歉。","examplePinyin":"Yìshí dào zìjǐ de cuòwù hòu, tā zhǔdòng rèncuò dàoqiàn.","translation":"자신의 실수를 깨달은 그는 솔선해서 인정하고 사과했다.","sourceNo":4691},{"no":1314,"category":"동작·감각·생각","word":"人山人海","pinyin":"rénshān rénhǎi","meaning":"인산인해","example":"节假日的景区里人山人海，十分热闹。","examplePinyin":"Jiéjiàrì de jǐngqū lǐ rénshānrénhǎi, shífēn rènao.","translation":"휴일의 관광지는 인산인해를 이루며 무척 붐벼요.","sourceNo":4698},{"no":1315,"category":"동작·감각·생각","word":"忍受","pinyin":"rěnshòu","meaning":"참다, 견디다","example":"面对病痛，他默默忍受着巨大的折磨。","examplePinyin":"Miànduì bìngtòng, tā mòmò rěnshòu zhe jùdà de zhémó.","translation":"그는 병의 고통을 견디며 큰 괴로움을 묵묵히 참았어요.","sourceNo":4701},{"no":1316,"category":"동작·감각·생각","word":"认同","pinyin":"rèntóng","meaning":"동의하다, 공감하다","example":"他的观点在会上得到了大多数人的认同。","examplePinyin":"Tā de guāndiǎn zài huìshàng dédào le dàduō shù rén de rèntóng.","translation":"회의에 참석한 대부분의 사람들은 그의 견해를 공유했습니다.","sourceNo":4702},{"no":1317,"category":"동작·감각·생각","word":"认知","pinyin":"rènzhī","meaning":"인지하다 / 인지","example":"这次经历彻底改变了他对世界的认知。","examplePinyin":"Zhè cì jīnglì chèdǐ gǎibiàn le tā duì shìjiè de rènzhī.","translation":"이 경험은 세상에 대한 그의 이해를 완전히 바꿔 놓았습니다.","sourceNo":4705},{"no":1318,"category":"동작·감각·생각","word":"融合","pinyin":"rónghé","meaning":"융합하다","example":"这座城市巧妙地融合了传统与现代文化。","examplePinyin":"Zhè zuò chéngshì qiǎomiào de rónghé le chuántǒng yǔ xiàndài wénhuà.","translation":"이 도시는 전통과 현대 문화가 훌륭하게 조화를 이루고 있는 도시입니다.","sourceNo":4713},{"no":1319,"category":"동작·감각·생각","word":"融化","pinyin":"rónghuà","meaning":"녹다","example":"春天来了，山上的积雪逐渐融化了。","examplePinyin":"Chūntiān lái le, shānshàng de jīxuě zhújiàn rónghuà le.","translation":"봄이 왔고 산의 눈이 점차 녹고 있습니다.","sourceNo":4714},{"no":1320,"category":"동작·감각·생각","word":"融入","pinyin":"róngrù","meaning":"융화되다, 녹아들다","example":"他很快就融入了新学校的集体生活。","examplePinyin":"Tā hěn kuài jiù róngrù le xīn xuéxiào de jítǐ shēnghuó.","translation":"그는 새 학교의 집단 생활에 빠르게 통합되었습니다.","sourceNo":4716},{"no":1321,"category":"동작·감각·생각","word":"入选","pinyin":"rùxuǎn","meaning":"선발되다, 뽑히다","example":"他凭借出色的表现成功入选国家队。","examplePinyin":"Tā píngjiè chūsè de biǎoxiàn chénggōng rùxuǎn guójiāduì.","translation":"뛰어난 활약을 펼친 그는 성공적으로 국가대표에 발탁됐다.","sourceNo":4722},{"no":1322,"category":"동작·감각·생각","word":"撒","pinyin":"sǎ","meaning":"뿌리다","example":"农民正在田间撒播新一季的种子。","examplePinyin":"Nóngmín zhèngzài tiánjiān sǎbō xīnyíjì de zhǒngzi.","translation":"농부들이 새 계절을 맞아 밭에 씨앗을 뿌리고 있습니다.","sourceNo":4723},{"no":1323,"category":"동작·감각·생각","word":"塞","pinyin":"sāi","meaning":"막다, 채워 넣다 / 마개","example":"他匆忙把书本塞进了自己的书包。","examplePinyin":"Tā cōngmáng bǎ shūběn sāijìn le zìjǐ de shūbāo.","translation":"그는 서둘러 가방에 책을 집어넣었다.","sourceNo":4724},{"no":1324,"category":"동작·감각·생각","word":"散¹","pinyin":"sàn","meaning":"흩어지다","example":"演出结束后，观众们陆陆续续散去了。","examplePinyin":"Yǎnchū jiéshù hòu, guānzhòngmen lù lù xùxù sàn qù le.","translation":"공연이 끝난 후 관객들은 차례로 해산됐다.","sourceNo":4726},{"no":1325,"category":"동작·감각·생각","word":"散²","pinyin":"sǎn","meaning":"흩어진, 산만한","example":"这些是包装简陋的散装商品。","examplePinyin":"Zhèxiē shì bāozhuāng jiǎnlòu de sǎnzhuāng shāngpǐn.","translation":"포장이 불량한 벌크 상품입니다.","sourceNo":4727},{"no":1326,"category":"동작·감각·생각","word":"散发","pinyin":"sànfā","meaning":"발산하다, 배포하다","example":"傍晚的花园里散发着阵阵清香。","examplePinyin":"Bàngwǎn de huāyuánlǐ sànfā zhe zhènzhèn qīngxiāng.","translation":"저녁에는 정원에서 향기가 납니다.","sourceNo":4728},{"no":1327,"category":"동작·감각·생각","word":"丧失","pinyin":"sàngshī","meaning":"상실하다","example":"遭遇挫折后，他一度丧失了自信心。","examplePinyin":"Zāoyù cuòzhé hòu, tā yí dù sàngshī le zìxìnxīn.","translation":"그는 좌절을 겪은 후 한동안 자신감을 잃었습니다.","sourceNo":4729},{"no":1328,"category":"동작·감각·생각","word":"杀","pinyin":"shā","meaning":"죽이다","example":"农户宰杀了一只鸡准备招待客人。","examplePinyin":"Nónghù zǎishā le yì zhī jī zhǔnbèi zhāodài kèrén.","translation":"농부는 손님들에게 대접하기 위해 닭을 잡았습니다.","sourceNo":4733},{"no":1329,"category":"동작·감각·생각","word":"筛选","pinyin":"shāixuǎn","meaning":"선별하다, 거르다","example":"招聘人员从简历中筛选出合适的候选人。","examplePinyin":"Zhāopìn rényuán cóng jiǎnlì zhōng shāixuǎn chū héshì de hòuxuǎnrén.","translation":"채용 담당자는 이력서에서 적합한 후보자를 골라냈어요.","sourceNo":4735},{"no":1330,"category":"동작·감각·생각","word":"闪","pinyin":"shǎn","meaning":"번쩍이다","example":"夜空中忽然闪过一道耀眼的光。","examplePinyin":"Yèkōng zhōng hūrán shǎnguo yí dào yàoyǎn de guāng.","translation":"갑자기 밤하늘에 눈부신 빛이 번쩍였다.","sourceNo":4737},{"no":1331,"category":"동작·감각·생각","word":"上当","pinyin":"shàngdàng","meaning":"속다","example":"他因为轻信谣言而上当受骗了。","examplePinyin":"Tā yīnwèi qīngxìn yáoyán ér shàngdàng shòupiàn le.","translation":"그는 소문을 믿었기 때문에 속았습니다.","sourceNo":4742},{"no":1332,"category":"동작·감각·생각","word":"射","pinyin":"shè","meaning":"쏘다","example":"猎人瞄准目标，射出了一支利箭。","examplePinyin":"Lièrén miáozhǔn mùbiāo, shè chū le yì zhī lìjiàn.","translation":"사냥꾼은 목표물을 겨냥하고 날카로운 화살을 쏘았습니다.","sourceNo":4756},{"no":1333,"category":"동작·감각·생각","word":"涉及","pinyin":"shèjí","meaning":"관련되다, 연루되다","example":"这起案件涉及的人员众多，情况十分复杂。","examplePinyin":"Zhè qǐ ànjiàn shèjí de rényuán zhòngduō, qíngkuàng shífēn fùzá.","translation":"이 사건은 관련자가 많아 상황이 무척 복잡해요.","sourceNo":4757},{"no":1334,"category":"동작·감각·생각","word":"生成","pinyin":"shēngchéng","meaning":"생성되다","example":"这套系统能够自动生成详细的报告。","examplePinyin":"Zhè tào xìtǒng nénggòu zìdòng shēngchéng xiángxì de bàogào.","translation":"시스템은 자동으로 세부 보고서를 생성할 수 있습니다.","sourceNo":4761},{"no":1335,"category":"동작·감각·생각","word":"设想","pinyin":"shèxiǎng","meaning":"구상하다, 가정하다","example":"团队会议上，大家提出了各种设想。","examplePinyin":"Tuánduì huìyì shàng, dàjiā tíchū le gèzhǒng shèxiǎng.","translation":"팀 회의에서는 모두가 다양한 아이디어를 내놓았습니다.","sourceNo":4774},{"no":1336,"category":"동작·감각·생각","word":"拾","pinyin":"shí","meaning":"줍다","example":"他弯腰拾起了地上掉落的钱包。","examplePinyin":"Tā wānyāo shíqǐ le dìshang diàoluò de qiánbāo.","translation":"그는 몸을 굽혀 땅에 떨어진 지갑을 주웠습니다.","sourceNo":4777},{"no":1337,"category":"동작·감각·생각","word":"识别","pinyin":"shíbié","meaning":"식별하다","example":"这套人脸识别系统的精度非常高。","examplePinyin":"Zhè tào rén liǎn shíbié xìtǒng de jīngdù fēicháng gāo.","translation":"이 얼굴 인식 시스템의 정확도는 매우 높습니다.","sourceNo":4778},{"no":1338,"category":"동작·감각·생각","word":"释放","pinyin":"shìfàng","meaning":"방출하다, 석방하다","example":"长期压抑的情绪终于得到了释放。","examplePinyin":"Chángqī yāyì de qíngxù zhōngyú dédào le shìfàng.","translation":"그동안 억눌렸던 감정이 드디어 풀렸습니다.","sourceNo":4784},{"no":1339,"category":"동작·감각·생각","word":"使劲","pinyin":"shǐjìn","meaning":"힘을 쓰다","example":"他使劲推开了那扇沉重的大门。","examplePinyin":"Tā shǐjìn tuīkāi le nà shàn chénzhòng de dàmén.","translation":"그는 무거운 문을 밀어 열었다.","sourceNo":4792},{"no":1340,"category":"동작·감각·생각","word":"试图","pinyin":"shìtú","meaning":"시도하다","example":"他多次试图联系对方，都没有成功。","examplePinyin":"Tā duōcì shìtú liánxì duìfāng, dōu méiyǒu chénggōng.","translation":"그는 상대방에게 여러 번 연락을 시도했지만 성공하지 못했습니다.","sourceNo":4799},{"no":1341,"category":"동작·감각·생각","word":"属","pinyin":"shǔ","meaning":"~에 속하다","example":"他属虎，很喜欢带老虎图案的礼物。","examplePinyin":"Tā shǔ hǔ, hěn xǐhuan dài lǎohǔ tú'àn de lǐwù.","translation":"그는 호랑이띠라 호랑이 무늬가 있는 선물을 좋아해요.","sourceNo":4819},{"no":1342,"category":"동작·감각·생각","word":"输出","pinyin":"shūchū","meaning":"출력하다, 내보내다","example":"请把这份统计报表输出成表格文件。","examplePinyin":"Qǐng bǎ zhè fèn tǒngjì bàobiǎo shūchū chéng biǎogé wénjiàn.","translation":"이 통계 보고서를 테이블 파일로 출력하십시오.","sourceNo":4823},{"no":1343,"category":"동작·감각·생각","word":"树立","pinyin":"shùlì","meaning":"수립하다, 세우다","example":"学校积极引导学生树立正确的价值观。","examplePinyin":"Xuéxiào jījí yǐndǎo xuésheng shùlì zhèngquè de jiàzhíguān.","translation":"학교는 학생들이 올바른 가치관을 확립하도록 적극적으로 지도합니다.","sourceNo":4831},{"no":1344,"category":"동작·감각·생각","word":"输送","pinyin":"shūsòng","meaning":"수송하다","example":"这条管道专门用来输送清洁的自来水。","examplePinyin":"Zhè tiáo guǎndào zhuānmén yònglái shūsòng qīngjié de zìláishuǐ.","translation":"이 파이프는 깨끗한 수돗물을 운반하기 위해 특별히 설계되었습니다.","sourceNo":4836},{"no":1345,"category":"동작·감각·생각","word":"思路","pinyin":"sīlù","meaning":"사고의 흐름, 사고방식","example":"遇到难题时，他习惯冷静理清思路。","examplePinyin":"Yùdào nántí shí, tā xíguàn lěngjìng lǐqīng sīlù.","translation":"어려움에 직면했을 때 그는 자신의 생각을 침착하게 정리하는 데 익숙합니다.","sourceNo":4839},{"no":1346,"category":"동작·감각·생각","word":"思念","pinyin":"sīniàn","meaning":"그리워하다","example":"远在他乡的游子常常思念家中亲人。","examplePinyin":"Yuǎn zài tāxiāng de yóuzi chángcháng sīniàn jiāzhōng qīnrén.","translation":"집에서 멀리 떨어진 여행자들은 종종 집에 있는 사랑하는 사람을 그리워합니다.","sourceNo":4840},{"no":1347,"category":"동작·감각·생각","word":"损坏","pinyin":"sǔnhuài","meaning":"손상시키다, 훼손하다","example":"这件精美的瓷器不小心被损坏了。","examplePinyin":"Zhè jiàn jīngměi de cíqì bù xiǎoxīn bèi sǔnhuài le.","translation":"이 아름다운 도자기 조각이 실수로 손상되었습니다.","sourceNo":4850},{"no":1348,"category":"동작·감각·생각","word":"探索","pinyin":"tànsuǒ","meaning":"탐색하다","example":"科学家们不断探索未知的宇宙奥秘。","examplePinyin":"Kēxuéjiāmen búduàn tànsuǒ wèizhī de yǔzhòu àomì.","translation":"과학자들은 알려지지 않은 우주의 신비를 계속해서 탐구하고 있습니다.","sourceNo":4865},{"no":1349,"category":"동작·감각·생각","word":"逃","pinyin":"táo","meaning":"도망가다","example":"遇到危险时，他迅速逃到了安全地带。","examplePinyin":"Yùdào wēixiǎn shí, tā xùnsù táo dào le ānquán dedài.","translation":"위험에 처하면 재빨리 안전한 곳으로 도망쳤습니다.","sourceNo":4868},{"no":1350,"category":"동작·감각·생각","word":"掏","pinyin":"tāo","meaning":"꺼내다","example":"他从口袋里掏出手机准备拍照留念。","examplePinyin":"Tā cóng kǒudài lǐ tāochū shǒujī zhǔnbèi pāizhào liúniàn.","translation":"그는 주머니에서 휴대폰을 꺼내 사진 촬영을 준비했다.","sourceNo":4869},{"no":1351,"category":"동작·감각·생각","word":"逃跑","pinyin":"táopǎo","meaning":"도망가다","example":"小偷见状转身就想逃跑，却被抓住了。","examplePinyin":"Xiǎotōu jiànzhuàng zhuǎnshēn jiù xiǎng táopǎo, què bèi zhuāzhù le.","translation":"도둑은 뒤돌아서 도망치려 했으나 붙잡혔다.","sourceNo":4871},{"no":1352,"category":"동작·감각·생각","word":"淘汰","pinyin":"táotài","meaning":"도태되다, 탈락시키다","example":"这次考核中，成绩靠后的员工将被淘汰。","examplePinyin":"Zhè cì kǎohé zhōng, chéngjì kào hòu de yuángōng jiāng bèi táotài.","translation":"이 평가에서는 점수가 낮은 직원은 제외됩니다.","sourceNo":4873},{"no":1353,"category":"동작·감각·생각","word":"添","pinyin":"tiān","meaning":"더하다, 보태다","example":"请帮我再往锅里添一点儿开水。","examplePinyin":"Qǐng bāng wǒ zài wǎng guō lǐ tiān yìdiǎnr kāishuǐ.","translation":"냄비에 끓는 물을 조금 더 추가하도록 도와주세요.","sourceNo":4882},{"no":1354,"category":"동작·감각·생각","word":"添加","pinyin":"tiānjiā","meaning":"첨가하다","example":"制作蛋糕时可以适量添加一些牛奶。","examplePinyin":"Zhìzuò dàngāo shí kěyǐ shìliàng tiānjiā yìxiē niúnǎi.","translation":"케이크를 만들 때 우유를 조금 첨가할 수 있습니다.","sourceNo":4884},{"no":1355,"category":"동작·감각·생각","word":"调节","pinyin":"tiáojié","meaning":"조절하다","example":"请根据室内温度合理调节空调设置。","examplePinyin":"Qǐng gēnjù shìnèi wēndù hélǐ tiáojié kōngtiáo shèzhì.","translation":"실내 온도에 따라 에어컨 설정을 적절하게 조절해 주세요.","sourceNo":4891},{"no":1356,"category":"동작·감각·생각","word":"贴近","pinyin":"tiējìn","meaning":"가까이 다가가다, 밀착하다 / 가깝다","example":"这部纪录片的内容非常贴近真实生活。","examplePinyin":"Zhè bù jìlùpiàn de nèiróng fēicháng tiējìn zhēnshí shēnghuó.","translation":"이 다큐멘터리의 내용은 실제 생활과 매우 유사합니다.","sourceNo":4895},{"no":1357,"category":"동작·감각·생각","word":"听取","pinyin":"tīngqǔ","meaning":"청취하다","example":"领导认真听取了群众提出的意见。","examplePinyin":"Lǐngdǎo rènzhēn tīngqǔ le qúnzhòng tíchū de yìjiàn.","translation":"지도자들은 대중이 제시하는 의견을 주의 깊게 경청했다.","sourceNo":4899},{"no":1358,"category":"동작·감각·생각","word":"提取","pinyin":"tíqǔ","meaning":"추출하다, 인출하다","example":"他去银行提取了一笔现金准备装修。","examplePinyin":"Tā qù yínháng tíqǔ le yì bǐ xiànjīn zhǔnbèi zhuāngxiū.","translation":"그는 집을 수리할 현금을 찾으러 은행에 갔어요.","sourceNo":4900},{"no":1359,"category":"동작·감각·생각","word":"提示","pinyin":"tíshì","meaning":"힌트를 주다","example":"系统弹出了一个密码错误的提示。","examplePinyin":"Xìtǒng dàn chū le yí ge mìmǎ cuòwù de tíshì.","translation":"시스템은 비밀번호가 올바르지 않다는 메시지를 표시합니다.","sourceNo":4901},{"no":1360,"category":"동작·감각·생각","word":"铜","pinyin":"tóng","meaning":"구리","example":"这尊古老的雕像是用青铜铸造而成的。","examplePinyin":"Zhè zūn gǔlǎo de diāoxiàng shì yòng qīngtóng zhùzào ér chéng de.","translation":"이 고대 조각상은 청동으로 주조되었습니다.","sourceNo":4903},{"no":1361,"category":"동작·감각·생각","word":"痛快","pinyin":"tòngkuài","meaning":"통쾌하다, 즐겁다","example":"大家一起唱歌跳舞，玩得非常痛快。","examplePinyin":"Dàjiā yìqǐ chànggē tiàowǔ, wán de fēicháng tòngkuài.","translation":"모두가 함께 노래하고 춤추며 즐거운 시간을 보냈습니다.","sourceNo":4910},{"no":1362,"category":"동작·감각·생각","word":"透","pinyin":"tòu","meaning":"관통하다, 스며들다 / 투명하다","example":"阳光透过窗帘，洒进了整个房间。","examplePinyin":"Yángguāng tòuguò chuānglián, sǎ jìn le zhěngge fángjiān.","translation":"햇빛이 커튼을 통해 방 전체로 들어옵니다.","sourceNo":4916},{"no":1363,"category":"동작·감각·생각","word":"偷","pinyin":"tōu","meaning":"훔치다 / 몰래","example":"小偷趁夜色偷走了店里的贵重物品。","examplePinyin":"Xiǎotōu chèn yèsè tōuzǒu le diànlǐ de guìzhòng wùpǐn.","translation":"도둑은 밤에 가게에서 귀중품을 훔쳤습니다.","sourceNo":4917},{"no":1364,"category":"동작·감각·생각","word":"透过","pinyin":"tòuguò","meaning":"~을 통해","example":"透过望远镜，可以清楚看到远方景色。","examplePinyin":"Tòuguò wàngyuǎnjìng, kěyǐ qīngchu kàndào yuǎnfāng jǐngsè.","translation":"망원경을 통해 먼 풍경을 선명하게 볼 수 있습니다.","sourceNo":4918},{"no":1365,"category":"동작·감각·생각","word":"吐¹","pinyin":"tù","meaning":"토하다","example":"孩子晕车后忍不住吐了出来。","examplePinyin":"Háizi yùnchē hòu rěnbúzhù tù le chūlai.","translation":"아이는 차멀미를 한 후 구토를 참을 수 없었습니다.","sourceNo":4926},{"no":1366,"category":"동작·감각·생각","word":"吐²","pinyin":"tǔ","meaning":"뱉다","example":"请文明出行，不要随地吐痰。","examplePinyin":"Qǐng wénmíng chūxíng, búyào suíde tǔtán.","translation":"문명화된 방식으로 여행하시고 아무데도 침을 뱉지 마십시오.","sourceNo":4927},{"no":1367,"category":"동작·감각·생각","word":"推测","pinyin":"tuīcè","meaning":"추측하다","example":"根据现场线索，警方推测出了真相。","examplePinyin":"Gēnjù xiànchǎng xiànsuǒ, jǐngfāng tuīcè chū le zhēnxiàng.","translation":"경찰은 현장의 단서를 바탕으로 진실을 추론했다.","sourceNo":4935},{"no":1368,"category":"동작·감각·생각","word":"吞","pinyin":"tūn","meaning":"삼키다","example":"他一口把药片吞了下去。","examplePinyin":"Tā yì kǒu bǎ yàopiàn tūn le xiàqu.","translation":"그는 알약을 단번에 삼켰습니다.","sourceNo":4940},{"no":1369,"category":"동작·감각·생각","word":"拖","pinyin":"tuō","meaning":"끌다, 미루다","example":"别再拖延，赶紧把任务完成吧。","examplePinyin":"Bié zài tuōyán, gǎnjǐn bǎ rènwu wánchéng ba.","translation":"더 이상 미루지 말고 일을 완수하세요.","sourc ià","meaning":"놀라게 하다","example":"突然的巨响把他吓了一大跳。","examplePinyin":"Tūrán de jùxiǎng bǎ tā xià le yídàtiào.","translation":"갑작스런 큰 소리에 그는 깜짝 놀랐다.","sourceNo":5002},{"no":1379,"category":"동작·감각·생각","word":"嫌","pinyin":"xián","meaning":"싫어하다, 꺼리다","example":"他嫌这份工作太累，最终辞职了。","examplePinyin":"Tā xián zhè fèn gōngzuò tài lèi, zuìzhōng cízhí le.","translation":"그는 일이 너무 힘들다고 생각하고 결국 사임했습니다.","sourceNo":5006},{"no":1380,"category":"동작·감각·생각","word":"限","pinyin":"xiàn","meaning":"제한하다","example":"这次活动名额有限，先到先得。","examplePinyin":"Zhè cì huódòng míng'é yǒuxiàn, xiān dào xiān de.","translation":"이번 행사는 정원이 제한되어 있으며 선착순이에요.","sourceNo":5007},{"no":1381,"category":"동작·감각·생각","word":"显","pinyin":"xiǎn","meaning":"나타나다 / 뚜렷하다","example":"化妆之后，她的皮肤显得更加白皙。","examplePinyin":"Huàzhuāng zhīhòu, tā de pífū xiǎnde gèngjiā báixī.","translation":"메이크업을 한 후 그녀의 피부는 더욱 하얗게 보였다.","sourceNo":5009},{"no":1382,"category":"동작·감각·생각","word":"向往","pinyin":"xiàngwǎng","meaning":"동경하다","example":"每个年轻人都向往自由美好的未来。","examplePinyin":"Měi ge niánqīngrén dōu xiàngwǎng zìyóu měihǎo de wèilái.","translation":"모든 젊은이는 자유롭고 아름다운 미래를 갈망합니다.","sourceNo":5022},{"no":1383,"category":"동작·감각·생각","word":"陷入","pinyin":"xiànrù","meaning":"빠지다","example":"由于决策失误，公司陷入了困境。","examplePinyin":"Yóuyú juécè shīwù, gōngsī xiànrù le kùnjìng.","translation":"잘못된 의사결정으로 인해 회사가 어려움을 겪었습니다.","sourceNo":5027},{"no":1384,"category":"동작·감각·생각","word":"消除","pinyin":"xiāochú","meaning":"제거하다, 해소하다","example":"双方经过沟通，终于消除了误会。","examplePinyin":"Shuāngfāng jīngguò gōutōng, zhōngyú xiāochú le wùhuì.","translation":"의사 소통 후 양측은 마침내 오해를 풀었습니다.","sourceNo":5032},{"no":1385,"category":"동작·감각·생각","word":"消耗","pinyin":"xiāohào","meaning":"소모하다","example":"高强度运动会消耗大量的体力。","examplePinyin":"Gāoqiángdù yùndònghuì xiāohào dàliàng de tǐlì.","translation":"고강도 운동은 많은 에너지를 소비합니다.","sourceNo":5035},{"no":1386,"category":"동작·감각·생각","word":"消灭","pinyin":"xiāomiè","meaning":"소멸시키다, 없애다","example":"农民采取多种办法，及时消灭田里的害虫。","examplePinyin":"Nóngmín cǎiqǔ duōzhǒng b anslation":"그의 마음 속에는 그의 어머니가 언제나 가장 위대한 사람이다.","sourceNo":5065},{"no":1395,"category":"동작·감각·생각","word":"信念","pinyin":"xìnniàn","meaning":"신념","example":"坚定的信念支撑他走过了艰难岁月。","examplePinyin":"Jiāndìng de xìnniàn zhīchēng tā zǒuguò le jiānnán suìyuè.","translation":"그의 확고한 믿음은 어려운 시기에도 그를 지탱해 주었습니다.","sourceNo":5067},{"no":1396,"category":"동작·감각·생각","word":"心疼","pinyin":"xīnténg","meaning":"마음 아파하다, 안타까워하다","example":"看到孩子生病，妈妈感到十分心疼。","examplePinyin":"Kàndào háizi shēngbìng, māma gǎndào shífēn xīnténg.","translation":"아이가 아플 때 엄마는 매우 괴로워합니다.","sourceNo":5069},{"no":1397,"category":"동작·감각·생각","word":"心愿","pinyin":"xīnyuàn","meaning":"소원","example":"他终于实现了环游世界的心愿。","examplePinyin":"Tā zhōngyú shíxiàn le huányóu shìjiè de xīnyuàn.","translation":"그는 마침내 세계를 여행하고 싶은 소망을 실현했습니다.","sourceNo":5072},{"no":1398,"category":"동작·감각·생각","word":"吸取","pinyin":"xīqǔ","meaning":"흡수하다, 받아들이다","example":"我们应该从失败中吸取宝贵教训。","examplePinyin":"Wǒmen yīnggāi cóng shībài zhōng xīqǔ bǎoguì jiàoxùn.","translation":"우리는 실패로부터 귀중한 교훈을 배워야 합니다.","sourceNo":5076},{"no":1399,"category":"동작·감각·생각","word":"旋转","pinyin":"xuánzhuǎn","meaning":"회전하다","example":"地球每天绕着地轴不停旋转。","examplePinyin":"Dìqiú měi tiān rào zhe dezhóu bùtíng xuánzhuǎn.","translation":"지구는 매일 축을 중심으로 회전합니다.","sourceNo":5086},{"no":1400,"category":"동작·감각·생각","word":"循环","pinyin":"xúnhuán","meaning":"순환하다","example":"保持运动有助于促进血液循环。","examplePinyin":"Bǎochí yùndòng yǒuzhùyú cùjìn xuèyè xúnhuán.","translation":"활동적으로 지내는 것은 혈액 순환을 개선하는 데 도움이 됩니다.","sourceNo":5096},{"no":1401,"category":"동작·감각·생각","word":"寻求","pinyin":"xúnqiú","meaning":"찾다, 모색하다","example":"遇到困难时，他主动向朋友寻求帮助。","examplePinyin":"Yùdào kùnnan shí, tā zhǔdòng xiàng péngyou xúnqiú bāngzhù.","translation":"그는 어려움에 직면하면 솔선하여 친구들에게 도움을 구합니다.","sourceNo":5097},{"no":1402,"category":"동작·감각·생각","word":"淹","pinyin":"yān","meaning":"잠기다, 물에 잠기다","example":"突如其来的洪水淹没了整片农田。","examplePinyin":"Tū rú qí lái de hóngshuǐ yānmò le zhěngpiàn nóngtián.","translation":"갑작스러운 홍수로 농경지 전체가 물에 잠겼습니다.","sourceNo":5101},{"no":1403,"category":"동작·감각·생각","word":"仰","pinyin":"yǎng","meaning":"우러러보다, 고개를 젖히다","example":"他仰起头，静静地欣赏满天繁星。","examplePinyin":"Tā yǎngqǐ tóu, jìngjìngde xīnshǎng mǎntiān fánxīng.","translation":"그는 고개를 들고 조용히 하늘의 별들을 감상했습니다.","sourceNo":5103},{"no":1404,"category":"동작·감각·생각","word":"眼光","pinyin":"yǎnguāng","meaning":"안목, 시선","example":"他挑选商品的眼光一向十分独到。","examplePinyin":"Tā tiāoxuǎn shāngpǐn de yǎnguāng yíxiàng shífēn dúdào.","translation":"그는 물건을 고르는 안목이 늘 남달라요.","sourceNo":5108},{"no":1405,"category":"동작·감각·생각","word":"淹没","pinyin":"yānmò","meaning":"물에 잠기다, 침몰시키다","example":"这场洪水几乎淹没了整个村庄。","examplePinyin":"Zhè chǎng hóngshuǐ jīhū yānmò le zhěngge cūnzhuāng.","translation":"홍수로 인해 마을 전체가 거의 물에 잠겼습니다.","sourceNo":5115},{"no":1406,"category":"동작·감각·생각","word":"延期","pinyin":"yánqī","meaning":"연기하다","example":"由于天气原因，比赛不得不延期举行。","examplePinyin":"Yóuyú tiānqì yuányīn, bǐsài bùdébù yánqī jǔxíng.","translation":"기상 상황으로 인해 경기가 연기될 수밖에 없었습니다.","sourceNo":5116},{"no":1407,"category":"동작·감각·생각","word":"延伸","pinyin":"yánshēn","meaning":"뻗다, 연장되다","example":"这条道路一直向远方的山脉延伸。","examplePinyin":"Zhè tiáo dàolù yìzhí xiàng yuǎnfāng de shānmài yánshēn.","translation":"이 길은 멀리 있는 산을 향해 계속된다.","sourceNo":5118},{"no":1408,"category":"동작·감각·생각","word":"延续","pinyin":"yánxù","meaning":"지속되다, 이어지다","example":"这项传统习俗一直延续到了今天。","examplePinyin":"Zhè xiàng chuántǒng xísú yìzhí yánxù dào le jīntiān.","translation":"이 전통적인 풍습은 오늘날까지 계속되고 있습니다.","sourceNo":5120},{"no":1409,"category":"동작·감각·생각","word":"压缩","pinyin":"yāsuō","meaning":"압축하다","example":"请把这份文件压缩后再发送给我。","examplePinyin":"Qǐng bǎ zhè fèn wénjiàn yāsuō hòu zài fāsònggěi wǒ.","translation":"나에게 보내기 전에 이 파일을 압축해 주세요.","sourceNo":5129},{"no":1410,"category":"동작·감각·생각","word":"疑惑","pinyin":"yíhuò","meaning":"의아해하다; 의문","example":"他脸上露出了疑惑不解的表情。","examplePinyin":"Tā liǎnshàng lùchū le yíhuò bùjiě de biǎoqíng.","translation":"그의 얼굴에는 당황한 표정이 떠올랐다.","sourceNo":5147},{"no":1411,"category":"동작·감각·생각","word":"依赖","pinyin":"yīlài","meaning":"의지하다","example":"孩子过度依赖父母不利于成长。","examplePinyin":"Háizi guòdù yīlài fùmǔ búlìyú chéngzhǎng.","translation":"아이가 부모에게 지나치게 의존하면 성장에 좋지 않아요.","sourceNo":5150},{"no":1412,"category":"동작·감각·생각","word":"印","pinyin":"yìn","meaning":"도장 / 도장을 찍다, 인쇄하다","example":"请在合同上盖好公司的印，再寄给客户。","examplePinyin":"Qǐng zài hétong shàng gài hǎo gōngsī de yìn, zàijì gěi kèhù.","translation":"계약서에 회사 도장을 찍은 뒤 고객에게 보내 주세요.","sourceNo":5158},{"no":1413,"category":"동작·감각·생각","word":"引","pinyin":"yǐn","meaning":"이끌다, 끌다","example":"一场大火引起了社会广泛关注。","examplePinyin":"Yì chǎng dàhuǒ yǐnqǐ le shèhuì guǎngfàn guānzhù.","translation":"화재는 사회 전반에 큰 우려를 불러일으켰습니다.","sourceNo":5159},{"no":1414,"category":"동작·감각·생각","word":"隐藏","pinyin":"yǐncáng","meaning":"숨기다","example":"他表面平静，内心却隐藏着痛苦。","examplePinyin":"Tā biǎomiàn píngjìng, nèixīn què yǐncáng zhe tòngkǔ.","translation":"겉으로는 평온하지만 속으로는 아픔이 숨어있습니다.","sourceNo":5161},{"no":1415,"category":"동작·감각·생각","word":"引导","pinyin":"yǐndǎo","meaning":"인도하다, 이끌다","example":"老师耐心引导学生找到解题思路。","examplePinyin":"Lǎoshī nàixīn yǐndǎo xuésheng zhǎodào jiětí sīlù.","translation":"교사는 학생들이 문제 해결을 위한 아이디어를 찾을 수 있도록 인내심을 갖고 지도합니다.","sourceNo":5162},{"no":1416,"category":"동작·감각·생각","word":"引发","pinyin":"yǐnfā","meaning":"야기하다","example":"这起事件引发了媒体广泛报道。","examplePinyin":"Zhè qǐ shìjiàn yǐnfā le méitǐ guǎngfàn bàodào.","translation":"이 사건은 광범위한 언론 보도를 촉발시켰습니다.","sourceNo":5163},{"no":1417,"category":"동작·감각·생각","word":"引入","pinyin":"yǐnrù","meaning":"도입하다","example":"学校最近引入了先进的教学设备。","examplePinyin":"Xuéxiào zuìjìn yǐnrù le xiānjìn de jiàoxué shèbèi.","translation":"이 학교는 최근 첨단 교육 장비를 도입했습니다.","sourceNo":5169},{"no":1418,"category":"동작·감각·생각","word":"抑制","pinyin":"yìzhì","meaning":"억제하다","example":"药物有效抑制了病情继续恶化。","examplePinyin":"Yàowù yǒuxiào yìzhì le bìngqíng jìxù èhuà.","translation":"그 약은 상태가 악화되는 것을 효과적으로 억제했습니다.","sourceNo":5188},{"no":1419,"category":"동작·감각·생각","word":"涌现","pinyin":"yǒngxiàn","meaning":"대거 출현하다","example":"这个时代涌现出许多杰出的人才。","examplePinyin":"Zhè ge shídài yǒngxiàn chū xǔduō jiéchū de réncái.","translation":"이 시대에는 뛰어난 인재들이 많이 배출되었습니다.","sourceNo":5194},{"no":1420,"category":"동작·감각·생각","word":"优化","pinyin":"yōuhuà","meaning":"최적화하다","example":"公司正在优化内部管理流程，提高工作效率。","examplePinyin":"Gōngsī zhèngzài yōuhuà nèibù guǎnlǐ liúchéng, tígāo gōngzuò xiàolǜ.","translation":"회사는 업무 효율을 높이기 위해 내부 관리 절차를 개선하고 있어요.","sourceNo":5197},{"no":1421,"category":"동작·감각·생각","word":"预定","pinyin":"yùdìng","meaning":"미리 정하다; 예정하다","example":"会议将按预定的时间开始，请大家提前到场。","examplePinyin":"Huìyì jiāng àn yùdìng de shíjiān kāishǐ, qǐng dàjiā tíqián dàochǎng.","translation":"회의는 예정된 시간에 시작하니 미리 와 주세요.","sourceNo":5221},{"no":1422,"category":"동작·감각·생각","word":"预料","pinyin":"yùliào","meaning":"예상하다 / 예상","example":"事情的发展完全出乎他的预料。","examplePinyin":"Shìqing de fāzhǎn wánquán chūhū tā de yùliào.","translation":"일의 전개는 그의 예상을 완전히 벗어났어요.","sourceNo":5227},{"no":1423,"category":"동작·감각·생각","word":"预期","pinyin":"yùqī","meaning":"예상하다; 기대하다","example":"这次销售业绩超过了公司预期。","examplePinyin":"Zhè cì xiāoshòu yèjì chāoguò le gōngsī yùqī.","translation":"이번에 판매 실적은 회사의 기대를 뛰어 넘었습니다.","sourceNo":5233},{"no":1424,"category":"동작·감각·생각","word":"欲望","pinyin":"yùwàng","meaning":"욕망","example":"过度的物质欲望容易带来烦恼。","examplePinyin":"Guòdù de wùzhì yùwàng róngyì dàilái fánnǎo.","translation":"과도한 물질적 욕구는 쉽게 문제를 일으킬 수 있습니다.","sourceNo":5237},{"no":1425,"category":"동작·감각·생각","word":"在意","pinyin":"zàiyì","meaning":"신경 쓰다, 마음에 두다","example":"他从不太在意别人对他的评价。","examplePinyin":"Tā cóngbú tài zàiyì biéren duì tā de píngjià.","translation":"그는 다른 사람들이 자신에 대해 어떻게 생각하는지 별로 신경 쓰지 않았습니다.","sourceNo":5245},{"no":1426,"category":"동작·감각·생각","word":"赞赏","pinyin":"zànshǎng","meaning":"찬탄하다, 높이 평가하다","example":"老师对他的进步表示由衷赞赏。","examplePinyin":"Lǎoshī duì tā de jìnbù biǎoshì yóuzhōng zànshǎng.","translation":"선생님은 그의 발전을 진심으로 높이 평가하셨어요.","sourceNo":5246},{"no":1427,"category":"동작·감각·생각","word":"赞同","pinyin":"zàntóng","meaning":"찬성하다","example":"大多数人对这项提议表示赞同。","examplePinyin":"Dàduō shù rén duì zhè xiàng tíyì biǎoshì zàntóng.","translation":"대부분의 사람들은 그 제안을 승인했습니다.","sourceNo":5247},{"no":1428,"category":"동작·감각·생각","word":"遭到","pinyin":"zāodào","meaning":"(불행 등을) 당하다","example":"由于操作失误，他遭到领导批评。","examplePinyin":"Yóuyú cāozuò shīwù, tā zāodào lǐngdǎo pīpíng.","translation":"운영 오류로 인해 그는 지도자들로부터 비난을 받았습니다.","sourceNo":5248},{"no":1429,"category":"동작·감각·생각","word":"遭受","pinyin":"zāoshòu","meaning":"(불행 등을) 당하다","example":"这个地区连续多年遭受干旱侵袭。","examplePinyin":"Zhè ge dìqū liánxù duōnián zāoshòu gānhàn qīnxí.","translation":"이 지역은 수년 동안 가뭄에 시달렸습니다.","sourceNo":5250},{"no":1430,"category":"동작·감각·생각","word":"遭遇","pinyin":"zāoyù","meaning":"만나다, 조우하다 / 처지","example":"他在创业路上遭遇了不少挫折。","examplePinyin":"Tā zài chuàngyè lùshang zāoyù le bùshǎo cuòzhé.","translation":"그는 창업 여정에서 많은 어려움을 겪었습니다.","sourceNo":5252},{"no":1431,"category":"동작·감각·생각","word":"炸","pinyin":"zhà","meaning":"터지다; 폭파하다","example":"过了一会儿，那个气球突然炸了。","examplePinyin":"Guò le yíhuìr, nà ge qìqiú tūrán zhà le.","translation":"잠시 후 그 풍선이 갑자기 터졌어요.","sourceNo":5254},{"no":1432,"category":"동작·감각·생각","word":"扎","pinyin":"zhā","meaning":"찌르다","example":"她缝衣服时，不小心用针扎破了手指。","examplePinyin":"Tā féngyīfu shí, bù xiǎoxīn yòng zhēn zhāpò le shǒuzhǐ.","translation":"그녀는 옷을 꿰매다가 실수로 바늘에 손가락을 찔렸어요.","sourceNo":5255},{"no":1433,"category":"동작·감각·생각","word":"粘","pinyin":"zhān","meaning":"붙이다; 달라붙다","example":"请把这张纸粘在纸板上，不要留下气泡。","examplePinyin":"Qǐng bǎ zhè zhāng zhǐ zhān zài zhǐbǎn shàng, búyào liúxià qìpào.","translation":"기포가 생기지 않게 이 종이를 판지에 붙여 주세요.","sourceNo":5256},{"no":1434,"category":"동작·감각·생각","word":"障碍","pinyin":"zhàng'ài","meaning":"장애, 방해","example":"他成功克服了创业路上的重重障碍。","examplePinyin":"Tā chénggōng kèfú le chuàngyè lùshang de chóngchóng zhàng'ài.","translation":"그는 창업의 길에서 많은 장애물을 성공적으로 극복했습니다.","sourceNo":5260},{"no":1435,"category":"동작·감각·생각","word":"占据","pinyin":"zhànjù","meaning":"차지하다","example":"这家公司在市场上占据领先地位。","examplePinyin":"Zhè jiā gōngsī zài shìchǎng shàng zhànjù lǐngxiān dìwèi.","translation":"회사는 시장에서 선도적인 위치를 차지하고 있습니다.","sourceNo":5263},{"no":1436,"category":"동작·감각·생각","word":"战胜","pinyin":"zhànshèng","meaning":"이겨내다, 승리하다","example":"凭借顽强意志，他战胜了病魔。","examplePinyin":"Píngjiè wánqiáng yìzhì, tā zhànshèng le bìngmó.","translation":"그는 강한 의지로 질병을 이겨냈습니다.","sourceNo":5264},{"no":1437,"category":"동작·감각·생각","word":"粘贴","pinyin":"zhāntiē","meaning":"붙이다","example":"请把标签整齐地粘贴在包装上。","examplePinyin":"Qǐng bǎ biāoqiān zhěngqí de zhāntiē zài bāozhuāng shàng.","translation":"라벨을 패키지에 깔끔하게 부착해주세요.","sourceNo":5265},{"no":1438,"category":"동작·감각·생각","word":"占有","pinyin":"zhànyǒu","meaning":"점유하다","example":"这个品牌在行业中占有重要地位。","examplePinyin":"Zhè ge pǐnpái zài hángyè zhōng zhànyǒu zhòngyào dìwèi.","translation":"이 브랜드는 업계에서 중요한 위치를 차지하고 있습니다.","sourceNo":5267},{"no":1439,"category":"동작·감각·생각","word":"招","pinyin":"zhāo","meaning":"모집하다, 수를 쓰다","example":"公司最近在招聘几名新员工。","examplePinyin":"Gōngsī zuìjìn zài zhāopìn jǐ míng xīn yuángōng.","translation":"회사는 최근 여러 명의 새로운 직원을 채용했습니다.","sourceNo":5269},{"no":1440,"category":"동작·감각·생각","word":"招手","pinyin":"zhāoshǒu","meaning":"손짓하다, 손을 흔들다","example":"他站在站台上向远处的朋友招手。","examplePinyin":"Tā zhàn zài zhàntái shàng xiàng yuǎnchù de péngyou zhāoshǒu.","translation":"그는 승강장에서 멀리 있는 친구에게 손을 흔들어요.","sourceNo":5273},{"no":1441,"category":"동작·감각·생각","word":"折","pinyin":"zhé","meaning":"접다, 꺾이다","example":"他小心地把纸张折成一只小船。","examplePinyin":"Tā xiǎoxīn de bǎ zhǐzhāng zhéchéng yì zhī xiǎochuán.","translation":"그는 조심스럽게 종이를 접어 보트 모양으로 만들었습니다.","sourceNo":5275},{"no":1442,"category":"동작·감각·생각","word":"睁","pinyin":"zhēng","meaning":"눈을 뜨다","example":"他费力地睁开了沉重的眼皮。","examplePinyin":"Tā fèilì de zhēngkāi le chénzhòng de yǎnpí.","translation":"그는 무거운 눈꺼풀을 열려고 애썼다.","sourceNo":5278},{"no":1443,"category":"동작·감각·생각","word":"争夺","pinyin":"zhēngduó","meaning":"쟁탈하다","example":"两支球队正在激烈争夺冠军宝座。","examplePinyin":"Liǎng zhī qiúduì zhèngzài jīliè zhēngduó guànjūn bǎozuò.","translation":"두 팀은 우승을 놓고 치열한 경쟁을 펼치고 있다.","sourceNo":5281},{"no":1444,"category":"동작·감각·생각","word":"征求","pinyin":"zhēngqiú","meaning":"구하다, 요청하다","example":"学校向学生征求了对食堂的意见。","examplePinyin":"Xuéxiào xiàng xuésheng zhēngqiú le duì shítáng de yìjiàn.","translation":"학교에서는 학생들에게 구내식당에 대한 의견을 물었습니다.","sourceNo":5285},{"no":1445,"category":"동작·감각·생각","word":"证实","pinyin":"zhèngshí","meaning":"증명하다, 확인하다","example":"经过调查，这个消息已经得到证实。","examplePinyin":"Jīngguò diàochá, zhè ge xiāoxi yǐjīng dédào zhèngshí.","translation":"조사 결과 이 소식이 사실임이 확인되었어요.","sourceNo":5286},{"no":1446,"category":"동작·감각·생각","word":"制","pinyin":"zhì","meaning":"만들다, 제조하다","example":"工匠用传统方法制出了一套精美的茶具。","examplePinyin":"Gōngjiàng yòng chuántǒng fāngfǎ zhìchū le yí tào jīngměi de chájù.","translation":"장인은 전통 방식으로 정교한 다기 한 벌을 만들었어요.","sourceNo":5294},{"no":1447,"category":"동작·감각·생각","word":"支撑","pinyin":"zhīchēng","meaning":"지탱하다","example":"几根木柱牢牢支撑着整座房屋。","examplePinyin":"Jǐgēn mùzhù láoláo zhīchēng zhe zhěngzuò fángwū.","translation":"여러 개의 나무 기둥이 집 전체를 단단히 지탱하고 있습니다.","sourceNo":5298},{"no":1448,"category":"동작·감각·생각","word":"指定","pinyin":"zhǐdìng","meaning":"지정하다","example":"请大家在指定地点集合等候。","examplePinyin":"Qǐng dàjiā zài zhǐdìng dìdiǎn jíhé děnghòu.","translation":"지정된 장소에 모여서 기다려주세요.","sourceNo":5301},{"no":1449,"category":"동작·감각·생각","word":"指挥","pinyin":"zhǐhuī","meaning":"지휘하다 / 지휘자","example":"交警在路口指挥来往的车辆。","examplePinyin":"Jiāojǐng zài lùkǒu zhǐhuī láiwǎng de chēliàng.","translation":"교통 경찰은 교차로에서 지나가는 차량을 지시합니다.","sourceNo":5305},{"no":1450,"category":"동작·감각·생각","word":"质疑","pinyin":"zhìyí","meaning":"의문을 제기하다","example":"有专家对这项研究结果提出质疑。","examplePinyin":"Yǒu zhuānjiā duì zhè xiàng yánjiū jiēguǒ tíchū zhìyí.","translation":"일부 전문가들은 이번 연구 결과에 의문을 제기했습니다.","sourceNo":5314},{"no":1451,"category":"동작·감각·생각","word":"指责","pinyin":"zhǐzé","meaning":"질책하다, 비난하다","example":"他被同事无端指责，感到很委屈。","examplePinyin":"Tā bèi tóngshì wúduān zhǐzé, gǎndào hěn wěiqu.","translation":"그는 동료들로부터 부당한 비난을 받고 억울함을 느꼈다.","sourceNo":5318},{"no":1452,"category":"동작·감각·생각","word":"中","pinyin":"zhòng","meaning":"맞다, 명중하다","example":"他练习射箭多年，每次都能正中靶心。","examplePinyin":"Tā liànxí shèjiàn duōnián, měi cì dōu néng zhèngzhòng bǎxīn.","translation":"그는 오랫동안 활쏘기를 연습해 매번 과녁 한가운데를 맞혀요.","sourceNo":5320},{"no":1453,"category":"동작·감각·생각","word":"中断","pinyin":"zhōngduàn","meaning":"중단되다","example":"由于信号不好，通话突然中断了。","examplePinyin":"Yóuyú xìnhào bùhǎo, tōnghuà tūrán zhōngduàn le.","translation":"신호 불량으로 인해 통화가 갑자기 중단되었습니다.","sourceNo":5326},{"no":1454,"category":"동작·감각·생각","word":"转","pinyin":"zhuàn","meaning":"돌다, 회전하다","example":"摩天轮缓缓地在夜空中旋转移动。","examplePinyin":"Mótiānlún huǎnhuǎn de zài yèkōng zhōng xuánzhuàn yídòng.","translation":"관람차는 밤하늘에 천천히 회전합니다.","sourceNo":5342},{"no":1455,"category":"동작·감각·생각","word":"转动","pinyin":"zhuàndòng","meaning":"돌리다, 회전하다","example":"他伸手转动了一下门上的把手。","examplePinyin":"Tā shēnshǒu zhuàndòng le yíxià ménshàng de bǎshǒu.","translation":"그는 손을 뻗어 문 손잡이를 돌렸다.","sourceNo":5344},{"no":1456,"category":"동작·감각·생각","word":"转换","pinyin":"zhuǎnhuàn","meaning":"전환하다","example":"请把这份文件转换成另一种格式。","examplePinyin":"Qǐng bǎ zhè fèn wénjiàn zhuǎnhuàn chéng lìng yì zhǒng géshì.","translation":"이 문서를 다른 형식으로 변환하세요.","sourceNo":5347},{"no":1457,"category":"동작·감각·생각","word":"转交","pinyin":"zhuǎnjiāo","meaning":"전달하다","example":"请帮我把这封信转交给经理本人。","examplePinyin":"Qǐng bāng wǒ bǎ zhè fēngxìn zhuǎnjiāo gěi jīnglǐ běnrén.","translation":"이 편지를 관리자에게 직접 전달할 수 있도록 도와주세요.","sourceNo":5348},{"no":1458,"category":"동작·감각·생각","word":"转身","pinyin":"zhuǎnshēn","meaning":"몸을 돌리다","example":"说完这句话，他转身离开了房间。","examplePinyin":"Shuōwán zhè jù huà, tā zhuǎnshēn líkāi le fángjiān.","translation":"이 말을 한 뒤 그는 몸을 돌려 방을 나갔다.","sourceNo":5352},{"no":1459,"category":"동작·감각·생각","word":"转移","pinyin":"zhuǎnyí","meaning":"이전하다, 옮기다","example":"医生把病人转移到了重症监护室。","examplePinyin":"Yīshēng bǎ bìngrén zhuǎnyí dào le zhòngzhèng jiānhùshì.","translation":"의사들은 환자를 중환자실로 옮겼습니다.","sourceNo":5354},{"no":1460,"category":"동작·감각·생각","word":"追究","pinyin":"zhuījiū","meaning":"추궁하다","example":"事故发生后，警方将追究相关责任。","examplePinyin":"Shìgù fāshēng hòu, jǐngfāng jiāng zhuījiū xiāngguān zérèn.","translation":"사고가 나자 경찰은 관련자들의 책임을 추궁할 예정이에요.","sourceNo":5364},{"no":1461,"category":"동작·감각·생각","word":"捉","pinyin":"zhuō","meaning":"잡다","example":"孩子们在草丛里追逐捕捉蝴蝶。","examplePinyin":"Háizimen zài cǎocónglǐ zhuīzhú bǔzhuō húdié.","translation":"아이들은 풀밭에서 나비를 쫓아다닙니다.","sourceNo":5368},{"no":1462,"category":"동작·감각·생각","word":"主张","pinyin":"zhǔzhāng","meaning":"주장하다 / 주장","example":"他一直主张通过教育改变命运。","examplePinyin":"Tā yìzhí zhǔzhāng tōngguò jiàoyù gǎibiàn mìngyùn.","translation":"그는 항상 교육을 통해 운명을 바꿀 수 있다고 주장해 왔습니다.","sourceNo":5373},{"no":1463,"category":"동작·감각·생각","word":"自豪","pinyin":"zìháo","meaning":"자랑스럽다","example":"看到孩子获奖，父母感到十分自豪。","examplePinyin":"Kàndào háizi huòjiǎng, fùmǔ gǎndào shífēn zìháo.","translation":"부모들은 자녀가 상을 받는 것을 보고 매우 자랑스러워합니다.","sourceNo":5377},{"no":1464,"category":"동작·감각·생각","word":"阻碍","pinyin":"zǔ'ài","meaning":"방해하다 / 방해","example":"缺乏经验成了他成功路上的阻碍。","examplePinyin":"Quēfá jīngyàn chéng le tā chénggōng lùshang de zǔ'ài.","translation":"그의 경험 부족은 그의 성공을 방해했습니다.","sourceNo":5394},{"no":1465,"category":"동작·감각·생각","word":"钻","pinyin":"zuān","meaning":"뚫다, 파고들다","example":"小猫敏捷地钻进了狭窄的缝隙里。","examplePinyin":"Xiǎomāo mǐnjiéde zuānjìn le xiázhǎi de fèngxì lǐ.","translation":"새끼 고양이는 빠르게 좁은 틈으로 들어갔습니다.","sourceNo":5395},{"no":1466,"category":"동작·감각·생각","word":"阻挡","pinyin":"zǔdǎng","meaning":"막다, 저지하다","example":"任何困难都无法阻挡他前进的脚步。","examplePinyin":"Rènhé kùnnan dōu wúfǎ zǔdǎng tā qiánjìn de jiǎobù.","translation":"어떤 어려움도 그가 앞으로 나아가는 것을 막을 수 없습니다.","sourceNo":5396},{"no":1467,"category":"성질·상태·문법","word":"白白","pinyin":"báibái","meaning":"헛되이, 공연히","example":"不要白白浪费了这么好的学习机会。","examplePinyin":"Búyào báibái làngfèi le zhème hǎo de xuéxí jīhuì.","translation":"이렇게 좋은 배움의 기회를 헛되이 낭비하지 마세요.","sourceNo":3608},{"no":1468,"category":"성질·상태·문법","word":"被动","pinyin":"bèidòng","meaning":"수동적, 소극적","example":"他比较被动，总是要别人催促才去行动。","examplePinyin":"Tā bǐjiào bèidòng, zǒngshì yào biéren cuīcù cái qù xíngdòng.","translation":"그는 상대적으로 소극적이며 행동을 취하도록 촉구하는 다른 사람이 항상 필요합니다.","sourceNo":3634},{"no":1469,"category":"성질·상태·문법","word":"本身","pinyin":"běnshēn","meaning":"본체, 그 자체","example":"问题本身并不复杂，只是我们没有找到方法。","examplePinyin":"Wèntí běnshēn bìng bú fùzá, zhǐshì wǒmen méiyǒu zhǎodào fāngfǎ.","translation":"문제 자체는 복잡한 것이 아니라 단지 방법을 찾지 못했을 뿐입니다.","sourceNo":3646},{"no":1470,"category":"성질·상태·문법","word":"薄弱","pinyin":"bóruò","meaning":"약하다, 박약하다","example":"他的基础比较薄弱，需要从零开始学习。","examplePinyin":"Tā de jīchǔ bǐjiào bóruò, xūyào cóng líng kāishǐ xuéxí.","translation":"기초가 상대적으로 약해서 처음부터 배워야 합니다.","sourceNo":3664},{"no":1471,"category":"성질·상태·문법","word":"不成","pinyin":"bùchéng","meaning":"~이 못 되다, 실패하다","example":"如果这件事不成，我们就放弃。","examplePinyin":"Rúguǒ zhè jiàn shì bùchéng, wǒmen jiù fàngqì.","translation":"이것이 작동하지 않으면 포기합니다.","sourceNo":3674},{"no":1472,"category":"성질·상태·문법","word":"不得","pinyin":"bùdé","meaning":"~해서는 안 된다","example":"上课时，学生们不得随意交谈。","examplePinyin":"Shàngkè shí, xuéshengmen bùdé suíyì jiāotán.","translation":"학생들은 수업 중에 함부로 이야기하는 것이 허용되지 않습니다.","sourceNo":3675},{"no":1473,"category":"성질·상태·문법","word":"不顾","pinyin":"búgù","meaning":"~에도 불구하고, 돌보지 않다","example":"他不顾家人的反对，毅然去了远方。","examplePinyin":"Tā búgù jiārén de fǎnduì, yìrán qù le yuǎnfāng.","translation":"가족들의 반대에도 불구하고 그는 과감히 먼 곳으로 갔다.","sourceNo":3677},{"no":1474,"category":"성질·상태·문법","word":"不禁","pinyin":"bùjīn","meaning":"문득, 저도 모르게","example":"看到这动人的一幕，我不禁流下了眼泪。","examplePinyin":"Kàndào zhè dòngrén de yí mù, wǒ bùjīn liúxià le yǎnlèi.","translation":"그 감동적인 장면을 보며 저는 눈물을 흘리지 않을 수 없었습니다.","sourceNo":3678},{"no":1475,"category":"성질·상태·문법","word":"不料","pinyin":"búliào","meaning":"생각지도 못하다, 의외","example":"原以为他会同意，不料他一口拒绝了。","examplePinyin":"Yuányǐwéi tā huì tóngyì, búliào tā yì kǒu jùjué le.","translation":"나는 그가 동의할 것이라고 생각했지만 그는 거절했습니다.","sourceNo":3680},{"no":1476,"category":"성질·상태·문법","word":"不许","pinyin":"bùxǔ","meaning":"안 된다, 허용되지 않음","example":"图书馆里不许大声喧哗，要保持安静。","examplePinyin":"Túshūguǎn lǐ bùxǔ dàshēng xuānhuá, yào bǎochí ānjìng.","translation":"도서관 내에서는 큰 소음이 허용되지 않으며, 침묵이 요구됩니다.","sourceNo":3686},{"no":1477,"category":"성질·상태·문법","word":"不宜","pinyin":"bùyí","meaning":"적합하지 않다, 좋지 않다","example":"这种药不宜空腹服用，最好饭后吃。","examplePinyin":"Zhè zhǒng yào bùyí kōngfù fúyòng, zuìhǎo fànhòu chī.","translation":"이 약은 공복에 복용해서는 안 되며, 식사 후에 복용하는 것이 가장 좋습니다.","sourceNo":3687},{"no":1478,"category":"성질·상태·문법","word":"不已","pinyin":"bùyǐ","meaning":"그만두지 않다, 계속","example":"听到这个好消息，她激动得感叹不已。","examplePinyin":"Tīngdào zhè ge hǎoxiāoxi, tā jīdòng de gǎntàn bùyǐ.","translation":"그녀는 좋은 소식에 감격해 거듭 감탄했어요.","sourceNo":3688},{"no":1479,"category":"성질·상태·문법","word":"不止","pinyin":"bùzhǐ","meaning":"그만이 아니라, 넘어서다","example":"他的成就远不止这些，还在不断创造新的记录。","examplePinyin":"Tā de chéngjiù yuǎnbùzhǐ zhèxiē, hái zài búduàn chuàngzào xīn de jìlù.","translation":"그의 업적은 그 이상이며, 계속해서 새로운 기록을 세우고 있습니다.","sourceNo":3690},{"no":1480,"category":"성질·상태·문법","word":"不至于","pinyin":"búzhìyú","meaning":"~에 이르지 않다, 못 미치다","example":"即使遇到困难，也不至于完全放弃希望。","examplePinyin":"Jíshǐ yùdào kùnnan, yě búzhìyú wánquán fàngqì xīwàng.","translation":"어려움에 직면하더라도 희망을 완전히 포기하지 마십시오.","sourceNo":3691},{"no":1481,"category":"성질·상태·문법","word":"步骤","pinyin":"bùzhòu","meaning":"절차, 단계","example":"完成这项工程需要按照一定的步骤来操作。","examplePinyin":"Wánchéng zhè xiàng gōngchéng xūyào ànzhào yídìng de bùzhòu lái cāozuò.","translation":"이 프로젝트를 완료하려면 특정 단계를 따라야 합니다.","sourceNo":3692},{"no":1482,"category":"성질·상태·문법","word":"才华","pinyin":"cáihuá","meaning":"재능, 천재","example":"他非常有才华，年纪轻轻就出了书。","examplePinyin":"Tā fēicháng yǒu cáihuá, niánjì qīngqīng jiù chū le shū.","translation":"그는 매우 재능이 있고 어린 나이에 책을 출판했습니다.","sourceNo":3699},{"no":1483,"category":"성질·상태·문법","word":"才能","pinyin":"cáinéng","meaning":"재능, 능력","example":"他的才能得到了领导的赏识，被提拔了。","examplePinyin":"Tā de cái néng dédào le lǐngdǎo de shǎngshí, bèi tíbá le.","translation":"그의 재능은 그의 지도자들로부터 높이 평가되었고 그는 승진했습니다.","sourceNo":3702},{"no":1484,"category":"성질·상태·문법","word":"层次","pinyin":"céngcì","meaning":"수준, 레이어","example":"这篇文章的结构很有层次，从浅入深，读起来很顺畅。","examplePinyin":"Zhè piān wénzhāng de jiégòu hěn yǒu céngcì, cóng qiǎn rù shēn, dú qǐlai hěn shùnchàng.","translation":"이 글의 구조는 얕은 것부터 깊은 것까지 매우 계층적이며 매끄럽게 읽혀집니다.","sourceNo":3715},{"no":1485,"category":"성질·상태·문법","word":"层面","pinyin":"céngmiàn","meaning":"측면, 면","example":"这个问题涉及多个层面，需要综合考虑。","examplePinyin":"Zhè ge wèntí shèjí duōge céngmiàn, xūyào zōnghé kǎolǜ.","translation":"이 문제는 여러 수준과 관련되어 있으므로 포괄적으로 고려해야 합니다.","sourceNo":3716},{"no":1486,"category":"성질·상태·문법","word":"长短","pinyin":"chángduǎn","meaning":"길이; 장단점","example":"请比较一下这两根绳子长短，看哪根更长。","examplePinyin":"Qǐng bǐjiào yíxià zhè liǎnggēn shéngzi chángduǎn, kàn nǎ gēn gèng cháng.","translation":"두 줄의 길이를 비교해 어느 것이 더 긴지 보세요.","sourceNo":3724},{"no":1487,"category":"성질·상태·문법","word":"常规","pinyin":"chángguī","meaning":"일반적, 통상","example":"按照常规，他应该九点就到办公室了。","examplePinyin":"Ànzhào chángguī, tā yīnggāi jiǔ diǎn jiù dào bàngōngshì le.","translation":"루틴에 따르면 그는 9시에 사무실에 도착해야 합니다.","sourceNo":3726},{"no":1488,"category":"성질·상태·문법","word":"潮流","pinyin":"cháoliú","meaning":"조류, 흐름","example":"我们要顺应时代的潮流，与时俱进。","examplePinyin":"Wǒmen yào shùnyìng shídài de cháoliú, yǔ shí jù jìn.","translation":"우리는 시대의 흐름에 순응하고 시대에 발맞추어 나가야 합니다.","sourceNo":3741},{"no":1489,"category":"성질·상태·문법","word":"差异","pinyin":"chāyì","meaning":"차이, 다름","example":"两个城市之间的生活方式差异很大。","examplePinyin":"Liǎng ge chéngshì zhījiān de shēnghuó fāngshì chāyì hěn dà.","translation":"두 도시의 생활방식 차이는 엄청납니다.","sourceNo":3746},{"no":1490,"category":"성질·상태·문법","word":"趁","pinyin":"chèn","meaning":"~을 타다, 찬스","example":"他趁着周末天气好，去郊外爬山。","examplePinyin":"Tā chènzhe zhōumò tiānqì hǎo, qù jiāowài páshān.","translation":"그는 주말의 좋은 날씨를 이용하여 시골로 하이킹을 나갔습니다.","sourceNo":3749},{"no":1491,"category":"성질·상태·문법","word":"成效","pinyin":"chéngxiào","meaning":"효과, 성과","example":"新的教学方法取得了显著的成效，学生们进步很快。","examplePinyin":"Xīn de jiàoxué fāngfǎ qǔdé le xiǎnzhù de chéngxiào, xuéshengmen jìnbù hěn kuài.","translation":"새로운 교수법은 놀라운 결과를 얻었고 학생들은 빠른 발전을 이루었습니다.","sourceNo":3762},{"no":1492,"category":"성질·상태·문법","word":"诚信","pinyin":"chéngxìn","meaning":"성실, 신용","example":"做买卖要以诚信为本，这样才能长久。","examplePinyin":"Zuòmǎimài yào yǐ chéngxìn wéi běn, zhèyàng cái néng chángjiǔ.","translation":"사업을 영위하려면 진실성을 바탕으로 해야 오래 지속될 수 있습니다.","sourceNo":3763},{"no":1493,"category":"성질·상태·문법","word":"沉重","pinyin":"chénzhòng","meaning":"무겁다, 중량감 있다","example":"他承受着沉重的心理压力但还是坚持下来了。","examplePinyin":"Tā chéngshòu zhe chénzhòng de xīnlǐ yālì dàn háishi jiānchí xiàlai le.","translation":"그는 정신적으로 큰 압박을 받았지만 여전히 인내했습니다.","sourceNo":3767},{"no":1494,"category":"성질·상태·문법","word":"充实","pinyin":"chōngshí","meaning":"충실하다, 알차다","example":"我们应当充实自己的精神世界，而不是虚度光阴。","examplePinyin":"Wǒmen yīngdāng chōngshí zìjǐ de jīngshén shìjiè, ér búshì xūdù guāngyīn.","translation":"우리는 시간을 낭비하지 말고 영적인 세계를 풍요롭게 해야 합니다.","sourceNo":3778},{"no":1495,"category":"성질·상태·문법","word":"抽象","pinyin":"chōuxiàng","meaning":"추상적, 추상","example":"“幸福”这个词很抽象，但大家都渴望得到。","examplePinyin":"“ xìngfú ” zhè ge cí hěn chōuxiàng, dàn dàjiā dōu kěwàng dédào.","translation":"행복이라는 단어는 매우 추상적이지만 누구나 그것을 원합니다.","sourceNo":3783},{"no":1496,"category":"성질·상태·문법","word":"除","pinyin":"chú","meaning":"제외하다, 빼다","example":"除了他，其他人都没来。","examplePinyin":"Chúle tā, qítārén dōu méi lái.","translation":"그 사람 외에는 아무도 오지 않았습니다.","sourceNo":3784},{"no":1497,"category":"성질·상태·문법","word":"初步","pinyin":"chūbù","meaning":"초보적인,기초적인","example":"他只是初步了解了一些信息，还不够深入。","examplePinyin":"Tā zhǐshì chūbù liǎojiě le yìxiē xìnxī, hái búgòu shēnrù.","translation":"그는 일부 정보에 대해 사전 지식만 갖고 있었을 뿐 깊이가 충분하지 않았습니다.","sourceNo":3801},{"no":1498,"category":"성질·상태·문법","word":"除非","pinyin":"chúfēi","meaning":"~외에는, 제외하고","example":"除非你亲自去，否则他是不会来的。","examplePinyin":"Chúfēi nǐ qīnzì qù, fǒuzé tā shì búhuì lái de.","translation":"당신이 직접 가지 않으면 그는 오지 않을 것이다.","sourceNo":3807},{"no":1499,"category":"성질·상태·문법","word":"垂直","pinyin":"chuízhí","meaning":"수직, 직립","example":"垂直的墙壁上爬满了绿色的植物。","examplePinyin":"Chuízhí de qiángbì shàng pámǎnle lǜsè de zhíwù.","translation":"수직 벽은 녹색 식물로 덮여 있습니다.","sourceNo":3808},{"no":1500,"category":"성질·상태·문법","word":"出名","pinyin":"chūmíng","meaning":"유명해지다, 이름을 알리다","example":"他因为那件事而出名了。","examplePinyin":"Tā yīnwèi nàjiànshì ér chūmíng le.","translation":"그는 그것으로 유명해졌습니다.","sourceNo":3811},{"no":1501,"category":"성질·상태·문법","word":"纯","pinyin":"chún","meaning":"순수하다, 깨끗하다","example":"他喝了一口水，味道很纯正。","examplePinyin":"Tā hē le yì kǒu shuǐ, wèidao hěn chúnzhèng.","translation":"그는 물을 한 모금 마셨는데, 그 맛은 순수했습니다.","sourceNo":3812},{"no":1502,"category":"성질·상태·문법","word":"出于","pinyin":"chūyú","meaning":"~에서 나오다, 유래하다","example":"他的创作灵感是出于对生活的热爱。","examplePinyin":"Tā de chuàngzuò línggǎn shì chūyú duì shēnghuó de rè'ài.","translation":"그의 창의적인 영감은 삶에 대한 사랑에서 비롯됩니다.","sourceNo":3817},{"no":1503,"category":"성질·상태·문법","word":"匆匆","pinyin":"cōngcōng","meaning":"서둘러, 급하게","example":"他匆匆忙忙地吃了几口饭，就出门了。","examplePinyin":"Tā cōng cōngmáng máng de chī le jǐ kǒu fàn, jiù chūmén le.","translation":"그는 서둘러 음식을 몇 입 먹고 나갔다.","sourceNo":3822},{"no":1504,"category":"성질·상태·문법","word":"匆忙","pinyin":"cōngmáng","meaning":"급히, 허둥지둥","example":"他匆忙地离开了会场，似乎有急事。","examplePinyin":"Tā cōngmáng de líkāi le huìchǎng, sìhū yǒu jíshì.","translation":"그는 뭔가 급한 일이라도 있는 듯 황급히 행사장을 떠났다.","sourceNo":3823},{"no":1505,"category":"성질·상태·문법","word":"脆","pinyin":"cuì","meaning":"바삭하다, 부서지기 쉽다","example":"这种饼干很脆，很好吃。","examplePinyin":"Zhè zhǒng bǐnggān hěn cuì, hěn hǎochī.","translation":"이 쿠키는 바삭하고 맛있어요.","sourceNo":3827},{"no":1506,"category":"성질·상태·문법","word":"脆弱","pinyin":"cuìruò","meaning":"약하다, 취약","example":"他的内心很脆弱，需要别人的关心和保护。","examplePinyin":"Tā de nèixīn hěn cuìruò, xūyào biéren de guānxīn hé bǎohù.","translation":"그의 마음은 매우 약해서 다른 사람들의 보살핌과 보호가 필요합니다.","sourceNo":3828},{"no":1507,"category":"성질·상태·문법","word":"大都","pinyin":"dàdōu","meaning":"대부분, 거의","example":"来参加晚会的人大都穿着正式的礼服。","examplePinyin":"Lái cānjiā wǎnhuì de rén dàdōu chuānzhe zhèngshì de lǐfú.","translation":"파티에 참석한 대부분의 사람들은 예복을 입고 있었습니다.","sourceNo":3839},{"no":1508,"category":"성질·상태·문법","word":"大方","pinyin":"dàfang","meaning":"당당하다, 대범하다","example":"他为人很大方，从不计较这些小事。","examplePinyin":"Tā wèi rén hěn dàfang, cóngbú jìjiào zhèxiē xiǎoshì.","translation":"그는 매우 관대하며 작은 일에는 전혀 관심을 두지 않습니다.","sourceNo":3840},{"no":1509,"category":"성질·상태·문법","word":"大幅","pinyin":"dàfú","meaning":"대폭, 큰 폭으로","example":"今年的利润有了大幅的增长，可喜可贺。","examplePinyin":"Jīnnián de lìrùn yǒu le dàfú de zēngzhǎng, kěxǐ kě hè.","translation":"올해 이익이 크게 증가해 만족스럽습니다.","sourceNo":3842},{"no":1510,"category":"성질·상태·문법","word":"单纯","pinyin":"dānchún","meaning":"단순하다, 순수하다","example":"他为人单纯，很容易相信别人。","examplePinyin":"Tā wèi rén dānchún, hěn róngyì xiāngxìn biéren.","translation":"그는 단순한 사람이고 다른 사람들을 쉽게 신뢰합니다.","sourceNo":3855},{"no":1511,"category":"성질·상태·문법","word":"单调","pinyin":"dāndiào","meaning":"단조롭다, 지루하다","example":"这份工作内容很单调，没什么变化。","examplePinyin":"Zhè fèn gōngzuò nèiróng hěn dāndiào, méishénme biànhuà.","translation":"업무 내용은 매우 단조롭고 다양성이 거의 없습니다.","sourceNo":3856},{"no":1512,"category":"성질·상태·문법","word":"道德","pinyin":"dàodé","meaning":"도덕, 윤리","example":"我们要遵守社会道德，不做坏事。","examplePinyin":"Wǒmen yào zūnshǒu shèhuì dàodé, bú zuò huàishì.","translation":"우리는 사회윤리를 준수하고 나쁜 짓을 해서는 안 됩니다.","sourceNo":3872},{"no":1513,"category":"성질·상태·문법","word":"倒是","pinyin":"dàoshì","meaning":"도리어, 오히려","example":"这件衣服样式虽然旧，但质量倒是不错。","examplePinyin":"Zhè jiàn yīfu yàngshì suīrán jiù, dàn zhìliàng dàoshì búcuò.","translation":"이 옷의 스타일은 낡았지만 품질이 꽤 좋습니다.","sourceNo":3873},{"no":1514,"category":"성질·상태·문법","word":"大致","pinyin":"dàzhì","meaning":"대략, 거의","example":"这两件事的性质大致相同，可以合并处理。","examplePinyin":"Zhè liǎng jiàn shì de xìngzhì dàzhì xiāngtóng, kěyǐ hébìng chǔlǐ.","translation":"이 두 가지는 본질적으로 거의 동일하며 결합될 수 있습니다.","sourceNo":3881},{"no":1515,"category":"성질·상태·문법","word":"得了","pinyin":"déle","meaning":"됐다; 그만두자","example":"得了，这件事就别再提了。","examplePinyin":"Déle, zhè jiàn shì jiù bié zài tí le.","translation":"됐어요, 이 일은 더 이상 꺼내지 마세요.","sourceNo":3882},{"no":1516,"category":"성질·상태·문법","word":"得以","pinyin":"déyǐ","meaning":"~할수 있다","example":"有了这个工具，我们得以顺利完成工作。","examplePinyin":"Yǒu le zhè ge gōngjù, wǒmen déyǐ shùnlì wánchéng gōngzuò.","translation":"이 도구를 사용하여 작업을 원활하게 완료할 수 있었습니다.","sourceNo":3885},{"no":1517,"category":"성질·상태·문법","word":"典型","pinyin":"diǎnxíng","meaning":"전형적, 대표적","example":"这种设计风格是现代主义的典型代表。","examplePinyin":"Zhè zhǒng shèjì fēnggé shì xiàndài zhǔyì de diǎnxíng dàibiǎo.","translation":"이 디자인 스타일은 모더니즘의 전형적인 예입니다.","sourceNo":3894},{"no":1518,"category":"성질·상태·문법","word":"地道","pinyin":"dìdao","meaning":"본고장의; 정통의","example":"这家小店的菜味道很地道，价格也实惠。","examplePinyin":"Zhè jiā xiǎodiàn de cài wèidao hěn dìdao, jiàgé yě shíhuì.","translation":"이 작은 가게의 음식은 매우 정통하며 가격도 저렴합니다.","sourceNo":3900},{"no":1519,"category":"성질·상태·문법","word":"动态","pinyin":"dòngtài","meaning":"동향; 움직임","example":"市场瞬息万变，我们要时刻关注它的动态。","examplePinyin":"Shìchǎng shùnxī wàn biàn, wǒmen yào shíkè guānzhù tā de dòngtài.","translation":"시장은 순식간에 변하므로 동향을 계속 살펴야 해요.","sourceNo":3920},{"no":1520,"category":"성질·상태·문법","word":"短缺","pinyin":"duǎnquē","meaning":"결핍되다,모자라다","example":"当地正面临蔬菜短缺的问题，需要紧急调运。","examplePinyin":"Dāngdì zhèng miànlín shūcài duǎnquē de wèntí, xūyào jǐnjí diàoyùn.","translation":"해당 지역은 야채가 부족하여 긴급 수송이 필요한 상황입니다.","sourceNo":3927},{"no":1521,"category":"성질·상태·문법","word":"对称","pinyin":"duìchèn","meaning":"대칭, 대칭","example":"设计要讲究对称，看起来才和谐。","examplePinyin":"Shèjì yào jiǎngjiū duìchèn, kànqǐlai cái héxié.","translation":"디자인은 조화롭게 보이도록 대칭에주의를 기울여야합니다.","sourceNo":3928},{"no":1522,"category":"성질·상태·문법","word":"对立","pinyin":"duìlì","meaning":"대립, 반대","example":"他们俩的观点是对立的，谁也说服不了谁。","examplePinyin":"Tāmen liǎ de guāndiǎn shì duìlì de, shuí yě shuōfú bùle shuí.","translation":"그들의 견해는 정반대이며, 어느 누구도 상대방을 설득할 수 없습니다.","sourceNo":3931},{"no":1523,"category":"성질·상태·문법","word":"对应","pinyin":"duìyìng","meaning":"대응하다, 상응하다","example":"对于每一个问题，都要有对应的解决方案。","examplePinyin":"Duìyú měi yí ge wèntí, dōu yào yǒu duìyìng de jiějué fāng'àn.","translation":"모든 문제에는 그에 상응하는 해결책이 있어야 합니다.","sourceNo":3932},{"no":1524,"category":"성질·상태·문법","word":"多才多艺","pinyin":"duōcáiduōyì","meaning":"다재다능하다, 다재","example":"他是一位多才多艺的艺术家，会唱歌、画画和弹琴。","examplePinyin":"Tā shì yí wèi duōcáiduōyì de yìshùjiā, huì chànggē, huàhuà hé tánqín.","translation":"그는 노래하고, 그림을 그리고, 피아노를 연주할 수 있는 뛰어난 예술가입니다.","sourceNo":3937},{"no":1525,"category":"성질·상태·문법","word":"多亏","pinyin":"duōkuī","meaning":"다행히도, 덕분에","example":"多亏了他的帮助，我才能按时完成工作。","examplePinyin":"Duōkuī le tā de bāngzhù, wǒ cái néng ànshí wánchéng gōngzuò.","translation":"그의 도움 덕분에 나는 그 일을 제 시간에 끝낼 수 있었다.","sourceNo":3938},{"no":1526,"category":"성질·상태·문법","word":"多余","pinyin":"duōyú","meaning":"여분의, 잉여","example":"他带了很多多余的食物，怕路上不够吃。","examplePinyin":"Tā dài le hěn duō duōyú de shíwù, pà lùshang búgòu chī.","translation":"그는 길에서 먹을 것이 충분하지 않을까 걱정하여 여분의 음식을 많이 가져왔습니다.","sourceNo":3941},{"no":1527,"category":"성질·상태·문법","word":"多元","pinyin":"duōyuán","meaning":"다양성, 다원","example":"现代社会是一个多元文化共存的社会。","examplePinyin":"Xiàndài shèhuì shì yí ge duōyuán wénhuà gòngcún de shèhuì.","translation":"현대사회는 다양한 문화가 공존하는 사회이다.","sourceNo":3942},{"no":1528,"category":"성질·상태·문법","word":"恶劣","pinyin":"èliè","meaning":"나쁘다; 열악하다","example":"最近的天气非常恶劣，经常刮风下雨。","examplePinyin":"Zuìjìn de tiānqì fēicháng èliè, jīngcháng guāfēng xiàyǔ.","translation":"최근 날씨가 매우 나빴고, 바람과 비가 자주 내렸습니다.","sourceNo":3944},{"no":1529,"category":"성질·상태·문법","word":"繁忙","pinyin":"fánmáng","meaning":"바쁘다, 분주하다","example":"春运期间，火车站里非常繁忙。","examplePinyin":"Chūnyùn qījiān, huǒchēzhàn lǐ fēicháng fánmáng.","translation":"춘절 여행이 붐비는 동안 기차역은 매우 붐볐습니다.","sourceNo":3970},{"no":1530,"category":"성질·상태·문법","word":"凡（是）","pinyin":"fán(shì)","meaning":"무릇 ~이면, 일반적으로","example":"凡是参加比赛的人，都必须遵守比赛规则。","examplePinyin":"Fánshì cānjiā bǐsài de rén, dōu bìxū zūnshǒu bǐsài guīzé.","translation":"대회에 참가하는 모든 사람은 대회 규정을 준수해야 합니다.","sourceNo":3971},{"no":1531,"category":"성질·상태·문법","word":"飞速","pinyin":"fēisù","meaning":"매우 빠르게","example":"这座城市的经济正在飞速发展，日新月异。","examplePinyin":"Zhè zuò chéngshì de jīngjì zhèngzài fēisù fāzhǎn, rì xīnyuè yì.","translation":"도시의 경제는 빠르게 발전하고 있으며 날이 갈수록 변화하고 있습니다.","sourceNo":3981},{"no":1532,"category":"성질·상태·문법","word":"分级","pinyin":"fēnjí","meaning":"분급, 등급","example":"我们需要对产品进行分级，以便标定不同的价格。","examplePinyin":"Wǒmen xūyào duì chǎnpǐn jìnxíng fēnjí, yǐbiàn biāodìng bùtóng de jiàgé.","translation":"우리는 제품의 가격이 다르게 책정될 수 있도록 등급을 매겨야 합니다.","sourceNo":3992},{"no":1533,"category":"성질·상태·문법","word":"负面","pinyin":"fùmiàn","meaning":"부정적, 마이너스","example":"这件事也产生了不小的负面影响。","examplePinyin":"Zhè jiàn shì yě chǎnshēng le bùxiǎo de fùmiàn yǐngxiǎng.","translation":"이번 사건도 꽤 부정적인 영향을 미쳤다.","sourceNo":4007},{"no":1534,"category":"성질·상태·문법","word":"该2","pinyin":"gāi","meaning":"그, 그것(해당)","example":"该员工的能力很强，可以胜任这个职位。","examplePinyin":"Gāi yuángōng de nénglì hěn qiáng, kěyǐ shèngrèn zhè ge zhíwèi.","translation":"해당 직원은 능력이 뛰어나 이 직위를 맡을 수 있어요.","sourceNo":4013},{"no":1535,"category":"성질·상태·문법","word":"干脆","pinyin":"gāncuì","meaning":"아예, 완전히 / 간단히","example":"他做事很干脆，从不拖泥带水。","examplePinyin":"Tā zuòshì hěn gāncuì, cóngbù tuō ní dài shuǐ.","translation":"그는 일을 맺고 끊는 것이 분명하며 질질 끌지 않아요.","sourceNo":4018},{"no":1536,"category":"성질·상태·문법","word":"尴尬","pinyin":"gāngà","meaning":"어색하다, 난처하다","example":"在公共场合遇到尴尬的事情，要冷静处理。","examplePinyin":"Zài gōnggòng chǎnghé yùdào gāngà de shìqing, yào lěngjìng chǔlǐ.","translation":"공공장소에서 난처한 상황에 직면하면 침착하게 대처하세요.","sourceNo":4019},{"no":1537,"category":"성질·상태·문법","word":"高超","pinyin":"gāochāo","meaning":"고수준, 우수","example":"他的技艺非常高超，令人叹服。","examplePinyin":"Tā de jìyì fēicháng gāochāo, lìngrén tànfú.","translation":"그의 기술은 매우 훌륭하고 인상적입니다.","sourceNo":4031},{"no":1538,"category":"성질·상태·문법","word":"高端","pinyin":"gāoduān","meaning":"고급, 하이엔드","example":"这款产品定位高端市场，价格比较贵。","examplePinyin":"Zhè kuǎn chǎnpǐn dìngwèi gāoduān shìchǎng, jiàgé bǐjiào guì.","translation":"이 제품은 고급 시장에 위치하며 상대적으로 가격이 비쌉니다.","sourceNo":4033},{"no":1539,"category":"성질·상태·문법","word":"高尚","pinyin":"gāoshàng","meaning":"고상하다, 숭고하다","example":"他的道德品质很高尚，值得我们学习。","examplePinyin":"Tā de dàodé pǐnzhì hěn gāoshàng, zhíde wǒmen xuéxí.","translation":"그의 도덕적 성품은 매우 고귀하며 배울 가치가 있습니다.","sourceNo":4036},{"no":1540,"category":"성질·상태·문법","word":"公","pinyin":"gōng","meaning":"공공의; 수컷","example":"公民享有法律赋予的各项权利。","examplePinyin":"Gōngmín xiǎngyǒu fǎlǜ fùyǔ de gèxiàng quánlì.","translation":"국민은 법이 부여하는 다양한 권리를 누린다.","sourceNo":4049},{"no":1541,"category":"성질·상태·문법","word":"公认","pinyin":"gōngrèn","meaning":"공인되다, 인정받다","example":"他是大家公认的好领导，很得人心。","examplePinyin":"Tā shì dàjiā gōngrèn de hǎo lǐngdǎo, hěn derénxīn.","translation":"그는 모든 사람에게 훌륭한 리더이자 인기가 많은 사람으로 인정받고 있습니다.","sourceNo":4061},{"no":1542,"category":"성질·상태·문법","word":"功效","pinyin":"gōngxiào","meaning":"효능, 효과","example":"这种新药的功效很强，见效很快。","examplePinyin":"Zhè zhǒng xīnyào de gōngxiào hěn qiáng, jiànxiào hěn kuài.","translation":"이 신약은 매우 강력하고 빠르게 작용합니다.","sourceNo":4062},{"no":1543,"category":"성질·상태·문법","word":"公正","pinyin":"gōngzhèng","meaning":"공정하다, 정당","example":"裁判的判罚非常公正，双方都表示信服。","examplePinyin":"Cáipàn de pànfá fēicháng gōngzhèng, shuāngfāng dōu biǎoshì xìnfú.","translation":"심판의 판정이 매우 공정하여 양측 모두 수긍했어요.","sourceNo":4067},{"no":1544,"category":"성질·상태·문법","word":"构造","pinyin":"gòuzào","meaning":"구조, 구성","example":"这栋大楼的内部构造很复杂，设计十分巧妙。","examplePinyin":"Zhè dòng dàlóu de nèibù gòuzào hěn fùzá, shèjì shífēn qiǎomiào.","translation":"이 건물의 내부 구조는 복잡하고 설계가 무척 정교해요.","sourceNo":4071},{"no":1545,"category":"성질·상태·문법","word":"广阔","pinyin":"guǎngkuò","meaning":"넓다, 광활하다","example":"站在山顶上望去，这里的天地十分广阔。","examplePinyin":"Zhàn zài shāndǐng shàng wàngqù, zhèlǐ de tiānde shífēn guǎngkuò.","translation":"산 정상에서 바라보면 이곳의 세계는 매우 광대하다.","sourceNo":4080},{"no":1546,"category":"성질·상태·문법","word":"关联","pinyin":"guānlián","meaning":"관련되다","example":"这两件事情之间似乎并没有直接关联。","examplePinyin":"Zhè liǎng jiàn shìqing zhījiān sìhū bìng méiyǒu zhíjiē guānlián.","translation":"두 가지 사이에는 직접적인 연관성이 없는 것 같습니다.","sourceNo":4083},{"no":1547,"category":"성질·상태·문법","word":"过时","pinyin":"guòshí","meaning":"유행이 지나다, 시대에 뒤떨어지다","example":"这种旧式手机早就已经过时了。","examplePinyin":"Zhè zhǒng jiùshì shǒujī zǎojiù yǐjīng guòshí le.","translation":"이 구형 휴대전화는 이미 한참 전에 유행이 지났어요.","sourceNo":4106},{"no":1548,"category":"성질·상태·문법","word":"固体","pinyin":"gùtǐ","meaning":"고체","example":"水结冰以后就会变成固体状态。","examplePinyin":"Shuǐ jiébīng yǐhòu jiù huì biànchéng gùtǐ zhuàngtài.","translation":"물이 얼면 고체 상태가 됩니다.","sourceNo":4111},{"no":1549,"category":"성질·상태·문법","word":"罕见","pinyin":"hǎnjiàn","meaning":"드물다","example":"这种罕见的天文现象十分难得一见。","examplePinyin":"Zhè zhǒng hǎnjiàn de tiānwén xiànxiàng shífēn nándé yí jiàn.","translation":"이 희귀한 천문 현상은 보기가 매우 드뭅니다.","sourceNo":4124},{"no":1550,"category":"성질·상태·문법","word":"毫不","pinyin":"háo bù","meaning":"조금도 ~않다","example":"面对困难，他毫不犹豫地答应帮忙。","examplePinyin":"Miànduì kùnnan, tā háobù yóuyù de dāying bāngmáng.","translation":"어려움에 직면했을 때 그는 주저 없이 도움을 주기로 동의했습니다.","sourceNo":4127},{"no":1551,"category":"성질·상태·문법","word":"毫无","pinyin":"háo wú","meaning":"전혀 없다","example":"事到如今，他已经毫无办法可想。","examplePinyin":"Shì dào rújīn, tā yǐjīng háowú bànfǎ kě xiǎng.","translation":"일이 이렇게 된 지금 그는 더 이상 떠올릴 방법이 없어요.","sourceNo":4128},{"no":1552,"category":"성질·상태·문법","word":"好不","pinyin":"hǎobù","meaning":"정말 ~하다","example":"广场上锣鼓齐鸣，好不热闹。","examplePinyin":"Guǎngchǎng shàng luógǔ qímíng, hǎobú rènao.","translation":"광장에 징과 북 소리가 울려 무척 흥겨워요.","sourceNo":4129},{"no":1553,"category":"성질·상태·문법","word":"好容易","pinyin":"hǎoróngyì","meaning":"겨우, 간신히","example":"翻山越岭，他好容易才找到回家的路。","examplePinyin":"Fān shān yuè lǐng, tā hǎoróngyì cái zhǎodào huíjiā de lù.","translation":"산과 능선을 넘은 끝에 그는 마침내 집으로 가는 길을 찾았습니다.","sourceNo":4133},{"no":1554,"category":"성질·상태·문법","word":"横","pinyin":"héng","meaning":"가로의 / 가로놓다 / 가로","example":"请沿着这条虚线画一条横线。","examplePinyin":"Qǐng yánzhe zhè tiáo xūxiàn huà yì tiáo héngxiàn.","translation":"이 점선을 따라 수평선을 그려주세요.","sourceNo":4143},{"no":1555,"category":"성질·상태·문법","word":"和谐","pinyin":"héxié","meaning":"조화롭다","example":"这个家庭氛围融洽，生活十分和谐。","examplePinyin":"Zhè ge jiātíng fēnwéi róngqià, shēnghuó shífēn héxié.","translation":"이 가족은 조화로운 분위기와 매우 조화로운 삶을 살고 있습니다.","sourceNo":4147},{"no":1556,"category":"성질·상태·문법","word":"核心","pinyin":"héxīn","meaning":"핵심","example":"诚信是企业发展壮大的核心竞争力。","examplePinyin":"Chéngxìn shì qǐyè fāzhǎn zhuàngdà de héxīn jìngzhēnglì.","translation":"정직성은 기업의 발전과 성장을 위한 핵심 경쟁력입니다.","sourceNo":4148},{"no":1557,"category":"성질·상태·문법","word":"宏大","pinyin":"hóngdà","meaning":"웅대하다, 장대하다","example":"这是一项目标宏大的城市建设计划。","examplePinyin":"Zhè shì yí xiàng mùbiāo hóngdà de chéngshì jiànshè jìhuà.","translation":"이것은 야심 찬 목표를 가진 도시 건설 계획입니다.","sourceNo":4149},{"no":1558,"category":"성질·상태·문법","word":"黄","pinyin":"huáng","meaning":"노랑","example":"一到秋天，公园里的树叶就变黄了。","examplePinyin":"Yí dào qiūtiān, gōngyuán lǐ de shùyè jiù biàn huáng le.","translation":"가을에는 공원의 나뭇잎이 노랗게 변합니다.","sourceNo":4167},{"no":1559,"category":"성질·상태·문법","word":"欢乐","pinyin":"huānlè","meaning":"즐겁다","example":"大家在一起，度过了非常欢乐的一天。","examplePinyin":"Dàjiā zài yìqǐ, dùguò le fēicháng huānlè de yì tiān.","translation":"모두가 함께 매우 행복한 하루를 보냈습니다.","sourceNo":4169},{"no":1560,"category":"성질·상태·문법","word":"混乱","pinyin":"hùnluàn","meaning":"혼란스럽다","example":"地震发生后，现场秩序变得十分混乱。","examplePinyin":"Dìzhèn fāshēng hòu, xiànchǎng zhìxù biànde shífēn hùnluàn.","translation":"지진 이후 현장의 질서는 매우 혼란스러워졌습니다.","sourceNo":4192},{"no":1561,"category":"성질·상태·문법","word":"活力","pinyin":"huólì","meaning":"활력","example":"年轻人朝气蓬勃，浑身充满了活力。","examplePinyin":"Niánqīngrén zhāoqì péngbó, húnshēn chōngmǎn le huólì.","translation":"젊은이들은 패기와 활력이 온몸에 넘쳐요.","sourceNo":4197},{"no":1562,"category":"성질·상태·문법","word":"活跃","pinyin":"huóyuè","meaning":"활발하다 / 활발하게 하다","example":"他上课的时候表现得非常活跃。","examplePinyin":"Tā shàngkè de shíhou biǎoxiàn de fēicháng huóyuè.","translation":"그는 수업 시간에 매우 적극적입니다.","sourceNo":4198},{"no":1563,"category":"성질·상태·문법","word":"尖","pinyin":"jiān","meaning":"뾰족하다 / 끝","example":"这支铅笔削得很尖，写字特别好用。","examplePinyin":"Zhè zhī qiānbǐ xuē de hěn jiān, xiězì tèbié hǎo yòng.","translation":"이 연필은 매우 날카로우며 글쓰기에 매우 유용합니다.","sourceNo":4211},{"no":1564,"category":"성질·상태·문법","word":"坚定","pinyin":"jiāndìng","meaning":"확고하다 / 확고히 하다","example":"面对质疑，他的态度依然十分坚定。","examplePinyin":"Miànduì zhìyí, tā de tàidu yīrán shífēn jiāndìng.","translation":"의심에도 불구하고 그의 태도는 확고했다.","sourceNo":4216},{"no":1565,"category":"성질·상태·문법","word":"坚固","pinyin":"jiāngù","meaning":"견고하다","example":"这座石桥修建得十分坚固耐用。","examplePinyin":"Zhè zuò shíqiáo xiūjiàn de shífēn jiāngù nàiyòng.","translation":"이 돌다리는 매우 튼튼하고 내구성이 뛰어납니다.","sourceNo":4224},{"no":1566,"category":"성질·상태·문법","word":"间接","pinyin":"jiànjiē","meaning":"간접적인","example":"这是一个比较间接、不太明显的原因。","examplePinyin":"Zhè shì yí ge bǐjiào jiànjiē, bú tài míngxiǎn de yuányīn.","translation":"이는 보다 간접적이고 덜 분명한 이유입니다.","sourceNo":4227},{"no":1567,"category":"성질·상태·문법","word":"坚决","pinyin":"jiānjué","meaning":"단호하다","example":"面对反对意见，他依然态度坚决。","examplePinyin":"Miànduì fǎnduì yìjiàn, tā yīrán tàidu jiānjué.","translation":"그는 반대에도 불구하고 단호한 태도를 유지했습니다.","sourceNo":4229},{"no":1568,"category":"성질·상태·문법","word":"艰难","pinyin":"jiānnán","meaning":"어렵다, 힘들다","example":"失去工作以后，他的生活变得十分艰难。","examplePinyin":"Shīqù gōngzuò yǐhòu, tā de shēnghuó biànde shífēn jiānnán.","translation":"직장을 잃은 후 그의 삶은 매우 어려워졌습니다.","sourceNo":4230},{"no":1569,"category":"성질·상태·문법","word":"艰辛","pinyin":"jiānxīn","meaning":"고생스럽다","example":"创业这几年，他经历了许多艰辛。","examplePinyin":"Chuàngyè zhè jǐ nián, tā jīnglì le xǔduō jiānxīn.","translation":"그는 사업을 시작한 이후 지난 몇 년간 많은 어려움을 겪었다.","sourceNo":4233},{"no":1570,"category":"성질·상태·문법","word":"坚硬","pinyin":"jiānyìng","meaning":"단단하다","example":"这块石头质地坚硬，很难被打碎。","examplePinyin":"Zhè kuài shítou zhìde jiānyìng, hěn nán bèi dǎsuì.","translation":"돌은 단단하고 부서지기 어렵습니다.","sourceNo":4236},{"no":1571,"category":"성질·상태·문법","word":"较为","pinyin":"jiàowéi","meaning":"비교적","example":"相比其他方案，这个问题显得较为复杂。","examplePinyin":"Xiāngbǐ qítā fāng'àn, zhè ge wèntí xiǎnde jiàowéi fùzá.","translation":"다른 솔루션과 비교할 때 이 문제는 더 복잡해 보입니다.","sourceNo":4247},{"no":1572,"category":"성질·상태·문법","word":"即便","pinyin":"jíbiàn","meaning":"설령 ~하더라도","example":"即便下起了大雨，我们也照样按时出发。","examplePinyin":"Jíbiàn xià qǐ le dàyǔ, wǒmen yě zhàoyàng ànshí chūfā.","translation":"설령 비가 많이 내려도 우리는 예정대로 출발해요.","sourceNo":4256},{"no":1573,"category":"성질·상태·문법","word":"极端","pinyin":"jíduān","meaning":"극단 / 극도로 / 극단적인","example":"他做事说话总是带着一股极端情绪。","examplePinyin":"Tā zuòshì shuōhuà zǒngshì dài zhe yì gǔ jíduān qíngxù.","translation":"그는 늘 극단적인 감정을 가지고 행동하고 말했어요.","sourceNo":4260},{"no":1574,"category":"성질·상태·문법","word":"杰出","pinyin":"jiéchū","meaning":"걸출하다, 뛰어나다","example":"他年纪轻轻，却已经是一位杰出的科学家。","examplePinyin":"Tā niánjì qīngqīng, què yǐjīng shì yí wèi jiéchū de kēxuéjiā.","translation":"그는 어리지만 이미 뛰어난 과학자이다.","sourceNo":4264},{"no":1575,"category":"성질·상태·문법","word":"结实","pinyin":"jiēshi","meaning":"튼튼하다","example":"这个行李箱看起来很结实，也很耐用。","examplePinyin":"Zhè ge xínglixiāng kànqǐlai hěn jiēshi, yě hěn nàiyòng.","translation":"이 여행가방은 튼튼하고 내구성이 좋아 보입니다.","sourceNo":4272},{"no":1576,"category":"성질·상태·문법","word":"借助","pinyin":"jièzhù","meaning":"~의 힘을 빌리다","example":"这项任务我们是借助工具才顺利完成的。","examplePinyin":"Zhè xiàng rènwu wǒmen shì jièzhù gōngjù cái shùnlì wánchéng de.","translation":"우리는 도구의 도움으로 이 작업을 성공적으로 수행했습니다.","sourceNo":4279},{"no":1577,"category":"성질·상태·문법","word":"进而","pinyin":"jìn'ér","meaning":"나아가","example":"他先打好基础，进而学习更高深的知识。","examplePinyin":"Tā xiān dǎ hǎo jīchǔ, jìn'ér xuéxí gèng gāoshēn de zhīshi.","translation":"그는 먼저 기초를 닦은 다음 더 높은 수준의 지식을 배웁니다.","sourceNo":4289},{"no":1578,"category":"성질·상태·문법","word":"净","pinyin":"jìng","meaning":"깨끗하다 / 순, 오직(부사)","example":"妈妈把家里打扫得干干净净的。","examplePinyin":"Māma bǎ jiālǐ dǎsǎo de gàn gānjìng jìng de.","translation":"엄마는 집을 깨끗하게 청소하신다.","sourceNo":4292},{"no":1579,"category":"성질·상태·문법","word":"精美","pinyin":"jīngměi","meaning":"정교하고 아름답다","example":"她收到了一份包装十分精美的礼物。","examplePinyin":"Tā shōudào le yí fèn bāozhuāng shífēn jīngměi de lǐwù.","translation":"그녀는 아름답게 포장된 선물을 받았습니다.","sourceNo":4296},{"no":1580,"category":"성질·상태·문법","word":"精确","pinyin":"jīngquè","meaning":"정확하다","example":"这台仪器可以进行非常精确的测量。","examplePinyin":"Zhè tái yíqì kěyǐ jìnxíng fēicháng jīngquè de cèliáng.","translation":"이 장비는 매우 정확한 측정을 할 수 있습니다.","sourceNo":4297},{"no":1581,"category":"성질·상태·문법","word":"惊人","pinyin":"jīngrén","meaning":"놀랍다","example":"这项科研成果的进展速度十分惊人。","examplePinyin":"Zhè xiàng kēyán chéngguǒ de jìnzhǎn sùdù shífēn jīngrén.","translation":"이러한 과학적 연구 성과의 발전 속도는 놀랍습니다.","sourceNo":4298},{"no":1582,"category":"성질·상태·문법","word":"精心","pinyin":"jīngxīn","meaning":"정성을 들이다","example":"她精心准备了一份特别的生日礼物。","examplePinyin":"Tā jīngxīn zhǔnbèi le yí fèn tèbié de shēngrì lǐwù.","translation":"그녀는 특별한 생일 선물을 정성껏 준비했다.","sourceNo":4304},{"no":1583,"category":"성질·상태·문법","word":"精致","pinyin":"jīngzhì","meaning":"정교하다","example":"这家店里的甜点做得又精致又美味。","examplePinyin":"Zhè jiā diànlǐ de tiándiǎn zuò de yòu jīngzhì yòu měiwèi.","translation":"이 가게의 디저트는 일품이고 맛있습니다.","sourceNo":4306},{"no":1584,"category":"성질·상태·문법","word":"精准","pinyin":"jīngzhǔn","meaning":"정확하다, 정밀하다","example":"这台设备的定位系统非常精准可靠。","examplePinyin":"Zhè tái shèbèi de dìngwèi xìtǒng fēicháng jīngzhǔn kěkào.","translation":"이 장치의 위치 확인 시스템은 매우 정확하고 신뢰할 수 있습니다.","sourceNo":4308},{"no":1585,"category":"성질·상태·문법","word":"急切","pinyin":"jíqiè","meaning":"다급하다, 절실하다","example":"他急切地想知道考试的最终结果。","examplePinyin":"Tā jíqiè de xiǎng zhīdao kǎoshì de zuìzhōng jiēguǒ.","translation":"그는 시험의 최종 결과를 몹시 알고 싶어 해요.","sourceNo":4319},{"no":1586,"category":"성질·상태·문법","word":"就算","pinyin":"jiùsuàn","meaning":"설령 ~일지라도","example":"就算天气再恶劣，我们也要按时出发。","examplePinyin":"Jiùsuàn tiānqì zài èliè, wǒmen yě yào ànshí chūfā.","translation":"아무리 날씨가 좋지 않더라도 우리는 제시간에 출발해야 합니다.","sourceNo":4328},{"no":1587,"category":"성질·상태·문법","word":"极为","pinyin":"jíwéi","meaning":"극히, 매우","example":"这次会议的结果对公司极为重要。","examplePinyin":"Zhè cì huìyì de jiēguǒ duì gōngsī jíwéi zhòngyào.","translation":"이번 회의의 결과는 회사에 매우 중요합니다.","sou
