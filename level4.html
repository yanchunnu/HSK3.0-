<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 3.0 4급 음원 학습</title>
  <style>
    :root { --blue:#246a45; --deep:#102a43; --line:#d5e7da; --soft:#f0f9f3; --accent:#d4efdd; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#f6fbf7; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .gradeLinks { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:9px; font-size:13px; }
    .gradeLinks a {color:var(--blue); font-weight:700; text-underline-offset:3px;}
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f1f9f3; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#dcefe2; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #31885a; background:#f2fcf5; box-shadow:0 0 0 5px #31885a1c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#c5e8d0; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>
</head>
<body>
<!-- mobile playback controls v2 -->
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>HSK 3.0 4급 음원 학습</h1><div class="sub">검수한 4급 1000단어 · 단어와 예문을 듣고 반복 학습하세요.</div><nav class="gradeLinks"><a href="level5.html">5급 학습하기</a><a href="level3.html">3급 복습하기</a><a href="HSK3.0_4급단어장_표지포함.pdf?v=20261111-cover2000" download>4급 PDF 내려받기</a></nav></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="번호·한자·병음·뜻 검색">
      <label>단어 <select id="wordRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>예문 <select id="sentenceRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>속도 <select id="speechRate"><option value="0.55">매우 느리게</option><option value="0.68">느리게</option><option value="0.78" selected>학습 속도</option><option value="0.9">조금 빠르게</option><option value="1">보통</option><option value="1.15">빠르게</option><option value="1.3">매우 빠르게</option></select></label>
      <button class="toggle on" id="pinyinToggle" type="button">병음 보임</button>
      <button class="toggle on" id="meaningToggle" type="button">뜻 보임</button>
      <button class="toggle on" id="translationToggle" type="button">해석 보임</button>
    </div>
    <div class="batch">
      <label class="startControl">시작 번호 <input id="startNo" type="number" min="1" max="1000" value="1"></label>
      <button type="button" id="playAllWords">▶ 선택 번호부터 단어</button>
      <button type="button" id="playAllSentences">▶ 선택 번호부터 예문</button>
      <button type="button" id="playAllBoth">▶ 선택 번호부터 단어+예문</button>
      <button type="button" class="pause" id="pauseResume" disabled>Ⅱ 일시정지</button>
      <button type="button" class="stop" id="stopAll">■ 재생 멈춤</button>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>

<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"打招呼","pinyin":"dǎ zhāohu","meaning":"인사하다","example":"见到新邻居时，我主动和他打招呼。","examplePinyin":"Jiàndào xīn línjū shí, wǒ zhǔdòng hé tā dǎ zhāohu.","translation":"새 이웃을 만났을 때 제가 먼저 인사했어요."},{"no":2,"category":"인사·사람·대명사","word":"晚安","pinyin":"wǎn'ān","meaning":"잘 자요, 안녕히 주무세요","example":"说完晚安后，她才关灯准备睡觉。","examplePinyin":"Shuōwán wǎn'ān hòu, tā cái guāndēng zhǔnbèi shuìjiào.","translation":"그녀는 잘 자라는 인사를 한 뒤에야 불을 끄고 잘 준비를 했어요."},{"no":3,"category":"인사·사람·대명사","word":"感谢","pinyin":"gǎnxiè","meaning":"감사하다","example":"感谢你的提醒，我没有错过末班车。","examplePinyin":"Gǎnxiè nǐ de tíxǐng, wǒ méiyǒu cuòguò mòbānchē.","translation":"알려 줘서 고마워요. 덕분에 막차를 놓치지 않았어요."},{"no":4,"category":"인사·사람·대명사","word":"抱歉","pinyin":"bàoqiàn","meaning":"죄송하다, 미안하다","example":"实在抱歉，让大家在雨中等了这么久。","examplePinyin":"Shízài bàoqiàn, ràng dàjiā zài yǔ zhōng děng le zhème jiǔ.","translation":"여러분을 빗속에서 이렇게 오래 기다리게 해서 정말 죄송해요."},{"no":5,"category":"인사·사람·대명사","word":"道歉","pinyin":"dàoqiàn","meaning":"사과하다","example":"发现自己误会了他，我马上向他道歉。","examplePinyin":"Fāxiàn zìjǐ wùhuì le tā, wǒ mǎshàng xiàng tā dàoqiàn.","translation":"제가 그를 오해했다는 것을 알고 곧바로 사과했어요."},{"no":6,"category":"인사·사람·대명사","word":"打扰","pinyin":"dǎrǎo","meaning":"방해하다, 실례하다","example":"你正在开会，我就不进去打扰了。","examplePinyin":"Nǐ zhèngzài kāihuì, wǒ jiù bú jìnqù dǎrǎo le.","translation":"지금 회의 중이시니 들어가서 방해하지 않을게요."},{"no":7,"category":"인사·사람·대명사","word":"客气","pinyin":"kèqi","meaning":"예의를 차리다, 사양하다","example":"都是老朋友了，吃饭时不用这么客气。","examplePinyin":"Dōu shì lǎopéngyou le, chīfàn shí búyòng zhème kèqi.","translation":"모두 오랜 친구이니 식사할 때 그렇게 예의를 차리지 않아도 돼요."},{"no":8,"category":"인사·사람·대명사","word":"礼貌","pinyin":"lǐmào","meaning":"예의, 예의 바르다","example":"即使意见不同，也应该有礼貌地讨论。","examplePinyin":"Jíshǐ yìjiàn bùtóng, yě yīnggāi yǒu lǐmào de tǎolùn.","translation":"의견이 다르더라도 예의를 지키며 토론해야 해요."},{"no":9,"category":"인사·사람·대명사","word":"嗯","pinyin":"ǹg","meaning":"응, 음(동의·반응)","example":"嗯，你的建议不错，我们可以试试看。","examplePinyin":"Ǹg, nǐ de jiànyì búcuò, wǒmen kěyǐ shìshikàn.","translation":"음, 네 제안이 괜찮네. 한번 시도해 볼 수 있겠어."},{"no":10,"category":"인사·사람·대명사","word":"祝","pinyin":"zhù","meaning":"기원하다, 축원하다","example":"祝你面试顺利，找到满意的工作。","examplePinyin":"Zhù nǐ miànshì shùnlì, zhǎodào mǎnyì de gōngzuò.","translation":"면접을 잘 보고 만족스러운 직장을 구하기를 바라요."},{"no":11,"category":"인사·사람·대명사","word":"祝贺","pinyin":"zhùhè","meaning":"축하하다","example":"听说她获得了奖学金，大家都来祝贺。","examplePinyin":"Tīngshuō tā huòdé le jiǎngxuéjīn, dàjiā dōu lái zhùhè.","translation":"그녀가 장학금을 받았다고 듣고 모두 축하하러 왔어요."},{"no":12,"category":"인사·사람·대명사","word":"各位","pinyin":"gèwèi","meaning":"여러분; 각 분(존칭)","example":"各位乘客请注意，航班将要开始登机。","examplePinyin":"Gèwèi chéngkè qǐng zhùyì, hángbān jiāngyào kāishǐ dēngjī.","translation":"승객 여러분, 주의해 주세요. 곧 항공편 탑승을 시작합니다."},{"no":13,"category":"인사·사람·대명사","word":"对方","pinyin":"duìfāng","meaning":"상대방","example":"讨论问题时，先听清楚对方的理由。","examplePinyin":"Tǎolùn wèntí shí, xiān tīng qīngchu duìfāng de lǐyóu.","translation":"문제를 토론할 때 먼저 상대방의 이유를 정확히 들어 보세요."},{"no":14,"category":"인사·사람·대명사","word":"男士","pinyin":"nánshì","meaning":"남성, 신사","example":"那位男士把座位让给了抱孩子的母亲。","examplePinyin":"Nà wèi nánshì bǎ zuòwèi rànggěi le bào háizi de mǔqīn.","translation":"저 남성은 아이를 안고 있는 어머니에게 자리를 양보했어요."},{"no":15,"category":"인사·사람·대명사","word":"男性","pinyin":"nánxìng","meaning":"남성","example":"这次活动欢迎所有男性家长参加。","examplePinyin":"Zhè cì huódòng huānyíng suǒyǒu nánxìng jiāzhǎng cānjiā.","translation":"이번 행사는 모든 남성 보호자의 참여를 환영해요."},{"no":16,"category":"인사·사람·대명사","word":"女性","pinyin":"nǚxìng","meaning":"여성","example":"她的小说写出了现代女性的日常生活。","examplePinyin":"Tā de xiǎoshuō xiěchū le xiàndài nǚxìng de rìcháng shēnghuó.","translation":"그녀의 소설은 현대 여성의 일상생활을 그려 냈어요."},{"no":17,"category":"인사·사람·대명사","word":"性别","pinyin":"xìngbié","meaning":"성별","example":"请在表格中填写年龄和性别。","examplePinyin":"Qǐng zài biǎogé zhōng tiánxiě niánlíng hé xìngbié.","translation":"양식에 나이와 성별을 적어 주세요."},{"no":18,"category":"인사·사람·대명사","word":"年龄","pinyin":"niánlíng","meaning":"나이, 연령","example":"年龄不是问题，重要的是学习态度。","examplePinyin":"Niánlíng búshì wèntí, zhòngyào de shì xuéxí tàidu.","translation":"나이는 문제가 아니에요. 중요한 것은 학습 태도예요."},{"no":19,"category":"인사·사람·대명사","word":"童年","pinyin":"tóngnián","meaning":"어린 시절, 유년기","example":"每次回到老家，我都会想起快乐的童年。","examplePinyin":"Měi cì huídào lǎojiā, wǒ dōu huì xiǎngqǐ kuàilè de tóngnián.","translation":"고향에 돌아갈 때마다 즐거웠던 어린 시절이 떠올라요."},{"no":20,"category":"인사·사람·대명사","word":"儿童","pinyin":"értóng","meaning":"어린이","example":"儿童去游泳时，家长应该在身边。","examplePinyin":"Értóng qù yóuyǒng shí, jiāzhǎng yīnggāi zài shēnbiān.","translation":"어린이가 수영하러 갈 때는 보호자가 곁에 있어야 해요."},{"no":21,"category":"인사·사람·대명사","word":"少年","pinyin":"shàonián","meaning":"소년, 청소년","example":"那位少年虽然年纪小，做事却很负责。","examplePinyin":"Nà wèi shàonián suīrán niánjì xiǎo, zuòshì què hěn fùzé.","translation":"저 소년은 나이가 어리지만 일을 책임감 있게 해요."},{"no":22,"category":"인사·사람·대명사","word":"青年","pinyin":"qīngnián","meaning":"청년","example":"许多青年利用假日参加社会活动。","examplePinyin":"Xǔduō qīngnián lìyòng jiàrì cānjiā shèhuì huódòng.","translation":"많은 청년이 휴일을 이용해 사회 활동에 참여해요."},{"no":23,"category":"인사·사람·대명사","word":"小伙子","pinyin":"xiǎohuǒzi","meaning":"젊은 남자, 청년","example":"这个小伙子不但有礼貌，而且很勇敢。","examplePinyin":"Zhè ge xiǎohuǒzi búdàn yǒu lǐmào, érqiě hěn yǒnggǎn.","translation":"이 청년은 예의가 바를 뿐 아니라 용감해요."},{"no":24,"category":"인사·사람·대명사","word":"姑娘","pinyin":"gūniang","meaning":"아가씨, 젊은 여성","example":"那位姑娘正在向游客介绍家乡的风景。","examplePinyin":"Nà wèi gūniang zhèngzài xiàng yóukè jièshào jiāxiāng de fēngjǐng.","translation":"저 아가씨는 관광객에게 고향의 경치를 소개하고 있어요."},{"no":25,"category":"인사·사람·대명사","word":"中年","pinyin":"zhōngnián","meaning":"중년","example":"进入中年以后，他更加重视身体健康。","examplePinyin":"Jìnrù zhōngnián yǐhòu, tā gèngjiā zhòngshì shēntǐ jiànkāng.","translation":"중년에 접어든 뒤로 그는 건강을 더욱 중요하게 여겨요."},{"no":26,"category":"인사·사람·대명사","word":"老年","pinyin":"lǎonián","meaning":"노년","example":"进入老年后，她仍保持每天阅读的习惯。","examplePinyin":"Jìnrù lǎonián hòu, tā réng bǎochí měi tiān yuèdú de xíguàn.","translation":"노년에 접어든 뒤에도 그녀는 매일 책을 읽는 습관을 xample":"我和他约好周五见面，讨论新的计划。","examplePinyin":"Wǒ hé tā yuē hǎo zhōuwǔ jiànmiàn, tǎolùn xīn de jìhuà.","translation":"그와 금요일에 만나 새 계획을 논의하기로 약속했어요."},{"no":54,"category":"가족·관계","word":"约会","pinyin":"yuēhuì","meaning":"만날 약속, 데이트","example":"为了这次约会，他特意提前下了班。","examplePinyin":"Wèile zhè cì yuēhuì, tā tèyì tíqián xià le bān.","translation":"그는 이번 데이트를 위해 일부러 일찍 퇴근했어요."},{"no":55,"category":"숫자·수량·화폐","word":"数","pinyin":"shù","meaning":"수, 숫자","example":"把这个数减去十，答案就容易算了。","examplePinyin":"Bǎ zhè ge shù jiǎnqù shí, dá'àn jiù róngyì suàn le.","translation":"이 수에서 10을 빼면 답을 쉽게 계산할 수 있어요."},{"no":56,"category":"숫자·수량·화폐","word":"数字","pinyin":"shùzì","meaning":"숫자","example":"这两个数字容易看错，请仔细检查。","examplePinyin":"Zhè liǎng gè shùzì róngyì kàn cuò, qǐng zǐxì jiǎnchá.","translation":"이 두 숫자는 잘못 읽기 쉬우니 꼼꼼히 확인해 주세요."},{"no":57,"category":"숫자·수량·화폐","word":"数","pinyin":"shǔ","meaning":"세다, 헤아리다","example":"请数一数人数，看看还有谁没到。","examplePinyin":"Qǐng shǔ yi shǔ rénshù, kànkan háiyǒu shuí méi dào.","translation":"인원수를 세어서 아직 누가 안 왔는지 확인해 주세요."},{"no":58,"category":"숫자·수량·화폐","word":"算","pinyin":"suàn","meaning":"계산하다, ~로 치다","example":"我把费用重新算了一遍，发现多收了钱。","examplePinyin":"Wǒ bǎ fèiyòng chóngxīn suàn le yí biàn, fāxiàn duō shōu le qián.","translation":"비용을 다시 계산해 보니 돈을 더 받았다는 것을 알았어요."},{"no":59,"category":"숫자·수량·화폐","word":"减","pinyin":"jiǎn","meaning":"줄이다, 빼다","example":"为了少吃糖，我把奶茶里的糖减了一半。","examplePinyin":"Wèile shǎo chī táng, wǒ bǎ nǎichá lǐ de táng jiǎn le yíbàn.","translation":"설탕을 덜 먹으려고 밀크티에 넣는 설탕을 절반으로 줄였어요."},{"no":60,"category":"숫자·수량·화폐","word":"加上","pinyin":"jiāshàng","meaning":"더하다, 보태다","example":"票价加上行李费，一共是三百元。","examplePinyin":"Piàojià jiāshàng xíngli fèi, yígòng shì sānbǎi yuán.","translation":"표 값에 수하물 요금을 더하면 모두 300위안이에요."},{"no":61,"category":"숫자·수량·화폐","word":"共","pinyin":"gòng","meaning":"모두, 합계","example":"参加这次活动的学生共六十名。","examplePinyin":"Cānjiā zhè cì huódòng de xuéshēng gòng liùshí míng.","translation":"이번 행사에 참가한 학생은 총 60명이에요."},{"no":62,"category":"숫자·수량·화폐","w ation":"저 나무는 아주 오래됐지만 해마다 여전히 꽃이 피어요."},{"no":97,"category":"숫자·수량·화폐","word":"片","pinyin":"piàn","meaning":"조각, 편(양사)","example":"他把面包切成几片，分给了大家。","examplePinyin":"Tā bǎ miànbāo qiēchéng jǐ piàn, fēngěi le dàjiā.","translation":"그는 빵을 몇 조각으로 잘라 모두에게 나누어 줬어요."},{"no":98,"category":"숫자·수량·화폐","word":"篇","pinyin":"piān","meaning":"편(글을 세는 양사)","example":"读完这篇文章，请用自己的话作总结。","examplePinyin":"Dúwán zhè piān wénzhāng, qǐng yòng zìjǐ de huà zuò zǒngjié.","translation":"이 글을 읽고 나서 자신의 말로 요약해 보세요."},{"no":99,"category":"숫자·수량·화폐","word":"首","pinyin":"shǒu","meaning":"첫째; 곡·수(양사)","example":"这首歌让我想起了和朋友旅行的日子。","examplePinyin":"Zhè shǒu gē ràng wǒ xiǎngqǐ le hé péngyou lǚxíng de rìzi.","translation":"이 노래를 들으면 친구와 여행하던 날들이 떠올라요."},{"no":100,"category":"숫자·수량·화폐","word":"台","pinyin":"tái","meaning":"대(기계 등을 세는 양사)","example":"办公室新买了一台打印机，工作方便多了。","examplePinyin":"Bàngōngshì xīn mǎi le yì tái dǎyìnjī, gōngzuò fāngbiàn duō le.","translation":"사무실에 프린터를 새로 한 대 사서 업무가 훨씬 편해졌어요."},{"no":101,"category":"숫자·수량·화폐","word":"趟","pinyin":"tàng","meaning":"번, 차례(왕복·이동의 양사)","example":"行李太多，我只好再跑一趟机场。","examplePinyin":"Xíngli tài duō, wǒ zhǐhǎo zài pǎo yí tàng jīchǎng.","translation":"짐이 너무 많아서 어쩔 수 없이 공항에 한 번 더 다녀왔어요."},{"no":102,"category":"숫자·수량·화폐","word":"项","pinyin":"xiàng","meaning":"항목, 가지(양사)","example":"这项任务虽然复杂，我们仍按时完成了。","examplePinyin":"Zhè xiàng rènwu suīrán fùzá, wǒmen réng ànshí wánchéng le.","translation":"이 임무는 복잡했지만 우리는 제시간에 마쳤어요."},{"no":103,"category":"숫자·수량·화폐","word":"座","pinyin":"zuò","meaning":"건물·산·다리 등의 양사","example":"过了那座桥，再向右转就到学校了。","examplePinyin":"Guò le nà zuò qiáo, zài xiàng yòu zhuǎn jiù dào xuéxiào le.","translation":"저 다리를 건너 오른쪽으로 돌면 학교가 나와요."},{"no":104,"category":"숫자·수량·화폐","word":"步","pinyin":"bù","meaning":"걸음, 보","example":"离成功还有几步，我们应该继续努力。","examplePinyin":"Lí chénggōng háiyǒu jǐ bù, wǒmen yīnggāi jìxù nǔlì.","translation":"성공까지 몇 걸음 남았으니 계속 노력해야 해요."},{"no":105,"category":"숫자·수량·화폐","word":"公里","pinyin":"gōnglǐ","meaning":"킬로미터","example":"旅馆离景 ample":"会议前后，他都忙着整理有关材料。","examplePinyin":"Huìyì qiánhòu, tā dōu máng zhe zhěnglǐ yǒuguān cáiliào.","translation":"그는 회의 전후로 관련 자료를 정리하느라 바빴어요."},{"no":185,"category":"시간·날짜","word":"等到","pinyin":"děngdào","meaning":"~할 때까지 기다리다","example":"等到大家都来了，我们再一起出发。","examplePinyin":"Děngdào dàjiā dōu lái le, wǒmen zài yìqǐ chūfā.","translation":"모두 다 오면 그때 함께 출발하도록 해요."},{"no":186,"category":"시간·날짜","word":"到来","pinyin":"dàolái","meaning":"도래하다, 찾아오다","example":"随着春天的到来，公园里的花开了。","examplePinyin":"Suízhe chūntiān de dàolái, gōngyuán lǐ de huā kāi le.","translation":"봄이 찾아오면서 공원에 꽃이 피었어요."},{"no":187,"category":"시간·날짜","word":"再说","pinyin":"zàishuō","meaning":"나중에 이야기하다, 게다가","example":"先把今天的任务做完，别的事以后再说。","examplePinyin":"Xiān bǎ jīntiān de rènwu zuò wán, biéde shì yǐhòu zàishuō.","translation":"먼저 오늘의 일을 끝내고 다른 일은 나중에 이야기해요."},{"no":188,"category":"시간·날짜","word":"最终","pinyin":"zuìzhōng","meaning":"최종적으로, 결국","example":"经过多次讨论，我们最终决定坐火车。","examplePinyin":"Jīngguò duōcì tǎolùn, wǒmen zuìzhōng juédìng zuò huǒchē.","translation":"여러 차례 논의를 거쳐 우리는 최종적으로 기차를 타기로 했어요."},{"no":189,"category":"시간·날짜","word":"按时","pinyin":"ànshí","meaning":"제시간에, 정시에","example":"虽然路上堵车，他还是按时赶到了。","examplePinyin":"Suīrán lùshang dǔchē, tā háishi ànshí gǎndào le.","translation":"길이 막혔지만 그는 제시간에 도착했어요."},{"no":190,"category":"시간·날짜","word":"准时","pinyin":"zhǔnshí","meaning":"정시에, 제시간에","example":"明早请准时到入口集合，不要迟到。","examplePinyin":"Míngzǎo qǐng zhǔnshí dào rùkǒu jíhé, búyào chídào.","translation":"내일 아침 입구에 제시간에 모여 주세요. 늦지 마세요."},{"no":191,"category":"시간·날짜","word":"及时","pinyin":"jíshí","meaning":"제때에, 적시에","example":"多亏同事及时提醒，我才没有填错。","examplePinyin":"Duōkuī tóngshì jíshí tíxǐng, wǒ cái méiyǒu tián cuò.","translation":"동료가 제때 알려 준 덕분에 잘못 적지 않았어요."},{"no":192,"category":"시간·날짜","word":"提前","pinyin":"tíqián","meaning":"앞당기다, 미리","example":"航班提前了半小时，我得赶快去机场。","examplePinyin":"Hángbān tíqián le bàn xiǎoshí, wǒ děi gǎnkuài qù jīchǎng.","translation":"항공편이 30분 앞당겨져서 서둘러 공항에 가야 해요."},{"no":193,"category":"시간·날짜","word":"迟","pinyin":"chí","meaning":"늦다","example":"今天比平时起得迟，所以没有吃早餐。","examplePinyin":"Jīntiān bǐ píngshí qǐ de chí, suǒyǐ méiyǒu chī zǎocān.","translation":"오늘은 평소보다 늦게 일어나 아침을 먹지 못했어요."},{"no":194,"category":"시간·날짜","word":"空","pinyin":"kòng","meaning":"시간이 나다, 여유가 있다","example":"你什么时候有空？我想和你商量件事。","examplePinyin":"Nǐ shénme shíhou yǒukòng? Wǒ xiǎng hé nǐ shāngliang jiàn shì.","translation":"언제 시간이 나세요? 상의하고 싶은 일이 있어요."},{"no":195,"category":"시간·날짜","word":"来不及","pinyin":"láibují","meaning":"시간에 맞추지 못하다","example":"现在出门已经来不及，只好取消约会。","examplePinyin":"Xiànzài chūmén yǐjīng láibují, zhǐhǎo qǔxiāo yuēhuì.","translation":"지금 출발하면 이미 늦어서 약속을 취소할 수밖에 없어요."},{"no":196,"category":"시간·날짜","word":"来得及","pinyin":"láidejí","meaning":"시간에 맞출 수 있다","example":"离上课还有十分钟，现在走还来得及。","examplePinyin":"Lí shàngkè háiyǒu shí fēnzhōng, xiànzài zǒu hái láidejí.","translation":"수업까지 아직 10분 남았으니 지금 가면 늦지 않아요."},{"no":197,"category":"시간·날짜","word":"赶紧","pinyin":"gǎnjǐn","meaning":"서둘러, 얼른","example":"外面好像要下雨，赶紧把衣服收进来。","examplePinyin":"Wàimiàn hǎoxiàng yào xiàyǔ, gǎnjǐn bǎ yīfu shōujìnlai.","translation":"밖에 비가 올 것 같으니 서둘러 옷을 걷어 와요."},{"no":198,"category":"시간·날짜","word":"赶快","pinyin":"gǎnkuài","meaning":"빨리, 서둘러","example":"有位乘客不舒服，请赶快联系医生。","examplePinyin":"Yǒu wèi chéngkè bù shūfu, qǐng gǎnkuài liánxì yīshēng.","translation":"몸이 불편한 승객이 한 분 계시니 빨리 의사에게 연락해 주세요."},{"no":199,"category":"시간·날짜","word":"推迟","pinyin":"tuīchí","meaning":"연기하다, 미루다","example":"因为天气原因，比赛推迟到了周末。","examplePinyin":"Yīnwèi tiānqì yuányīn, bǐsài tuīchí dào le zhōumò.","translation":"날씨 때문에 대회가 주말로 연기됐어요."},{"no":200,"category":"시간·날짜","word":"正好","pinyin":"zhènghǎo","meaning":"마침, 딱 알맞다","example":"这件外套大小正好，我决定买下来。","examplePinyin":"Zhè jiàn wàitào dàxiǎo zhènghǎo, wǒ juédìng mǎixiàlai.","translation":"이 외투는 크기가 딱 맞아서 사기로 했어요."},{"no":201,"category":"시간·날짜","word":"从来","pinyin":"cónglái","meaning":"여태껏, 지금까지","example":"我从来没参加过这种比赛，有些紧张。","examplePinyin":"Wǒ cónglái méi cānjiā guo zhè zhǒng bǐsài, yǒuxiē jǐnzhāng.","translation":"이런 대회에는 한 번도 참가한 적이 없어서 조금 긴장돼요."},{"no":202,"category":"시간·날짜","word":"老是","pinyin":"lǎoshì","meaning":"늘, 자꾸","example":"你老是忘记带钥匙，应该想个办法。","examplePinyin":"Nǐ lǎoshi wàngjì dài yàoshi, yīnggāi xiǎng gè bànfǎ.","translation":"자꾸 열쇠를 잊고 나오니 방법을 생각해 봐야겠어요."},{"no":203,"category":"시간·날짜","word":"往往","pinyin":"wǎngwǎng","meaning":"흔히, 대개","example":"节假日去景区，往往需要提前买票。","examplePinyin":"Jiéjiàrì qù jǐngqū, wǎngwǎng xūyào tíqián mǎipiào.","translation":"공휴일에 관광지에 가려면 흔히 표를 미리 사야 해요."},{"no":204,"category":"시간·날짜","word":"平常","pinyin":"píngcháng","meaning":"평소, 보통","example":"他平常话不多，讨论工作时却很积极。","examplePinyin":"Tā píngcháng huà bù duō, tǎolùn gōngzuò shí què hěn jījí.","translation":"그는 평소에는 말이 적지만 업무를 논의할 때는 적극적이에요."},{"no":205,"category":"시간·날짜","word":"偶尔","pinyin":"ǒu'ěr","meaning":"가끔, 이따금","example":"周末我偶尔去郊区，看看不同的风景。","examplePinyin":"Zhōumò wǒ ǒu'ěr qù jiāoqū, kànkan bùtóng de fēngjǐng.","translation":"주말에는 가끔 교외에 가서 색다른 경치를 구경해요."},{"no":206,"category":"시간·날짜","word":"随时","pinyin":"suíshí","meaning":"언제든지","example":"有不清楚的地方，随时可以来问我。","examplePinyin":"Yǒu bù qīngchu de dìfang, suíshí kěyǐ lái wèn wǒ.","translation":"잘 모르는 부분이 있으면 언제든 제게 물어보셔도 돼요."},{"no":207,"category":"시간·날짜","word":"不断","pinyin":"búduàn","meaning":"끊임없이, 계속","example":"为了提高口语，她不断寻找交流的机会。","examplePinyin":"Wèile tígāo kǒuyǔ, tā búduàn xúnzhǎo jiāoliú de jīhuì.","translation":"회화 실력을 높이려고 그녀는 끊임없이 대화할 기회를 찾아요."},{"no":208,"category":"시간·날짜","word":"仍","pinyin":"réng","meaning":"여전히, 아직도","example":"虽然已经毕业，我们仍常回学校看老师。","examplePinyin":"Suīrán yǐjīng bìyè, wǒmen réng cháng huí xuéxiào kàn lǎoshī.","translation":"이미 졸업했지만 우리는 여전히 학교에 자주 가서 선생님을 찾아뵈어요."},{"no":209,"category":"시간·날짜","word":"仍然","pinyin":"réngrán","meaning":"여전히, 변함없이","example":"雨已经停了，外面的风仍然很大。","examplePinyin":"Yǔ yǐjīng tíng le, wàimiàn de fēng réngrán hěn dà.","translation":"비는 이미 그쳤지만 밖에는 여전히 바람이 세게 불어요."},{"no":210,"category":"시간·날짜","word":"永远","pinyin":"yǒngyuǎn","meaning":"영원히","example":"无论以后住在哪里，我永远不会忘记家乡。","examplePinyin":"Wúlùn yǐhòu zhù zài nǎlǐ, wǒ yǒngyuǎn búhuì wàngjì jiāxiāng.","translation":"앞으로 어디에 살든 저는 고향을 영원히 잊지 않을 거예요."},{"no":211,"category":"시간·날짜","word":"暂时","pinyin":"zànshí","meaning":"잠시, 일시적으로","example":"这件事暂时没有结果，请再耐心等一等。","examplePinyin":"Zhè jiàn shì zànshí méiyǒu jiéguǒ, qǐng zài nàixīn děng yi děng.","translation":"이 일은 당장 결과가 나오지 않았으니 조금 더 기다려 주세요."},{"no":212,"category":"시간·날짜","word":"忽然","pinyin":"hūrán","meaning":"갑자기, 문득","example":"他忽然想起忘带文件，马上回了办公室。","examplePinyin":"Tā hūrán xiǎngqǐ wàng dài wénjiàn, mǎshàng huí le bàngōngshì.","translation":"그는 서류를 놓고 왔다는 것이 갑자기 생각나 곧바로 사무실로 돌아갔어요."},{"no":213,"category":"시간·날짜","word":"此次","pinyin":"cǐcì","meaning":"이번","example":"此次旅行的费用比我们预计的少。","examplePinyin":"Cǐcì lǚxíng de fèiyòng bǐ wǒmen yùjì de shǎo.","translation":"이번 여행 비용은 우리가 예상한 것보다 적었어요."},{"no":214,"category":"시간·날짜","word":"再次","pinyin":"zàicì","meaning":"다시 한번","example":"感谢你的邀请，希望以后再次见面。","examplePinyin":"Gǎnxiè nǐ de yāoqǐng, xīwàng yǐhòu zàicì jiànmiàn.","translation":"초대해 주셔서 감사하며 다음에 다시 만나기를 바라요."},{"no":215,"category":"시간·날짜","word":"重新","pinyin":"chóngxīn","meaning":"다시, 새롭게","example":"弄清错误的原因后，请重新填写表格。","examplePinyin":"Nòngqīng cuòwù de yuányīn hòu, qǐng chóngxīn tiánxiě biǎogé.","translation":"잘못된 이유를 알아본 뒤 양식을 다시 작성해 주세요."},{"no":216,"category":"학교·학습·언어","word":"学院","pinyin":"xuéyuàn","meaning":"단과대학, 전문 교육기관","example":"这所学院提供的课程，特别重视实际经验。","examplePinyin":"Zhè suǒ xuéyuàn tígōng de kèchéng, tèbié zhòngshì shíjì jīngyàn.","translation":"이 대학에서 제공하는 수업은 실제 경험을 특히 중요하게 여겨요."},{"no":217,"category":"학교·학습·언어","word":"本科","pinyin":"běnkē","meaning":"대학 학부","example":"读完本科以后，他打算继续学习。","examplePinyin":"Dúwán běnkē yǐhòu, tā dǎsuàn jìxù xuéxí.","translation":"학부 과정을 마친 뒤 그는 공부를 계속할 생각이에요."},{"no":218,"category":"학교·학습·언어","word":"研究生","pinyin":"yánjiūshēng","meaning":"대학원생","example":"她一边读研究生，一边在学校教书。","examplePinyin":"Tā yìbiān dú yánjiūshēng, yìbiān zài xuéxiào jiāoshū.","translation":"그녀는 대학원에 다니면서 학교에서 가르쳐요."},{"no":219,"category":"학교·학습·언어","word":"博士","pinyin":"bóshì","meaning":"박사","example":"这位博士用简单的例子解释科学知识。","examplePinyin":"Zhè wèi bóshì yòng jiǎndān de lìzi jiěshì kēxué zhīshi.","translation":"이 박사는 쉬운 예를 들어 과학 지식을 설명해요."},{"no":220,"category":"학교·학습·언어","word":"专业","pinyin":"zhuānyè","meaning":"전공, 전문적이다","example":"选择专业时，应该考虑兴趣和能力。","examplePinyin":"Xuǎnzé zhuānyè shí, yīnggāi kǎolǜ xìngqù hé nénglì.","translation":"전공을 고를 때는 흥미와 능력을 생각해야 해요."},{"no":221,"category":"학교·학습·언어","word":"教师","pinyin":"jiàoshī","meaning":"교사, 선생님","example":"教师的态度，常常影响学生的学习兴趣。","examplePinyin":"Jiàoshī de tàidu, chángcháng yǐngxiǎng xuéshēng de xuéxí xìngqù.","translation":"교사의 태도는 학생의 학습 흥미에 자주 영향을 미쳐요."},{"no":222,"category":"학교·학습·언어","word":"教授","pinyin":"jiàoshòu","meaning":"교수, 가르치다","example":"那位教授讲得很清楚，我想上他的课。","examplePinyin":"Nà wèi jiàoshòu jiǎng de hěn qīngchu, wǒ xiǎng shàng tā de kè.","translation":"그 교수는 설명이 명확해서 그의 수업을 듣고 싶어요."},{"no":223,"category":"학교·학습·언어","word":"师生","pinyin":"shīshēng","meaning":"교사와 학생","example":"师生之间互相理解，课堂气氛才会更好。","examplePinyin":"Shīshēng zhījiān hùxiāng lǐjiě, kètáng qìfēn cái huì gèng hǎo.","translation":"교사와 학생이 서로 이해해야 수업 분위기가 더 좋아져요."},{"no":224,"category":"학교·학습·언어","word":"操场","pinyin":"cāochǎng","meaning":"운동장","example":"下课后，同学们约好在操场练习排球。","examplePinyin":"Xiàkè hòu, tóngxuémen yuē hǎo zài cāochǎng liànxí páiqiú.","translation":"수업이 끝난 뒤 학생들은 운동장에서 배구를 연습하기로 했어요."},{"no":225,"category":"학교·학습·언어","word":"课堂","pinyin":"kètáng","meaning":"교실, 수업 시간","example":"课堂上不懂的问题，我会记下来再请教。","examplePinyin":"Kètáng shàng bù dǒng de wèntí, wǒ huì jìxiàlai zài qǐngjiào.","translation":"수업 중 이해하지 못한 문제는 적어 두었다가 다시 여쭤봐요."},{"no":226,"category":"학교·학습·언어","word":"课程","pinyin":"kèchéng","meaning":"강좌, 교육과정","example":"这门课程不仅介绍理论，也安排实际练习。","examplePinyin":"Zhè mén kèchéng bùjǐn jièshào lǐlùn, yě ānpái shíjì liànxí.","translation":"이 수업은 이론을 소개할 뿐 아니라 실습도 마련해요."},{"no":227,"category":"학교·학습·언어","word":"教学","pinyin":"jiàoxué","meaning":"교육, 교수 활동","example":"老师用图片进行教学， ranslation":"보안 검사를 통과해야 대합실에 들어갈 수 있어요."},{"no":444,"category":"이동·교통","word":"降落","pinyin":"jiàngluò","meaning":"착륙하다, 내려앉다","example":"飞机降落时，窗外的城市越来越清楚。","examplePinyin":"Fēijī jiàngluò shí, chuāngwài de chéngshì yuèláiyuè qīngchu.","translation":"비행기가 착륙할 때 창밖의 도시가 점점 또렷하게 보였어요."},{"no":445,"category":"이동·교통","word":"换乘","pinyin":"huànchéng","meaning":"환승하다","example":"在下一站换乘二号线，就能到博物馆。","examplePinyin":"Zài xià yí zhàn huànchéng èr hào xiàn, jiù néng dào bówùguǎn.","translation":"다음 역에서 2호선으로 갈아타면 박물관에 갈 수 있어요."},{"no":446,"category":"이동·교통","word":"转机","pinyin":"zhuǎnjī","meaning":"비행기를 갈아타다, 환승","example":"这次需要在北京转机，中间有三个小时。","examplePinyin":"Zhè cì xūyào zài Běijīng zhuǎnjī, zhōngjiān yǒu sān gè xiǎoshí.","translation":"이번에는 베이징에서 비행기를 갈아타며 중간에 세 시간이 있어요."},{"no":447,"category":"이동·교통","word":"公路","pinyin":"gōnglù","meaning":"도로, 큰길","example":"新公路修好以后，去县城方便多了。","examplePinyin":"Xīn gōnglù xiūhǎo yǐhòu, qù xiànchéng fāngbiàn duō le.","translation":"새 도로가 완공된 뒤 현 소재지에 가기가 훨씬 편해졌어요."},{"no":448,"category":"이동·교통","word":"道路","pinyin":"dàolù","meaning":"도로, 길","example":"雨后道路很滑，开车一定要小心。","examplePinyin":"Yǔ hòu dàolù hěn huá, kāichē yídìng yào xiǎoxīn.","translation":"비가 온 뒤 도로가 미끄러우니 운전할 때 꼭 조심하세요."},{"no":449,"category":"이동·교통","word":"街道","pinyin":"jiēdào","meaning":"거리, 도로","example":"节日期间，街道两旁挂满了彩灯。","examplePinyin":"Jiérì qījiān, jiēdào liǎngpáng guàmǎn le cǎidēng.","translation":"명절 기간에는 거리 양쪽에 색색의 등이 가득 걸려요."},{"no":450,"category":"이동·교통","word":"桥","pinyin":"qiáo","meaning":"다리","example":"走过前面那座桥，就能看见车站。","examplePinyin":"Zǒuguò qiánmiàn nà zuò qiáo, jiù néng kànjiàn chēzhàn.","translation":"앞에 있는 다리를 건너면 정류장이 보여요."},{"no":451,"category":"이동·교통","word":"加油站","pinyin":"jiāyóuzhàn","meaning":"주유소","example":"油快用完了，我们得找个加油站。","examplePinyin":"Yóu kuài yòng wán le, wǒmen děi zhǎo gè jiāyóuzhàn.","translation":"기름이 거의 다 떨어져서 주유소를 찾아야 해요."},{"no":452,"category":"이동·교통","word":"高速","pinyin":"gāosù","meaning":"고속","example":"走高速虽然要付费，但是能节约时间。","examplePinyin":"Zǒu gāosù suīrán yào fùfèi, dànshì néng jiéyuē shíjiān.","translation":"고속도로를 이용하면 요금을 내야 하지만 시간을 절약할 수 있어요."},{"no":453,"category":"이동·교통","word":"车速","pinyin":"chēsù","meaning":"차량 속도","example":"前面有学校，请把车速降下来。","examplePinyin":"Qiánmiàn yǒu xuéxiào, qǐng bǎ chēsù jiàngxiàlai.","translation":"앞에 학교가 있으니 차량 속도를 줄여 주세요."},{"no":454,"category":"이동·교통","word":"堵车","pinyin":"dǔchē","meaning":"교통 체증, 차가 막히다","example":"为了避开堵车，我们比平时早出发一小时。","examplePinyin":"Wèile bìkāi dǔchē, wǒmen bǐ píngshí zǎo chūfā yì xiǎoshí.","translation":"교통 체증을 피하려고 평소보다 한 시간 일찍 출발했어요."},{"no":455,"category":"이동·교통","word":"转","pinyin":"zhuǎn","meaning":"돌리다, 방향을 바꾸다","example":"到了第二个路口向右转，银行就在左边。","examplePinyin":"Dào le dì'èr gè lùkǒu xiàng yòu zhuǎn, yínháng jiù zài zuǒbian.","translation":"두 번째 교차로에서 우회전하면 은행이 왼쪽에 있어요."},{"no":456,"category":"이동·교통","word":"停车","pinyin":"tíngchē","meaning":"주차하다","example":"这条路不允许停车，请开到前面去。","examplePinyin":"Zhè tiáo lù bù yǔnxǔ tíngchē, qǐng kāi dào qiánmiàn qù.","translation":"이 길은 주차가 허용되지 않으니 앞으로 가 주세요."},{"no":457,"category":"이동·교통","word":"停车场","pinyin":"tíngchēchǎng","meaning":"주차장","example":"停车场的入口在后面，需要绕过去。","examplePinyin":"Tíngchēchǎng de rùkǒu zài hòumiàn, xūyào ràoguòqu.","translation":"주차장 입구는 뒤에 있어서 돌아가야 해요."},{"no":458,"category":"이동·교통","word":"车位","pinyin":"chēwèi","meaning":"주차 공간","example":"附近的车位都满了，我们只好停远一点。","examplePinyin":"Fùjìn de chēwèi dōu mǎn le, wǒmen zhǐhǎo tíng yuǎn yìdiǎn.","translation":"근처 주차 공간이 다 차서 어쩔 수 없이 조금 멀리 주차했어요."},{"no":459,"category":"이동·교통","word":"座位","pinyin":"zuòwèi","meaning":"좌석, 자리","example":"这个座位有人吗？我想坐在窗边。","examplePinyin":"Zhè ge zuòwèi yǒurén ma? Wǒ xiǎng zuò zài chuāng biān.","translation":"이 자리 주인 있나요? 창가에 앉고 싶어요."},{"no":460,"category":"이동·교통","word":"旅行","pinyin":"lǚxíng","meaning":"여행하다","example":"旅行不仅能放松心情，还能增长见识。","examplePinyin":"Lǚxíng bùjǐn néng fàngsōng xīnqíng, hái néng zēngzhǎng jiànshi.","translation":"여행은 기분을 편하게 해 줄 뿐 아니라 견문도 넓혀 줘요."},{"no":461,"category":"이동·교통","word":"度假","pinyi 집을 빌리고 싶어요."},{"no":470,"category":"집·공간·생활","word":"出租","pinyin":"chūzū","meaning":"임대하다, 빌려주다","example":"这套房子只出租，不出售。","examplePinyin":"Zhè tào fángzi zhǐ chūzū, bù chūshòu.","translation":"이 집은 임대만 하고 매매는 하지 않아요."},{"no":471,"category":"집·공간·생활","word":"房东","pinyin":"fángdōng","meaning":"집주인","example":"发现水管坏了以后，我马上联系了房东。","examplePinyin":"Fāxiàn shuǐguǎn huài le yǐhòu, wǒ mǎshàng liánxì le fángdōng.","translation":"수도관이 고장 난 것을 발견한 후 바로 집주인에게 연락했어요."},{"no":472,"category":"집·공간·생활","word":"房租","pinyin":"fángzū","meaning":"집세, 월세","example":"除了房租，每个月还要交水电费。","examplePinyin":"Chúle fángzū, měi gè yuè hái yào jiāo shuǐdiànfèi.","translation":"월세 외에 매달 수도와 전기 요금도 내야 해요."},{"no":473,"category":"집·공간·생활","word":"院子","pinyin":"yuànzi","meaning":"마당, 뜰","example":"爷爷在院子里种了花，每天都细心照顾。","examplePinyin":"Yéye zài yuànzi lǐ zhòng le huā, měi tiān dōu xìxīn zhàogu.","translation":"할아버지는 마당에 꽃을 심어 매일 정성껏 돌보세요."},{"no":474,"category":"집·공간·생활","word":"大厅","pinyin":"dàtīng","meaning":"로비, 홀","example":"请在大厅等候，轮到您时会有人通知。","examplePinyin":"Qǐng zài dàtīng děnghòu, lún dào nín shí huì yǒurén tōngzhī.","translation":"순서가 되면 알려 드릴 테니 로비에서 기다려 주세요."},{"no":475,"category":"집·공간·생활","word":"客厅","pinyin":"kètīng","meaning":"거실","example":"我们把客厅重新整理了一下，显得宽敞多了。","examplePinyin":"Wǒmen bǎ kètīng chóngxīn zhěnglǐ le yíxià, xiǎnde kuānchang duō le.","translation":"거실을 다시 정리하니 훨씬 넓어 보여요."},{"no":476,"category":"집·공간·생활","word":"厨房","pinyin":"chúfáng","meaning":"주방, 부엌","example":"妈妈在厨房忙着做饭，我进去帮她洗菜。","examplePinyin":"Māma zài chúfáng máng zhe zuòfàn, wǒ jìnqù bāng tā xǐcài.","translation":"엄마가 부엌에서 바쁘게 요리하고 계셔서 들어가 채소 씻는 것을 도왔어요."},{"no":477,"category":"집·공간·생활","word":"厕所","pinyin":"cèsuǒ","meaning":"화장실","example":"请问厕所在几楼？这层好像没有。","examplePinyin":"Qǐngwèn cèsuǒ zài jǐ lóu? Zhè céng hǎoxiàng méiyǒu.","translation":"화장실은 몇 층에 있나요? 이 층에는 없는 것 같아요."},{"no":478,"category":"집·공간·생활","word":"窗","pinyin":"chuāng","meaning":"창문","example":"关窗以前，请看看外面晾的衣服干了没有。","examplePinyin":"Guānchuāng yǐqián, qǐng kànkan wàimiàn liàng de yīfu gān le méiyǒu.","translation":"창문을 닫기 전에 밖에 널어 둔 옷이 말랐는지 확인해 주세요."},{"no":479,"category":"집·공간·생활","word":"窗户","pinyin":"chuānghu","meaning":"창문","example":"阳光透过窗户照进来，屋里很暖和。","examplePinyin":"Yángguāng tòuguò chuānghu zhàojìnlai, wūlǐ hěn nuǎnhuo.","translation":"햇빛이 창문을 통해 들어와서 방 안이 따뜻해요."},{"no":480,"category":"집·공간·생활","word":"家具","pinyin":"jiājù","meaning":"가구","example":"搬家以前，我们决定卖掉一部分旧家具。","examplePinyin":"Bānjiā yǐqián, wǒmen juédìng màidiào yí bùfen jiù jiājù.","translation":"이사하기 전에 오래된 가구 일부를 팔기로 했어요."},{"no":481,"category":"집·공간·생활","word":"镜子","pinyin":"jìngzi","meaning":"거울","example":"出门前，他站在镜子前整理了一下衣服。","examplePinyin":"Chūmén qián, tā zhàn zài jìngzi qián zhěnglǐ le yíxià yīfu.","translation":"그는 외출 전에 거울 앞에 서서 옷매무새를 정돈했어요."},{"no":482,"category":"집·공간·생활","word":"钥匙","pinyin":"yàoshi","meaning":"열쇠","example":"我到家才发现，钥匙落在办公室了。","examplePinyin":"Wǒ dào jiā cái fāxiàn, yàoshi là zài bàngōngshì le.","translation":"집에 도착해서야 열쇠를 사무실에 두고 왔다는 것을 알았어요."},{"no":483,"category":"집·공간·생활","word":"毛巾","pinyin":"máojīn","meaning":"수건","example":"游泳以后，请用自己的毛巾擦干头发。","examplePinyin":"Yóuyǒng yǐhòu, qǐng yòng zìjǐ de máojīn cāgān tóufa.","translation":"수영 후에는 자기 수건으로 머리를 닦아 말리세요."},{"no":484,"category":"집·공간·생활","word":"纸巾","pinyin":"zhǐjīn","meaning":"휴지, 티슈","example":"饮料洒在桌上了，快拿纸巾擦一下。","examplePinyin":"Yǐnliào sǎ zài zhuōshàng le, kuài ná zhǐjīn cā yíxià.","translation":"음료가 탁자에 쏟아졌으니 얼른 휴지로 닦아 주세요."},{"no":485,"category":"집·공간·생활","word":"牙膏","pinyin":"yágāo","meaning":"치약","example":"牙膏快用完了，回家路上记得买一支。","examplePinyin":"Yágāo kuài yòng wán le, huíjiā lùshang jìde mǎi yì zhī.","translation":"치약을 거의 다 썼으니 집에 오는 길에 하나 사 오는 것을 잊지 마세요."},{"no":486,"category":"집·공간·생활","word":"桶","pinyin":"tǒng","meaning":"통, 양동이","example":"他提了一桶水，把院子的地面冲干净了。","examplePinyin":"Tā tí le yì tǒng shuǐ, bǎ yuànzi de dìmiàn chōng gānjìng le.","translation":"그는 물 한 통을 가져와 마당 바닥을 물로 깨끗이 씻었어요."},{"no":487,"category":"집·공간·생활","word":"刀","pinyin":"dāo","meaning": in":"duìyuán","meaning":"팀원, 대원","example":"每位队员都有自己的任务，不能只顾自己。","examplePinyin":"Měi wèi duìyuán dōu yǒu zìjǐ de rènwu, bùnéng zhǐgù zìjǐ.","translation":"모든 팀원에게 각자의 임무가 있으니 자기만 생각해서는 안 돼요."},{"no":567,"category":"여가·미디어·소통","word":"队长","pinyin":"duìzhǎng","meaning":"팀장, 주장","example":"队长鼓励大家，不到最后不能放弃。","examplePinyin":"Duìzhǎng gǔlì dàjiā, búdào zuìhòu bùnéng fàngqì.","translation":"주장은 마지막까지 포기하면 안 된다고 모두를 격려했어요."},{"no":568,"category":"여가·미디어·소통","word":"球队","pinyin":"qiúduì","meaning":"구단, 운동팀","example":"这支球队上次输了，这次准备再试一次。","examplePinyin":"Zhè zhī qiúduì shàngcì shū le, zhè cì zhǔnbèi zài shì yí cì.","translation":"이 팀은 지난번에 졌지만 이번에 다시 도전할 준비를 하고 있어요."},{"no":569,"category":"여가·미디어·소통","word":"球迷","pinyin":"qiúmí","meaning":"스포츠 팬","example":"比赛还没开始，球迷们就已经坐满了看台。","examplePinyin":"Bǐsài hái méi kāishǐ, qiúmímen jiù yǐjīng zuòmǎn le kàntái.","translation":"경기가 시작하기도 전에 팬들이 관중석을 가득 메웠어요."},{"no":570,"category":"여가·미디어·소통","word":"会员","pinyin":"huìyuán","meaning":"회원","example":"成为会员后，可以免费使用这里的设备。","examplePinyin":"Chéngwéi huìyuán hòu, kěyǐ miǎnfèi shǐyòng zhèlǐ de shèbèi.","translation":"회원이 되면 이곳의 장비를 무료로 사용할 수 있어요."},{"no":571,"category":"여가·미디어·소통","word":"大赛","pinyin":"dàsài","meaning":"큰 대회, 경연대회","example":"为了参加这次大赛，他准备了半年。","examplePinyin":"Wèile cānjiā zhè cì dàsài, tā zhǔnbèi le bàn nián.","translation":"이번 큰 대회에 참가하기 위해 그는 반년 동안 준비했어요."},{"no":572,"category":"여가·미디어·소통","word":"参赛","pinyin":"cānsài","meaning":"대회에 참가하다","example":"这是她第一次参赛，能完成比赛就很满意。","examplePinyin":"Zhè shì tā dìyīcì cānsài, néng wánchéng bǐsài jiù hěn mǎnyì.","translation":"이번이 첫 출전이라 그녀는 경기를 마치는 것만으로도 만족해요."},{"no":573,"category":"여가·미디어·소통","word":"竞争","pinyin":"jìngzhēng","meaning":"경쟁하다, 경쟁","example":"竞争虽然激烈，我们仍然有成功的机会。","examplePinyin":"Jìngzhēng suīrán jīliè, wǒmen réngrán yǒu chénggōng de jīhuì.","translation":"경쟁은 치열하지만 우리에게는 여전히 성공할 기회가 있어요."},{"no":574,"category":"여가·미디어·소통","word":"输","pinyin":"shū","meaning":"지다, 패배하다","example":"输了比赛并不可怕，重要的是找到原因。","examplePinyin":"S ing":"사진, 그림 이미지","example":"这张图片有些模糊，能发一张清楚的吗？","examplePinyin":"Zhè zhāng túpiàn yǒuxiē móhu, néng fā yì zhāng qīngchu de ma?","translation":"이 사진은 좀 흐릿한데 선명한 것으로 하나 보내 줄 수 있나요?"},{"no":609,"category":"여가·미디어·소통","word":"图","pinyin":"tú","meaning":"그림, 도표","example":"看这张图，就能了解城市的基本情况。","examplePinyin":"Kàn zhè zhāng tú, jiù néng liǎojiě chéngshì de jīběn qíngkuàng.","translation":"이 도표를 보면 도시의 기본 상황을 알 수 있어요."},{"no":610,"category":"여가·미디어·소통","word":"拍","pinyin":"pāi","meaning":"찍다, 두드리다","example":"这张照片是逆着光拍的，所以脸很暗。","examplePinyin":"Zhè zhāng zhàopiàn shì nì zhe guāng pāi de, suǒyǐ liǎn hěn àn.","translation":"이 사진은 역광으로 찍어서 얼굴이 어둡게 나왔어요."},{"no":611,"category":"여가·미디어·소통","word":"互联网","pinyin":"hùliánwǎng","meaning":"인터넷","example":"互联网让远在国外的家人也能随时联系。","examplePinyin":"Hùliánwǎng ràng yuǎn zài guówài de jiārén yě néng suíshí liánxì.","translation":"인터넷 덕분에 멀리 외국에 있는 가족과도 언제든 연락할 수 있어요."},{"no":612,"category":"여가·미디어·소통","word":"网页","pinyin":"wǎngyè","meaning":"웹페이지","example":"网页打不开，可能是网络出了问题。","examplePinyin":"Wǎngyè dǎ bu kāi, kěnéng shì wǎngluò chū le wèntí.","translation":"웹페이지가 열리지 않는 것은 인터넷에 문제가 생겨서일 수 있어요."},{"no":613,"category":"여가·미디어·소통","word":"网址","pinyin":"wǎngzhǐ","meaning":"웹사이트 주소","example":"请检查网址是否正确，再重新打开。","examplePinyin":"Qǐng jiǎnchá wǎngzhǐ shìfǒu zhèngquè, zài chóngxīn dǎkāi.","translation":"웹사이트 주소가 정확한지 확인한 뒤 다시 열어 주세요."},{"no":614,"category":"여가·미디어·소통","word":"网友","pinyin":"wǎngyǒu","meaning":"온라인 친구, 네티즌","example":"这位网友分享的经验，对我很有帮助。","examplePinyin":"Zhè wèi wǎngyǒu fēnxiǎng de jīngyàn, duì wǒ hěn yǒu bāngzhù.","translation":"이 온라인 친구가 공유한 경험은 제게 큰 도움이 돼요."},{"no":615,"category":"여가·미디어·소통","word":"密码","pinyin":"mìmǎ","meaning":"비밀번호","example":"为了保护信息，最好不要使用太简单的密码。","examplePinyin":"Wèile bǎohù xìnxī, zuìhǎo búyào shǐyòng tài jiǎndān de mìmǎ.","translation":"정보를 보호하려면 너무 간단한 비밀번호는 쓰지 않는 게 좋아요."},{"no":616,"category":"여가·미디어·소통","word":"短信","pinyin":"duǎnxìn","meaning":"문자 메시지","example":"我怕打电话影响你休息，就发了条短信。","examplePinyin":"Wǒ pà ":"Qǐng yòng yí ge shíjì lìzi, shuōmíng zhè ge fāngfǎ de hǎochu.","translation":"실제 예를 하나 들어 이 방법의 장점을 설명해 주세요."},{"no":634,"category":"여가·미디어·소통","word":"解释","pinyin":"jiěshì","meaning":"설명하다, 해석하다","example":"你先别着急，给他一个解释的机会。","examplePinyin":"Nǐ xiān bié zháojí, gěi tā yí ge jiěshì de jīhuì.","translation":"우선 조급해하지 말고 그에게 설명할 기회를 주세요."},{"no":635,"category":"여가·미디어·소통","word":"谈","pinyin":"tán","meaning":"이야기하다, 논의하다","example":"关于工作的安排，我想和你单独谈谈。","examplePinyin":"Guānyú gōngzuò de ānpái, wǒ xiǎng hé nǐ dāndú tántan.","translation":"업무 배치에 관해 당신과 따로 이야기하고 싶어요."},{"no":636,"category":"여가·미디어·소통","word":"讨论","pinyin":"tǎolùn","meaning":"토론하다, 의논하다","example":"经过讨论，大家终于达成了一致意见。","examplePinyin":"Jīngguò tǎolùn, dàjiā zhōngyú dáchéng le yízhì yìjiàn.","translation":"토론을 거쳐 모두 마침내 의견을 모았어요."},{"no":637,"category":"여가·미디어·소통","word":"商量","pinyin":"shāngliang","meaning":"의논하다, 상의하다","example":"这件事关系到全家，应该一起商量。","examplePinyin":"Zhè jiàn shì guānxi dào quánjiā, yīnggāi yìqǐ shāngliang.","translation":"이 일은 온 가족과 관계되니 함께 의논해야 해요."},{"no":638,"category":"여가·미디어·소통","word":"建议","pinyin":"jiànyì","meaning":"제안하다, 건의하다","example":"我建议先试用几天，再决定是否购买。","examplePinyin":"Wǒ jiànyì xiān shìyòng jǐ tiān, zài juédìng shìfǒu gòumǎi.","translation":"며칠 써 본 뒤 살지 결정하는 것을 제안해요."},{"no":639,"category":"여가·미디어·소통","word":"提出","pinyin":"tíchū","meaning":"제기하다, 제안하다","example":"他提出的办法很实用，大家都赞成。","examplePinyin":"Tā tíchū de bànfǎ hěn shíyòng, dàjiā dōu zànchéng.","translation":"그가 제안한 방법이 실용적이어서 모두 찬성해요."},{"no":640,"category":"여가·미디어·소통","word":"提到","pinyin":"tídào","meaning":"언급하다","example":"刚才提到的问题，我们下午再讨论。","examplePinyin":"Gāngcái tídào de wèntí, wǒmen xiàwǔ zài tǎolùn.","translation":"방금 언급한 문제는 오후에 다시 토론해요."},{"no":641,"category":"여가·미디어·소통","word":"提醒","pinyin":"tíxǐng","meaning":"일깨우다, 상기시키다","example":"幸亏你提醒，我才没有忘记开会。","examplePinyin":"Xìngkuī nǐ tíxǐng, wǒ cái méiyǒu wàngjì kāihuì.","translation":"네가 일깨워 준 덕분에 회의를 잊지 않았어."},{"no":642,"category":"여가·미디어·소통","word":"通知","pinyin":"t slation":"모임이 끝나 갈 때 우리는 단체 사진을 한 장 찍었어요."},{"no":651,"category":"여가·미디어·소통","word":"庆祝","pinyin":"qìngzhù","meaning":"축하하다, 기념하다","example":"为了庆祝毕业，全班一起去郊外旅行。","examplePinyin":"Wèile qìngzhù bìyè, quánbān yìqǐ qù jiāowài lǚxíng.","translation":"졸업을 축하하기 위해 반 전체가 함께 교외로 여행을 갔어요."},{"no":652,"category":"여가·미디어·소통","word":"参观","pinyin":"cānguān","meaning":"참관하다, 견학하다","example":"参观工厂以后，我才明白产品是怎么做的。","examplePinyin":"Cānguān gōngchǎng yǐhòu, wǒ cái míngbai chǎnpǐn shì zěnme zuò de.","translation":"공장을 견학한 뒤에야 제품이 어떻게 만들어지는지 알았어요."},{"no":653,"category":"여가·미디어·소통","word":"开玩笑","pinyin":"kāi wánxiào","meaning":"농담하다","example":"他只是开玩笑，并没有责怪你的意思。","examplePinyin":"Tā zhǐshì kāi wánxiào, bìng méiyǒu zéguài nǐ de yìsi.","translation":"그는 농담했을 뿐 너를 탓하려는 뜻은 없었어."},{"no":654,"category":"여가·미디어·소통","word":"笑话","pinyin":"xiàohua","meaning":"농담, 우스갯소리","example":"这个笑话我听过，不过再听还是觉得好笑。","examplePinyin":"Zhè ge xiàohua wǒ tīng guo, búguò zài tīng háishi juéde hǎoxiào.","translation":"이 농담은 들어 봤지만 다시 들어도 웃겨요."},{"no":655,"category":"여가·미디어·소통","word":"幽默","pinyin":"yōumò","meaning":"유머러스하다","example":"他讲话很幽默，再复杂的问题也能讲得有趣。","examplePinyin":"Tā jiǎnghuà hěn yōumò, zài fùzá de wèntí yě néng jiǎng de yǒuqù.","translation":"그는 말에 유머가 있어서 복잡한 문제도 재미있게 설명해요."},{"no":656,"category":"여가·미디어·소통","word":"好笑","pinyin":"hǎoxiào","meaning":"우습다, 재미있다","example":"我当时很着急，现在想起来却觉得好笑。","examplePinyin":"Wǒ dāngshí hěn zháojí, xiànzài xiǎng qǐlai què juéde hǎoxiào.","translation":"그때는 마음이 급했는데 지금 생각하면 오히려 웃겨요."},{"no":657,"category":"여가·미디어·소통","word":"有趣","pinyin":"yǒuqù","meaning":"재미있다, 흥미롭다","example":"这次实验很有趣，连不爱科学的同学也喜欢。","examplePinyin":"Zhè cì shíyàn hěn yǒuqù, lián bú ài kēxué de tóngxué yě xǐhuan.","translation":"이번 실험은 재미있어서 과학을 싫어하는 친구들도 좋아해요."},{"no":658,"category":"여가·미디어·소통","word":"表扬","pinyin":"biǎoyáng","meaning":"칭찬하다","example":"因为主动帮助同学，他受到了老师的表扬。","examplePinyin":"Yīnwèi zhǔdòng bāngzhù tóngxué, tā shòudào le lǎoshī de biǎoyáng.","translation":"그는 먼저 나서서 친구를 도와 선생님께 칭찬을 받았어요."},{"no":659,"category":"여가·미디어·소통","word":"批评","pinyin":"pīpíng","meaning":"비판하다, 꾸짖다","example":"面对批评，我们应该先想想自己的问题。","examplePinyin":"Miànduì pīpíng, wǒmen yīnggāi xiān xiǎngxiang zìjǐ de wèntí.","translation":"비판을 받으면 먼저 자신의 문제를 생각해 봐야 해요."},{"no":660,"category":"여가·미디어·소통","word":"鼓励","pinyin":"gǔlì","meaning":"격려하다","example":"多亏朋友的鼓励，我才有勇气再次尝试。","examplePinyin":"Duōkuī péngyou de gǔlì, wǒ cái yǒu yǒngqì zàicì chángshì.","translation":"친구의 격려 덕분에 다시 시도할 용기가 생겼어요."},{"no":661,"category":"여가·미디어·소통","word":"允许","pinyin":"yǔnxǔ","meaning":"허락하다, 허용하다","example":"未经允许，请不要使用别人的电脑。","examplePinyin":"Wèijīng yǔnxǔ, qǐng búyào shǐyòng biérén de diànnǎo.","translation":"허락을 받지 않고 다른 사람의 컴퓨터를 사용하지 마세요."},{"no":662,"category":"동작·감각·생각","word":"动作","pinyin":"dòngzuò","meaning":"동작, 움직임","example":"这个动作看着简单，做起来却很难。","examplePinyin":"Zhè ge dòngzuò kànzhe jiǎndān, zuò qǐlai què hěn nán.","translation":"이 동작은 보기에는 쉽지만 실제로 하기는 어려워요."},{"no":663,"category":"동작·감각·생각","word":"按","pinyin":"àn","meaning":"누르다, ~에 따라","example":"按下绿色按钮，机器就会开始工作。","examplePinyin":"Àn xià lǜsè ànniǔ, jīqì jiù huì kāishǐ gōngzuò.","translation":"초록색 버튼을 누르면 기계가 작동하기 시작해요."},{"no":664,"category":"동작·감각·생각","word":"压","pinyin":"yā","meaning":"누르다, 압박하다","example":"请别把重物压在书上，封面会变形。","examplePinyin":"Qǐng bié bǎ zhòngwù yā zài shūshàng, fēngmiàn huì biànxíng.","translation":"표지가 변형되니 책 위에 무거운 물건을 올려 누르지 마세요."},{"no":665,"category":"동작·감각·생각","word":"推","pinyin":"tuī","meaning":"밀다","example":"门是往外开的，你应该推，不是拉。","examplePinyin":"Mén shì wǎng wài kāi de, nǐ yīnggāi tuī, búshì lā.","translation":"문은 밖으로 열리니 당기지 말고 밀어야 해요."},{"no":666,"category":"동작·감각·생각","word":"拉","pinyin":"lā","meaning":"당기다, 끌다","example":"他拉住了我的手，带我穿过人群。","examplePinyin":"Tā lā zhù le wǒ de shǒu, dài wǒ chuānguò rénqún.","translation":"그는 제 손을 잡고 사람들 사이로 이끌어 줬어요."},{"no":667,"category":"동작·감각·생각","word":"抱","pinyin":"bào","meaning":"안다, 껴안다","example":"孩子哭着跑过来，紧紧抱住了妈妈。","examplePinyin":"Háizi kū zhe pǎoguòlai, jǐnjǐn bàozhù le māma.","translation":"아이는 울면서 달려와 엄마를 꼭 껴안았어요."},{"no":668,"category":"동작·감각·생각","word":"举","pinyin":"jǔ","meaning":"들다, 들어 올리다","example":"同意这个方案的人，请举一下手。","examplePinyin":"Tóngyì zhè ge fāng'àn de rén, qǐng jǔ yíxià shǒu.","translation":"이 방안에 동의하는 분은 손을 들어 주세요."},{"no":669,"category":"동작·감각·생각","word":"抬","pinyin":"tái","meaning":"들어 올리다","example":"这张桌子太重，得两个人一起抬。","examplePinyin":"Zhè zhāng zhuōzi tài zhòng, děi liǎng gè rén yìqǐ tái.","translation":"이 탁자는 너무 무거워서 두 사람이 함께 들어야 해요."},{"no":670,"category":"동작·감각·생각","word":"抬头","pinyin":"táitóu","meaning":"고개를 들다","example":"听见有人叫自己，他马上抬头看了一眼。","examplePinyin":"Tīngjiàn yǒurén jiào zìjǐ, tā mǎshàng táitóu kàn le yì yǎn.","translation":"누군가 자신을 부르는 소리를 듣고 그는 곧바로 고개를 들어 봤어요."},{"no":671,"category":"동작·감각·생각","word":"躺","pinyin":"tǎng","meaning":"눕다","example":"他累得躺在沙发上，一句话也不想说。","examplePinyin":"Tā lèi de tǎng zài shāfā shàng, yí jù huà yě bùxiǎng shuō.","translation":"그는 너무 피곤해서 소파에 누워 한마디도 하고 싶지 않았어요."},{"no":672,"category":"동작·감각·생각","word":"提","pinyin":"tí","meaning":"들다, 제기하다","example":"奶奶提着一袋水果，慢慢走进了屋。","examplePinyin":"Nǎinai tí zhe yí dài shuǐguǒ, mànmàn zǒujìn le wū.","translation":"할머니는 과일 한 봉지를 들고 천천히 방 안에 들어오셨어요."},{"no":673,"category":"동작·감각·생각","word":"取","pinyin":"qǔ","meaning":"찾다, 꺼내다, 받다","example":"请凭号码到窗口取票，不用重新排队。","examplePinyin":"Qǐng píng hàomǎ dào chuāngkǒu qǔ piào, búyòng chóngxīn páiduì.","translation":"번호를 제시하고 창구에서 표를 받으시면 되니 다시 줄 설 필요 없어요."},{"no":674,"category":"동작·감각·생각","word":"交","pinyin":"jiāo","meaning":"내다, 제출하다, 건네다","example":"明天交作业以前，请把姓名写清楚。","examplePinyin":"Míngtiān jiāo zuòyè yǐqián, qǐng bǎ xìngmíng xiě qīngchu.","translation":"내일 과제를 내기 전에 이름을 분명하게 써 주세요."},{"no":675,"category":"동작·감각·생각","word":"扔","pinyin":"rēng","meaning":"던지다, 버리다","example":"这些旧报纸还有用，先别扔掉。","examplePinyin":"Zhèxiē jiù bàozhǐ háiyǒu yòng, xiān bié rēngdiào.","translation":"이 오래된 신문은 아직 쓸모가 있으니 우선 버리지 마세요."},{"no":676,"category":"동작·감각·생각","word":"倒","pinyin":"dào","meaning":"붓다, 따르다","example":"请给客人倒杯茶，水不要倒得太满。","examplePinyin":"Qǐng gěi kèrén dào bēi chá, shuǐ búyào dào de tài mǎn.","translation":"손님께 차를 한 잔 따라 드리되 물을 너무 가득 따르지 마세요."},{"no":677,"category":"동작·감각·생각","word":"弄","pinyin":"nòng","meaning":"하다, 만지다, 처리하다","example":"谁把我的书弄湿了？上面还有水。","examplePinyin":"Shuí bǎ wǒ de shū nòngshī le? Shàngmiàn háiyǒu shuǐ.","translation":"누가 제 책을 젖게 했나요? 위에 아직 물이 있어요."},{"no":678,"category":"동작·감각·생각","word":"装","pinyin":"zhuāng","meaning":"담다, 넣다, 설치하다","example":"箱子里装的都是书，所以特别重。","examplePinyin":"Xiāngzi lǐ zhuāng de dōu shì shū, suǒyǐ tèbié zhòng.","translation":"상자 안에 든 것이 모두 책이라서 특히 무거워요."},{"no":679,"category":"동작·감각·생각","word":"指","pinyin":"zhǐ","meaning":"가리키다","example":"他指着地图，告诉我车站在什么位置。","examplePinyin":"Tā zhǐzhe dìtú, gàosu wǒ chēzhàn zài shénme wèizhi.","translation":"그는 지도를 가리키며 역이 어디에 있는지 알려 줬어요."},{"no":680,"category":"동작·감각·생각","word":"敲","pinyin":"qiāo","meaning":"두드리다, 노크하다","example":"进屋之前先敲门，是对别人的尊重。","examplePinyin":"Jìnwū zhīqián xiān qiāomén, shì duì biérén de zūnzhòng.","translation":"방에 들어가기 전에 먼저 노크하는 것은 다른 사람을 존중하는 일이에요."},{"no":681,"category":"동작·감각·생각","word":"吹","pinyin":"chuī","meaning":"불다","example":"风把桌上的纸吹到了地上。","examplePinyin":"Fēng bǎ zhuōshàng de zhǐ chuī dào le dìshang.","translation":"바람이 탁자 위의 종이를 바닥으로 날려 버렸어요."},{"no":682,"category":"동작·감각·생각","word":"吸","pinyin":"xī","meaning":"빨아들이다, 들이마시다","example":"他深深吸了一口气，然后走上了舞台。","examplePinyin":"Tā shēnshēn xī le yì kǒu qì, ránhòu zǒushàng le wǔtái.","translation":"그는 깊이 숨을 들이마신 다음 무대에 올라갔어요."},{"no":683,"category":"동작·감각·생각","word":"发出","pinyin":"fāchū","meaning":"내다, 발송하다","example":"机器突然发出奇怪的声音，大家都停了下来。","examplePinyin":"Jīqì tūrán fāchū qíguài de shēngyīn, dàjiā dōu tíng le xiàlai.","translation":"기계가 갑자기 이상한 소리를 내서 모두 멈췄어요."},{"no":684,"category":"동작·감각·생각","word":"掉","pinyin":"diào","meaning":"떨어지다, 잃어버리다","example":"我的手机掉在地上，屏幕摔坏了。","examplePinyin":"Wǒ de shǒujī diào zài dìshang, píngmù shuāihuài le.","translation":"제 휴대전화가 바닥에 떨어져서 화면이 깨졌어요."},{"no":685,"category":"동작·감각·생각","word":"落","pinyin":"luò","meaning":"떨어지다, 지다","example":"秋风一吹，树叶就纷纷落下来。","examplePinyin":"Qiūfēng yì chuī, shùyè jiù fēnfēn luòxiàlai.","translation":"가을바람이 불자 나뭇잎이 우수수 떨어져요."},{"no":686,"category":"동작·감각·생각","word":"流","pinyin":"liú","meaning":"흐르다","example":"雨水沿着屋顶往下流，打湿了门口。","examplePinyin":"Yǔshuǐ yánzhe wūdǐng wǎng xià liú, dǎshī le ménkǒu.","translation":"빗물이 지붕을 따라 흘러내려 입구를 적셨어요."},{"no":687,"category":"동작·감각·생각","word":"通","pinyin":"tōng","meaning":"통하다, 연결되다","example":"这条路通向哪里？地图上没有标出来。","examplePinyin":"Zhè tiáo lù tōngxiàng nǎlǐ? Dìtú shàng méiyǒu biāochūlai.","translation":"이 길은 어디로 통하나요? 지도에는 표시되어 있지 않아요."},{"no":688,"category":"동작·감각·생각","word":"排","pinyin":"pái","meaning":"배열하다, 줄을 서다","example":"请按身高排好，准备拍合影。","examplePinyin":"Qǐng àn shēngāo pái hǎo, zhǔnbèi pāi héyǐng.","translation":"단체 사진을 찍을 수 있게 키순으로 서 주세요."},{"no":689,"category":"동작·감각·생각","word":"排队","pinyin":"páiduì","meaning":"줄을 서다","example":"即使赶时间，也应该按顺序排队。","examplePinyin":"Jíshǐ gǎn shíjiān, yě yīnggāi àn shùnxù páiduì.","translation":"시간이 급해도 순서대로 줄을 서야 해요."},{"no":690,"category":"동작·감각·생각","word":"列","pinyin":"liè","meaning":"나열하다, 줄","example":"他列了一张清单，写下旅行需要的东西。","examplePinyin":"Tā liè le yì zhāng qīngdān, xiěxià lǚxíng xūyào de dōngxi.","translation":"그는 여행에 필요한 물건을 적어 목록을 하나 만들었어요."},{"no":691,"category":"동작·감각·생각","word":"分为","pinyin":"fēnwéi","meaning":"~로 나뉘다, 구분하다","example":"这本书分为三个部分，内容由浅入深。","examplePinyin":"Zhè běn shū fēnwéi sān gè bùfen, nèiróng yóuqiǎnrùshēn.","translation":"이 책은 세 부분으로 나뉘며 내용은 쉬운 것에서 어려운 것으로 이어져요."},{"no":692,"category":"동작·감각·생각","word":"过程","pinyin":"guòchéng","meaning":"과정","example":"学习的过程虽然辛苦，却让我很有收获。","examplePinyin":"Xuéxí de guòchéng suīrán xīnkǔ, què ràng wǒ hěn yǒu shōuhuò.","translation":"배우는 과정은 힘들지만 얻는 것이 많아요."},{"no":693,"category":"동작·감각·생각","word":"进行","pinyin":"jìnxíng","meaning":"진행하다","example":"设备检查正在进行，请大家耐心等候。","examplePinyin":"Shèbèi jiǎnchá zhèngzài jìnxíng, qǐng dàjiā nàixīn děnghòu.","translation":"장비 점검이 진행 중이니 모두 차분히 기다려 주세요."},{"n ，请按要求操作。","examplePinyin":"Píngmù shàng chūxiàn le tíshì, qǐng àn yāoqiú cāozuò.","translation":"화면에 안내가 떴으니 지시대로 조작해 주세요."},{"no":712,"category":"동작·감각·생각","word":"产生","pinyin":"chǎnshēng","meaning":"생기다, 발생하다","example":"缺少交流，很容易产生误会。","examplePinyin":"Quēshǎo jiāoliú, hěn róngyì chǎnshēng wùhuì.","translation":"소통이 부족하면 오해가 생기기 쉬워요."},{"no":713,"category":"동작·감각·생각","word":"成为","pinyin":"chéngwéi","meaning":"~이 되다","example":"经过长期练习，他终于成为一名教练。","examplePinyin":"Jīngguò chángqī liànxí, tā zhōngyú chéngwéi yì míng jiàoliàn.","translation":"오랜 연습 끝에 그는 마침내 코치가 되었어요."},{"no":714,"category":"동작·감각·생각","word":"引起","pinyin":"yǐnqǐ","meaning":"일으키다, 유발하다","example":"这件小事引起了大家对环保的关注。","examplePinyin":"Zhè jiàn xiǎoshì yǐnqǐ le dàjiā duì huánbǎo de guānzhù.","translation":"이 작은 일이 환경 보호에 대한 모두의 관심을 불러일으켰어요."},{"no":715,"category":"동작·감각·생각","word":"积累","pinyin":"jīlěi","meaning":"축적하다, 쌓다","example":"学习语言需要慢慢积累，不能只靠考试前复习。","examplePinyin":"Xuéxí yǔyán xūyào mànmàn jīlěi, bùnéng zhǐ kào kǎoshì qián fùxí.","translation":"언어 학습은 조금씩 쌓아 가야 하며 시험 직전 복습에만 의존할 수 없어요."},{"no":716,"category":"동작·감각·생각","word":"获得","pinyin":"huòdé","meaning":"얻다, 획득하다","example":"他通过努力，获得了去国外学习的机会。","examplePinyin":"Tā tōngguò nǔlì, huòdé le qù guówài xuéxí de jīhuì.","translation":"그는 노력해서 외국에서 공부할 기회를 얻었어요."},{"no":717,"category":"동작·감각·생각","word":"获取","pinyin":"huòqǔ","meaning":"얻다, 취득하다","example":"我们可以从网上获取信息，但要注意真假。","examplePinyin":"Wǒmen kěyǐ cóng wǎngshàng huòqǔ xìnxī, dàn yào zhùyì zhēnjiǎ.","translation":"인터넷에서 정보를 얻을 수 있지만 사실인지 주의해서 봐야 해요."},{"no":718,"category":"동작·감각·생각","word":"取得","pinyin":"qǔdé","meaning":"얻다, 취득하다","example":"在大家的帮助下，研究取得了新的进展。","examplePinyin":"Zài dàjiā de bāngzhù xià, yánjiū qǔdé le xīn de jìnzhǎn.","translation":"모두의 도움으로 연구가 새롭게 진전되었어요."},{"no":719,"category":"동작·감각·생각","word":"收","pinyin":"shōu","meaning":"받다, 거두다","example":"快下雨了，赶紧把阳台上的衣服收进来。","examplePinyin":"Kuài xiàyǔ le, gǎnjǐn bǎ yángtái shàng de yīfu shōujìnlai.","translation":"곧 비가 올 것 같으니 베란다의 옷을 얼른
