."},{"no":838,"category":"성질·상태·문법","word":"怕","pinyin":"pà","meaning":"두려워하다, 무서워하다","example":"为了记住“怕”，我写：“我怕狗。”","examplePinyin":"wèile jìzhu “pà”, wǒ xiě: “wǒ pà gǒu.”","translation":"“怕”를 기억하려고 저는 “저는 개를 무서워해요.”라고 썼어요."},{"no":839,"category":"성질·상태·문법","word":"奇怪","pinyin":"qíguài","meaning":"이상하다","example":"复习“奇怪”时，我读到：“这件事很奇怪。”","examplePinyin":"fùxí “qíguài” shí, wǒ dúdào: “zhè jiàn shì hěn qíguài.”","translation":"“奇怪”를 복습할 때, 저는 “이 일은 아주 이상해요.”라는 문장을 읽었어요."},{"no":840,"category":"성질·상태·문법","word":"一样","pinyin":"yíyàng","meaning":"같다, 똑같다","example":"复习“一样”时，我读到：“我们的想法一样。”","examplePinyin":"fùxí “yíyàng” shí, wǒ dúdào: “wǒmen de xiǎngfǎ yíyàng.”","translation":"“一样”를 복습할 때, 저는 “우리의 생각은 같아요.”라는 문장을 읽었어요."},{"no":841,"category":"성질·상태·문법","word":"不同","pinyin":"bùtóng","meaning":"다르다","example":"老师用“不同”举例：“我们的想法不同。”","examplePinyin":"lǎoshī yòng “bùtóng” jǔlì: “wǒmen de xiǎngfǎ bùtóng.”","translation":"선생님은 “不同”를 사용해 “우리의 생각은 달라요.”라고 예를 들었어요."},{"no":842,"category":"성질·상태·문법","word":"差不多","pinyin":"chàbuduō","meaning":"거의 같다, 비슷하다","example":"学“差不多”时，我写：“这两个差不多。”","examplePinyin":"xué “chàbuduō” shí, wǒ xiě: “zhè liǎng ge chàbuduō.”","translation":"“差不多”를 배울 때 저는 “이 두 개는 거의 비슷해요.”라고 썼어요."},{"no":843,"category":"성질·상태·문법","word":"比","pinyin":"bǐ","meaning":"~보다","example":"老师用“比”举例：“我比他高。”","examplePinyin":"lǎoshī yòng “bǐ” jǔlì: “wǒ bǐ tā gāo.”","translation":"선생님은 “比”를 사용해 “저는 그보다 키가 커요.”라고 예를 들었어요."},{"no":844,"category":"성질·상태·문법","word":"比较","pinyin":"bǐjiào","meaning":"비교적, 비교하다","example":"老师用“比较”举例：“今天比较冷。”","examplePinyin":"lǎoshī yòng “bǐjiào” jǔlì: “jīntiān bǐjiào lěng.”","translation":"선생님은 “比较”를 사용해 “오늘은 비교적 추워요.”라고 예를 들었어요."},{"no":845,"category":"성질·상태·문법","word":"更","pinyin":"gèng","meaning":"더욱, 더","example":"为了记住“更”，我写：“今天比昨天更冷。”","examplePinyin":"wèile jìzhu “gèng”, wǒ xiě: “jīntiān bǐ zuótiān gèng lěng.”","translation":"“更”를 기억하려고 저는 “오늘은 어제보다 더 추워요.”라고 썼어요."},{"no":846,"category":"성질·상태·문법","word":"最","pinyin":"zuì","meaning":"가장, 제일","example":"课上学“最”时，老师说：“我最喜欢汉语。”","examplePinyin":"kè shàng xué “zuì” shí, lǎoshī shuō: “wǒ zuì xǐhuan Hànyǔ.”","translation":"수업에서 “最”를 배울 때, 선생님은 “저는 중국어를 가장 좋아해요.”라고 말씀하셨어요."},{"no":847,"category":"성질·상태·문법","word":"越","pinyin":"yuè","meaning":"~할수록 더욱","example":"复习“越”时，我读到：“天气越来越冷了。”","examplePinyin":"fùxí “yuè” shí, wǒ dúdào: “tiānqì yuè lái yuè lěng le.”","translation":"“越”를 복습할 때, 저는 “날씨가 점점 더 추워지고 있어요.”라는 문장을 읽었어요."},{"no":848,"category":"성질·상태·문법","word":"很","pinyin":"hěn","meaning":"매우, 아주","example":"学“很”时，我写：“她很漂亮。”","examplePinyin":"xué “hěn” shí, wǒ xiě: “tā hěn piàoliang.”","translation":"“很”를 배울 때 저는 “그녀는 아주 예뻐요.”라고 썼어요."},{"no":849,"category":"성질·상태·문법","word":"非常","pinyin":"fēicháng","meaning":"매우","example":"课上学“非常”时，老师说：“我非常高兴。”","examplePinyin":"kè shàng xué “fēicháng” shí, lǎoshī shuō: “wǒ fēicháng gāoxìng.”","translation":"수업에서 “非常”를 배울 때, 선생님은 “저는 매우 기뻐요.”라고 말씀하셨어요."},{"no":850,"category":"성질·상태·문법","word":"太","pinyin":"tài","meaning":"너무, 몹시","example":"课上学“太”时，老师说：“今天太热了。”","examplePinyin":"kè shàng xué “tài” shí, lǎoshī shuō: “jīntiān tài rè le.”","translation":"수업에서 “太”를 배울 때, 선생님은 “오늘 너무 더워요.”라고 말씀하셨어요."},{"no":851,"category":"성질·상태·문법","word":"真","pinyin":"zhēn","meaning":"정말, 진짜","example":"课上学“真”时，老师说：“这个菜真好吃。”","examplePinyin":"kè shàng xué “zhēn” shí, lǎoshī shuō: “zhège cài zhēn hǎochī.”","translation":"수업에서 “真”를 배울 때, 선생님은 “이 요리는 정말 맛있어요.”라고 말씀하셨어요."},{"no":852,"category":"성질·상태·문법","word":"挺","pinyin":"tǐng","meaning":"꽤, 상당히","example":"为了记住“挺”，我写：“这件衣服挺漂亮的。”","examplePinyin":"wèile jìzhu “tǐng”, wǒ xiě: “zhè jiàn yīfu tǐng piàoliang de.”","translation":"“挺”를 기억하려고 저는 “이 옷은 꽤 예뻐요.”라고 썼어요."},{"no":853,"category":"성질·상태·문법","word":"极","pinyin":"jí","meaning":"매우, 극히","example":"学“极”时，我写：“今天冷极了。”","examplePinyin":"xué “jí” shí, wǒ xiě: “jīntiān lěng jí le.”","translation":"“极”를 배울 때 저는 “오늘은 정말 추워요.”라고 썼어요."},{"no":854,"category":"성질·상태·문법","word":"大概","pinyin":"dàgài","meaning":"대략, 아마","example":"课上学“大概”时，老师说：“他大概八点来。”","examplePinyin":"kè shàng xué “dàgài” shí, lǎoshī shuō: “tā dàgài bā diǎn lái.”","translation":"수업에서 “大概”를 배울 때, 선생님은 “그는 아마 8시쯤 올 거예요.”라고 말씀하셨어요."},{"no":855,"category":"성질·상태·문법","word":"几乎","pinyin":"jīhū","meaning":"거의","example":"老师用“几乎”举例：“我几乎每天都运动。”","examplePinyin":"lǎoshī yòng “jīhū” jǔlì: “wǒ jīhū měitiān dōu yùndòng.”","translation":"선생님은 “几乎”를 사용해 “저는 거의 매일 운동해요.”라고 예를 들었어요."},{"no":856,"category":"성질·상태·문법","word":"不","pinyin":"bù","meaning":"~않다, 아니다","example":"课上学“不”时，老师说：“我不喝茶。”","examplePinyin":"kè shàng xué “bù” shí, lǎoshī shuō: “wǒ bù hē chá.”","translation":"수업에서 “不”를 배울 때, 선생님은 “저는 차를 마시지 않아요.”라고 말씀하셨어요."},{"no":857,"category":"성질·상태·문법","word":"没(有)","pinyin":"méi(yǒu)","meaning":"없다, ~하지 않았다","example":"课上学“没(有)”时，老师说：“我没有车。”","examplePinyin":"kè shàng xué “méi(yǒu)” shí, lǎoshī shuō: “wǒ méiyǒu chē.”","translation":"수업에서 “没(有)”를 배울 때, 선생님은 “저는 차가 없어요.”라고 말씀하셨어요."},{"no":858,"category":"성질·상태·문법","word":"不要","pinyin":"búyào","meaning":"~하지 마라","example":"学“不要”时，老师提醒：“不要说话。”","examplePinyin":"xué “búyào” shí, lǎoshī tíxǐng: “búyào shuōhuà.”","translation":"“不要”를 배울 때 선생님이 “말하지 마세요.”라고 당부했어요."},{"no":859,"category":"성질·상태·문법","word":"别¹","pinyin":"bié","meaning":"~하지 마라","example":"学“别¹”时，老师提醒：“别说话。”","examplePinyin":"xué “bié” shí, lǎoshī tíxǐng: “bié shuōhuà.”","translation":"“别¹”를 배울 때 선생님이 “말하지 마세요.”라고 당부했어요."},{"no":860,"category":"성질·상태·문법","word":"不用","pinyin":"búyòng","meaning":"~할 필요 없다","example":"老师用“不用”举例：“不用担心。”","examplePinyin":"lǎoshī yòng “búyòng” jǔlì: “búyòng dānxīn.”","translation":"선생님은 “不用”를 사용해 “걱정하지 않아도 돼요.”라고 예를 들었어요."},{"no":861,"category":"성질·상태·문법","word":"不行","pinyin":"bùxíng","meaning":"안 되다","example":"学“不行”时，我写：“这样不行。”","examplePinyin":"xué “bùxíng” shí, wǒ xiě: “zhèyàng bùxíng.”","translation":"“不行”를 배울 때 저는 “이렇게 하면 안 돼요.”라고 썼어요."},{"no":862,"category":"성질·상태·문법","word":"只是","pinyin":"zhǐshì","meaning":"다만, 단지","example":"老师用“只是”举例：“我只是想问一个问题。”","examplePinyin":"lǎoshī yòng “zhǐshì” jǔlì: “wǒ zhǐshì xiǎng wèn yí ge wèntí.”","translation":"선생님은 “只是”를 사용해 “저는 단지 질문 하나를 하고 싶을 뿐이에요.”라고 예를 들었어요."},{"no":863,"category":"성질·상태·문법","word":"只有","pinyin":"zhǐyǒu","meaning":"오직 ~만, ~해야만","example":"为了记住“只有”，我写：“只有认真学习，才能取得好成绩。”","examplePinyin":"wèile jìzhu “zhǐyǒu”, wǒ xiě: “zhǐyǒu rènzhēn xuéxí, cái néng qǔdé hǎo chéngjì.”","translation":"“只有”를 기억하려고 저는 “열심히 공부해야만 좋은 성적을 얻을 수 있어요.”라고 썼어요."},{"no":864,"category":"성질·상태·문법","word":"只要","pinyin":"zhǐyào","meaning":"~하기만 하면","example":"复习“只要”时，我读到：“只要努力，就会进步。”","examplePinyin":"fùxí “zhǐyào” shí, wǒ dúdào: “zhǐyào nǔlì, jiù huì jìnbù.”","translation":"“只要”를 복습할 때, 저는 “노력하기만 하면 발전할 거예요.”라는 문장을 읽었어요."},{"no":865,"category":"성질·상태·문법","word":"和","pinyin":"hé","meaning":"~와/과, 그리고","example":"为了记住“和”，我写：“我和朋友去电影院。”","examplePinyin":"wèile jìzhu “hé”, wǒ xiě: “wǒ hé péngyou qù diànyǐngyuàn.”","translation":"“和”를 기억하려고 저는 “저는 친구와 영화관에 가요.”라고 썼어요."},{"no":866,"category":"성질·상태·문법","word":"跟","pinyin":"gēn","meaning":"~와 함께, ~을 따라","example":"老师用“跟”举例：“我跟朋友一起去。”","examplePinyin":"lǎoshī yòng “gēn” jǔlì: “wǒ gēn péngyou yìqǐ qù.”","translation":"선생님은 “跟”를 사용해 “저는 친구와 함께 가요.”라고 예를 들었어요."},{"no":867,"category":"성질·상태·문법","word":"或","pinyin":"huò","meaning":"또는, 혹은","example":"复习“或”时，我读到：“你可以坐公交车或地铁。”","examplePinyin":"fùxí “huò” shí, wǒ dúdào: “nǐ kěyǐ zuò gōngjiāochē huò dìtiě.”","translation":"“或”를 복습할 때, 저는 “버스 또는 지하철을 타도 돼요.”라는 문장을 읽었어요."},{"no":868,"category":"성질·상태·문법","word":"或者","pinyin":"huòzhě","meaning":"또는, 혹은","example":"为了记住“或者”，我写：“我们喝茶或者咖啡吧。”","examplePinyin":"wèile jìzhu “huòzhě”, wǒ xiě: “wǒmen hē chá huòzhě kāfēi ba.”","translation":"“或者”를 기억하려고 저는 “우리 차나 커피를 마셔요.”라고 썼어요."},{"no":869,"category":"성질·상태·문법","word":"还是","pinyin":"háishi","meaning":"또는, 여전히","example":"学“还是”时，同学问：“你喝茶还是咖啡？”","examplePinyin":"xué “háishi” shí, tóngxué wèn: “nǐ hē chá háishi kāfēi?”","translation":"“还是”를 배울 때 친구가 “차를 마실래요, 커피를 마실래요?”라고 물었어요."},{"no":870,"category":"성질·상태·문법","word":"但","pinyin":"dàn","meaning":"그러나","example":"复习“但”时，我读到：“我想去，但没时间。”","examplePinyin":"fùxí “dàn” shí, wǒ dúdào: “wǒ xiǎng qù, dàn méi shíjiān.”","translation":"“但”를 복습할 때, 저는 “가고 싶지만 시간이 없어요.”라는 문장을 읽었어요."},{"no":871,"category":"성질·상태·문법","word":"但是","pinyin":"dànshì","meaning":"하지만","example":"为了记住“但是”，我写：“我很累，但是很高兴。”","examplePinyin":"wèile jìzhu “dànshì”, wǒ xiě: “wǒ hěn lèi, dànshì hěn gāoxìng.”","translation":"“但是”를 기억하려고 저는 “저는 피곤하지만 기뻐요.”라고 썼어요."},{"no":872,"category":"성질·상태·문법","word":"可是","pinyin":"kěshì","meaning":"그러나, 하지만","example":"学“可是”时，我写：“我想去，可是没有时间。”","examplePinyin":"xué “kěshì” shí, wǒ xiě: “wǒ xiǎng qù, kěshì méiyǒu shíjiān.”","translation":"“可是”를 배울 때 저는 “가고 싶지만 시간이 없어요.”라고 썼어요."},{"no":873,"category":"성질·상태·문법","word":"虽然","pinyin":"suīrán","meaning":"비록 ~하지만","example":"学“虽然”时，我写：“虽然很累，但是我很高兴。”","examplePinyin":"xué “suīrán” shí, wǒ xiě: “suīrán hěn lèi, dànshì wǒ hěn gāoxìng.”","translation":"“虽然”를 배울 때 저는 “피곤하지만 저는 기뻐요.”라고 썼어요."},{"no":874,"category":"성질·상태·문법","word":"而且","pinyin":"érqiě","meaning":"게다가, ~뿐만 아니라","example":"老师用“而且”举例：“他很聪明，而且很努力。”","examplePinyin":"lǎoshī yòng “érqiě” jǔlì: “tā hěn cōngming, érqiě hěn nǔlì.”","translation":"선생님은 “而且”를 사용해 “그는 똑똑하고 게다가 노력도 많이 해요.”라고 예를 들었어요."},{"no":875,"category":"성질·상태·문법","word":"不但","pinyin":"búdàn","meaning":"~뿐만 아니라","example":"复习“不但”时，我读到：“他不但会英语，还会汉语。”","examplePinyin":"fùxí “búdàn” shí, wǒ dúdào: “tā búdàn huì Yīngyǔ, hái huì Hànyǔ.”","translation":"“不但”를 복습할 때, 저는 “그는 영어뿐 아니라 중국어도 할 줄 알아요.”라는 문장을 읽었어요."},{"no":876,"category":"성질·상태·문법","word":"因为","pinyin":"yīnwèi","meaning":"왜냐하면, ~때문에","example":"老师用“因为”举例：“因为下雨，我不出去。”","examplePinyin":"lǎoshī yòng “yīnwèi” jǔlì: “yīnwèi xià yǔ, wǒ bù chūqù.”","translation":"선생님은 “因为”를 사용해 “비가 오기 때문에 저는 나가지 않아요.”라고 예를 들었어요."},{"no":877,"category":"성질·상태·문법","word":"所以","pinyin":"suǒyǐ","meaning":"그래서","example":"老师用“所以”举例：“今天下雨，所以我不出去。”","examplePinyin":"lǎoshī yòng “suǒyǐ” jǔlì: “jīntiān xià yǔ, suǒyǐ wǒ bù chūqù.”","translation":"선생님은 “所以”를 사용해 “오늘 비가 와서 저는 나가지 않아요.”라고 예를 들었어요."},{"no":878,"category":"성질·상태·문법","word":"如果","pinyin":"rúguǒ","meaning":"만약 ~라면","example":"复习“如果”时，我读到：“如果下雨，我们就不去了。”","examplePinyin":"fùxí “rúguǒ” shí, wǒ dúdào: “rúguǒ xià yǔ, wǒmen jiù bú qù le.”","translation":"“如果”를 복습할 때, 저는 “비가 오면 우리는 가지 않을 거예요.”라는 문장을 읽었어요."},{"no":879,"category":"성질·상태·문법","word":"的话","pinyin":"dehuà","meaning":"~라면, ~할 경우","example":"课上学“的话”时，老师说：“你有时间的话，我们一起去。”","examplePinyin":"kè shàng xué “dehuà” shí, lǎoshī shuō: “nǐ yǒu shíjiān dehuà, wǒmen yìqǐ qù.”","translation":"수업에서 “的话”를 배울 때, 선생님은 “시간이 있다면 우리 함께 가요.”라고 말씀하셨어요."},{"no":880,"category":"성질·상태·문법","word":"也","pinyin":"yě","meaning":"~도, 또한","example":"课上学“也”时，老师说：“我也是学生。”","examplePinyin":"kè shàng xué “yě” shí, lǎoshī shuō: “wǒ yě shì xuéshēng.”","translation":"수업에서 “也”를 배울 때, 선생님은 “저도 학생이에요.”라고 말씀하셨어요."},{"no":881,"category":"성질·상태·문법","word":"都","pinyin":"dōu","meaning":"모두, 다","example":"复习“都”时，我读到：“我们都是学生。”","examplePinyin":"fùxí “dōu” shí, wǒ dúdào: “wǒmen dōu shì xuéshēng.”","translation":"“都”를 복습할 때, 저는 “우리는 모두 학생이에요.”라는 문장을 읽었어요."},{"no":882,"category":"성질·상태·문법","word":"再","pinyin":"zài","meaning":"다시, 또","example":"学“再”时，老师提醒：“请再说一次。”","examplePinyin":"xué “zài” shí, lǎoshī tíxǐng: “qǐng zài shuō yí cì.”","translation":"“再”를 배울 때 선생님이 “다시 한 번 말해 주세요.”라고 당부했어요."},{"no":883,"category":"성질·상태·문법","word":"又","pinyin":"yòu","meaning":"또, 다시","example":"学“又”时，我写：“他今天又迟到了。”","examplePinyin":"xué “yòu” shí, wǒ xiě: “tā jīntiān yòu chídào le.”","translation":"“又”를 배울 때 저는 “그는 오늘 또 지각했어요.”라고 썼어요."},{"no":884,"category":"성질·상태·문법","word":"一起","pinyin":"yìqǐ","meaning":"함께","example":"复习“一起”时，我读到：“我们一起学习吧。”","examplePinyin":"fùxí “yìqǐ” shí, wǒ dúdào: “wǒmen yìqǐ xuéxí ba.”","translation":"“一起”를 복습할 때, 저는 “우리 함께 공부해요.”라는 문장을 읽었어요."},{"no":885,"category":"성질·상태·문법","word":"一块儿","pinyin":"yíkuàir","meaning":"함께, 같이","example":"学“一块儿”时，我写：“我们一块儿去吧。”","examplePinyin":"xué “yíkuàir” shí, wǒ xiě: “wǒmen yíkuàir qù ba.”","translation":"“一块儿”를 배울 때 저는 “우리 함께 가요.”라고 썼어요."},{"no":886,"category":"성질·상태·문법","word":"一边","pinyin":"yìbiān","meaning":"~하면서, 한쪽","example":"老师用“一边”举例：“我一边听音乐，一边学习。”","examplePinyin":"lǎoshī yòng “yìbiān” jǔlì: “wǒ yìbiān tīng yīnyuè, yìbiān xuéxí.”","translation":"선생님은 “一边”를 사용해 “저는 음악을 들으면서 공부해요.”라고 예를 들었어요."},{"no":887,"category":"성질·상태·문법","word":"先","pinyin":"xiān","meaning":"먼저","example":"学“先”时，我写：“你先坐一下。”","examplePinyin":"xué “xiān” shí, wǒ xiě: “nǐ xiān zuò yíxià.”","translation":"“先”를 배울 때 저는 “먼저 잠깐 앉으세요.”라고 썼어요."},{"no":888,"category":"성질·상태·문법","word":"然后","pinyin":"ránhòu","meaning":"그런 다음에","example":"老师用“然后”举例：“我先吃饭，然后做作业。”","examplePinyin":"lǎoshī yòng “ránhòu” jǔlì: “wǒ xiān chīfàn, ránhòu zuò zuòyè.”","translation":"선생님은 “然后”를 사용해 “저는 먼저 밥을 먹고 숙제를 해요.”라고 예를 들었어요."},{"no":889,"category":"성질·상태·문법","word":"的","pinyin":"de","meaning":"~의","example":"老师用“的”举例：“这是我的书。”","examplePinyin":"lǎoshī yòng “de” jǔlì: “zhè shì wǒ de shū.”","translation":"선생님은 “的”를 사용해 “이것은 제 책이에요.”라고 예를 들었어요."},{"no":890,"category":"성질·상태·문법","word":"地","pinyin":"dì","meaning":"땅, 토지","example":"复习“地”时，我读到：“地上有一本书。”","examplePinyin":"fùxí “dì” shí, wǒ dúdào: “dì shàng yǒu yì běn shū.”","translation":"“地”를 복습할 때, 저는 “바닥에 책 한 권이 있어요.”라는 문장을 읽었어요."},{"no":891,"category":"성질·상태·문법","word":"地","pinyin":"de","meaning":"부사어를 나타내는 조사","example":"学“地”时，我写：“他高兴地笑了。”","examplePinyin":"xué “de” shí, wǒ xiě: “tā gāoxìng de xiào le.”","translation":"“地”를 배울 때 저는 “그는 기쁘게 웃었어요.”라고 썼어요."},{"no":892,"category":"성질·상태·문법","word":"了","pinyin":"le","meaning":"완료·변화 표시","example":"课上学“了”时，老师说：“我吃饭了。”","examplePinyin":"kè shàng xué “le” shí, lǎoshī shuō: “wǒ chīfàn le.”","translation":"수업에서 “了”를 배울 때, 선생님은 “저는 밥을 먹었어요.”라고 말씀하셨어요."},{"no":893,"category":"성질·상태·문법","word":"着","pinyin":"zhe","meaning":"동작·상태의 지속을 나타냄","example":"学“着”时，我写：“门开着。”","examplePinyin":"xué “zhe” shí, wǒ xiě: “mén kāi zhe.”","translation":"“着”를 배울 때 저는 “문이 열려 있어요.”라고 썼어요."},{"no":894,"category":"성질·상태·문법","word":"吗","pinyin":"ma","meaning":"~입니까?","example":"学“吗”时，同学问：“你是学生吗？”","examplePinyin":"xué “ma” shí, tóngxué wèn: “nǐ shì xuéshēng ma?”","translation":"“吗”를 배울 때 친구가 “당신은 학생입니까?”라고 물었어요."},{"no":895,"category":"성질·상태·문법","word":"呢","pinyin":"ne","meaning":"~은/는요?","example":"学“呢”时，同学问：“我很好，你呢？”","examplePinyin":"xué “ne” shí, tóngxué wèn: “wǒ hěn hǎo, nǐ ne?”","translation":"“呢”를 배울 때 친구가 “저는 잘 지내요. 당신은요?”라고 물었어요."},{"no":896,"category":"성질·상태·문법","word":"吧","pinyin":"ba","meaning":"~하자, ~하세요","example":"为了记住“吧”，我写：“我们去吃饭吧。”","examplePinyin":"wèile jìzhu “ba”, wǒ xiě: “wǒmen qù chīfàn ba.”","translation":"“吧”를 기억하려고 저는 “우리 밥 먹으러 가요.”라고 썼어요."},{"no":897,"category":"성질·상태·문법","word":"啊","pinyin":"a","meaning":"감탄·어기조사","example":"为了记住“啊”，我写：“今天天气真好啊！”","examplePinyin":"wèile jìzhu “a”, wǒ xiě: “jīntiān tiānqì zhēn hǎo a!”","translation":"“啊”를 기억하려고 저는 “오늘 날씨가 정말 좋네요!”라고 썼어요."},{"no":898,"category":"성질·상태·문법","word":"们","pinyin":"men","meaning":"~들(복수)","example":"学“们”时，我写：“他们都是学生。”","examplePinyin":"xué “men” shí, wǒ xiě: “tāmen dōu shì xuéshēng.”","translation":"“们”를 배울 때 저는 “그들은 모두 학생이에요.”라고 썼어요."},{"no":899,"category":"성질·상태·문법","word":"子","pinyin":"zi","meaning":"접미사(명사 구성)","example":"为了记住“子”，我写：““桌子”的“子”读轻声。”","examplePinyin":"wèile jìzhu “zi”, wǒ xiě: ““Zhuōzi” de “zi” dú qīngshēng.”","translation":"“子”를 기억하려고 저는 “‘桌子’의 ‘子’는 경성으로 읽어요.”라고 썼어요."},{"no":900,"category":"성질·상태·문법","word":"最好","pinyin":"zuìhǎo","meaning":"가장 좋다, ~하는 것이 좋다","example":"课上学“最好”时，老师说：“你最好早点儿休息。”","examplePinyin":"kè shàng xué “zuìhǎo” shí, lǎoshī shuō: “nǐ zuìhǎo zǎo diǎnr xiūxi.”","translation":"수업에서 “最好”를 배울 때, 선생님은 “당신은 조금 일찍 쉬는 것이 좋아요.”라고 말씀하셨어요."},{"no":901,"category":"성질·상태·문법","word":"突然","pinyin":"tūrán","meaning":"갑자기","example":"老师用“突然”举例：“天突然下雨了。”","examplePinyin":"lǎoshī yòng “tūrán” jǔlì: “tiān tūrán xià yǔ le.”","translation":"선생님은 “突然”를 사용해 “갑자기 비가 내렸어요.”라고 예를 들었어요."},{"no":902,"category":"성질·상태·문법","word":"河","pinyin":"hé","meaning":"강","example":"学“河”时，我写：“这条河很长。”","examplePinyin":"xué “hé” shí, wǒ xiě: “zhè tiáo hé hěn cháng.”","translation":"“河”를 배울 때 저는 “이 강은 아주 길어요.”라고 썼어요."},{"no":903,"category":"성질·상태·문법","word":"狗","pinyin":"gǒu","meaning":"개","example":"学“狗”时，我写：“我家有一只狗。”","examplePinyin":"xué “gǒu” shí, wǒ xiě: “wǒ jiā yǒu yì zhī gǒu.”","translation":"“狗”를 배울 때 저는 “우리 집에는 개 한 마리가 있어요.”라고 썼어요."},{"no":904,"category":"성질·상태·문법","word":"结婚","pinyin":"jiéhūn","meaning":"결혼하다","example":"学“结婚”时，我写：“他们明年结婚。”","examplePinyin":"xué “jiéhūn” shí, wǒ xiě: “tāmen míngnián jiéhūn.”","translation":"“结婚”를 배울 때 저는 “그들은 내년에 결혼해요.”라고 썼어요."},{"no":905,"category":"성질·상태·문법","word":"猫","pinyin":"māo","meaning":"고양이","example":"学“猫”时，我写：“我家有一只猫。”","examplePinyin":"xué “māo” shí, wǒ xiě: “wǒ jiā yǒu yì zhī māo.”","translation":"“猫”를 배울 때 저는 “우리 집에는 고양이 한 마리가 있어요.”라고 썼어요."},{"no":906,"category":"성질·상태·문법","word":"不错","pinyin":"búcuò","meaning":"괜찮다, 좋다","example":"学“不错”时，我写：“这个菜不错。”","examplePinyin":"xué “búcuò” shí, wǒ xiě: “zhège cài búcuò.”","translation":"“不错”를 배울 때 저는 “이 요리는 괜찮아요.”라고 썼어요."},{"no":907,"category":"성질·상태·문법","word":"可爱","pinyin":"kě'ài","meaning":"귀엽다","example":"复习“可爱”时，我读到：“这只小猫很可爱。”","examplePinyin":"fùxí “kě'ài” shí, wǒ dúdào: “zhè zhī xiǎo māo hěn kě'ài.”","translation":"“可爱”를 복습할 때, 저는 “이 새끼 고양이는 아주 귀여워요.”라는 문장을 읽었어요."},{"no":908,"category":"성질·상태·문법","word":"养","pinyin":"yǎng","meaning":"기르다, 키우다","example":"老师用“养”举例：“我家养了一只猫。”","examplePinyin":"lǎoshī yòng “yǎng” jǔlì: “wǒ jiā yǎng le yì zhī māo.”","translation":"선생님은 “养”를 사용해 “우리 집은 고양이 한 마리를 키워요.”라고 예를 들었어요."},{"no":909,"category":"성질·상태·문법","word":"爬","pinyin":"pá","meaning":"기어오르다, 오르다","example":"复习“爬”时，我读到：“周末我们去爬山吧。”","examplePinyin":"fùxí “pá” shí, wǒ dúdào: “zhōumò wǒmen qù pá shān ba.”","translation":"“爬”를 복습할 때, 저는 “주말에 우리 등산하러 가요.”라는 문장을 읽었어요."},{"no":910,"category":"성질·상태·문법","word":"其他","pinyin":"qítā","meaning":"기타, 다른","example":"学“其他”时，同学问：“你还有其他问题吗？”","examplePinyin":"xué “qítā” shí, tóngxué wèn: “nǐ hái yǒu qítā wèntí ma?”","translation":"“其他”를 배울 때 친구가 “다른 질문이 더 있나요?”라고 물었어요."},{"no":911,"category":"성질·상태·문법","word":"机会","pinyin":"jīhuì","meaning":"기회","example":"复习“机会”时，我读到：“我想找机会练习汉语。”","examplePinyin":"fùxí “jīhuì” shí, wǒ dúdào: “wǒ xiǎng zhǎo jīhuì liànxí Hànyǔ.”","translation":"“机会”를 복습할 때, 저는 “저는 중국어를 연습할 기회를 찾고 싶어요.”라는 문장을 읽었어요."},{"no":912,"category":"성질·상태·문법","word":"直到","pinyin":"zhídào","meaning":"~까지 줄곧","example":"学“直到”时，我写：“直到晚上十点，我才完成作业。”","examplePinyin":"xué “zhídào” shí, wǒ xiě: “zhídào wǎnshang shí diǎn, wǒ cái wánchéng zuòyè.”","translation":"“直到”를 배울 때 저는 “밤 10시가 되어서야 저는 숙제를 끝냈어요.”라고 썼어요."},{"no":913,"category":"성질·상태·문법","word":"坚持","pinyin":"jiānchí","meaning":"꾸준히 하다, 견지하다","example":"复习“坚持”时，我读到：“我每天坚持学习汉语。”","examplePinyin":"fùxí “jiānchí” shí, wǒ dúdào: “wǒ měitiān jiānchí xuéxí Hànyǔ.”","translation":"“坚持”를 복습할 때, 저는 “저는 매일 꾸준히 중국어를 공부해요.”라는 문장을 읽었어요."},{"no":914,"category":"성질·상태·문법","word":"差","pinyin":"chà","meaning":"나쁘다, 부족하다","example":"课上学“差”时，老师说：“我的汉语还很差。”","examplePinyin":"kè shàng xué “chà” shí, lǎoshī shuō: “wǒ de Hànyǔ hái hěn chà.”","translation":"수업에서 “差”를 배울 때, 선생님은 “제 중국어 실력은 아직 많이 부족해요.”라고 말씀하셨어요."},{"no":915,"category":"성질·상태·문법","word":"放","pinyin":"fàng","meaning":"놓다, 두다","example":"学“放”时，老师提醒：“请把书放在桌子上。”","examplePinyin":"xué “fàng” shí, lǎoshī tíxǐng: “qǐng bǎ shū fàng zài zhuōzi shàng.”","translation":"“放”를 배울 때 선생님이 “책을 책상 위에 놓아 주세요.”라고 당부했어요."},{"no":916,"category":"성질·상태·문법","word":"别的","pinyin":"biéde","meaning":"다른 것","example":"为了记住“别的”，我写：“我想看看别的。”","examplePinyin":"wèile jìzhu “biéde”, wǒ xiě: “wǒ xiǎng kànkan biéde.”","translation":"“别的”를 기억하려고 저는 “저는 다른 것도 보고 싶어요.”라고 썼어요."},{"no":917,"category":"성질·상태·문법","word":"当然","pinyin":"dāngrán","meaning":"당연하다, 물론","example":"复习“当然”时，我读到：“当然可以！”","examplePinyin":"fùxí “dāngrán” shí, wǒ dúdào: “dāngrán kěyǐ!”","translation":"“当然”를 복습할 때, 저는 “물론 괜찮아요!”라는 문장을 읽었어요."},{"no":918,"category":"성질·상태·문법","word":"加","pinyin":"jiā","meaning":"더하다, 추가하다","example":"学“加”时，老师提醒：“请给我加一点儿水。”","examplePinyin":"xué “jiā” shí, lǎoshī tíxǐng: “qǐng gěi wǒ jiā yìdiǎnr shuǐ.”","translation":"“加”를 배울 때 선생님이 “물을 조금 더 넣어 주세요.”라고 당부했어요."},{"no":919,"category":"성질·상태·문법","word":"城市","pinyin":"chéngshì","meaning":"도시","example":"复习“城市”时，我读到：“北京是一个大城市。”","examplePinyin":"fùxí “chéngshì” shí, wǒ dúdào: “běijīng shì yí ge dà chéngshì.”","translation":"“城市”를 복습할 때, 저는 “베이징은 큰 도시예요.”라는 문장을 읽었어요."},{"no":920,"category":"성질·상태·문법","word":"动物","pinyin":"dòngwù","meaning":"동물","example":"老师用“动物”举例：“我很喜欢小动物。”","examplePinyin":"lǎoshī yòng “dòngwù” jǔlì: “wǒ hěn xǐhuan xiǎo dòngwù.”","translation":"선생님은 “动物”를 사용해 “저는 작은 동물을 아주 좋아해요.”라고 예를 들었어요."},{"no":921,"category":"성질·상태·문법","word":"动物园","pinyin":"dòngwùyuán","meaning":"동물원","example":"复习“动物园”时，我读到：“周末我们去动物园吧。”","examplePinyin":"fùxí “dòngwùyuán” shí, wǒ dúdào: “zhōumò wǒmen qù dòngwùyuán ba.”","translation":"“动物园”를 복습할 때, 저는 “주말에 우리 동물원에 가요.”라는 문장을 읽었어요."},{"no":922,"category":"성질·상태·문법","word":"得分","pinyin":"défēn","meaning":"득점하다, 점수를 얻다","example":"为了记住“得分”，我写：“他在比赛中得分了。”","examplePinyin":"wèile jìzhu “défēn”, wǒ xiě: “tā zài bǐsài zhōng défēn le.”","translation":"“得分”를 기억하려고 저는 “그는 경기에서 득점했어요.”라고 썼어요."},{"no":923,"category":"성질·상태·문법","word":"聪明","pinyin":"cōngming","meaning":"똑똑하다","example":"为了记住“聪明”，我写：“这个孩子很聪明。”","examplePinyin":"wèile jìzhu “cōngming”, wǒ xiě: “zhège háizi hěn cōngming.”","translation":"“聪明”를 기억하려고 저는 “이 아이는 아주 똑똑해요.”라고 썼어요."},{"no":924,"category":"성질·상태·문법","word":"变成","pinyin":"biànchéng","meaning":"~로 변하다","example":"学“变成”时，我写：“水变成冰了。”","examplePinyin":"xué “biànchéng” shí, wǒ xiě: “shuǐ biànchéng bīng le.”","translation":"“变成”를 배울 때 저는 “물이 얼음으로 변했어요.”라고 썼어요."},{"no":925,"category":"성질·상태·문법","word":"心里","pinyin":"xīnlǐ","meaning":"마음속","example":"复习“心里”时，我读到：“我心里很高兴。”","examplePinyin":"fùxí “xīnlǐ” shí, wǒ dúdào: “wǒ xīnlǐ hěn gāoxìng.”","translation":"“心里”를 복습할 때, 저는 “저는 마음속으로 아주 기뻐요.”라는 문장을 읽었어요."},{"no":926,"category":"성질·상태·문법","word":"最后","pinyin":"zuìhòu","meaning":"마지막, 최후","example":"学“最后”时，我写：“最后我们决定坐地铁。”","examplePinyin":"xué “zuìhòu” shí, wǒ xiě: “zuìhòu wǒmen juédìng zuò dìtiě.”","translation":"“最后”를 배울 때 저는 “마지막으로 우리는 지하철을 타기로 결 “wǒ xiǎng huàn yí jiàn yīfu.”","translation":"수업에서 “换”를 배울 때, 선생님은 “저는 옷을 다른 것으로 바꾸고 싶어요.”라고 말씀하셨어요."},{"no":935,"category":"성질·상태·문법","word":"海","pinyin":"hǎi","meaning":"바다","example":"课上学“海”时，老师说：“我喜欢看海。”","examplePinyin":"kè shàng xué “hǎi” shí, lǎoshī shuō: “wǒ xǐhuan kàn hǎi.”","translation":"수업에서 “海”를 배울 때, 선생님은 “저는 바다 보는 것을 좋아해요.”라고 말씀하셨어요."},{"no":936,"category":"성질·상태·문법","word":"半天","pinyin":"bàntiān","meaning":"반나절","example":"复习“半天”时，我读到：“我等了半天。”","examplePinyin":"fùxí “bàntiān” shí, wǒ dúdào: “wǒ děng le bàntiān.”","translation":"“半天”를 복습할 때, 저는 “저는 한참 기다렸어요.”라는 문장을 읽었어요."},{"no":937,"category":"성질·상태·문법","word":"一定","pinyin":"yídìng","meaning":"반드시, 꼭","example":"复习“一定”时，我读到：“我明天一定来。”","examplePinyin":"fùxí “yídìng” shí, wǒ dúdào: “wǒ míngtiān yídìng lái.”","translation":"“一定”를 복습할 때, 저는 “저는 내일 꼭 올게요.”라는 문장을 읽었어요."},{"no":938,"category":"성질·상태·문법","word":"发生","pinyin":"fāshēng","meaning":"발생하다, 일어나다","example":"学“发生”时，同学问：“这里发生了什么事？”","examplePinyin":"xué “fāshēng” shí, tóngxué wèn: “zhèlǐ fāshēng le shénme shì?”","translation":"“发生”를 배울 때 친구가 “여기에서 무슨 일이 일어났나요?”라고 물었어요."},{"no":939,"category":"성질·상태·문법","word":"发展","pinyin":"fāzhǎn","meaning":"발전하다, 발전","example":"学“发展”时，我写：“这个城市发展得很快。”","examplePinyin":"xué “fāzhǎn” shí, wǒ xiě: “zhège chéngshì fāzhǎn de hěn kuài.”","translation":"“发展”를 배울 때 저는 “이 도시는 아주 빠르게 발전하고 있어요.”라고 썼어요."},{"no":940,"category":"성질·상태·문법","word":"号码","pinyin":"hàomǎ","meaning":"번호","example":"学“号码”时，老师提醒：“请告诉我你的电话号码。”","examplePinyin":"xué “hàomǎ” shí, lǎoshī tíxǐng: “qǐng gàosu wǒ nǐ de diànhuà hàomǎ.”","translation":"“号码”를 배울 때 선생님이 “전화번호를 알려 주세요.”라고 당부했어요."},{"no":941,"category":"성질·상태·문법","word":"变","pinyin":"biàn","meaning":"변하다","example":"为了记住“变”，我写：“天气变冷了。”","examplePinyin":"wèile jìzhu “biàn”, wǒ xiě: “tiānqì biàn lěng le.”","translation":"“变”를 기억하려고 저는 “날씨가 추워졌어요.”라고 썼어요."},{"no":942,"category":"성질·상태·문법","word":"变化","pinyin":"biànhuà","meaning":"변화, 변하다","example":"老师用“变化”举例：“这里变化很大。”","examplePinyin":"lǎoshī yòng “bi ” shí, wǒ xiě: “wǒ tīngdào le yì shēng jiàohǎn.”","translation":"“声”를 배울 때 저는 “저는 외치는 소리를 한 번 들었어요.”라고 썼어요."},{"no":951,"category":"성질·상태·문법","word":"声音","pinyin":"shēngyīn","meaning":"소리, 목소리","example":"课上学“声音”时，老师说：“她的声音很好听。”","examplePinyin":"kè shàng xué “shēngyīn” shí, lǎoshī shuō: “tā de shēngyīn hěn hǎotīng.”","translation":"수업에서 “声音”를 배울 때, 선생님은 “그녀의 목소리는 아주 듣기 좋아요.”라고 말씀하셨어요."},{"no":952,"category":"성질·상태·문법","word":"数学","pinyin":"shùxué","meaning":"수학","example":"课上学“数学”时，老师说：“我最喜欢数学课。”","examplePinyin":"kè shàng xué “shùxué” shí, lǎoshī shuō: “wǒ zuì xǐhuan shùxué kè.”","translation":"수업에서 “数学”를 배울 때, 선생님은 “저는 수학 수업을 가장 좋아해요.”라고 말씀하셨어요."},{"no":953,"category":"성질·상태·문법","word":"习惯","pinyin":"xíguàn","meaning":"습관, 익숙해지다","example":"老师用“习惯”举例：“我已经习惯这里的生活了。”","examplePinyin":"lǎoshī yòng “xíguàn” jǔlì: “wǒ yǐjīng xíguàn zhèlǐ de shēnghuó le.”","translation":"선생님은 “习惯”를 사용해 “저는 이곳 생활에 이미 익숙해졌어요.”라고 예를 들었어요."},{"no":954,"category":"성질·상태·문법","word":"市","pinyin":"shì","meaning":"시, 도시","example":"学“市”时，我写：“我住在首尔市。”","examplePinyin":"xué “shì” shí, wǒ xiě: “wǒ zhù zài Shǒu'ěr Shì.”","translation":"“市”를 배울 때 저는 “저는 서울시에 살아요.”라고 썼어요."},{"no":955,"category":"성질·상태·문법","word":"可能","pinyin":"kěnéng","meaning":"아마, 가능하다","example":"课上学“可能”时，老师说：“他今天可能不来。”","examplePinyin":"kè shàng xué “kěnéng” shí, lǎoshī shuō: “tā jīntiān kěnéng bù lái.”","translation":"수업에서 “可能”를 배울 때, 선생님은 “그는 오늘 아마 오지 않을 거예요.”라고 말씀하셨어요."},{"no":956,"category":"성질·상태·문법","word":"冰激凌","pinyin":"bīngjīlíng","meaning":"아이스크림","example":"课上学“冰激凌”时，老师说：“我喜欢吃冰激凌。”","examplePinyin":"kè shàng xué “bīngjīlíng” shí, lǎoshī shuō: “wǒ xǐhuan chī bīngjīlíng.”","translation":"수업에서 “冰激凌”를 배울 때, 선생님은 “저는 아이스크림을 좋아해요.”라고 말씀하셨어요."},{"no":957,"category":"성질·상태·문법","word":"阿姨","pinyin":"āyí","meaning":"아주머니, 이모","example":"为了记住“阿姨”，我写：“阿姨，您好！”","examplePinyin":"wèile jìzhu “āyí”, wǒ xiě: “āyí, nín hǎo!”","translation":"“阿姨”를 기억하려고 저는 “아주머니, 안녕하세요!”라고 썼어요."},{"no":958,"category":"성질·상태·문법","word":"安全","pinyin":"ānquán","meaning":"안전하다","example":"复习“安全”时，我读到：“这里很安全。”","examplePinyin":"fùxí “ānquán” shí, wǒ dúdào: “zhèlǐ hěn ānquán.”","translation":"“安全”를 복습할 때, 저는 “이곳은 안전해요.”라는 문장을 읽었어요."},{"no":959,"category":"성질·상태·문법","word":"有的","pinyin":"yǒude","meaning":"어떤 것, 어떤 사람","example":"学“有的”时，我写：“有的人喜欢喝茶。”","examplePinyin":"xué “yǒude” shí, wǒ xiě: “yǒude rén xǐhuan hē chá.”","translation":"“有的”를 배울 때 저는 “어떤 사람들은 차 마시는 것을 좋아해요.”라고 썼어요."},{"no":960,"category":"성질·상태·문법","word":"冰","pinyin":"bīng","meaning":"얼음","example":"为了记住“冰”，我写：“杯子里有冰。”","examplePinyin":"wèile jìzhu “bīng”, wǒ xiě: “bēizi lǐ yǒu bīng.”","translation":"“冰”를 기억하려고 저는 “컵 안에 얼음이 있어요.”라고 썼어요."},{"no":961,"category":"성질·상태·문법","word":"根据","pinyin":"gēnjù","meaning":"~에 근거하여, ~에 따르면","example":"课上学“根据”时，老师说：“根据天气预报，明天会下雨。”","examplePinyin":"kè shàng xué “gēnjù” shí, lǎoshī shuō: “gēnjù tiānqì yùbào, míngtiān huì xià yǔ.”","translation":"수업에서 “根据”를 배울 때, 선생님은 “일기예보에 따르면 내일 비가 올 거예요.”라고 말씀하셨어요."},{"no":962,"category":"성질·상태·문법","word":"关于","pinyin":"guānyú","meaning":"~에 관하여","example":"为了记住“关于”，我写：“这是一本关于中国文化的书。”","examplePinyin":"wèile jìzhu “guānyú”, wǒ xiě: “zhè shì yì běn guānyú Zhōngguó wénhuà de shū.”","translation":"“关于”를 기억하려고 저는 “이것은 중국 문화에 관한 책이에요.”라고 썼어요."},{"no":963,"category":"성질·상태·문법","word":"晚点","pinyin":"wǎndiǎn","meaning":"연착하다, 늦어지다","example":"为了记住“晚点”，我写：“火车晚点了十分钟。”","examplePinyin":"wèile jìzhu “wǎndiǎn”, wǒ xiě: “huǒchē wǎndiǎn le shí fēnzhōng.”","translation":"“晚点”를 기억하려고 저는 “기차가 10분 연착했어요.”라고 썼어요."},{"no":964,"category":"성질·상태·문법","word":"影响","pinyin":"yǐngxiǎng","meaning":"영향을 주다, 영향","example":"复习“影响”时，我读到：“天气影响了我们的计划。”","examplePinyin":"fùxí “yǐngxiǎng” shí, wǒ dúdào: “tiānqì yǐngxiǎng le wǒmen de jìhuà.”","translation":"“影响”를 복습할 때, 저는 “날씨가 우리의 계획에 영향을 주었어요.”라는 문장을 읽었어요."},{"no":965,"category":"성질·상태·문법","word":"比如","pinyin":"bǐrú","meaning":"예를 들면","example":"为了记住“比如”，我写：“我喜欢水果，比如苹果。”","examplePinyin":"wèile jìzhu “bǐrú”, wǒ xiě: “wǒ xǐhuan shuǐguǒ, bǐrú píngguǒ.”","translation":"“比如”를 기억하려고 저는 “저는 과일을 좋아해요. 예를 들면 사과요.”라고 썼어요."},{"no":966,"category":"성질·상태·문법","word":"不久","pinyin":"bùjiǔ","meaning":"오래지 않아, 곧","example":"课上学“不久”时，老师说：“他不久就回来了。”","examplePinyin":"kè shàng xué “bùjiǔ” shí, lǎoshī shuō: “tā bùjiǔ jiù huílái le.”","translation":"수업에서 “不久”를 배울 때, 선생님은 “그는 얼마 지나지 않아 돌아왔어요.”라고 말씀하셨어요."},{"no":967,"category":"성질·상태·문법","word":"搬","pinyin":"bān","meaning":"옮기다","example":"学“搬”时，老师提醒：“请帮我搬桌子。”","examplePinyin":"xué “bān” shí, lǎoshī tíxǐng: “qǐng bāng wǒ bān zhuōzi.”","translation":"“搬”를 배울 때 선생님이 “책상 옮기는 것을 도와주세요.”라고 당부했어요."},{"no":968,"category":"성질·상태·문법","word":"像","pinyin":"xiàng","meaning":"~와 같다, 닮다","example":"复习“像”时，我读到：“她长得像妈妈。”","examplePinyin":"fùxí “xiàng” shí, wǒ dúdào: “tā zhǎng de xiàng māma.”","translation":"“像”를 복습할 때, 저는 “그녀는 엄마를 닮았어요.”라는 문장을 읽었어요."},{"no":969,"category":"성질·상태·문법","word":"有关","pinyin":"yǒuguān","meaning":"~와 관련이 있다","example":"老师用“有关”举例：“这本书跟历史有关。”","examplePinyin":"lǎoshī yòng “yǒuguān” jǔlì: “zhè běn shū gēn lìshǐ yǒuguān.”","translation":"선생님은 “有关”를 사용해 “이 책은 역사와 관련이 있어요.”라고 예를 들었어요."},{"no":970,"category":"성질·상태·문법","word":"伞","pinyin":"sǎn","meaning":"우산","example":"为了记住“伞”，我写：“下雨了，带上伞吧。”","examplePinyin":"wèile jìzhu “sǎn”, wǒ xiě: “xià yǔ le, dài shàng sǎn ba.”","translation":"“伞”를 기억하려고 저는 “비가 오니 우산을 챙기세요.”라고 썼어요."},{"no":971,"category":"성질·상태·문법","word":"留学","pinyin":"liúxué","meaning":"유학하다","example":"老师用“留学”举例：“我想去中国留学。”","examplePinyin":"lǎoshī yòng “liúxué” jǔlì: “wǒ xiǎng qù Zhōngguó liúxué.”","translation":"선생님은 “留学”를 사용해 “저는 중국에 유학 가고 싶어요.”라고 예를 들었어요."},{"no":972,"category":"성질·상태·문법","word":"银行","pinyin":"yínháng","meaning":"은행","example":"为了记住“银行”，我写：“银行在学校旁边。”","examplePinyin":"wèile jìzhu “yínháng”, wǒ xiě: “yínháng zài xuéxiào pángbiān.”","translation":"“银行”를 기억하려고 저는 “은행은 학교 옆에 있어요.”라고 썼어요."},{"no":973,"category":"성질·상태·문법","word":"除了","pinyin":"chúle","meaning":"~을 제외하고","example":"复习“除了”时，我读到：“除了我，大家都去了。”","examplePinyin":"fùxí “chúle” shí, wǒ dúdào: “chúle wǒ, dàjiā dōu qù le.”" const LEVEL = 3;
const state = { showPinyin:true, showMeaning:true, showTranslation:true, speaking:false, paused:false, resumeNext:null, resumeSpeech:null, speechToken:0, runId:0, currentAudio:null, currentNo:null };
const list = document.getElementById('list');
const statusBox = document.getElementById('status');
const pauseResumeBtn = document.getElementById('pauseResume');

function syncPauseButton() {
  pauseResumeBtn.disabled = !state.speaking;
  pauseResumeBtn.classList.toggle('paused', state.paused);
  pauseResumeBtn.textContent = state.paused ? '▶ 이어듣기' : 'Ⅱ 일시정지';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = DATA.filter(x => !q || [x.no,x.word,x.pinyin,x.meaning,x.example,x.examplePinyin,x.translation,x.category].join(' ').toLowerCase().includes(q));
  document.getElementById('count').textContent = `${filtered.length} / 1000`;
  let last = '';
  list.innerHTML = filtered.map(x => {
    const heading = x.category !== last ? `<h2 class="category">${esc(x.category)}</h2>` : '';
    last = x.category;
    return `${heading}<article class="card">
      <div class="wordline"><button class="startPick ${Number(document.getElementById('startNo')?.value||1)===x.no?'selected':''}" data-no="${x.no}" title="${x.no}번부터 연속 재생">${x.no}</button><div class="hanzi">${esc(x.word)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.pinyin)}</div><button class="play" data-kind="word" data-no="${x.no}">▶ 단어</button></div>
      <div class="answer meaning ${state.showMeaning?'':'hidden'}">${esc(x.meaning)}</div>
      <div class="exampleline"><div class="no">例</div><div class="hanzi sentence">${esc(x.example)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.examplePinyin)}</div><button class="play" data-kind="sentence" data-no="${x.no}">▶ 예문</button></div>
      <div class="answer translation ${state.showTranslation?'':'hidden'}">${esc(x.translation)}</div>
    </article>`;
  }).join('');
}

function getChineseVoice() {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /^zh(-|_)?CN/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang)) || null;
}
function playQueue(entries, label) {
  if (!('speechSynthesis' in window)) { showStatus('이 브라우저는 음성 재생을 지원하지 않습니다.'); return; }
  speechSynthesis.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  const runId = ++state.runId;
  state.speaking = true;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  syncPauseButton();
  document.querySelectorAll('.play').forEach(b => b.disabled = true);
  const voice = getChineseVoice();
  let done = 0;
  showStatus(`${label} 재생 준비 중…`);
  const next = () => {
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (done >= entries.length) {
      state.speaking = false;
      state.paused = false;
      syncPauseButton();
      document.querySelectorAll('.play').forEach(b => b.disabled = false);
      showStatus(`${label} 재생 완료`);
      setTimeout(() => statusBox.classList.remove('show'), 1500);
      return;
    }
    const item = entries[done];
    focusCurrent(item.no);
    showStatus(`${label} 재생 중 · ${item.progress || `${done+1}/${entries.length}`}`);
    if (item.audio) {
      const audio = new Audio(item.audio);
      state.currentAudio = audio;
      audio.playbackRate = Number(document.getElementById('speechRate').value);
      audio.onended = () => { state.currentAudio=null; done++; setTimeout(next,350); };
      audio.onerror = () => {
        if (runId !== state.runId) return;
        state.speaking=false; state.currentAudio=null;
        document.querySelectorAll('.play').forEach(b=>b.disabled=false);
        showStatus('63번 표준 발음 음원을 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
      };
      audio.play().catch(() => audio.onerror());
      return;
    }
    const speakCurrent = () => {
      if (runId !== state.runId) return;
      if (state.paused) { state.resumeNext = speakCurrent; return; }
      const token = ++state.speechToken;
      state.resumeSpeech = speakCurrent;
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'zh-CN'; u.rate = Number(document.getElementById('speechRate').value); u.pitch = 1; if (voice) u.voice = voice;
      u.onend = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        state.resumeSpeech = null;
        done++;
        setTimeout(next, 350);
      };
      u.onerror = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        state.speaking=false;
        state.resumeSpeech=null;
        document.querySelectorAll('.play').forEach(b=>b.disabled=false);
        showStatus('음성 재생에 실패했습니다. 중국어 음성이 설치되어 있는지 확인하세요.');
      };
      speechSynthesis.speak(u);
    };
    speakCurrent();
  };
  next();
}
function fixedAudio(no, kind) {
  const level1Files = {
    26:{word:'item-026-word.wav',example:'item-026-example.wav'},
    63:{word:'item-063-word.wav',example:'item-063-example.wav'},

    491:{word:'item2-491-word.wav',example:'item2-491-example.wav'},
    497:{word:'item2-497-word.wav',example:'item2-497-example.wav'}
  };
  const files = LEVEL === 1 ? level1Files : (LEVEL === 2 ? level2Files : {});
  const file = files[no]?.[kind];
  if (!file) return null;
  return `https://raw.githubusercontent.com/yanchunnu/HSK3.0-/main/audio/${file}`;
}
function repeatEntries(text, repeat, progress, audio=null, no=null, kind=null) {
  return Array.from({length:repeat}, (_,i) => ({text, audio, no, kind, progress:`${progress} · ${i+1}/${repeat}회`}));
}
function focusCurrent(no) {
  if (!no) return;
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  const card = document.querySelector(`article.card:has(.startPick[data-no="${no}"])`);
  if (!card) return;
  card.classList.add('reading');
  if (state.currentNo !== no) card.scrollIntoView({behavior:'smooth', block:'center'});
  state.currentNo = no;
}
function stopPlayback() {
  state.runId++;
  state.speaking = false;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  speechSynthesis.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio.currentTime=0; state.currentAudio=null; }
  state.currentNo=null;
  syncPauseButton();
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  document.querySelectorAll('.play').forEach(b => b.disabled = false);
  showStatus('재생을 멈췄습니다.');
  setTimeout(() => statusBox.classList.remove('show'), 1500);
}
function togglePause() {
  if (!state.speaking) return;
  if (!state.paused) {
    state.paused = true;
    if (state.currentAudio && !state.currentAudio.paused) state.currentAudio.pause();
    if (!state.currentAudio && state.resumeSpeech) {
      state.resumeNext = state.resumeSpeech;
      state.speechToken++;
      speechSynthesis.cancel();
    }
    syncPauseButton();
    showStatus('일시정지됨 · 화면을 다시 누르거나 이어듣기 버튼을 누르세요');
    return;
  }
  state.paused = false;
  if (state.currentAudio && state.currentAudio.paused) {
    state.currentAudio.play().catch(() => showStatus('재생을 다시 시작하지 못했습니다.'));
  }
  const resume = state.resumeNext;
  state.resumeNext = null;
  if (resume) resume();
  syncPauseButton();
  showStatus('이어서 재생합니다');
}
function showStatus(msg) { statusBox.textContent = msg; statusBox.classList.add('show'); }
function selectedItems() {
  const input = document.getElementById('startNo');
  const start = Math.min(1000, Math.max(1, Number(input.value) || 1));
  input.value = start;
  return {start, items:DATA.filter(x => x.no >= start)};
}

list.addEventListener('click', e => {
  const pick = e.target.closest('.startPick');
  if (pick) {
    document.getElementById('startNo').value = pick.dataset.no;
    render();
    showStatus(`${pick.dataset.no}번을 연속 재생 시작 번호로 선택했습니다.`);
    setTimeout(() => statusBox.classList.remove('show'), 1500);
    return;
  }
  const btn = e.target.closest('.play'); if (!btn) return;
  const item = DATA.find(x => x.no === Number(btn.dataset.no));
  const isWord = btn.dataset.kind === 'word';
  const repeat = Number(document.getElementById(isWord?'wordRepeat':'sentenceRepeat').value);
  playQueue(repeatEntries(isWord?item.word:item.example, repeat, `${item.no}번`, fixedAudio(item.no,isWord?'word':'example'), item.no, isWord?'word':'example'), isWord?'단어':'예문');
});
document.getElementById('playAllWords').addEventListener('click', () => {
  const repeat = Number(document.getElementById('wordRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.word, repeat, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word')), `${start}~1000 전체 단어`);
});
document.getElementById('playAllSentences').addEventListener('click', () => {
  const repeat = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.example, repeat, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')), `${start}~1000 전체 예문`);
});
document.getElementById('playAllBoth').addEventListener('click', () => {
  const wr = Number(document.getElementById('wordRepeat').value);
  const sr = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => [...repeatEntries(x.word, wr, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word'), ...repeatEntries(x.example, sr, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')]), `${start}~1000 단어+예문`);
});
document.getElementById('stopAll').addEventListener('click', stopPlayback);
pauseResumeBtn.addEventListener('click', togglePause);
document.addEventListener('click', e => {
  if (e.target.closest('button, input, select, label, a, .status')) return;
  togglePause();
});
const toTop = document.getElementById('toTop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 450), {passive:true});
document.getElementById('startNo').addEventListener('change', () => { selectedItems(); render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('pinyinToggle').addEventListener('click', e => { state.showPinyin=!state.showPinyin; e.currentTarget.classList.toggle('on',state.showPinyin); e.currentTarget.textContent=state.showPinyin?'병음 보임':'병음 숨김'; render(); });
document.getElementById('meaningToggle').addEventListener('click', e => { state.showMeaning=!state.showMeaning; e.currentTarget.classList.toggle('on',state.showMeaning); e.currentTarget.textContent=state.showMeaning?'뜻 보임':'뜻 숨김'; render(); });
document.getElementById('translationToggle').addEventListener('click', e => { state.showTranslation=!state.showTranslation; e.currentTarget.classList.toggle('on',state.showTranslation); e.currentTarget.textContent=state.showTranslation?'해석 보임':'해석 숨김'; render(); });
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
render();
</script>
