<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK 3.0 3급 음원 학습</title>
  <style>
    :root { --blue:#805b05; --deep:#102a43; --line:#e5dfcc; --soft:#fffbed; --accent:#fff1b8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Noto Sans KR",sans-serif; color:var(--deep); background:#faf8f0; }
    button, select, input { font:inherit; }
    header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 4px 18px #102a4312; }
    .wrap { width:min(1120px, calc(100% - 24px)); margin:auto; }
    .top { padding:18px 0 12px; display:flex; justify-content:space-between; gap:16px; align-items:end; }
    h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.04em; }
    .sub { color:#627d98; font-size:13px; margin-top:4px; }
    .count { color:#486581; font-weight:700; white-space:nowrap; }
    .controls { display:grid; grid-template-columns:2fr repeat(6,auto); gap:10px; padding-bottom:14px; align-items:center; }
    .controls input, .controls select, .toggle { min-height:42px; border:1px solid #bcccdc; border-radius:10px; background:white; padding:0 12px; }
    .toggle { cursor:pointer; font-weight:700; color:#334e68; }
    .toggle.on { background:var(--blue); border-color:var(--blue); color:white; }
    .batch { display:flex; flex-wrap:wrap; gap:8px; padding:0 0 14px; }
    .batch button { min-height:40px; border:1px solid #a9c3df; border-radius:10px; padding:0 14px; background:#f5f9ff; color:var(--blue); font-weight:800; cursor:pointer; }
    .batch button:hover { background:#e1edff; }
    .batch button:disabled { opacity:.5; cursor:not-allowed; }
    .batch .pause { color:#735c0f; border-color:#dfc56d; background:#fff9df; }
    .batch .pause.paused { color:#0b6b45; border-color:#74c69d; background:#edfff5; }
    .batch .stop { color:#a61b1b; border-color:#e2aaaa; background:#fff7f7; }
    .startControl { display:flex; align-items:center; gap:7px; min-height:40px; padding:0 10px; border:1px solid #a9c3df; border-radius:10px; background:white; font-weight:800; color:#334e68; }
    .startControl input { width:64px; height:30px; border:1px solid #bcccdc; border-radius:7px; text-align:center; font-weight:800; }
    .startPick { border:0; background:transparent; color:#627d98; font-weight:900; cursor:pointer; border-radius:7px; padding:7px; }
    .startPick:hover, .startPick.selected { background:var(--blue); color:white; }
    main { padding:18px 0 50px; }
    .category { margin:22px 0 10px; color:var(--blue); font-size:19px; }
    .card { background:white; border:1px solid var(--line); border-radius:15px; margin:10px 0; padding:15px 16px; box-shadow:0 3px 10px #102a430a; }
    .card.reading { border:3px solid #c29414; background:#fffdf3; box-shadow:0 0 0 5px #c294141c, 0 8px 24px #102a4320; }
    .wordline, .exampleline { display:grid; grid-template-columns:52px minmax(110px,1fr) minmax(130px,1.1fr) auto; gap:10px; align-items:center; }
    .exampleline { grid-template-columns:52px minmax(220px,2fr) minmax(220px,2fr) auto; margin-top:13px; padding-top:13px; border-top:1px dashed var(--line); }
    .no { color:#829ab1; font-weight:800; text-align:center; }
    .hanzi { color:#000; font-family:"Microsoft YaHei","Noto Sans SC",sans-serif; font-size:25px; font-weight:900; }
    .sentence { font-size:20px; }
    .pinyin { color:#526d82; font-size:15px; }
    .pinyin.hidden { display:none; }
    .play { border:0; border-radius:10px; min-height:42px; padding:0 15px; background:var(--accent); color:var(--blue); font-weight:800; cursor:pointer; }
    .play:hover { background:#d7e7ff; }
    .play:disabled { opacity:.5; cursor:not-allowed; }
    .answer { margin:10px 0 0 62px; padding:9px 12px; background:var(--soft); border-radius:9px; color:#334e68; }
    .answer.hidden { display:none; }
    .status { position:fixed; right:16px; bottom:16px; z-index:8; max-width:min(380px,calc(100% - 32px)); background:#102a43; color:white; padding:10px 14px; border-radius:10px; box-shadow:0 8px 22px #102a4340; display:none; }
    .status.show { display:block; }
    .toTop { position:fixed; right:16px; bottom:72px; z-index:9; width:48px; height:48px; border:0; border-radius:50%; background:var(--blue); color:white; font-size:21px; font-weight:900; box-shadow:0 6px 18px #102a4340; cursor:pointer; opacity:0; pointer-events:none; transform:translateY(8px); transition:.2s; }
    .toTop.show { opacity:1; pointer-events:auto; transform:none; }
    @media (max-width:760px) {
      header { position:static; }
      .top { align-items:start; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls input { grid-column:1/-1; }
      main { padding-bottom:82px; }
      .card { scroll-margin-top:12px; }
      .wordline, .exampleline { grid-template-columns:36px 1fr auto; }
      .pinyin { grid-column:2/3; }
      .play { grid-column:3/4; grid-row:1/3; }
      .answer { margin-left:46px; }
      .sentence { font-size:18px; }
      .status { left:8px; right:8px; bottom:8px; max-width:none; padding:9px 12px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-radius:9px; }
      .toTop { right:10px; bottom:56px; width:44px; height:44px; font-size:19px; }
    }
  </style>
</head>
<body>
<!-- mobile playback controls v2 -->
<header>
  <div class="wrap">
    <div class="top">
      <div><h1>HSK 3.0 3급 음원 학습</h1><div class="sub">검수한 누적 1000단어 · 기기의 중국어(보통화) 음성으로 단어와 예문을 반복해서 들으세요.</div></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="번호·한자·병음·뜻 검색">
      <label>단어 <select id="wordRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>예문 <select id="sentenceRepeat"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>회</label>
      <label>속도 <select id="speechRate"><option value="0.55">매우 느리게</option><option value="0.68">느리게</option><option value="0.78" selected>학습 속도</option><option value="0.9">조금 빠르게</option><option value="1">보통</option><option value="1.15">빠르게</option><option value="1.3">매우 빠르게</option></select></label>
      <button class="toggle on" id="pinyinToggle" type="button">병음 보임</button>
      <button class="toggle on" id="meaningToggle" type="button">뜻 보임</button>
      <button class="toggle on" id="translationToggle" type="button">해석 보임</button>
    </div>
    <div class="batch">
      <label class="startControl">시작 번호 <input id="startNo" type="number" min="1" max="1000" value="1"></label>
      <button type="button" id="playAllWords">▶ 선택 번호부터 단어</button>
      <button type="button" id="playAllSentences">▶ 선택 번호부터 예문</button>
      <button type="button" id="playAllBoth">▶ 선택 번호부터 단어+예문</button>
      <button type="button" class="pause" id="pauseResume" disabled>Ⅱ 일시정지</button>
      <button type="button" class="stop" id="stopAll">■ 재생 멈춤</button>
    </div>
  </div>
</header>
<main class="wrap" id="list"></main>
<div class="status" id="status"></div>
<button class="toTop" id="toTop" type="button" aria-label="맨 위로 가기" title="맨 위로 가기">↑</button>
<script>
const DATA = [{"no":1,"category":"인사·사람·대명사","word":"你","pinyin":"nǐ","meaning":"너, 당신","example":"你下课以后有时间吗？","examplePinyin":"Nǐ xiàkè yǐhòu yǒu shíjiān ma?","translation":"너 수업 끝나고 시간 있니?"},{"no":2,"category":"인사·사람·대명사","word":"您","pinyin":"nín","meaning":"당신(존칭)","example":"您要的茶马上就来。","examplePinyin":"Nín yào de chá mǎshàng jiù lái.","translation":"주문하신 차가 곧 나옵니다."},{"no":3,"category":"인사·사람·대명사","word":"你们","pinyin":"nǐmen","meaning":"여러분, 너희들","example":"你们可以在这里等我。","examplePinyin":"Nǐmen kěyǐ zài zhèlǐ děng wǒ.","translation":"여러분은 여기서 저를 기다리면 돼요."},{"no":4,"category":"인사·사람·대명사","word":"我","pinyin":"wǒ","meaning":"나, 저","example":"这件事让我来做吧。","examplePinyin":"Zhè jiàn shì ràng wǒ lái zuò ba.","translation":"이 일은 제가 할게요."},{"no":5,"category":"인사·사람·대명사","word":"我们","pinyin":"wǒmen","meaning":"우리","example":"我们先吃饭，再去看电影。","examplePinyin":"Wǒmen xiān chī fàn, zài qù kàn diànyǐng.","translation":"우리 먼저 밥 먹고 영화를 보러 가요."},{"no":6,"category":"인사·사람·대명사","word":"咱们","pinyin":"zánmen","meaning":"우리(상대방 포함)","example":"咱们周末一起去爬山吧。","examplePinyin":"Zánmen zhōumò yìqǐ qù pá shān ba.","translation":"우리 주말에 함께 등산하러 가요."},{"no":7,"category":"인사·사람·대명사","word":"他","pinyin":"tā","meaning":"그, 그 사람","example":"他虽然很忙，但每天都看书。","examplePinyin":"Tā suīrán hěn máng, dàn měi tiān dōu kàn shū.","translation":"그는 바쁘지만 매일 책을 읽어요."},{"no":8,"category":"인사·사람·대명사","word":"她","pinyin":"tā","meaning":"그녀","example":"她已经在这家公司工作两年了。","examplePinyin":"Tā yǐjīng zài zhè jiā gōngsī gōngzuò liǎng nián le.","translation":"그녀는 이 회사에서 일한 지 2년이 됐어요."},{"no":9,"category":"인사·사람·대명사","word":"它","pinyin":"tā","meaning":"그것(사물·동물)","example":"这只猫很小，它还不会爬树。","examplePinyin":"Zhè zhī māo hěn xiǎo, tā hái bú huì pá shù.","translation":"이 고양이는 어려서 아직 나무를 못 타요."},{"no":10,"category":"인사·사람·대명사","word":"他们","pinyin":"tāmen","meaning":"그들","example":"他们正在商量周末去哪儿玩。","examplePinyin":"Tāmen zhèngzài shāngliang zhōumò qù nǎr wán.","translation":"그들은 주말에 어디서 놀지 의논하고 있어요."},{"no":11,"category":"인사·사람·대명사","word":"她们","pinyin":"tāmen","meaning":"그녀들","example":"她们一边走路，一边聊天儿。","examplePinyin":"Tāmen yìbiān zǒulù, yìbiān liáotiānr.","translation":"그녀들은 걸으면서 이야기를 나눠요."},{"no":12,"category":"인사·사람·대명사","word":"它们","pinyin":"tāmen","meaning":"그것들","example":"这些苹果很新鲜，我想买它们。","examplePinyin":"Zhèxiē píngguǒ hěn xīnxiān, wǒ xiǎng mǎi tāmen.","translation":"이 사과들은 신선해서 사고 싶어요."},{"no":13,"category":"인사·사람·대명사","word":"自己","pinyin":"zìjǐ","meaning":"자기 자신","example":"这道题请你自己先做一下。","examplePinyin":"Zhè dào tí qǐng nǐ zìjǐ xiān zuò yíxià.","translation":"이 문제는 먼저 스스로 풀어 보세요."},{"no":14,"category":"인사·사람·대명사","word":"别人","pinyin":"biérén","meaning":"다른 사람","example":"用别人的东西以前，应该先问。","examplePinyin":"Yòng biérén de dōngxi yǐqián, yīnggāi xiān wèn.","translation":"남의 물건을 쓰기 전에 먼저 물어봐야 해요."},{"no":15,"category":"인사·사람·대명사","word":"大家","pinyin":"dàjiā","meaning":"모두, 여러분","example":"请大家把书打开，开始上课。","examplePinyin":"Qǐng dàjiā bǎ shū dǎkāi, kāishǐ shàngkè.","translation":"모두 책을 펴세요. 수업을 시작합시다."},{"no":16,"category":"인사·사람·대명사","word":"人","pinyin":"rén","meaning":"사람","example":"今天来参加比赛的人特别多。","examplePinyin":"Jīntiān lái cānjiā bǐsài de rén tèbié duō.","translation":"오늘 대회에 참가하러 온 사람이 아주 많아요."},{"no":17,"category":"인사·사람·대명사","word":"出生","pinyin":"chūshēng","meaning":"태어나다","example":"我出生的时候，爸爸还很年轻。","examplePinyin":"Wǒ chūshēng de shíhou, bàba hái hěn niánqīng.","translation":"제가 태어났을 때 아빠는 아직 젊었어요."},{"no":18,"category":"인사·사람·대명사","word":"大人","pinyin":"dàren","meaning":"어른","example":"小孩子过马路时要跟着大人。","examplePinyin":"Xiǎoháizi guò mǎlù shí yào gēn zhe dàren.","translation":"아이는 길을 건널 때 어른을 따라야 해요."},{"no":19,"category":"인사·사람·대명사","word":"老人","pinyin":"lǎorén","meaning":"노인, 어르신","example":"上车以后，他把位子让给了老人。","examplePinyin":"Shàngchē yǐhòu, tā bǎ wèizi ràng gěi le lǎorén.","translation":"그는 차에 타서 노인에게 자리를 양보했어요."},{"no":20,"category":"인사·사람·대명사","word":"名人","pinyin":"míngrén","meaning":"유명인","example":"这位名人小时候住在我们附近。","examplePinyin":"Zhè wèi míngrén xiǎoshíhou zhù zài wǒmen fùjìn.","translation":"이 유명인은 어릴 때 우리 근처에 살았어요."},{"no":21,"category":"인사·사람·대명사","word":"男","pinyin":"nán","meaning":"남자, 남성의","example":"我的汉语老师是男的。","examplePinyin":"Wǒ de Hànyǔ lǎoshī shì nán de.","translation":"제 중국어 선생님은 남자예요."},{"no":22,"category":"인사·사람·대명사","word":"男人","pinyin":"nánrén","meaning":"남자","example":"门口那个男人是来接孩子的。","examplePinyin":"Ménkǒu nàge nánrén shì lái jiē háizi de.","translation":"입구의 저 남자는 아이를 데리러 왔어요."},{"no":23,"category":"인사·사람·대명사","word":"男生","pinyin":"nánshēng","meaning":"남학생","example":"我们班的男生都参加了比赛。","examplePinyin":"Wǒmen bān de nánshēng dōu cānjiā le bǐsài.","translation":"우리 반 남학생들은 모두 대회에 참가했어요."},{"no":24,"category":"인사·사람·대명사","word":"女","pinyin":"nǚ","meaning":"여자, 여성의","example":"这次比赛，男的女的都能参加。","examplePinyin":"Zhècì bǐsài, nán de nǚ de dōu néng cānjiā.","translation":"이번 대회에는 남녀 모두 참가할 수 있어요."},{"no":25,"category":"인사·사람·대명사","word":"女人","pinyin":"nǚrén","meaning":"여자","example":"那位拿着雨伞的女人是我阿姨。","examplePinyin":"Nà wèi ná zhe yǔ sǎn de nǚrén shì wǒ āyí.","translation":"우산을 든 저 여자는 제 이모예요."},{"no":26,"category":"인사·사람·대명사","word":"女生","pinyin":"nǚshēng","meaning":"여학생","example":"这个房间是给女生住的。","examplePinyin":"Zhège fángjiān shì gěi nǚshēng zhù de.","translation":"이 방은 여학생이 지내는 방이에요."},{"no":27,"category":"인사·사람·대명사","word":"男孩儿","pinyin":"nánháir","meaning":"남자아이","example":"那个男孩儿跑得比我快。","examplePinyin":"Nàge nánháir pǎo de bǐ wǒ kuài.","translation":"저 남자아이는 저보다 빨리 달려요."},{"no":28,"category":"인사·사람·대명사","word":"女孩儿","pinyin":"nǚháir","meaning":"여자아이","example":"穿黄裙子的女孩儿在等妈妈。","examplePinyin":"Chuān huáng qúnzi de nǚháir zài děng māma.","translation":"노란 치마를 입은 여자아이가 엄마를 기다려요."},{"no":29,"category":"인사·사람·대명사","word":"小孩儿","pinyin":"xiǎoháir","meaning":"어린아이","example":"这部电影不太适合小孩儿看。","examplePinyin":"Zhè bù diànyǐng bú tài shìhé xiǎoháir kàn.","translation":"이 영화는 어린아이가 보기에 별로 적합하지 않아요."},{"no":30,"category":"인사·사람·대명사","word":"女士","pinyin":"nǚshì","meaning":"여성, ~여사","example":"请把这杯咖啡送给那位女士。","examplePinyin":"Qǐng bǎ zhè bēi kāfēi sòng g lation":"남동생이 자라서 작년 옷이 모두 작아졌어요."},{"no":794,"category":"동작·감각·생각","word":"照","pinyin":"zhào","meaning":"비추다, 찍다","example":"太阳照进房间，屋里暖和多了。","examplePinyin":"Tàiyáng zhào jìn fángjiān, wū lǐ nuǎnhuo duō le.","translation":"햇볕이 방에 들어와 훨씬 따뜻해졌어요."},{"no":795,"category":"동작·감각·생각","word":"让","pinyin":"ràng","meaning":"~하게 하다, 양보하다","example":"老师让我们下课后去办公室。","examplePinyin":"Lǎoshī ràng wǒmen xiàkè hòu qù bàngōngshì.","translation":"선생님이 방과 후 사무실로 오라고 하셨어요."},{"no":796,"category":"동작·감각·생각","word":"分开","pinyin":"fēnkāi","meaning":"분리하다, 헤어지다","example":"请把洗好的衣服和脏衣服分开。","examplePinyin":"Qǐng bǎ xǐ hǎo de yīfu hé zāng yīfu fēnkāi.","translation":"빤 옷과 더러운 옷을 따로 놓아 주세요."},{"no":797,"category":"동작·감각·생각","word":"送","pinyin":"sòng","meaning":"보내다, 선물하다","example":"这是我自己做的，想送给你。","examplePinyin":"Zhè shì wǒ zìjǐ zuò de, xiǎng sòng gěi nǐ.","translation":"이건 제가 만든 건데 너에게 주고 싶어요."},{"no":798,"category":"동작·감각·생각","word":"爱","pinyin":"ài","meaning":"사랑하다, 좋아하다","example":"我爱这座城市，也爱这里的人。","examplePinyin":"Wǒ ài zhè zuò chéngshì, yě ài zhèlǐ de rén.","translation":"이 도시도 이곳 사람들도 사랑해요."},{"no":799,"category":"동작·감각·생각","word":"喜爱","pinyin":"xǐ'ài","meaning":"좋아하다, 사랑하다","example":"这位老师很受学生们喜爱。","examplePinyin":"Zhè wèi lǎoshī hěn shòu xuéshēngmen xǐ'ài.","translation":"이 선생님은 학생들에게 큰 사랑을 받아요."},{"no":800,"category":"동작·감각·생각","word":"喜欢","pinyin":"xǐhuan","meaning":"좋아하다","example":"我喜欢跟能让我开心的人聊天儿。","examplePinyin":"Wǒ xǐhuan gēn néng ràng wǒ kāixīn de rén liáotiānr.","translation":"저를 즐겁게 해 주는 사람과 이야기하는 게 좋아요."},{"no":801,"category":"동작·감각·생각","word":"愿意","pinyin":"yuànyì","meaning":"기꺼이 ~하다, 원하다","example":"只要你愿意，我可以每天陪你练习。","examplePinyin":"Zhǐyào nǐ yuànyì, wǒ kěyǐ měi tiān péi nǐ liànxí.","translation":"원한다면 매일 같이 연습해 줄 수 있어요."},{"no":802,"category":"동작·감각·생각","word":"看","pinyin":"kàn","meaning":"보다","example":"看完这本书，我想再看一遍。","examplePinyin":"Kànwán zhè běn shū, wǒ xiǎng zài kàn yí biàn.","translation":"이 책을 다 읽었지만 다시 읽고 싶어요."},{"no":803,"category":"동작·감각·생각","word":"拍照","pin meaning":"그래서","example":"我昨天没睡好，所以今天有点儿累。","examplePinyin":"Wǒ zuótiān méi shuìhǎo, suǒyǐ jīntiān yǒudiǎnr lèi.","translation":"어젯밤 잘 못 자서 오늘 조금 피곤해요."},{"no":908,"category":"성질·상태·문법","word":"因为","pinyin":"yīnwèi","meaning":"왜냐하면, ~때문에","example":"因为下雨，今天的比赛时间改了。","examplePinyin":"Yīnwèi xiàyǔ, jīntiān de bǐsài shíjiān gǎi le.","translation":"비 때문에 오늘 경기 시간이 바뀌었어요."},{"no":909,"category":"성질·상태·문법","word":"的话","pinyin":"dehuà","meaning":"~라면, ~할 경우","example":"你不喜欢的话，我们就换一个。","examplePinyin":"Nǐ bù xǐhuan dehuà, wǒmen jiù huàn yí ge.","translation":"마음에 안 들면 다른 것으로 바꿔요."},{"no":910,"category":"성질·상태·문법","word":"如果","pinyin":"rúguǒ","meaning":"만약 ~라면","example":"如果有不明白的地方，请问我。","examplePinyin":"Rúguǒ yǒu bù míngbai de dìfang, qǐngwèn wǒ.","translation":"이해 안 되는 부분이 있으면 물어보세요."},{"no":911,"category":"성질·상태·문법","word":"直到","pinyin":"zhídào","meaning":"~까지; ~에 이르러서야","example":"他一直学习，直到晚上十点才休息。","examplePinyin":"Tā yìzhí xuéxí, zhídào wǎnshang shí diǎn cái xiūxi.","translation":"그는 계속 공부하다 밤 10시가 되어서야 쉬었어요."},{"no":912,"category":"성질·상태·문법","word":"只是","pinyin":"zhǐshì","meaning":"다만, 단지","example":"我没有生气，只是觉得有点儿累。","examplePinyin":"Wǒ méi yǒu shēngqì, zhǐshì juéde yǒudiǎnr lèi.","translation":"화난 게 아니라 좀 피곤할 뿐이에요."},{"no":913,"category":"성질·상태·문법","word":"只要","pinyin":"zhǐyào","meaning":"~하기만 하면","example":"只要你有时间，就来我家玩吧。","examplePinyin":"Zhǐyào nǐ yǒu shíjiān, jiù lái wǒ jiā wán ba.","translation":"시간이 있으면 우리 집에 놀러 와요."},{"no":914,"category":"성질·상태·문법","word":"只有","pinyin":"zhǐyǒu","meaning":"오직 ~만, ~해야만","example":"只有先买票，才能坐这辆车。","examplePinyin":"Zhǐyǒu xiān mǎi piào, cái néng zuò zhè liàng chē.","translation":"표를 먼저 사야 이 차를 탈 수 있어요."},{"no":915,"category":"성질·상태·문법","word":"还是","pinyin":"háishi","meaning":"아니면; 여전히; 역시","example":"你想先吃饭，还是先去看电影？","examplePinyin":"Nǐ xiǎng xiān chī fàn, háishi xiān qù kàn diànyǐng?","translation":"먼저 밥 먹을래요, 영화를 보러 갈래요?"},{"no":916,"category":"성질·상태·문법","word":"或","pinyin":"huò","meaning":"또는, 혹은","example":"你可以写信或发邮件告诉我。","examplePinyin":"Nǐ kěyǐ xiě xìn huò fā yóujiàn gàosu wǒ.","translation":"편지를 쓰거나 메일로 알려 줘도 돼요."},{"no":917,"category":"성질·상태·문법","word":"或者","pinyin":"huòzhě","meaning":"또는, 혹은","example":"周末我们去公园或者去动物园吧。","examplePinyin":"Zhōumò wǒmen qù gōngyuán huòzhě qù dòngwùyuán ba.","translation":"주말에 공원이나 동물원에 가요."},{"no":918,"category":"성질·상태·문법","word":"可能","pinyin":"kěnéng","meaning":"아마, 가능하다","example":"他还没回电话，可能正在开会。","examplePinyin":"Tā hái méi huí diànhuà, kěnéng zhèngzài kāihuì.","translation":"그가 아직 다시 전화하지 않은 걸 보니 회의 중인가 봐요."},{"no":919,"category":"성질·상태·문법","word":"大概","pinyin":"dàgài","meaning":"대략, 아마","example":"从这儿到车站大概要走二十分钟。","examplePinyin":"Cóng zhèr dào chēzhàn dàgài yào zǒu èrshí fēnzhōng.","translation":"여기서 역까지 걸어서 약 20분 걸려요."},{"no":920,"category":"성질·상태·문법","word":"当然","pinyin":"dāngrán","meaning":"당연하다, 물론","example":"你帮了这么多忙，我当然要谢谢你。","examplePinyin":"Nǐ bāng le zhème duō máng, wǒ dāngrán yào xièxie nǐ.","translation":"많이 도와줬으니 당연히 감사해야죠."},{"no":921,"category":"성질·상태·문법","word":"好像","pinyin":"hǎoxiàng","meaning":"마치 ~같다, ~인 것 같다","example":"我好像把书忘在你家了。","examplePinyin":"Wǒ hǎoxiàng bǎ shū wàng zài nǐ jiā le.","translation":"책을 당신 집에 두고 온 것 같아요."},{"no":922,"category":"성질·상태·문법","word":"其实","pinyin":"qíshí","meaning":"사실은, 실은","example":"大家都说这很难，其实很简单。","examplePinyin":"Dàjiā dōu shuō zhè hěn nán, qíshí hěn jiǎndān.","translation":"모두 어렵다고 하지만 사실 간단해요."},{"no":923,"category":"성질·상태·문법","word":"一定","pinyin":"yídìng","meaning":"반드시, 꼭","example":"明天一定要带上自己的课本。","examplePinyin":"Míngtiān yídìng yào dàishàng zìjǐ de kèběn.","translation":"내일은 교과서를 꼭 가져오세요."},{"no":924,"category":"성질·상태·문법","word":"最","pinyin":"zuì","meaning":"가장, 제일","example":"我最喜欢的是跟朋友一起旅行。","examplePinyin":"Wǒ zuì xǐhuan de shì gēn péngyou yìqǐ lǚxíng.","translation":"제가 가장 좋아하는 것은 친구와 여행하는 거예요."},{"no":925,"category":"성질·상태·문법","word":"得","pinyin":"de","meaning":"정도·상태 보어를 잇는 조사","example":"他今天来得很早，比老师还早。","examplePinyin":"Tā jīntiān lái de hěn zǎo, bǐ lǎoshī hái zǎo.","translation":"오늘 ."},{"no":945,"category":"성질·상태·문법","word":"还","pinyin":"hái","meaning":"아직, 또","example":"这么晚了，老师还在办公室工作。","examplePinyin":"Zhème wǎn le, lǎoshī hái zài bàngōngshì gōngzuò.","translation":"이렇게 늦었는데 선생님은 아직 사무실에서 일하세요."},{"no":946,"category":"성질·상태·문법","word":"再","pinyin":"zài","meaning":"다시, 또","example":"你再想想，一定会找到办法的。","examplePinyin":"Nǐ zài xiǎng xiang, yídìng huì zhǎodào bànfǎ de.","translation":"다시 생각하면 꼭 방법을 찾을 거예요."},{"no":947,"category":"성질·상태·문법","word":"才¹","pinyin":"cái","meaning":"비로소, 겨우","example":"他昨天九点才下班，到家更晚了。","examplePinyin":"Tā zuótiān jiǔ diǎn cái xiàbān, dào jiā gèng wǎn le.","translation":"그는 어제 9시가 돼서야 퇴근해서 귀가가 더 늦었어요."},{"no":948,"category":"성질·상태·문법","word":"然后","pinyin":"ránhòu","meaning":"그런 다음에","example":"先把手洗干净，然后再来吃饭。","examplePinyin":"Xiān bǎ shǒu xǐ gānjìng, ránhòu zài lái chī fàn.","translation":"먼저 손을 깨끗이 씻고 나서 밥 먹으러 오세요."},{"no":949,"category":"성질·상태·문법","word":"又","pinyin":"yòu","meaning":"또, 다시","example":"今天又下雨了，我们不能去打球了。","examplePinyin":"Jīntiān yòu xiàyǔ le, wǒmen bù néng qù dǎ qiú le.","translation":"오늘 또 비가 와서 공놀이하러 못 가겠어요."},{"no":950,"category":"성질·상태·문법","word":"正在","pinyin":"zhèngzài","meaning":"지금 ~하고 있다","example":"我正在写作业，晚点儿再聊吧。","examplePinyin":"Wǒ zhèngzài xiě zuòyè, wǎndiǎn r zài liáo ba.","translation":"숙제 중이니 나중에 이야기해요."},{"no":951,"category":"성질·상태·문법","word":"了","pinyin":"le","meaning":"완료·변화 표시","example":"我买了机票，下周三出发。","examplePinyin":"Wǒ mǎi le jīpiào, xiàzhōu sān chūfā.","translation":"항공권을 샀고 다음 주 수요일에 출발해요."},{"no":952,"category":"성질·상태·문법","word":"吗","pinyin":"ma","meaning":"~입니까?","example":"我坐在这里，会影响你学习吗？","examplePinyin":"Wǒ zuò zài zhèlǐ, huì yǐngxiǎng nǐ xuéxí ma?","translation":"제가 여기 앉으면 공부에 방해될까요?"},{"no":953,"category":"성질·상태·문법","word":"呢","pinyin":"ne","meaning":"~은/는요?","example":"我已经吃完了，你呢？","examplePinyin":"Wǒ yǐjīng chīwán le, nǐ ne?","translation":"저는 다 먹었는데 당신은요?"},{"no":954,"category":"성질·상태·문법","word":"吧","pinyin":"ba","meaning":"~하자, ~하세요","example":"路太远，我们还是坐车吧。","examplePinyin":"Lù tài yuǎn, wǒmen háishi zuò chē ba.","translation":"길이 머니 차를 타는 게 좋겠어요."},{"no":955,"category":"성질·상태·문법","word":"不","pinyin":"bù","meaning":"~않다, 아니다","example":"如果你不想去，我就自己去。","examplePinyin":"Rúguǒ nǐ bù xiǎng qù, wǒ jiù zìjǐ qù.","translation":"가기 싫으면 저 혼자 갈게요."},{"no":956,"category":"성질·상태·문법","word":"不要","pinyin":"búyào","meaning":"~하지 마라","example":"不要边走路边看书，要注意安全。","examplePinyin":"Búyào biān zǒulù biān kàn shū, yào zhùyì ānquán.","translation":"걸으면서 책을 보지 말고 안전에 주의하세요."},{"no":957,"category":"성질·상태·문법","word":"对","pinyin":"duì","meaning":"맞다, 옳다","example":"这次我回答对了，老师很高兴。","examplePinyin":"Zhècì wǒ huídá duì le, lǎoshī hěn gāoxìng.","translation":"이번에는 맞게 답해서 선생님이 기뻐하셨어요."},{"no":958,"category":"성질·상태·문법","word":"不同","pinyin":"bùtóng","meaning":"다르다","example":"这两种方法不同，但都很有用。","examplePinyin":"Zhè liǎng zhǒng fāngfǎ bùtóng, dàn dōu hěn yǒuyòng.","translation":"이 두 방법은 다르지만 둘 다 유용해요."},{"no":959,"category":"성질·상태·문법","word":"差","pinyin":"chà","meaning":"나쁘다, 부족하다","example":"我的汉语还差一点儿，得多练习。","examplePinyin":"Wǒ de Hànyǔ hái chà yìdiǎnr, děi duō liànxí.","translation":"제 중국어는 아직 좀 부족해서 더 연습해야 해요."},{"no":960,"category":"성질·상태·문법","word":"不行","pinyin":"bùxíng","meaning":"안 되다","example":"一个人搬这个不行，我们一起搬。","examplePinyin":"Yí ge rén bān zhège bùxíng, wǒmen yìqǐ bān.","translation":"혼자 옮기기는 안 되니 함께 옮겨요."},{"no":961,"category":"성질·상태·문법","word":"行","pinyin":"xíng","meaning":"괜찮다, 가능하다","example":"明天不行的话，后天也行。","examplePinyin":"Míngtiān bùxíng dehuà, hòutiān yě xíng.","translation":"내일 안 되면 모레도 괜찮아요."},{"no":962,"category":"성질·상태·문법","word":"非常","pinyin":"fēicháng","meaning":"매우","example":"你帮我找到了手机，我非常高兴。","examplePinyin":"Nǐ bāng wǒ zhǎodào le shǒujī, wǒ fēicháng gāoxìng.","translation":"휴대전화를 찾아 줘서 무척 기뻐요."},{"no":963,"category":"성질·상태·문법","word":"狗","pinyin":"gǒu","meaning":"개","example":"这只狗很聪明，能自己开门。","examplePinyin":"Zhè zhī gǒu hěn cōngming, néng zìjǐ kāimén.","translation":"이 개는 영리해서 혼자 문을 열 수 있어요."},{"no":964,"category":"성질·상태·문법","word":"好","pinyin":"hǎo","meaning":"좋다","example":"今天感觉好多了，可以去上班了。","examplePinyin":"Jīntiān gǎn jué hǎoduō le, kěyǐ qù shàngbān le.","translation":"오늘은 많이 나아서 출근할 수 있어요."},{"no":965,"category":"성질·상태·문법","word":"聪明","pinyin":"cōngming","meaning":"똑똑하다","example":"这个孩子很聪明，一学就会。","examplePinyin":"Zhège háizi hěn cōngming, yì xué jiù huì.","translation":"이 아이는 영리해서 배우면 바로 할 줄 알아요."},{"no":966,"category":"성질·상태·문법","word":"方便","pinyin":"fāngbiàn","meaning":"편리하다","example":"住在学校附近，上课很方便。","examplePinyin":"Zhù zài xuéxiào fùjìn, shàngkè hěn fāngbiàn.","translation":"학교 근처에 살아서 수업에 가기 편해요."},{"no":967,"category":"성질·상태·문법","word":"合适","pinyin":"héshì","meaning":"적합하다, 알맞다","example":"这双鞋大小正合适，我就买这双。","examplePinyin":"Zhè shuāng xié dàxiǎo zhèng héshì, wǒ jiù mǎi zhè shuāng.","translation":"이 신발이 딱 맞으니 이걸 살게요."},{"no":968,"category":"성질·상태·문법","word":"简单","pinyin":"jiǎndān","meaning":"간단하다, 쉽다","example":"这道题看着简单，做起来不容易。","examplePinyin":"Zhè dào tí kàn zhe jiǎndān, zuò qǐlai bù róngyì.","translation":"이 문제는 쉬워 보이지만 풀기는 어려워요."},{"no":969,"category":"성질·상태·문법","word":"难","pinyin":"nán","meaning":"어렵다","example":"我觉得说汉语不难，写汉字比较难。","examplePinyin":"Wǒ juéde shuō Hànyǔ bù nán, xiě Hànzì bǐjiào nán.","translation":"중국어로 말하기는 어렵지 않지만 한자 쓰기는 좀 어려워요."},{"no":970,"category":"성질·상태·문법","word":"清楚","pinyin":"qīngchu","meaning":"분명하다, 명확하다","example":"这里太吵，你说的话我听不清楚。","examplePinyin":"Zhèlǐ tài chǎo, nǐ shuō de huà wǒ tīng bu qīngchu.","translation":"여기는 시끄러워서 말이 잘 안 들려요."},{"no":971,"category":"성질·상태·문법","word":"认真","pinyin":"rènzhēn","meaning":"진지하다, 성실하다","example":"他做作业很认真，很少写错字。","examplePinyin":"Tā zuò zuòyè hěn rènzhēn, hěnshǎo xiěcuò zì.","translation":"그는 숙제를 꼼꼼히 해서 글자를 거의 틀리지 않아요."},{"no":972,"category":"성질·상태·문법","word":"容易","pinyin":"róngyì","meaning":"쉽다","example":"多读几遍，就容易记住了。","examplePinyin":"Duō dú jǐ biàn, jiù róngyì jì zhù le.","translation":"몇 번 더 읽으면 기억하기 쉬워져요."},{"no":973,"category":"성질·상태·문법","word":"一般","pinyin":"yìbān","meaning":"보통, 일반적이다","example":"工作日我一般七点以前就起床。","example const LEVEL = 3;
const state = { showPinyin:true, showMeaning:true, showTranslation:true, speaking:false, paused:false, resumeNext:null, resumeSpeech:null, speechToken:0, runId:0, currentAudio:null, currentNo:null, nextTimer:null, statusTimer:null };
const list = document.getElementById('list');
const statusBox = document.getElementById('status');
const pauseResumeBtn = document.getElementById('pauseResume');

function syncPauseButton() {
  pauseResumeBtn.disabled = !state.speaking;
  pauseResumeBtn.classList.toggle('paused', state.paused);
  pauseResumeBtn.textContent = state.paused ? '▶ 이어듣기' : 'Ⅱ 일시정지';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = DATA.filter(x => !q || [x.no,x.word,x.pinyin,x.meaning,x.example,x.examplePinyin,x.translation,x.category].join(' ').toLowerCase().includes(q));
  document.getElementById('count').textContent = `${filtered.length} / 1000`;
  let last = '';
  list.innerHTML = filtered.map(x => {
    const heading = x.category !== last ? `<h2 class="category">${esc(x.category)}</h2>` : '';
    last = x.category;
    return `${heading}<article class="card">
      <div class="wordline"><button class="startPick ${Number(document.getElementById('startNo')?.value||1)===x.no?'selected':''}" data-no="${x.no}" title="${x.no}번부터 연속 재생">${x.no}</button><div class="hanzi">${esc(x.word)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.pinyin)}</div><button class="play" data-kind="word" data-no="${x.no}">▶ 단어</button></div>
      <div class="answer meaning ${state.showMeaning?'':'hidden'}">${esc(x.meaning)}</div>
      <div class="exampleline"><div class="no">例</div><div class="hanzi sentence">${esc(x.example)}</div><div class="pinyin ${state.showPinyin?'':'hidden'}">${esc(x.examplePinyin)}</div><button class="play" data-kind="sentence" data-no="${x.no}">▶ 예문</button></div>
      <div class="answer translation ${state.showTranslation?'':'hidden'}">${esc(x.translation)}</div>
    </article>`;
  }).join('');
}

function getChineseVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  const language = v => v.lang.toLowerCase().replaceAll('_', '-');
  // HSK uses Mandarin. A zh-HK (Cantonese) voice is not a Mandarin fallback.
  return voices.find(v => /^zh-cn(?:-|$)/.test(language(v)))
    || voices.find(v => /^zh-sg(?:-|$)/.test(language(v)))
    || voices.find(v => /^cmn(?:-|$)/.test(language(v)))
    || voices.find(v => /^zh-tw(?:-|$)/.test(language(v)))
    || voices.find(v => language(v) === 'zh') || null;
}
function waitForChineseVoice() {
  const voice = getChineseVoice();
  if (voice || !('speechSynthesis' in window)) return Promise.resolve(voice);
  return new Promise(resolve => {
    const finish = () => {
      clearTimeout(timer);
      speechSynthesis.removeEventListener('voiceschanged', onChange);
      resolve(getChineseVoice());
    };
    const onChange = () => { if (getChineseVoice()) finish(); };
    const timer = setTimeout(finish, 1500);
    speechSynthesis.addEventListener('voiceschanged', onChange);
    onChange();
  });
}
function wordSpeechText(item) {
  // Meaning numbers and optional-letter brackets are printed annotations.
  return item.word.replace(/[¹²³⁴⁵⁶⁷⁸⁹⁰()（）]/g, '');
}
function playQueue(entries, label) {
  clearTimeout(state.nextTimer);
  window.speechSynthesis?.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
  const runId = ++state.runId;
  state.speaking = true;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  syncPauseButton();
  document.querySelectorAll('.play').forEach(b => b.disabled = true);
  let voice = null;
  let done = 0;
  showStatus(`${label} 재생 준비 중…`);
  const fail = message => {
    if (runId !== state.runId) return;
    state.speaking = false;
    state.paused = false;
    state.resumeNext = null;
    state.resumeSpeech = null;
    state.speechToken++;
    if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
    syncPauseButton();
    document.querySelectorAll('.play').forEach(b => b.disabled = false);
    showStatus(message);
  };
  const scheduleNext = () => {
    state.nextTimer = setTimeout(() => { state.nextTimer = null; next(); }, 350);
  };
  const next = async () => {
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (done >= entries.length) {
      state.speaking = false;
      state.paused = false;
      syncPauseButton();
      document.querySelectorAll('.play').forEach(b => b.disabled = false);
      showStatus(`${label} 재생 완료`);
      hideStatusLater();
      return;
    }
    const item = entries[done];
    focusCurrent(item.no);
    showStatus(`${label} 재생 중 · ${item.progress || `${done+1}/${entries.length}`}`);
    if (item.audio) {
      const audio = new Audio(item.audio);
      state.currentAudio = audio;
      audio.playbackRate = Number(document.getElementById('speechRate').value);
      audio.preservesPitch = true;
      audio.onended = () => {
        if (runId !== state.runId || state.currentAudio !== audio) return;
        state.currentAudio = null;
        done++;
        scheduleNext();
      };
      audio.onerror = () => {
        if (runId !== state.runId || state.currentAudio !== audio) return;
        fail(`${item.no}번 음원을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 재생하세요.`);
      };
      audio.play().catch(() => {
        if (runId === state.runId && state.currentAudio === audio) {
          fail('음원을 재생하지 못했습니다. 재생 버튼을 다시 눌러 주세요.');
        }
      });
      return;
    }
    if (!('speechSynthesis' in window)) {
      fail('이 브라우저는 중국어 음성 재생을 지원하지 않습니다.');
      return;
    }
    if (!voice) voice = await waitForChineseVoice();
    if (runId !== state.runId) return;
    if (state.paused) { state.resumeNext = next; return; }
    if (!voice) {
      fail('중국어(보통화) 음성을 찾지 못했습니다. 기기에 중국어 음성을 설치한 뒤 다시 재생하세요.');
      return;
    }
    const speakCurrent = () => {
      if (runId !== state.runId) return;
      if (state.paused) { state.resumeNext = speakCurrent; return; }
      const token = ++state.speechToken;
      state.resumeSpeech = speakCurrent;
      const u = new SpeechSynthesisUtterance(item.text);
      u.lang = voice.lang;
      u.rate = Number(document.getElementById('speechRate').value);
      u.pitch = 1;
      u.voice = voice;
      u.onend = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        state.resumeSpeech = null;
        done++;
        scheduleNext();
      };
      u.onerror = () => {
        if (runId !== state.runId || token !== state.speechToken || state.paused) return;
        fail('중국어 음성 재생에 실패했습니다. 재생 버튼을 다시 눌러 주세요.');
      };
      speechSynthesis.speak(u);
    };
    speakCurrent();
  };
  next();
}
const FIXED_AUDIO = {};
function fixedAudio(no, kind) { return FIXED_AUDIO[no]?.[kind] || null; }
function repeatEntries(text, repeat, progress, audio=null, no=null, kind=null) {
  return Array.from({length:repeat}, (_,i) => ({text, audio, no, kind, progress:`${progress} · ${i+1}/${repeat}회`}));
}
function focusCurrent(no) {
  if (!no) return;
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  const card = document.querySelector(`article.card:has(.startPick[data-no="${no}"])`);
  if (!card) return;
  card.classList.add('reading');
  if (state.currentNo !== no) card.scrollIntoView({behavior:'smooth', block:'center'});
  state.currentNo = no;
}
function stopPlayback() {
  state.runId++;
  clearTimeout(state.nextTimer);
  state.nextTimer = null;
  state.speaking = false;
  state.paused = false;
  state.resumeNext = null;
  state.resumeSpeech = null;
  state.speechToken++;
  window.speechSynthesis?.cancel();
  if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio.currentTime=0; state.currentAudio=null; }
  state.currentNo=null;
  syncPauseButton();
  document.querySelectorAll('.card.reading').forEach(x => x.classList.remove('reading'));
  document.querySelectorAll('.play').forEach(b => b.disabled = false);
  showStatus('재생을 멈췄습니다.');
  hideStatusLater();
}
function togglePause() {
  if (!state.speaking) return;
  if (!state.paused) {
    state.paused = true;
    if (state.currentAudio && !state.currentAudio.paused) state.currentAudio.pause();
    if (!state.currentAudio && state.resumeSpeech) {
      state.resumeNext = state.resumeSpeech;
      state.speechToken++;
      speechSynthesis.cancel();
    }
    syncPauseButton();
    showStatus('일시정지됨 · 화면을 다시 누르거나 이어듣기 버튼을 누르세요');
    return;
  }
  state.paused = false;
  if (state.currentAudio && state.currentAudio.paused) {
    const audio = state.currentAudio;
    const runId = state.runId;
    audio.play().catch(() => {
      if (runId === state.runId && state.currentAudio === audio) audio.onerror();
    });
  }
  const resume = state.resumeNext;
  state.resumeNext = null;
  if (resume) resume();
  syncPauseButton();
  showStatus('이어서 재생합니다');
}
function showStatus(msg) {
  clearTimeout(state.statusTimer);
  statusBox.textContent = msg;
  statusBox.classList.add('show');
}
function hideStatusLater() {
  clearTimeout(state.statusTimer);
  state.statusTimer = setTimeout(() => statusBox.classList.remove('show'), 1500);
}
function selectedItems() {
  const input = document.getElementById('startNo');
  const start = Math.min(1000, Math.max(1, Math.floor(Number(input.value) || 1)));
  input.value = start;
  return {start, items:DATA.filter(x => x.no >= start)};
}

list.addEventListener('click', e => {
  const pick = e.target.closest('.startPick');
  if (pick) {
    document.getElementById('startNo').value = pick.dataset.no;
    render();
    showStatus(`${pick.dataset.no}번을 연속 재생 시작 번호로 선택했습니다.`);
    hideStatusLater();
    return;
  }
  const btn = e.target.closest('.play'); if (!btn) return;
  const item = DATA.find(x => x.no === Number(btn.dataset.no));
  const isWord = btn.dataset.kind === 'word';
  const repeat = Number(document.getElementById(isWord?'wordRepeat':'sentenceRepeat').value);
  playQueue(repeatEntries(isWord?wordSpeechText(item):item.example, repeat, `${item.no}번`, fixedAudio(item.no,isWord?'word':'example'), item.no, isWord?'word':'example'), isWord?'단어':'예문');
});
document.getElementById('playAllWords').addEventListener('click', () => {
  const repeat = Number(document.getElementById('wordRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(wordSpeechText(x), repeat, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word')), `${start}~1000 전체 단어`);
});
document.getElementById('playAllSentences').addEventListener('click', () => {
  const repeat = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => repeatEntries(x.example, repeat, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')), `${start}~1000 전체 예문`);
});
document.getElementById('playAllBoth').addEventListener('click', () => {
  const wr = Number(document.getElementById('wordRepeat').value);
  const sr = Number(document.getElementById('sentenceRepeat').value);
  const {start,items} = selectedItems();
  playQueue(items.flatMap(x => [...repeatEntries(wordSpeechText(x), wr, `${x.no}/1000 단어`, fixedAudio(x.no,'word'), x.no, 'word'), ...repeatEntries(x.example, sr, `${x.no}/1000 예문`, fixedAudio(x.no,'example'), x.no, 'example')]), `${start}~1000 단어+예문`);
});
document.getElementById('stopAll').addEventListener('click', stopPlayback);
pauseResumeBtn.addEventListener('click', togglePause);
document.addEventListener('click', e => {
  if (e.target.closest('button, input, select, label, a, .status')) return;
  togglePause();
});
const toTop = document.getElementById('toTop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
window.addEventListener('scroll', () => toTop.classList.toggle('show', window.scrollY > 450), {passive:true});
document.getElementById('startNo').addEventListener('change', () => { selectedItems(); render(); });
document.getElementById('search').addEventListener('input', render);
document.getElementById('pinyinToggle').addEventListener('click', e => { state.showPinyin=!state.showPinyin; e.currentTarget.classList.toggle('on',state.showPinyin); e.currentTarget.textContent=state.showPinyin?'병음 보임':'병음 숨김'; render(); });
document.getElementById('meaningToggle').addEventListener('click', e => { state.showMeaning=!state.showMeaning; e.currentTarget.classList.toggle('on',state.showMeaning); e.currentTarget.textContent=state.showMeaning?'뜻 보임':'뜻 숨김'; render(); });
document.getElementById('translationToggle').addEventListener('click', e => { state.showTranslation=!state.showTranslation; e.currentTarget.classList.toggle('on',state.showTranslation); e.currentTarget.textContent=state.showTranslation?'해석 보임':'해석 숨김'; render(); });
render();
</script>
</body>
</html>
