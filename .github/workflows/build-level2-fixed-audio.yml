name: Build level 2 fixed pronunciation audio

on:
  push:
    paths:
      - audio/level2-fixed-audio.json
      - .github/workflows/build-level2-fixed-audio.yml

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[fixed-audio-built]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download and split verified Mandarin audio
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import subprocess
          from pathlib import Path

          root = Path('audio')
          spec = json.loads((root / 'level2-fixed-audio.json').read_text(encoding='utf-8'))
          master = root / 'level2-fixed-master.wav'
          urllib.request.urlretrieve(spec['source_url'], master)

          for clip in spec['clips']:
              duration = clip['end'] - clip['start']
              subprocess.run([
                  'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                  '-ss', str(clip['start']), '-t', str(duration), '-i', str(master),
                  '-af', 'adelay=80:all=1,apad=pad_dur=0.08',
                  '-ar', '24000', '-ac', '1', '-c:a', 'pcm_s16le',
                  str(root / clip['file'])
              ], check=True)
          PY
      - name: Commit generated clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/item2-*.wav audio/level2-fixed-master.wav
          git diff --cached --quiet || git commit -m "Add verified level 2 pronunciation audio [fixed-audio-built]"
          git push
