","word":"古老","pinyin":"gǔlǎo","meaning":"오래되다, 유서 깊다","example":"这项古老的技艺，在年轻设计师手中焕发了新意。","examplePinyin":"Zhè xiàng gǔlǎo de jìyì, zài niánqīng shèjìshī shǒuzhōng huànfā le xīnyì.","translation":"이 오래된 기술은 젊은 디자이너의 손에서 새롭게 거듭났어요."},{"no":1320,"category":"성질·상태·문법","word":"含","pinyin":"hán","meaning":"포함하다, 함유하다","example":"这款饮料含糖较多，不宜当作日常饮用水。","examplePinyin":"Zhè kuǎn yǐnliào hántáng jiào duō, bùyí dàngzuò rìcháng yǐnyòngshuǐ.","translation":"이 음료는 당이 많아 일상적인 식수로 삼기에는 적절하지 않아요."},{"no":1321,"category":"성질·상태·문법","word":"含有","pinyin":"hányǒu","meaning":"포함하다, 가지고 있다","example":"某些清洁剂含有刺激性成分，使用时应注意通风。","examplePinyin":"Mǒuxiē qīngjiéjì hányǒu cìjīxìng chéngfèn, shǐyòng shí yīng zhùyì tōngfēng.","translation":"일부 세제에는 자극성 성분이 있어 사용할 때 환기에 주의해야 해요."},{"no":1322,"category":"성질·상태·문법","word":"黑","pinyin":"hēi","meaning":"검다, 어둡다; 불법적인","example":"天还没完全黑，巡逻人员就开始检查路灯。","examplePinyin":"Tiān hái méi wánquán hēi, xúnluó rényuán jiù kāishǐ jiǎnchá lùdēng.","translation":"완전히 어두워지기 전부터 순찰자가 가로등을 점검하기 시작했어요."},{"no":1323,"category":"성질·상태·문법","word":"红","pinyin":"hóng","meaning":"붉다, 홍색","example":"秋天一到，山坡上的叶子便逐渐变红。","examplePinyin":"Qiūtiān yí dào, shānpō shàng de yèzi biàn zhújiàn biànhóng.","translation":"가을이 오면 산비탈의 잎들이 점차 붉게 변해요."},{"no":1324,"category":"성질·상태·문법","word":"滑","pinyin":"huá","meaning":"미끄럽다, 활주하다","example":"木桥遇水后容易滑，管理人员铺上了防滑垫。","examplePinyin":"Mùqiáo yù shuǐ hòu róngyì huá, guǎnlǐ rényuán pùshàng le fánghuádiàn.","translation":"나무다리는 물에 젖으면 미끄러워 관리자가 미끄럼 방지 매트를 깔았어요."},{"no":1325,"category":"성질·상태·문법","word":"缓慢","pinyin":"huǎnmàn","meaning":"느리다, 완만하다","example":"山路狭窄，运输车辆只能缓慢前行。","examplePinyin":"Shānlù xiázhǎi, yùnshū chēliàng zhǐnéng huǎnmàn qiánxíng.","translation":"산길이 좁아서 운송 차량은 천천히 갈 수밖에 없어요."},{"no":1326,"category":"성질·상태·문법","word":"灰色","pinyin":"huīsè","meaning":"회색, 잿빛","example":"连续几天，城市都笼罩在一片灰色的云层下。","examplePinyin":"Liánxù jǐ tiān, chéngshì dōu lǒngzhào zài yípiàn huīsè de yúncéng xià.","translation":"며칠째 도시가 잿빛 구름 아래에 덮여 있어요."},{"no":1327,"category":"성질·상태·문법","word":"艰苦","pinyin":"jiānkǔ","meaning":"어렵고 힘들다, 고생스럽다","example":"条件虽然艰苦，考察队仍坚持完成实地调查。","examplePinyin":"Tiáojiàn suīrán jiānkǔ, kǎocháduì réng jiānchí wánchéng shídì diàochá.","translation":"여건은 힘들었지만 조사대는 현장 조사를 끝까지 마쳤어요."},{"no":1328,"category":"성질·상태·문법","word":"结构","pinyin":"jiégòu","meaning":"구조, 조직","example":"了解文章结构，有助于把握作者的论证思路。","examplePinyin":"Liǎojiě wénzhāng jiégòu, yǒuzhùyú bǎwò zuòzhě de lùnzhèng sīlù.","translation":"글의 구조를 알면 작가의 논증 흐름을 파악하기 쉬워요."},{"no":1329,"category":"성질·상태·문법","word":"激烈","pinyin":"jīliè","meaning":"격렬하다, 심하다","example":"市场竞争越激烈，企业越要重视产品质量。","examplePinyin":"Shìchǎng jìngzhēng yuè jīliè, qǐyè yuè yào zhòngshì chǎnpǐn zhìliàng.","translation":"시장 경쟁이 치열할수록 기업은 제품의 질을 중시해야 해요."},{"no":1330,"category":"성질·상태·문법","word":"紧","pinyin":"jǐn","meaning":"팽팽하다, 단단하다; 빠듯하다","example":"出发前检查背带是否系紧，可以减少途中风险。","examplePinyin":"Chūfā qián jiǎnchá bēidài shìfǒu jìjǐn, kěyǐ jiǎnshǎo túzhōng fēngxiǎn.","translation":"출발 전에 어깨끈이 단단히 매였는지 확인하면 위험을 줄일 수 있어요."},{"no":1331,"category":"성질·상태·문법","word":"静","pinyin":"jìng","meaning":"고요하다, 조용하다","example":"夜深以后，村子静得只能听见远处的流水声。","examplePinyin":"Yèshēn yǐhòu, cūnzi jìng de zhǐnéng tīngjiàn yuǎnchù de liúshuǐshēng.","translation":"밤이 깊자 마을은 멀리 물 흐르는 소리만 들릴 만큼 고요해졌어요."},{"no":1332,"category":"성질·상태·문법","word":"紧急","pinyin":"jǐnjí","meaning":"긴급하다, 위급하다","example":"遇到紧急情况时，保持冷静比盲目行动更重要。","examplePinyin":"Yùdào jǐnjí qíngkuàng shí, bǎochí lěngjìng bǐ mángmù xíngdòng gèng zhòngyào.","translation":"긴급 상황에서는 무작정 행동하기보다 침착함을 유지하는 것이 중요해요."},{"no":1333,"category":"성질·상태·문법","word":"紧密","pinyin":"jǐnmì","meaning":"긴밀하다, 밀접하다","example":"地方经济与交通条件之间，存在紧密的联系。","examplePinyin":"Dìfāng jīngjì yǔ jiāotōng tiáojiàn zhījiān, cúnzài jǐnmì de liánxì.","translation":"지역 경제와 교통 여건 사이에는 밀접한 관련이 있어요."},{"no":1334,"category":"성질·상태·문법","word":"具体","pinyin":"jùtǐ","meaning":"구체적, 상세하다","example":"建议越具体，执行的人就越容易理解你的想法。","examplePinyin":"Jiànyì yuè jùtǐ, zhíxíng de rén jiù yuè róngyì lǐjiě nǐ de xiǎngfǎ.","translation":"제안이 구체적일수록 실행하는 사람이 생각을 이해하기 쉬워요."},{"no":1335,"category":"성질·상태·문법","word":"具有","pinyin":"jùyǒu","meaning":"가지다, 소유하다","example":"这份研究具有参考价值，但不能直接套用。","examplePinyin":"Zhè fèn yánjiū jùyǒu cānkǎo jiàzhí, dàn bùnéng zhíjiē tàoyòng.","translation":"이 연구는 참고할 가치는 있지만 그대로 적용해서는 안 돼요."},{"no":1336,"category":"성질·상태·문법","word":"可怕","pinyin":"kěpà","meaning":"무섭다, 두렵다","example":"错误并不可怕，可怕的是拒绝发现和改正。","examplePinyin":"Cuòwù bìng bù kěpà, kěpà de shì jùjué fāxiàn hé gǎizhèng.","translation":"실수보다 무서운 것은 실수를 찾아 고치려 하지 않는 태도예요."},{"no":1337,"category":"성질·상태·문법","word":"宽","pinyin":"kuān","meaning":"넓다, 너비","example":"道路变宽以后，也需要考虑行人过街的安全。","examplePinyin":"Dàolù biànkuān yǐhòu, yě xūyào kǎolǜ xíngrén guò jiē de ānquán.","translation":"도로가 넓어지면 보행자의 횡단 안전도 고려해야 해요."},{"no":1338,"category":"성질·상태·문법","word":"类似","pinyin":"lèisì","meaning":"유사하다, 비슷하다","example":"面对类似情况，可以参考经验，但不能机械照搬。","examplePinyin":"Miànduì lèisì qíngkuàng, kěyǐ cānkǎo jīngyàn, dàn bùnéng jīxiè zhàobān.","translation":"비슷한 상황에서 경험을 참고할 수는 있지만 기계적으로 따라서는 안 돼요."},{"no":1339,"category":"성질·상태·문법","word":"忙碌","pinyin":"mánglù","meaning":"바쁘다, 분주하다","example":"忙碌并不等于高效，有时需要先调整工作的顺序。","examplePinyin":"Mánglù bìngbù děngyú gāoxiào, yǒushí xūyào xiān tiáozhěng gōngzuò de shùnxù.","translation":"분주하다고 효율적인 것은 아니며 일의 순서부터 바꿔야 할 때도 있어요."},{"no":1340,"category":"성질·상태·문법","word":"毛病","pinyin":"máobìng","meaning":"결함, 문제","example":"设备的小毛病如果长期不修，也可能造成大损失。","examplePinyin":"Shèbèi de xiǎo máobìng rúguǒ chángqī bù xiū, yě kěnéng zàochéng dà sǔnshī.","translation":"장비의 작은 고장도 오래 방치하면 큰 손실을 낳을 수 있어요."},{"no":1341,"category":"성질·상태·문법","word":"面2","pinyin":"miàn","meaning":"면, 표면; 측면; (양사) 개","example":"讨论问题时，既要看到有利的一面，也要考虑风险。","examplePinyin":"Tǎolùn wèntí shí, jì yào kàndào yǒulì de yímiàn, yě yào kǎolǜ fēngxiǎn.","translation":"문제를 논의할 때는 유리한 면과 위험을 함께 봐야 해요."},{"no":1342,"category":"성질·상태·문법","word":"明确","pinyin":"míngquè","meaning":"명확하다, 분명하다","example":"任务目标越明确，团队越容易形成一致行动。","examplePinyin":"Rènwu mùbiāo yuè míngquè, tuánduì yuè róngyì xíngchéng yízhì xíngdòng.","translation":"임무 목표가 분명할수록 팀이 일관되게 행동하기 쉬워요."},{"no":1343,"category":"성질·상태·문법","word":"明显","pinyin":"míngxiǎn","meaning":"뚜렷하다, 명백하다","example":"经过一个学期的练习，他的表达能力明显提高。","examplePinyin":"Jīngguò yí ge xuéqī de liànxí, tā de biǎodá nénglì míngxiǎn tígāo.","translation":"한 학기 연습한 뒤 그의 표현 능력이 뚜렷이 향상됐어요."},{"no":1344,"category":"성질·상태·문법","word":"密切","pinyin":"mìqiè","meaning":"긴밀하다, 밀접하다","example":"社区工作人员与居民保持密切联系，及时了解需求。","examplePinyin":"Shèqū gōngzuò rényuán yǔ jūmín bǎochí mìqiè liánxì, jíshí liǎojiě xūqiú.","translation":"마을 담당자는 주민들과 긴밀히 연락하며 요구를 제때 파악해요."},{"no":1345,"category":"성질·상태·문법","word":"模糊","pinyin":"móhu","meaning":"흐릿하다, 모호하다","example":"如果责任划分模糊，问题出现时就容易互相推脱。","examplePinyin":"Rúguǒ zérèn huàfēn móhu, wèntí chūxiàn shí jiù róngyì hùxiāng tuītuō.","translation":"책임 구분이 모호하면 문제가 생겼을 때 서로 미루기 쉬워요."},{"no":1346,"category":"성질·상태·문법","word":"陌生","pinyin":"mòshēng","meaning":"낯설다, 생소하다","example":"面对陌生环境，主动提问比假装明白更有帮助。","examplePinyin":"Miànduì mòshēng huánjìng, zhǔdòng tíwèn bǐ jiǎzhuāng míngbai gèng yǒu bāngzhù.","translation":"낯선 환경에서는 아는 척하기보다 적극적으로 묻는 것이 도움이 돼요."},{"no":1347,"category":"성질·상태·문법","word":"平","pinyin":"píng","meaning":"평평하다, 평화롭다","example":"地面不平，会给轮椅使用者带来额外困难。","examplePinyin":"Dìmiàn bùpíng, huì gěi lúnyǐ shǐyòngzhě dàilái éwài kùnnan.","translation":"바닥이 고르지 않으면 휠체어 이용자가 더 불편해져요."},{"no":1348,"category":"성질·상태·문법","word":"平衡","pinyin":"pínghéng","meaning":"균형이 맞다,균형을 맞추다","example":"城市发展应在经济效益与环境保护之间寻求平衡。","examplePinyin":"Chéngshì fāzhǎn yīng zài jīngjì xiàoyì yǔ huánjìng bǎohù zhījiān xúnqiú pínghéng.","translation":"도시 발전은 경제적 효과와 환경 보호 사이의 균형을 찾아야 해요."},{"no":1349,"category":"성질·상태·문법","word":"平静","pinyin":"píngjìng","meaning":"평온하다, 조용하다,차분하다","example":"面对突发问题，她先让自己平静下来再作决定。","examplePinyin":"Miànduì tūfā wèntí, tā xiān ràng zìjǐ píngjìng xiàlai zài zuò juédìng.","translation":"갑작스러운 문제에 그녀는 우선 침착함을 되찾고 결정했어요."},{"no":1350,"category":"성질·상태·문법","word":"齐","pinyin":"qí","meaning":"가지런하다, 모두","example":"材料准备齐了，团队才开始集中讨论具体细节。","examplePinyin":"Cáiliào zhǔnbèi qí le, tuánduì cái kāishǐ jízhōng tǎolùn jùtǐ xìjié.","translation":"자료가 다 준비된 뒤에야 팀이 구체적인 세부 사항을 논의했어요."},{"no":1351,"category":"성질·상태·문법","word":"浅","pinyin":"qiǎn","meaning":"얕다, 옅다","example":"对问题的认识太浅，往往会导致简单化的判断。","examplePinyin":"Duì wèntí de rènshi tàiqiǎn, wǎngwǎng huì dǎozhì jiǎndānhuà de pànduàn.","translation":"문제에 대한 이해가 너무 얕으면 단순화된 판단을 하기 쉬워요."},{"no":1352,"category":"성질·상태·문법","word":"青","pinyin":"qīng","meaning":"푸르다","example":"春雨过后，山脚下的草地一天比一天青。","examplePinyin":"Chūnyǔ guòhòu, shānjiǎoxià de cǎodì yì tiān bǐ yì tiān qīng.","translation":"봄비가 온 뒤 산 아래 풀밭은 날마다 더 푸르러져요."},{"no":1353,"category":"성질·상태·문법","word":"全新","pinyin":"quánxīn","meaning":"완전히 새로운, 신형","example":"团队采用全新的方法，重新分析了已有数据。","examplePinyin":"Tuánduì cǎiyòng quánxīn de fāngfǎ, chóngxīn fēnxī le yǐyǒu shùjù.","translation":"팀은 완전히 새로운 방법으로 기존 자료를 다시 분석했어요."},{"no":1354,"category":"성질·상태·문법","word":"缺乏","pinyin":"quēfá","meaning":"부족하다, 결핍하다","example":"缺乏沟通，容易使原本简单的问题变得复杂。","examplePinyin":"Quēfá gōutōng, róngyì shǐ yuánběn jiǎndān de wèntí biànde fùzá.","translation":"소통이 부족하면 단순한 문제도 복잡해지기 쉬워요."},{"no":1355,"category":"성질·상태·문법","word":"软","pinyin":"ruǎn","meaning":"부드럽다, 연하다","example":"这种材料摸起来软，却具有较好的支撑能力。","examplePinyin":"Zhè zhǒng cáiliào mōqǐlai ruǎn, què jùyǒu jiào hǎo de zhīchēng nénglì.","translation":"이 소재는 만지면 부드럽지만 지지력은 비교적 좋아요."},{"no":1356,"category":"성질·상태·문법","word":"神秘","pinyin":"shénmì","meaning":"신비하다, 신기","example":"随着考古发现增加，这座古城不再那么神秘。","examplePinyin":"Suízhe kǎogǔ fāxiàn zēngjiā, zhè zuò gǔchéng búzài nàme shénmì.","translation":"고고학적 발견이 늘면서 이 고대 도시는 신비의 베일을 조금씩 벗었어요."},{"no":1357,"category":"성질·상태·문법","word":"湿","pinyin":"shī","meaning":"습하다, 젖다","example":"衣物还没干透就收起来，容易因潮湿产生异味。","examplePinyin":"Yīwù hái méi gāntòu jiù shōu qǐlai, róngyì yīn cháoshī chǎnshēng yìwèi.","translation":"옷이 덜 마른 채로 개어 두면 습기 때문에 냄새가 나기 쉬워요."},{"no":1358,"category":"성질·상태·문법","word":"顺","pinyin":"shùn","meaning":"순조롭다; 따르다, ~을 따라","example":"事情进展不顺时，更要检查方法是否合适。","examplePinyin":"Shìqing jìnzhǎn búshùn shí, gèng yào jiǎnchá fāngfǎ shìfǒu héshì.","translation":"일이 순조롭지 않을수록 방법이 적절한지 살펴야 해요."},{"no":1359,"category":"성질·상태·문법","word":"碎","pinyin":"suì","meaning":"부서지다, 조각나다","example":"瓶子碎了以后，要用工具收拾，避免直接用手捡。","examplePinyin":"Píngzi suì le yǐhòu, yào yòng gōngjù shōushi, bìmiǎn zhíjiē yòng shǒu jiǎn.","translation":"병이 깨지면 손으로 직접 줍지 말고 도구로 치워야 해요."},{"no":1360,"category":"성질·상태·문법","word":"特色","pinyin":"tèsè","meaning":"특색, 특징","example":"城市更新不能只求整齐，也要保留地方特色。","examplePinyin":"Chéngshì gēngxīn bùnéng zhǐ qiú zhěngqí, yě yào bǎoliú dìfāng tèsè.","translation":"도시 정비는 정돈만 추구하지 말고 지역 특색도 남겨야 해요."},{"no":1361,"category":"성질·상태·문법","word":"特殊","pinyin":"tèshū","meaning":"특별하다, 특별","example":"统一规则之外，也应为特殊情况保留合理空间。","examplePinyin":"Tǒngyī guīzé zhīwài, yě yīng wèi tèshū qíngkuàng bǎoliú hélǐ kōngjiān.","translation":"통일 규칙 외에 특수한 상황을 고려할 합리적인 여지도 필요해요."},{"no":1362,"category":"성질·상태·문법","word":"特有","pinyin":"tèyǒu","meaning":"특유하다, 고유","example":"这种植物是该地区特有的，需要重点保护。","examplePinyin":"Zhè zhǒng zhíwù shì gāi dìqū tèyǒu de, xūyào zhòngdiǎn bǎohù.","translation":"이 식물은 해당 지역 고유종이라 중점적인 보호가 필요해요."},{"no":1363,"category":"성질·상태·문법","word":"特征","pinyin":"tèzhēng","meaning":"특징, 특성","example":"观察外部特征，可以帮助研究者初步区分物种。","examplePinyin":"Guānchá wàibù tèzhēng, kěyǐ bāngzhù yánjiūzhě chūbù qūfēn wùzhǒng.","translation":"외부 특징을 관찰하면 연구자가 종을 일차적으로 구분할 수 있어요."},{"no":1364,"category":"성질·상태·문법","word":"同一","pinyin":"tóngyī","meaning":"동일하다, 똑같다","example":"同一项政策，对不同群体可能产生不同影响。","examplePinyin":"Tóngyī xiàng zhèngcè, duì bùtóng qúntǐ kěnéng chǎnshēng bùtóng yǐngxiǎng.","translation":"동일한 정책도 집단에 따라 다른 영향을 줄 수 있어요."},{"no":1365,"category":"성질·상태·문법","word":"外观","pinyin":"wàiguān","meaning":"외관, 겉모양","example":"评价产品不能只看外观，还要测试实际性能。","examplePinyin":"Píngjià chǎnpǐn bùnéng zhǐ kàn wàiguān, hái yào cèshì shíjì xìngnéng.","translation":"제품은 외관만으로 평가하지 말고 실제 성능도 시험해야 해요."},{"no":1366,"category":"성질·상태·문법","word":"外形","pinyin":"wàixíng","meaning":"외형, 겉모양","example":"外形相似的植物，未必具有相同的用途。","examplePinyin":"Wàixíng xiāngsì de zhíwù, wèibì jùyǒu xiāngtóng de yòngtú.","translation":"겉모양이 비슷한 식물도 용도가 같지는 않을 수 있어요."},{"no":1367,"category":"성질·상태·문법","word":"弯","pinyin":"wān","meaning":"구부러지다, 굽다","example":"这段山路弯很多，司机提前降低了车速。","examplePinyin":"Zhè duàn shānlù wān hěn duō, sījī tíqián jiàngdī le chēsù.","translation":"이 산길은 굽이가 많아 운전자가 미리 속도를 낮췄어요."},{"no":1368,"category":"성질·상태·문법","word":"完整","pinyin":"wánzhěng","meaning":"완전하다, 전체","example":"完整保存原始记录，有利于后续核查研究结果。","examplePinyin":"Wánzhěng bǎocún yuánshǐ jìlù, yǒulìyú hòuxù héchá yánjiū jiéguǒ.","translation":"원기록을 완전하게 보관하면 나중에 연구 결과를 확인하기 쉬워요."},{"no":1369,"category":"성질·상태·문법","word":"稳定","pinyin":"wěndìng","meaning":"안정적, 안정","example":"稳定的合作关系，需要双方持续投入时间与信任。","examplePinyin":"Wěndìng de hézuò guānxi, xūyào shuāngfāng chíxù tóurù shíjiān yǔ xìnrèn.","translation":"안정적인 협력 관계에는 양측의 꾸준한 시간과 신뢰가 필요해요."},{"no":1370,"category":"성질·상태·문법","word":"温暖","pinyin":"wēnnuǎn","meaning":"따뜻하다, 온난","example":"邻居们主动伸出援手，让刚搬来的他感到温暖。","examplePinyin":"Línjūmen zhǔdòng shēnchū yuánshǒu, ràng gāng bān lái de tā gǎndào wēnnuǎn.","translation":"이웃들이 먼저 도움을 내밀어 새로 이사 온 그는 따뜻함을 느꼈어요."},{"no":1371,"category":"성질·상태·문법","word":"无关","pinyin":"wúguān","meaning":"관계 없다, 무관","example":"讨论方案时，应避免加入与主题无关的个人评价。","examplePinyin":"Tǎolùn fāng'àn shí, yīng bìmiǎn jiārù yǔ zhǔtí wúguān de gèrén píngjià.","translation":"방안을 논의할 때는 주제와 관계없는 인물 평가를 피해야 해요."},{"no":1372,"category":"성질·상태·문법","word":"五颜六色","pinyin":"wǔyán-liùsè","meaning":"다채롭다, 오색찬란","example":"雨后的花园五颜六色，吸引了不少前来写生的人。","examplePinyin":"Yǔ hòu de huāyuán wǔyánliùsè, xīyǐn le bùshǎo qiánlái xiěshēng de rén.","translation":"비 온 뒤 정원이 알록달록해 사생하러 온 사람들을 끌었어요."},{"no":1373,"category":"성질·상태·문법","word":"闲","pinyin":"xián","meaning":"한가하다, 여가","example":"忙的时候要安排重点，闲的时候可以提前做准备。","examplePinyin":"Máng de shíhou yào ānpái zhòngdiǎn, xián de shíhou kěyǐ tíqián zuò zhǔnbèi.","translation":"바쁠 때는 우선순위를 정하고 한가할 때는 미리 준비할 수 있어요."},{"no":1374,"category":"성질·상태·문법","word":"显得","pinyin":"xiǎnde","meaning":"~하게 보이다, ~함이 드러나다","example":"重新调整照明以后，原本狭小的房间显得宽敞了。","examplePinyin":"Chóngxīn tiáozhěng zhàomíng yǐhòu, yuánběn xiáxiǎo de fángjiān xiǎnde kuānchang le.","translation":"조명을 바꾸자 원래 좁던 방이 넓어 보였어요."},{"no":1375,"category":"성질·상태·문법","word":"相对","pinyin":"xiāngduì","meaning":"상대적이다; 마주하다","example":"与中心城区相比，这里的住房成本相对较低。","examplePinyin":"Yǔ zhōngxīn chéngqū xiāngbǐ, zhèlǐ de zhùfáng chéngběn xiāngduì jiào dī.","translation":"도심과 비교하면 이곳의 주거비는 상대적으로 낮아요."},{"no":1376,"category":"성질·상태·문법","word":"相关","pinyin":"xiāngguān","meaning":"관련되다, 관계","example":"与项目相关的信息，都应通过正式渠道公开。","examplePinyin":"Yǔ xiàngmù xiāngguān de xìnxī, dōu yīng tōngguò zhèngshì qúdào gōngkāi.","translation":"사업 관련 정보는 모두 정식 경로로 공개해야 해요."},{"no":1377,"category":"성질·상태·문법","word":"相似","pinyin":"xiāngsì","meaning":"유사하다, 비슷하다","example":"外表相似，不代表两种材料具有相同性质。","examplePinyin":"Wàibiǎo xiāngsì, bú dàibiǎo liǎng zhǒng cáiliào jùyǒu xiāngtóng xìngzhì.","translation":"겉모양이 비슷하다고 두 소재의 성질이 같은 것은 아니에요."},{"no":1378,"category":"성질·상태·문법","word":"小型","pinyin":"xiǎoxíng","meaning":"소형, 작은","example":"小型企业资源有限，更需要明确自身优势。","examplePinyin":"Xiǎoxíng qǐyè zīyuán yǒuxiàn, gèng xūyào míngquè zìshēn yōushì.","translation":"소기업은 자원이 한정돼 있어 자신의 강점을 더 분명히 알아야 해요."},{"no":1379,"category":"성질·상태·문법","word":"斜","pinyin":"xié","meaning":"비스듬하다, 경사","example":"照片里的建筑有些斜，需要调整拍摄角度。","examplePinyin":"Zhàopiàn lǐ de jiànzhù yǒuxiē xié, xūyào tiáozhěng pāishè jiǎodù.","translation":"사진 속 건물이 조금 기울어 촬영 각도를 조정해야 해요."},{"no":1380,"category":"성질·상태·문법","word":"细节","pinyin":"xìjié","meaning":"세부, 상세","example":"细节处理是否周到，往往决定实际使用体验。","examplePinyin":"Xìjié chǔlǐ shìfǒu zhōudào, wǎngwǎng juédìng shíjì shǐyòng tǐyàn.","translation":"세부 처리가 세심한지에 따라 실제 사용 경험이 달라져요."},{"no":1381,"category":"성질·상태·문법","word":"形式","pinyin":"xíngshì","meaning":"형태, 형식","example":"活动形式可以变化，但核心目标应保持清楚。","examplePinyin":"Huódòng xíngshì kěyǐ biànhuà, dàn héxīn mùbiāo yīng bǎochí qīngchu.","translation":"행사의 형식은 바뀌어도 핵심 목표는 분명해야 해요."},{"no":1382,"category":"성질·상태·문법","word":"性质","pinyin":"xìngzhì","meaning":"성질, 특성","example":"不同性质的问题，需要采用不同的处理方法。","examplePinyin":"Bùtóng xìngzhì de wèntí, xūyào cǎiyòng bùtóng de chǔlǐ fāngfǎ.","translation":"성질이 다른 문제는 처리 방법도 달라야 해요."},{"no":1383,"category":"성질·상태·문법","word":"形状","pinyin":"xíngzhuàng","meaning":"형태, 모양","example":"包装形状改变以后，运输时可以节省更多空间。","examplePinyin":"Bāozhuāng xíngzhuàng gǎibiàn yǐhòu, yùnshū shí kěyǐ jiéshěng gèng duō kōngjiān.","translation":"포장 모양을 바꾸니 운송 공간을 더 아낄 수 있게 됐어요."},{"no":1384,"category":"성질·상태·문법","word":"新型","pinyin":"xīnxíng","meaning":"신형, 새로운 유형","example":"新型材料投入使用前，需要经过严格检测。","examplePinyin":"Xīnxíng cáiliào tóurù shǐyòng qián, xūyào jīngguò yángé jiǎncè.","translation":"신형 소재는 사용 전에 엄격한 검사를 거쳐야 해요."},{"no":1385,"category":"성질·상태·문법","word":"迅速","pinyin":"xùnsù","meaning":"신속하다, 빠르다","example":"信息传播迅速，更要求发布者认真核实内容。","examplePinyin":"Xìnxī chuánbō xùnsù, gèng yāoqiú fābùzhě rènzhēn héshí nèiróng.","translation":"정보가 빨리 퍼지는 만큼 게시자는 내용을 잘 확인해야 해요."},{"no":1386,"category":"성질·상태·문법","word":"硬","pinyin":"yìng","meaning":"단단하다, 뻣뻣하다","example":"这种材料虽然硬，却不适合承受反复弯折。","examplePinyin":"Zhè zhǒng cáiliào suīrán yìng, què bú shìhé chéngshòu fǎnfù wānzhé.","translation":"이 소재는 단단하지만 반복해서 굽히는 힘을 견디는 데는 맞지 않아요."},{"no":1387,"category":"성질·상태·문법","word":"一致","pinyin":"yízhì","meaning":"일치하다, 동일하다","example":"讨论可以存在分歧，但执行目标需要保持一致。","examplePinyin":"Tǎolùn kěyǐ cúnzài fēnqí, dàn zhíxíng mùbiāo xūyào bǎochí yízhì.","translation":"논의에는 이견이 있어도 실행 목표는 일치해야 해요."},{"no":1388,"category":"성질·상태·문법","word":"有害","pinyin":"yǒuhài","meaning":"해롭다, 유해하다","example":"过高的噪声不仅令人烦躁，也可能有害健康。","examplePinyin":"Guò gāo de zàoshēng bùjǐn lìngrén fánzào, yě kěnéng yǒuhài jiànkāng.","translation":"지나친 소음은 짜증을 일으키고 건강에도 해로울 수 있어요."},{"no":1389,"category":"성질·상태·문법","word":"悠久","pinyin":"yōujiǔ","meaning":"유구하다, 오래다","example":"这座古城历史悠久，但居民生活仍在不断变化。","examplePinyin":"Zhè zuò gǔchéng lìshǐ yōujiǔ, dàn jūmín shēnghuó réng zài búduàn biànhuà.","translation":"이 고도는 역사가 오래됐지만 주민들의 삶은 계속 바뀌고 있어요."},{"no":1390,"category":"성질·상태·문법","word":"圆","pinyin":"yuán","meaning":"둥글다, 원형","example":"设计师把桌角做成圆的，以减少碰伤的风险。","examplePinyin":"Shèjìshī bǎ zhuō jiǎo zuòchéng yuán de, yǐ jiǎnshǎo pèngshāng de fēngxiǎn.","translation":"디자이너는 부딪쳐 다칠 위험을 줄이려고 책상 모서리를 둥글게 만들었어요."},{"no":1391,"category":"성질·상태·문법","word":"糟","pinyin":"zāo","meaning":"나쁘다, 엉망이다","example":"天气突然变糟，队长决定停止继续前进。","examplePinyin":"Tiānqì tūrán biàn zāo, duìzhǎng juédìng tíngzhǐ jìxù qiánjìn.","translation":"날씨가 갑자기 나빠져 대장은 더 나아가지 않기로 했어요."},{"no":1392,"category":"성질·상태·문법","word":"窄","pinyin":"zhǎi","meaning":"좁다, 폭이 좁다","example":"巷子太窄，大型车辆无法直接开到施工地点。","examplePinyin":"Xiàngzi tài zhǎi, dàxíng chēliàng wúfǎ zhíjiē kāi dào shīgōng dìdiǎn.","translation":"골목이 너무 좁아 대형 차량이 공사 지점까지 바로 갈 수 없어요."},{"no":1393,"category":"성질·상태·문법","word":"整齐","pinyin":"zhěngqí","meaning":"가지런하다, 정돈되다","example":"物品摆放整齐以后，工作区域看起来清爽多了。","examplePinyin":"Wùpǐn bǎifàng zhěngqí yǐhòu, gōngzuò qūyù kànqǐlai qīngshuǎng duō le.","translation":"물건을 가지런히 놓으니 작업 공간이 훨씬 깔끔해 보였어요."},{"no":1394,"category":"성질·상태·문법","word":"真实","pinyin":"zhēnshí","meaning":"진실하다, 진짜","example":"纪录片通过长期跟拍，呈现了人物真实的处境。","examplePinyin":"Jìlùpiàn tōngguò chángqī gēn pāi, chéngxiàn le rénwù zhēnshí de chǔjìng.","translation":"다큐멘터리는 장기 밀착 촬영으로 인물의 실제 상황을 보여 줬어요."},{"no":1395,"category":"성질·상태·문법","word":"直","pinyin":"zhí","meaning":"곧다; 곧바로, 직접","example":"这条路看着直，实际仍有需要减速的转弯。","examplePinyin":"Zhè tiáo lù kànzhe zhí, shíjì réng yǒu xūyào jiǎnsù de zhuǎnwān.","translation":"이 길은 곧아 보여도 실제로는 감속해야 할 굽이가 있어요."},{"no":1396,"category":"성질·상태·문법","word":"状况","pinyin":"zhuàngkuàng","meaning":"상황, 형편","example":"根据道路状况，司机决定改走更安全的路线。","examplePinyin":"Gēnjù dàolù zhuàngkuàng, sījī juédìng gǎi zǒu gèng ānquán de lùxiàn.","translation":"운전자는 도로 상황을 보고 더 안전한 길로 바꿨어요."},{"no":1397,"category":"성질·상태·문법","word":"状态","pinyin":"zhuàngtài","meaning":"상태, 조건","example":"设备长期处于高负荷状态，需要加强检查。","examplePinyin":"Shèbèi chángqī chǔyú gāo fùhè zhuàngtài, xūyào jiāqiáng jiǎnchá.","translation":"장비가 오래 과부하 상태에 있어 점검을 강화해야 해요."},{"no":1398,"category":"성질·상태·문법","word":"紫","pinyin":"zǐ","meaning":"보라색, 자색","example":"天色渐暗，远处的山影慢慢呈现出淡紫的颜色。","examplePinyin":"Tiānsè jiàn'àn, yuǎnchù de shānyǐng mànmàn chéngxiànchū dànzǐ de yánsè.","translation":"날이 어두워지자 먼 산 그림자가 연한 보랏빛을 띠었어요."},{"no":1399,"category":"성질·상태·문법","word":"组成","pinyin":"zǔchéng","meaning":"구성하다, 이루다","example":"这支团队由不同专业背景的年轻人组成。","examplePinyin":"Zhè zhī tuánduì yóu bùtóng zhuānyè bèijǐng de niánqīngrén zǔchéng.","translation":"이 팀은 전공 배경이 다양한 젊은이들로 구성돼 있어요."},{"no":1400,"category":"성질·상태·문법","word":"本领","pinyin":"běnlǐng","meaning":"능력, 재주","example":"真正的本领，要在解决实际问题的过程中培养。","examplePinyin":"Zhēnzhèng de běnlǐng, yào zài jiějué shíjì wèntí de guòchéng zhōng péiyǎng.","translation":"진정한 실력은 실제 문제를 해결하는 과정에서 길러야 해요."},{"no":1401,"category":"성질·상태·문법","word":"长处","pinyin":"chángchù","meaning":"장점, 좋은 점","example":"合理分工，才能使每个人的长处得到发挥。","examplePinyin":"Hélǐ fēngōng, cái néng shǐ měi ge rén de chángchù dédào fāhuī.","translation":"업무를 합리적으로 나눠야 각자의 장점이 발휘될 수 있어요."},{"no":1402,"category":"성질·상태·문법","word":"成熟","pinyin":"chéngshú","meaning":"성숙하다, 익다","example":"成熟的管理者，能够在压力之下听取不同意见。","examplePinyin":"Chéngshú de guǎnlǐzhě, nénggòu zài yālì zhīxià tīngqǔ bùtóng yìjiàn.","translation":"성숙한 관리자는 압박 속에서도 다른 의견을 들을 수 있어요."},{"no":1403,"category":"성질·상태·문법","word":"大胆","pinyin":"dàdǎn","meaning":"대담하다, 용감하다","example":"在证据充分的基础上，他大胆提出了新的解释。","examplePinyin":"Zài zhèngjù chōngfèn de jīchǔ shàng, tā dàdǎn tíchū le xīn de jiěshì.","translation":"충분한 증거를 바탕으로 그는 과감히 새로운 해석을 제시했어요."},{"no":1404,"category":"성질·상태·문법","word":"胆小","pinyin":"dǎnxiǎo","meaning":"겁이 많다, 소심하다","example":"他小时候胆小，如今却能独自在台上演讲。","examplePinyin":"Tā xiǎoshíhou dǎnxiǎo, rújīn què néng dúzì zài táishàng yǎnjiǎng.","translation":"어릴 때 겁이 많았던 그가 이제 혼자 무대에서 연설해요."},{"no":1405,"category":"성질·상태·문법","word":"短处","pinyin":"duǎnchù","meaning":"단점, 결점","example":"承认自己的短处，才能有针对性地提高能力。","examplePinyin":"Chéngrèn zìjǐ de duǎnchù, cái néng yǒu zhēnduìxìng de tígāo nénglì.","translation":"자신의 단점을 인정해야 그에 맞춰 능력을 높일 수 있어요."},{"no":1406,"category":"성질·상태·문법","word":"独立","pinyin":"dúlì","meaning":"독립하다, 독립","example":"培养独立思考的能力，比记住结论更重要。","examplePinyin":"Péiyǎng dúlì sīkǎo de nénglì, bǐ jìzhù jiélùn gèng zhòngyào.","translation":"결론을 외우는 것보다 독립적으로 생각하는 능력을 기르는 게 중요해요."},{"no":1407,"category":"성질·상태·문법","word":"富有","pinyin":"fùyǒu","meaning":"부유하다; ~이 풍부하다, ~을 지니다","example":"这份研究报告富有启发性，提出了新的思路。","examplePinyin":"Zhè fèn yánjiū bàogào fùyǒu qǐfāxìng, tíchū le xīn de sīlù.","translation":"이 연구 보고서는 시사점이 풍부하고 새로운 관점을 제시해요."},{"no":1408,"category":"성질·상태·문법","word":"个性","pinyin":"gèxìng","meaning":"개성, 성격","example":"统一着装，并不意味着每个人都要失去个性。","examplePinyin":"Tǒngyī zhuózhuāng, bìng bú yìwèizhe měi ge rén dōu yào shīqù gèxìng.","translation":"복장을 통일한다고 각자의 개성을 잃어야 하는 것은 아니에요."},{"no":1409,"category":"성질·상태·문법","word":"好","pinyin":"hào","meaning":"좋아하다, 즐기다","example":"他从小好学，遇到不懂的问题总要问个明白。","examplePinyin":"Tā cóngxiǎo hàoxué, yùdào bù dǒng de wèntí zǒng yào wèn ge míngbai.","translation":"그는 어릴 때부터 배우기를 좋아해 모르면 꼭 물어 분명히 이해해요."},{"no":1410,"category":"성질·상태·문법","word":"讲究","pinyin":"jiǎngjiu","meaning":"중시하다, 신경 쓰다; 세련되다","example":"这家小店不讲究豪华装修，更重视食材品质。","examplePinyin":"Zhè jiā xiǎodiàn bù jiǎngjiu háohuá zhuāngxiū, gèng zhòngshì shí cái pǐnzhì.","translation":"이 작은 가게는 호화로운 실내 장식보다 재료의 질을 중시해요."},{"no":1411,"category":"성질·상태·문법","word":"坚强","pinyin":"jiānqiáng","meaning":"강인하다, 굳세다","example":"坚强不是从不难过，而是难过以后仍愿意前行。","examplePinyin":"Jiānqiáng búshì cóngbù nánguò, érshì nánguò yǐhòu réng yuànyì qiánxíng.","translation":"강인함이란 슬퍼하지 않는 게 아니라 슬픈 뒤에도 나아가려는 것이에요."},{"no":1412,"category":"성질·상태·문법","word":"谨慎","pinyin":"jǐnshèn","meaning":"신중하다, 조심하다","example":"面对不熟悉的投资项目，他始终保持谨慎。","examplePinyin":"Miànduì bù shúxī de tóuzī xiàngmù, tā shǐzhōng bǎochí jǐnshèn.","translation":"익숙하지 않은 투자 사업에 대해 그는 늘 신중한 태도를 유지해요."},{"no":1413,"category":"성질·상태·문법","word":"客观","pinyin":"kèguān","meaning":"객관적, 객관","example":"评价一个人的工作，要尽可能依据客观事实。","examplePinyin":"Píngjià yí ge rén de gōngzuò, yào jǐnkěnéng yījù kèguān shìshí.","translation":"다른 사람의 일을 평가할 때는 최대한 객관적 사실에 근거해야 해요."},{"no":1414,"category":"성질·상태·문법","word":"乐观","pinyin":"lèguān","meaning":"낙관적, 명랑","example":"保持乐观，并不意味着对现实困难视而不见。","examplePinyin":"Bǎochí lèguān, bìng bú yìwèizhe duì xiànshí kùnnan shì ér bújiàn.","translation":"낙관적이라고 현실의 어려움을 외면하는 것은 아니에요."},{"no":1415,"category":"성질·상태·문법","word":"灵活","pinyin":"línghuó","meaning":"융통성 있다, 유연하다","example":"遇到突发情况，应在遵守原则的前提下灵活处理。","examplePinyin":"Yùdào tūfā qíngkuàng, yīng zài zūnshǒu yuánzé de qiántí xià línghuó chǔlǐ.","translation":"돌발 상황은 원칙을 지키면서 유연하게 처리해야 해요."},{"no":1416,"category":"성질·상태·문법","word":"敏感","pinyin":"mǐngǎn","meaning":"민감하다, 예민하다","example":"有些植物对温度变化敏感，需要稳定的生长环境。","examplePinyin":"Yǒuxiē zhíwù duì wēndù biànhuà mǐngǎn, xūyào wěndìng de shēngzhǎng huánjìng.","translation":"일부 식물은 온도 변화에 민감해 안정된 생육 환경이 필요해요."},{"no":1417,"category":"성질·상태·문법","word":"能干","pinyin":"nénggàn","meaning":"유능하다, 뛰어나다","example":"她办事能干，却从不把功劳都算在自己身上。","examplePinyin":"Tā bànshì nénggàn, què cóngbù bǎ gōngláo dōu suàn zài zìjǐ shēnshang.","translation":"그녀는 유능하지만 공을 모두 자신에게 돌리지는 않아요."},{"no":1418,"category":"성질·상태·문법","word":"强大","pinyin":"qiángdà","meaning":"강대하다, 막강하다","example":"强大的团队，不是每个人都一样，而是能够互补。","examplePinyin":"Qiángdà de tuánduì, búshì měi ge rén dōu yíyàng, érshì nénggòu hùbǔ.","translation":"강한 팀은 구성원 모두가 똑같은 팀이 아니라 서로 보완하는 팀이에요."},{"no":1419,"category":"성질·상태·문법","word":"勤奋","pinyin":"qínfèn","meaning":"근면하다, 부지런하다","example":"勤奋需要配合正确方法，才能取得稳定进步。","examplePinyin":"Qínfèn xūyào pèihé zhèngquè fāngfǎ, cái néng qǔdé wěndìng jìnbù.","translation":"근면함에 올바른 방법을 더해야 꾸준히 발전할 수 있어요."},{"no":1420,"category":"성질·상태·문법","word":"亲切","pinyin":"qīnqiè","meaning":"다정하다, 친절하다","example":"她的讲解亲切自然，让复杂的知识也容易理解。","examplePinyin":"Tā de jiǎngjiě qīnqiè zìrán, ràng fùzá de zhīshi yě róngyì lǐjiě.","translation":"그녀는 다정하고 자연스럽게 설명해 복잡한 지식도 이해하기 쉬워요."},{"no":1421,"category":"성질·상태·문법","word":"热心","pinyin":"rèxīn","meaning":"열성적이다; 기꺼이 돕다, 친절하다","example":"热心居民主动整理信息，帮助新住户熟悉社区。","examplePinyin":"Rèxīn jūmín zhǔdòng zhěnglǐ xìnxī, bāngzhù xīn zhùhù shúxī shèqū.","translation":"친절한 주민들이 정보를 모아 새 이웃이 동네에 익숙해지도록 도와요."},{"no":1422,"category":"성질·상태·문법","word":"弱","pinyin":"ruò","meaning":"약하다, 연약하다","example":"信号较弱时，可以先移动到开阔的地方。","examplePinyin":"Xìnhào jiàoruò shí, kěyǐ xiān yídòng dào kāikuò de dìfang.","translation":"신호가 약할 때는 먼저 탁 트인 곳으로 이동해 보세요."},{"no":1423,"category":"성질·상태·문법","word":"傻","pinyin":"shǎ","meaning":"어리석다, 바보","example":"看似傻的办法，只要有效，也值得认真考虑。","examplePinyin":"Kànsì shǎ de bànfǎ, zhǐyào yǒuxiào, yě zhíde rènzhēn kǎolǜ.","translation":"어리석어 보이는 방법도 효과가 있다면 진지하게 고려할 만해요."},{"no":1424,"category":"성질·상태·문법","word":"擅长","pinyin":"shàncháng","meaning":"능숙하다, 잘하다","example":"他擅长把复杂的问题，解释得清楚又生动。","examplePinyin":"Tā shàncháng bǎ fùzá de wèntí, jiěshì de qīngchu yòu shēngdòng.","translation":"그는 복잡한 문제를 분명하고 생생하게 설명하는 데 능해요."},{"no":1425,"category":"성질·상태·문법","word":"善良","pinyin":"shànliáng","meaning":"착하다, 선량하다","example":"善良并不等于没有原则，帮助别人也要注意界限。","examplePinyin":"Shànliáng bìngbù děngyú méiyǒu yuánzé, bāngzhù biéren yě yào zhùyì jièxiàn.","translation":"선량함은 무원칙함이 아니며 남을 도울 때도 경계를 지켜야 해요."},{"no":1426,"category":"성질·상태·문법","word":"善于","pinyin":"shànyú","meaning":"잘하다, 능숙하다","example":"她善于从不同意见中，发现可以合作的部分。","examplePinyin":"Tā shànyú cóng bùtóng yìjiàn zhōng, fāxiàn kěyǐ hézuò de bùfen.","translation":"그녀는 다른 의견들에서도 협력할 수 있는 부분을 잘 찾아요."},{"no":1427,"category":"성질·상태·문법","word":"实力","pinyin":"shílì","meaning":"실력, 역량","example":"真正的实力，常常表现在应对意外情况的能力上。","examplePinyin":"Zhēnzhèng de shílì, chángcháng biǎoxiàn zài yìngduì yìwài qíngkuàng de nénglì shàng.","translation":"진정한 실력은 돌발 상황에 대응하는 능력에서 드러나곤 해요."},{"no":1428,"category":"성질·상태·문법","word":"熟练","pinyin":"shúliàn","meaning":"숙련되다, 능숙하다","example":"技能再熟练，操作前也不能省略安全检查。","examplePinyin":"Jìnéng zài shúliàn, cāozuò qián yě bùnéng shěnglüè ānquán jiǎnchá.","translation":"아무리 숙련됐더라도 작업 전 안전 점검을 생략하면 안 돼요."},{"no":1429,"category":"성질·상태·문법","word":"调皮","pinyin":"tiáopí","meaning":"말썽꾸러기, 장난꾸러기","example":"老师发现，调皮的孩子在动手实验时特别专注。","examplePinyin":"Lǎoshī fāxiàn, tiáopí de háizi zài dòngshǒu shíyàn shí tèbié zhuānzhù.","translation":"선생님은 장난꾸러기 아이가 직접 실험할 때 유독 집중한다는 걸 알았어요."},{"no":1430,"category":"성질·상태·문법","word":"消极","pinyin":"xiāojí","meaning":"소극적, 부정적","example":"面对问题保持消极态度，往往会错过改善机会。","examplePinyin":"Miànduì wèntí bǎochí xiāojí tàidu, wǎngwǎng huì cuòguò gǎishàn jīhuì.","translation":"문제에 소극적인 태도를 보이면 개선 기회를 놓치기 쉬워요."},{"no":1431,"category":"성질·상태·문법","word":"虚心","pinyin":"xūxīn","meaning":"겸손하다, 겸허","example":"越有经验的人，越需要虚心听取新的建议。","examplePinyin":"Yuè yǒu jīngyàn de rén, yuè xūyào xūxīn tīngqǔ xīn de jiànyì.","translation":"경험이 많을수록 새로운 조언을 겸허히 들어야 해요."},{"no":1432,"category":"성질·상태·문법","word":"严肃","pinyin":"yánsù","meaning":"엄격하다, 진지하다","example":"对待安全问题必须严肃，不能凭运气行事。","examplePinyin":"Duìdài ānquán wèntí bìxū yánsù, bùnéng píng yùnqi xíngshì.","translation":"안전 문제는 엄중히 다뤄야 하며 운에 맡겨서는 안 돼요."},{"no":1433,"category":"성질·상태·문법","word":"优势","pinyin":"yōushì","meaning":"강점, 우세","example":"了解自身优势，比盲目模仿别人更有意义。","examplePinyin":"Liǎojiě zìshēn yōushì, bǐ mángmù mófǎng biéren gèng yǒu yìyì.","translation":"남을 무작정 따라 하기보다 자신의 강점을 아는 게 더 의미 있어요."},{"no":1434,"category":"성질·상태·문법","word":"真诚","pinyin":"zhēnchéng","meaning":"진실하고 성실하다","example":"真诚的道歉，应包括对责任的承认和实际改进。","examplePinyin":"Zhēnchéng de dàoqiàn, yīng bāokuò duì zérèn de chéngrèn hé shíjì gǎijìn.","translation":"진정한 사과에는 책임 인정과 실제 개선이 포함돼야 해요."},{"no":1435,"category":"성질·상태·문법","word":"主动","pinyin":"zhǔdòng","meaning":"적극적, 능동적","example":"主动承认问题，往往能更早获得解决所需的支持。","examplePinyin":"Zhǔdòng chéngrèn wèntí, wǎngwǎng néng gèng zǎo huòdé jiějué suǒ xū de zhīchí.","translation":"문제를 먼저 인정하면 해결에 필요한 도움을 더 빨리 얻을 수 있어요."},{"no":1436,"category":"성질·상태·문법","word":"主观","pinyin":"zhǔguān","meaning":"주관적, 주관","example":"个人印象容易受主观经验影响，需要事实来核实。","examplePinyin":"Gèrén yìnxiàng róngyì shòu zhǔguān jīngyàn yǐngxiǎng, xūyào shìshí lái héshí.","translation":"개인적 인상은 주관적인 경험에 좌우되기 쉬워 사실 확인이 필요해요."},{"no":1437,"category":"성질·상태·문법","word":"宝贵","pinyin":"bǎoguì","meaning":"귀중하다, 소중하다","example":"比起奖品，这次实践带来的经验更加宝贵。","examplePinyin":"Bǐqǐ jiǎngpǐn, zhè cì shíjiàn dàilái de jīngyàn gèngjiā bǎoguì.","translation":"이번 실습에서 얻은 경험은 상으로 받은 물건보다 더 소중해요."},{"no":1438,"category":"성질·상태·문법","word":"便利","pinyin":"biànlì","meaning":"편리하다, 편의","example":"网上预约给患者带来了便利，也减少了排队。","examplePinyin":"Wǎngshàng yùyuē gěi huànzhě dàilái le biànlì, yě jiǎnshǎo le páiduì.","translation":"온라인 예약은 환자에게 편의를 주고 대기도 줄였어요."},{"no":1439,"category":"성질·상태·문법","word":"不符","pinyin":"bùfú","meaning":"일치하지 않다, 맞지 않다","example":"申请材料与实际情况不符，需要重新核实。","examplePinyin":"Shēnqǐng cáiliào yǔ shíjì qíngkuàng bùfú, xūyào chóngxīn héshí.","translation":"신청 자료가 실제 상황과 맞지 않아 다시 확인해야 해요."},{"no":1440,"category":"성질·상태·문법","word":"不利","pinyin":"búlì","meaning":"불리하다, 좋지 않다","example":"信息不对称，往往使消费者处于不利地位。","examplePinyin":"Xìnxī bú duìchèn, wǎngwǎng shǐ xiāofèizhě chǔyú búlì dìwèi.","translation":"정보 불균형은 소비자를 불리한 위치에 놓이게 하곤 해요."},{"no":1441,"category":"성질·상태·문법","word":"不要紧","pinyin":"búyàojǐn","meaning":"괜찮다, 문제없다","example":"第一次尝试失败不要紧，重要的是找出原因。","examplePinyin":"Dìyīcì chángshì shībài búyàojǐn, zhòngyào de shì zhǎochū yuányīn.","translation":"첫 시도의 실패는 괜찮아요. 원인을 찾는 것이 중요해요."},{"no":1442,"category":"성질·상태·문법","word":"成就","pinyin":"chéngjiù","meaning":"성취, 업적","example":"今天的成就，离不开前几代人的持续努力。","examplePinyin":"Jīntiān de chéngjiù, líbùkāi qián jǐ dài rén de chíxù nǔlì.","translation":"오늘날의 성취에는 앞선 세대의 꾸준한 노력이 밑바탕이 됐어요."},{"no":1443,"category":"성질·상태·문법","word":"出色","pinyin":"chūsè","meaning":"훌륭하다, 뛰어나다","example":"她不仅完成了任务，还表现出出色的协调能力。","examplePinyin":"Tā bùjǐn wánchéng le rènwu, hái biǎoxiàn chū chūsè de xiétiáo nénglì.","translation":"그녀는 임무를 마쳤을 뿐 아니라 뛰어난 조정 능력도 보였어요."},{"no":1444,"category":"성질·상태·문법","word":"动人","pinyin":"dòngrén","meaning":"감동적이다, 사람을 감동시키다","example":"影片最动人的部分，是陌生人之间朴素的善意。","examplePinyin":"Yǐngpiàn zuì dòngrén de bùfen, shì mòshēngrén zhījiān pǔsù de shànyì.","translation":"영화에서 가장 감동적인 부분은 낯선 이들 사이의 소박한 선의예요."},{"no":1445,"category":"성질·상태·문법","word":"高效","pinyin":"gāoxiào","meaning":"효율적, 고효율","example":"高效的会议应有明确议题，也应允许不同意见。","examplePinyin":"Gāoxiào de huìyì yīngyǒu míngquè yìtí, yě yīng yǔnxǔ bùtóng yìjiàn.","translation":"효율적인 회의에는 분명한 의제와 다양한 의견이 필요해요."},{"no":1446,"category":"성질·상태·문법","word":"公平","pinyin":"gōngpíng","meaning":"공평하다, 정당하다","example":"程序公平透明，才能让参与者接受最终结果。","examplePinyin":"Chéngxù gōngpíng tòumíng, cái néng ràng cānyùzhě jiēshòu zuìzhōng jiéguǒ.","translation":"절차가 공정하고 투명해야 참가자들이 최종 결과를 받아들일 수 있어요."},{"no":1447,"category":"성질·상태·문법","word":"好评","pinyin":"hǎopíng","meaning":"호평, 좋은 평가","example":"这家小店凭借可靠的品质，逐渐积累了好评。","examplePinyin":"Zhè jiā xiǎodiàn píngjiè kěkào de pǐnzhì, zhújiàn jīlěi le hǎopíng.","translation":"이 작은 가게는 믿을 만한 품질로 차츰 호평을 얻었어요."},{"no":1448,"category":"성질·상태·문법","word":"合理","pinyin":"hélǐ","meaning":"합리적이다, 이치에 맞다","example":"合理安排休息，有时比延长工作时间更有效。","examplePinyin":"Hélǐ ānpái xiūxi, yǒushí bǐ yáncháng gōngzuò shíjiān gèng yǒuxiào.","translation":"휴식을 합리적으로 배분하는 것이 근무 시간을 늘리는 것보다 효과적일 때도 있어요."},{"no":1449,"category":"성질·상태·문법","word":"可靠","pinyin":"kěkào","meaning":"신뢰할 수 있다, 믿을 만하다","example":"新闻报道应建立在可靠的消息来源之上。","examplePinyin":"Xīnwén bàodào yīng jiànlì zài kěkào de xiāoxi láiyuán zhīshàng.","translation":"보도는 믿을 만한 정보 출처에 기초해야 해요."},{"no":1450,"category":"성질·상태·문법","word":"良好","pinyin":"liánghǎo","meaning":"좋다, 양호하다","example":"良好的沟通习惯，有助于建立稳定的合作关系。","examplePinyin":"Liánghǎo de gōutōng xíguàn, yǒuzhùyú jiànlì wěndìng de hézuò guānxi.","translation":"좋은 소통 습관은 안정적인 협력 관계를 만드는 데 도움이 돼요."},{"no":1451,"category":"성질·상태·문법","word":"了不起","pinyin":"liǎobuqǐ","meaning":"훌륭하다, 대단하다","example":"在资源有限的情况下完成任务，确实很了不起。","examplePinyin":"Zài zīyuán yǒuxiàn de qíngkuàng xià wánchéng rènwu, quèshí hěn liǎobuqǐ.","translation":"자원이 한정된 상황에서 임무를 완수한 것은 정말 대단해요."},{"no":1452,"category":"성질·상태·문법","word":"魅力","pinyin":"mèilì","meaning":"매력","example":"小城的魅力，不在规模，而在生活细节中的温度。","examplePinyin":"Xiǎochéng de mèilì, búzài guīmó, ér zài shēnghuó xìjié zhōng de wēndù.","translation":"작은 도시의 매력은 규모가 아니라 생활 속 세심한 따뜻함에 있어요."},{"no":1453,"category":"성질·상태·문법","word":"难得","pinyin":"nándé","meaning":"드물다, 얻기 어렵다","example":"能听到真实的批评，是一件难得的好事。","examplePinyin":"Néng tīngdào zhēnshí de pīpíng, shì yí jiàn nándé de hǎoshì.","translation":"솔직한 비판을 들을 수 있는 것은 드문 좋은 기회예요."},{"no":1454,"category":"성질·상태·문법","word":"生动","pinyin":"shēngdòng","meaning":"생생하다, 생동감 있다","example":"老师通过生动的比喻，让学生理解复杂原理。","examplePinyin":"Lǎoshī tōngguò shēngdòng de bǐyù, ràng xuésheng lǐjiě fùzá yuánlǐ.","translation":"선생님은 생생한 비유로 복잡한 원리를 이해시켰어요."},{"no":1455,"category":"성질·상태·문법","word":"深刻","pinyin":"shēnkè","meaning":"깊다, 심오하다","example":"这次实地调查，让他对贫困问题有了深刻认识。","examplePinyin":"Zhè cì shídì diàochá, ràng tā duì pínkùn wèntí yǒu le shēnkè rènshi.","translation":"이번 현장 조사로 그는 빈곤 문제를 깊이 이해하게 됐어요."},{"no":1456,"category":"성질·상태·문법","word":"适当","pinyin":"shìdàng","meaning":"적당하다, 알맞다","example":"适当降低语速，能让初学者更容易听懂。","examplePinyin":"Shìdàng jiàngdī yǔsù, néng ràng chūxuézhě gèng róngyì tīngdǒng.","translation":"말의 속도를 적절히 낮추면 초보자가 더 쉽게 알아들어요."},{"no":1457,"category":"성질·상태·문법","word":"实用","pinyin":"shíyòng","meaning":"실용적, 실용","example":"看似简单的设计，有时比复杂功能更加实用。","examplePinyin":"Kànsì jiǎndān de shèjì, yǒushí bǐ fùzá gōngnéng gèngjiā shíyòng.","translation":"단순해 보이는 설계가 복잡한 기능보다 실용적일 때도 있어요."},{"no":1458,"category":"성질·상태·문법","word":"适用","pinyin":"shìyòng","meaning":"적용되다, 적합하다","example":"一地成功的经验，不一定适用于所有地区。","examplePinyin":"Yí dì chénggōng de jīngyàn, bùyídìng shìyòng yú suǒyǒu dìqū.","translation":"한 지역에서 성공한 경험이 모든 지역에 적용되지는 않아요."},{"no":1459,"category":"성질·상태·문법","word":"舒适","pinyin":"shūshì","meaning":"편안하다, 쾌적하다","example":"舒适的公共空间，应兼顾通风、照明和噪声控制。","examplePinyin":"Shūshì de gōnggòng kōngjiān, yīng jiāngù tōngfēng, zhàomíng hé zàoshēng kòngzhì.","translation":"쾌적한 공공 공간은 환기, 조명, 소음 조절을 함께 고려해야 해요."},{"no":1460,"category":"성질·상태·문법","word":"完美","pinyin":"wánměi","meaning":"완벽하다, 완전하다","example":"方案不必一开始就完美，但应保留改进空间。","examplePinyin":"Fāng'àn búbì yì kāishǐ jiù wánměi, dàn yīng bǎoliú gǎijìn kōngjiān.","translation":"방안은 처음부터 완벽할 필요는 없지만 개선할 여지가 있어야 해요."},{"no":1461,"category":"성질·상태·문법","word":"伟大","pinyin":"wěidà","meaning":"위대하다","example":"伟大的发现背后，往往有许多不起眼的基础工作。","examplePinyin":"Wěidà de fāxiàn bèihòu, wǎngwǎng yǒu xǔduō bùqǐyǎn de jīchǔ gōngzuò.","translation":"위대한 발견 뒤에는 눈에 띄지 않는 기초 작업이 많이 있어요."},{"no":1462,"category":"성질·상태·문법","word":"无效","pinyin":"wúxiào","meaning":"무효하다, 효력 없다","example":"未经授权的签字，可能导致相关协议无效。","examplePinyin":"Wèijīng shòuquán de qiānzì, kěnéng dǎozhì xiāngguān xiéyì wúxiào.","translation":"권한 없이 한 서명 때문에 해당 합의가 무효가 될 수 있어요."},{"no":1463,"category":"성질·상태·문법","word":"先进","pinyin":"xiānjìn","meaning":"선진적, 앞서다","example":"设备再先进，如果管理落后，也难以发挥作用。","examplePinyin":"Shèbèi zài xiānjìn, rúguǒ guǎnlǐ luòhòu, yě nányǐ fāhuī zuòyòng.","translation":"장비가 아무리 첨단이어도 관리가 뒤처지면 역할을 하기 어려워요."},{"no":1464,"category":"성질·상태·문법","word":"效率","pinyin":"xiàolǜ","meaning":"효율, 효율성","example":"真正的效率，不应以牺牲质量和健康为代价。","examplePinyin":"Zhēnzhèng de xiàolǜ, bù yīng yǐ xīshēng zhìliàng hé jiànkāng wéi dàijià.","translation":"진정한 효율이 품질과 건강을 희생해서 얻어져서는 안 돼요."},{"no":1465,"category":"성질·상태·문법","word":"有力","pinyin":"yǒulì","meaning":"유력하다, 힘이 있다","example":"现场记录为这次调查，提供了有力的证据。","examplePinyin":"Xiànchǎng jìlù wèi zhè cì diàochá, tígōng le yǒulì de zhèngjù.","translation":"현장 기록은 이번 조사에 유력한 증거를 제공했어요."},{"no":1466,"category":"성질·상태·문법","word":"有利","pinyin":"yǒulì","meaning":"유리하다, 이익이다","example":"适当竞争有利于创新，但规则必须公平。","examplePinyin":"Shìdàng jìngzhēng yǒulìyú chuàngxīn, dàn guīzé bìxū gōngpíng.","translation":"적절한 경쟁은 혁신에 유리하지만 규칙이 공정해야 해요."},{"no":1467,"category":"성질·상태·문법","word":"优良","pinyin":"yōuliáng","meaning":"우량하다, 훌륭하다","example":"优良的传统，需要通过当代实践继续传承。","examplePinyin":"Yōuliáng de chuántǒng, xūyào tōngguò dāngdài shíjiàn jìxù chuánchéng.","translation":"좋은 전통은 오늘날의 실천을 통해 계속 이어 가야 해요."},{"no":1468,"category":"성질·상태·문법","word":"优美","pinyin":"yōuměi","meaning":"우미하다, 아름답다","example":"这里环境优美，但公共服务仍有改进空间。","examplePinyin":"Zhèlǐ huánjìng yōuměi, dàn gōnggòng fúwù réng yǒu gǎijìn kōngjiān.","translation":"이곳은 환경이 아름답지만 공공 서비스는 더 개선할 여지가 있어요."},{"no":1469,"category":"성질·상태·문법","word":"有益","pinyin":"yǒuyì","meaning":"유익하다, 이익이 있다","example":"规律活动不仅有益身体，也能改善心情。","examplePinyin":"Guīlǜ huódòng bùjǐn yǒuyì shēntǐ, yě néng gǎishàn xīnqíng.","translation":"규칙적인 활동은 몸에 이롭고 기분도 개선할 수 있어요."},{"no":1470,"category":"성질·상태·문법","word":"优质","pinyin":"yōuzhì","meaning":"우수하다, 질이 좋다","example":"提供优质服务，关键在于稳定满足真实需求。","examplePinyin":"Tígōng yōuzhì fúwù, guānjiàn zàiyú wěndìng mǎnzú zhēnshí xūqiú.","translation":"질 좋은 서비스의 핵심은 실제 수요를 꾸준히 충족하는 것이에요."},{"no":1471,"category":"성질·상태·문법","word":"糟糕","pinyin":"zāogāo","meaning":"형편없다, 나쁘다","example":"即使情况糟糕，也应先弄清哪些问题能够解决。","examplePinyin":"Jíshǐ qíngkuàng zāogāo, yě yīng xiān nòngqīng nǎxiē wèntí nénggòu jiějué.","translation":"상황이 나빠도 우선 어떤 문제를 해결할 수 있는지 파악해야 해요."},{"no":1472,"category":"성질·상태·문법","word":"珍贵","pinyin":"zhēnguì","meaning":"귀중하다, 진귀하다","example":"这些珍贵的记录，保存了普通人对时代的记忆。","examplePinyin":"Zhèxiē zhēnguì de jìlù, bǎocún le pǔtōngrén duì shídài de jìyì.","translation":"이 귀중한 기록들은 시대에 대한 평범한 사람들의 기억을 간직해요."},{"no":1473,"category":"성질·상태·문법","word":"知名","pinyin":"zhīmíng","meaning":"유명하다, 저명","example":"知名品牌同样需要接受质量检查，不能享有例外。","examplePinyin":"Zhīmíng pǐnpái tóngyàng xūyào jiēshòu zhìliàng jiǎnchá, bùnéng xiǎngyǒu lìwài.","translation":"유명 브랜드도 예외 없이 품질 검사를 받아야 해요."},{"no":1474,"category":"성질·상태·문법","word":"最佳","pinyin":"zuìjiā","meaning":"가장 좋은, 최고","example":"最佳方案不一定最昂贵，而是最符合实际需求。","examplePinyin":"Zuìjiā fāng'àn bùyídìng zuì ángguì, érshì zuì fúhé shíjì xūqiú.","translation":"최선의 방안은 가장 비싼 것이 아니라 실제 수요에 가장 맞는 것이에요."},{"no":1475,"category":"성질·상태·문법","word":"包含","pinyin":"bāohán","meaning":"포함하다, 담다","example":"一句简单的问候，也可能包含深深的关心。","examplePinyin":"Yí jù jiǎndān de wènhòu, yě kěnéng bāohán shēnshēn de guānxīn.","translation":"간단한 안부 한마디에도 깊은 관심이 담길 수 있어요."},{"no":1476,"category":"성질·상태·문법","word":"包括","pinyin":"bāokuò","meaning":"포함하다, 포함시키다","example":"这次培训面向所有员工，也包括刚入职的新人。","examplePinyin":"Zhè cì péixùn miànxiàng suǒyǒu yuángōng, yě bāokuò gāng rù zhí de xīnrén.","translation":"이번 교육은 신입 사원을 포함한 모든 직원이 대상이에요."},{"no":1477,"category":"성질·상태·문법","word":"不得了","pinyin":"bùdéliǎo","meaning":"대단하다, 심하다; (정도가) 매우","example":"得知项目获奖的消息，大家高兴得不得了。","examplePinyin":"Dézhī xiàngmù huòjiǎng de xiāoxi, dàjiā gāoxìng de budéliǎo.","translation":"프로젝트가 상을 받았다는 소식에 모두 몹시 기뻐했어요."},{"no":1478,"category":"성질·상태·문법","word":"超","pinyin":"chāo","meaning":"초월하다, 넘다","example":"这次展览的参观人数超了预期，主办方增开夜场。","examplePinyin":"Zhè cì zhǎnlǎn de cānguān rénshù chāo le yùqī, zhǔbànfāng zēngkāi yèchǎng.","translation":"전시 관람객이 예상을 넘어 주최 측이 야간 관람을 추가했어요."},{"no":1479,"category":"성질·상태·문법","word":"超出","pinyin":"chāochū","meaning":"초과하다, 벗어나다","example":"实际费用超出预算，项目组不得不调整安排。","examplePinyin":"Shíjì fèiyòng chāochū yùsuàn, xiàngmùzǔ bùdébù tiáozhěng ānpái.","translation":"실제 비용이 예산을 초과해 사업팀이 일정을 조정해야 했어요."},{"no":1480,"category":"성질·상태·문법","word":"超级","pinyin":"chāojí","meaning":"최상급인,초특급인 ","example":"这个超级市场，专门设立了快过期食品的货架。","examplePinyin":"Zhè ge chāojí shìchǎng, zhuānmén shèlì le kuài guòqī shípǐn de huòjià.","translation":"이 슈퍼마켓은 기한이 임박한 식품의 전용 진열대를 마련했어요."},{"no":1481,"category":"성질·상태·문법","word":"彻底","pinyin":"chèdǐ","meaning":"철저하다, 완전히","example":"仅仅更换负责人，并不能彻底解决管理问题。","examplePinyin":"Jǐnjǐn gēnghuàn fùzérén, bìng bùnéng chèdǐ jiějué guǎnlǐ wèntí.","translation":"책임자만 바꿔서는 관리 문제를 완전히 해결할 수 없어요."},{"no":1482,"category":"성질·상태·문법","word":"程度","pinyin":"chéngdù","meaning":"정도, 수준","example":"交通改善的程度，可以从居民的通勤时间看出。","examplePinyin":"Jiāotōng gǎishàn de chéngdù, kěyǐ cóng jūmín de tōngqín shíjiān kànchū.","translation":"교통이 얼마나 개선됐는지는 주민의 통근 시간으로 알 수 있어요."},{"no":1483,"category":"성질·상태·문법","word":"充分","pinyin":"chōngfèn","meaning":"충분하다, 넉넉하다","example":"充分了解双方需求，才能找到合作的共同点。","examplePinyin":"Chōngfèn liǎojiě shuāngfāng xūqiú, cái néng zhǎodào hézuò de gòngtóngdiǎn.","translation":"양측의 요구를 충분히 알아야 협력의 공통점을 찾을 수 있어요."},{"no":1484,"category":"성질·상태·문법","word":"充足","pinyin":"chōngzú","meaning":"충분하다, 족하다","example":"只有准备充足，面对临时变化时才能更加从容。","examplePinyin":"Zhǐyǒu zhǔnbèi chōngzú, miànduì línshí biànhuà shí cái néng gèngjiā cóngróng.","translation":"충분히 준비해야 갑작스러운 변화에도 더 침착할 수 있어요."},{"no":1485,"category":"성질·상태·문법","word":"大多","pinyin":"dàduō","meaning":"대부분, 대개","example":"调查显示，大多受访者愿意为环保改变习惯。","examplePinyin":"Diàochá xiǎnshì, dàduō shòufǎngzhě yuànyì wèi huánbǎo gǎibiàn xíguàn.","translation":"조사에 따르면 응답자 대부분이 환경을 위해 습관을 바꿀 의향이 있어요."},{"no":1486,"category":"성질·상태·문법","word":"大力","pinyin":"dàlì","meaning":"크게, 대대적으로","example":"当地大力发展公共交通，鼓励居民减少自驾。","examplePinyin":"Dāngdì dàlì fāzhǎn gōnggòng jiāotōng, gǔlì jūmín jiǎnshǎo zìjià.","translation":"현지에서는 대중교통을 적극 발전시켜 자가용 이용을 줄이도록 해요."},{"no":1487,"category":"성질·상태·문법","word":"范围","pinyin":"fànwéi","meaning":"범위, 테두리","example":"在职责范围内，工作人员应主动帮助办事群众。","examplePinyin":"Zài zhízé fànwéi nèi, gōngzuò rényuán yīng zhǔdòng bāngzhù bànshì qúnzhòng.","translation":"담당자는 직무 범위 안에서 민원인을 적극 도와야 해요."},{"no":1488,"category":"성질·상태·문법","word":"高度","pinyin":"gāodù","meaning":"높이, 정도","example":"校方对实验室的安全管理给予了高度重视。","examplePinyin":"Xiàofāng duì shíyànshì de ānquán guǎnlǐ jǐyǔ le gāodù zhòngshì.","translation":"학교는 실험실 안전 관리를 매우 중요하게 여겼어요."},{"no":1489,"category":"성질·상태·문법","word":"个别","pinyin":"gèbié","meaning":"개별적인; 극소수의, 몇몇의","example":"不能用个别人的经历，代替对整体情况的调查。","examplePinyin":"Bùnéng yòng gèbié ren de jīnglì, dàitì duì zhěngtǐ qíngkuàng de diàochá.","translation":"몇몇 사람의 경험으로 전체 상황에 대한 조사를 대신해서는 안 돼요."},{"no":1490,"category":"성질·상태·문법","word":"根本","pinyin":"gēnběn","meaning":"근본, 기본; 전혀, 도무지","example":"没有可靠的数据，这个结论根本无法成立。","examplePinyin":"Méiyǒu kěkào de shùjù, zhè ge jiélùn gēnběn wúfǎ chénglì.","translation":"믿을 만한 자료가 없으면 이 결론은 전혀 성립할 수 없어요."},{"no":1491,"category":"성질·상태·문법","word":"格外","pinyin":"géwài","meaning":"유별나게, 특히","example":"经历过困难之后，他格外珍惜眼前的机会。","examplePinyin":"Jīnglì guo kùnnan zhīhòu, tā géwài zhēnxī yǎnqián de jīhuì.","translation":"어려움을 겪은 뒤 그는 눈앞의 기회를 더욱 소중히 여겨요."},{"no":1492,"category":"성질·상태·문법","word":"广","pinyin":"guǎng","meaning":"넓다, 광범위하다","example":"调查覆盖的范围越广，越能发现不同群体的需求。","examplePinyin":"Diàochá fùgài de fànwéi yuè guǎng, yuè néng fāxiàn bùtóng qúntǐ de xūqiú.","translation":"조사 범위가 넓을수록 다양한 집단의 요구를 발견하기 쉬워요."},{"no":1493,"category":"성질·상태·문법","word":"广泛","pinyin":"guǎngfàn","meaning":"광범위, 널리","example":"充分讨论之前，应广泛收集不同方面的意见。","examplePinyin":"Chōngfèn tǎolùn zhīqián, yīng guǎngfàn shōují bùtóng fāngmiàn de yìjiàn.","translation":"본격적으로 논의하기 전에 여러 방면의 의견을 폭넓게 모아야 해요."},{"no":1494,"category":"성질·상태·문법","word":"过度","pinyin":"guòdù","meaning":"과도하다, 지나치다","example":"过度依赖单一客户，会增加企业经营的风险。","examplePinyin":"Guòdù yīlài dānyī kèhù, huì zēngjiā qǐyè jīngyíng de fēngxiǎn.","translation":"한 고객에게 지나치게 의존하면 기업 운영의 위험이 커져요."},{"no":1495,"category":"성질·상태·문법","word":"过分","pinyin":"guòfèn","meaning":"지나치다, 과도하다; 지나치게","example":"批评如果过分严厉，可能使人失去改进的信心。","examplePinyin":"Pīpíng rúguǒ guòfèn yánlì, kěnéng shǐ rén shīqù gǎijìn de xìnxīn.","translation":"비판이 지나치게 엄하면 개선하려는 자신감을 잃게 할 수 있어요."},{"no":1496,"category":"성질·상태·문법","word":"过于","pinyin":"guòyú","meaning":"지나치게, 너무","example":"目标定得过于理想，执行时容易脱离实际。","examplePinyin":"Mùbiāo dìng de guòyú lǐxiǎng, zhíxíng shí róngyì tuōlí shíjì.","translation":"목표를 지나치게 이상적으로 정하면 실행이 현실과 동떨어지기 쉬워요."},{"no":1497,"category":"성질·상태·문법","word":"简直","pinyin":"jiǎnzhí","meaning":"그야말로, 정말로, 완전히","example":"短短几年间变化如此之大，简直让人不敢相信。","examplePinyin":"Duǎnduǎn jǐ nián jiān biànhuà rúcǐ zhī dà, jiǎnzhí ràng rén bù gǎn xiāngxìn.","translation":"불과 몇 년 사이에 변화가 이토록 커서 정말 믿기 어려워요."},{"no":1498,"category":"성질·상태·문법","word":"较","pinyin":"jiào","meaning":"비교적, 다소","example":"与原方案相比，新方案的维护费用较低。","examplePinyin":"Yǔ yuán fāng'àn xiāngbǐ, xīn fāng'àn de wéihù fèiyòng jiào dī.","translation":"원래 방안에 비해 새 방안은 유지 비용이 비교적 낮아요."},{"no":1499,"category":"성질·상태·문법","word":"极其","pinyin":"jíqí","meaning":"매우, 극도로","example":"在山区救援时，准确的天气信息极其重要。","examplePinyin":"Zài shānqū jiùyuán shí, zhǔnquè de tiānqì xìnxī jíqí zhòngyào.","translation":"산악 구조에서는 정확한 기상 정보가 매우 중요해요."},{"no":1500,"category":"성질·상태·문법","word":"巨大","pinyin":"jùdà","meaning":"거대하다, 엄청나다","example":"交通改善给当地带来了巨大的发展机会。","examplePinyin":"Jiāotōng gǎishàn gěi dāngdì dàilái le jùdà de fāzhǎn jīhuì.","translation":"교통 개선은 이 지역에 엄청난 발전 기회를 가져왔어요."},{"no":1501,"category":"성질·상태·문법","word":"绝对","pinyin":"juéduì","meaning":"절대적, 완전히","example":"凡是承诺绝对没有风险的投资，都值得警惕。","examplePinyin":"Fánshì chéngnuò juéduì méiyǒu fēngxiǎn de tóuzī, dōu zhíde jǐngtì.","translation":"위험이 전혀 없다고 보장하는 투자는 경계할 필요가 있어요."},{"no":1502,"category":"성질·상태·문법","word":"强烈","pinyin":"qiángliè","meaning":"강렬하다, 강하다","example":"这份报告引起了强烈反响，促成了后续调查。","examplePinyin":"Zhè fèn bàogào yǐnqǐ le qiángliè fǎnxiǎng, cùchéng le hòuxù diàochá.","translation":"이 보고서는 큰 반향을 일으켜 후속 조사로 이어졌어요."},{"no":1503,"category":"성질·상태·문법","word":"其余","pinyin":"qíyú","meaning":"그 외, 나머지","example":"先处理必须今天完成的任务，其余的留到明天。","examplePinyin":"Xiān chǔlǐ bìxū jīntiān wánchéng de rènwu, qíyú de liú dào míngtiān.","translation":"오늘 꼭 끝내야 할 일을 먼저 하고 나머지는 내일 하세요."},{"no":1504,"category":"성질·상태·문법","word":"全面","pinyin":"quánmiàn","meaning":"전면적, 모두","example":"全面了解情况以后，才能提出有针对性的建议。","examplePinyin":"Quánmiàn liǎojiě qíngkuàng yǐhòu, cái néng tíchū yǒu zhēnduìxìng de jiànyì.","translation":"상황을 전반적으로 알아야 적절한 제안을 할 수 있어요."},{"no":1505,"category":"성질·상태·문법","word":"全体","pinyin":"quántǐ","meaning":"전체, 모두","example":"全体成员都参与讨论，共同承担决策责任。","examplePinyin":"Quántǐ chéngyuán dōu cānyù tǎolùn, gòngtóng chéngdān juécè zérèn.","translation":"모든 구성원이 토론에 참여하고 의사 결정의 책임을 함께 져요."},{"no":1506,"category":"성질·상태·문법","word":"深远","pinyin":"shēnyuǎn","meaning":"깊고 오래가는, 심원한","example":"一次重要的教育经历，可能带来深远的影响。","examplePinyin":"Yí cì zhòngyào de jiàoyù jīnglì, kěnéng dàilái shēnyuǎn de yǐngxiǎng.","translation":"중요한 교육 경험 한 번이 먼 훗날까지 영향을 줄 수 있어요."},{"no":1507,"category":"성질·상태·문법","word":"唯一","pinyin":"wéiyī","meaning":"유일하다, 오직","example":"收入不是衡量工作价值的唯一标准。","examplePinyin":"Shōurù búshì héngliáng gōngzuò jiàzhí de wéiyī biāozhǔn.","translation":"수입이 일의 가치를 재는 유일한 기준은 아니에요."},{"no":1508,"category":"성질·상태·문법","word":"无限","pinyin":"wúxiàn","meaning":"무한, 끝없다","example":"人的精力并非无限，合理安排休息十分必要。","examplePinyin":"Rén de jīnglì bìngfēi wúxiàn, hélǐ ānpái xiūxi shífēn bìyào.","translation":"사람의 기력은 무한하지 않으니 휴식을 잘 배분해야 해요."},{"no":1509,"category":"성질·상태·문법","word":"相当","pinyin":"xiāngdāng","meaning":"상당하다; 상당히, 꽤; 맞먹다","example":"这项技术已经相当成熟，可以用于实际生产。","examplePinyin":"Zhè xiàng jìshù yǐjīng xiāngdāng chéngshú, kěyǐ yòngyú shíjì shēngchǎn.","translation":"이 기술은 이미 상당히 성숙해 실제 생산에 사용할 수 있어요."},{"no":1510,"category":"성질·상태·문법","word":"有限","pinyin":"yǒuxiàn","meaning":"제한적, 한정","example":"时间有限，讨论应先集中在最关键的问题上。","examplePinyin":"Shíjiān yǒuxiàn, tǎolùn yīng xiān jízhōng zài zuì guānjiàn de wèntí shàng.","translation":"시간이 한정돼 있으니 가장 중요한 문제부터 논의해야 해요."},{"no":1511,"category":"성질·상태·문법","word":"在内","pinyin":"zàinèi","meaning":"안에, ~을 포함하여","example":"交通和住宿都包括在内，不另收服务费。","examplePinyin":"Jiāotōng hé zhùsù dōu bāokuò zàinèi, bú lìngshōu fúwùfèi.","translation":"요금에는 교통과 숙박이 포함되며 서비스료는 따로 받지 않아요."},{"no":1512,"category":"성질·상태·문법","word":"整体","pinyin":"zhěngtǐ","meaning":"전체, 전체적인 구성","example":"只改进一个环节，不一定能提升整体效率。","examplePinyin":"Zhǐ gǎijìn yí ge huánjié, bùyídìng néng tíshēng zhěngtǐ xiàolǜ.","translation":"한 단계만 개선한다고 전체 효율이 높아지는 것은 아니에요."},{"no":1513,"category":"성질·상태·문법","word":"重大","pinyin":"zhòngdà","meaning":"중대하다, 중요하다","example":"作出重大调整之前，应说明理由并听取意见。","examplePinyin":"Zuòchū zhòngdà tiáozhěng zhīqián, yīng shuōmíng lǐyóu bìng tīngqǔ yìjiàn.","translation":"중대한 조정을 하기 전에 이유를 설명하고 의견을 들어야 해요."},{"no":1514,"category":"성질·상태·문법","word":"总体","pinyin":"zǒngtǐ","meaning":"전체, 전반","example":"虽然个别细节仍需改进，总体效果已经符合预期。","examplePinyin":"Suīrán gèbié xìjié réng xū gǎijìn, zǒngtǐ xiàoguǒ yǐjīng fúhé yùqī.","translation":"일부 세부 사항은 개선해야 하지만 전반적인 효과는 기대에 맞았어요."},{"no":1515,"category":"성질·상태·문법","word":"足够","pinyin":"zúgòu","meaning":"충분하다, 넉넉하다","example":"有足够的材料，不代表已经有了可靠的结论。","examplePinyin":"Yǒu zúgòu de cáiliào, bú dàibiǎo yǐjīng yǒu le kěkào de jiélùn.","translation":"자료가 충분하다고 믿을 만한 결론까지 얻은 것은 아니에요."},{"no":1516,"category":"성질·상태·문법","word":"毕竟","pinyin":"bìjìng","meaning":"결국, 아무래도, 어쨌든","example":"别对新同事要求太高，他毕竟刚接触这项工作。","examplePinyin":"Bié duì xīn tóngshì yāoqiú tài gāo, tā bìjìng gāng jiēchù zhè xiàng gōngzuò.","translation":"이 일을 처음 맡은 신입 동료에게 너무 많은 것을 요구하지 마세요."},{"no":1517,"category":"성질·상태·문법","word":"必然","pinyin":"bìrán","meaning":"필연적, 반드시","example":"努力未必立刻成功，但放弃必然失去机会。","examplePinyin":"Nǔlì wèibì lìkè chénggōng, dàn fàngqì bìrán shīqù jīhuì.","translation":"노력한다고 바로 성공하지는 않아도 포기하면 기회를 잃어요."},{"no":1518,"category":"성질·상태·문법","word":"不然","pinyin":"bùrán","meaning":"그렇지 않으면 / 아니면","example":"请把数据来源写清楚，不然读者难以核实。","examplePinyin":"Qǐng bǎ shùjù láiyuán xiě qīngchu, bùrán dúzhě nányǐ héshí.","translation":"독자가 확인할 수 있도록 자료의 출처를 분명히 적어 주세요."},{"no":1519,"category":"성질·상태·문법","word":"从而","pinyin":"cóng'ér","meaning":"그러므로, 따라서","example":"团队简化了审批流程，从而提高了办事效率。","examplePinyin":"Tuánduì jiǎnhuà le shěnpī liúchéng, cóng'ér tígāo le bànshì xiàolǜ.","translation":"팀은 승인 절차를 간소화해 업무 효율을 높였어요."},{"no":1520,"category":"성질·상태·문법","word":"反而","pinyin":"fǎn'ér","meaning":"오히려, 도리어","example":"过分强调速度，反而可能降低工作的质量。","examplePinyin":"Guòfèn qiángdiào sùdù, fǎn'ér kěnéng jiàngdī gōngzuò de zhìliàng.","translation":"속도를 지나치게 강조하면 오히려 일의 질이 떨어질 수 있어요."},{"no":1521,"category":"성질·상태·문법","word":"反正","pinyin":"fǎnzhèng","meaning":"어차피, 아무튼","example":"反正还有时间，不如把关键问题再核实一遍。","examplePinyin":"Fǎnzhèng háiyǒu shíjiān, bùrú bǎ guānjiàn wèntí zài héshí yí biàn.","translation":"어차피 시간이 있으니 중요한 문제를 다시 확인하는 게 어때요."},{"no":1522,"category":"성질·상태·문법","word":"或是","pinyin":"huòshì","meaning":"혹은, 또는","example":"遇到争议可以继续协商，或是请第三方参与调解。","examplePinyin":"Yùdào zhēngyì kěyǐ jìxù xiéshāng, huòshì qǐng dìsānfāng cānyù tiáojiě.","translation":"분쟁이 생기면 협의를 계속하거나 제삼자에게 중재를 요청할 수 있어요."},{"no":1523,"category":"성질·상태·문법","word":"及","pinyin":"jí","meaning":"및, 그리고","example":"请提交申请表及能够证明相关经历的材料。","examplePinyin":"Qǐng tíjiāo shēnqǐngbiǎo jí nénggòu zhèngmíng xiāngguān jīnglì de cáiliào.","translation":"신청서와 관련 경력을 증명할 수 있는 자료를 제출해 주세요."},{"no":1524,"category":"성질·상태·문법","word":"假如","pinyin":"jiǎrú","meaning":"만약 ~이라면, 가령","example":"假如计划遇到阻力，你会坚持还是调整方向？","examplePinyin":"Jiǎrú jìhuà yùdào zǔlì, nǐ huì jiānchí háishi tiáozhěng fāngxiàng?","translation":"계획에 저항이 생긴다면 고수하겠어요, 방향을 바꾸겠어요?"},{"no":1525,"category":"성질·상태·문법","word":"可见","pinyin":"kějiàn","meaning":"~라는 것을 알 수 있다","example":"试验反复得到相同结果，可见这个判断有一定依据。","examplePinyin":"Shìyàn fǎnfù dédào xiāngtóng jiéguǒ, kějiàn zhè ge pànduàn yǒu yídìng yījù.","translation":"실험 결과가 거듭 같으니 이 판단에는 어느 정도 근거가 있음을 알 수 있어요."},{"no":1526,"category":"성질·상태·문법","word":"哪怕","pinyin":"nǎpà","meaning":"~이라도, ~할지라도","example":"哪怕进步很小，只要方向正确就值得坚持。","examplePinyin":"Nǎpà jìnbù hěnxiǎo, zhǐyào fāngxiàng zhèngquè jiù zhíde jiānchí.","translation":"발전이 작더라도 방향이 옳다면 계속할 가치가 있어요."},{"no":1527,"category":"성질·상태·문법","word":"如","pinyin":"rú","meaning":"~와 같다; 예를 들면, ~등","example":"生活中有许多节能方法，如随手关灯、合理用水。","examplePinyin":"Shēnghuó zhōng yǒu xǔduō jiénéng fāngfǎ, rú suíshǒu guāndēng, hélǐ yòngshuǐ.","translation":"일상에는 소등과 적절한 물 사용 등 여러 절약 방법이 있어요."},{"no":1528,"category":"성질·상태·문법","word":"如同","pinyin":"rútóng","meaning":"~과 같이, 마치","example":"这些记录如同一扇窗，让我们看见过去的生活。","examplePinyin":"Zhèxiē jìlù rútóng yīshàn chuāng, ràng wǒmen kànjiàn guòqu de shēnghuó.","translation":"이 기록들은 창문처럼 과거의 삶을 보여 줘요."},{"no":1529,"category":"성질·상태·문법","word":"万一","pinyin":"wànyī","meaning":"혹시, 만약에","example":"出发前准备备用路线，万一道路封闭也能应对。","examplePinyin":"Chūfā qián zhǔnbèi bèiyòng lùxiàn, wànyī dàolù fēngbì yě néng yìngduì.","translation":"출발 전 대체 경로를 준비하면 혹시 도로가 폐쇄되어도 대응할 수 있어요."},{"no":1530,"category":"성질·상태·문법","word":"要不（然）","pinyin":"yàobù(rán)","meaning":"아니면, 그렇지 않으면","example":"请先备份文件，要不然系统故障时可能丢失资料。","examplePinyin":"Qǐng xiān bèifèn wénjiàn, yàobùrán xìtǒng gùzhàng shí kěnéng diūshī zīliào.","translation":"시스템 고장 때 자료를 잃을 수 있으니 먼저 파일을 백업하세요."},{"no":1531,"category":"성질·상태·문법","word":"要不是","pinyin":"yàobúshì","meaning":"만약 ~이 아니었다면","example":"要不是同事及时提醒，我差点错过申请期限。","examplePinyin":"Yàobúshì tóngshì jíshí tíxǐng, wǒ chàdiǎn cuòguò shēnqǐng qīxiàn.","translation":"동료가 제때 알려 주지 않았다면 신청 기한을 놓칠 뻔했어요."},{"no":1532,"category":"성질·상태·문법","word":"一旦","pinyin":"yídàn","meaning":"일단 ~하면, 만일 ~하게 되면","example":"一旦发现安全隐患，就应立即采取措施。","examplePinyin":"Yídàn fāxiàn ānquán yǐnhuàn, jiù yīng lìjí cǎiqǔ cuòshī.","translation":"안전 위험을 발견하면 즉시 조치해야 해요."},{"no":1533,"category":"성질·상태·문법","word":"以及","pinyin":"yǐjí","meaning":"및, 그리고","example":"调查关注收入、住房，以及公共服务的实际使用情况。","examplePinyin":"Diàochá guānzhù shōurù, zhùfáng, yǐjí gōnggòng fúwù de shíjì shǐyòng qíngkuàng.","translation":"조사는 소득, 주거, 그리고 공공 서비스의 실제 이용을 살펴봐요."},{"no":1534,"category":"성질·상태·문법","word":"因而","pinyin":"yīn'ér","meaning":"그러므로, 따라서","example":"信息来源不一致，因而需要增加核查环节。","examplePinyin":"Xìnxī láiyuán bù yízhì, yīn'ér xūyào zēngjiā héchá huánjié.","translation":"정보 출처가 일치하지 않아 검증 단계를 추가해야 해요."},{"no":1535,"category":"성질·상태·문법","word":"由此","pinyin":"yóucǐ","meaning":"이로 인해, 따라서","example":"多个环节缺少沟通，由此产生了不必要的重复劳动。","examplePinyin":"Duōge huánjié quēshǎo gōutōng, yóucǐ chǎnshēng le búbìyào de chóngfù láodòng.","translation":"단계별 소통이 부족해 불필요한 중복 작업이 생겼어요."},{"no":1536,"category":"성질·상태·문법","word":"正如","pinyin":"zhèngrú","meaning":"마치 ~처럼, 바로 ~와 같이","example":"正如调查所显示的，居民最关心的是服务是否方便。","examplePinyin":"Zhèngrú diàochá suǒ xiǎnshì de, jūmín zuì guānxīn de shì fúwù shìfǒu fāngbiàn.","translation":"조사에서 드러났듯 주민의 주된 관심은 서비스의 편리함이에요."},{"no":1537,"category":"성질·상태·문법","word":"总之","pinyin":"zǒngzhī","meaning":"요컨대, 결국","example":"总之，方案既要可行，也要考虑长期维护。","examplePinyin":"Zǒngzhī, fāng'àn jì yào kěxíng, yě yào kǎolǜ chángqī wéihù.","translation":"요컨대 방안은 실행 가능해야 하고 장기 유지 관리도 고려해야 해요."},{"no":1538,"category":"성질·상태·문법","word":"必","pinyin":"bì","meaning":"반드시, 꼭","example":"他相信，充分准备必能提高成功的可能性。","examplePinyin":"Tā xiāngxìn, chōngfèn zhǔnbèi bì néng tígāo chénggōng de kěnéngxìng.","translation":"그는 충분히 준비하면 성공 가능성을 반드시 높일 수 있다고 믿어요."},{"no":1539,"category":"성질·상태·문법","word":"必需","pinyin":"bìxū","meaning":"필수, 반드시 필요한","example":"饮用水是救灾现场最急需的生活必需品之一。","examplePinyin":"Yǐnyòngshuǐ shì jiùzāi xiànchǎng zuì jíxū de shēnghuó bìxū pǐn zhīyī.","translation":"식수는 재난 구호 현장에서 가장 시급한 생필품 중 하나예요."},{"no":1540,"category":"성질·상태·문법","word":"必要","pinyin":"bìyào","meaning":"필요하다, 요구되다","example":"在作出重大决定前，有必要充分了解风险。","examplePinyin":"Zài zuòchū zhòngdà juédìng qián, yǒu bìyào chōngfèn liǎojiě fēngxiǎn.","translation":"중대한 결정을 내리기 전에 위험을 충분히 알아볼 필요가 있어요."},{"no":1541,"category":"성질·상태·문법","word":"急需","pinyin":"jíxū","meaning":"긴급히 필요하다","example":"灾区目前急需饮用水和能够保暖的衣物。","examplePinyin":"Zāiqū mùqián jíxū yǐnyòngshuǐ hé nénggòu bǎonuǎn de yīwù.","translation":"피해 지역에는 현재 식수와 따뜻한 옷이 긴급히 필요해요."},{"no":1542,"category":"성질·상태·문법","word":"具备","pinyin":"jùbèi","meaning":"갖추다, 비치하다","example":"具备专业知识，并不等于具备良好的沟通能力。","examplePinyin":"Jùbèi zhuānyè zhīshi, bìngbù děngyú jùbèi liánghǎo de gōutōng nénglì.","translation":"전문 지식이 있다고 원활한 소통 능력까지 갖춘 것은 아니에요."},{"no":1543,"category":"성질·상태·문법","word":"没法儿","pinyin":"méifǎr","meaning":"방법이 없다, 어쩔 수 없다","example":"缺少关键数据，我们暂时没法儿判断结果是否可靠。","examplePinyin":"Quēshǎo guānjiàn shùjù, wǒmen zànshí méifǎr pànduàn jiéguǒ shìfǒu kěkào.","translation":"핵심 자료가 부족해 지금은 결과의 신뢰성을 판단할 수 없어요."},{"no":1544,"category":"성질·상태·문법","word":"难以","pinyin":"nányǐ","meaning":"~하기 어렵다","example":"仅凭一张照片，难以判断现场的真实情况。","examplePinyin":"Jǐn píng yì zhāng zhàopiàn, nányǐ pànduàn xiànchǎng de zhēnshí qíngkuàng.","translation":"사진 한 장만으로 현장의 실제 상황을 판단하기는 어려워요."},{"no":1545,"category":"성질·상태·문법","word":"需","pinyin":"xū","meaning":"필요하다, 요구하다","example":"参观实验区域需提前预约，并接受安全说明。","examplePinyin":"Cānguān shíyàn qūyù xū tíqián yùyuē, bìng jiēshòu ānquán shuōmíng.","translation":"실험 구역을 관람하려면 미리 예약하고 안전 안내를 받아야 해요."},{"no":1546,"category":"성질·상태·문법","word":"应当","pinyin":"yīngdāng","meaning":"응당, 마땅히","example":"享有便利的同时，每个人也应当遵守共同规则。","examplePinyin":"Xiǎngyǒu biànlì de tóngshí, měi ge rén yě yīngdāng zūnshǒu gòngtóng guīzé.","translation":"편의를 누리는 동시에 누구나 공동 규칙도 지켜야 해요."},{"no":1547,"category":"성질·상태·문법","word":"白","pinyin":"bái","meaning":"희다; 헛되이, 공짜로; 분명하다","example":"出发前没有核实地址，结果白跑了一趟。","examplePinyin":"Chūfā qián méiyǒu héshí dìzhǐ, jiéguǒ báipǎo le yí tàng.","translation":"출발 전에 주소를 확인하지 않아 결국 헛걸음했어요."},{"no":1548,"category":"성질·상태·문법","word":"便","pinyin":"biàn","meaning":"곧, 바로; 편리하다","example":"一收到修改意见，他便着手调整研究计划。","examplePinyin":"Yì shōudào xiūgǎi yìjiàn, tā biàn zhuóshǒu tiáozhěng yánjiū jìhuà.","translation":"수정 의견을 받자 그는 곧 연구 계획을 조정하기 시작했어요."},{"no":1549,"category":"성질·상태·문법","word":"别2","pinyin":"bié","meaning":"다른, 그 밖의","example":"这条路暂时封闭，我们只好另找别的路线。","examplePinyin":"Zhè tiáo lù zànshí fēngbì, wǒmen zhǐhǎo lìng zhǎo biéde lùxiàn.","translation":"이 길이 일시 폐쇄되어 다른 경로를 찾을 수밖에 없었어요."},{"no":1550,"category":"성질·상태·문법","word":"才2","pinyin":"cái","meaning":"겨우, 비로소 / 재주, 능력","example":"直到亲自参与调查，他才意识到问题的严重性。","examplePinyin":"Zhídào qīnzì cānyù diàochá, tā cái yìshí dào wèntí de yánzhòngxìng.","translation":"직접 조사에 참여하고서야 그는 문제의 심각성을 깨달았어요."},{"no":1551,"category":"성질·상태·문법","word":"单独","pinyin":"dāndú","meaning":"단독, 홀로","example":"这项任务不能单独完成，需要不同部门配合。","examplePinyin":"Zhè xiàng rènwu bùnéng dāndú wánchéng, xūyào bùtóng bùmén pèihé.","translation":"이 임무는 혼자 완수할 수 없어 여러 부서의 협력이 필요해요."},{"no":1552,"category":"성질·상태·문법","word":"的确","pinyin":"díquè","meaning":"확실히, 정말","example":"这个方案的确能省钱，但也存在一定风险。","examplePinyin":"Zhè ge fāng'àn díquè néng shěngqián, dàn yě cúnzài yídìng fēngxiǎn.","translation":"이 방안은 분명 비용을 아낄 수 있지만 위험도 있어요."},{"no":1553,"category":"성질·상태·문법","word":"独自","pinyin":"dúzì","meaning":"혼자, 독자적으로","example":"第一次独自在外生活，他逐渐学会了安排开支。","examplePinyin":"Dìyīcì dúzì zàiwài shēnghuó, tā zhújiàn xuéhuì le ānpái kāizhī.","translation":"처음으로 혼자 타지에서 살며 그는 지출 관리를 배웠어요."},{"no":1554,"category":"성질·상태·문법","word":"仿佛","pinyin":"fǎngfú","meaning":"마치, ~인 것처럼","example":"读着这些家信，他仿佛又回到了童年的院子。","examplePinyin":"Dú zhe zhèxiē jiāxìn, tā fǎngfú yòu huídào le tóngnián de yuànzi.","translation":"이 가족 편지들을 읽으며 그는 어린 시절 마당으로 돌아간 듯했어요."},{"no":1555,"category":"성질·상태·문법","word":"分别","pinyin":"fēnbié","meaning":"각각, 따로","example":"两位研究员分别负责数据收集和结果分析。","examplePinyin":"Liǎng wèi yánjiūyuán fēnbié fùzé shùjù shōují hé jiéguǒ fēnxī.","translation":"두 연구원은 각각 자료 수집과 결과 분석을 맡아요."},{"no":1556,"category":"성질·상태·문법","word":"纷纷","pinyin":"fēnfēn","meaning":"잇따라, 저마다, 분분히","example":"倡议发布后，附近商家纷纷表示愿意参与。","examplePinyin":"Chàngyì fābù hòu, fùjìn shāngjiā fēnfēn biǎoshì yuànyì cānyù.","translation":"제안이 발표되자 주변 상점들이 잇따라 참여 의사를 밝혔어요."},{"no":1557,"category":"성질·상태·문법","word":"各自","pinyin":"gèzì","meaning":"각자, 저마다","example":"讨论结束后，大家按照各自的职责推进工作。","examplePinyin":"Tǎolùn jiéshù hòu, dàjiā ànzhào gèzì de zhízé tuījìn gōngzuò.","translation":"토론을 마친 뒤 모두 각자의 직무에 따라 일을 진행했어요."},{"no":1558,"category":"성질·상태·문법","word":"果然","pinyin":"guǒrán","meaning":"과연, 정말","example":"按专家建议调整后，设备果然恢复了正常。","examplePinyin":"Àn zhuānjiā jiànyì tiáozhěng hòu, shèbèi guǒrán huīfù le zhèngcháng.","translation":"전문가의 권고대로 조정하자 장비가 과연 정상으로 돌아왔어요."},{"no":1559,"category":"성질·상태·문법","word":"或许","pinyin":"huòxǔ","meaning":"어쩌면, 혹시","example":"换个角度思考，或许能找到原先没注意到的机会。","examplePinyin":"Huàn ge jiǎodù sīkǎo, huòxǔ néng zhǎodào yuánxiān méi zhùyì dào de jīhuì.","translation":"관점을 바꾸면 미처 보지 못했던 기회를 찾을지도 몰라요."},{"no":1560,"category":"성질·상태·문법","word":"急忙","pinyin":"jímáng","meaning":"급히, 바삐","example":"看到天色突变，管理员急忙通知游客下山。","examplePinyin":"Kàndào tiānsè tūbiàn, guǎnlǐyuán jímáng tōngzhī yóukè xiàshān.","translation":"하늘빛이 갑자기 변하자 관리자는 급히 관광객에게 하산을 알렸어요."},{"no":1561,"category":"성질·상태·문법","word":"尽量","pinyin":"jǐnliàng","meaning":"가능한 한, 되도록","example":"讨论时尽量围绕事实，不要对个人作出攻击。","examplePinyin":"Tǎolùn shí jǐnliàng wéirào shìshí, búyào duì gèrén zuòchū gōngjī.","translation":"토론에서는 가능한 한 사실에 집중하고 인신공격을 하지 마세요."},{"no":1562,"category":"성질·상태·문법","word":"据","pinyin":"jù","meaning":"에 의하면, ~에 따르면","example":"据调查，多数居民支持增加公共绿地。","examplePinyin":"Jù diàochá, duōshù jūmín zhīchí zēngjiā gōnggòng lǜdì.","translation":"조사에 따르면 주민 대다수는 공공 녹지를 늘리는 데 찬성해요."},{"no":1563,"category":"성질·상태·문법","word":"居然","pinyin":"jūrán","meaning":"뜻밖에도, 놀랍게도","example":"多年未见，她居然一眼就认出了小时候的同学。","examplePinyin":"Duōnián wèi jiàn, tā jūrán yì yǎn jiù rènchū le xiǎoshíhou de tóngxué.","translation":"여러 해 못 봤는데도 그녀는 놀랍게 어린 시절 친구를 단번에 알아봤어요."},{"no":1564,"category":"성질·상태·문법","word":"据说","pinyin":"jùshuō","meaning":"전해진 바에 따르면","example":"据说这座古桥已经使用了数百年，仍十分坚固。","examplePinyin":"Jùshuō zhè zuò gǔqiáo yǐjīng shǐyòng le shùbǎi nián, réng shífēn jiāngù.","translation":"이 옛 다리는 수백 년 동안 사용했는데도 아직 튼튼하다고 해요."},{"no":1565,"category":"성질·상태·문법","word":"连忙","pinyin":"liánmáng","meaning":"급히, 황급히","example":"发现客人走错方向，工作人员连忙上前指引。","examplePinyin":"Fāxiàn kèrén zǒu cuò fāngxiàng, gōngzuò rényuán liánmáng shàngqián zhǐyǐn.","translation":"손님이 잘못 가는 것을 본 직원이 급히 다가가 안내했어요."},{"no":1566,"category":"성질·상태·문법","word":"令","pinyin":"lìng","meaning":"명령하다; ~하게 하다","example":"这项看似微小的改进，令使用者感到十分方便。","examplePinyin":"Zhè xiàng kànsì wēixiǎo de gǎijìn, lìng shǐyòngzhě gǎndào shífēn fāngbiàn.","translation":"작아 보이는 이 개선은 사용자들에게 큰 편의를 줬어요."},{"no":1567,"category":"성질·상태·문법","word":"面向","pinyin":"miànxiàng","meaning":"~을 향하다; ~을 대상으로 하다","example":"这项服务面向所有居民，不因户籍不同而区别对待。","examplePinyin":"Zhè xiàng fúwù miànxiàng suǒyǒu jūmín, bù yīn hùjí bùtóng ér qūbié duìdài.","translation":"이 서비스는 주민 등록지와 관계없이 모든 주민을 대상으로 해요."},{"no":1568,"category":"성질·상태·문법","word":"凭","pinyin":"píng","meaning":"~에 의거하다, 근거하다","example":"报名者凭有效证件，可以领取免费的参观票。","examplePinyin":"Bàomíngzhě píng yǒuxiào zhèngjiàn, kěyǐ lǐngqǔ miǎnfèi de cānguānpiào.","translation":"신청자는 유효한 신분증으로 무료 관람권을 받을 수 있어요."},{"no":1569,"category":"성질·상태·문법","word":"凭借","pinyin":"píngjiè","meaning":"~에 의거하여, 바탕으로","example":"这家小企业凭借稳定的品质，赢得了客户信任。","examplePinyin":"Zhè jiā xiǎoqǐyè píngjiè wěndìng de pǐnzhì, yíngdé le kèhù xìnrèn.","translation":"이 작은 기업은 안정적인 품질로 고객의 신뢰를 얻었어요."},{"no":1570,"category":"성질·상태·문법","word":"悄悄","pinyin":"qiāoqiāo","meaning":"조용히, 살짝","example":"怕打断大家的讨论，他悄悄坐到了后排。","examplePinyin":"Pà dǎduàn dàjiā de tǎolùn, tā qiāoqiāo zuò dào le hòupái.","translation":"토론을 방해할까 봐 그는 살며시 뒷자리에 앉았어요."},{"no":1571,"category":"성질·상태·문법","word":"轻易","pinyin":"qīngyì","meaning":"쉽게, 함부로, 경솔하게","example":"没有充分证据，不应该轻易怀疑他人的动机。","examplePinyin":"Méiyǒu chōngfèn zhèngjù, bù yīnggāi qīngyì huáiyí tārén de dòngjī.","translation":"충분한 증거 없이 다른 사람의 동기를 함부로 의심하면 안 돼요."},{"no":1572,"category":"성질·상태·문법","word":"亲自","pinyin":"qīnzì","meaning":"직접, 몸소","example":"负责人亲自到现场，了解居民最关心的问题。","examplePinyin":"Fùzérén qīnzì dào xiànchǎng, liǎojiě jūmín zuì guānxīn de wèntí.","translation":"책임자가 직접 현장에 가 주민들의 주요 관심사를 알아봤어요."},{"no":1573,"category":"성질·상태·문법","word":"如此","pinyin":"rúcǐ","meaning":"이렇게, 그렇게","example":"如果情况确实如此，就需要重新评估原来的计划。","examplePinyin":"Rúguǒ qíngkuàng quèshí rúcǐ, jiù xūyào chóngxīn pínggū yuánlái de jìhuà.","translation":"상황이 정말 그렇다면 기존 계획을 다시 평가해야 해요."},{"no":1574,"category":"성질·상태·문법","word":"如下","pinyin":"rúxià","meaning":"다음과 같다","example":"本次活动的报名要求如下，请大家逐项确认。","examplePinyin":"Běncì huódòng de bàomíng yāoqiú rúxià, qǐng dàjiā zhúxiàng quèrèn.","translation":"이번 행사 신청 요건은 다음과 같으니 항목별로 확인하세요."},{"no":1575,"category":"성질·상태·문법","word":"使得","pinyin":"shǐde","meaning":"~하게 하다, 시키다","example":"道路改善，使得偏远村庄与外界联系更加方便。","examplePinyin":"Dàolù gǎishàn, shǐde piānyuǎn cūnzhuāng yǔ wàijiè liánxì gèngjiā fāngbiàn.","translation":"도로가 개선되어 외딴 마을이 외부와 더 쉽게 연결됐어요."},{"no":1576,"category":"성질·상태·문법","word":"说不定","pinyin":"shuōbudìng","meaning":"어쩌면, 혹시","example":"再多观察一段时间，说不定会发现新的线索。","examplePinyin":"Zài duō guānchá yí duàn shíjiān, shuōbudìng huì fāxiàn xīn de xiànsuǒ.","translation":"조금 더 관찰하면 새로운 단서를 발견할지도 몰라요."},{"no":1577,"category":"성질·상태·문법","word":"属于","pinyin":"shǔyú","meaning":"속하다, 소속되다","example":"这些资料属于公共资源，任何人都不应私自占有。","examplePinyin":"Zhèxiē zīliào shǔyú gōnggòng zīyuán, rènhérén dōu bù yīng sīzì zhànyǒu.","translation":"이 자료는 공공 자원이므로 누구도 무단으로 독점해서는 안 돼요."},{"no":1578,"category":"성질·상태·문법","word":"似乎","pinyin":"sìhū","meaning":"~인 것 같다, 듯이","example":"他表面上似乎很平静，其实一直担心最终结果。","examplePinyin":"Tā biǎomiàn shàng sìhū hěn píngjìng, qíshí yìzhí dānxīn zuìzhōng jiéguǒ.","translation":"그는 겉으로는 차분해 보여도 사실 결과를 계속 걱정했어요."},{"no":1579,"category":"성질·상태·문법","word":"随","pinyin":"suí","meaning":"따르다, 좇다, 마음대로하다","example":"服务内容应随居民需求的变化，及时作出调整。","examplePinyin":"Fúwù nèiróng yīng suí jūmín xūqiú de biànhuà, jíshí zuòchū tiáozhěng.","translation":"서비스 내용은 주민 수요의 변화에 따라 제때 조정해야 해요."},{"no":1580,"category":"성질·상태·문법","word":"随手","pinyin":"suíshǒu","meaning":"하는 김에, 그때그때 바로; 손 가는 대로","example":"离开房间时随手关灯，是容易坚持的节能习惯。","examplePinyin":"Líkāi fángjiān shí suíshǒu guāndēng, shì róngyì jiānchí de jiénéng xíguàn.","translation":"방을 나올 때 바로 불을 끄는 것은 실천하기 쉬운 절약 습관이에요."},{"no":1581,"category":"성질·상태·문법","word":"随意","pinyin":"suíyì","meaning":"마음대로, 임의로","example":"未经许可，不能随意修改他人提交的原始资料。","examplePinyin":"Wèijīng xǔkě, bùnéng suíyì xiūgǎi tārén tíjiāo de yuánshǐ zīliào.","translation":"허락 없이 남이 제출한 원자료를 함부로 수정해서는 안 돼요."},{"no":1582,"category":"성질·상태·문법","word":"同","pinyin":"tóng","meaning":"같다, 동일하다; 함께, ~와","example":"我们愿意同其他团队分享经验，共同改进方法。","examplePinyin":"Wǒmen yuànyì tóng qítā tuánduì fēnxiǎng jīngyàn, gòngtóng gǎijìn fāngfǎ.","translation":"우리는 다른 팀과 경험을 공유하며 함께 방법을 개선하려 해요."},{"no":1583,"category":"성질·상태·문법","word":"为2","pinyin":"wéi","meaning":"~이다, ~이 되다; ~로 삼다; 하다","example":"这份报告以改善居民生活为主要目标。","examplePinyin":"Zhè fèn bàogào yǐ gǎishàn jūmín shēnghuó wéi zhǔyào mùbiāo.","translation":"이 보고서는 주민 생활의 개선을 주요 목표로 삼아요."},{"no":1584,"category":"성질·상태·문법","word":"显然","pinyin":"xiǎnrán","meaning":"분명히, 명백히","example":"调查覆盖范围太小，显然不足以支持这一结论。","examplePinyin":"Diàochá fùgài fànwéi tài xiǎo, xiǎnrán bù zúyǐ zhīchí zhè yì jiélùn.","translation":"조사 범위가 너무 좁아 이 결론의 근거로는 분명히 부족해요."},{"no":1585,"category":"성질·상태·문법","word":"沿","pinyin":"yán","meaning":"~을 따라, ~을 끼고","example":"沿河设置的步道，为居民提供了方便的散步空间。","examplePinyin":"Yánhé shèzhì de bùdào, wèi jūmín tígōng le fāngbiàn de sànbù kōngjiān.","translation":"강을 따라 만든 산책로는 주민들에게 편리한 산책 공간을 줘요."},{"no":1586,"category":"성질·상태·문법","word":"以","pinyin":"yǐ","meaning":"~로써, ~에 의하다","example":"解决问题应以实际需要为依据，而不是只凭想象。","examplePinyin":"Jiějué wèntí yīng yǐ shíjì xūyào wéi yījù, ér búshì zhǐ píng xiǎngxiàng.","translation":"문제 해결은 상상이 아니라 실제 필요에 근거해야 해요."},{"no":1587,"category":"성질·상태·문법","word":"依据","pinyin":"yījù","meaning":"근거; ~에 의거하다","example":"每项判断都应说明依据，方便别人核实。","examplePinyin":"Měi xiàng pànduàn dōu yīng shuōmíng yījù, fāngbiàn biéren héshí.","translation":"모든 판단은 다른 사람이 확인할 수 있도록 근거를 밝혀야 해요."},{"no":1588,"category":"성질·상태·문법","word":"依然","pinyin":"yīrán","meaning":"그래도, 여전히","example":"条件虽然改善了，这里的居民依然珍惜每一滴水。","examplePinyin":"Tiáojiàn suīrán gǎishàn le, zhèlǐ de jūmín yīrán zhēnxī měi yì dī shuǐ.","translation":"여건이 나아져도 이곳 주민들은 여전히 물 한 방울을 아껴요."},{"no":1589,"category":"성질·상태·문법","word":"意味着","pinyin":"yìwèizhe","meaning":"의미하다, 뜻하다","example":"承担责任，意味着不能只在成功时接受表扬。","examplePinyin":"Chéngdān zérèn, yìwèizhe bùnéng zhǐ zài chénggōng shí jiēshòu biǎoyáng.","translation":"책임을 진다는 것은 성공했을 때만 칭찬을 받아서는 안 된다는 뜻이에요."},{"no":1590,"category":"성질·상태·문법","word":"有助于","pinyin":"yǒuzhùyú","meaning":"~에 도움이 되다, 기여하다","example":"公开讨论有助于发现盲点，但也需要尊重事实。","examplePinyin":"Gōngkāi tǎolùn yǒuzhùyú fāxiàn mángdiǎn, dàn yě xūyào zūnzhòng shìshí.","translation":"공개 토론은 놓친 부분을 찾는 데 도움이 되지만 사실을 존중해야 해요."},{"no":1591,"category":"성질·상태·문법","word":"在于","pinyin":"zàiyú","meaning":"~에 달려 있다, ~에 있다","example":"学习的关键不在于时间长短，而在于是否真正投入。","examplePinyin":"Xuéxí de guānjiàn bú zàiyú shíjiān chángduǎn, ér zàiyú shìfǒu zhēnzhèng tóurù.","translation":"학습의 핵심은 시간의 길이보다 실제로 집중하는지에 있어요."},{"no":1592,"category":"성질·상태·문법","word":"针对","pinyin":"zhēnduì","meaning":"대상으로 하다, 겨누다","example":"针对老人使用不便的问题，系统增加了简化界面。","examplePinyin":"Zhēnduì lǎorén shǐyòng búbiàn de wèntí "Chéngshì gǎizào yīng jǐnliàng lìyòng yuányǒu shèshī, jiǎnshǎo chóngfù jiànshè.","translation":"도시 정비는 기존 시설을 최대한 활용해 중복 건설을 줄여야 해요."}];
const LEVEL = 5;
const state = { showPinyin:true, showMeaning:true, showTranslation:true, speaking:false, paused:false, resumeNext:null, resumeSpeech:null, speechToken:0, runId:0, currentAudio:null, currentNo:null, nextTimer:null, statusTimer:null };
const list = document.getElementById('list');

function syncPauseButton() {
  pauseResumeBtn.disabled = !state.speaking;
