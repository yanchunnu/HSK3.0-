èyú shíjiān xuéxí xiūlǐ, jiànjiàn zhǎngwò le shíyòng jìnéng.","translation":"그는 여가에 수리를 배워 차츰 실용 기술을 익혔어요."},{"no":1008,"category":"여가·미디어·소통","word":"娱乐","pinyin":"yúlè","meaning":"오락, 놀이","example":"娱乐可以缓解压力，但不应长期影响睡眠。","examplePinyin":"Yúlè kěyǐ huǎnjiě yālì, dàn bù yīng chángqī yǐngxiǎng shuìmián.","translation":"오락은 스트레스를 덜어 주지만 오랫동안 수면을 방해해서는 안 돼요."},{"no":1009,"category":"여가·미디어·소통","word":"掌声","pinyin":"zhǎngshēng","meaning":"박수, 갈채","example":"演讲结束后，听众用掌声感谢他真诚的分享。","examplePinyin":"Yǎnjiǎng jiéshù hòu, tīngzhòng yòng zhǎngshēng gǎnxiè tā zhēnchéng de fēnxiǎng.","translation":"강연이 끝나자 청중은 박수로 진솔한 나눔에 감사했어요."},{"no":1010,"category":"동작·감각·생각","word":"插","pinyin":"chā","meaning":"꽂다, 끼우다 / 찌르다","example":"插好电源以后，还要确认设备是否接地。","examplePinyin":"Chā hǎo diànyuán yǐhòu, hái yào quèrèn shèbèi shìfǒu jiēdì.","translation":"전원 플러그를 꽂은 뒤 설비의 접지 여부도 확인해야 해요."},{"no":1011,"category":"동작·감각·생각","word":"拆","pinyin":"chāi","meaning":"분해하다, 뜯다","example":"拆旧房之前，工人先检查了附近的管道。","examplePinyin":"Chāi jiùfáng zhīqián, gōngrén xiān jiǎnchá le fùjìn de guǎndào.","translation":"낡은 집을 철거하기 전에 인부들이 주변 배관을 점검했어요."},{"no":1012,"category":"동작·감각·생각","word":"冲","pinyin":"chōng","meaning":"돌진하다; 물을 붓다, 헹구다","example":"消防员冲进浓烟中，迅速带出了被困的居民。","examplePinyin":"Xiāofángyuán chōngjìn nóngyān zhōng, xùnsù dài chū le bèikùn de jūmín.","translation":"소방관은 짙은 연기 속으로 뛰어들어 갇힌 주민을 구했어요."},{"no":1013,"category":"동작·감각·생각","word":"抽","pinyin":"chōu","meaning":"뽑다, 빼내다 / 담배를 피우다","example":"请从这些申请表中随机抽出十份进行核查。","examplePinyin":"Qǐng cóng zhèxiē shēnqǐngbiǎo zhōng suíjī chōuchū shí fèn jìnxíng héchá.","translation":"이 신청서들에서 무작위로 열 부를 뽑아 검토해 주세요."},{"no":1014,"category":"동작·감각·생각","word":"挡","pinyin":"dǎng","meaning":"막다, 가리다","example":"请不要把货物堆在门口，以免挡住紧急出口。","examplePinyin":"Qǐng búyào bǎ huòwù duī zài ménkǒu, yǐmiǎn dǎngzhù jǐnjí chūkǒu.","translation":"비상구를 막지 않도록 출입문 앞에 물건을 쌓지 마세요."},{"no":1015,"category":"동작·감각·생각","word":"低头","pinyin":"dītóu","meaning":"고개를 숙이다, 굴복하다","example":"过马路时一直低头看手机，很容易发生危险。","examplePinyin":"Guò mǎlù shí yìzhí dītóu kàn shǒujī, hěn róngyì fāshēng wēixiǎn.","translation":"길을 건널 때 계속 고개를 숙여 휴대전화를 보면 위험해요."},{"no":1016,"category":"동작·감각·생각","word":"动手","pinyin":"dòngshǒu","meaning":"직접 해 보다, 착수하다; 손찌검하다","example":"动手实验之前，先想清楚要验证什么问题。","examplePinyin":"Dòngshǒu shíyàn zhīqián, xiān xiǎng qīngchu yào yànzhèng shénme wèntí.","translation":"직접 실험하기 전에 무엇을 검증할지 먼저 분명히 생각하세요."},{"no":1017,"category":"동작·감각·생각","word":"堵","pinyin":"dǔ","meaning":"막다, 막히다","example":"消防通道不能堵，哪怕只是临时放几件物品。","examplePinyin":"Xiāofáng tōngdào bùnéng dǔ, nǎpà zhǐshì línshí fàng jǐ jiàn wùpǐn.","translation":"잠시 물건 몇 개를 두더라도 소방 통로를 막으면 안 돼요."},{"no":1018,"category":"동작·감각·생각","word":"堆","pinyin":"duī","meaning":"쌓다, 더미","example":"把资料堆在桌上而不分类，查找时就会浪费时间。","examplePinyin":"Bǎ zīliào duī zài zhuōshàng ér bù fēnlèi, cházhǎo shí jiù huì làngfèi shíjiān.","translation":"자료를 분류하지 않고 책상에 쌓아 두면 찾을 때 시간이 낭비돼요."},{"no":1019,"category":"동작·감각·생각","word":"躲","pinyin":"duǒ","meaning":"피하다, 숨다","example":"遇到矛盾不能总是躲，要学会主动沟通。","examplePinyin":"Yùdào máodùn bùnéng zǒngshì duǒ, yào xuéhuì zhǔdòng gōutōng.","translation":"갈등이 생길 때마다 피하지 말고 먼저 소통하는 법을 배워야 해요."},{"no":1020,"category":"동작·감각·생각","word":"翻","pinyin":"fān","meaning":"뒤집다, 넘기다","example":"翻看旧日记时，她发现自己的想法改变了不少。","examplePinyin":"Fānkàn jiù rìjì shí, tā fāxiàn zìjǐ de xiǎngfǎ gǎibiàn le bùshǎo.","translation":"옛 일기장을 넘겨 보며 그녀는 생각이 많이 달라졌음을 알았어요."},{"no":1021,"category":"동작·감각·생각","word":"扶","pinyin":"fú","meaning":"부축하다, 받치다 / 붙들다","example":"她轻轻扶住老人，陪他慢慢走下台阶。","examplePinyin":"Tā qīngqīng fúzhù lǎorén, péi tā mànmàn zǒu xià táijiē.","translation":"그녀는 노인을 살며시 부축해 함께 천천히 계단을 내려왔어요."},{"no":1022,"category":"동작·감각·생각","word":"盖","pinyin":"gài","meaning":"덮다, 씌우다","example":"为防止灰尘落入，他给设备盖上了防护罩。","examplePinyin":"Wèi fángzhǐ huīchén luòrù, tā gěi shèbèi gài shàng le fánghùzhào.","translation":"먼지가 들어가지 않도록 그는 장비에 보호 덮개를 씌웠어요."},{"no":1023,"category":"동작·감각·생각","word":"滚","pinyin":"gǔn","meaning":"굴리다, 끓다 / 구르다","example":"石头沿着山坡滚下来，幸好被防护网挡住。","examplePinyin":"Shítou yánzhe shānpō gǔnxiàlai, xìnghǎo bèi fánghùwǎng dǎngzhù.","translation":"돌이 산비탈을 굴러 내려왔지만 다행히 방호망에 걸렸어요."},{"no":1024,"category":"동작·감각·생각","word":"挥","pinyin":"huī","meaning":"휘두르다, 흔들다 / 발휘하다","example":"他朝站台上的亲人挥了挥手，转身走进车厢。","examplePinyin":"Tā cháo zhàntái shàng de qīnrén huī le huishǒu, zhuǎnshēn zǒujìn chēxiāng.","translation":"그는 승강장의 가족에게 손을 흔들고 객차로 들어갔어요."},{"no":1025,"category":"동작·감각·생각","word":"系","pinyin":"jì","meaning":"매다, 묶다","example":"把安全绳系牢以后，他才开始检查外墙。","examplePinyin":"Bǎ ānquán shéng jìláo yǐhòu, tā cái kāishǐ jiǎnchá wàiqiáng.","translation":"안전줄을 단단히 묶은 뒤에야 그는 외벽을 점검하기 시작했어요."},{"no":1026,"category":"동작·감각·생각","word":"挤","pinyin":"jǐ","meaning":"밀어넣다, 끼우다","example":"大家按顺序上车，不要互相推挤。","examplePinyin":"Dàjiā àn shùnxù shàngchē, búyào hùxiāng tuījǐ.","translation":"서로 밀지 말고 차례대로 차에 타세요."},{"no":1027,"category":"동작·감각·생각","word":"捡","pinyin":"jiǎn","meaning":"줍다, 집다","example":"捡到证件后，他没有离开，而是联系了失主。","examplePinyin":"Jiǎn dào zhèngjiàn hòu, tā méiyǒu líkāi, érshì liánxì le shīzhǔ.","translation":"증명서를 주운 그는 자리를 떠나지 않고 주인에게 연락했어요."},{"no":1028,"category":"동작·감각·생각","word":"剪","pinyin":"jiǎn","meaning":"자르다","example":"这些旧布剪成小块后，可以用来制作手工玩具。","examplePinyin":"Zhèxiē jiù bù jiǎnchéng xiǎo kuài hòu, kěyǐ yònglái zhìzuò shǒugōng wánjù.","translation":"이 낡은 천은 작게 자르면 수제 장난감을 만드는 데 쓸 수 있어요."},{"no":1029,"category":"동작·감각·생각","word":"脚步","pinyin":"jiǎobù","meaning":"발걸음, 보폭","example":"听到走廊里的脚步声，她放下书走去开门。","examplePinyin":"Tīngdào zǒuláng lǐ de jiǎobùshēng, tā fàngxià shū zǒu qù kāimén.","translation":"복도의 발소리를 듣자 그녀는 책을 내려놓고 문을 열러 갔어요."},{"no":1030,"category":"동작·감각·생각","word":"结","pinyin":"jié","meaning":"묶다, 매듭짓다; 맺다; 매듭","example":"他在绳子末端结了一个结，防止绳子滑落。","examplePinyin":"Tā zài shéngzi mòduān jié le yí ge jié, fángzhǐ shéngzi huáluò.","translation":"그는 밧줄이 미끄러지지 않도록 끝에 매듭을 지었어요."},{"no":1031,"category":"동작·감각·생각","word":"集合","pinyin":"jíhé","meaning":"모이다, 집합하다","example":"队员们按约定时间集合，然后分组前往现场。","examplePinyin":"Duìyuánmen àn yuēdìng shíjiān jíhé, ránhòu fēnzǔ qiánwǎng xiànchǎng.","translation":"팀원들은 약속 시간에 모여 조별로 현장으로 갔어요."},{"no":1032,"category":"동작·감각·생각","word":"领","pinyin":"lǐng","meaning":"이끌다, 데리고 가다; 받다; 옷깃","example":"工作人员领着新同事，熟悉各个部门的位置。","examplePinyin":"Gōngzuò rényuán lǐng zhe xīn tóngshì, shúxī gège bùmén de wèizhi.","translation":"직원은 신입 동료를 데리고 다니며 부서별 위치를 알려 줬어요."},{"no":1033,"category":"동작·감각·생각","word":"摸","pinyin":"mō","meaning":"더듬다, 만지작거리다","example":"他摸了摸箱子的边角，确认没有尖锐部分。","examplePinyin":"Tā mō le mo xiāngzi de biānjiǎo, quèrèn méiyǒu jiānruì bùfen.","translation":"그는 상자 모서리를 만져 뾰족한 부분이 없는지 확인했어요."},{"no":1034,"category":"동작·감각·생각","word":"碰","pinyin":"pèng","meaning":"부딪치다, 마주치다","example":"搬运时不小心碰到墙角，箱子的边缘破了。","examplePinyin":"Bānyùn shí bù xiǎoxīn pèngdào qiángjiǎo, xiāngzi de biānyuán pò le.","translation":"옮기다가 벽 모퉁이에 부딪쳐 상자 가장자리가 찢어졌어요."},{"no":1035,"category":"동작·감각·생각","word":"拼","pinyin":"pīn","meaning":"맞추다, 짜다 / 모으다","example":"孩子们把零散的木块拼成了一座小桥。","examplePinyin":"Háizimen bǎ língsǎn de mùkuài pīnchéng le yí zuò xiǎoqiáo.","translation":"아이들은 흩어진 나무 조각을 맞춰 작은 다리를 만들었어요."},{"no":1036,"category":"동작·감각·생각","word":"抢","pinyin":"qiǎng","meaning":"빼앗다, 쟁탈하다; 앞다투다","example":"上下车时不要抢，按顺序反而能提高效率。","examplePinyin":"Shàngxiàchē shí búyào qiǎng, àn shùnxù fǎn'ér néng tígāo xiàolǜ.","translation":"타고 내릴 때는 서두르지 말고 순서를 지켜야 오히려 더 빨라요."},{"no":1037,"category":"동작·감각·생각","word":"洒","pinyin":"sǎ","meaning":"뿌리다, 흩뿌리다","example":"施工人员在路面适量洒水，以减少灰尘。","examplePinyin":"Shīgōng rényuán zài lùmiàn shìliàng sǎshuǐ, yǐ jiǎnshǎo huīchén.","translation":"작업자들은 먼지를 줄이려고 노면에 적당히 물을 뿌렸어요."},{"no":1038,"category":"동작·감각·생각","word":"扇","pinyin":"shān","meaning":"부치다, 부채질하다","example":"老人拿起蒲扇轻轻扇着，继续讲述年轻时的故事。","examplePinyin":"Lǎorén ná qǐ púshàn qīngqīng shān zhe, jìxù jiǎngshù niánqīng shí de gùshi.","translation":"노인은 부채로 살살 부채질하며 젊을 때 이야기를 계속했어요."},{"no":1039,"category":"동작·감각·생각","word":"伸","pinyin":"shēn","meaning":"뻗다, 내밀다","example":"他伸手扶住晃动的架子，避免上面的东西掉落。","examplePinyin":"Tā shēnshǒu fúzhù huàngdòng de jiàzi, bìmiǎn shàngmiàn de dōngxi diàoluò.","translation":"그는 손을 뻗어 흔들리는 선반을 잡아 물건이 떨어지지 않게 했어요."},{"no":1040,"category":"동작·감각·생각","word":"摔","pinyin":"shuāi","meaning":"넘어지다, 떨어뜨리다","example":"雨天搬运物品时，要注意防滑，避免摔伤。","examplePinyin":"Yǔtiān bānyùn wùpǐn shí, yào zhùyì fánghuá, bìmiǎn shuāishāng.","translation":"비 오는 날 짐을 옮길 때는 미끄러져 다치지 않도록 주의하세요."},{"no":1041,"category":"동작·감각·생각","word":"贴","pinyin":"tiē","meaning":"붙이다, 부착하다","example":"请把警示贴在容易看见的地方，而不是藏在角落。","examplePinyin":"Qǐng bǎ jǐngshì tiē zài róngyì kànjiàn de dìfang, ér búshì cáng zài jiǎoluò.","translation":"경고문은 구석이 아니라 잘 보이는 곳에 붙여 주세요."},{"no":1042,"category":"동작·감각·생각","word":"投","pinyin":"tóu","meaning":"던지다, 투표","example":"请把废旧电池投进专门的回收箱，不要混入生活垃圾。","examplePinyin":"Qǐng bǎ fèijiù diànchí tóujìn zhuānmén de huíshōu xiāng, búyào hùnrù shēnghuó lājī.","translation":"폐건전지는 생활 쓰레기에 섞지 말고 전용 수거함에 넣으세요."},{"no":1043,"category":"동작·감각·생각","word":"围","pinyin":"wéi","meaning":"둘러싸다, 감다","example":"大家围着地图讨论，确定了第二天的调查路线。","examplePinyin":"Dàjiā wéizhe dìtú tǎolùn, quèdìng le dì'èrtiān de diàochá lùxiàn.","translation":"모두 지도를 둘러싸고 논의해 다음 날의 조사 경로를 정했어요."},{"no":1044,"category":"동작·감각·생각","word":"围绕","pinyin":"wéirào","meaning":"둘러싸다; ~을 중심으로 하다","example":"讨论始终围绕实际问题，没有停留在空泛口号上。","examplePinyin":"Tǎolùn shǐzhōng wéirào shíjì wèntí, méiyǒu tíngliú zài kōngfàn kǒuhào shàng.","translation":"논의는 막연한 구호가 아니라 실제 문제를 중심으로 진행됐어요."},{"no":1045,"category":"동작·감각·생각","word":"握","pinyin":"wò","meaning":"쥐다, 잡다","example":"走下陡坡时，他握紧栏杆，一步一步向前。","examplePinyin":"Zǒu xià dǒupō shí, tā wòjǐn lángān, yí bù yi bù xiàngqián.","translation":"급경사를 내려가며 그는 난간을 꼭 잡고 한 걸음씩 나아갔어요."},{"no":1046,"category":"동작·감각·생각","word":"摇","pinyin":"yáo","meaning":"흔들다, 흔들리다","example":"他轻轻摇了摇头，表示还不能确定最终结果。","examplePinyin":"Tā qīngqīng yáo le yaotóu, biǎoshì hái bùnéng quèdìng zuìzhōng jiéguǒ.","translation":"그는 고개를 살짝 저으며 아직 결과를 확정할 수 없다고 했어요."},{"no":1047,"category":"동작·감각·생각","word":"咬","pinyin":"yǎo","meaning":"물다, 깨물다","example":"这种果实不能直接咬开，需要先处理外皮。","examplePinyin":"Zhè zhǒng guǒshí bùnéng zhíjiē yǎo kāi, xūyào xiān chǔlǐ wàipí.","translation":"이 열매는 바로 깨물 수 없어 먼저 껍질을 처리해야 해요."},{"no":1048,"category":"동작·감각·생각","word":"移","pinyin":"yí","meaning":"옮기다, 이전하다","example":"为了让出通道，工作人员把展板移到了墙边。","examplePinyin":"Wèile ràngchū tōngdào, gōngzuò rényuán bǎ zhǎnbǎn yí dào le qiángbiān.","translation":"통로를 비우려고 직원들이 전시판을 벽 쪽으로 옮겼어요."},{"no":1049,"category":"동작·감각·생각","word":"移动","pinyin":"yídòng","meaning":"이동하다, 움직이다","example":"这套设备便于移动，适合在不同场地使用。","examplePinyin":"Zhè tào shèbèi biànyú yídòng, shìhé zài bùtóng chǎngdì shǐyòng.","translation":"이 장비는 이동하기 쉬워 여러 장소에서 사용하기 좋아요."},{"no":1050,"category":"동작·감각·생각","word":"用力","pinyin":"yònglì","meaning":"힘쓰다, 힘을 쓰다","example":"搬运时不要突然用力，以免造成身体损伤。","examplePinyin":"Bānyùn shí búyào tūrán yònglì, yǐmiǎn zàochéng shēntǐ sǔnshāng.","translation":"짐을 옮길 때는 몸을 다치지 않도록 갑자기 힘을 주지 마세요."},{"no":1051,"category":"동작·감각·생각","word":"摘","pinyin":"zhāi","meaning":"따다, 뽑다","example":"为了保护花木，请不要随意摘花或折枝。","examplePinyin":"Wèile bǎohù huāmù, qǐng búyào suíyì zhāihuā huò zhézhī.","translation":"꽃과 나무를 보호하도록 함부로 꽃을 따거나 가지를 꺾지 마세요."},{"no":1052,"category":"동작·감각·생각","word":"支1","pinyin":"zhī","meaning":"받치다, 지탱하다; 지불하다","example":"用木板把棚子支起来，可以暂时遮挡风雨。","examplePinyin":"Yòng mùbǎn bǎ péngzi zhī qǐlai, kěyǐ zànshí zhēdǎng fēngyǔ.","translation":"널빤지로 천막을 받쳐 세우면 잠시 비바람을 막을 수 있어요."},{"no":1053,"category":"동작·감각·생각","word":"抓","pinyin":"zhuā","meaning":"잡다, 붙잡다; 파악하다","example":"处理复杂问题，要先抓住最关键的矛盾。","examplePinyin":"Chǔlǐ fùzá wèntí, yào xiān zhuāzhù zuì guānjiàn de máodùn.","translation":"복잡한 문제를 다룰 때는 가장 핵심적인 갈등부터 파악해야 해요."},{"no":1054,"category":"동작·감각·생각","word":"撞","pinyin":"zhuàng","meaning":"부딪치다, 충돌하다","example":"搬动长桌时要留意转角，避免撞到旁边的人。","examplePinyin":"Bāndòng chángzhuō shí yào liúyì zhuǎnjiǎo, bìmiǎn zhuàng dào pángbiān de rén.","translation":"긴 탁자를 옮길 때는 주변 사람과 부딪치지 않도록 모퉁이를 주의하세요."},{"no":1055,"category":"동작·감각·생각","word":"追","pinyin":"zhuī","meaning":"쫓다, 추구하다","example":"看到公交车已启动，他没有冒险追，而是等下一班。","examplePinyin":"Kàndào gōngjiāochē yǐ qǐdòng, tā méiyǒu màoxiǎn zhuī, érshì děng xià yì bān.","translation":"버스가 출발하자 그는 위험하게 쫓지 않고 다음 차를 기다렸어요."},{"no":1056,"category":"동작·감각·생각","word":"保持","pinyin":"bǎochí","meaning":"유지하다, 계속하다 / 보존하다","example":"越是情况复杂，越要保持清醒的判断。","examplePinyin":"Yuè shì qíngkuàng fùzá, yuè yào bǎochí qīngxǐng de pànduàn.","translation":"상황이 복잡할수록 냉철한 판단력을 유지해야 해요."},{"no":1057,"category":"동작·감각·생각","word":"避免","pinyin":"bìmiǎn","meaning":"피하다, 면하다","example":"提前沟通需求，可以避免后期反复修改。","examplePinyin":"Tíqián gōutōng xūqiú, kěyǐ bìmiǎn hòuqī fǎnfù xiūgǎi.","translation":"요구 사항을 미리 의논하면 나중에 거듭 수정하는 일을 피할 수 있어요."},{"no":1058,"category":"동작·감각·생각","word":"采取","pinyin":"cǎiqǔ","meaning":"채택하다, 취하다","example":"面对持续上涨的成本，企业采取了节能措施。","examplePinyin":"Miànduì chíxù shàngzhǎng de chéngběn, qǐyè cǎiqǔ le jiénéng cuòshī.","translation":"계속 오르는 비용에 대응해 기업이 에너지 절약 조치를 취했어요."},{"no":1059,"category":"동작·감각·생각","word":"采用","pinyin":"cǎiyòng","meaning":"채용하다, 사용하다","example":"学校采用小组讨论的方式，鼓励学生主动思考。","examplePinyin":"Xuéxiào cǎiyòng xiǎozǔ tǎolùn de fāngshì, gǔlì xuésheng zhǔdòng sīkǎo.","translation":"학교는 모둠 토론을 도입해 학생들의 능동적인 사고를 장려해요."},{"no":1060,"category":"동작·감각·생각","word":"藏","pinyin":"cáng","meaning":"감추다, 숨기다 / 소장하다","example":"这座古宅里藏着许多关于当地历史的故事。","examplePinyin":"Zhè zuò gǔzhái lǐ cáng zhe xǔduō guānyú dāngdì lìshǐ de gùshi.","translation":"이 고택에는 지역 역사에 관한 이야기가 많이 숨겨져 있어요."},{"no":1061,"category":"동작·감각·생각","word":"参与","pinyin":"cānyù","meaning":"참여하다, 관여하다","example":"让居民参与决策，有助于提高政策的实际效果。","examplePinyin":"Ràng jūmín cānyù juécè, yǒuzhùyú tígāo zhèngcè de shíjì xiàoguǒ.","translation":"주민을 의사 결정에 참여시키면 정책 효과를 높이는 데 도움이 돼요."},{"no":1062,"category":"동작·감각·생각","word":"重复","pinyin":"chóngfù","meaning":"반복하다, 되풀이하다","example":"每天重复同样的动作，也可以不断改进方法。","examplePinyin":"Měi tiān chóngfù tóngyàng de dòngzuò, yě kěyǐ búduàn gǎijìn fāngfǎ.","translation":"매일 같은 동작을 반복하더라도 방법을 계속 개선할 수 있어요."},{"no":1063,"category":"동작·감각·생각","word":"创造","pinyin":"chuàngzào","meaning":"창조하다, 만들다","example":"新技术在创造便利的同时，也可能带来新问题。","examplePinyin":"Xīn jìshù zài chuàngzào biànlì de tóngshí, yě kěnéng dàilái xīn wèntí.","translation":"신기술은 편의를 만들어 내는 동시에 새로운 문제도 낳을 수 있어요."},{"no":1064,"category":"동작·감각·생각","word":"处理","pinyin":"chǔlǐ","meaning":"처리하다, 다루다","example":"处理邻里纠纷时，首先要耐心听取双方意见。","examplePinyin":"Chǔlǐ línlǐ jiūfēn shí, shǒuxiān yào nàixīn tīngqǔ shuāngfāng yìjiàn.","translation":"이웃 간 분쟁을 처리할 때는 먼저 양측의 의견을 들어야 해요."},{"no":1065,"category":"동작·감각·생각","word":"存放","pinyin":"cúnfàng","meaning":"보관하다, 맡기다","example":"危险物品应分类存放，并由专人负责管理。","examplePinyin":"Wēixiǎn wùpǐn yīng fēnlèi cúnfàng, bìng yóu zhuānrén fùzé guǎnlǐ.","translation":"위험물은 분류해 보관하고 전담자가 관리해야 해요."},{"no":1066,"category":"동작·감각·생각","word":"代替","pinyin":"dàitì","meaning":"대신하다, 대체하다","example":"再先进的设备，也不能完全代替人的判断。","examplePinyin":"Zài xiānjìn de shèbèi, yě bùnéng wánquán dàitì rén de pànduàn.","translation":"아무리 발전한 장비도 사람의 판단을 완전히 대신할 수는 없어요."},{"no":1067,"category":"동작·감각·생각","word":"打破","pinyin":"dǎpò","meaning":"깨다, 파괴하다","example":"新的研究结果，打破了人们对这种材料的旧认识。","examplePinyin":"Xīn de yánjiū jiéguǒ, dǎpò le rénmen duì zhè zhǒng cáiliào de jiù rènshi.","translation":"새 연구 결과는 이 소재에 대한 기존 인식을 깨뜨렸어요."},{"no":1068,"category":"동작·감각·생각","word":"发挥","pinyin":"fāhuī","meaning":"발휘하다, 나타내다","example":"只有分工合理，团队才能发挥整体优势。","examplePinyin":"Zhǐyǒu fēngōng hélǐ, tuánduì cái néng fāhuī zhěngtǐ yōushì.","translation":"업무를 합리적으로 나눠야 팀 전체의 장점을 발휘할 수 있어요."},{"no":1069,"category":"동작·감각·생각","word":"防止","pinyin":"fángzhǐ","meaning":"막다, 방지하다","example":"建立公开的监督机制，有助于防止权力滥用。","examplePinyin":"Jiànlì gōngkāi de jiāndū jīzhì, yǒuzhùyú fángzhǐ quánlì lànyòng.","translation":"공개된 감독 체계는 권력 남용을 막는 데 도움이 돼요."},{"no":1070,"category":"동작·감각·생각","word":"分类","pinyin":"fēnlèi","meaning":"분류하다, 나누다","example":"把垃圾正确分类，是回收利用的重要前提。","examplePinyin":"Bǎ lājī zhèngquè fēnlèi, shì huíshōu lìyòng de zhòngyào qiántí.","translation":"쓰레기를 올바르게 분류하는 것은 재활용의 중요한 전제예요."},{"no":1071,"category":"동작·감각·생각","word":"改进","pinyin":"gǎijìn","meaning":"개량하다, 개선하다","example":"根据使用者的反馈，设计团队改进了操作界面。","examplePinyin":"Gēnjù shǐyòngzhě de fǎnkuì, shèjì tuánduì gǎijìn le cāozuò jièmiàn.","translation":"설계팀은 사용자의 의견을 바탕으로 조작 화면을 개선했어요."},{"no":1072,"category":"동작·감각·생각","word":"改正","pinyin":"gǎizhèng","meaning":"고치다, 시정하다","example":"发现统计错误后，研究人员立即改正并作出说明。","examplePinyin":"Fāxiàn tǒngjì cuòwù hòu, yánjiū rényuán lìjí gǎizhèng bìng zuòchū shuōmíng.","translation":"통계 오류를 발견한 연구진은 즉시 수정하고 설명했어요."},{"no":1073,"category":"동작·감각·생각","word":"搞","pinyin":"gǎo","meaning":"하다, 만들다 (구어)","example":"先把问题搞清楚，再考虑用什么办法解决。","examplePinyin":"Xiān bǎ wèntí gǎoqīngchu, zài kǎolǜ yòng shénme bànfǎ jiějué.","translation":"먼저 문제를 분명히 파악한 뒤 해결 방법을 생각하세요."},{"no":1074,"category":"동작·감각·생각","word":"更换","pinyin":"gēnghuàn","meaning":"바꾸다, 교체하다","example":"定期更换过滤材料，可以保持设备正常运行。","examplePinyin":"Dìngqī gēnghuàn guòlǜ cáiliào, kěyǐ bǎochí shèbèi zhèngcháng yùnxíng.","translation":"여과재를 정기적으로 교체하면 설비가 정상적으로 작동해요."},{"no":1075,"category":"동작·감각·생각","word":"关闭","pinyin":"guānbì","meaning":"닫다, 폐쇄하다; 끄다","example":"离开会议室前，请关闭投影仪和照明设备。","examplePinyin":"Líkāi huìyìshì qián, qǐng guānbì tóuyǐngyí hé zhàomíng shèbèi.","translation":"회의실을 떠나기 전에 프로젝터와 조명을 꺼 주세요."},{"no":1076,"category":"동작·감각·생각","word":"合","pinyin":"hé","meaning":"맞다, 합치다 / 합계","example":"几位同事合办了一场讲座，介绍各自的专业经验。","examplePinyin":"Jǐ wèi tóngshì hébàn le yì chǎng jiǎngzuò, jièshào gèzì de zhuānyè jīngyàn.","translation":"동료 몇 명이 강연을 공동 개최해 각자의 전문 경험을 소개했어요."},{"no":1077,"category":"동작·감각·생각","word":"环节","pinyin":"huánjié","meaning":"단계, 과정의 한 부분; 고리","example":"任何一个环节出问题，都可能影响整个生产流程。","examplePinyin":"Rènhé yí ge huánjié chū wèntí, dōu kěnéng yǐngxiǎng zhěngge shēngchǎn liúchéng.","translation":"어느 한 단계에 문제가 생겨도 전체 생산 과정에 영향을 줄 수 있어요."},{"no":1078,"category":"동작·감각·생각","word":"结合","pinyin":"jiéhé","meaning":"결합하다, 합치다","example":"把理论与实际结合起来，知识才更容易被理解。","examplePinyin":"Bǎ lǐlùn yǔ shíjì jiéhé qǐlai, zhīshi cái gèng róngyì bèi lǐjiě.","translation":"이론과 실제를 결합해야 지식을 이해하기가 더 쉬워요."},{"no":1079,"category":"동작·감각·생각","word":"节省","pinyin":"jiéshěng","meaning":"절약하다, 아끼다","example":"共享工具可以节省开支，也能减少闲置浪费。","examplePinyin":"Gòngxiǎng gōngjù kěyǐ jiéshěng kāizhī, yě néng jiǎnshǎo xiánzhì làngfèi.","translation":"공구를 공유하면 지출을 아끼고 방치로 인한 낭비도 줄여요."},{"no":1080,"category":"동작·감각·생각","word":"集中","pinyin":"jízhōng","meaning":"집중하다, 모으다","example":"把有限的资源集中起来，先解决最紧迫的问题。","examplePinyin":"Bǎ yǒuxiàn de zīyuán jízhōng qǐlai, xiān jiějué zuì jǐnpò de wèntí.","translation":"한정된 자원을 모아 가장 시급한 문제부터 해결하세요."},{"no":1081,"category":"동작·감각·생각","word":"控制","pinyin":"kòngzhì","meaning":"통제하다, 제어하다","example":"控制成本不能以降低安全标准为前提。","examplePinyin":"Kòngzhì chéngběn bùnéng yǐ jiàngdī ānquán biāozhǔn wéi qiántí.","translation":"비용을 줄이기 위해 안전 기준을 낮춰서는 안 돼요."},{"no":1082,"category":"동작·감각·생각","word":"连接","pinyin":"liánjiē","meaning":"연결하다, 접속하다","example":"这条小路连接着学校和村庄，是孩子们的必经之路。","examplePinyin":"Zhè tiáo xiǎolù liánjiē zhe xuéxiào hé cūnzhuāng, shì háizimen de bìjīng zhī lù.","translation":"이 작은 길은 학교와 마을을 연결하는 아이들의 필수 통학로예요."},{"no":1083,"category":"동작·감각·생각","word":"利用","pinyin":"lìyòng","meaning":"이용하다, 활용하다","example":"合理利用闲置空间，可以增加社区的活动场地。","examplePinyin":"Hélǐ lìyòng xiánzhì kōngjiān, kěyǐ zēngjiā shèqū de huódòng chǎngdì.","translation":"빈 공간을 적절히 활용하면 주민 활동 장소를 늘릴 수 있어요."},{"no":1084,"category":"동작·감각·생각","word":"排列","pinyin":"páiliè","meaning":"배열하다, 정리하다","example":"资料按照时间顺序排列，更便于观察发展过程。","examplePinyin":"Zīliào ànzhào shíjiān shùnxù páiliè, gèng biànyú guānchá fāzhǎn guòchéng.","translation":"자료를 시간순으로 배열하면 발전 과정을 관찰하기 쉬워요."},{"no":1085,"category":"동작·감각·생각","word":"配","pinyin":"pèi","meaning":"배합하다,조합하다/걸맞다","example":"修复古建筑时，要配上与原有风格一致的材料。","examplePinyin":"Xiūfù gǔjiànzhù shí, yào pèi shàng yǔ yuányǒu fēnggé yízhì de cáiliào.","translation":"고건축물을 복원할 때는 원래 양식과 어울리는 자재를 써야 해요."},{"no":1086,"category":"동작·감각·생각","word":"确保","pinyin":"quèbǎo","meaning":"확보하다, 보장하다","example":"反复检查细节，是为了确保每位参与者的安全。","examplePinyin":"Fǎnfù jiǎnchá xìjié, shì wèile quèbǎo měi wèi cānyùzhě de ānquán.","translation":"세부 사항을 거듭 점검하는 것은 모든 참가자의 안전을 보장하기 위해서예요."},{"no":1087,"category":"동작·감각·생각","word":"省2","pinyin":"shěng","meaning":"절약하다, 아끼다 / 성(省)","example":"统一采购虽然省钱，但仍要保证产品质量。","examplePinyin":"Tǒngyī cǎigòu suīrán shěngqián, dàn réng yào bǎozhèng chǎnpǐn zhìliàng.","translation":"공동 구매로 비용을 아끼더라도 제품의 질은 보장해야 해요."},{"no":1088,"category":"동작·감각·생각","word":"收集","pinyin":"shōují","meaning":"수집하다, 모으다","example":"收集个人资料时，只应保留完成任务所需的部分。","examplePinyin":"Shōují gèrén zīliào shí, zhǐ yīng bǎoliú wánchéng rènwu suǒ xū de bùfen.","translation":"개인 자료는 업무에 필요한 부분만 수집하고 보관해야 해요."},{"no":1089,"category":"동작·감각·생각","word":"填","pinyin":"tián","meaning":"채우다, 메우다","example":"填申请表时，应保证信息真实而且完整。","examplePinyin":"Tián shēnqǐngbiǎo shí, yīng bǎozhèng xìnxī zhēnshí érqiě wánzhěng.","translation":"신청서를 작성할 때는 정보를 사실대로 빠짐없이 적어야 해요."},{"no":1090,"category":"동작·감각·생각","word":"调","pinyin":"tiáo","meaning":"조절하다, 고르다 / 뒤섞다","example":"会议开始前，他把麦克风的音量调低了一些。","examplePinyin":"Huìyì kāishǐ qián, tā bǎ màikèfēng de yīnliàng tiáodī le yìxiē.","translation":"회의 전에 그는 마이크 음량을 조금 낮췄어요."},{"no":1091,"category":"동작·감각·생각","word":"调整","pinyin":"tiáozhěng","meaning":"조정하다, 정리하다","example":"需求发生变化以后，团队及时调整了任务顺序。","examplePinyin":"Xūqiú fāshēng biànhuà yǐhòu, tuánduì jíshí tiáozhěng le rènwu shùnxù.","translation":"수요가 바뀐 뒤 팀은 업무 순서를 제때 조정했어요."},{"no":1092,"category":"동작·감각·생각","word":"统一","pinyin":"tǒngyī","meaning":"통일하다, 하나로 만들다","example":"统一服务标准，不意味着忽视个别人的特殊需求。","examplePinyin":"Tǒngyī fúwù biāozhǔn, bú yìwèizhe hūshì gèbié ren de tèshū xūqiú.","translation":"서비스 기준을 통일한다고 개별적인 필요를 무시하는 것은 아니에요."},{"no":1093,"category":"동작·감각·생각","word":"突出","pinyin":"tūchū","meaning":"두드러지다, 돌출하다; 부각하다, 강조하다","example":"汇报时间有限，最好突出最重要的发现。","examplePinyin":"Huìbào shíjiān yǒuxiàn, zuìhǎo tūchū zuì zhòngyào de fāxiàn.","translation":"보고 시간이 제한돼 있으니 가장 중요한 발견을 강조하는 게 좋아요."},{"no":1094,"category":"동작·감각·생각","word":"推广","pinyin":"tuīguǎng","meaning":"보급하다, 확산시키다","example":"推广新技术时，必须考虑实际使用者的接受能力。","examplePinyin":"Tuīguǎng xīn jìshù shí, bìxū kǎolǜ shíjì shǐyòngzhě de jiēshòu nénglì.","translation":"신기술을 보급할 때는 실제 사용자의 수용 능력을 고려해야 해요."},{"no":1095,"category":"동작·감각·생각","word":"推进","pinyin":"tuījìn","meaning":"추진하다, 진전시키다","example":"推进改革需要目标明确，也需要听取不同意见。","examplePinyin":"Tuījìn gǎigé xūyào mùbiāo míngquè, yě xūyào tīngqǔ bùtóng yìjiàn.","translation":"개혁을 추진하려면 목표가 분명해야 하고 다양한 의견도 들어야 해요."},{"no":1096,"category":"동작·감각·생각","word":"完善","pinyin":"wánshàn","meaning":"완성하다, 개선하다","example":"根据试点反馈，相关部门进一步完善了申请流程。","examplePinyin":"Gēnjù shìdiǎn fǎnkuì, xiāngguān bùmén jìn yí bù wánshàn le shēnqǐng liúchéng.","translation":"관계 부처는 시범 사업의 의견을 받아 신청 절차를 더 보완했어요."},{"no":1097,"category":"동작·감각·생각","word":"维持","pinyin":"wéichí","meaning":"유지하다, 지속하다","example":"维持老客户的信任，有时比吸引新客户更困难。","examplePinyin":"Wéichí lǎo kèhù de xìnrèn, yǒushí bǐ xīyǐn xīn kèhù gèng kùnnan.","translation":"기존 고객의 신뢰를 유지하는 것이 신규 고객 유치보다 어렵기도 해요."},{"no":1098,"category":"동작·감각·생각","word":"限制","pinyin":"xiànzhì","meaning":"제한하다, 한계","example":"限制私家车通行之前，应先改善替代交通服务。","examplePinyin":"Xiànzhì sījiāchē tōngxíng zhīqián, yīng xiān gǎishàn tìdài jiāotōng fúwù.","translation":"자가용 통행을 제한하기 전에 대체 교통 서비스를 개선해야 해요."},{"no":1099,"category":"동작·감각·생각","word":"行动","pinyin":"xíngdòng","meaning":"행동, 행동하다; 움직이다","example":"了解问题只是开始，接下来还需要具体行动。","examplePinyin":"Liǎojiě wèntí zhǐshì kāishǐ, jiēxiàlai hái xūyào jùtǐ xíngdòng.","translation":"문제를 이해하는 것은 시작이며 이후 구체적인 행동이 필요해요."},{"no":1100,"category":"동작·감각·생각","word":"行为","pinyin":"xíngwéi","meaning":"행동, 짓","example":"判断一个人，要看长期行为，而不只是一次表态。","examplePinyin":"Pànduàn yí ge rén, yào kàn chángqī xíngwéi, ér bù zhǐshì yí cì biǎotài.","translation":"사람은 한 번 밝힌 입장보다 오랜 행동을 보고 판단해야 해요."},{"no":1101,"category":"동작·감각·생각","word":"修改","pinyin":"xiūgǎi","meaning":"수정하다, 고치다","example":"根据反馈修改方案，有时比坚持原想法更有价值。","examplePinyin":"Gēnjù fǎnkuì xiūgǎi fāng'àn, yǒushí bǐ jiānchí yuán xiǎngfǎ gèng yǒu jiàzhí.","translation":"의견에 따라 방안을 고치는 것이 처음 생각을 고수하는 것보다 가치 있을 때도 있어요."},{"no":1102,"category":"동작·감각·생각","word":"应对","pinyin":"yìngduì","meaning":"대응하다, 대처하다","example":"应对突发变化，需要预案，也需要现场判断。","examplePinyin":"Yìngduì tūfā biànhuà, xūyào yù'àn, yě xūyào xiànchǎng pànduàn.","translation":"갑작스러운 변화에 대응하려면 사전 계획과 현장 판단이 필요해요."},{"no":1103,"category":"동작·감각·생각","word":"运用","pinyin":"yùnyòng","meaning":"운용하다, 활용하다","example":"灵活运用所学知识，才说明真正理解了原理。","examplePinyin":"Línghuó yùnyòng suǒ xué zhīshi, cái shuōmíng zhēnzhèng lǐjiě le yuánlǐ.","translation":"배운 지식을 유연하게 활용해야 원리를 제대로 이해했다고 할 수 있어요."},{"no":1104,"category":"동작·감각·생각","word":"展开","pinyin":"zhǎnkāi","meaning":"전개하다, 펼치다","example":"调查围绕三个方面展开，并持续记录不同意见。","examplePinyin":"Diàochá wéirào sān ge fāngmiàn zhǎnkāi, bìng chíxù jìlù bùtóng yìjiàn.","translation":"조사는 세 가지 측면에서 진행됐고 다양한 의견도 계속 기록했어요."},{"no":1105,"category":"동작·감각·생각","word":"组合","pinyin":"zǔhé","meaning":"조합하다, 결합하다","example":"把不同功能合理组合，可以减少重复建设。","examplePinyin":"Bǎ bùtóng gōngnéng hélǐ zǔhé, kěyǐ jiǎnshǎo chóngfù jiànshè.","translation":"서로 다른 기능을 적절히 결합하면 중복 구축을 줄일 수 있어요."},{"no":1106,"category":"동작·감각·생각","word":"阻止","pinyin":"zǔzhǐ","meaning":"저지하다, 막다","example":"及时交流信息，能够阻止小问题继续扩大。","examplePinyin":"Jíshí jiāoliú xìnxī, nénggòu zǔzhǐ xiǎo wèntí jìxù kuòdà.","translation":"정보를 제때 나누면 작은 문제가 더 커지는 것을 막을 수 있어요."},{"no":1107,"category":"동작·감각·생각","word":"变动","pinyin":"biàndòng","meaning":"변동, 변화","example":"岗位发生变动后，双方需要重新划分职责。","examplePinyin":"Gǎngwèi fāshēng biàndòng hòu, shuāngfāng xūyào chóngxīn huàfēn zhízé.","translation":"보직이 바뀐 뒤 양측은 업무를 다시 나눠야 해요."},{"no":1108,"category":"동작·감각·생각","word":"沉","pinyin":"chén","meaning":"가라앉다, 침몰하다 / 고요하다","example":"石块慢慢沉到水底，水面又恢复了平静。","examplePinyin":"Shíkuài mànmàn chén dào shuǐdǐ, shuǐmiàn yòu huīfù le píngjìng.","translation":"돌이 천천히 물밑으로 가라앉자 수면이 다시 잔잔해졌어요."},{"no":1109,"category":"동작·감각·생각","word":"刺激","pinyin":"cìjī","meaning":"자극하다, 자극","example":"适度的竞争能够刺激创新，但过度竞争也有风险。","examplePinyin":"Shìdù de jìngzhēng nénggòu cìjī chuàngxīn, dàn guòdù jìngzhēng yě yǒu fēngxiǎn.","translation":"적절한 경쟁은 혁신을 자극하지만 과도한 경쟁에는 위험도 있어요."},{"no":1110,"category":"동작·감각·생각","word":"促进","pinyin":"cùjìn","meaning":"촉진하다","example":"文化交流能够促进理解，减少彼此之间的偏见。","examplePinyin":"Wénhuà jiāoliú nénggòu cùjìn lǐjiě, jiǎnshǎo bǐcǐ zhījiān de piānjiàn.","translation":"문화 교류는 이해를 촉진하고 서로의 편견을 줄일 수 있어요."},{"no":1111,"category":"동작·감각·생각","word":"促使","pinyin":"cùshǐ","meaning":"~하게 하다, ~하도록 만들다","example":"顾客的反馈，促使企业重新考虑产品的设计。","examplePinyin":"Gùkè de fǎnkuì, cùshǐ qǐyè chóngxīn kǎolǜ chǎnpǐn de shèjì.","translation":"고객의 의견으로 기업은 제품 설계를 다시 검토하게 됐어요."},{"no":1112,"category":"동작·감각·생각","word":"倒","pinyin":"dǎo","meaning":"쓰러지다, 넘어지다","example":"大风把路边的老树吹倒了，所幸无人受伤。","examplePinyin":"Dàfēng bǎ lùbiān de lǎoshù chuīdǎo le, suǒxìng wúrén shòushāng.","translation":"강풍에 길가의 오래된 나무가 쓰러졌지만 다친 사람은 없었어요."},{"no":1113,"category":"동작·감각·생각","word":"导致","pinyin":"dǎozhì","meaning":"초래하다, 야기하다","example":"长期忽视设备维护，可能导致严重的安全事故。","examplePinyin":"Chángqī hūshì shèbèi wéihù, kěnéng dǎozhì yánzhòng de ānquán shìgù.","translation":"장기간 설비 관리를 소홀히 하면 큰 안전사고를 일으킬 수 있어요."},{"no":1114,"category":"동작·감각·생각","word":"丢失","pinyin":"diūshī","meaning":"잃다, 분실하다","example":"如果身份证丢失，应及时办理挂失手续。","examplePinyin":"Rúguǒ shēnfènzhèng diūshī, yīng jíshí bànlǐ guàshī shǒuxù.","translation":"신분증을 잃어버리면 즉시 분실 신고를 해야 해요."},{"no":1115,"category":"동작·감각·생각","word":"断","pinyin":"duàn","meaning":"끊다, 단절하다","example":"山区大雪封路，村里的通信也一度断了。","examplePinyin":"Shānqū dàxuě fēnglù, cūnlǐ de tōngxìn yě yí dù duàn le.","translation":"산간 지역에 폭설로 길이 막히고 마을의 통신도 한때 끊겼어요."},{"no":1116,"category":"동작·감각·생각","word":"分离","pinyin":"fēnlí","meaning":"분리하다, 떼다","example":"实验中，需要先将液体中的不同成分分离。","examplePinyin":"Shíyàn zhōng, xūyào xiān jiāng yètǐ zhōng de bùtóng chéngfèn fēnlí.","translation":"실험에서는 먼저 액체 속의 서로 다른 성분을 분리해야 해요."},{"no":1117,"category":"동작·감각·생각","word":"改善","pinyin":"gǎishàn","meaning":"개선하다, 개량하다","example":"增加绿地能改善空气质量，也能缓解居民压力。","examplePinyin":"Zēngjiā lǜdì néng gǎishàn kōngqì zhìliàng, yě néng huǎnjiě jūmín yālì.","translation":"녹지가 늘면 공기가 나아지고 주민의 스트레스도 줄어들 수 있어요."},{"no":1118,"category":"동작·감각·생각","word":"好转","pinyin":"hǎozhuǎn","meaning":"좋아지다, 호전되다","example":"经过一段时间调整，他的睡眠状况逐渐好转。","examplePinyin":"Jīngguò yí duàn shíjiān tiáozhěng, tā de shuìmián zhuàngkuàng zhújiàn hǎozhuǎn.","translation":"한동안 생활을 조절하자 그의 수면 상태가 차츰 좋아졌어요."},{"no":1119,"category":"동작·감각·생각","word":"后果","pinyin":"hòuguǒ","meaning":"결과, (주로 나쁜) 결과","example":"作决定时，不能只想眼前好处而忽略后果。","examplePinyin":"Zuò juédìng shí, bùnéng zhǐ xiǎng yǎnqián hǎochu ér hūlüè hòuguǒ.","translation":"결정을 내릴 때는 당장의 이익만 보고 결과를 무시해서는 안 돼요."},{"no":1120,"category":"동작·감각·생각","word":"缓解","pinyin":"huǎnjiě","meaning":"완화하다, 해소하다","example":"增加社区活动空间，有助于缓解老人的孤独感。","examplePinyin":"Zēngjiā shèqū huódòng kōngjiān, yǒuzhùyú huǎnjiě lǎorén de gūdúgǎn.","translation":"마을의 활동 공간을 늘리면 노인들의 외로움을 덜어 줄 수 있어요."},{"no":1121,"category":"동작·감각·생각","word":"恢复","pinyin":"huīfù","meaning":"회복하다, 복귀하다","example":"道路恢复通行后，救灾物资很快运进了村庄。","examplePinyin":"Dàolù huīfù tōngxíng hòu, jiùzāi wùzī hěn kuài yùnjìn le cūnzhuāng.","translation":"도로 통행이 재개되자 구호 물자가 곧 마을에 들어왔어요."},{"no":1122,"category":"동작·감각·생각","word":"加深","pinyin":"jiāshēn","meaning":"깊어지다, 심화하다","example":"持续的文化交流，加深了两地居民之间的理解。","examplePinyin":"Chíxù de wénhuà jiāoliú, jiāshēn le liǎngdì jūmín zhījiān de lǐjiě.","translation":"지속적인 문화 교류가 두 지역 주민들의 이해를 깊게 했어요."},{"no":1123,"category":"동작·감각·생각","word":"加速","pinyin":"jiāsù","meaning":"가속하다, 빠르게 하다","example":"新的运输通道，加速了当地农产品进入市场的过程。","examplePinyin":"Xīn de yùnshū tōngdào, jiāsù le dāngdì nóngchǎnpǐn jìnrù shìchǎng de guòchéng.","translation":"새 운송로로 현지 농산물이 시장에 들어가는 속도가 빨라졌어요."},{"no":1124,"category":"동작·감각·생각","word":"进步","pinyin":"jìnbù","meaning":"진보하다, 발전하다","example":"评价学生时，不应忽略他与过去相比取得的进步。","examplePinyin":"Píngjià xuésheng shí, bù yīng hūlüè tā yǔ guòqu xiāngbǐ qǔdé de jìnbù.","translation":"학생을 평가할 때는 과거보다 얼마나 발전했는지도 봐야 해요."},{"no":1125,"category":"동작·감각·생각","word":"进一步","pinyin":"jìnyíbù","meaning":"더 나아가, 한걸음 더","example":"初步结果公布后，研究组将进一步核实数据。","examplePinyin":"Chūbù jiéguǒ gōngbù hòu, yánjiūzǔ jiāng jìn yí bù héshí shùjù.","translation":"초기 결과를 발표한 뒤 연구팀은 자료를 추가 검증할 거예요."},{"no":1126,"category":"동작·감각·생각","word":"扩大","pinyin":"kuòdà","meaning":"확대하다, 넓히다","example":"扩大生产之前，企业先确认了市场需求。","examplePinyin":"Kuòdà shēngchǎn zhīqián, qǐyè xiān quèrèn le shìchǎng xūqiú.","translation":"기업은 생산을 늘리기 전에 시장 수요부터 확인했어요."},{"no":1127,"category":"동작·감각·생각","word":"漏","pinyin":"lòu","meaning":"새다, 흘리다 / 빠뜨리다","example":"他检查名单时发现，漏了一位临时加入的志愿者。","examplePinyin":"Tā jiǎnchá míngdān shí fāxiàn, lòu le yí wèi línshí jiārù de zhìyuànzhě.","translation":"그는 명단에서 뒤늦게 합류한 자원봉사자 한 명이 빠진 것을 발견했어요."},{"no":1128,"category":"동작·감각·생각","word":"面临","pinyin":"miànlín","meaning":"직면하다, 마주하다","example":"传统商店面临新的竞争，需要找到自身的优势。","examplePinyin":"Chuántǒng shāngdiàn miànlín xīn de jìngzhēng, xūyào zhǎodào zìshēn de yōushì.","translation":"전통 상점은 새로운 경쟁에 직면해 자신만의 강점을 찾아야 해요."},{"no":1129,"category":"동작·감각·생각","word":"趋势","pinyin":"qūshì","meaning":"추세, 경향","example":"把短期波动当成长期趋势，可能造成判断失误。","examplePinyin":"Bǎ duǎnqī bōdòng dàngchéng chángqī qūshì, kěnéng zàochéng pànduàn shīwù.","translation":"단기 변동을 장기 추세로 보면 판단을 잘못할 수 있어요."},{"no":1130,"category":"동작·감각·생각","word":"伤害","pinyin":"shānghài","meaning":"해치다, 상처를 주다; 해로움","example":"公开评价他人时，要避免不必要的人格伤害。","examplePinyin":"Gōngkāi píngjià tārén shí, yào bìmiǎn búbìyào de réngé shānghài.","translation":"남을 공개적으로 평가할 때는 불필요하게 인격을 해치지 않아야 해요."},{"no":1131,"category":"동작·감각·생각","word":"上升","pinyin":"shàngshēng","meaning":"오르다, 상승하다","example":"随着需求上升，企业需要重新安排生产计划。","examplePinyin":"Suízhe xūqiú shàngshēng, qǐyè xūyào chóngxīn ānpái shēngchǎn jìhuà.","translation":"수요가 늘면서 기업은 생산 계획을 다시 짜야 해요."},{"no":1132,"category":"동작·감각·생각","word":"上涨","pinyin":"shàngzhǎng","meaning":"(가격·수위 등이) 오르다, 상승하다","example":"租金上涨后，小店开始寻找更合适的经营地点。","examplePinyin":"Zūjīn shàngzhǎng hòu, xiǎodiàn kāishǐ xúnzhǎo gèng héshì de jīngyíng dìdiǎn.","translation":"임대료가 오른 뒤 작은 가게는 더 적절한 장소를 찾기 시작했어요."},{"no":1133,"category":"동작·감각·생각","word":"升1","pinyin":"shēng","meaning":"오르다, 올라가다; (양사) 리터","example":"水位继续升高，管理人员决定暂停沿河活动。","examplePinyin":"Shuǐwèi jìxù shēnggāo, guǎnlǐ rényuán juédìng zàntíng yánhé huódòng.","translation":"수위가 계속 올라 관리자는 강변 활동을 잠시 중단하기로 했어요."},{"no":1134,"category":"동작·감각·생각","word":"升级","pinyin":"shēngjí","meaning":"업그레이드하다, 승급","example":"系统升级之后，旧设备是否兼容仍需确认。","examplePinyin":"Xìtǒng shēngjí zhīhòu, jiù shèbèi shìfǒu jiānróng réng xū quèrèn.","translation":"시스템을 갱신한 뒤 기존 장비와 호환되는지 확인해야 해요."},{"no":1135,"category":"동작·감각·생각","word":"失误","pinyin":"shīwù","meaning":"실수, 잘못","example":"记录每次失误，不是为了责备，而是为了改进。","examplePinyin":"Jìlù měi cì shīwù, búshì wèile zébèi, érshì wèile gǎijìn.","translation":"실수를 기록하는 것은 비난이 아니라 개선을 위해서예요."},{"no":1136,"category":"동작·감각·생각","word":"实现","pinyin":"shíxiàn","meaning":"실현하다, 실현","example":"目标要分阶段实现，不能期待一步解决所有问题。","examplePinyin":"Mùbiāo yào fēn jiēduàn shíxiàn, bùnéng qīdài yí bù jiějué suǒyǒu wèntí.","translation":"목표는 단계적으로 이뤄야 하며 한 번에 모든 문제를 풀 수는 없어요."},{"no":1137,"category":"동작·감각·생각","word":"损害","pinyin":"sǔnhài","meaning":"손해, 훼손","example":"隐瞒产品缺陷，最终会损害企业长期的信誉。","examplePinyin":"Yǐnmán chǎnpǐn quēxiàn, zuìzhōng huì sǔnhài qǐyè chángqī de xìnyù.","translation":"제품 결함을 숨기면 결국 기업의 장기적인 신용을 해쳐요."},{"no":1138,"category":"동작·감각·생각","word":"缩短","pinyin":"suōduǎn","meaning":"줄이다, 단축하다","example":"新线路缩短了通勤时间，也扩大了就业选择。","examplePinyin":"Xīn xiànlù suōduǎn le tōngqín shíjiān, yě kuòdà le jiùyè xuǎnzé.","translation":"새 노선은 통근 시간을 줄이고 취업 선택지도 넓혔어요."},{"no":1139,"category":"동작·감각·생각","word":"缩小","pinyin":"suōxiǎo","meaning":"축소하다, 줄이다","example":"改进信息服务，有助于缩小不同群体之间的差距。","examplePinyin":"Gǎijìn xìnxī fúwù, yǒuzhùyú suōxiǎo bùtóng qúntǐ zhījiān de chājù.","translation":"정보 서비스를 개선하면 집단 간 격차를 줄이는 데 도움이 돼요."},{"no":1140,"category":"동작·감각·생각","word":"提升","pinyin":"tíshēng","meaning":"제고하다, 향상시키다","example":"提升服务质量，不能只增加设备而忽略人员培训。","examplePinyin":"Tíshēng fúwù zhìliàng, bùnéng zhǐ zēngjiā shèbèi ér hūlüè rényuán péixùn.","translation":"서비스의 질을 높이려면 장비뿐 아니라 직원 교육도 중시해야 해요."},{"no":1141,"category":"동작·감각·생각","word":"推动","pinyin":"tuīdòng","meaning":"추진하다, 밀다","example":"公共交通的改善，推动了周边社区的发展。","examplePinyin":"Gōnggòng jiāotōng de gǎishàn, tuīdòng le zhōubiān shèqū de fāzhǎn.","translation":"대중교통 개선이 주변 지역 사회의 발전을 촉진했어요."},{"no":1142,"category":"동작·감각·생각","word":"危害","pinyin":"wēihài","meaning":"해를 끼치다; 해악, 해로움","example":"长期忽视通风，可能危害在室内工作的人。","examplePinyin":"Chángqī hūshì tōngfēng, kěnéng wēihài zài shìnèi gōngzuò de rén.","translation":"오랫동안 환기를 소홀히 하면 실내 근무자의 건강을 해칠 수 있어요."},{"no":1143,"category":"동작·감각·생각","word":"消失","pinyin":"xiāoshī","meaning":"사라지다, 소멸","example":"一些传统手艺正在消失，需要及时记录和传承。","examplePinyin":"Yìxiē chuántǒng shǒuyì zhèngzài xiāoshī, xūyào jíshí jìlù hé chuánchéng.","translation":"일부 전통 기술이 사라지고 있어 신속한 기록과 전승이 필요해요."},{"no":1144,"category":"동작·감각·생각","word":"形成","pinyin":"xíngchéng","meaning":"형성되다, 이루어지다","example":"信任不是一次谈话形成的，而是长期行动的结果。","examplePinyin":"Xìnrèn búshì yí cì tánhuà xíngchéng de, érshì chángqī xíngdòng de jiéguǒ.","translation":"신뢰는 한 번 대화로 생기는 것이 아니라 오랜 행동의 결과예요."},{"no":1145,"category":"동작·감각·생각","word":"延长","pinyin":"yáncháng","meaning":"연장하다, 늘이다","example":"延长服务时间，需要同时考虑员工的合理休息。","examplePinyin":"Yáncháng fúwù shíjiān, xūyào tóngshí kǎolǜ yuángōng de hélǐ xiūxi.","translation":"서비스 시간을 늘릴 때는 직원의 적절한 휴식도 고려해야 해요."},{"no":1146,"category":"동작·감각·생각","word":"意外","pinyin":"yìwài","meaning":"뜻밖의, 의외의; 뜻밖의 사고","example":"意外打乱了原定计划，却也带来新的合作机会。","examplePinyin":"Yìwài dǎluàn le yuándìng jìhuà, què yě dàilái xīn de hézuò jīhuì.","translation":"뜻밖의 일이 계획을 흐트러뜨렸지만 새 협력 기회도 가져왔어요."},{"no":1147,"category":"동작·감각·생각","word":"造成","pinyin":"zàochéng","meaning":"초래하다, 야기하다","example":"信息传递不及时，造成了几次不必要的误会。","examplePinyin":"Xìnxī chuándì bù jíshí, zàochéng le jǐ cì búbìyào de wùhuì.","translation":"정보가 제때 전달되지 않아 불필요한 오해가 몇 번 생겼어요."},{"no":1148,"category":"동작·감각·생각","word":"增","pinyin":"zēng","meaning":"증가하다, 늘다","example":"服务时间只增不减，却未必能够提高实际满意度。","examplePinyin":"Fúwù shíjiān zhǐ zēng bùjiǎn, què wèibì nénggòu tígāo shíjì mǎnyìdù.","translation":"서비스 시간을 늘리기만 한다고 실제 만족도가 높아지지는 않아요."},{"no":1149,"category":"동작·감각·생각","word":"增强","pinyin":"zēngqiáng","meaning":"강화하다, 증강하다","example":"清楚说明工作意义，能够增强团队的主动性。","examplePinyin":"Qīngchu shuōmíng gōngzuò yìyì, nénggòu zēngqiáng tuánduì de zhǔdòngxìng.","translation":"일의 의미를 분명히 설명하면 팀의 자발성을 높일 수 있어요."},{"no":1150,"category":"동작·감각·생각","word":"涨","pinyin":"zhǎng","meaning":"(수위,물등)오르다,상승하다","example":"河水还在涨，沿岸居民已做好转移准备。","examplePinyin":"Héshuǐ hái zài zhǎng, yán'àn jūmín yǐ zuòhǎo zhuǎnyí zhǔnbèi.","translation":"강물이 계속 불어나 강변 주민들은 대피 준비를 마쳤어요."},{"no":1151,"category":"동작·감각·생각","word":"止","pinyin":"zhǐ","meaning":"그만두다, 멈추다","example":"讨论不能只止于提出问题，还应寻找可行办法。","examplePinyin":"Tǎolùn bùnéng zhǐ zhǐ yú tíchū wèntí, hái yīng xúnzhǎo kěxíng bànfǎ.","translation":"토론은 문제 제기에 그치지 말고 실행 가능한 방법도 찾아야 해요."},{"no":1152,"category":"동작·감각·생각","word":"转变","pinyin":"zhuǎnbiàn","meaning":"전환하다, 변화하다","example":"从被动接受到主动参与，是学习方式的重要转变。","examplePinyin":"Cóng bèidòng jiēshòu dào zhǔdòng cānyù, shì xuéxí fāngshì de zhòngyào zhuǎnbiàn.","translation":"수동적인 수용에서 능동적인 참여로의 전환은 중요한 학습 방식의 변화예요."},{"no":1153,"category":"동작·감각·생각","word":"保","pinyin":"bǎo","meaning":"보호하다, 지키다, 보증하다","example":"为了保住传统手艺，村里开办了免费培训班。","examplePinyin":"Wèile bǎozhù chuántǒng shǒuyì, cūnlǐ kāibàn le miǎnfèi péixùnbān.","translation":"전통 기술을 지키려고 마을에서 무료 강좌를 열었어요."},{"no":1154,"category":"동작·감각·생각","word":"保留","pinyin":"bǎoliú","meaning":"보류하다, 유지하다 / 보존","example":"讨论尚未得出结论，各方决定暂时保留意见。","examplePinyin":"Tǎolùn shàngwèi déchū jiélùn, gèfāng juédìng zànshí bǎoliú yìjiàn.","translation":"논의가 결론에 이르지 못해 각자 의견을 당분간 유보했어요."},{"no":1155,"category":"동작·감각·생각","word":"补充","pinyin":"bǔchōng","meaning":"보충하다, 추가하다","example":"讨论过程中，几位同学补充了不同的案例。","examplePinyin":"Tǎolùn guòchéng zhōng, jǐ wèi tóngxué bǔchōng le bùtóng de ànlì.","translation":"토론 중 몇몇 학생이 다른 사례들을 추가했어요."},{"no":1156,"category":"동작·감각·생각","word":"递","pinyin":"dì","meaning":"전달하다, 건네다","example":"她把整理好的资料递给老师，请他提出修改意见。","examplePinyin":"Tā bǎ zhěnglǐ hǎo de zīliào dìgěi lǎoshī, qǐng tā tíchū xiūgǎi yìjiàn.","translation":"그녀는 정리한 자료를 선생님께 건네며 수정 의견을 부탁했어요."},{"no":1157,"category":"동작·감각·생각","word":"付出","pinyin":"fùchū","meaning":"들이다, 쏟다; 지불하다","example":"任何长期目标的实现，都需要付出时间和耐心。","examplePinyin":"Rènhé chángqī mùbiāo de shíxiàn, dōu xūyào fùchū shíjiān hé nàixīn.","translation":"장기 목표를 이루려면 시간과 인내를 들여야 해요."},{"no":1158,"category":"동작·감각·생각","word":"交换","pinyin":"jiāohuàn","meaning":"교환하다, 주고받다","example":"交换意见的目的不是争胜，而是完善共同方案。","examplePinyin":"Jiāohuàn yìjiàn de mùdì búshì zhēngshèng, érshì wánshàn gòngtóng fāng'àn.","translation":"의견 교환의 목적은 승부가 아니라 공동 방안을 개선하는 데 있어요."},{"no":1159,"category":"동작·감각·생각","word":"救","pinyin":"jiù","meaning":"구하다, 구조하다","example":"听到有人落水，岸边居民立刻想办法救人。","examplePinyin":"Tīngdào yǒurén luòshuǐ, ànbiān jūmín lìkè xiǎng bànfǎ jiùrén.","translation":"물에 빠졌다는 소리를 듣자 강가 주민들이 곧 구조 방법을 찾았어요."},{"no":1160,"category":"동작·감각·생각","word":"捐","pinyin":"juān","meaning":"기부하다, 성금을 내다","example":"他把闲置的电脑捐给了需要设备的乡村学校。","examplePinyin":"Tā bǎ xiánzhì de diànnǎo juāngěi le xūyào shèbèi de xiāngcūn xuéxiào.","translation":"그는 사용하지 않는 컴퓨터를 장비가 필요한 시골 학교에 기부했어요."},{"no":1161,"category":"동작·감각·생각","word":"靠","pinyin":"kào","meaning":"기대다, 의지하다 / 가까이 가다","example":"光靠口头承诺，无法建立长久的合作关系。","examplePinyin":"Guāng kào kǒutóu chéngnuò, wúfǎ jiànlì chángjiǔ de hézuò guānxi.","translation":"말로 하는 약속에만 의지해서는 오래가는 협력 관계를 만들 수 없어요."},{"no":1162,"category":"동작·감각·생각","word":"满足","pinyin":"mǎnzú","meaning":"만족하다; 충족시키다","example":"公共服务应优先满足老年人和儿童的基本需求。","examplePinyin":"Gōnggòng fúwù yīng yōuxiān mǎnzú lǎoniánrén hé értóng de jīběn xūqiú.","translation":"공공 서비스는 노인과 아동의 기본 수요를 우선 충족해야 해요."},{"no":1163,"category":"동작·감각·생각","word":"收获","pinyin":"shōuhuò","meaning":"수확, 성과; 수확하다","example":"这次调查最大的收获，是学会从不同角度观察。","examplePinyin":"Zhè cì diàochá zuì dà de shōuhuò, shì xuéhuì cóng bùtóng jiǎodù guānchá.","translation":"이번 조사의 가장 큰 수확은 여러 관점에서 보는 법을 배운 거예요."},{"no":1164,"category":"동작·감각·생각","word":"替","pinyin":"tì","meaning":"대신하다, 갈아주다","example":"同事临时有事，他主动替对方承担了接待工作。","examplePinyin":"Tóngshì línshí yǒushì, tā zhǔdòng tì duìfāng chéngdān le jiēdài gōngzuò.","translation":"동료에게 갑자기 일이 생기자 그는 대신 방문객 응대를 맡았어요."},{"no":1165,"category":"동작·감각·생각","word":"吸收","pinyin":"xīshōu","meaning":"흡수하다","example":"吸收别人的经验，不意味着放弃自己的判断。","examplePinyin":"Xīshōu biéren de jīngyàn, bú yìwèizhe fàngqì zìjǐ de pànduàn.","translation":"다른 사람의 경험을 받아들인다고 자신의 판단을 포기하는 것은 아니에요."},{"no":1166,"category":"동작·감각·생각","word":"依靠","pinyin":"yīkào","meaning":"의지하다, 의존하다","example":"仅仅依靠外部帮助，很难建立持续发展的能力。","examplePinyin":"Jǐnjǐn yīkào wàibù bāngzhù, hěn nán jiànlì chíxù fāzhǎn de nénglì.","translation":"외부 도움에만 의지해서는 지속적으로 발전할 능력을 기르기 어려워요."},{"no":1167,"category":"동작·감각·생각","word":"引进","pinyin":"yǐnjìn","meaning":"도입하다, 수입하다","example":"引进先进设备之前，企业先培训了相关技术人员。","examplePinyin":"Yǐnjìn xiānjìn shèbèi zhīqián, qǐyè xiān péixùn le xiāngguān jìshù rényuán.","translation":"기업은 첨단 장비를 도입하기 전에 관련 기술자를 교육했어요."},{"no":1168,"category":"동작·감각·생각","word":"拥有","pinyin":"yōngyǒu","meaning":"소유하다, 갖다","example":"拥有选择的机会，也意味着需要承担选择的结果。","examplePinyin":"Yōngyǒu xuǎnzé de jīhuì, yě yìwèizhe xūyào chéngdān xuǎnzé de jiéguǒ.","translation":"선택할 기회가 있다는 것은 그 결과도 책임져야 한다는 뜻이에요."},{"no":1169,"category":"동작·감각·생각","word":"赠","pinyin":"zèng","meaning":"증정하다, 선물로 주다","example":"社区向新入学的孩子赠送图书，鼓励他们坚持阅读。","examplePinyin":"Shèqū xiàng xīn rùxué de háizi zèngsòng túshū, gǔlì tāmen jiānchí yuèdú.","translation":"마을은 새로 입학한 아이들에게 책을 주며 꾸준한 독서를 장려해요."},{"no":1170,"category":"동작·감각·생각","word":"赠送","pinyin":"zèngsòng","meaning":"증정하다, 선물하다","example":"店家赠送小礼物时，也应避免造成额外包装浪费。","examplePinyin":"Diànjiā zèngsòng xiǎo lǐwù shí, yě yīng bìmiǎn zàochéng éwài bāozhuāng làngfèi.","translation":"가게가 사은품을 줄 때도 불필요한 포장 낭비는 피해야 해요."},{"no":1171,"category":"동작·감각·생각","word":"本质","pinyin":"běnzhì","meaning":"본질, 본성","example":"分析问题时，不能只看现象，还要抓住本质。","examplePinyin":"Fēnxī wèntí shí, bùnéng zhǐ kàn xiànxiàng, hái yào zhuāzhù běnzhì.","translation":"문제를 분석할 때는 현상뿐 아니라 본질도 파악해야 해요."},{"no":1172,"category":"동작·감각·생각","word":"表明","pinyin":"biǎomíng","meaning":"표명하다, 밝히다","example":"调查结果表明，规律地运动有助于改善睡眠。","examplePinyin":"Diàochá jiéguǒ biǎomíng, guīlǜ de yùndòng yǒuzhùyú gǎishàn shuìmián.","translation":"조사 결과 규칙적인 운동이 수면 개선에 도움이 된다고 해요."},{"no":1173,"category":"동작·감각·생각","word":"当","pinyin":"dàng","meaning":"~로 여기다, ~로 삼다; 알맞다","example":"不要把善意的提醒当成对个人能力的否定。","examplePinyin":"Búyào bǎ shànyì de tíxǐng dàngchéng duì gèrén nénglì de fǒudìng.","translation":"선의의 충고를 자신의 능력에 대한 부정으로 여기지 마세요."},{"no":1174,"category":"동작·감각·생각","word":"当成","pinyin":"dàngchéng","meaning":"~로 여기다, ~로 삼다","example":"他把每一次失败，都当成调整方法的机会。","examplePinyin":"Tā bǎ měi yí cì shībài, dōu dàngchéng tiáozhěng fāngfǎ de jīhuì.","translation":"그는 실패할 때마다 방법을 조정할 기회로 여겨요."},{"no":1175,"category":"동작·감각·생각","word":"当作","pinyin":"dàngzuò","meaning":"~로 삼다, ~로 여기다","example":"别把别人的帮助当作理所当然，要懂得感谢。","examplePinyin":"Bié bǎ biéren de bāngzhù dàngzuò lǐ suǒ dāngrán, yào dǒngde gǎnxiè.","translation":"남의 도움을 당연하게 여기지 말고 감사할 줄 알아야 해요."},{"no":1176,"category":"동작·감각·생각","word":"道理","pinyin":"dàoli","meaning":"이치, 도리, 이유","example":"有些道理，只有亲自经历过才会真正理解。","examplePinyin":"Yǒuxiē dàoli, zhǐyǒu qīnzì jīnglì guo cái huì zhēnzhèng lǐjiě.","translation":"어떤 이치는 직접 경험해야 비로소 제대로 이해할 수 있어요."},{"no":1177,"category":"동작·감각·생각","word":"对比","pinyin":"duìbǐ","meaning":"비교하다, 대조","example":"把两年的数据进行对比，才能看出变化趋势。","examplePinyin":"Bǎ liǎng nián de shùjù jìnxíng duìbǐ, cái néng kànchū biànhuà qūshì.","translation":"두 해의 자료를 비교해야 변화 추세를 볼 수 있어요."},{"no":1178,"category":"동작·감각·생각","word":"反映","pinyin":"fǎnyìng","meaning":"반영하다, 나타내다","example":"这部小说反映了年轻人在城市生活中的压力。","examplePinyin":"Zhè bù xiǎoshuō fǎnyìng le niánqīngrén zài chéngshì shēnghuó zhōng de yālì.","translation":"이 소설은 도시에서 사는 청년들의 압박감을 반영해요."},{"no":1179,"category":"동작·감각·생각","word":"分析","pinyin":"fēnxī","meaning":"분석하다, 분석","example":"分析失败原因时，要区分主观因素与客观条件。","examplePinyin":"Fēnxī shībài yuányīn shí, yào qūfēn zhǔguān yīnsù yǔ kèguān tiáojiàn.","translation":"실패 원인을 분석할 때는 주관적 요인과 객관적 조건을 나눠야 해요."},{"no":1180,"category":"동작·감각·생각","word":"观察","pinyin":"guānchá","meaning":"관찰하다, 살피다","example":"仔细观察日常生活，往往能发现有价值的问题。","examplePinyin":"Zǐxì guānchá rìcháng shēnghuó, wǎngwǎng néng fāxiàn yǒu jiàzhí de wèntí.","translation":"일상을 자세히 관찰하면 가치 있는 문제를 발견하곤 해요."},{"no":1181,"category":"동작·감각·생각","word":"观点","pinyin":"guāndiǎn","meaning":"관점, 견해","example":"即使不赞同对方观点，也应准确理解他的理由。","examplePinyin":"Jíshǐ bú zàntóng duìfāng guāndiǎn, yě yīng zhǔnquè lǐjiě tā de lǐyóu.","translation":"상대의 견해에 동의하지 않아도 그 이유는 정확히 이해해야 해요."},{"no":1182,"category":"동작·감각·생각","word":"观念","pinyin":"guānniàn","meaning":"관념, 생각","example":"工作方式的变化，也促使人们重新思考就业观念。","examplePinyin":"Gōngzuò fāngshì de biànhuà, yě cùshǐ rénmen chóngxīn sīkǎo jiùyè guānniàn.","translation":"일하는 방식이 바뀌면서 사람들은 취업관을 다시 생각하게 됐어요."},{"no":1183,"category":"동작·감각·생각","word":"规律","pinyin":"guīlǜ","meaning":"법칙, 규칙성; 규칙적인","example":"只有长期记录，才能发现这些变化背后的规律。","examplePinyin":"Zhǐyǒu chángqī jìlù, cái néng fāxiàn zhèxiē biànhuà bèihòu de guīlǜ.","translation":"오랫동안 기록해야 변화 뒤에 있는 규칙성을 발견할 수 있어요."},{"no":1184,"category":"동작·감각·생각","word":"忽视","pinyin":"hūshì","meaning":"무시하다, 소홀히 하다","example":"不能因为追求经济增长，就忽视环境的承受能力。","examplePinyin":"Bùnéng yīnwèi zhuīqiú jīngjì zēngzhǎng, jiù hūshì huánjìng de chéngshòu nénglì.","translation":"경제 성장을 추구한다고 환경의 수용 능력을 무시해서는 안 돼요."},{"no":1185,"category":"동작·감각·생각","word":"角度","pinyin":"jiǎodù","meaning":"각도, 시각","example":"从使用者的角度出发，设计往往会更加实用。","examplePinyin":"Cóng shǐyòngzhě de jiǎodù chūfā, shèjì wǎngwǎng huì gèngjiā shíyòng.","translation":"사용자의 관점에서 출발하면 설계가 더 실용적이 되곤 해요."},{"no":1186,"category":"동작·감각·생각","word":"价值","pinyin":"jiàzhí","meaning":"가치, 값어치","example":"一件物品的价值，不一定能用市场价格衡量。","examplePinyin":"Yí jiàn wùpǐn de jiàzhí, bùyídìng néng yòng shìchǎng jiàgé héngliáng.","translation":"물건의 가치를 반드시 시장 가격으로 잴 수 있는 것은 아니에요."},{"no":1187,"category":"동작·감각·생각","word":"接触","pinyin":"jiēchù","meaning":"접촉하다, 접하다","example":"接触不同观点，不等于必须接受所有观点。","examplePinyin":"Jiēchù bùtóng guāndiǎn, bù děngyú bìxū jiēshòu suǒyǒu guāndiǎn.","translation":"다양한 관점을 접한다고 모든 관점을 받아들여야 하는 것은 아니에요."},{"no":1188,"category":"동작·감각·생각","word":"结论","pinyin":"jiélùn","meaning":"결론","example":"在样本不足的情况下，不能急于作出结论。","examplePinyin":"Zài yàngběn bùzú de qíngkuàng xià, bùnéng jíyú zuòchū jiélùn.","translation":"표본이 부족한 상황에서는 서둘러 결론을 내려서는 안 돼요."},{"no":1189,"category":"동작·감각·생각","word":"看作","pinyin":"kànzuò","meaning":"~으로 보다, 간주하다","example":"他把困难看作学习机会，而不是停止前进的理由。","examplePinyin":"Tā bǎ kùnnan kànzuò xuéxí jīhuì, ér búshì tíngzhǐ qiánjìn de lǐyóu.","translation":"그는 어려움을 멈출 이유가 아니라 배울 기회로 여겨요."},{"no":1190,"category":"동작·감각·생각","word":"理由","pinyin":"lǐyóu","meaning":"이유, 까닭","example":"提出反对意见时，应同时说明具体的理由。","examplePinyin":"Tíchū fǎnduì yìjiàn shí, yīng tóngshí shuōmíng jùtǐ de lǐyóu.","translation":"반대 의견을 낼 때는 구체적인 이유도 함께 설명해야 해요."},{"no":1191,"category":"동작·감각·생각","word":"逻辑","pinyin":"luóji","meaning":"논리, 로직","example":"观点有吸引力，并不意味着论证逻辑没有问题。","examplePinyin":"Guāndiǎn yǒu xīyǐnlì, bìng bú yìwèizhe lùnzhèng luóji méiyǒu wèntí.","translation":"주장이 매력적이라고 논증의 논리에 문제가 없는 것은 아니에요."},{"no":1192,"category":"동작·감각·생각","word":"目光","pinyin":"mùguāng","meaning":"눈빛, 시선","example":"把目光放得长远，才不会被眼前的小利限制。","examplePinyin":"Bǎ mùguāng fàng de chángyuǎn, cái búhuì bèi yǎnqián de xiǎolì xiànzhì.","translation":"멀리 내다봐야 당장의 작은 이익에 얽매이지 않아요."},{"no":1193,"category":"동작·감각·생각","word":"评","pinyin":"píng","meaning":"평가하다, 평하다","example":"评一项研究的价值，不能只看发表文章的数量。","examplePinyin":"Píng yí xiàng yánjiū de jiàzhí, bùnéng zhǐ kàn fābiǎo wénzhāng de shùliàng.","translation":"연구의 가치를 평가할 때 발표 논문 수만 보면 안 돼요."},{"no":1194,"category":"동작·감각·생각","word":"评价","pinyin":"píngjià","meaning":"평가,평가하다","example":"评价公共服务，应认真听取实际使用者的声音。","examplePinyin":"Píngjià gōnggòng fúwù, yīng rènzhēn tīngqǔ shíjì shǐyòngzhě de shēngyīn.","translation":"공공 서비스를 평가할 때는 실제 이용자의 의견을 잘 들어야 해요."},{"no":1195,"category":"동작·감각·생각","word":"情景","pinyin":"qíngjǐng","meaning":"정경, 상황","example":"多年以后，她依然清楚记得第一次上台的情景。","examplePinyin":"Duōnián yǐhòu, tā yīrán qīngchu jìde dìyīcì shàngtái de qíngjǐng.","translation":"여러 해가 지나도 그녀는 첫 무대의 상황을 생생히 기억해요."},{"no":1196,"category":"동작·감각·생각","word":"轻重","pinyin":"qīngzhòng","meaning":"중요도, 경중","example":"处理多项任务时，要先分清轻重，再安排顺序。","examplePinyin":"Chǔlǐ duōxiàng rènwu shí, yào xiān fēnqīng qīngzhòng, zài ānpái shùnxù.","translation":"여러 일을 처리할 때는 중요도를 나눈 뒤 순서를 정해야 해요."},{"no":1197,"category":"동작·감각·생각","word":"确认","pinyin":"quèrèn","meaning":"확인하다, 인증하다","example":"发布消息之前，编辑再次向当事人确认了细节。","examplePinyin":"Fābù xiāoxi zhīqián, biānjí zàicì xiàng dāngshìrén quèrèn le xìjié.","translation":"소식을 내보내기 전에 편집자는 당사자에게 세부 내용을 재확인했어요."},{"no":1198,"category":"동작·감각·생각","word":"认","pinyin":"rèn","meaning":"인정하다, 알아보다","example":"多年未见，老师仍能认出当年坐在后排的他。","examplePinyin":"Duōnián wèi jiàn, lǎoshī réng néng rènchū dāngnián zuò zài hòupái de tā.","translation":"여러 해가 지났어도 선생님은 뒷자리에 앉던 그를 알아봤어요."},{"no":1199,"category":"동작·감각·생각","word":"深入","pinyin":"shēnrù","meaning":"깊이 들어가다; 깊이 있는, 깊이","example":"深入了解背景之后，他调整了最初的判断。","examplePinyin":"Shēnrù liǎojiě bèijǐng zhīhòu, tā tiáozhěng le zuìchū de pànduàn.","translation":"배경을 깊이 알아본 뒤 그는 처음의 판단을 바꿨어요."},{"no":1200,"category":"동작·감각·생각","word":"事实","pinyin":"shìshí","meaning":"사실, 실제","example":"事实与个人感受不同，讨论时应加以区分。","examplePinyin":"Shìshí yǔ gèrén gǎnshòu bùtóng, tǎolùn shí yīng jiāyǐ qūfēn.","translation":"사실과 개인적인 느낌은 다르므로 논의할 때 구분해야 해요."},{"no":1201,"category":"동작·감각·생각","word":"视为","pinyin":"shìwéi","meaning":"~로 보다, 간주하다","example":"许多居民把这座老桥，视为城市记忆的一部分。","examplePinyin":"Xǔduō jūmín bǎ zhè zuò lǎo qiáo, shìwéi chéngshì jìyì de yí bùfen.","translation":"많은 주민은 이 옛 다리를 도시 기억의 일부로 여겨요."},{"no":1202,"category":"동작·감각·생각","word":"事物","pinyin":"shìwù","meaning":"사물, 일","example":"认识新事物时，要避免只用已有经验作判断。","examplePinyin":"Rènshi xīn shìwù shí, yào bìmiǎn zhǐ yòng yǐyǒu jīngyàn zuò pànduàn.","translation":"새로운 것을 접할 때는 기존 경험만으로 판단하지 않아야 해요."},{"no":1203,"category":"동작·감각·생각","word":"思考","pinyin":"sīkǎo","meaning":"생각하다, 사고","example":"独立思考，需要接触不同信息，也需要反思自己。","examplePinyin":"Dúlì sīkǎo, xūyào jiēchù bùtóng xìnxī, yě xūyào fǎnsī zìjǐ.","translation":"스스로 생각하려면 다양한 정보를 접하고 자신도 돌아봐야 해요."},{"no":1204,"category":"동작·감각·생각","word":"思维","pinyin":"sīwéi","meaning":"사고, 생각","example":"学习不同学科，有助于拓展思维的方式。","examplePinyin":"Xuéxí bùtóng xuékē, yǒuzhùyú tuòzhǎn sīwéi de fāngshì.","translation":"여러 학문을 배우면 사고방식을 넓히는 데 도움이 돼요."},{"no":1205,"category":"동작·감각·생각","word":"思想","pinyin":"sīxiǎng","meaning":"사상, 이념","example":"作品表达的思想，需要结合时代背景来理解。","examplePinyin":"Zuòpǐn biǎodá de sīxiǎng, xūyào jiéhé shídài bèijǐng lái lǐjiě.","translation":"작품이 나타내는 사상은 시대적 배경과 함께 이해해야 해요."},{"no":1206,"category":"동작·감각·생각","word":"体会","pinyin":"tǐhuì","meaning":"몸소 깨닫다, 체득하다; 체험, 깨달음","example":"亲自参加社区服务后，他才体会到协调工作的不易。","examplePinyin":"Qīnzì cānjiā shèqū fúwù hòu, tā cái tǐhuì dào xiétiáo gōngzuò de búyì.","translation":"마을 봉사에 직접 참여한 뒤 그는 업무 조정의 어려움을 깨달았어요."},{"no":1207,"category":"동작·감각·생각","word":"体现","pinyin":"tǐxiàn","meaning":"구현하다, 드러내다, 나타내다","example":"细节是否方便使用，体现了设计者对人的关心。","examplePinyin":"Xìjié shìfǒu fāngbiàn shǐyòng, tǐxiàn le shèjìzhě duì rén de guānxīn.","translation":"세부 요소의 사용 편의성에는 디자이너의 배려가 드러나요."},{"no":1208,"category":"동작·감각·생각","word":"体验","pinyin":"tǐyàn","meaning":"체험하다, 경험하다","example":"亲身体验一次，比只听介绍更能理解实际困难。","examplePinyin":"Qīnshēn tǐyàn yí cì, bǐ zhǐ tīng jièshào gèng néng lǐjiě shíjì kùnnan.","translation":"한 번 직접 체험하면 설명만 듣는 것보다 실제 어려움을 더 잘 알아요."},{"no":1209,"category":"동작·감각·생각","word":"响声","pinyin":"xiǎngshēng","meaning":"소리, 울림","example":"听到设备发出异常响声，操作员立即停机检查。","examplePinyin":"Tīngdào shèbèi fāchū yìcháng xiǎngshēng, cāozuòyuán lìjí tíngjī jiǎnchá.","translation":"장비의 이상한 소리를 듣고 작업자는 즉시 멈춰 점검했어요."},{"no":1210,"category":"동작·감각·생각","word":"想象","pinyin":"xiǎngxiàng","meaning":"상상하다, 상상","example":"理解过去的生活，需要证据，也需要适当的想象。","examplePinyin":"Lǐjiě guòqu de shēnghuó, xūyào zhèngjù, yě xūyào shìdàng de xiǎngxiàng.","translation":"과거의 삶을 이해하려면 증거와 적절한 상상력이 필요해요."},{"no":1211,"category":"동작·감각·생각","word":"现实","pinyin":"xiànshí","meaning":"현실, 실제","example":"面对现实，并不意味着必须放弃改变的愿望。","examplePinyin":"Miànduì xiànshí, bìng bú yìwèizhe bìxū fàngqì gǎibiàn de yuànwàng.","translation":"현실을 받아들인다고 변화를 바라는 마음까지 버려야 하는 것은 아니에요."},{"no":1212,"category":"동작·감각·생각","word":"现象","pinyin":"xiànxiàng","meaning":"현상","example":"解释一种现象，往往需要从多个方面寻找原因。","examplePinyin":"Jiěshì yì zhǒng xiànxiàng, wǎngwǎng xūyào cóng duōge fāngmiàn xúnzhǎo yuányīn.","translation":"현상을 설명하려면 여러 방면에서 원인을 찾아야 할 때가 많아요."},{"no":1213,"category":"동작·감각·생각","word":"现状","pinyin":"xiànzhuàng","meaning":"현황, 현재 상황","example":"不了解当地现状，就难以提出可行的建议。","examplePinyin":"Bù liǎojiě dāngdì xiànzhuàng, jiù nányǐ tíchū kěxíng de jiànyì.","translation":"현지 상황을 모르면 실현 가능한 제안을 하기 어려워요."},{"no":1214,"category":"동작·감각·생각","word":"寻找","pinyin":"xúnzhǎo","meaning":"찾다, 탐구하다","example":"与其急着证明自己，不如先寻找问题的真正原因。","examplePinyin":"Yǔqí jí zhe zhèngmíng zìjǐ, bùrú xiān xúnzhǎo wèntí de zhēnzhèng yuányīn.","translation":"서둘러 자신을 증명하기보다 문제의 진짜 원인부터 찾아보세요."},{"no":1215,"category":"동작·감각·생각","word":"因素","pinyin":"yīnsù","meaning":"요인, 요소","example":"分析结果时，应考虑天气、时间等多种因素。","examplePinyin":"Fēnxī jiéguǒ shí, yīng kǎolǜ tiānqì, shíjiān děng duōzhǒng yīnsù.","translation":"결과를 분석할 때는 날씨와 시간 등 여러 요인을 고려해야 해요."},{"no":1216,"category":"동작·감각·생각","word":"意识","pinyin":"yìshí","meaning":"의식; 깨닫다, 알아차리다","example":"参加调查后，他才意识到日常选择也会影响环境。","examplePinyin":"Cānjiā diàochá hòu, tā cái yìshí dào rìcháng xuǎnzé yě huì yǐngxiǎng huánjìng.","translation":"조사에 참여하고서야 그는 일상의 선택도 환경에 영향을 준다는 걸 깨달았어요."},{"no":1217,"category":"동작·감각·생각","word":"疑问","pinyin":"yíwèn","meaning":"의문, 의문점","example":"对结论提出疑问，是为了让讨论更加严谨。","examplePinyin":"Duì jiélùn tíchū yíwèn, shì wèile ràng tǎolùn gèngjiā yánjǐn.","translation":"결론에 의문을 제기하는 것은 논의를 더 엄밀히 하기 위해서예요."},{"no":1218,"category":"동작·감각·생각","word":"意义","pinyin":"yìyì","meaning":"의미, 뜻","example":"活动的意义，不只在于结果，也在于参与的过程。","examplePinyin":"Huódòng de yìyì, bù zhǐ zàiyú jiéguǒ, yě zàiyú cānyù de guòchéng.","translation":"활동의 의미는 결과뿐 아니라 참여 과정에도 있어요."},{"no":1219,"category":"동작·감각·생각","word":"预测","pinyin":"yùcè","meaning":"예측, 예상","example":"预测未来需求时，应说明假设条件和不确定因素。","examplePinyin":"Yùcè wèilái xūqiú shí, yīng shuōmíng jiǎshè tiáojiàn hé bú quèdìng yīnsù.","translation":"미래 수요를 예측할 때는 가정과 불확실한 요인을 밝혀야 해요."},{"no":1220,"category":"동작·감각·생각","word":"预计","pinyin":"yùjì","meaning":"예상하다, 추산","example":"工程预计下月完成，但还需要进行最终验收。","examplePinyin":"Gōngchéng yùjì xià yuè wánchéng, dàn hái xūyào jìnxíng zuìzhōng yànshōu.","translation":"공사는 다음 달 끝날 예정이지만 최종 검수를 거쳐야 해요."},{"no":1221,"category":"동작·감각·생각","word":"智慧","pinyin":"zhìhuì","meaning":"지혜, 지능","example":"处理复杂关系时，耐心有时比技巧更体现智慧。","examplePinyin":"Chǔlǐ fùzá guānxi shí, nàixīn yǒushí bǐ jìqiǎo gèng tǐxiàn zhìhuì.","translation":"복잡한 관계를 다룰 때 인내가 기술보다 지혜로울 때도 있어요."},{"no":1222,"category":"동작·감각·생각","word":"综合","pinyin":"zōnghé","meaning":"종합하다; 종합적이다","example":"综合各方意见之后，委员会提出了新的修改方案。","examplePinyin":"Zōnghé gèfāng yìjiàn zhīhòu, wěiyuánhuì tíchū le xīn de xiūgǎi fāng'àn.","translation":"위원회는 여러 의견을 종합한 뒤 새 수정안을 제시했어요."},{"no":1223,"category":"동작·감각·생각","word":"把握","pinyin":"bǎwò","meaning":"파악하다, 장악하다 / 잡다","example":"机会不会一直等你，关键是能否及时把握。","examplePinyin":"Jīhuì buhuì yìzhí děng nǐ, guānjiàn shì néngfǒu jíshí bǎwò.","translation":"기회는 계속 기다려 주지 않으니 제때 잡는 것이 중요해요."},{"no":1224,"category":"동작·감각·생각","word":"尝试","pinyin":"chángshì","meaning":"시도하다, 노력하다","example":"在没有成熟经验的情况下，团队决定大胆尝试。","examplePinyin":"Zài méiyǒu chéngshú jīngyàn de qíngkuàng xià, tuánduì juédìng dàdǎn chángshì.","translation":"참고할 경험이 부족한 상황에서 팀은 과감히 시도하기로 했어요."},{"no":1225,"category":"동작·감각·생각","word":"对象","pinyin":"duìxiàng","meaning":"대상, 목표","example":"研究对象不同，采用的方法也需要相应调整。","examplePinyin":"Yánjiū duìxiàng bùtóng, cǎiyòng de fāngfǎ yě xūyào xiāngyìng tiáozhěng.","translation":"연구 대상이 다르면 방법도 그에 맞게 조정해야 해요."},{"no":1226,"category":"동작·감각·생각","word":"方案","pinyin":"fāng'àn","meaning":"방안, 계획","example":"方案再完善，也需要根据实际情况灵活调整。","examplePinyin":"Fāng'àn zài wánshàn, yě xūyào gēnjù shíjì qíngkuàng línghuó tiáozhěng.","translation":"아무리 완벽한 방안도 실정에 맞게 유연하게 조정해야 해요."},{"no":1227,"category":"동작·감각·생각","word":"确定","pinyin":"quèdìng","meaning":"확정하다, 확인하다","example":"日期尚未确定，请不要提前购买无法退改的车票。","examplePinyin":"Rìqī shàngwèi quèdìng, qǐng búyào tíqián gòumǎi wúfǎ tuì gǎi de chēpiào.","translation":"날짜가 확정되지 않았으니 환불·변경이 불가능한 표를 미리 사지 마세요."},{"no":1228,"category":"동작·감각·생각","word":"手段","pinyin":"shǒuduàn","meaning":"수단","example":"技术只是手段，真正重要的是解决什么问题。","examplePinyin":"Jìshù zhǐshì shǒuduàn, zhēnzhèng zhòngyào de shì jiějué shénme wèntí.","translation":"기술은 수단일 뿐이며 중요한 것은 어떤 문제를 해결하는지예요."},{"no":1229,"category":"동작·감각·생각","word":"挑","pinyin":"tiāo","meaning":"고르다, 선택하다","example":"挑合作伙伴时，长期信誉比眼前报价更重要。","examplePinyin":"Tiāo hézuò huǒbàn shí, chángqī xìnyù bǐ yǎnqián bàojià gèng zhòngyào.","translation":"협력자를 고를 때는 당장의 제시 가격보다 오랜 신용이 중요해요."},{"no":1230,"category":"동작·감각·생각","word":"挑选","pinyin":"tiāoxuǎn","meaning":"선택하다, 뽑다","example":"挑选材料时，应同时考虑耐用性和回收难度。","examplePinyin":"Tiāoxuǎn cáiliào shí, yīng tóngshí kǎolǜ nàiyòngxìng hé huíshōu nándù.","translation":"재료를 고를 때는 내구성과 재활용의 어려움을 함께 고려해야 해요."},{"no":1231,"category":"동작·감각·생각","word":"用途","pinyin":"yòngtú","meaning":"용도, 쓰임","example":"同一种材料，根据用途不同，可以有不同加工方式。","examplePinyin":"Tóng yī zhǒng cáiliào, gēnjù yòngtú bùtóng, kěyǐ yǒu bùtóng jiāgōng fāngshì.","translation":"같은 소재도 용도에 따라 다르게 가공할 수 있어요."},{"no":1232,"category":"동작·감각·생각","word":"制订","pinyin":"zhìdìng","meaning":"(계획 등을) 입안하다, 수립하다","example":"制订年度计划之前，团队先评估了现有资源。","examplePinyin":"Zhìdìng niándù jìhuà zhīqián, tuánduì xiān pínggū le xiànyǒu zīyuán.","translation":"연간 계획을 세우기 전에 팀은 보유 자원부터 평가했어요."},{"no":1233,"category":"동작·감각·생각","word":"作出","pinyin":"zuòchū","meaning":"(결정·판단·반응 등을) 내리다, 하다","example":"作出决定之前，请确认已经了解主要风险。","examplePinyin":"Zuòchū juédìng zhīqián, qǐng quèrèn yǐjīng liǎojiě zhǔyào fēngxiǎn.","translation":"결정하기 전에 주요 위험을 이해했는지 확인하세요."},{"no":1234,"category":"동작·감각·생각","word":"承认","pinyin":"chéngrèn","meaning":"인정하다, 승인하다","example":"勇于承认错误，往往比为自己辩解更有力量。","examplePinyin":"Yǒngyú chéngrèn cuòwù, wǎngwǎng bǐ wèi zìjǐ biànjiě gèng yǒu lìliang.","translation":"잘못을 용기 있게 인정하는 것이 변명보다 더 힘이 있어요."},{"no":1235,"category":"동작·감각·생각","word":"承受","pinyin":"chéngshòu","meaning":"견디다, 참다 / 감수하다","example":"连续加班使他难以承受，最终提出调整工作量。","examplePinyin":"Liánxù jiābān shǐ tā nányǐ chéngshòu, zuìzhōng tíchū tiáozhěng gōngzuòliàng.","translation":"계속된 야근을 견디기 어려워 그는 업무량 조정을 요청했어요."},{"no":1236,"category":"동작·감각·생각","word":"等待","pinyin":"děngdài","meaning":"기다리다, 대기하다","example":"等待结果的同时，他开始为下一步行动做准备。","examplePinyin":"Děngdài jiéguǒ de tóngshí, tā kāishǐ wèi xià yí bù xíngdòng zuò zhǔnbèi.","translation":"결과를 기다리면서 그는 다음 행동을 준비하기 시작했어요."},{"no":1237,"category":"동작·감각·생각","word":"等候","pinyin":"děnghòu","meaning":"기다리다, 대기","example":"请在指定区域等候，以免影响其他旅客通行。","examplePinyin":"Qǐng zài zhǐdìng qūyù děnghòu, yǐmiǎn yǐngxiǎng qítā lǚkè tōngxíng.","translation":"다른 승객의 통행에 방해되지 않도록 지정 구역에서 기다리세요."},{"no":1238,"category":"동작·감각·생각","word":"奋斗","pinyin":"fèndòu","meaning":"분투하다, 노력하다","example":"奋斗不仅是为了改变生活，也是为了实现价值。","examplePinyin":"Fèndòu bùjǐn shì wèile gǎibiàn shēnghuó, yě shì wèile shíxiàn jiàzhí.","translation":"분투하는 것은 삶을 바꾸고 자신의 가치를 실현하기 위해서예요."},{"no":1239,"category":"동작·감각·생각","word":"否定","pinyin":"fǒudìng","meaning":"부정하다, 아니라고 하다","example":"不能因为一次失误，就否定他长期的努力。","examplePinyin":"Bùnéng yīnwèi yí cì shīwù, jiù fǒudìng tā chángqī de nǔlì.","translation":"한 번 실수했다고 그의 오랜 노력을 부정해서는 안 돼요."},{"no":1240,"category":"동작·감각·생각","word":"敢于","pinyin":"gǎnyú","meaning":"감히 ~하다, 용기 있다","example":"敢于质疑现有结论，是科学研究的重要精神。","examplePinyin":"Gǎnyú zhìyí xiànyǒu jiélùn, shì kēxué yánjiū de zhòngyào jīngshén.","translation":"기존 결론에 용기 있게 의문을 제기하는 것은 중요한 과학 정신이에요."},{"no":1241,"category":"동작·감각·생각","word":"尽力","pinyin":"jìnlì","meaning":"최선을 다하다, 힘쓰다","example":"即使成功的机会不大，他仍决定尽力一试。","examplePinyin":"Jíshǐ chénggōng de jīhuì búdà, tā réng juédìng jìnlì yí shì.","translation":"성공 가능성이 작아도 그는 최선을 다해 시도하기로 했어요."},{"no":1242,"category":"동작·감각·생각","word":"决心","pinyin":"juéxīn","meaning":"결심, 결단","example":"他下定决心改变工作方式，避免无意义的忙碌。","examplePinyin":"Tā xià dìng juéxīn gǎibiàn gōngzuò fāngshì, bìmiǎn wú yìyì de mánglù.","translation":"그는 무의미한 분주함을 피하려고 일하는 방식을 바꾸기로 결심했어요."},{"no":1243,"category":"동작·감각·생각","word":"克服","pinyin":"kèfú","meaning":"극복하다, 이겨내다","example":"他通过分阶段练习，逐渐克服了公开发言的恐惧。","examplePinyin":"Tā tōngguò fēn jiēduàn liànxí, zhújiàn kèfú le gōngkāi fāyán de kǒngjù.","translation":"그는 단계별 연습을 통해 사람들 앞에서 말하는 두려움을 차츰 극복했어요."},{"no":1244,"category":"동작·감각·생각","word":"全力","pinyin":"quánlì","meaning":"전력, 온 힘","example":"团队全力配合，终于按时完成了系统更新。","examplePinyin":"Tuánduì quánlì pèihé, zhōngyú ànshí wánchéng le xìtǒng gēngxīn.","translation":"팀은 온 힘을 다해 협력해 시스템 갱신을 제때 마쳤어요."},{"no":1245,"category":"동작·감각·생각","word":"忍","pinyin":"rěn","meaning":"참다, 견디다","example":"有些委屈不能总是忍，必要时应合理表达需求。","examplePinyin":"Yǒuxiē wěiqu bùnéng zǒngshì rěn, bìyào shí yīng hélǐ biǎodá xūqiú.","translation":"억울함을 늘 참기만 하지 말고 필요할 때 요구를 합리적으로 표현해야 해요."},{"no":1246,"category":"동작·감각·생각","word":"舍得","pinyin":"shěde","meaning":"아까워하지 않다, 아끼지 않다","example":"企业舍得在培训上投入，员工才更有机会成长。","examplePinyin":"Qǐyè shěde zài péixùn shàng tóurù, yuángōng cái gèng yǒu jīhuì chéngzhǎng.","translation":"기업이 교육 투자를 아끼지 않아야 직원들의 성장 기회가 늘어요."},{"no":1247,"category":"동작·감각·생각","word":"守","pinyin":"shǒu","meaning":"지키다, 수호하다","example":"大家轮流守在现场，直到维修人员完成作业。","examplePinyin":"Dàjiā lúnliú shǒu zài xiànchǎng, zhídào wéixiū rényuán wánchéng zuòyè.","translation":"모두 수리 작업이 끝날 때까지 번갈아 현장을 지켰어요."},{"no":1248,"category":"동작·감각·생각","word":"挑战","pinyin":"tiǎozhàn","meaning":"도전하다, 도전","example":"挑战已有方法，并不等于否定前人的全部努力。","examplePinyin":"Tiǎozhàn yǐyǒu fāngfǎ, bìngbù děngyú fǒudìng qiánrén de quánbù nǔlì.","translation":"기존 방식에 도전한다고 선배들의 모든 노력을 부정하는 것은 아니에요."},{"no":1249,"category":"동작·감각·생각","word":"勇气","pinyin":"yǒngqì","meaning":"용기, 담력","example":"承认自己不知道，有时也需要相当大的勇气。","examplePinyin":"Chéngrèn zìjǐ bù zhīdao, yǒushí yě xūyào xiāngdāng dà de yǒngqì.","translation":"자신이 모른다고 인정하는 데도 큰 용기가 필요할 때가 있어요."},{"no":1250,"category":"동작·감각·생각","word":"原则","pinyin":"yuánzé","meaning":"원칙","example":"处理特殊情况时，也不能放弃最基本的原则。","examplePinyin":"Chǔlǐ tèshū qíngkuàng shí, yě bùnéng fàngqì zuì jīběn de yuánzé.","translation":"특수 상황을 처리할 때도 가장 기본적인 원칙은 지켜야 해요."},{"no":1251,"category":"동작·감각·생각","word":"赞成","pinyin":"zànchéng","meaning":"찬성하다, 지지하다","example":"即使不完全赞成，也可以先尝试理解对方的理由。","examplePinyin":"Jíshǐ bù wánquán zànchéng, yě kěyǐ xiān chángshì lǐjiě duìfāng de lǐyóu.","translation":"완전히 찬성하지 않더라도 상대의 이유부터 이해해 볼 수 있어요."},{"no":1252,"category":"동작·감각·생각","word":"争取","pinyin":"zhēngqǔ","meaning":"쟁취하다, 얻다","example":"他主动争取参与机会，希望在实践中提高能力。","examplePinyin":"Tā zhǔdòng zhēngqǔ cānyù jīhuì, xīwàng zài shíjiàn zhōng tígāo nénglì.","translation":"그는 실무 능력을 높이려고 적극적으로 참여 기회를 얻으려 했어요."},{"no":1253,"category":"동작·감각·생각","word":"专心","pinyin":"zhuānxīn","meaning":"집중하다, 전념하다","example":"专心完成一件事，有时比不断切换任务更有效。","examplePinyin":"Zhuānxīn wánchéng yí jiàn shì, yǒushí bǐ búduàn qiēhuàn rènwu gèng yǒuxiào.","translation":"한 가지 일에 집중하는 것이 계속 일을 바꾸는 것보다 효과적일 때도 있어요."},{"no":1254,"category":"동작·감각·생각","word":"追求","pinyin":"zhuīqiú","meaning":"추구하다, 추구","example":"追求效率不能忽略公平，两者需要共同考虑。","examplePinyin":"Zhuīqiú xiàolǜ bùnéng hūlüè gōngpíng, liǎngzhě xūyào gòngtóng kǎolǜ.","translation":"효율을 추구하면서 공정성을 놓쳐서는 안 되며 둘 다 고려해야 해요."},{"no":1255,"category":"동작·감각·생각","word":"注重","pinyin":"zhùzhòng","meaning":"신경 쓰다, 중시하다","example":"评价设计时，他更注重实际体验，而不只是视觉效果。","examplePinyin":"Píngjià shèjì shí, tā gèng zhùzhòng shíjì tǐyàn, ér bù zhǐshì shìjué xiàoguǒ.","translation":"그는 디자인을 평가할 때 시각 효과뿐 아니라 실제 경험을 더 중시해요."},{"no":1256,"category":"동작·감각·생각","word":"自觉","pinyin":"zìjué","meaning":"자각하다; 자발적으로, 스스로","example":"公共空间需要大家自觉维护，而不是只靠监督。","examplePinyin":"Gōnggòng kōngjiān xūyào dàjiā zìjué wéihù, ér búshì zhǐ kào jiāndū.","translation":"공공 공간은 감시뿐 아니라 모두의 자발적인 관리가 필요해요."},{"no":1257,"category":"동작·감각·생각","word":"尊敬","pinyin":"zūnjìng","meaning":"존경하다, 공경하다","example":"尊敬经验丰富的前辈，也不妨提出有依据的不同看法。","examplePinyin":"Zūnjìng jīngyàn fēngfù de qiánbèi, yě bùfáng tíchū yǒu yījù de bùtóng kànfǎ.","translation":"경험 많은 선배를 존경하면서도 근거 있는 다른 의견을 낼 수 있어요."},{"no":1258,"category":"동작·감각·생각","word":"安慰","pinyin":"ānwèi","meaning":"위로하다, 위안","example":"面对失败，与其责备他，不如给他一些安慰。","examplePinyin":"Miànduì shībài, yǔqí zébèi tā, bùrú gěi tā yìxiē ānwèi.","translation":"실패한 그를 탓하기보다 위로해 주는 편이 나아요."},{"no":1259,"category":"동작·감각·생각","word":"抱怨","pinyin":"bàoyuàn","meaning":"불평하다, 원망하다","example":"与其抱怨条件不够好，不如先解决眼前的问题。","examplePinyin":"Yǔqí bàoyuàn tiáojiàn búgòu hǎo, bùrú xiān jiějué yǎnqián de wèntí.","translation":"여건이 나쁘다고 불평하기보다 당면한 문제부터 해결해요."},{"no":1260,"category":"동작·감각·생각","word":"表情","pinyin":"biǎoqíng","meaning":"표정, 얼굴 표정","example":"从她惊讶的表情看，她事先并不知道这个消息。","examplePinyin":"Cóng tā jīngyà de biǎoqíng kàn, tā shìxiān bìngbù zhīdao zhè ge xiāoxi.","translation":"놀란 표정을 보니 그녀는 이 소식을 미리 몰랐던 것 같아요."},{"no":1261,"category":"동작·감각·생각","word":"不幸","pinyin":"búxìng","meaning":"불행하다,불행","example":"他在事故中不幸受伤，却始终没有放弃康复训练。","examplePinyin":"Tā zài shìgù zhōng búxìng shòushāng, què shǐzhōng méiyǒu fàngqì kāngfù xùnliàn.","translation":"그는 사고로 불행히 다쳤지만 재활 훈련을 포기하지 않았어요."},{"no":1262,"category":"동작·감각·생각","word":"反应","pinyin":"fǎnyìng","meaning":"반응, 응답","example":"面对突然的变化，每个人的反应可能不同。","examplePinyin":"Miànduì tūrán de biànhuà, měi ge rén de fǎnyìng kěnéng bùtóng.","translation":"갑작스러운 변화에 대한 반응은 사람마다 다를 수 있어요."},{"no":1263,"category":"동작·감각·생각","word":"疯狂","pinyin":"fēngkuáng","meaning":"미치다, 열광하다","example":"面对疯狂上涨的价格，消费者应保持理性。","examplePinyin":"Miànduì fēngkuáng shàngzhǎng de jiàgé, xiāofèizhě yīng bǎochí lǐxìng.","translation":"가격이 걷잡을 수 없이 오를수록 소비자는 이성을 유지해야 해요."},{"no":1264,"category":"동작·감각·생각","word":"好奇","pinyin":"hàoqí","meaning":"호기심, 궁금함","example":"对陌生事物保持好奇，是持续学习的重要动力。","examplePinyin":"Duì mòshēng shìwù bǎochí hàoqí, shì chíxù xuéxí de zhòngyào dònglì.","translation":"낯선 것에 호기심을 갖는 것은 계속 배우게 하는 중요한 동력이에요."},{"no":1265,"category":"동작·감각·생각","word":"好运","pinyin":"hǎoyùn","meaning":"행운, 복 / 좋은 운","example":"他把成功归于好运，却忘了自己多年的准备。","examplePinyin":"Tā bǎ chénggōng guīyú hǎoyùn, què wàng le zìjǐ duōnián de zhǔnbèi.","translation":"그는 성공을 행운 덕분이라 했지만 오랜 준비가 있었음을 잊었어요."},{"no":1266,"category":"동작·감각·생각","word":"惊喜","pinyin":"jīngxǐ","meaning":"뜻밖의 기쁨; 놀라면서 기뻐하다","example":"这次意外的重逢，给旅途增添了一份惊喜。","examplePinyin":"Zhè cì yìwài de chóngféng, gěi lǚtú zēngtiān le yí fèn jīngxǐ.","translation":"뜻밖의 재회가 여행에 기분 좋은 놀라움을 더했어요."},{"no":1267,"category":"동작·감각·생각","word":"泪","pinyin":"lèi","meaning":"눈물, 눈물방울","example":"听到久违的乡音，她的眼里不禁含着泪。","examplePinyin":"Tīngdào jiǔwéi de xiāngyīn, tā de yǎnlǐ bùjīn hán zhe lèi.","translation":"오랜만에 고향 말을 듣자 그녀의 눈에 저절로 눈물이 고였어요."},{"no":1268,"category":"동작·감각·생각","word":"泪水","pinyin":"lèishuǐ","meaning":"눈물","example":"看到多年努力终于得到认可，他流下了泪水。","examplePinyin":"Kàndào duōnián nǔlì zhōngyú dédào rènkě, tā liúxià le lèishuǐ.","translation":"오랜 노력이 마침내 인정받는 것을 보고 그는 눈물을 흘렸어요."},{"no":1269,"category":"동작·감각·생각","word":"乐趣","pinyin":"lèqù","meaning":"즐거움, 재미","example":"当学习不再只是为了考试，就更容易发现乐趣。","examplePinyin":"Dāng xuéxí búzài zhǐshì wèile kǎoshì, jiù gèng róngyì fāxiàn lèqù.","translation":"배움이 시험만을 위한 것이 아니게 되면 즐거움을 발견하기 쉬워요."},{"no":1270,"category":"동작·감각·생각","word":"迷","pinyin":"mí","meaning":"빠지다, 미혹되다; 애호가, 팬","example":"他从小就是戏剧迷，几乎看遍了本地剧团的演出。","examplePinyin":"Tā cóngxiǎo jiùshì xìjù mí, jīhū kàn biàn le běndì jùtuán de yǎnchū.","translation":"그는 어릴 때부터 연극 애호가라 현지 극단의 공연을 거의 다 봤어요."},{"no":1271,"category":"동작·감각·생각","word":"期待","pinyin":"qīdài","meaning":"기대하다, 고대하다","example":"大家期待的不只是新设备，还有真正有效的服务。","examplePinyin":"Dàjiā qīdài de bù zhǐshì xīn shèbèi, háiyǒu zhēnzhèng yǒuxiào de fúwù.","translation":"사람들이 기대하는 것은 새 장비만이 아니라 실효성 있는 서비스예요."},{"no":1272,"category":"동작·감각·생각","word":"奇迹","pinyin":"qíjì","meaning":"기적, 기이한 일","example":"所谓奇迹的背后，往往是多年的努力和坚持。","examplePinyin":"Suǒwèi qíjì de bèihòu, wǎngwǎng shì duōnián de nǔlì hé jiānchí.","translation":"이른바 기적 뒤에는 오랜 노력과 꾸준함이 있는 경우가 많아요."},{"no":1273,"category":"동작·감각·생각","word":"情感","pinyin":"qínggǎn","meaning":"감정, 정서","example":"文学作品能够帮助读者理解不同人的情感经验。","examplePinyin":"Wénxué zuòpǐn nénggòu bāngzhù dúzhě lǐjiě bùtóng rén de qínggǎn jīngyàn.","translation":"문학 작품은 독자가 다른 사람의 정서적 경험을 이해하도록 도와요."},{"no":1274,"category":"동작·감각·생각","word":"情绪","pinyin":"qíngxù","meaning":"감정, 기분","example":"情绪激动的时候，最好先停一下再作出回应。","examplePinyin":"Qíngxù jīdòng de shíhou, zuìhǎo xiān tíng yíxià zài zuòchū huíyìng.","translation":"감정이 격해졌을 때는 잠시 멈췄다가 대답하는 편이 좋아요."},{"no":1275,"category":"동작·감각·생각","word":"热爱","pinyin":"rè'ài","meaning":"뜨겁게 사랑하다, 열정적으로 좋아하다","example":"他热爱摄影，却始终不愿为了画面打扰他人。","examplePinyin":"Tā rè'ài shèyǐng, què shǐzhōng bú yuàn wèile huàmiàn dǎrǎo tārén.","translation":"그는 사진을 열정적으로 좋아하지만 장면을 위해 남을 방해하지 않아요."},{"no":1276,"category":"동작·감각·생각","word":"热烈","pinyin":"rèliè","meaning":"열렬하다, 뜨겁다","example":"讨论气氛十分热烈，大家从不同角度提出建议。","examplePinyin":"Tǎolùn qìfēn shífēn rèliè, dàjiā cóng bùtóng jiǎodù tíchū jiànyì.","translation":"토론 분위기가 매우 뜨거웠고 모두 다른 관점에서 의견을 냈어요."},{"no":1277,"category":"동작·감각·생각","word":"舍不得","pinyin":"shěbude","meaning":"아까워하다; 차마 ~하지 못하다","example":"这些旧书陪伴他多年，他一直舍不得送走。","examplePinyin":"Zhèxiē jiùshū péibàn tā duōnián, tā yìzhí shěbude sòngzǒu.","translation":"이 헌책들은 오랫동안 함께해 온 것들이라 그는 차마 보내지 못해요."},{"no":1278,"category":"동작·감각·생각","word":"酸甜苦辣","pinyin":"suān-tián-kǔ-là","meaning":"신맛·단맛·쓴맛·매운맛; 인생의 고락","example":"多年打拼的酸甜苦辣，都被他写进了回忆录。","examplePinyin":"Duōnián dǎpīn de suāntiánkǔlà, dōu bèi tā xiě jìn le huíyìlù.","translation":"여러 해 분투하며 겪은 인생의 고락을 그는 회고록에 담았어요."},{"no":1279,"category":"동작·감각·생각","word":"痛苦","pinyin":"tòngkǔ","meaning":"고통, 아픔","example":"理解他人的痛苦，不一定意味着能够立刻给出答案。","examplePinyin":"Lǐjiě tārén de tòngkǔ, bùyídìng yìwèizhe nénggòu lìkè gěichū dá'àn.","translation":"남의 고통을 이해한다고 바로 답을 줄 수 있는 것은 아니에요."},{"no":1280,"category":"동작·감각·생각","word":"同情","pinyin":"tóngqíng","meaning":"동정, 연민","example":"除了表达同情，更重要的是提供合适的实际帮助。","examplePinyin":"Chúle biǎodá tóngqíng, gèng zhòngyào de shì tígōng héshì de shíjì bāngzhù.","translation":"동정을 표현하는 것보다 적절한 실질적 도움을 주는 것이 중요해요."},{"no":1281,"category":"동작·감각·생각","word":"微笑","pinyin":"wēixiào","meaning":"미소, 웃음","example":"一个耐心的微笑，有时能缓解初来者的紧张。","examplePinyin":"Yí ge nàixīn de wēixiào, yǒushí néng huǎnjiě chūláizhě de jǐnzhāng.","translation":"느긋한 미소 하나가 처음 온 사람의 긴장을 풀어 주기도 해요."},{"no":1282,"category":"동작·감각·생각","word":"无奈","pinyin":"wúnài","meaning":"어쩔 도리가 없다, 부득이하다","example":"计划因天气取消，他虽然无奈，却理解安全的重要。","examplePinyin":"Jìhuà yīn tiānqì qǔxiāo, tā suīrán wúnài, què lǐjiě ānquán de zhòngyào.","translation":"날씨로 계획이 취소되어 아쉬웠지만 그는 안전의 중요성을 이해했어요."},{"no":1283,"category":"동작·감각·생각","word":"享受","pinyin":"xiǎngshòu","meaning":"즐기다, 향유하다","example":"享受便利的同时，也应考虑维护这些服务的成本。","examplePinyin":"Xiǎngshòu biànlì de tóngshí, yě yīng kǎolǜ wéihù zhèxiē fúwù de chéngběn.","translation":"편의를 누리는 동시에 서비스 유지에 드는 비용도 고려해야 해요."},{"no":1284,"category":"동작·감각·생각","word":"幸运","pinyin":"xìngyùn","meaning":"행운, 운이 좋다","example":"他觉得自己很幸运，遇到了愿意耐心指导的老师。","examplePinyin":"Tā juéde zìjǐ hěn xìngyùn, yùdào le yuànyì nàixīn zhǐdǎo de lǎoshī.","translation":"그는 기꺼이 차분히 지도해 주는 선생님을 만나 운이 좋다고 생각해요."},{"no":1285,"category":"동작·감각·생각","word":"心理","pinyin":"xīnlǐ","meaning":"심리, 정신","example":"理解孩子的心理，需要先听懂他们真正担心什么。","examplePinyin":"Lǐjiě háizi de xīnlǐ, xūyào xiān tīngdǒng tāmen zhēnzhèng dānxīn shénme.","translation":"아이의 심리를 이해하려면 무엇을 실제로 걱정하는지 먼저 들어야 해요."},{"no":1286,"category":"동작·감각·생각","word":"心态","pinyin":"xīntài","meaning":"마음가짐, 심리 상태","example":"保持开放心态，才更容易接受与自己不同的经验。","examplePinyin":"Bǎochí kāifàng xīntài, cái gèng róngyì jiēshòu yǔ zìjǐ bùtóng de jīngyàn.","translation":"열린 마음을 유지해야 자신과 다른 경험도 받아들이기 쉬워요."},{"no":1287,"category":"동작·감각·생각","word":"眼泪","pinyin":"yǎnlèi","meaning":"눈물","example":"多年等待终于有了结果，她忍不住流下眼泪。","examplePinyin":"Duōnián děngdài zhōngyú yǒu le jiéguǒ, tā rěnbúzhù liúxià yǎnlèi.","translation":"오랜 기다림에 마침내 결과가 나오자 그녀는 눈물을 참지 못했어요."},{"no":1288,"category":"동작·감각·생각","word":"遗憾","pinyin":"yíhàn","meaning":"유감, 아쉽다","example":"虽然结果有些遗憾，但这次尝试仍有重要价值。","examplePinyin":"Suīrán jiéguǒ yǒuxiē yíhàn, dàn zhè cì chángshì réng yǒu zhòngyào jiàzhí.","translation":"결과는 조금 아쉽지만 이번 시도에는 여전히 중요한 가치가 있어요."},{"no":1289,"category":"동작·감각·생각","word":"犹豫","pinyin":"yóuyù","meaning":"주저하다, 망설이다","example":"他犹豫了很久，最终决定接受新的工作挑战。","examplePinyin":"Tā yóuyù le hěn jiǔ, zuìzhōng juédìng jiēshòu xīn de gōngzuò tiǎozhàn.","translation":"그는 오래 망설인 끝에 새로운 업무 도전을 받아들이기로 했어요."},{"no":1290,"category":"동작·감각·생각","word":"愿","pinyin":"yuàn","meaning":"바라다, 원하다","example":"他愿把多年积累的经验，毫无保留地教给新人。","examplePinyin":"Tā yuàn bǎ duōnián jīlěi de jīngyàn, háowú bǎoliú de jiāogěi xīnrén.","translation":"그는 오랫동안 쌓은 경험을 신입에게 아낌없이 전하려 해요."},{"no":1291,"category":"동작·감각·생각","word":"愿望","pinyin":"yuànwàng","meaning":"소원, 바람","example":"愿望只有变成具体计划，才更容易逐步实现。","examplePinyin":"Yuànwàng zhǐyǒu biànchéng jùtǐ jìhuà, cái gèng róngyì zhúbù shíxiàn.","translation":"바람은 구체적인 계획으로 만들어야 차츰 이루기 쉬워요."},{"no":1292,"category":"동작·감각·생각","word":"运气","pinyin":"yùnqi","meaning":"운, 행운","example":"不能把成功全归于运气，也不能忽视外部条件。","examplePinyin":"Bùnéng bǎ chénggōng quán guīyú yùnqi, yě bùnéng hūshì wàibù tiáojiàn.","translation":"성공을 모두 운 덕으로 돌려서도, 외부 여건을 무시해서도 안 돼요."},{"no":1293,"category":"동작·감각·생각","word":"在乎","pinyin":"zàihu","meaning":"신경 쓰다, 중요시하다","example":"他在乎的不只是结果，更是合作中是否彼此尊重。","examplePinyin":"Tā zàihu de bù zhǐshì jiéguǒ, gèngshì hézuò zhōng shìfǒu bǐcǐ zūnzhòng.","translation":"그가 중요하게 여기는 것은 결과뿐 아니라 협력 중의 상호 존중이에요."},{"no":1294,"category":"동작·감각·생각","word":"珍惜","pinyin":"zhēnxī","meaning":"소중히 여기다, 아끼다","example":"经历短缺以后，大家更加珍惜来之不易的资源。","examplePinyin":"Jīnglì duǎnquē yǐhòu, dàjiā gèngjiā zhēnxī lái zhī búyì de zīyuán.","translation":"부족함을 겪은 뒤 모두가 힘들게 얻은 자원을 더 소중히 여겼어요."},{"no":1295,"category":"성질·상태·문법","word":"暗","pinyin":"àn","meaning":"어둡다, 은밀하다, 암-","example":"天色渐渐暗下来，登山队决定原地休息。","examplePinyin":"Tiānsè jiànjiàn àn xiàlai, dēngshānduì juédìng yuándì xiūxi.","translation":"날이 점점 어두워져 등산대는 그 자리에서 쉬기로 했어요."},{"no":1296,"category":"성질·상태·문법","word":"薄","pinyin":"báo","meaning":"얇다, 엷다 / 적다, 박하다","example":"这件外套虽然薄，却足以应付初秋的凉意。","examplePinyin":"Zhè jiàn wàitào suīrán báo, què zúyǐ yìngfu chūqiū de liángyì.","translation":"이 외투는 얇지만 초가을의 서늘함을 막기에는 충분해요."},{"no":1297,"category":"성질·상태·문법","word":"表面","pinyin":"biǎomiàn","meaning":"표면, 겉","example":"两种方案表面相似，实际成本却相差很大。","examplePinyin":"Liǎng zhǒng fāng'àn biǎomiàn xiāngsì, shíjì chéngběn què xiāngchà hěn dà.","translation":"두 방안은 겉보기에 비슷하지만 실제 비용은 크게 달라요."},{"no":1298,"category":"성질·상태·문법","word":"不良","pinyin":"bùliáng","meaning":"나쁘다, 불량하다","example":"企业不能为了短期利益，忽视产品的不良影响。","examplePinyin":"Qǐyè bùnéng wèile duǎnqī lìyì, hūshì chǎnpǐn de bùliáng yǐngxiǎng.","translation":"기업은 단기 이익을 위해 제품의 악영향을 무시해서는 안 돼요."},{"no":1299,"category":"성질·상태·문법","word":"不足","pinyin":"bùzú","meaning":"부족하다, 충분하지 않다","example":"由于经验不足，他在预算上作出了错误判断。","examplePinyin":"Yóuyú jīngyàn bùzú, tā zài yùsuàn shàng zuòchū le cuòwù pànduàn.","translation":"경험이 부족해 그는 예산을 잘못 판단했어요."},{"no":1300,"category":"성질·상태·문법","word":"彩色","pinyin":"cǎisè","meaning":"컬러, 천연색; 유색의","example":"彩色图表能帮助读者更直观地理解数据。","examplePinyin":"Cǎisè túbiǎo néng bāngzhù dúzhě gèng zhíguān de lǐjiě shùjù.","translation":"컬러 도표는 독자가 자료를 더 직관적으로 이해하도록 도와요."},{"no":1301,"category":"성질·상태·문법","word":"差别","pinyin":"chābié","meaning":"차이, 다름","example":"收入的差别，不能成为判断个人价值的标准。","examplePinyin":"Shōurù de chābié, bùnéng chéngwéi pànduàn gèrén jiàzhí de biāozhǔn.","translation":"소득의 차이가 개인의 가치를 판단하는 기준이 되어서는 안 돼요."},{"no":1302,"category":"성질·상태·문법","word":"差距","pinyin":"chājù","meaning":"차이, 격차","example":"缩小城乡教育差距，需要长期稳定的投入。","examplePinyin":"Suōxiǎo chéngxiāng jiàoyù chājù, xūyào chángqī wěndìng de tóurù.","translation":"도시와 농촌의 교육 격차를 줄이려면 꾸준한 투자가 필요해요."},{"no":1303,"category":"성질·상태·문법","word":"充满","pinyin":"chōngmǎn","meaning":"가득 차다, 충만하다","example":"这份面向未来的规划，充满了想象力与勇气。","examplePinyin":"Zhè fèn miànxiàng wèilái de guīhuà, chōngmǎn le xiǎngxiànglì yǔ yǒngqì.","translation":"미래를 향한 이 계획에는 상상력과 용기가 가득해요."},{"no":1304,"category":"성질·상태·문법","word":"臭","pinyin":"chòu","meaning":"악취가 나다, 냄새가 고약하다","example":"垃圾长期堆放在这里，已经散发出一股臭味。","examplePinyin":"Lājī chángqī duīfàng zài zhèlǐ, yǐjīng sànfāchū yì gǔ chòuwèi.","translation":"쓰레기를 여기에 오래 쌓아 둬 악취가 나고 있어요."},{"no":1305,"category":"성질·상태·문법","word":"丑","pinyin":"chǒu","meaning":"못생기다, 추하다","example":"外表的美丑，不应决定一个人是否值得尊重。","examplePinyin":"Wàibiǎo de měichǒu, bù yīng juédìng yí ge rén shìfǒu zhíde zūnzhòng.","translation":"외모의 아름다움과 추함으로 존중받을 가치를 정해서는 안 돼요."},{"no":1306,"category":"성질·상태·문법","word":"处于","pinyin":"chǔyú","meaning":"처하다, 놓여 있다","example":"这项技术仍处于试验阶段，尚未大规模使用。","examplePinyin":"Zhè xiàng jìshù réng chǔyú shìyàn jiēduàn, shàngwèi dàguīmó shǐyòng.","translation":"이 기술은 아직 시험 단계여서 대규모로 사용되지는 않았어요."},{"no":1307,"category":"성질·상태·문법","word":"存在","pinyin":"cúnzài","meaning":"존재하다, 있음","example":"承认问题存在，是寻找解决办法的第一步。","examplePinyin":"Chéngrèn wèntí cúnzài, shì xúnzhǎo jiějué bànfǎ de dìyībù.","translation":"문제가 존재함을 인정하는 것이 해결 방법을 찾는 첫걸음이에요."},{"no":1308,"category":"성질·상태·문법","word":"单","pinyin":"dān","meaning":"하나의, 단일한; 단독으로; 오직, 단지","example":"单靠个人热情，很难让一个项目长期运转。","examplePinyin":"Dān kào gèrén rèqíng, hěn nán ràng yí ge xiàngmù chángqī yùnzhuǎn.","translation":"개인의 열정에만 의지해서는 사업을 오래 운영하기 어려워요."},{"no":1309,"category":"성질·상태·문법","word":"单一","pinyin":"dānyī","meaning":"단일하다, 한 가지뿐이다","example":"评价标准过于单一，可能埋没不同类型的人才。","examplePinyin":"Píngjià biāozhǔn guòyú dānyī, kěnéng máimò bùtóng lèixíng de réncái.","translation":"평가 기준이 너무 단일하면 다양한 인재를 놓칠 수 있어요."},{"no":1310,"category":"성질·상태·문법","word":"大型","pinyin":"dàxíng","meaning":"대형, 큰 규모","example":"举行大型活动之前，必须制定详细的疏散方案。","examplePinyin":"Jǔxíng dàxíng huódòng zhīqián, bìxū zhìdìng xiángxì de shūsàn fāng'àn.","translation":"대규모 행사를 열기 전에 상세한 대피 계획을 세워야 해요."},{"no":1311,"category":"성질·상태·문법","word":"独特","pinyin":"dútè","meaning":"독특하다, 특별하다","example":"这座城市独特的魅力，来自新旧文化的交融。","examplePinyin":"Zhè zuò chéngshì dútè de mèilì, láizì xīnjiù wénhuà de jiāoróng.","translation":"이 도시의 독특한 매력은 옛 문화와 새 문화의 어우러짐에서 나와요."},{"no":1312,"category":"성질·상태·문법","word":"反","pinyin":"fǎn","meaning":"반대, 뒤집다 / 돌아오다","example":"他把文件的正反两面都检查了一遍。","examplePinyin":"Tā bǎ wénjiàn de zhèngfǎn liǎngmiàn dōu jiǎnchá le yí biàn.","translation":"그는 문서의 앞뒷면을 모두 한 번씩 확인했어요."},{"no":1313,"category":"성질·상태·문법","word":"丰富多彩","pinyin":"fēngfù-duōcǎi","meaning":"다채롭다, 다양하다","example":"校园活动丰富多彩，让学生有机会发现不同兴趣。","examplePinyin":"Xiàoyuán huódòng fēngfùduōcǎi, ràng xuésheng yǒu jīhuì fāxiàn bùtóng xìngqù.","translation":"교내 활동이 다채로워 학생들이 다양한 흥미를 발견할 수 있어요."},{"no":1314,"category":"성질·상태·문법","word":"高大","pinyin":"gāodà","meaning":"키가 크다, 높다","example":"村口那棵高大的树，见证了几代人的成长。","examplePinyin":"Cūnkǒu nà kē gāodà de shù, jiànzhèng le jǐ dài rén de chéngzhǎng.","translation":"마을 입구의 큰 나무는 여러 세대의 성장을 지켜봤어요."},{"no":1315,"category":"성질·상태·문법","word":"构成","pinyin":"gòuchéng","meaning":"구성하다, 이루다","example":"多个独立的小问题，可能共同构成系统性风险。","examplePinyin":"Duōge dúlì de xiǎo wèntí, kěnéng gòngtóng gòuchéng xìtǒngxìng fēngxiǎn.","translation":"별개의 작은 문제들이 모여 시스템 전반의 위험을 일으킬 수 있어요."},{"no":1316,"category":"성질·상태·문법","word":"怪","pinyin":"guài","meaning":"괴상하다, 이상하다","example":"刚搬来时觉得这些风俗很怪，后来才理解其中意义。","examplePinyin":"Gāng bān láishí juéde zhèxiē fēngsú hěn guài, hòulái cái lǐjiě qízhōng yìyì.","translation":"처음엔 이 풍속들이 이상했지만 나중에야 그 의미를 이해했어요."},{"no":1317,"category":"성질·상태·문법","word":"光明","pinyin":"guāngmíng","meaning":"밝다, 광명하다","example":"只要愿意改变，眼前的困难也能通向光明的未来。","examplePinyin":"Zhǐyào yuànyì gǎibiàn, yǎnqián de kùnnan yě néng tōngxiàng guāngmíng de wèilái.","translation":"변하려는 마음이 있다면 지금의 어려움도 밝은 미래로 이어질 수 있어요."},{"no":1318,"category":"성질·상태·문법","word":"固定","pinyin":"gùdìng","meaning":"고정하다, 정하다","example":"远程办公使一些岗位不再受固定地点的限制。","examplePinyin":"Yuǎnchéng bàngōng shǐ yìxiē gǎngwèi búzài shòu gùdìng dìdiǎn de xiànzhì.","translation":"원격 근무로 일부 직무는 더 이상 정해진 장소에 묶이지 않아요."},{"no":1319,"category":"성질·상태·문법
